# yamllint config: relaxed to match this repo's actual YAML style rather than
# yamllint's own defaults. See flows/lint/yamllint.mk for how this is invoked.
extends: default

ignore: |
  vendor/
  nonfree/
  .venv/
  **/build/
  **/build_ot/
  **/build_ot_pio/
  # Generated by the issue-curation compile step, not hand-authored.
  *.lock.yml
  # Bender's own YAML dialect, not general-purpose config.
  Bender.yml
  # Cross-file YAML anchors/aliases (this test-list format merges anchors
  # declared in a sibling file), which yamllint can't resolve per-file.
  hw/ip/i3ccore_wrap/dv/tb/yaml/
  # Submodule: another repo's YAML, fixable only by a PR there.
  hw/sys/sep/bootrom/prod/tools/tt-oca-manifest/
  virtual_platform/tt-oca-harness-model/
  # Third-party sources and prefixes the VP build fetches and installs into.
  virtual_platform/downloads/
  virtual_platform/local/
  virtual_platform/local-ctr/

rules:
  # Disabled like Ruff's E501: several long lines here are single tokens
  # (URLs, GitHub Actions expressions) that wrapping would only make worse.
  line-length: disable
  # Every antora.yml's `nav:` list is a top-level (unindented) sequence item,
  # a deliberate, consistent Antora convention repeated across every book.
  indentation:
    indent-sequences: whatever
  # GitHub Actions workflows in this repo use the compact mapping style
  # `{ name: foo, path: bar }` throughout for single-line step inputs.
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  document-start: disable
  truthy: disable
