# SPDX-License-Identifier: Apache-2.0

# Slim local manifest for the vendored Tenstorrent DFD IP. Carries only the subset
# of tt_hw_debug reachable from dfd_top_cla_dst_apb (CLA + DST + trace sink, APB
# MMRs) that smc_dfd_wrap instantiates; the other generated tops, N-Trace and DV
# are not vendored. Source order follows upstream tt_dfd.f. axi/ and common_cells/
# are deliberately absent - OCAH vendors them under vendor/pulp-platform/ and
# Bender.local forces both there.
#
# Never edit upstream/ directly: it must stay reproducible from the upstream rev
# plus patches/ applied in order. Re-check that round-trip before committing a new
# patch. Whole-file replacements go in overlay/ rather than patches/, because
# `bender vendor init` only recreates upstream/ and so leaves overlay/ alone on a
# version bump.
#
# Two upstream file groups are shadowed or dropped in `sources` below:
#   - overlay/prim_shim/ replaces upstream's behavioural generic_clkgate and
#     generic_clkmux2, keeping the module names but calling the OCH prims, so the
#     DFD inherits the ocah_prim_generic `not(synth)` tech swap instead of
#     synthesising a behavioural clock gate.
#   - trace_mem, trace_mem_sink and generic_mem_model are not compiled:
#     EXTERNAL_SINK_MEM = 1 never takes that branch and they duplicate the OCH SRAM.
#
# TODO: add the matching `vendor_package` entry to the root Bender.yml once the
# tt_hw_debug GitLab remote is reachable from CI, then re-run `bender vendor init`.

package:
  name: tt_dfd
  authors:
    - "Tenstorrent USA, Inc."

dependencies:
  axi: { version: 0.39.8, git: "https://github.com/pulp-platform/axi.git" }

export_include_dirs:
  - upstream/dependencies/common
  - upstream/rtl
  - upstream/rtl/cla
  - upstream/rtl/mmr
  - upstream/rtl/trace

sources:
  # Gated on smc like the pre-vendoring hw/ip/dfd/rtl blocks. SMU references
  # tn_pkg/trace_mem_pkg/cla_pkg types but always enables smc too; SEP enables
  # neither and must not pull this IP in.
  - target: smc
    files:
    # Std cells: overlay shims, not upstream. See header.
    - overlay/prim_shim/generic_clkgate.sv
    - overlay/prim_shim/generic_clkmux2.sv
    - upstream/dependencies/common/generic_ipx_clk_rst_ctrl.sv
    - upstream/dependencies/common/generic_ccg.sv
    - upstream/dependencies/common/generic_dff.sv
    - upstream/dependencies/common/generic_axilitetommr.sv
    - upstream/dependencies/common/generic_dff_clr.sv
    - upstream/dependencies/common/generic_dff_staging.sv
    - upstream/dependencies/common/generic_ffs_fast.sv
    - upstream/dependencies/common/generic_ffs_N.sv
    - upstream/dependencies/common/generic_fifoMN.sv
    - upstream/dependencies/common/generic_decoded_mux.sv
    - upstream/dependencies/common/generic_vidtopid.sv
    - upstream/rtl/mmr/cla_mmr_pkg.svh
    - upstream/rtl/mmr/dst_mmr_pkg.svh
    - upstream/rtl/mmr/dst_sink_mmr_pkg.svh
    - upstream/rtl/mmr/funnel_mmr_pkg.svh
    - upstream/rtl/mmr/ntr_mmr_pkg.svh
    - upstream/rtl/mmr/ntr_sink_mmr_pkg.svh
    - upstream/rtl/mmr/cla_mmr.sv
    - upstream/rtl/mmr/dst_mmr.sv
    - upstream/rtl/mmr/dst_sink_mmr.sv
    - upstream/rtl/mmr/funnel_mmr.sv
    - upstream/rtl/mmr/ntr_mmr.sv
    - upstream/rtl/mmr/ntr_sink_mmr.sv
    - upstream/rtl/cla/dst_pkg.svh
    - upstream/rtl/cla/cla_pkg.svh
    - upstream/rtl/cla/tt_dbm_pkg.svh
    - upstream/rtl/cla/cla_action_gen.sv
