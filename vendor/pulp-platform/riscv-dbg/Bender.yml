# Sources are vendored from the tenstorrent/tt-riscv-dbg fork of pulp-platform/riscv-dbg into
# upstream/ via the `vendor_package` entry in the root Bender.yml (bender vendor init). No TT
# patch is carried.
#
# This is a slimmed manifest pruned to the instantiation closure of the tdr2axi bridge:
# tdr2axi and dmi_tdr_bridge (Tenstorrent, Apache-2.0) and the Debug Module register and
# System Bus Access sources they instantiate (dm_pkg, dm_csrs, dm_sba). tdr2axi needs the
# fork versions of dm_csrs and dm_sba, which carry the SbaAddrWidth parameter.
#
# Everything else upstream is not vendored: the JTAG DTM (dmi_jtag, dmi_jtag_tap, dmi_cdc),
# the debug ROM and debug memory (dm_mem, debug_rom), and the dm_top / dm_obi_top wrappers.
# OCA supplies the TAP and the TDR cells from jtag_ptap.
#
# rstgen_bypass, which tdr2axi instantiates, resolves to hw/common/rstgen_bypass.sv in the
# root package.

package:
  name: riscv-dbg
  authors:
    - "Florian Zaruba <zarubaf@iis.ee.ethz.ch>"
    - "Robert Balas <balasr@iis.ee.ethz.ch>"

# common_cells and axi are forced to the locally vendored path packages for every consumer
# via the Bender.local overrides; these declarations are inert and point at the upstream
# pulp-platform commits actually vendored (root Bender.yml vendor_package revs). They order
# axi_pkg and the CDC cells ahead of the sources below.
dependencies:
  common_cells: { git: "https://github.com/pulp-platform/common_cells.git", rev: "b74f0ad63600762ef101cf1d3365d19dfbb3123b" }
  axi:          { git: "https://github.com/pulp-platform/axi.git",          rev: "808e7b326f9f259bd2831847d9362291500db641" }

sources:
  - target: dtp
    files:
      - upstream/src/dm_pkg.sv
      - upstream/src/dm_csrs.sv
      - upstream/src/dm_sba.sv
      - upstream/src/tdr2axi/dmi_tdr_bridge.sv
      - upstream/src/tdr2axi/tdr2axi.sv
