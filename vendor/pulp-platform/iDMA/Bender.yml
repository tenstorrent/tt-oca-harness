# Slim local manifest for the vendored iDMA RTL used by OCAH.

package:
  name: idma
  authors:
    - "Thomas Benz <tbenz@iis.ee.ethz.ch>" # current maintainer
    - "Michael Rogenmoser <michaero@iis.ee.ethz.ch>"
    - "Tobias Senti <tsenti@ethz.ch>"
    - "Axel Vanoni <axvanoni@ethz.ch>"

dependencies:
  axi:                 { git: "https://github.com/pulp-platform/axi.git",                       rev: "808e7b326f9f259bd2831847d9362291500db641" }
  axi_stream:          { git: "https://github.com/pulp-platform/axi_stream.git",                rev: "54891ff40455ca94a37641b9da4604647878cc07" }
  common_cells:        { git: "https://github.com/pulp-platform/common_cells.git",              rev: "b74f0ad63600762ef101cf1d3365d19dfbb3123b" }
  common_verification: { git: "https://github.com/pulp-platform/common_verification.git",       rev: "c5d97a1fae01d2d8e8e311dee341b6b8849dcf38" }
  register_interface:  { git: "https://github.com/pulp-platform/register_interface.git",        rev: "d6e1d4cdaab7870f4faf3f88a1c788eaf5ac129d" }
  obi:                 { git: "https://github.com/pulp-platform/obi.git",                       rev: "0155fc34e900c7c884e081c0a1114a247937ff69" }

export_include_dirs:
  - upstream/src/include
  - upstream/target/rtl/include

sources:
  - upstream/src/idma_pkg.sv

  - target: idma_rtl
    files:
      - upstream/src/frontend/inst64/idma_inst64_snitch_pkg.sv
      - upstream/src/backend/idma_axil_read.sv
      - upstream/src/backend/idma_axil_write.sv
      - upstream/src/backend/idma_axi_read.sv
      - upstream/src/backend/idma_axi_write.sv
      - upstream/src/backend/idma_axis_read.sv
      - upstream/src/backend/idma_axis_write.sv
      - upstream/src/backend/idma_channel_coupler.sv
      - upstream/src/backend/idma_dataflow_element.sv
      - upstream/src/backend/idma_error_handler.sv
      - upstream/src/backend/idma_init_read.sv
      - upstream/src/backend/idma_init_write.sv
      - upstream/src/backend/idma_legalizer_page_splitter.sv
      - upstream/src/backend/idma_legalizer_pow2_splitter.sv
      - upstream/src/backend/idma_obi_read.sv
      - upstream/src/backend/idma_obi_write.sv
      - upstream/src/backend/idma_tilelink_read.sv
      - upstream/src/backend/idma_tilelink_write.sv
      - upstream/target/rtl/idma_generated.sv

      - upstream/src/midend/idma_mp_dist_midend.sv
      - upstream/src/midend/idma_mp_split_midend.sv
      - upstream/src/midend/idma_nd_midend.sv
      - upstream/src/midend/idma_rt_midend.sv

      - upstream/src/frontend/desc64/idma_desc64_ar_gen.sv
      - upstream/src/frontend/desc64/idma_desc64_ar_gen_prefetch.sv
      - upstream/src/frontend/desc64/idma_desc64_reader.sv
      - upstream/src/frontend/desc64/idma_desc64_reader_gater.sv
      - upstream/src/frontend/desc64/idma_desc64_reshaper.sv
      - upstream/src/frontend/idma_transfer_id_gen.sv
      - upstream/src/frontend/inst64/idma_inst64_events.sv
      - upstream/src/frontend/desc64/idma_desc64_reg_wrapper.sv
      - upstream/src/frontend/inst64/idma_inst64_top.sv
      - upstream/src/frontend/desc64/idma_desc64_top.sv
