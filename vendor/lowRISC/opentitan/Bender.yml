# Local manifest for vendored OpenTitan RTL used by OCAH. Upstream-generated
# RTL/packages stay under upstream/ and are owned by this package manifest; TT
# overlays stay under overlay/ and are not touched by vendor init.

package:
  name: opentitan
  authors:
    - "lowRISC contributors"

export_include_dirs:
  - upstream/hw/ip/prim/rtl

sources:
  - target: any(dtp, cross_trigger, uart, system_timer_octs, sep, smc, opentitan_smu, smu, key_manager)
    files:
      - upstream/hw/ip/prim/rtl/prim_util_pkg.sv
      - upstream/hw/ip/prim/rtl/prim_count_pkg.sv
      - upstream/hw/ip/prim/rtl/prim_ram_1p_pkg.sv
      - upstream/hw/ip/prim/rtl/prim_count.sv
      - upstream/hw/ip/prim/rtl/prim_edge_detector.sv
      - upstream/hw/ip/prim/rtl/prim_fifo_sync.sv
      - upstream/hw/ip/prim/rtl/prim_fifo_sync_cnt.sv
  # prim_generic cells that the current synth overlay replaces.
  # Add a cell here only if the overlay supplies a replacement.
  - target: all(any(dtp, cross_trigger, uart, system_timer_octs, sep, smc, opentitan_smu, smu, key_manager), not(synth))
    files:
      - upstream/hw/ip/prim_generic/rtl/prim_and2.sv
      - upstream/hw/ip/prim_generic/rtl/prim_clock_buf.sv
      - upstream/hw/ip/prim_generic/rtl/prim_clock_inv.sv
      - upstream/hw/ip/prim_generic/rtl/prim_flop.sv
      - upstream/hw/ip/prim_generic/rtl/prim_flop_2sync.sv
      - upstream/hw/ip/prim_generic/rtl/prim_xnor2.sv
      - upstream/hw/ip/prim_generic/rtl/prim_xor2.sv
  # prim_flop_2sync instantiates prim_cdc_rand_delay when SIMULATION is
  # defined; the dtp, cross_trigger, uart and system_timer_octs graphs receive
  # prim_flop_2sync above but not the any(opentitan_smu, sep, smu) file set
  # that carries the delay model.
  - target: all(any(dtp, cross_trigger, uart, system_timer_octs), simulation)
    files:
      - upstream/hw/ip/prim/rtl/prim_cdc_rand_delay.sv

  # Leaf primitives shared by every subsystem graph. They live only here, not in
  # the big any(opentitan_smu, sep, smu) list below: that list also carries
  # hw/sys/sep RTL (sep_pkg.sv), which the smc and key_manager builds must not
  # pull in.
  - target: any(sep, smc, opentitan_smu, smu, key_manager, uart)
    files:
      - upstream/hw/ip/prim/rtl/prim_alert_pkg.sv
      - upstream/hw/ip/prim/rtl/prim_sec_anchor_buf.sv
      - upstream/hw/ip/prim/rtl/prim_sec_anchor_flop.sv
      - upstream/hw/ip/prim/rtl/prim_diff_decode.sv
      - upstream/hw/ip/prim/rtl/prim_alert_sender.sv
      - upstream/hw/ip/prim_generic/rtl/prim_buf.sv
      - upstream/hw/ip/prim/rtl/prim_arbiter_tree.sv
      - upstream/hw/ip/prim/rtl/prim_fifo_async.sv
      - upstream/hw/ip/prim/rtl/prim_rst_sync.sv
      - upstream/hw/ip/prim/rtl/prim_subreg.sv
      - upstream/hw/ip/prim/rtl/prim_subreg_arb.sv
      - upstream/hw/ip/prim/rtl/prim_subreg_ext.sv

  # Held out of the big any(opentitan_smu, sep, smu) list for the same reason as
  # the group above, but smc has no LFSR consumer so it stays off this target.
  - target: any(opentitan_smu, sep, smu, key_manager)
    files:
      # prim_cipher_pkg supplies the PRINCE/PRESENT S-boxes prim_lfsr uses, so it
      # has to be compiled ahead of it.
      - upstream/hw/ip/prim/rtl/prim_cipher_pkg.sv
      - upstream/hw/ip/prim/rtl/prim_lfsr.sv

  - target: any(sep, smc, sep_wrapper, smu_wrapper, opentitan_smu, smu)
    files:
      - upstream/hw/ip/prim/rtl/prim_rom_pkg.sv

  - target: any(smc, sep_wrapper, smu_wrapper)
    files:
      - upstream/hw/ip/prim_generic/rtl/prim_rom.sv

  - target: any(smc_wrapper, smu_wrapper)
    files:
      - upstream/hw/ip/prim/rtl/prim_pad_wrapper_pkg.sv
      - upstream/hw/ip/prim_generic/rtl/prim_pad_wrapper.sv

  - target: any(sep_wrapper, smc_wrapper, smu_wrapper)
    files:
      - upstream/hw/ip/prim/rtl/prim_ram_1p.sv
      - upstream/hw/ip/prim/rtl/prim_ram_1p_adv.sv

  # I3C DAT/DCT/RLT table memories instantiated by smc_ip_integration.
  - target: any(smc_wrapper, smu_wrapper)
    files:
      - upstream/hw/ip/prim/rtl/prim_ram_2p_pkg.sv
      - upstream/hw/ip/prim/rtl/prim_ram_2p.sv

  # `opentitan_smu` can still be requested explicitly, but it also auto-activates
  # whenever `sep` or `smu` are requested: SEP's crypto wrappers (aes_wrapper.sv,
  # hmac_wrapper.sv, kmac_wrapper.sv, sep_crypto_otbn_wrapper.sv, sep.sv's secure_dma
  # integration) unconditionally instantiate these OpenTitan IP cores, so any build
  # that compiles SEP/SMU needs this whole file list to elaborate cleanly.
  - target: any(opentitan_smu, sep, smu)
    files:
      # Primitive packages.
      - upstream/hw/ip/prim/rtl/prim_sha2_pkg.sv
      - upstream/hw/ip/prim/rtl/prim_secded_pkg.sv
      - upstream/hw/ip/prim/rtl/prim_trivium_pkg.sv
      - upstream/hw/ip/prim/rtl/prim_ram_1p_pkg.sv
      - upstream/hw/ip/prim/rtl/prim_rom_pkg.sv
      - upstream/hw/ip/prim/rtl/prim_ram_2p_pkg.sv

      # CSRNG/entropy/EDN. entropy_src_pkg comes from the vendored IP.
      - upstream/hw/ip/entropy_src/rtl/entropy_src_pkg.sv
      - upstream/hw/ip/csrng/rtl/csrng_reg_pkg.sv
      - upstream/hw/ip/csrng/rtl/csrng_pkg.sv
      - upstream/hw/ip/edn/rtl/edn_reg_pkg.sv
      - upstream/hw/ip/edn/rtl/edn_pkg.sv

      # Per-top packages are OCAH-owned (hw/common/ot_chip_cfg/).
      - ../../../hw/common/ot_chip_cfg/top_pkg.sv
      - ../../../hw/common/tlul/rtl/tlul_pkg.sv
      - ../../../hw/common/ot_chip_cfg/top_racl_pkg.sv

      # Key Manager and LC packages to satisfy the OT compile ABI.
      - upstream/hw/ip/keymgr/rtl/keymgr_reg_pkg.sv
      - upstream/hw/ip/keymgr/rtl/keymgr_pkg.sv
      - upstream/hw/ip/lc_ctrl/rtl/lc_ctrl_state_pkg.sv
      - upstream/hw/ip/lc_ctrl/rtl/lc_ctrl_reg_pkg.sv
      - upstream/hw/ip/lc_ctrl/rtl/lc_ctrl_pkg.sv
      - upstream/hw/ip/otp_ctrl/rtl/otp_ctrl_pkg.sv

      # TT-owned register address maps.
      - overlay/regs/csrng/regs/gen/sv/csrng_addrmap_pkg.sv
      - overlay/regs/edn/regs/gen/sv/edn_addrmap_pkg.sv
      - overlay/regs/secure_dma/regs/gen/sv/secure_dma_addrmap_pkg.sv
      # Generated from upstream spi_host.hjson (see hw/common/regs/discover.mk);
      # describes the upstream spi_host register map.
      - overlay/regs/spi_controller/regs/gen/sv/spi_controller_addrmap_pkg.sv

      # OpenTitan IP packages.
      - upstream/hw/ip/aes/rtl/aes_reg_pkg.sv
      - upstream/hw/ip/aes/rtl/aes_sbox_canright_pkg.sv
      - upstream/hw/ip/aes/rtl/aes_pkg.sv
      - upstream/hw/ip/hmac/rtl/hmac_reg_pkg.sv
      - upstream/hw/ip/kmac/rtl/sha3_pkg.sv
      - upstream/hw/ip/kmac/rtl/kmac_reg_pkg.sv
      - upstream/hw/ip/kmac/rtl/kmac_pkg.sv
      - upstream/hw/ip/dma/rtl/secure_dma_reg_pkg.sv
      - upstream/hw/ip/dma/rtl/secure_dma_pkg.sv
      - upstream/hw/ip/spi_host/rtl/spi_host_reg_pkg.sv
      - upstream/hw/ip/spi_host/rtl/spi_host_cmd_pkg.sv
      # Passthrough-only subset of spi_device_pkg; spi_host types its
      # passthrough ports with it. See the file header.
      - overlay/spi_device/rtl/spi_device_pkg.sv
      - upstream/hw/ip/otbn/rtl/otbn_reg_pkg.sv
      - upstream/hw/ip/otbn/rtl/otbn_pkg.sv
      - upstream/hw/ip/aon_timer/rtl/aon_timer_reg_pkg.sv

      # Primitive modules used by the OpenTitan IPs.
      - upstream/hw/ip/prim/rtl/prim_alert_receiver.sv
