package:
  name: el2

# Vendored from chipsalliance/Cores-VeeR-EL2 by `bender vendor init` (vendor_package
# entry in the root Bender.yml). Never hand-edit upstream/. There are no patches:
# el2_def.sv is listed directly below to sidestep the fork's cosmetic el2_pkg.sv
# rename (the package inside is el2_pkg either way). TT collateral lives in overlay/
# instead - snapshots/sep is generated by tools/sep_el2_config.sh - which survives
# `bender vendor init`, since that only recreates upstream/.

export_include_dirs:
    - upstream/design/include
    - overlay/snapshots/sep

sources:
  - target: sep_el2
    # Without this, beh_lib.sv builds its own behavioural gate instead of user_clock_gate.
    defines:
      TECH_SPECIFIC_EC_RV_ICG: ~
    files:
    - overlay/snapshots/sep/common_defines.vh
    - overlay/prim_shim/user_clock_gate.sv

    # Flops, ECC and utilities; its ICG is swapped by the define above, not by replacing this file.
    - upstream/design/lib/beh_lib.sv
    - upstream/design/include/el2_def.sv
    - upstream/design/el2_veer_lockstep.sv
    - upstream/design/el2_veer_wrapper.sv
    - upstream/design/el2_mem.sv
    - upstream/design/el2_pic_ctrl.sv
    - upstream/design/el2_veer.sv
    - upstream/design/el2_dma_ctrl.sv
    - upstream/design/el2_pmp.sv
    - upstream/design/ifu/el2_ifu_aln_ctl.sv
    - upstream/design/ifu/el2_ifu_compress_ctl.sv
    - upstream/design/ifu/el2_ifu_ifc_ctl.sv
    - upstream/design/ifu/el2_ifu_bp_ctl.sv
    - upstream/design/ifu/el2_ifu_ic_mem.sv
    - upstream/design/ifu/el2_ifu_mem_ctl.sv
    - upstream/design/ifu/el2_ifu_iccm_mem.sv
    - upstream/design/ifu/el2_ifu.sv
    - upstream/design/dec/el2_dec_decode_ctl.sv
    - upstream/design/dec/el2_dec_gpr_ctl.sv
    - upstream/design/dec/el2_dec_ib_ctl.sv
    - upstream/design/dec/el2_dec_pmp_ctl.sv
    - upstream/design/dec/el2_dec_tlu_ctl.sv
    - upstream/design/dec/el2_dec_trigger.sv
    - upstream/design/dec/el2_dec.sv
    - upstream/design/exu/el2_exu_alu_ctl.sv
    - upstream/design/exu/el2_exu_mul_ctl.sv
    - upstream/design/exu/el2_exu_div_ctl.sv
    - upstream/design/exu/el2_exu.sv
    - upstream/design/lsu/el2_lsu.sv
    - upstream/design/lsu/el2_lsu_clkdomain.sv
    - upstream/design/lsu/el2_lsu_addrcheck.sv
    - upstream/design/lsu/el2_lsu_lsc_ctl.sv
    - upstream/design/lsu/el2_lsu_stbuf.sv
    - upstream/design/lsu/el2_lsu_bus_buffer.sv
    - upstream/design/lsu/el2_lsu_bus_intf.sv
    - upstream/design/lsu/el2_lsu_ecc.sv
    - upstream/design/lsu/el2_lsu_dccm_mem.sv
    - upstream/design/lsu/el2_lsu_dccm_ctl.sv
    - upstream/design/lsu/el2_lsu_trigger.sv
    - upstream/design/dbg/el2_dbg.sv
    - upstream/design/dmi/dmi_mux.v
    - upstream/design/dmi/dmi_wrapper.v
    - upstream/design/dmi/dmi_jtag_to_core_sync.v
    - upstream/design/dmi/rvjtag_tap.v
    - upstream/design/lib/el2_regfile_if.sv
    - upstream/design/lib/el2_lib.sv
    - upstream/design/lib/el2_mem_if.sv

    # Behavioural models of the ram_<depth>x<width> TCM macros. The IHP SG13G2 yosys flow
    # has no TCM macro wrappers yet and synthesizes these models.
    - target: any(not(synth), emulation, tech_ihp_sg13g2)
      files:
        - upstream/design/lib/mem_lib.sv

    # Testbench collateral; upstream user_cells.sv dropped - overlay/prim_shim supersedes it.
    - target: el2_simulation
      files:
        - upstream/testbench/axi_lsu_dma_bridge.sv
        - upstream/testbench/veer_wrapper.sv
