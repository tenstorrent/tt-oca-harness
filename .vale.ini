# Vale prose-lint config, scoped to one job right now: catch a term this
# repo defines one way (most often an acronym's expansion) drifting to a
# different, wrong one somewhere else in the docs. Rules live under
# styles/OCAH/; see flows/lint/vale.mk for how CI/local runs invoke this,
# and CONTRIBUTING.md for what this covers and what it doesn't.
StylesPath = styles
MinAlertLevel = suggestion

[*.{adoc,md}]
BasedOnStyles = OCAH
