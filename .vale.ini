# Vale prose-lint config, scoped to one job right now: catch a term this
# repo defines one way (most often an acronym's expansion) drifting to a
# different, wrong one somewhere else -- including the kind an AI assistant
# can plausibly invent (e.g. DFD as "Debug Forensics Dump" instead of the
# "Design-for-Debug" this repo actually defines it as). Rules live under
# styles/OCAH/; each entry there is sourced from a real drift already found
# in-tree, not a guessed one -- see flows/lint/vale.mk for how CI/local runs
# invoke this, and CONTRIBUTING.md for the rationale on what stays out.
StylesPath = styles
MinAlertLevel = suggestion

[*.{adoc,md}]
BasedOnStyles = OCAH
