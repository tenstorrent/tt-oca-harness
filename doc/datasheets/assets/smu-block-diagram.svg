<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#484848"/>
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#484848"/>
    </marker>
    <style>
      .title { font: 700 24px sans-serif; fill: #103525; }
      .label { font: 700 17px sans-serif; fill: #103525; }
      .text { font: 14px sans-serif; fill: #484848; }
      .small { font: 12px sans-serif; fill: #484848; }
      .chiplet { fill: #ffffff; stroke: #77736b; stroke-width: 2; stroke-dasharray: 8 5; rx: 12; }
      .smu { fill: #f8f4eb; stroke: #103525; stroke-width: 2.5; rx: 10; }
      .core { fill: #ffffff; stroke: #937027; stroke-width: 2; rx: 8; }
      .optional { fill: #ffffff; stroke: #937027; stroke-width: 2; stroke-dasharray: 6 4; rx: 8; }
      .external { fill: #ffffff; stroke: #77736b; stroke-width: 1.5; rx: 8; }
      .line { fill: none; stroke: #484848; stroke-width: 2; marker-end: url(#arrow); }
      .both { fill: none; stroke: #484848; stroke-width: 2; marker-start: url(#arrow-start); marker-end: url(#arrow); }
      .bus { fill: none; stroke: #484848; stroke-width: 2; }
    </style>
  </defs>

  <text class="title" x="500" y="27" text-anchor="middle">SMU integration boundary</text>

  <rect class="external" x="15" y="105" width="175" height="215"/>
  <text class="label" x="102" y="138" text-anchor="middle">External system</text>
  <text class="text" x="102" y="173" text-anchor="middle">SMN / SoC fabric</text>
  <text class="text" x="102" y="199" text-anchor="middle">JTAG / scan tools</text>
  <text class="text" x="102" y="225" text-anchor="middle">clocks / reset / power</text>
  <text class="text" x="102" y="251" text-anchor="middle">interrupts / telemetry</text>
  <text class="small" x="102" y="288" text-anchor="middle">adopter-owned policy</text>

  <rect class="chiplet" x="220" y="48" width="550" height="405"/>
  <text class="label" x="245" y="77">OCAH chiplet</text>

  <rect class="smu" x="245" y="94" width="500" height="250"/>
  <text class="label" x="495" y="121" text-anchor="middle">System Management Unit (SMU)</text>
  <rect class="core" x="266" y="145" width="134" height="78"/>
  <text class="label" x="333" y="177" text-anchor="middle">DTP</text>
  <text class="small" x="333" y="201" text-anchor="middle">debug · scan · trigger</text>
  <rect class="core" x="433" y="145" width="134" height="78"/>
  <text class="label" x="500" y="177" text-anchor="middle">SMC</text>
  <text class="small" x="500" y="201" text-anchor="middle">management · reset</text>
  <rect class="optional" x="600" y="145" width="124" height="78"/>
  <text class="label" x="662" y="177" text-anchor="middle">SEP</text>
  <text class="small" x="662" y="201" text-anchor="middle">optional security</text>
  <rect class="core" x="335" y="257" width="330" height="62"/>
  <text class="label" x="500" y="283" text-anchor="middle">SMU AXI fabric (SEP=1)</text>
  <text class="small" x="500" y="304" text-anchor="middle">3 inputs × 3 outputs · runtime apertures · ID conversion</text>

  <rect class="core" x="245" y="374" width="230" height="55"/>
  <text class="label" x="360" y="398" text-anchor="middle">Adopter IP / system services</text>
  <text class="small" x="360" y="417" text-anchor="middle">only through connected mappings</text>
  <rect class="core" x="500" y="374" width="245" height="55"/>
  <text class="label" x="622" y="398" text-anchor="middle">Technology implementation</text>
  <text class="small" x="622" y="417" text-anchor="middle">memories · OTP · pads · clocks · entropy</text>

  <rect class="chiplet" x="805" y="105" width="180" height="250"/>
  <text class="label" x="895" y="138" text-anchor="middle">Peer OCAH chiplet</text>
  <rect class="core" x="829" y="180" width="132" height="76"/>
  <text class="label" x="895" y="212" text-anchor="middle">SMU / adopter IP</text>
  <text class="small" x="895" y="236" text-anchor="middle">routed by system</text>

  <path class="both" d="M190 175 H266"/>
  <text class="small" x="228" y="164" text-anchor="middle">JTAG</text>
  <path class="both" d="M190 258 H335"/>
  <text class="small" x="228" y="277" text-anchor="middle">AXI4</text>
  <path class="line" d="M190 218 H433"/>
  <path class="both" d="M400 184 H433"/>
  <path class="both" d="M567 184 H600"/>
  <path class="both" d="M333 223 V257"/>
  <path class="both" d="M500 223 V257"/>
  <path class="both" d="M662 223 V257"/>
  <path class="both" d="M665 288 H829"/>
  <text class="small" x="747" y="277" text-anchor="middle">system fabric</text>
  <path class="bus" d="M360 344 V359 H622"/>
  <path class="both" d="M360 359 V374"/>
  <path class="both" d="M622 319 V374"/>
</svg>
