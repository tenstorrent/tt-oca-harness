<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
  <title id="title">SMU system context</title>
  <desc id="desc">Within an OCAH chiplet, the user subsystem and AoU bridge connect
    to the System Management Network. The bridge links peer chiplets over UCIe.
    The SMU has one external AXI input and output and connects SMC and optional
    SEP through a loop-free three-input, three-output AXI4 crossbar. External
    JTAG connects to DTP. DTP, SMC and SEP exchange debug, lifecycle and control
    handoffs, shown as grouped dashed connections rather than an AXI port.
    The adopter supplies clocks, resets and technology resources. Without SEP,
    SMC connects directly to the external AXI interfaces.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#103525"/>
    </marker>
    <marker id="arrow-start" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#103525"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; font-size: 21px; fill: #484848; }
      .heading { font-size: 24px; font-weight: bold; fill: #103525; }
      .label { font-weight: bold; fill: #103525; }
      .chiplet { fill: #ffffff; stroke: #77736b; stroke-width: 2; stroke-dasharray: 8 5; }
      .smu { fill: #f8f4eb; stroke: #103525; stroke-width: 2.5; }
      .network { fill: #e8f0e8; stroke: #336633; stroke-width: 2; }
      .fabric { fill: #fff0cc; stroke: #937027; stroke-width: 2; }
      .core { fill: #ffffff; stroke: #937027; stroke-width: 2; }
      .optional { fill: #ffffff; stroke: #937027; stroke-width: 2; stroke-dasharray: 7 5; }
      .external { fill: #f5f5f5; stroke: #77736b; stroke-width: 2; }
      .user { fill: #f0e8f8; stroke: #664488; stroke-width: 2; }
      .link { fill: none; stroke: #103525; stroke-width: 2; marker-start: url(#arrow-start); marker-end: url(#arrow); }
      .input { fill: none; stroke: #103525; stroke-width: 2; marker-end: url(#arrow); }
      .control { fill: none; stroke: #80601e; stroke-width: 2; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect class="chiplet" x="170" y="8" width="650" height="590" rx="10"/>
  <text class="heading" x="190" y="38">OCAH chiplet</text>

  <rect class="user" x="190" y="56" width="300" height="88" rx="6"/>
  <text class="label" x="340" y="91" text-anchor="middle">User subsystem</text>
  <text x="340" y="120" text-anchor="middle">Application IP / NoC</text>

  <rect class="core" x="550" y="56" width="250" height="88" rx="6"/>
  <text class="label" x="675" y="91" text-anchor="middle">AoU bridge</text>
  <text x="675" y="120" text-anchor="middle">AXI over UCIe</text>

  <rect class="external" x="850" y="56" width="140" height="112" rx="6"/>
  <text class="label" x="920" y="88" text-anchor="middle">Peer</text>
  <text class="label" x="920" y="114" text-anchor="middle">chiplet</text>
  <text x="920" y="145" text-anchor="middle">SMU / SMN</text>
  <path class="link" d="M800 100 H850"/>

  <rect class="network" x="190" y="178" width="610" height="48" rx="5"/>
  <text class="label" x="495" y="209" text-anchor="middle">System Management Network (SMN)</text>
  <path class="link" d="M340 144 V178"/>
  <path class="link" d="M675 144 V178"/>

  <rect class="smu" x="190" y="272" width="610" height="306" rx="8"/>
  <text class="heading" x="208" y="302">SMU</text>
  <rect class="fabric" x="400" y="324" width="380" height="70" rx="5"/>
  <text class="label" x="590" y="353" text-anchor="middle">AXI4 crossbar</text>
  <text x="590" y="379" text-anchor="middle">3 inputs / 3 outputs · loop-free</text>
  <path class="link" d="M590 226 V324"/>
  <text x="609" y="254">AXI4 in / out</text>

  <rect class="core" x="208" y="430" width="164" height="80" rx="6"/>
  <text class="heading" x="290" y="460" text-anchor="middle">DTP</text>
  <text x="290" y="490" text-anchor="middle">Debug / test</text>

  <rect class="core" x="400" y="430" width="180" height="80" rx="6"/>
  <text class="heading" x="490" y="460" text-anchor="middle">SMC</text>
  <text x="490" y="490" text-anchor="middle">Management</text>

  <rect class="optional" x="600" y="430" width="180" height="80" rx="6"/>
  <text class="label" x="690" y="460" text-anchor="middle">SEP (optional)</text>
  <text x="690" y="490" text-anchor="middle">Root of trust</text>
  <path class="link" d="M490 394 V430"/>
  <path class="link" d="M690 394 V430"/>

  <path class="control" d="M290 510 V532 H690 V510 M490 510 V532"/>
  <text x="495" y="562" text-anchor="middle">Debug / lifecycle / control handoffs</text>

  <text class="label" x="77" y="286" text-anchor="middle">External</text>
  <rect class="external" x="8" y="306" width="138" height="88" rx="6"/>
  <text x="77" y="342" text-anchor="middle">Clocks / reset</text>
  <text x="77" y="371" text-anchor="middle">Power-good</text>
  <path class="input" d="M146 350 H190"/>

  <rect class="external" x="8" y="430" width="138" height="80" rx="6"/>
  <text x="77" y="460" text-anchor="middle">JTAG / scan</text>
  <text x="77" y="490" text-anchor="middle">tools</text>
  <path class="link" d="M146 470 H208"/>

  <text x="500" y="622" text-anchor="middle">Without SEP: direct external AXI ↔ SMC paths</text>
  <text x="500" y="647" text-anchor="middle">Adopter supplies technology macros, PHY, firmware and lifecycle policy</text>
</svg>
