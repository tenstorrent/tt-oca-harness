<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#484848"/>
    </marker>
    <style>
      .title { font: 700 24px sans-serif; fill: #103525; }
      .label { font: 700 18px sans-serif; fill: #103525; }
      .text { font: 15px sans-serif; fill: #484848; }
      .small { font: 13px sans-serif; fill: #484848; }
      .box { fill: #f8f4eb; stroke: #103525; stroke-width: 2; rx: 10; }
      .core { fill: #ffffff; stroke: #937027; stroke-width: 2; rx: 8; }
      .external { fill: #ffffff; stroke: #77736b; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 8; }
      .line { fill: none; stroke: #484848; stroke-width: 2; marker-end: url(#arrow); }
      .both { fill: none; stroke: #484848; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <text class="title" x="500" y="30" text-anchor="middle">DTP integration boundary</text>

  <rect class="external" x="15" y="62" width="165" height="100"/>
  <text class="label" x="97" y="93" text-anchor="middle">JTAG pads</text>
  <text class="text" x="97" y="120" text-anchor="middle">TCK, TMS, TDI, TDO</text>
  <text class="text" x="97" y="144" text-anchor="middle">TRST_N</text>

  <rect class="box" x="225" y="52" width="470" height="185"/>
  <text class="label" x="460" y="80" text-anchor="middle">JTAG interface unit</text>
  <rect class="core" x="250" y="100" width="105" height="105"/>
  <text class="label" x="302" y="145" text-anchor="middle">PTAP</text>
  <text class="small" x="302" y="171" text-anchor="middle">instructions</text>
  <text class="small" x="302" y="190" text-anchor="middle">and TDRs</text>
  <rect class="core" x="385" y="100" width="130" height="105"/>
  <text class="label" x="450" y="137" text-anchor="middle">Scan fabric</text>
  <text class="small" x="450" y="163" text-anchor="middle">BSR · iJTAG</text>
  <text class="small" x="450" y="183" text-anchor="middle">STAP · DFT · DFD</text>
  <rect class="core" x="545" y="100" width="125" height="105"/>
  <text class="label" x="607" y="137" text-anchor="middle">Debug control</text>
  <text class="small" x="607" y="163" text-anchor="middle">JTAG-to-AXI</text>
  <text class="small" x="607" y="183" text-anchor="middle">reset · clock stop</text>

  <rect class="external" x="755" y="52" width="225" height="185"/>
  <text class="label" x="867" y="82" text-anchor="middle">Adopter connections</text>
  <text class="text" x="775" y="115">AXI4 → SMC fabric</text>
  <text class="text" x="775" y="142">AXI4-Lite → SMC/SEP OTP</text>
  <text class="text" x="775" y="169">scan chains and STAPs</text>
  <text class="text" x="775" y="196">boot stall and IC_RESET slices</text>
  <text class="text" x="775" y="220">lifecycle debug-disable policy</text>

  <path class="both" d="M180 112 H225"/>
  <path class="both" d="M695 144 H755"/>

  <rect class="box" x="225" y="285" width="470" height="145"/>
  <text class="label" x="460" y="315" text-anchor="middle">Cross-trigger network</text>
  <rect class="core" x="250" y="335" width="120" height="67"/>
  <text class="label" x="310" y="365" text-anchor="middle">CT ports</text>
  <text class="small" x="310" y="387" text-anchor="middle">sync + protocol</text>
  <rect class="core" x="400" y="335" width="120" height="67"/>
  <text class="label" x="460" y="365" text-anchor="middle">CT matrix</text>
  <text class="small" x="460" y="387" text-anchor="middle">CSR routing</text>
  <rect class="core" x="550" y="335" width="120" height="67"/>
  <text class="label" x="610" y="365" text-anchor="middle">Clock stop</text>
  <text class="small" x="610" y="387" text-anchor="middle">registered output</text>

  <rect class="external" x="15" y="292" width="165" height="115"/>
  <text class="label" x="97" y="322" text-anchor="middle">Trigger endpoints</text>
  <text class="text" x="97" y="352" text-anchor="middle">external CTP I/O</text>
  <text class="text" x="97" y="378" text-anchor="middle">local sources/sinks</text>

  <rect class="external" x="755" y="292" width="225" height="115"/>
  <text class="label" x="867" y="322" text-anchor="middle">Management integration</text>
  <text class="text" x="867" y="352" text-anchor="middle">32-bit AXI4-Lite CSR</text>
  <text class="text" x="867" y="378" text-anchor="middle">clock-stop request/output</text>

  <path class="both" d="M180 350 H225"/>
  <path class="both" d="M695 350 H755"/>
  <path class="line" d="M610 285 V238"/>
</svg>
