<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#484848"/>
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#484848"/>
    </marker>
    <style>
      .title { font: 700 24px sans-serif; fill: #103525; }
      .label { font: 700 17px sans-serif; fill: #103525; }
      .text { font: 14px sans-serif; fill: #484848; }
      .small { font: 12px sans-serif; fill: #484848; }
      .chiplet { fill: #ffffff; stroke: #77736b; stroke-width: 2; stroke-dasharray: 8 5; rx: 12; }
      .dtp { fill: #f8f4eb; stroke: #103525; stroke-width: 2.5; rx: 10; }
      .core { fill: #ffffff; stroke: #937027; stroke-width: 2; rx: 8; }
      .external { fill: #ffffff; stroke: #77736b; stroke-width: 1.5; rx: 8; }
      .line { fill: none; stroke: #484848; stroke-width: 2; marker-end: url(#arrow); }
      .both { fill: none; stroke: #484848; stroke-width: 2; marker-start: url(#arrow-start); marker-end: url(#arrow); }
      .bus { fill: none; stroke: #484848; stroke-width: 2; }
    </style>
  </defs>

  <text class="title" x="500" y="27" text-anchor="middle">DTP in an OCAH multi-chiplet system</text>

  <rect class="external" x="15" y="125" width="175" height="145"/>
  <text class="label" x="102" y="158" text-anchor="middle">External debug / test</text>
  <text class="text" x="102" y="190" text-anchor="middle">JTAG controller</text>
  <text class="text" x="102" y="216" text-anchor="middle">scan equipment</text>
  <text class="text" x="102" y="242" text-anchor="middle">trigger endpoints</text>

  <rect class="chiplet" x="220" y="48" width="550" height="405"/>
  <text class="label" x="245" y="77">OCAH chiplet</text>

  <rect class="dtp" x="245" y="94" width="500" height="174"/>
  <text class="label" x="495" y="121" text-anchor="middle">Debug and Test Ports (DTP)</text>
  <rect class="core" x="270" y="140" width="210" height="96"/>
  <text class="label" x="375" y="175" text-anchor="middle">JTAG Interface Unit</text>
  <text class="small" x="375" y="199" text-anchor="middle">TAP · scan · JTAG-to-AXI</text>
  <text class="small" x="375" y="219" text-anchor="middle">boot · reset · clock controls</text>
  <rect class="core" x="510" y="140" width="210" height="96"/>
  <text class="label" x="615" y="175" text-anchor="middle">Cross Trigger Network</text>
  <text class="small" x="615" y="199" text-anchor="middle">trigger routing · CTPs</text>
  <text class="small" x="615" y="219" text-anchor="middle">clock-stop aggregation</text>

  <rect class="core" x="245" y="310" width="112" height="76"/>
  <text class="label" x="301" y="343" text-anchor="middle">SMC</text>
  <text class="small" x="301" y="367" text-anchor="middle">fabric · OTP</text>
  <rect class="core" x="374" y="310" width="112" height="76"/>
  <text class="label" x="430" y="343" text-anchor="middle">SEP</text>
  <text class="small" x="430" y="367" text-anchor="middle">OTP · scan</text>
  <rect class="core" x="503" y="310" width="112" height="76"/>
  <text class="label" x="559" y="343" text-anchor="middle">Adopter IP</text>
  <text class="small" x="559" y="367" text-anchor="middle">when connected</text>
  <rect class="core" x="632" y="310" width="112" height="76"/>
  <text class="label" x="688" y="340" text-anchor="middle">Clock / reset</text>
  <text class="small" x="688" y="364" text-anchor="middle">and local triggers</text>

  <text class="small" x="495" y="425" text-anchor="middle">Adopter supplies pads, policy, clocks, resets, scan chains, and permitted mappings</text>

  <rect class="chiplet" x="805" y="86" width="180" height="300"/>
  <text class="label" x="895" y="118" text-anchor="middle">Peer OCAH chiplet</text>
  <rect class="dtp" x="829" y="145" width="132" height="76"/>
  <text class="label" x="895" y="177" text-anchor="middle">DTP</text>
  <text class="small" x="895" y="201" text-anchor="middle">JTAG + triggers</text>
  <rect class="core" x="829" y="264" width="132" height="76"/>
  <text class="label" x="895" y="296" text-anchor="middle">Internal functions</text>
  <text class="small" x="895" y="320" text-anchor="middle">management · IP</text>

  <path class="both" d="M190 184 H270"/>
  <text class="small" x="228" y="173" text-anchor="middle">JTAG / scan</text>
  <path class="both" d="M190 236 H510"/>
  <text class="small" x="228" y="251" text-anchor="middle">triggers</text>
  <path class="both" d="M720 188 H829"/>
  <text class="small" x="774" y="176" text-anchor="middle">cross-trigger</text>
  <path class="both" d="M480 188 H510"/>
  <path class="both" d="M375 236 V286"/>
  <path class="bus" d="M301 286 H688"/>
  <path class="line" d="M301 286 V310"/>
  <path class="line" d="M430 286 V310"/>
  <path class="line" d="M559 286 V310"/>
  <path class="line" d="M688 286 V310"/>
  <path class="both" d="M895 221 V264"/>
</svg>
