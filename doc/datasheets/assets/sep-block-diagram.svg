    <text x="550" y="30" font-size="20" font-weight="bold">OCAH chiplet</text>

    <rect x="210" y="102" width="680" height="278" rx="6" fill="#ffffff" stroke="#103525" stroke-width="2"/>
    <path d="M 216 102 H 884 Q 890 102 890 108 V 134 H 210 V 108 Q 210 102 216 102 Z" fill="#e4eee8"/>
    <text x="620" y="125" font-size="20" font-weight="bold">Security Processor (SEP)</text>

    <g fill="#f8f4eb" stroke="#937027" stroke-width="1.5">
