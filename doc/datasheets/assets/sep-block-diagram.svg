<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">SEP system context</title>
  <desc id="desc">Within the chiplet, the Security Processor connects its VeeR EL2 CPU,
    crypto and key management, DMA, watchdog, SPI host, system interface, and lifecycle
    controller through a local 64-bit AXI4 fabric. An external JTAG debugger reaches
    the CPU through DTP and the SEP STAP. External SPI flash connects to the SPI host.
    The system interface connects through the SMU crossbar and SMN to a peer OCA
    chiplet over die-to-die transport. The adopter supplies memory, OTP, entropy IP,
    and pads; dedicated macro interfaces connect to the owning SEP blocks.</desc>
  <defs>
    <marker id="end" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#484848"/>
    </marker>
    <marker id="start" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M 7 0 L 0 3.5 L 7 7 Z" fill="#484848"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" fill="#103525" text-anchor="middle">
