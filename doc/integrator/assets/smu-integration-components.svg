<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="790" viewBox="0 0 1040 790" role="img" aria-labelledby="title desc">
<title id="title">SMU integration components</title>
<desc id="desc">smu_wrapper is a reference top that joins the OCAH smu module to two reference integration modules. Inside smu, the SEP and SMC connect through the SMU AXI4 crossbar, which also carries the system AXI interface, smu_axi_in and smu_axi_out. sep_ip_integration holds an eFuse interface shim and eFuse bank for the SEP, the SRAM, ROM and TCM shims in front of the SEP memory macros, and the optional external TRNG and AXI extension interfaces. smc_ip_integration holds a second eFuse interface shim and eFuse bank for the SMC, the GPIO pads that carry SPI, UART, I3C, I2C, AVSBus and GPIO, an AXI-Lite demux in front of the PLL, PVT and strap models, and the CPU, trace and I3C memories. The SMU clocks and resets enter the wrapper, SoC reset control leaves it, and the JTAG ports pass through to adopter pads. Adopters replace the integration modules with their own technology IP; the smu module is unchanged.</desc>
