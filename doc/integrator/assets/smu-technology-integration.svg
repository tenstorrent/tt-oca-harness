<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="794" viewBox="0 0 1040 794" role="img" aria-labelledby="title desc">
<title id="title">SMU technology integration</title>
<desc id="desc">smu_wrapper joins the technology-independent OCAH smu module to two reference integration modules that an adopter replaces with its own technology IP. smu holds the SEP, the SMU AXI4 crossbar, the SMC and the DTP, and exposes its technology integration interfaces at its boundary: the SEP and SMC memory interfaces, a separate eFuse command and control interface for each of the SEP and the SMC, the SMC adopter AXI-Lite window, the SEP external TRNG and AXI extension, and the GPIO pad signals. Below the OCAH and adopter boundary, sep_ip_integration holds the SEP eFuse interface shim and eFuse bank, the SRAM, ROM and TCM shims in front of their memory macros, the crypto and Key Manager memories, and DECERR terminations for the external TRNG and AXI extension. smc_ip_integration holds the SMC eFuse interface shim and eFuse bank, the external AXI-Lite demux in front of the PLL, PVT and strap models, one GPIO pad shim per pin driving the physical padring through gpio_pad_io, and the CPU, trace and I3C memories. The rest of the SoC connects to smu through the wrapper: clocks, resets and JTAG; the system AXI ports and interrupts; telemetry, reset, isolation, cross-trigger and clock stop; lifecycle, debug, trace, lockstep and peripheral interrupts; and fuse sense, memory repair, MBIST and boot completion handshakes.</desc>
