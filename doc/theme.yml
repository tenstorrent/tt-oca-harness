extends: default
page:
  layout: portrait
  size: Letter
base:
  font_size: 9
title_page:
  align: center
  logo:
    top: 10%
  title:
    font_style: bold
    font_size: floor($base_font_size * 2.8)
    top: 55%
    font_color: ffffff
  subtitle:
    font_style: bold
    font_size: floor($base_font_size * 2.0)
    font_color: ffffff
    margin_top: $base_font_size * 1.25
  authors:
    font_color: ffffff
    font_size: floor($base_font_size * 0.8)
  revision:
    margin_top: $base_font_size * 1.25
    font_color: ffffff
table:
  font_size: 7
role:
  landscape:
    page-layout: landscape
  small:
    font_size: 7
