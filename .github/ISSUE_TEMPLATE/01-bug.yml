name: Bug
description: Something is incorrect or unexpectedly broken.
title: "[Bug]: "
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Pick Workstream, Subsystem, and Component. Unsure on Component? leave **General**.
        Priority and Target release are optional.
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - RTL
        - DV
        - ROM
        - SPEC
        - DOCS
        - INFRA
        - SYNTH
        - LINT
        - CDC
        - RDC
        - RDL
        - RELEASE
        - NONFREE
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - OCAH
        - SMU
        - SMC
        - SEP
        - DTP
        - AOU
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - General
        - KM
        - TRNG
        - CRYPTO
        - LC
        - EFUSE
        - AXI
        - I3C
        - CI
        - BUILD
        - DEPS
      default: 0
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Optional. Skip if you are not sure.
      options:
        - P0
        - P1
        - P2
  - type: dropdown
    id: target_release
    attributes:
      label: Target release
      description: Optional. Skip if you are not sure.
      options:
        - v0.5.0
        - Future
        - Not planned
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What broke, where (path, DUT, test), and what you expected if it matters.
      placeholder: hw/sys/sep/... and test X failed because ...
    validations:
      required: true
