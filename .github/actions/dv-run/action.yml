# One DV run on a hosted runner: toolchain setup, run_dv.py, the native
# result gate, and the artifact upload. Shared by the pull-request gate
# (.github/workflows/sim.yml) and the scheduled regression tiers
# (.github/workflows/regress.yml), so the callers cannot drift apart; each
# caller owns only its matrix and its tier policy (items, seeds, coverage,
# fan-out, runner, budget), which it passes in as inputs.
#
# The caller must check the repository out first: a local composite action
# is loaded from the checked-out tree.
#
# A composite step cannot carry timeout-minutes, so the commands that can
# hang on a stalled apt mirror or a runaway build are wrapped in `timeout`;
# the job-level timeout-minutes the caller sets is the overall backstop.
name: 'Run DV tier'
description: 'Set up the Verilator toolchain, run one DUT/tool/tier through run_dv.py, gate on the native result.json, and upload the run tree'
inputs:
  dut:
    required: true
    description: 'DUT name, as run_dv.py --dut'
  tool:
    required: false
    default: 'verilator'
    description: 'Simulator, as run_dv.py --tool. Hosted CI is Verilator-only'
  tier:
    required: true
    description: 'Tier label (smoke, nightly, weekly). Names the artifact; callers also use it as the run-dir segment'
  label:
    required: false
    default: ''
    description: 'Names a second row of the same DUT and tier (an expected-fail group beside the regression group, say). Appended to the artifact name, which would otherwise collide; the dashboard reads only the unlabelled weekly artifact'
  items:
    required: true
    description: 'Test group or test, as run_dv.py --items'
  reseed:
    required: false
    default: '1'
    description: 'Random seeds per test; passed as --reseed when greater than 1'
  coverage:
    required: false
    default: 'false'
    description: 'true collects native coverage (--cov) and requires coverage evidence in the result gate'
  sim-jobs:
    required: false
    default: '2'
    description: 'Simulation fan-out (--sim-jobs); the literal nproc uses the runner core count'
  run-dir:
    required: true
    description: 'Explicit run directory (--run-dir). Keep the build/ci/runs/<dut>/<tool>/<tier>/<run_id> shape: the dashboard hashes it into the trend-point identity'
  verilator-version:
    required: false
    default: 'v5.052'
    description: 'Verilator tag built from source on a cache miss. cocotb 2.x (locked in uv.lock) needs a newer Verilator than the Ubuntu apt package'
  python-version:
    required: false
    default: '3.11'
    description: 'Python version for uv'
  retention-days:
    required: false
    default: '14'
    description: 'Artifact retention in days'
  executor:
    required: false
    default: 'local'
    description: 'Executor, as run_dv.py --executor. A cluster executor needs its scheduler commands on the runner; the result gate then requires every simulation leaf to have run as a job of that executor'
  extra-args:
    required: false
    default: ''
    description: 'Advanced: further run_dv.py arguments appended verbatim, such as the resource request of a cluster executor (--mem-mb 2000 --walltime 30)'
runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install bender
      uses: pulp-platform/pulp-actions/bender-install@v2.5.1

    - name: Verify bender
      shell: bash
      run: |
        # pulp-actions/bender-install pipes `curl -f` into bash without
        # pipefail, so a GitHub Pages 500 still reports success and leaves
        # /tools/bender on PATH with no binary. Retry the init once with
        # pipefail when that happens.
        if command -v bender >/dev/null 2>&1; then
          bender --version
          exit 0
        fi
        echo "bender-install left no binary; retrying the init once"
        sudo mkdir -p /tools/bender && sudo chmod 777 /tools/bender
        (
          set -o pipefail
          cd /tools/bender
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 -sSf \
            https://pulp-platform.github.io/bender/init | bash
        )
        echo "/tools/bender" >> "$GITHUB_PATH"
        command -v bender >/dev/null
        bender --version

    - name: Cache Verilator
      id: cache-verilator
      uses: actions/cache@v4
      with:
        path: ~/verilator
        key: verilator-${{ inputs.verilator-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Build Verilator
      if: steps.cache-verilator.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERILATOR_VERSION: ${{ inputs.verilator-version }}
      run: |
        # Acquire options: the hosted-runner mirror list falls back from
        # azure.archive.ubuntu.com to archive.ubuntu.com, but apt only fails
        # over on a connection *error* -- a silently stalled mirror otherwise
        # hangs apt until the job timeout. The Timeout option turns a stall
        # into an error so the retry/failover machinery actually runs; the
        # `timeout` wrappers are the backstop for both mirrors being down.
        timeout 10m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 update
        timeout 10m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
          install -y --no-install-recommends \
          autoconf bison flex g++ help2man libfl-dev make perl python3 zlib1g-dev
        git clone --depth 1 --branch "$VERILATOR_VERSION" \
          https://github.com/verilator/verilator.git "$RUNNER_TEMP/verilator-src"
        cd "$RUNNER_TEMP/verilator-src"
        autoconf
        ./configure --prefix "$HOME/verilator"
        timeout 25m make -j "$(nproc)"
        make install

    - name: Add Verilator to PATH
      shell: bash
      run: |
        echo "$HOME/verilator/bin" >> "$GITHUB_PATH"
        # libfl2: runtime dependency of the verilator binary; not preinstalled
        # on hosted runners and skipped when the Verilator cache hits.
        #
        # ccache: required by any DUT setting [build.verilator] ccache = true
        # (sep does). Verilator then emits `ccache g++` as the compiler, and
        # without the binary the very first C++ compile dies with
        # "ccache: No such file or directory" / make Error 127 -- after a full
        # verilation, so it is slow to discover. Installed unconditionally so
        # the runner never depends on which DUT the matrix is running.
        #
        # Acquire options: same stall-into-error rationale as the Verilator
        # build step above.
        timeout 10m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 update
        timeout 10m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
          install -y --no-install-recommends libfl2 ccache

    - name: Check environment
      shell: bash
      env:
        DV_DUT: ${{ inputs.dut }}
        DV_TOOL: ${{ inputs.tool }}
        DV_EXECUTOR: ${{ inputs.executor }}
      run: |
        verilator --version
        python3 tools/dv/run_dv.py --validate-configs
        python3 tools/dv/run_dv.py --doctor --dut "$DV_DUT" --tool "$DV_TOOL" --executor "$DV_EXECUTOR"

    # The explicit --run-dir keeps every tier's tree separate and means
    # run_dv.py never creates a `latest` symlink. A group item already runs
    # through the regression scheduler, so --reseed is only added when the
    # caller asks for more than one seed per test.
    #
    # The step variables are DV_-prefixed because the simulation inherits
    # this environment: cocotb reads a bare COVERAGE variable as a request
    # for Python coverage collection and aborts when the module is absent.
    - name: Run DV tests
      shell: bash
      env:
        DV_DUT: ${{ inputs.dut }}
        DV_TOOL: ${{ inputs.tool }}
        DV_ITEMS: ${{ inputs.items }}
        DV_RESEED: ${{ inputs.reseed }}
        DV_COVERAGE: ${{ inputs.coverage }}
        DV_SIM_JOBS: ${{ inputs.sim-jobs }}
        DV_RUN_DIR: ${{ inputs.run-dir }}
        DV_EXECUTOR: ${{ inputs.executor }}
        DV_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        sim_jobs="$DV_SIM_JOBS"
        if [ "$sim_jobs" = "nproc" ]; then
          sim_jobs="$(nproc)"
        fi
        tier_args=()
        if [ "$DV_RESEED" -gt 1 ]; then
          tier_args+=(--reseed "$DV_RESEED")
        fi
        if [ "$DV_COVERAGE" = "true" ]; then
          tier_args+=(--cov)
        fi
        read -r -a extra_args <<<"$DV_EXTRA_ARGS"
        # Build parallelism is independent of sim fan-out, but run_dv.py falls
        # back to --sim-jobs when --build-jobs is absent (effective_build_jobs in
        # runlib/buildcache.py) -- which would compile the C++ model with just
        # -j2 on the smoke tier. Pin it to the runner's core count so the model
        # build uses the whole machine, and so it scales automatically on a
        # larger runner.
        exec python3 tools/dv/run_dv.py \
          --dut "$DV_DUT" \
          --items "$DV_ITEMS" \
          --tool "$DV_TOOL" \
          --sim-jobs "$sim_jobs" \
          --build-jobs "$(nproc)" \
          --run-dir "$DV_RUN_DIR" \
          --executor "$DV_EXECUTOR" \
          "${tier_args[@]}" "${extra_args[@]}"

    # run_dv.py already exits nonzero on FAIL/ERROR/TIMEOUT/UNKNOWN; this
    # gate is defense-in-depth so the job can never go green without a
    # native schema-v1 PASS record matching this exact invocation. On a
    # cluster executor it also requires every simulation leaf to carry a job
    # of that executor in a terminal scheduler state, so a run the executor
    # silently served in-process cannot pass as a scheduler qualification.
    - name: Gate on native result
      shell: bash
      env:
        DV_DUT: ${{ inputs.dut }}
        DV_TOOL: ${{ inputs.tool }}
        DV_COVERAGE: ${{ inputs.coverage }}
        DV_RUN_DIR: ${{ inputs.run-dir }}
        DV_EXECUTOR: ${{ inputs.executor }}
      run: |
        require_coverage=false
        if [ "$DV_COVERAGE" = "true" ]; then
          require_coverage=true
        fi
        jq -e \
          --arg flow "$DV_DUT" \
          --arg tool "$DV_TOOL" \
          --arg executor "$DV_EXECUTOR" \
          --argjson require_coverage "$require_coverage" \
          '.schema_version == 1
           and .flow == $flow
           and .tool == $tool
           and .executor == $executor
           and .status == "PASS"
           and ($executor == "local" or (
             ([.stages[] | select(.name == "sim")] | length > 0)
             and all(.stages[] | select(.name == "sim");
               .metadata.scheduler.driver == $executor
               and (.metadata.scheduler.job_id | type == "string" and length > 0)
               and (.metadata.scheduler.state | IN("SUCCEEDED", "FAILED")))
           ))
           and (($require_coverage | not) or (
             .coverage.enabled == true
             and (.coverage.total_percent | type == "number")
             and (.coverage.report | type == "string" and length > 0)
             and (.coverage.summary | type == "string" and length > 0)
           ))' \
          "$DV_RUN_DIR/result.json"

    # Logs and result.json for every test in the run; result.json is the
    # schema-v1 record that tools/dv/run_dashboard.py collect consumes. The
    # reference-only merged coverage report stays in the artifact, while
    # per-leaf native databases are excluded after merge to keep the
    # artifact bounded. Uploaded even when the run or the gate failed.
    - name: Upload run artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dv-run-${{ inputs.dut }}-${{ inputs.tool }}-${{ inputs.tier }}${{ inputs.label != '' && format('-{0}', inputs.label) || '' }}
        path: |
          ${{ inputs.run-dir }}
          !${{ inputs.run-dir }}/**/coverage/coverage.dat
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ignore
