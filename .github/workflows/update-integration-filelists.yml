# Automatic refresh of the integration filelists.
# Weekly, Monday 09:37 UTC. The commit and pull request are
# .github/actions/open-update-pr; this file owns the schedule and the
# regenerate step.

name: Update integration filelists

on:
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:

concurrency:
  group: update-integration-filelists
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}

      - name: Checkout submodules
        run: git submodule update --init

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      # The committed filelists must match what the ocah-container image's
      # bender generates, and their formatting differs across bender releases.
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Resolve the container's Bender version
        id: bender-version
        run: echo "version=$(./scripts/ci/container_tool_version.sh bender)" >> "$GITHUB_OUTPUT"

      - name: Install Bender
        uses: pulp-platform/pulp-actions/bender-install@v2.5.1
        with:
          version: ${{ steps.bender-version.outputs.version }}

      - name: Regenerate filelists
        run: make update-integration-filelists

      - name: Open update pull request
        uses: ./.github/actions/open-update-pr
        with:
          paths: integration/filelists
          branch: automation/update-integration-filelists
          message: "integration: Regenerate subsystem filelists"
          current-message: Integration filelists are current.
          body: |
            ## Summary
            Regenerate the committed integration simulation, synthesis, and emulation filelists.

            ## Test plan
            `make update-integration-filelists CHECK=1`
