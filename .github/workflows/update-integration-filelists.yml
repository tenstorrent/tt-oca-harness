name: Update integration filelists

on:
  schedule:
    - cron: "37 9 * * 1"
  workflow_dispatch:

concurrency:
  group: update-integration-filelists
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}

      - name: Checkout submodules
        run: git submodule update --init

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      # The committed filelists must match what the ocah-container image's
      # bender generates, and their formatting differs across bender releases.
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Resolve the container's Bender version
        id: bender-version
        run: echo "version=$(./scripts/ci/container_tool_version.sh bender)" >> "$GITHUB_OUTPUT"

      - name: Install Bender
        uses: pulp-platform/pulp-actions/bender-install@v2.5.1
        with:
          version: ${{ steps.bender-version.outputs.version }}

      - name: Regenerate filelists
        run: python3 scripts/update_integration_filelists.py

      - name: Open update pull request
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- integration/filelists)" ]; then
            echo "Integration filelists are current."
            exit 0
          fi

          branch=automation/update-integration-filelists
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integration/filelists
          git commit -m "integration: Regenerate subsystem filelists"
          git push --force-with-lease origin "HEAD:$branch"

          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --reviewer aottavianoTT \
              --title "integration: Regenerate subsystem filelists" \
              --body "$(cat <<'EOF'
          ## Summary
          Regenerate the committed integration simulation and synthesis filelists.

          ## Test plan
          `python3 scripts/update_integration_filelists.py --check`
          EOF
          )"
          else
            gh pr edit "$pr" --add-reviewer aottavianoTT
          fi
