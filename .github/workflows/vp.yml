name: virtual platform

# Label scheduled and manually dispatched runs in the Actions list; PR and push
# runs yield an empty run-name, which falls back to the default event-specific
# title (PR title / commit message).
run-name: ${{ github.event_name == 'schedule' && 'virtual platform nightly (scheduled)' || github.event_name == 'workflow_dispatch' && 'virtual platform (manual dispatch)' || '' }}

# The native legs are the pull-request gate: every PR runs them, and the
# required checks `sep-vp (native)` and `smc-vp + smu-vp (native)` must pass to
# merge. A required check whose workflow never starts blocks the PR, so
# pull_request carries no paths filter; diff-class skips the legs instead for a
# documentation-only diff, and a skipped job satisfies a required check.
#
# The container legs are post-merge only: a push to main that touches the VP,
# the nightly, and manual dispatch. They prove the toolchain image can still
# build and run the VPs. The native legs run on those events too, which keeps
# main's dependency cache current for the PR runs that restore from it. The
# nightly catches drift no path filter can see: the image's floating apt
# packages, and the tt-oca-harness-model submodule moving under us.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'virtual_platform/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'ocah_deps.nix'
      - 'nix/**'
      - 'scripts/docker-run.sh'
      - 'hw/sys/sep/bootrom/**'
      - '.gitmodules'
      - '.github/workflows/vp.yml'
  schedule:
    # 19:00 UTC, an hour after sim's nightly so the two do not contend for runners.
    - cron: "0 19 * * *"
  workflow_dispatch:

# Superseded PR runs are cancelled; a VP run is too heavy to let stale PR pushes
# pile up. The event name is part of the group so a push to main can never cancel
# an in-flight scheduled nightly, and only PR runs are ever auto-cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only a pull request is classified: push runs are already path-filtered, and
  # schedule and dispatch always run everything.
  diff-class:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      run_hardware_ci: ${{ steps.diff-class.outputs.run_hardware_ci }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: diff-class
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 scripts/ci/diff_class.py --github-output >> "$GITHUB_OUTPUT"
          else
            echo "run_hardware_ci=true" >> "$GITHUB_OUTPUT"
          fi

  # The suites that read checked-in data only.
  vp-host-tests:
    name: vp host tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Both, for different reasons: the uv workspace names tt-oca-manifest as a
      # member, so `uv sync` cannot parse the project without it, and
      # test_efuse_map_drift reads the model's eFuse header.
      - name: Check out the submodules
        run: |
          git submodule update --init \
            virtual_platform/tt-oca-harness-model \
            hw/sys/sep/bootrom/prod/tools/tt-oca-manifest

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # pytest exits 5 when the marker selects nothing, so a mis-marked suite
      # fails here rather than passing silently on an empty run.
      - name: Run the host-only tests
        run: make -C virtual_platform vp-test-host

  sep-vp-native:
    name: sep-vp (native)
    needs: [diff-class]
    # Fail closed: a diff-class failure leaves the output empty, which runs the
    # leg rather than skipping it into a passing required check.
    if: ${{ !cancelled() && needs.diff-class.outputs.run_hardware_ci != 'false' }}
    runs-on: ${{ vars.VP_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions: { contents: read }
    env:
      OCAH_ENGINE: docker
      OCAH_IMAGE_WITH_UV: "true"
    steps:
      # A local composite action is loaded from the checked-out tree, so the
      # checkout cannot live inside it.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the native leg
        uses: ./.github/actions/vp-sep-leg
        with:
          mode: native
          vp_container: "0"
          local_dir: virtual_platform/local
          build_dir: virtual_platform/tt-oca-harness-model/vp/build

  sep-vp-container:
    name: sep-vp (container)
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.VP_CI_RUNNER || 'ubuntu-latest' }}
    # push and schedule wait up to three hours for a container run on main to
    # publish this tree's tag, then still have the native leg's budget to build
    # and test.
    timeout-minutes: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 240 || 60 }}
    permissions: { contents: read, packages: read, actions: read }
    env:
      OCAH_ENGINE: docker
      OCAH_IMAGE_WITH_UV: "true"
      OCAH_CONTAINER_REGISTRY_IMAGE: ghcr.io/tenstorrent/ocah-container
      OCAH_IMAGE_FALLBACK: build
    steps:
      # A local composite action is loaded from the checked-out tree, so the
      # checkout cannot live inside it.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the container leg
        uses: ./.github/actions/vp-sep-leg
        with:
          mode: container
          vp_container: "1"
          local_dir: virtual_platform/local-ctr
          build_dir: virtual_platform/tt-oca-harness-model/vp/build-ctr

  # ---------------------------------------------------------------------------
  # smc-vp + smu-vp. Separate jobs from sep-vp: they need their own disk for the
  # Whisper build, and a Whisper failure must not take out the sep-vp build
  # everyone depends on.
  #
  # One job per environment builds BOTH targets: one Whisper serves both, and
  # both come out of one configured tree (see SMC_BUILD_DIR in
  # virtual_platform/Makefile).
  #
  # The container leg covers hosts with no usable native toolchain; the native
  # leg covers the path virtual_platform/README.md leads most users down, and is
  # the only one that catches native-only faults. The two never share artifacts:
  # VP_ENV_TAG suffixes the container leg's local-ctr/ and vp/build_smc-ctr,
  # Whisper archives and smu-vp's companion .so included.
  # ---------------------------------------------------------------------------
  smc-smu-native:
    name: smc-vp + smu-vp (native)
    needs: [diff-class]
    # Fail closed: a diff-class failure leaves the output empty, which runs the
    # leg rather than skipping it into a passing required check.
    if: ${{ !cancelled() && needs.diff-class.outputs.run_hardware_ci != 'false' }}
    runs-on: ${{ vars.VP_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions: { contents: read }
    env:
      OCAH_ENGINE: docker
      OCAH_IMAGE_WITH_UV: "true"
    steps:
      # A local composite action is loaded from the checked-out tree, so the
      # checkout cannot live inside it.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the native leg
        uses: ./.github/actions/vp-smc-smu-leg
        with:
          mode: native
          vp_container: "0"
          local_dir: virtual_platform/local
          build_dir: virtual_platform/tt-oca-harness-model/vp/build_smc

  smc-smu-container:
    name: smc-vp + smu-vp (container)
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.VP_CI_RUNNER || 'ubuntu-latest' }}
    # push and schedule wait up to three hours for a container run on main to
    # publish this tree's tag, then still have the original hour to build.
    timeout-minutes: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 240 || 60 }}
    permissions: { contents: read, packages: read, actions: read }
    env:
      OCAH_ENGINE: docker
      OCAH_IMAGE_WITH_UV: "true"
      OCAH_CONTAINER_REGISTRY_IMAGE: ghcr.io/tenstorrent/ocah-container
      OCAH_IMAGE_FALLBACK: build
    steps:
      # A local composite action is loaded from the checked-out tree, so the
      # checkout cannot live inside it.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the container leg
        uses: ./.github/actions/vp-smc-smu-leg
        with:
          mode: container
          vp_container: "1"
          local_dir: virtual_platform/local-ctr
          build_dir: virtual_platform/tt-oca-harness-model/vp/build_smc-ctr
