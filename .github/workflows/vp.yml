name: vp

# Label scheduled and manually dispatched runs in the Actions list; PR and push
# runs yield an empty run-name, which falls back to the default event-specific
# title (PR title / commit message).
run-name: ${{ github.event_name == 'schedule' && 'vp nightly (scheduled)' || github.event_name == 'workflow_dispatch' && 'vp (manual dispatch)' || '' }}

# Path-gated on PRs: a cold run builds SystemC and CCI from source, so it is far
# too heavy to pay on every unrelated change. The nightly on main is what catches
# drift the path filter cannot see - the image's floating apt packages, and the
# tt-oca-harness-model submodule moving under us.
#
# GitHub Actions does not support YAML anchors, so the paths list is spelled out
# twice. Keep the two copies in sync.
on:
  pull_request:
    paths:
      - 'virtual_platform/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'ocah_deps.nix'
      - 'nix/**'
      - 'scripts/docker-run.sh'
      - 'hw/sys/sep/bootrom/**'
      - '.gitmodules'
      - '.github/workflows/vp.yml'
  push:
    branches: [main]
    paths:
      - 'virtual_platform/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'ocah_deps.nix'
      - 'nix/**'
      - 'scripts/docker-run.sh'
      - 'hw/sys/sep/bootrom/**'
      - '.gitmodules'
      - '.github/workflows/vp.yml'
  schedule:
    # 19:00 UTC, an hour after sim's nightly so the two do not contend for runners.
    - cron: "0 19 * * *"
  workflow_dispatch:

# Superseded PR runs are cancelled; a VP run is too heavy to let stale PR pushes
# pile up. The event name is part of the group so a push to main can never cancel
# an in-flight scheduled nightly, and only PR runs are ever auto-cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sep-vp:
    name: sep-vp (${{ matrix.mode }})
    # A label with no matching runner does NOT fail fast -- the job queues until
    # it times out. So the default stays the always-present standard runner, and
    # the VP_CI_RUNNER repo variable promotes it, with no workflow edit either
    # way, once a larger-runner label is confirmed in the org's runner settings:
    #
    #   gh variable set VP_CI_RUNNER --body ubuntu-latest-16-cores
    runs-on: ${{ vars.VP_CI_RUNNER || 'ubuntu-latest' }}
    # A cold run is dominated by SystemC + CCI from source, which both legs pay.
    timeout-minutes: 90
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        # container: VP_CONTAINER=1, everything inside the nix-built OCAH
        #            image, for hosts with no usable native C++20 toolchain.
        #            Its SystemC, CCI, Boost, OpenSSL and Whisper come from
        #            ocah_deps.nix, so this leg builds no dependencies.
        # native:    built on the runner against apt g++/Boost/OpenSSL, the path
        #            virtual_platform/README.md leads most users down.
        #
        # The two never share artifacts: VP_ENV_TAG suffixes the container leg's
        # local-ctr/ and vp/build-ctr.
        include:
          - mode: container
            vp_container: 1
            local_dir: virtual_platform/local-ctr
            build_dir: virtual_platform/tt-oca-harness-model/vp/build-ctr
          - mode: native
            vp_container: 0
            local_dir: virtual_platform/local
            build_dir: virtual_platform/tt-oca-harness-model/vp/build
    env:
      # The runner image ships both podman and docker; pin one so the engine does
      # not change under us when the image is updated.
      OCAH_ENGINE: docker
      # Fork PRs never receive secrets, and tt-oca-harness-model is private. Gate
      # on this rather than failing every fork PR at checkout.
      HAVE_SUBMODULE_TOKEN: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT != '' && 'true' || 'false' }}
    steps:
      # Feeds docker-run.sh's tarball cache, which actions/cache then persists.
      # The runner context is not available in a job's env: block, so the value
      # is set here instead.
      - name: Point the image cache at the runner temp dir
        run: echo "OCAH_DOCKER_CACHE_DIR=$RUNNER_TEMP/ocah-image-cache" >> "$GITHUB_ENV"

      - name: Skip when the submodule token is unavailable
        if: env.HAVE_SUBMODULE_TOKEN != 'true'
        run: |
          {
            echo "### sep-vp (${{ matrix.mode }}): skipped"
            echo
            echo 'The `OCA_BOOT_MANIFEST_OCA_MODEL_PAT` secret is not available to this run'
            echo '(fork PR, or the secret is not configured yet). The VP needs the'
            echo 'private `tt-oca-harness-model` and `tt-oca-manifest` submodules,'
            echo 'which the default `GITHUB_TOKEN` cannot reach.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: actions/checkout@v4

      # Both submodules are private: tt-oca-harness-model is the simulator, and
      # the bootcode tests read tt-oca-manifest's src/oca/constants.py as the
      # authority for the manifest layout.
      #
      # Deliberately NOT actions/checkout's `submodules`/`token` inputs. That
      # `token` replaces the credential for the MAIN repository fetch too, and
      # this PAT grants the two submodule repositories but NOT tt-oca-harness,
      # so the repository's own checkout fails with
      # "remote: Write access to repository not granted".
      #
      # .gitmodules addresses both over SSH, which a hosted runner has no key
      # for, so rewrite that remote to HTTPS carrying the PAT. The rewrite is
      # undone afterwards so the credential does not outlive the step.
      - name: Check out the private submodules
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        env:
          OCA_PAT: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}
        run: |
          set -euo pipefail
          rewrite='url.https://x-access-token:'"${OCA_PAT}"'@github.com/'
          cleanup() { git config --global --remove-section "$rewrite" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          git config --global "${rewrite}.insteadOf" 'git@github.com:'
          git submodule update --init --recursive \
            virtual_platform/tt-oca-harness-model \
            hw/sys/sep/bootrom/prod/tools/tt-oca-manifest
          # Fail here rather than deep into a configure or a test import.
          test -d virtual_platform/tt-oca-harness-model/vp
          test -f hw/sys/sep/bootrom/prod/tools/tt-oca-manifest/src/oca/constants.py

      # docker-run.sh runs nix locally when a nix binary is on PATH, and falls
      # back to pulling docker.io/nixos/nix and building inside it otherwise.
      # The fallback builds the whole closure from scratch on every job and does
      # not finish inside the budget, so install nix on the runner -- the same
      # step and action lint.yml uses. access-tokens lets nix reach the private
      # submodule repositories when it resolves the flake's inputs.
      - name: Install Nix
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}

      - name: Install VP build dependencies
        if: env.HAVE_SUBMODULE_TOKEN == 'true' && matrix.mode == 'native'
        run: |
          # Acquire options: the hosted-runner mirror list falls back from
          # azure.archive.ubuntu.com to archive.ubuntu.com, but apt only fails over
          # on a connection *error* -- a silently stalled mirror otherwise hangs apt
          # until the job timeout. The Timeout option turns a stall into an error so
          # the retry/failover machinery actually runs.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            install -y --no-install-recommends \
            g++ cmake autoconf automake wget zlib1g-dev \
            libboost-iostreams-dev libboost-program-options-dev libboost-log-dev \
            libssl-dev \
            gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      # local*/ holds SystemC and CCI compiled by a specific g++, and
      # VP_CONFIG_SIG invalidation only wipes build*/, never local*/. A local/
      # restored from a cache built by a different compiler would be reused
      # as-is and could ODR-mismatch, so the compiler identity is part of the
      # key: the nix inputs for the container leg, since they pin its compiler,
      # and the runner's own g++ for the native one. Only the native leg uses
      # the result -- see the cache step below.
      - name: Compute dependency cache key
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        id: depkey
        run: |
          if [ "${{ matrix.mode }}" = "container" ]; then
            cxx_id="nixinputs-${{ hashFiles('flake.nix', 'flake.lock', 'ocah_deps.nix', 'nix/**') }}"
          else
            cxx_id="$(g++ -dumpmachine)-$(g++ -dumpversion)"
          fi
          echo "cxx_id=$cxx_id" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain image
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ocah-image-cache
          key: ocah-image-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'ocah_deps.nix', 'nix/**') }}

      # Only the native leg builds dependencies, so only it has anything to
      # cache. The container carries SystemC,
      # CCI, Boost, OpenSSL and Whisper from ocah_deps.nix and exports their
      # prefixes, so the container leg resolves every one as explicit and builds
      # none of them.
      - name: Cache VP dependencies
        if: env.HAVE_SUBMODULE_TOKEN == 'true' && matrix.mode == 'native'
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.local_dir }}
            virtual_platform/downloads
          key: vp-deps-${{ matrix.mode }}-${{ steps.depkey.outputs.cxx_id }}-${{ hashFiles('virtual_platform/Makefile') }}

      # PYTHON defaults to $OCAH_ROOT/.venv/bin/python, which vp-py-deps
      # populates. Doing it in its own step rather than letting vp-test's import
      # guard trigger it keeps a dependency failure off the test step.
      - name: Install uv
        if: env.HAVE_SUBMODULE_TOKEN == 'true' && matrix.mode == 'native'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Sync harness Python deps
        if: env.HAVE_SUBMODULE_TOKEN == 'true' && matrix.mode == 'native'
        run: make -C virtual_platform vp-py-deps

      # `ensure`, not `build`: build always rebuilds, ensure reuses a matching
      # local image, then the cached tarball, then builds and publishes. The
      # native leg needs it too -- fw_make dispatches the ROM/DV firmware builds
      # to `docker-run.sh run-here` when the host toolchain lacks picolibc.
      - name: Provision toolchain image
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: ./scripts/docker-run.sh ensure

      - name: Check toolchains
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: |
          if [ "${{ matrix.mode }}" = "container" ]; then
            ./scripts/docker-run.sh verify
            ./scripts/docker-run.sh run-here sh -c 'g++ --version | head -1; cmake --version | head -1'
          else
            make -C virtual_platform check-cxx
          fi
          # The same probe fw_make uses, run where fw_make will run it: in the
          # container for the container leg, on the runner for the native one.
          # Reports whether this leg builds firmware in place or falls back to
          # the container, rather than leaving it to a build log.
          probe="echo 'int main(void){return 0;}' | riscv64-unknown-elf-gcc --specs=picolibc.specs -x c -c - -o /dev/null"
          if [ "${{ matrix.mode }}" = "container" ]; then
            run_probe() { ./scripts/docker-run.sh run-here sh -c "$probe"; }
            where="in the container"
          else
            run_probe() { sh -c "$probe"; }
            where="on the runner"
          fi
          if run_probe 2>/dev/null; then
            echo "picolibc: riscv64-unknown-elf-gcc works $where; firmware builds there" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "picolibc: no usable riscv64-unknown-elf-gcc $where; fw_make falls back to \`docker-run.sh run-here\`" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build sep-vp
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: make -C virtual_platform vp VP_CONTAINER=${{ matrix.vp_container }} NPROC="$(nproc)"

      # Boost and OpenSSL must come from the system: a fallback to the local
      # Boost build takes 1-2 h, so it is a job timeout rather than a slow
      # success. Fail loudly instead.
      - name: Assert system Boost and OpenSSL were used
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: |
          make -C virtual_platform deps-info VP_CONTAINER=${{ matrix.vp_container }} \
            | tee "$RUNNER_TEMP/deps-info.txt"
          # Lines look like:
          #   [VP]   BOOST_ROOT   = /usr   [system install (BOOST_VERSION >= ...)]
          # Requiring whitespace after /usr keeps a local prefix such as
          # virtual_platform/local-ctr/... from matching.
          for dep in BOOST OPENSSL; do
            if ! grep -qE "^\[VP\][[:space:]]+${dep}_ROOT[[:space:]]*=[[:space:]]*/usr([[:space:]]|$)" "$RUNNER_TEMP/deps-info.txt"; then
              echo "::error::${dep}_ROOT did not resolve to the system install (/usr); see deps-info above"
              exit 1
            fi
          done

      # KNOWN RED: test_ot_manifest_negative[rotate_to_backup] fails -- after
      # rotating to the crafted backup slot the ROM reports an ERROR status
      # instead of reaching SEP_MSG_STARTING_BL1. It is not deselected, so this
      # job stays red until the ROM is fixed; do not add it to main's required
      # checks before then.
      - name: Run the pytest suites
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: |
          make -C virtual_platform vp-test VP_CONTAINER=${{ matrix.vp_container }} \
            PYTEST_ARGS="--junitxml=$PWD/virtual_platform/pytest-results.xml"

      # Firmware-dependent tests skip cleanly when no toolchain is available, so an
      # all-skipped run would otherwise pass. Gate on tests having actually
      # executed: a green check here must mean the VP really ran.
      - name: Gate on tests having run
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("virtual_platform/pytest-results.xml").getroot()
          suites = root.iter("testsuite") if root.tag == "testsuites" else [root]
          total = skipped = 0
          for s in suites:
              total += int(s.get("tests", 0))
              skipped += int(s.get("skipped", 0))
          ran = total - skipped
          print(f"collected={total} skipped={skipped} ran={ran}")
          if ran == 0:
              sys.exit("no tests actually ran: every test was skipped or none collected")
          PY

      - name: Upload run artifacts
        if: always() && env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vp-${{ matrix.mode }}
          path: |
            virtual_platform/pytest-results.xml
            ${{ runner.temp }}/deps-info.txt
            ${{ matrix.build_dir }}/CMakeCache.txt
            ${{ matrix.build_dir }}/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # smc-vp + smu-vp. Its own job rather than more legs of the sep-vp matrix: it
  # needs its own disk for the Whisper build, and a Whisper failure must not
  # take out the sep-vp build everyone depends on.
  #
  # One job per environment builds BOTH targets: one Whisper serves both, and
  # both come out of one configured tree (see SMC_BUILD_DIR in
  # virtual_platform/Makefile).
  #
  # The container leg covers hosts with no usable native toolchain; the native
  # leg covers the path virtual_platform/README.md leads most users down, and
  # is the only one that catches native-only faults. The two never share
  # artifacts: VP_ENV_TAG suffixes the container leg's local-ctr/ and
  # vp/build_smc-ctr, Whisper archives and smu-vp's companion .so included.
  # ---------------------------------------------------------------------------
  smc-smu-vp:
    name: smc-vp + smu-vp (${{ matrix.mode }})
    runs-on: ${{ vars.VP_CI_RUNNER || 'ubuntu-latest' }}
    # Cold: SystemC + CCI from source, then Whisper, then the tree twice over
    # (all three VPs link the SEP peripheral tree).
    timeout-minutes: 90
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: container
            vp_container: 1
            local_dir: virtual_platform/local-ctr
            build_dir: virtual_platform/tt-oca-harness-model/vp/build_smc-ctr
          - mode: native
            vp_container: 0
            local_dir: virtual_platform/local
            build_dir: virtual_platform/tt-oca-harness-model/vp/build_smc
    env:
      OCAH_ENGINE: docker
      HAVE_SUBMODULE_TOKEN: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT != '' && 'true' || 'false' }}
    steps:
      # See the sep-vp job: the runner context is not available in env:.
      - name: Point the image cache at the runner temp dir
        run: echo "OCAH_DOCKER_CACHE_DIR=$RUNNER_TEMP/ocah-image-cache" >> "$GITHUB_ENV"

      - name: Skip when the submodule token is unavailable
        if: env.HAVE_SUBMODULE_TOKEN != 'true'
        run: |
          {
            echo "### smc-vp + smu-vp (${{ matrix.mode }}): skipped"
            echo
            echo 'The `OCA_BOOT_MANIFEST_OCA_MODEL_PAT` secret is not available to this run'
            echo '(fork PR, or the secret is not configured yet).'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: actions/checkout@v4

      # See the sep-vp job: checkout's `token` would break this repository's own
      # fetch, so the private submodules are initialised separately.
      - name: Check out the private submodules
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        env:
          OCA_PAT: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}
        run: |
          set -euo pipefail
          rewrite='url.https://x-access-token:'"${OCA_PAT}"'@github.com/'
          cleanup() { git config --global --remove-section "$rewrite" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          git config --global "${rewrite}.insteadOf" 'git@github.com:'
          git submodule update --init --recursive \
            virtual_platform/tt-oca-harness-model \
            hw/sys/sep/bootrom/prod/tools/tt-oca-manifest
          test -d virtual_platform/tt-oca-harness-model/vp

      # Identical to the sep-vp native leg's set: smc-vp and smu-vp need no
      # extra packages. gcc-riscv64-unknown-elf is what the two firmware suites
      # auto-detect; picolibc is not needed for them (they build -ffreestanding
      # -nostdlib) but keeps this list the same as the sep-vp job's.
      # docker-run.sh runs nix locally when a nix binary is on PATH, and falls
      # back to pulling docker.io/nixos/nix and building inside it otherwise.
      # The fallback builds the whole closure from scratch on every job and does
      # not finish inside the budget, so install nix on the runner -- the same
      # step and action lint.yml uses. access-tokens lets nix reach the private
      # submodule repositories when it resolves the flake's inputs.
      - name: Install Nix
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}

      - name: Install VP build dependencies
        if: env.HAVE_SUBMODULE_TOKEN == 'true' && matrix.mode == 'native'
        run: |
          # Acquire options: turn a stalled mirror into an error so apt's
          # retry/failover actually runs instead of hanging to the job timeout.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            install -y --no-install-recommends \
            g++ cmake autoconf automake wget zlib1g-dev \
            libboost-iostreams-dev libboost-program-options-dev libboost-log-dev \
            libssl-dev \
            gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      - name: Read the pinned Whisper revision
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        id: whisper
        run: |
          # Ask make for the resolved value rather than parsing the Makefile:
          # WHISPER_REV is read from the model's own CI workflow at expansion
          # time, so there is no literal here to grep. Resolving it the same way
          # the build does keeps the cache key from ever describing a different
          # revision than the one built.
          rev="$(make -s -C virtual_platform print-WHISPER_REV)"
          [ -n "$rev" ] || { echo "::error::WHISPER_REV resolved empty; is the tt-oca-harness-model submodule checked out?"; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "WHISPER_REV=$rev" >> "$GITHUB_STEP_SUMMARY"

      # As in the sep-vp job, but local*/ here also holds the Whisper archives:
      # the compiler identity is part of the key because VP_CONFIG_SIG
      # invalidation only wipes build*/, never local*/.
      - name: Compute dependency cache key
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        id: depkey
        run: |
          if [ "${{ matrix.mode }}" = "container" ]; then
            cxx_id="nixinputs-${{ hashFiles('flake.nix', 'flake.lock', 'ocah_deps.nix', 'nix/**') }}"
          else
            cxx_id="$(g++ -dumpmachine)-$(g++ -dumpversion)"
          fi
          echo "cxx_id=$cxx_id" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain image
        if: env.HAVE_SUBMODULE_TOKEN == 'true' && matrix.mode == 'container'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ocah-image-cache
          key: ocah-image-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'ocah_deps.nix', 'nix/**') }}

      # Its OWN key, not the sep-vp job's: local*/ here also holds the Whisper
      # tree, so a shared key would let whichever job saved first decide whether
      # Whisper is in the cache at all. The key carries the revision, the
      # PIC-ness, and a recipe version to bump when the set of archives changes.
      # Native leg only; the container gets Whisper from ocah_deps.nix too.
      - name: Cache VP dependencies (including Whisper)
        if: env.HAVE_SUBMODULE_TOKEN == 'true' && matrix.mode == 'native'
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.local_dir }}
            virtual_platform/downloads
          key: vp-deps-smc-${{ matrix.mode }}-${{ steps.depkey.outputs.cxx_id }}-${{ hashFiles('virtual_platform/Makefile') }}-whisper-${{ steps.whisper.outputs.rev }}-pic-libs4

      # A cache hit is not proof the tree is usable: actions/cache saves the
      # directory in a post-job step even when the job FAILED, so a restored
      # cache can carry the Makefile's completeness stamp beside a tree that
      # lost archives. Drop the stamp unless all four are really there, so make
      # rebuilds instead of trusting it.
      - name: Invalidate the Whisper stamp unless all four archives are present
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: |
          tree="${{ matrix.local_dir }}/whisper-${{ steps.whisper.outputs.rev }}-pic"
          stamp="${{ matrix.local_dir }}/.whisper-${{ steps.whisper.outputs.rev }}-pic-complete"
          complete=true
          for lib in "build-$(uname -s)/librvcore.a" \
                     virtual_memory/libvirtual_memory.a \
                     pci/libpci.a \
                     third_party/softfloat/build/RISCV-GCC/softfloat.a; do
            if [ ! -f "${tree}/${lib}" ]; then
              echo "missing: ${lib}"
              complete=false
            fi
          done
          if [ "$complete" = true ]; then
            echo "Whisper archives complete; the cached tree will be reused."
          else
            echo "Whisper tree incomplete or absent; dropping any stamp so make rebuilds."
            rm -f "$stamp"
          fi

      # Container leg only. The native leg here never reaches for the image, as
      # the SMC/SMU firmware suites call the model's runners with plain make and
      # so have no fw_make picolibc fallback to cover.
      - name: Provision toolchain image
        if: env.HAVE_SUBMODULE_TOKEN == 'true' && matrix.mode == 'container'
        run: ./scripts/docker-run.sh ensure

      - name: Check toolchains
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: |
          if [ "${{ matrix.mode }}" = "container" ]; then
            ./scripts/docker-run.sh verify
            ./scripts/docker-run.sh run-here sh -c 'g++ --version | head -1; cmake --version | head -1'
          else
            make -C virtual_platform check-cxx
            # Assert rather than just print: without a cross toolchain the two
            # suites below fail deep inside the model's runner instead of here.
            # A bare `cmd --version | head -1` would not fail the step, since
            # the pipeline's status is head's.
            command -v riscv64-unknown-elf-gcc >/dev/null 2>&1 || {
              echo "::error::riscv64-unknown-elf-gcc is not on PATH; the SMC/SMU firmware suites need it"
              exit 1
            }
            riscv64-unknown-elf-gcc --version | head -1
          fi

      - name: Build smc-vp and smu-vp
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: |
          make -C virtual_platform smc-vp smu-vp \
            VP_CONTAINER=${{ matrix.vp_container }} NPROC="$(nproc)"

      # Boost and OpenSSL as in the sep-vp job. Whisper is asserted the other
      # way round -- it MUST be our managed local build, so a stray
      # WHISPER_HOME in the environment cannot point CI at another tree.
      - name: Assert the expected dependency resolution
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: |
          make -C virtual_platform deps-info VP_CONTAINER=${{ matrix.vp_container }} \
            | tee "$RUNNER_TEMP/deps-info.txt"
          for dep in BOOST OPENSSL; do
            if ! grep -qE "^\[VP\][[:space:]]+${dep}_ROOT[[:space:]]*=[[:space:]]*/usr([[:space:]]|$)" "$RUNNER_TEMP/deps-info.txt"; then
              echo "::error::${dep}_ROOT did not resolve to the system install (/usr); see deps-info above"
              exit 1
            fi
          done
          # The trailing space keeps local-ctr from matching the native leg's
          # expected local/ prefix (and vice versa).
          want="${{ matrix.local_dir }}/whisper-${{ steps.whisper.outputs.rev }}-pic "
          want="${want#virtual_platform/}"
          if ! grep -q "WHISPER_HOME = .*/virtual_platform/${want}.*local (default); .*built" "$RUNNER_TEMP/deps-info.txt"; then
            echo "::error::WHISPER_HOME is not our built local prefix at the pinned revision, for this environment; see deps-info above"
            exit 1
          fi

      # smu-vp's companion DSO is built beside the target, not into bin/, and
      # smu-vp bakes that absolute build-tree path into its RUNPATH. Assert both
      # artifacts exist and that each binary's loader closure is satisfied with
      # a scrubbed environment. The binaries must be inspected in the
      # environment they were built FOR: a container-built VP links the image's
      # glibc and would not load on the runner.
      - name: Check both artifacts and that they load with no LD_LIBRARY_PATH
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: |
          tree="${{ matrix.build_dir }}"
          for f in "$tree/bin/smc-vp" "$tree/bin/smu-vp" "$tree/platform/smu/libsmc_cluster_smu.so"; do
            [ -f "$f" ] || { echo "::error::missing artifact: $f"; exit 1; }
            ls -l "$f"
          done
          # Paths come in as positional args so nothing needs escaping through
          # the container invocation.
          probe='rc=0
          for b in "$@"; do
            n=$(ldd "$b" | grep -c "not found" || true)
            echo "$b: $n unresolved"
            [ "$n" = 0 ] || rc=1
          done
          exit $rc'
          if [ "${{ matrix.mode }}" = "container" ]; then
            ./scripts/docker-run.sh run-here env -i PATH=/usr/bin:/bin HOME=/tmp \
              bash -c "$probe" probe "$PWD/$tree/bin/smc-vp" "$PWD/$tree/bin/smu-vp"
          else
            env -i PATH=/usr/bin:/bin HOME=/tmp \
              bash -c "$probe" probe "$PWD/$tree/bin/smc-vp" "$PWD/$tree/bin/smu-vp"
          fi

      - name: Run the SMC firmware suite
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: |
          make -C virtual_platform smc-test VP_CONTAINER=${{ matrix.vp_container }} \
            2>&1 | tee "$RUNNER_TEMP/smc-test.log"
          # The runner exits non-zero on failure, but a suite that collected
          # nothing must not read as a pass either. Each SMC test prints
          # "PASS:" or "ALL TESTS PASSED".
          ran=$(grep -cE '(^|[[:space:]])(PASS:|ALL TESTS PASSED)' "$RUNNER_TEMP/smc-test.log" || true)
          echo "SMC tests reporting a pass line (${{ matrix.mode }}): $ran" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$ran" -gt 0 ] || { echo "::error::no SMC test reported a pass line"; exit 1; }

      - name: Run the SMU firmware suite
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: |
          make -C virtual_platform smu-test VP_CONTAINER=${{ matrix.vp_container }} \
            2>&1 | tee "$RUNNER_TEMP/smu-test.log"
          # run_smu_vp_tests.sh prints "All SMU-VP tests PASSED" and exits 0
          # even when its test list is empty, so gate on the pass COUNT.
          n=$(sed -n 's/^SMU-VP TEST SUMMARY: \([0-9]\+\) passed.*/\1/p' "$RUNNER_TEMP/smu-test.log" | tail -1)
          echo "SMU tests passed (${{ matrix.mode }}): ${n:-0}" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$n" ] && [ "$n" -gt 0 ] || { echo "::error::no SMU test actually ran"; exit 1; }

      # The DSO travels with the binary. An smu-vp uploaded on its own cannot
      # run anywhere else: its RUNPATH points into this runner's build tree.
      - name: Upload run artifacts
        if: always() && env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vp-smc-smu-${{ matrix.mode }}
          path: |
            ${{ matrix.build_dir }}/bin/smc-vp
            ${{ matrix.build_dir }}/bin/smu-vp
            ${{ matrix.build_dir }}/platform/smu/libsmc_cluster_smu.so
            ${{ matrix.build_dir }}/CMakeCache.txt
            ${{ matrix.build_dir }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/deps-info.txt
            ${{ runner.temp }}/smc-test.log
            ${{ runner.temp }}/smu-test.log
          retention-days: 14
          if-no-files-found: ignore
