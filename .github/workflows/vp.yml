name: vp

# Label scheduled and manually dispatched runs in the Actions list; PR and push
# runs yield an empty run-name, which falls back to the default event-specific
# title (PR title / commit message).
run-name: ${{ github.event_name == 'schedule' && 'vp nightly (scheduled)' || github.event_name == 'workflow_dispatch' && 'vp (manual dispatch)' || '' }}

# Path-gated on PRs: a cold run builds SystemC and CCI from source, so it is far
# too heavy to pay on every unrelated change. The nightly on main is what catches
# drift the path filter cannot see - the image's floating apt packages, and the
# tt-oca-harness-model submodule moving under us.
#
# GitHub Actions does not support YAML anchors, so the paths list is spelled out
# twice. Keep the two copies in sync.
on:
  pull_request:
    paths:
      - 'virtual_platform/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'ocah_deps.nix'
      - 'nix/**'
      - 'scripts/docker-run.sh'
      - 'hw/sys/sep/bootrom/**'
      - '.gitmodules'
      - '.github/workflows/vp.yml'
  push:
    branches: [main]
    paths:
      - 'virtual_platform/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'ocah_deps.nix'
      - 'nix/**'
      - 'scripts/docker-run.sh'
      - 'hw/sys/sep/bootrom/**'
      - '.gitmodules'
      - '.github/workflows/vp.yml'
  schedule:
    # 19:00 UTC, an hour after sim's nightly so the two do not contend for runners.
    - cron: "0 19 * * *"
  workflow_dispatch:

# Superseded PR runs are cancelled; a VP run is too heavy to let stale PR pushes
# pile up. The event name is part of the group so a push to main can never cancel
# an in-flight scheduled nightly, and only PR runs are ever auto-cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suites that read checked-in data only, and the one VP job a pull request
  # runs: everything below needs the nix closure.
  vp-host-tests:
    name: vp host tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    env:
      HAVE_SUBMODULE_TOKEN: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT != '' && 'true' || 'false' }}
    steps:
      - name: Skip when the submodule token is unavailable
        if: env.HAVE_SUBMODULE_TOKEN != 'true'
        run: |
          {
            echo "### vp host tests: skipped"
            echo
            echo 'The `OCA_BOOT_MANIFEST_OCA_MODEL_PAT` secret is not available to this'
            echo 'run (fork PR, or the secret is not configured yet). The uv workspace'
            echo 'names `tt-oca-manifest` as a member, so `uv sync` cannot parse the'
            echo 'project until that private submodule is populated.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: actions/checkout@v4

      # Both, for different reasons: the uv workspace names tt-oca-manifest as a
      # member, so `uv sync` cannot parse the project without it, and
      # test_efuse_map_drift reads the model's eFuse header.
      - name: Check out the private submodules
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        env:
          OCA_PAT: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}
        run: |
          set -euo pipefail
          rewrite='url.https://x-access-token:'"${OCA_PAT}"'@github.com/'
          cleanup() { git config --global --remove-section "$rewrite" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          git config --global "${rewrite}.insteadOf" 'git@github.com:'
          git submodule update --init \
            virtual_platform/tt-oca-harness-model \
            hw/sys/sep/bootrom/prod/tools/tt-oca-manifest

      - name: Install uv
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: astral-sh/setup-uv@v6

      # pytest exits 5 when the marker selects nothing, so a mis-marked suite
      # fails here rather than passing silently on an empty run.
      - name: Run the host-only tests
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: make -C virtual_platform vp-test-host

  # Both container legs resolve the same derivation hash, so one build serves
  # both. The native legs wait on it too: `needs` is per job and cannot address a
  # single matrix leg.
  toolchain-image:
    name: toolchain image
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.VP_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    permissions: { contents: read }
    outputs:
      hash: ${{ steps.image.outputs.hash }}
    env:
      OCAH_ENGINE: docker
      OCAH_IMAGE_WITH_UV: "true"
      HAVE_SUBMODULE_TOKEN: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT != '' && 'true' || 'false' }}
    steps:
      - name: Point the image cache at the runner temp dir
        run: |
          # Created here, not by actions/cache: a cache miss restores nothing and
          # leaves no directory, and docker-run.sh copies the built image into
          # this path without creating it.
          mkdir -p "$RUNNER_TEMP/ocah-image-cache"
          echo "OCAH_DOCKER_CACHE_DIR=$RUNNER_TEMP/ocah-image-cache" >> "$GITHUB_ENV"

      - name: Checkout
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: actions/checkout@v4

      # Both, for different reasons: the uv workspace names tt-oca-manifest as a
      # member, so `uv sync` cannot parse the project without it, and
      # test_efuse_map_drift reads the model's eFuse header.
      - name: Check out the private submodules
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        env:
          OCA_PAT: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}
        run: |
          set -euo pipefail
          rewrite='url.https://x-access-token:'"${OCA_PAT}"'@github.com/'
          cleanup() { git config --global --remove-section "$rewrite" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          git config --global "${rewrite}.insteadOf" 'git@github.com:'
          git submodule update --init \
            virtual_platform/tt-oca-harness-model \
            hw/sys/sep/bootrom/prod/tools/tt-oca-manifest

      - name: Free disk space for the nix build
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: |
          echo "before:"; df -h / | tail -1
          # Everything here is preinstalled runner content these jobs never use.
          # hostedtoolcache goes entirely: the steps that want it run later and
          # re-fetch, and the container carries its own python and node.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/hostedtoolcache \
                      /usr/share/swift /usr/lib/jvm /usr/share/miniconda || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      # The image closure builds gcc, boost and openssl from source and outgrows
      # the root volume. Relocate the store onto a larger volume where one exists;
      # the current hosted image has only /, so there this prints the layout and
      # moves nothing.
      - name: Put the nix store on the largest volume
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: |
          df -h
          root_free=$(df --output=avail -k / | tail -1)
          for cand in /mnt /datadisk; do
            [ -d "$cand" ] || continue
            cand_free=$(df --output=avail -k "$cand" | tail -1)
            [ "$cand_free" -gt "$root_free" ] || continue
            echo "nix store -> $cand (${cand_free}K free, / has ${root_free}K)"
            sudo mkdir -p "$cand/nix" /nix
            sudo mount --bind "$cand/nix" /nix
            break
          done
          df -h /nix 2>/dev/null || true

      # docker-run.sh runs nix locally when a nix binary is on PATH, and falls
      # back to pulling docker.io/nixos/nix and building inside it otherwise.
      # The fallback builds the whole closure from scratch on every job and does
      # not finish inside the budget, so install nix on the runner -- the same
      # step and action lint.yml uses. access-tokens lets nix reach the private
      # submodule repositories when it resolves the flake's inputs.
      - name: Install Nix
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}

      - name: Identify the toolchain image
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        id: image
        run: |
          hash="$(./scripts/docker-run.sh image-hash)"
          # An empty or malformed hash still keys a cache, so every run would
          # miss and rebuild while appearing to cache.
          case "$hash" in
            [a-z0-9][a-z0-9]*) ;;
            *) echo "::error::image-hash returned '$hash'"; exit 1 ;;
          esac
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "toolchain image: $hash" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore toolchain image
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ocah-image-cache
          key: ocah-image-${{ runner.os }}-${{ steps.image.outputs.hash }}

      # Only the native leg builds dependencies, so only it has anything to
      # cache. The container carries SystemC,
      # CCI, Boost, OpenSSL and Whisper from ocah_deps.nix and exports their
      # prefixes, so the container leg resolves every one as explicit and builds
      # none of them.
      - name: Provision toolchain image
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        run: ./scripts/docker-run.sh ensure

      # actions/cache writes only when the whole job succeeds, so saving here is
      # what keeps a failing suite from discarding the image.
      - name: Save toolchain image
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ocah-image-cache
          key: ocah-image-${{ runner.os }}-${{ steps.image.outputs.hash }}
  sep-vp-native:
    name: sep-vp (native)
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.VP_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    permissions: { contents: read }
    env:
      OCAH_ENGINE: docker
      OCAH_IMAGE_WITH_UV: "true"
      HAVE_SUBMODULE_TOKEN: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT != '' && 'true' || 'false' }}
    steps:
      - name: Skip when the submodule token is unavailable
        if: env.HAVE_SUBMODULE_TOKEN != 'true'
        run: |
          {
            echo "### sep-vp (native): skipped"
            echo
            echo 'The `OCA_BOOT_MANIFEST_OCA_MODEL_PAT` secret is not available to this run'
            echo '(fork PR, or the secret is not configured yet). The VP needs the'
            echo 'private `tt-oca-harness-model` and `tt-oca-manifest` submodules.'
          } >> "$GITHUB_STEP_SUMMARY"

      # A local composite action is loaded from the checked-out tree, so the
      # checkout cannot live inside it.
      - name: Checkout
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: actions/checkout@v4

      - name: Run the native leg
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: ./.github/actions/vp-sep-leg
        with:
          mode: native
          vp_container: "0"
          local_dir: virtual_platform/local
          build_dir: virtual_platform/tt-oca-harness-model/vp/build
          oca_pat: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}

  sep-vp-container:
    name: sep-vp (container)
    if: github.event_name != 'pull_request'
    needs: toolchain-image
    runs-on: ${{ vars.VP_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    permissions: { contents: read }
    env:
      OCAH_ENGINE: docker
      OCAH_IMAGE_WITH_UV: "true"
      HAVE_SUBMODULE_TOKEN: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT != '' && 'true' || 'false' }}
    steps:
      - name: Skip when the submodule token is unavailable
        if: env.HAVE_SUBMODULE_TOKEN != 'true'
        run: |
          {
            echo "### sep-vp (container): skipped"
            echo
            echo 'The `OCA_BOOT_MANIFEST_OCA_MODEL_PAT` secret is not available to this run'
            echo '(fork PR, or the secret is not configured yet). The VP needs the'
            echo 'private `tt-oca-harness-model` and `tt-oca-manifest` submodules.'
          } >> "$GITHUB_STEP_SUMMARY"

      # A local composite action is loaded from the checked-out tree, so the
      # checkout cannot live inside it.
      - name: Checkout
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: actions/checkout@v4

      - name: Run the container leg
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: ./.github/actions/vp-sep-leg
        with:
          mode: container
          vp_container: "1"
          local_dir: virtual_platform/local-ctr
          build_dir: virtual_platform/tt-oca-harness-model/vp/build-ctr
          oca_pat: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}
          image_hash: ${{ needs['toolchain-image'].outputs.hash }}

  # ---------------------------------------------------------------------------
  # smc-vp + smu-vp. Separate jobs from sep-vp: they need their own disk for the
  # Whisper build, and a Whisper failure must not take out the sep-vp build
  # everyone depends on.
  #
  # One job per environment builds BOTH targets: one Whisper serves both, and
  # both come out of one configured tree (see SMC_BUILD_DIR in
  # virtual_platform/Makefile).
  #
  # The container leg covers hosts with no usable native toolchain; the native
  # leg covers the path virtual_platform/README.md leads most users down, and is
  # the only one that catches native-only faults. The two never share artifacts:
  # VP_ENV_TAG suffixes the container leg's local-ctr/ and vp/build_smc-ctr,
  # Whisper archives and smu-vp's companion .so included.
  # ---------------------------------------------------------------------------
  smc-smu-native:
    name: smc-vp + smu-vp (native)
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.VP_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    permissions: { contents: read }
    env:
      OCAH_ENGINE: docker
      OCAH_IMAGE_WITH_UV: "true"
      HAVE_SUBMODULE_TOKEN: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT != '' && 'true' || 'false' }}
    steps:
      - name: Skip when the submodule token is unavailable
        if: env.HAVE_SUBMODULE_TOKEN != 'true'
        run: |
          {
            echo "### smc-vp + smu-vp (native): skipped"
            echo
            echo 'The `OCA_BOOT_MANIFEST_OCA_MODEL_PAT` secret is not available to this run'
            echo '(fork PR, or the secret is not configured yet). The VP needs the'
            echo 'private `tt-oca-harness-model` and `tt-oca-manifest` submodules.'
          } >> "$GITHUB_STEP_SUMMARY"

      # A local composite action is loaded from the checked-out tree, so the
      # checkout cannot live inside it.
      - name: Checkout
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: actions/checkout@v4

      - name: Run the native leg
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: ./.github/actions/vp-smc-smu-leg
        with:
          mode: native
          vp_container: "0"
          local_dir: virtual_platform/local
          build_dir: virtual_platform/tt-oca-harness-model/vp/build_smc
          oca_pat: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}

  smc-smu-container:
    name: smc-vp + smu-vp (container)
    if: github.event_name != 'pull_request'
    needs: toolchain-image
    runs-on: ${{ vars.VP_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    permissions: { contents: read }
    env:
      OCAH_ENGINE: docker
      OCAH_IMAGE_WITH_UV: "true"
      HAVE_SUBMODULE_TOKEN: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT != '' && 'true' || 'false' }}
    steps:
      - name: Skip when the submodule token is unavailable
        if: env.HAVE_SUBMODULE_TOKEN != 'true'
        run: |
          {
            echo "### smc-vp + smu-vp (container): skipped"
            echo
            echo 'The `OCA_BOOT_MANIFEST_OCA_MODEL_PAT` secret is not available to this run'
            echo '(fork PR, or the secret is not configured yet). The VP needs the'
            echo 'private `tt-oca-harness-model` and `tt-oca-manifest` submodules.'
          } >> "$GITHUB_STEP_SUMMARY"

      # A local composite action is loaded from the checked-out tree, so the
      # checkout cannot live inside it.
      - name: Checkout
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: actions/checkout@v4

      - name: Run the container leg
        if: env.HAVE_SUBMODULE_TOKEN == 'true'
        uses: ./.github/actions/vp-smc-smu-leg
        with:
          mode: container
          vp_container: "1"
          local_dir: virtual_platform/local-ctr
          build_dir: virtual_platform/tt-oca-harness-model/vp/build_smc-ctr
          oca_pat: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}
          image_hash: ${{ needs['toolchain-image'].outputs.hash }}
