name: issue-pr-ingest

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  issue-ingest:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Copy form fields to Project 291
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_AW_WRITE_PROJECT_TOKEN: ${{ secrets.GH_AW_WRITE_PROJECT_TOKEN }}
        run: python3 .github/scripts/ingest_github.py --issue "${{ github.event.issue.number }}"

  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check ingest script and issue-form taxonomy
        run: python3 .github/scripts/ingest_github.py --self-test
      - name: Assign PR author
        if: github.event.action == 'opened'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ingest_github.py --pr-assign "${{ github.event.pull_request.number }}"
      - name: Request PR reviewer
        if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ingest_github.py --pr-review "${{ github.event.pull_request.number }}"
