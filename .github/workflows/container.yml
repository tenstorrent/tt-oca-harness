name: container

on:
  pull_request:
    paths:
      - '.github/workflows/container.yml'
      - '.gitmodules'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'ocah_deps.nix'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'hw/common/dv/**'
      - 'hw/sys/sep/bootrom/prod/tools/tt-oca-manifest'
      - 'scripts/docker-run.sh'
      - 'scripts/docker.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/container.yml'
      - '.gitmodules'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'ocah_deps.nix'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'hw/common/dv/**'
      - 'hw/sys/sep/bootrom/prod/tools/tt-oca-manifest'
      - 'scripts/docker-run.sh'
      - 'scripts/docker.md'
  workflow_dispatch:

# Serialise runs per ref, and let the one in flight finish. The content tag is
# write-once and names a closure rather than a commit, so an image built for an
# earlier push satisfies every later tree that resolves to the same hash --
# which most pushes do, since only the flake inputs move it. Cancelling
# discards work the next run would have reused, and on a branch that is pushed
# to often it can restart a multi-hour build indefinitely and publish nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/tenstorrent/ocah-container

jobs:
  # Build the image with Nix and publish it to GHCR under its immutable
  # content-hash tag. skopeo streams the nix-built archive straight to the
  # registry, so the build never goes through a container engine.
  build-and-publish:
    name: Build and publish Nix image
    # A pull request from a fork gets a read-only GITHUB_TOKEN, so it is
    # granted neither packages: write to publish nor the access a private
    # package needs to pull. Skip rather than fail a contributor's run for
    # something they cannot fix; main republishes the image on merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 240
    outputs:
      image_hash: ${{ steps.build.outputs.image_hash }}
      image_digest: ${{ steps.build.outputs.image_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Both: the uv workspace names tt-oca-manifest as a member, and
      # nix/packages/whisper.nix reads the pinned revision out of the model's
      # own CI workflow, so the flake cannot evaluate without either one.
      - name: Checkout the private submodules
        env:
          MANIFEST_TOKEN: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}
        run: |
          test -n "$MANIFEST_TOKEN"
          git -c "url.https://x-access-token:${MANIFEST_TOKEN}@github.com/tenstorrent/.insteadOf=git@github.com:tenstorrent/" \
            submodule update --init --recursive \
              hw/sys/sep/bootrom/prod/tools/tt-oca-manifest \
              virtual_platform/tt-oca-harness-model

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            max-jobs = auto

      - name: Ensure skopeo
        run: command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish full image
        id: build
        env:
          # Nix clones submodules while copying the flake into its store. Use
          # the checkout populated above so the token is not needed while Nix
          # evaluates or builds the image.
          GIT_CONFIG_COUNT: 5
          GIT_CONFIG_KEY_0: protocol.file.allow
          GIT_CONFIG_VALUE_0: always
          GIT_CONFIG_KEY_1: url.file://${{ github.workspace }}/hw/sys/sep/bootrom/prod/tools/tt-oca-manifest.insteadOf
          GIT_CONFIG_VALUE_1: git@github.com:tenstorrent/tt-oca-manifest.git
          GIT_CONFIG_KEY_2: url.file://${{ github.workspace }}/hw/sys/sep/bootrom/prod/tools/tt-oca-manifest.insteadOf
          GIT_CONFIG_VALUE_2: ssh://git@github.com/tenstorrent/tt-oca-manifest.git
          GIT_CONFIG_KEY_3: url.file://${{ github.workspace }}/virtual_platform/tt-oca-harness-model.insteadOf
          GIT_CONFIG_VALUE_3: git@github.com:tenstorrent/tt-oca-harness-model.git
          GIT_CONFIG_KEY_4: url.file://${{ github.workspace }}/virtual_platform/tt-oca-harness-model.insteadOf
          GIT_CONFIG_VALUE_4: ssh://git@github.com/tenstorrent/tt-oca-harness-model.git
        run: |
          # The content-hash tag is write-once: the first build to publish a
          # given closure hash is canonical, and the published bytes are what
          # consumers pull and what verify runs against. Resolving that hash is
          # a pure evaluation, so ask the registry before building -- on a hit
          # there is nothing to publish, and building only to discard the result
          # costs hours. It also means the image is never compared against a
          # local rebuild, which the Nix image build could not match anyway: it
          # is not bit-reproducible, so identical closures differ byte for byte.
          image_hash=$(nix eval --raw .#containerHashes.with_uv_deps)
          echo "image_hash=${image_hash}" >> "$GITHUB_OUTPUT"

          registry_ref="${REGISTRY_IMAGE}:${image_hash}"

          if digest=$(skopeo inspect --insecure-policy \
              --format '{{.Digest}}' "docker://${registry_ref}" 2>/dev/null); then
            echo "already published: ${registry_ref} (${digest}); skipping the build"
          else
            archive=$(nix build \
              .#dockerContainers.x86_64-linux.with_uv_deps \
              --no-link \
              --print-out-paths)
            # docker-archive reads the gzip archive; skopeo relays its compressed
            # layers to the registry without unpacking them to disk. --digestfile
            # records the digest of the manifest it actually pushed. A dropped
            # blob upload is retried, since failing here discards the whole build.
            skopeo copy --insecure-policy --retry-times 3 --digestfile=digest.txt \
              "docker-archive:${archive}" "docker://${registry_ref}"
            digest=$(cat digest.txt)
          fi
          echo "image_digest=${digest}" >> "$GITHUB_OUTPUT"

          {
            echo "### Published OCAH container (pending verification)"
            echo
            echo "- tag: \`${registry_ref}\`"
            echo "- digest: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Pull the published image on a clean runner and exercise it. Only after this
  # passes is the consumed :main tag moved.
  verify-and-promote:
    name: Verify image and promote main
    # A pull request from a fork gets a read-only GITHUB_TOKEN, so it is
    # granted neither packages: write to publish nor the access a private
    # package needs to pull. Skip rather than fail a contributor's run for
    # something they cannot fix; main republishes the image on merge.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build-and-publish
    runs-on: ubuntu-latest-16-cores
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Both: the uv workspace names tt-oca-manifest as a member, and
      # nix/packages/whisper.nix reads the pinned revision out of the model's
      # own CI workflow, so the flake cannot evaluate without either one.
      - name: Checkout the private submodules
        env:
          MANIFEST_TOKEN: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}
        run: |
          test -n "$MANIFEST_TOKEN"
          git -c "url.https://x-access-token:${MANIFEST_TOKEN}@github.com/tenstorrent/.insteadOf=git@github.com:tenstorrent/" \
            submodule update --init --recursive \
              hw/sys/sep/bootrom/prod/tools/tt-oca-manifest \
              virtual_platform/tt-oca-harness-model

      # docker-run.sh resolves the image tag from the flake via `nix eval`, then
      # pulls REGISTRY_IMAGE:<hash>; a native nix keeps that off the container.
      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the published image
        env:
          OCAH_IMAGE_WITH_UV: "true"
          OCAH_CONTAINER_REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
        run: |
          # docker-run.sh pulls REGISTRY_IMAGE:<hash> and tags it locally.
          ./scripts/docker-run.sh verify
          ./scripts/docker-run.sh run sh -ec '
            uv --version
            python --version
            verilator --version
            bender --version
          '

      # Move the consumed :main tag onto the verified content only on main. This is
      # a registry-side manifest copy pinned to the exact digest build-and-publish
      # pushed, so it needs no local image: docker-run.sh's verify pull auto-selects
      # podman when present, whose image store the docker daemon cannot see, so a
      # `docker` re-tag of that pull finds nothing. skopeo talks to the registry
      # directly and sidesteps the engine entirely.
      - name: Ensure skopeo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }

      - name: Promote verified image to :main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          digest="${{ needs.build-and-publish.outputs.image_digest }}"
          skopeo copy --insecure-policy \
            "docker://${REGISTRY_IMAGE}@${digest}" \
            "docker://${REGISTRY_IMAGE}:main"
          {
            echo "### Promoted to :main"
            echo
            echo "- \`${REGISTRY_IMAGE}@${digest}\` -> \`${REGISTRY_IMAGE}:main\`"
          } >> "$GITHUB_STEP_SUMMARY"
