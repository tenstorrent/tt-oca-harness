name: container

on:
  pull_request:
    paths:
      - '.github/workflows/container.yml'
      - '.gitmodules'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'ocah_deps.nix'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'hw/common/dv/pyproject.toml'
      - 'hw/sys/sep/bootrom/prod/tools/tt-oca-manifest'
      - 'scripts/docker-run.sh'
      - 'scripts/docker.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/container.yml'
      - '.gitmodules'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'ocah_deps.nix'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'hw/common/dv/pyproject.toml'
      - 'hw/sys/sep/bootrom/prod/tools/tt-oca-manifest'
      - 'scripts/docker-run.sh'
      - 'scripts/docker.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Build and validate Nix image
    # The from-source RISC-V GCC build wants a large runner's disk. Setting the
    # repository variable DV_LARGE_RUNNER promotes this job to that runner once
    # the larger-runner label is confirmed in the org's runner settings:
    #   gh variable set DV_LARGE_RUNNER --body ubuntu-latest-16-cores
    # Until then it falls back to ubuntu-latest, so the job runs rather than
    # queueing on an unavailable label.
    runs-on: ${{ vars.DV_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout manifest submodule
        env:
          MANIFEST_TOKEN: ${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}
        run: |
          test -n "$MANIFEST_TOKEN"
          git -c "url.https://x-access-token:${MANIFEST_TOKEN}@github.com/tenstorrent/.insteadOf=git@github.com:tenstorrent/" \
            submodule update --init --recursive hw/sys/sep/bootrom/prod/tools/tt-oca-manifest

      - name: Prepare Nix build disk
        run: sudo install -d -m 0755 /mnt/nix-build

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            build-dir = /mnt/nix-build

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and validate full image
        env:
          # Nix clones submodules while copying the flake into its store. Use
          # the checkout populated above so the token is not needed while Nix
          # evaluates or builds the image.
          GIT_CONFIG_COUNT: 3
          GIT_CONFIG_KEY_0: protocol.file.allow
          GIT_CONFIG_VALUE_0: always
          GIT_CONFIG_KEY_1: url.file://${{ github.workspace }}/hw/sys/sep/bootrom/prod/tools/tt-oca-manifest.insteadOf
          GIT_CONFIG_VALUE_1: git@github.com:tenstorrent/tt-oca-manifest.git
          GIT_CONFIG_KEY_2: url.file://${{ github.workspace }}/hw/sys/sep/bootrom/prod/tools/tt-oca-manifest.insteadOf
          GIT_CONFIG_VALUE_2: ssh://git@github.com/tenstorrent/tt-oca-manifest.git
        run: |
          archive=$(nix build \
            .#dockerContainers.x86_64-linux.with_uv_deps \
            --no-link \
            --print-out-paths)
          image_hash=$(nix eval --raw .#containerHashes.with_uv_deps)
          local_ref="ocah-uv-container:${image_hash}"
          registry_ref="ghcr.io/tenstorrent/ocah-container:${image_hash}"

          docker load --input "$archive"
          docker image inspect "$local_ref" >/dev/null
          docker tag "$local_ref" "$registry_ref"
          docker image inspect "$registry_ref" >/dev/null

          OCAH_IMAGE_WITH_UV=true ./scripts/docker-run.sh verify
          OCAH_IMAGE_WITH_UV=true \
          ./scripts/docker-run.sh run sh -ec '
            uv --version
            python --version
            verilator --version
            bender --version
          '

          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            local_id=$(docker image inspect --format '{{.Id}}' "$registry_ref")
            if docker manifest inspect "$registry_ref" >/dev/null 2>&1; then
              echo "Immutable image already published: $registry_ref"
            else
              docker push "$registry_ref"
            fi

            docker pull "$registry_ref"
            remote_id=$(docker image inspect --format '{{.Id}}' "$registry_ref")
            if [ "$local_id" != "$remote_id" ]; then
              echo "error: immutable tag $registry_ref refers to different content" >&2
              exit 1
            fi
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$registry_ref")

            main_ref="ghcr.io/tenstorrent/ocah-container:main"
            docker tag "$registry_ref" "$main_ref"
            docker push "$main_ref"
            {
              echo "### Published OCAH container"
              echo
              echo "\`$registry_ref\`"
              echo
              echo "\`$digest\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
