name: dashboard

# Label runs in the Actions list by what they publish. Every regress
# completion triggers this workflow (workflow_run cannot filter on the
# triggering event or on the tier), but only scheduled runs that carry a
# weekly artifact publish; label the rest so they are not read as failed
# publications.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && format('dashboard dry run (regress run {0})', inputs.run_id) || github.event_name == 'workflow_dispatch' && format('dashboard data publish (regress run {0})', inputs.run_id) || github.event.workflow_run.event == 'schedule' && 'dashboard data publish (scheduled regress run)' || format('dashboard skipped ({0} regress run; only scheduled weekly data is published)', github.event.workflow_run.event) }}

# Data-only publication: this workflow collects the weekly regression run
# into the normalized dashboard data contracts and publishes them for
# consumption. Rendering is deliberately NOT done here — the website pipeline
# that renders the dashboard is owned externally and consumes the published
# data.
#
# Two access patterns carry identical content:
#   - workflow artifact `dv-dashboard-data` (90-day retention): the per-run
#     consumable bundle for the external website pipeline;
#   - branch `dv-dashboard-data`: the canonical cross-run store, required for
#     trend-history continuity (artifacts expire; the history chain must not).
on:
  workflow_run:
    workflows: [regress]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "regress workflow run id to collect and publish (manual weeklies, backfill)"
        required: true
      dry_run:
        description: "collect and aggregate only; skip the data-branch push, the bundle upload and the digest email"
        type: boolean
        default: false

permissions:
  contents: write  # push the dv-dashboard-data branch
  actions: read  # download artifacts from the triggering regress run

# Serialize publications; never cancel one in flight.
concurrency:
  group: dashboard-publish
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled runs publish automatically; a nightly-tier run carries no
    # weekly artifact and ends at the locate step without publishing.
    # Manually dispatched weeklies are published by dispatching this workflow
    # with their run id. PR/push smoke runs live in sim.yml and never reach
    # this workflow: the dashboard tracks the weekly regression.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGRESS_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
      # Email is optional until the mail secrets are provisioned; the step
      # self-disables when OCAH_MAIL_TO is empty.
      OCAH_MAIL_TO: ${{ secrets.OCAH_MAIL_TO }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout dashboard data branch
        uses: actions/checkout@v4
        with:
          ref: dv-dashboard-data
          path: ghdata

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      # A dispatch can name any regress run; publish only runs that carry a
      # weekly run tree. DUT and tool come from the artifact name
      # (dv-run-<dut>-<tool>-weekly; dut/tool never contain hyphens). A labelled
      # row's artifact ends in -<label>, so the -weekly$ anchor leaves it out.
      #
      # Everything downstream of here is single-DUT: the classification file is
      # keyed by day alone, and ghdata/latest holds one result. The regress matrix
      # carries several DUTs, so an unqualified "first artifact" pick would
      # publish whichever the API happened to list first and make the trend
      # series silently alternate between DUTs. DASHBOARD_DUT pins the published
      # DUT, falling back to the alphabetically-first available artifact so a
      # dispatch naming a run without that DUT still publishes something
      # deterministic. Teaching the data branch to carry a series per DUT is the
      # real fix; until then this is explicit rather than arbitrary.
      - name: Locate weekly artifact
        id: art
        env:
          GH_TOKEN: ${{ github.token }}
          DASHBOARD_DUT: dtp
        run: |
          names=$(gh api "repos/${{ github.repository }}/actions/runs/$REGRESS_RUN_ID/artifacts" \
            --jq '[.artifacts[].name | select(test("^dv-run-.+-weekly$"))] | sort | .[]')
          name=$(printf '%s\n' "$names" | grep "^dv-run-$DASHBOARD_DUT-" | head -1 || true)
          if [ -z "$name" ]; then
            name=$(printf '%s\n' "$names" | head -1)
          fi
          skipped=$(printf '%s\n' "$names" | grep -vx "$name" | tr '\n' ' ')
          if [ -n "${skipped// /}" ]; then
            echo "Publishing $name; NOT published (dashboard is single-DUT): $skipped" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$name" ]; then
            echo "No dv-run-*-weekly artifact on regress run $REGRESS_RUN_ID; nothing to publish (nightly-tier runs are not published)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=${name#dv-run-}
          base=${base%-weekly}
          {
            echo "found=true"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"
          {
            echo "DUT=${base%%-*}"
            echo "TOOL=${base#*-}"
          } >> "$GITHUB_ENV"

      - name: Download weekly run tree
        if: steps.art.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          run-id: ${{ env.REGRESS_RUN_ID }}
          github-token: ${{ github.token }}
          path: weekly-run

      # A dispatch re-grades the weekly against this checkout's coverage
      # policy (not the regression commit's) before it is collected, so a
      # waiver merged after the weekly ran reaches the published numbers.
      # run_dv.py --waive rewrites only coverage values inside the run tree:
      # exit 0 and 1 are applied grades (1 = thresholds not met, visible as the
      # collected coverage status); exit 2 is the one error outcome and leaves
      # the tree as recorded. A weekly whose report command crashed, or whose
      # run did not finish (result.json tests.completed false), is refused
      # and publishes as recorded; a weekly whose policy failed at grade time
      # publishes its repaired grade once the policy is corrected. Every
      # dispatch adds a trend point. The scheduled path does not run this step.
      - name: Re-apply the checkout's coverage policy
        if: steps.art.outputs.found == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          rc=0
          OCAH_DV_SKIP_UV=1 python3 tools/dv/run_dv.py --dut "$DUT" --run-dir weekly-run --waive || rc=$?
          case "$rc" in
            0) ;;
            1) echo "coverage policy applied; coverage thresholds not met" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "coverage policy not applied (exit $rc); publishing the recorded grade" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      # Fail closed on a malformed artifact: the run-level result.json must
      # exist. A FAIL/UNKNOWN status still publishes -- a red weekly must
      # appear in the data, not vanish. `collect` itself exits 0 even
      # without usable input, so the file check is the real gate.
      - name: Collect normalized result
        if: steps.art.outputs.found == 'true'
        run: |
          test -f weekly-run/result.json
          mkdir -p bundle
          python3 tools/dv/run_dashboard.py collect \
            --dut "$DUT" \
            --run-dir weekly-run \
            --output "bundle/$DUT.result.json"
          echo "STATUS=$(jq -r .status "bundle/$DUT.result.json")" >> "$GITHUB_ENV"

      # Data-only aggregate: summary plus trend history, no HTML.
      - name: Aggregate results and trend history
        if: steps.art.outputs.found == 'true'
        run: |
          mkdir -p ghdata/data
          python3 tools/dv/run_dashboard.py dashboard \
            --results "bundle/*.result.json" \
            --summary-out bundle/summary.json \
            --history-in ghdata/data/history.json \
            --history-out ghdata/data/history.json
          # The tool has no retention policy; keep the newest 90 trend points.
          jq '.points |= (sort_by(.generated_at) | .[-90:])' \
            ghdata/data/history.json > history.tmp
          mv history.tmp ghdata/data/history.json

      # Native leaf taxonomy: ERROR/TIMEOUT = infrastructure, FAIL = design or
      # test, UNKNOWN = evidence gap. The dashboard schema collapses these
      # into FAIL, so the split is computed here from the native records.
      # Flaky = a test with both passing and non-passing seeds this week.
      - name: Classify failures and build digest
        if: steps.art.outputs.found == 'true'
        run: |
          find weekly-run -path '*/attempt_*/result.json' | while read -r f; do
            t=${f#weekly-run/}
            printf '%s\t%s\n' "${t%%/*}" "$(jq -r .status "$f")"
          done | sort > leaves.tsv
          total=$(wc -l < leaves.tsv | tr -d ' ')
          pass=$(cut -f2 leaves.tsv | grep -cx PASS || true)
          infra=$(cut -f2 leaves.tsv | grep -cxE 'ERROR|TIMEOUT' || true)
          design=$(cut -f2 leaves.tsv | grep -cx FAIL || true)
          unknown=$(cut -f2 leaves.tsv | grep -cx UNKNOWN || true)
          flaky=$(awk -F'\t' '{s[$1]=s[$1]" "$2}
            END{for (t in s) if (s[t] ~ /PASS/ && s[t] ~ /FAIL|ERROR|TIMEOUT|UNKNOWN/) print t}' \
            leaves.tsv | sort)
          failed_tests=$(awk -F'\t' '$2!="PASS"{print $1" ["$2"]"}' leaves.tsv | sort -u | head -20)
          day=$(date -u +%F)
          echo "DAY=$day" >> "$GITHUB_ENV"
          mkdir -p ghdata/data/classification
          jq -n --arg date "$day" --arg run_id "$REGRESS_RUN_ID" --arg status "$STATUS" \
            --argjson total "$total" --argjson pass "$pass" --argjson infra "$infra" \
            --argjson design "$design" --argjson unknown "$unknown" \
            --arg flaky "$flaky" \
            '{date: $date, regress_run_id: $run_id, status: $status,
              leaves: {total: $total, pass: $pass},
              failures: {infra: $infra, design: $design, unknown: $unknown},
              flaky_tests: ($flaky | split("\n") | map(select(length > 0)))}' \
            > "ghdata/data/classification/$day.json"
          {
            echo "Subject: [OCAH DV weekly] $STATUS $DUT/$TOOL $day - $pass/$total"
            echo ""
            echo "Weekly regression: $DUT / $TOOL"
            echo "Status: $STATUS  (leaves: $pass passed, $((total - pass)) failed, of $total)"
            echo "Infra failures (ERROR/TIMEOUT): $infra    Design/test failures (FAIL): $design    Evidence gaps (UNKNOWN): $unknown"
            echo "Flaky (mixed per-seed results): ${flaky:-none}"
            if [ -n "$failed_tests" ]; then
              echo ""
              echo "Failed tests (first 20):"
              echo "$failed_tests"
            fi
            echo ""
            echo "Run:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/$REGRESS_RUN_ID"
            echo "Artifacts: ${{ steps.art.outputs.name }} (run tree, 30-day retention);"
            echo "           dv-dashboard-data (normalized data bundle, 90-day retention)"
          } > digest.txt
          {
            echo '```'
            cat digest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The data branch is canonical: normalized results, summary, bounded
      # trend history, per-week gzipped archives, and classification.
      #
      # A dispatch with dry_run stops before this step and the three that
      # follow: nothing is pushed, uploaded or mailed, so a workflow change is
      # verifiable against a published weekly. On workflow_run the inputs
      # context is empty and the event term short-circuits.
      - name: Publish to the data branch
        if: steps.art.outputs.found == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        run: |
          rm -rf ghdata/latest
          mkdir -p ghdata/latest ghdata/data/runs
          cp "bundle/$DUT.result.json" bundle/summary.json ghdata/latest/
          gzip -c "bundle/$DUT.result.json" \
            > "ghdata/data/runs/$DAY-run$REGRESS_RUN_ID.result.json.gz"
          # Keep the newest 90 per-week archives.
          find ghdata/data/runs -name '*.result.json.gz' | sort | head -n -90 | xargs -r rm --
          cd ghdata
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No dashboard data changes to publish."
            exit 0
          fi
          git commit -m "dv dashboard: publish regress run $REGRESS_RUN_ID ($STATUS)"
          for _ in 1 2 3; do
            if git push origin dv-dashboard-data; then exit 0; fi
            git pull --rebase origin dv-dashboard-data
          done
          exit 1

      # The per-run consumable bundle for the external website pipeline.
      - name: Stage consumption bundle
        if: steps.art.outputs.found == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        run: |
          mkdir -p consumption
          cp "bundle/$DUT.result.json" bundle/summary.json consumption/
          cp ghdata/data/history.json consumption/
          cp "ghdata/data/classification/$DAY.json" consumption/classification.json

      - name: Upload consumption bundle
        if: steps.art.outputs.found == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        uses: actions/upload-artifact@v4
        with:
          name: dv-dashboard-data
          path: consumption
          retention-days: 90
          if-no-files-found: error

      # Self-disables until the mail secrets exist (see run-dashboard.adoc).
      - name: Email digest
        if: steps.art.outputs.found == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && env.OCAH_MAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.OCAH_MAIL_USERNAME }}
          password: ${{ secrets.OCAH_MAIL_PASSWORD }}
          from: OCAH DV CI
          to: ${{ secrets.OCAH_MAIL_TO }}
          subject: "[OCAH DV weekly] ${{ env.STATUS }} ${{ env.DUT }}/${{ env.TOOL }}"
          body: file://digest.txt
