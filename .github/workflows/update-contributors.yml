# Automatic refresh of CONTRIBUTORS.
# Weekly, Monday 09:17 UTC. The commit and pull request are
# .github/actions/open-update-pr; this file owns the schedule and the
# contributor scan. scripts/update_contributors.py places each new person
# in the organisation group for their email domain.

name: Update contributors

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: update-contributors
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
    steps:
      # The scan reads every author and co-author on main, so it needs full history.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}

      - name: Add missing contributors
        run: python3 scripts/update_contributors.py

      - name: Open update pull request
        uses: ./.github/actions/open-update-pr
        with:
          paths: CONTRIBUTORS
          branch: automation/update-contributors
          message: "CONTRIBUTORS: Add new contributors from the commit history"
          current-message: CONTRIBUTORS is current.
          body: |
            ## Summary
            Add the commit authors and co-authors on `main` who are missing from `CONTRIBUTORS`.

            Each new person is placed in the organisation group for their email domain
            (`tenstorrent.com` -> Tenstorrent, `lowrisc.org` -> lowRISC). Anyone else lands
            in Other.

            Before merging, check each new entry. If someone is already listed under another
            name or address, map that identity to their entry in `.mailmap` and drop the
            duplicate. Move someone who landed in the wrong organisation group.

            ## Test plan
            `python3 scripts/update_contributors.py --check`
