name: Update contributors

# Cron has no every-other-week step, so this runs on the 1st and 15th of each month.
on:
  schedule:
    - cron: "17 9 1,15 * *"
  workflow_dispatch:

concurrency:
  group: update-contributors
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
    steps:
      # The scan reads every author and co-author on main, so it needs full history.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}

      - name: Add missing contributors
        run: python3 scripts/update_contributors.py

      - name: Open update pull request
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- CONTRIBUTORS)" ]; then
            echo "CONTRIBUTORS is current."
            exit 0
          fi

          branch=automation/update-contributors
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTORS
          git commit -m "CONTRIBUTORS: Add new contributors from the commit history"
          git push --force-with-lease origin "HEAD:$branch"

          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -z "$pr" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --reviewer aottavianoTT \
              --title "CONTRIBUTORS: Add new contributors from the commit history" \
              --body "$(cat <<'EOF'
          ## Summary
          Add the commit authors and co-authors on `main` who are missing from `CONTRIBUTORS`.

          Before merging, check each new entry. If someone is already listed under another
          name or address, map that identity to their entry in `.mailmap` and drop the
          duplicate. Add someone who is not in an organisation group to the right group.

          ## Test plan
          `python3 scripts/update_contributors.py --check`
          EOF
          )"
          else
            gh pr edit "$pr" --add-reviewer aottavianoTT
          fi
