name: Build and Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'hw/**/*.adoc'
      - 'hw/**/*.sv'
      - 'hw/**/*.md'
      - 'antora-playbook.yml'
      - 'antora-*-playbook.yml'
      - 'tools/doc/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/doc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'doc/**'
      - 'hw/**/*.adoc'
      - 'hw/**/*.sv'
      - 'hw/**/*.md'
      - 'antora-playbook.yml'
      - 'antora-*-playbook.yml'
      - 'tools/doc/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/doc.yml'
  # Publishers outside this repository dispatch the workflow on main after
  # pushing dashboard data, so the site reflects their latest run.
  workflow_dispatch:
  # Republish after each dashboard data publication so the verification
  # dashboard reflects the latest nightly.
  workflow_run:
    workflows: [dashboard]
    types: [completed]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}@github.com/tenstorrent/".insteadOf "git@github.com:tenstorrent/"
          git submodule update --init --recursive

      - name: Setup system dependencies
        # default-jre-headless runs the PlantUML jar that asciidoctor-diagram
        # bundles, which the programmer guide's PDF build uses to render its
        # PlantUML diagram.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra \
            default-jre-headless

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
          rubygems: '3.3.26'

      - name: Install Asciidoctor
        # asciidoctor-diagram renders the PlantUML diagrams in the integrator and
        # programmer guides during their PDF builds.
        run: |
          gem install asciidoctor:2.0.26 asciidoctor-pdf:2.3.9 asciidoctor-diagram:2.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'

      - name: Sync Python dependencies
        run: uv sync

      - name: Build HTML documentation
        # Combined multi-book build  --
        # one Antora run produces all four books plus the native switcher.
        run: |
          make ocah-doc-combined-html OCAH_DOC_SITE_URL=/tt-oca-harness

      - name: Build PDF documentation
        # Each PDF product builds independently: one product's build failure must
        # not skip the others (a single `set -e` block would abort on the first
        # failure). A missing PDF degrades gracefully at the staging step, so a
        # failed build is a warning here, not a deploy failure.
        run: |
          for product in trm integrator programmer appnotes datasheets; do
            echo "::group::make ocah-doc-$product-pdf"
            if ! make "ocah-doc-$product-pdf"; then
              echo "::warning title=PDF build failed::ocah-doc-$product-pdf did not complete; its Downloads link will 404 until fixed"
            fi
            echo "::endgroup::"
          done

      # A push to main, a dispatch on main, or a successful dashboard run
      # deploys.
      - name: Deploy to GitHub Pages
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          make ocah-doc-push-ghpages
