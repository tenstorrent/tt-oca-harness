name: Build and Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'hw/**/*.adoc'
      - 'hw/**/*.md'
      - 'antora-*-playbook.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/doc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'doc/**'
      - 'hw/**/*.adoc'
      - 'hw/**/*.md'
      - 'antora-*-playbook.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/doc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
          rubygems: '3.3.26'

      - name: Install Asciidoctor
        run: |
          gem install asciidoctor:2.0.26 asciidoctor-pdf:2.3.9

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'

      - name: Sync Python dependencies
        run: uv sync

      - name: Build HTML documentation
        run: |
          make ocah-doc-trm-html OCAH_DOC_SITE_URL=/trm
          make ocah-doc-integrator-html OCAH_DOC_SITE_URL=/integrator

      - name: Build PDF documentation
        run: |
          make ocah-doc-trm-pdf
          make ocah-doc-integrator-pdf
        continue-on-error: true

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          make ocah-doc-push-ghpages
