name: Build and Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'hw/**/*.adoc'
      - 'hw/**/*.md'
      - 'antora-playbook.yml'
      - 'antora-*-playbook.yml'
      - 'tools/doc/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/doc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'doc/**'
      - 'hw/**/*.adoc'
      - 'hw/**/*.md'
      - 'antora-playbook.yml'
      - 'antora-*-playbook.yml'
      - 'tools/doc/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/doc.yml'
  workflow_dispatch:
  # Republish after each dashboard data publication so the verification
  # dashboard reflects the latest nightly.
  workflow_run:
    workflows: [dashboard]
    types: [completed]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Consumed by ocah_stage_dashboard_data (doc/doc.mk).
      OCAH_DASHBOARD_DATA_DIR: ${{ github.workspace }}/dashboard-data/latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.OCA_BOOT_MANIFEST_OCA_MODEL_PAT }}@github.com/tenstorrent/".insteadOf "git@github.com:tenstorrent/"
          git submodule update --init --recursive

      - name: Checkout dashboard data branch
        uses: actions/checkout@v4
        # Docs should still build even if data branch is ever empty
        continue-on-error: true
        with:
          ref: dv-dashboard-data
          path: dashboard-data

      - name: Setup system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
          rubygems: '3.3.26'

      - name: Install Asciidoctor
        run: |
          gem install asciidoctor:2.0.26 asciidoctor-pdf:2.3.9

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'

      - name: Sync Python dependencies
        run: uv sync

      - name: Build HTML documentation
        # Combined multi-book build  --
        # one Antora run produces all four books plus the native switcher.
        run: |
          make ocah-doc-combined-html OCAH_DOC_SITE_URL=/tt-oca-harness

      - name: Build PDF documentation
        run: |
          make ocah-doc-trm-pdf
          make ocah-doc-integrator-pdf
        continue-on-error: true

      # Only a successful dashboard run redeploys.
      - name: Deploy to GitHub Pages
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          make ocah-doc-push-ghpages
