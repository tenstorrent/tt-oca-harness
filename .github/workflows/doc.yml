name: Build and Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'hw/**/*.adoc'
      - 'hw/**/*.sv'
      - 'hw/**/*.md'
      - 'antora-playbook.yml'
      - 'antora-*-playbook.yml'
      - 'tools/doc/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/doc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'doc/**'
      - 'hw/**/*.adoc'
      - 'hw/**/*.sv'
      - 'hw/**/*.md'
      - 'antora-playbook.yml'
      - 'antora-*-playbook.yml'
      - 'tools/doc/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/doc.yml'
  # Publishers outside this repository dispatch the workflow on main after
  # pushing dashboard data, so the site reflects their latest run. A tag
  # rebuilds that release's documentation snapshot instead.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose documentation snapshot to rebuild (empty deploys main)
        required: false
        default: ''
  # Republish after each dashboard data publication so the verification
  # dashboard reflects the latest nightly.
  workflow_run:
    workflows: [dashboard]
    types: [completed]
  # Freeze each published release's documentation as a release asset, which
  # every main deploy then serves under /vX.Y/ (tools/doc/release_docs.py).
  release:
    types: [published]

permissions:
  contents: write
  actions: write

# A deploy restores the release snapshots present when it starts, so deploys
# of one ref run in order rather than racing to push gh-pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # The site publishes only full releases.
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      SNAPSHOT_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SNAPSHOT_TAG }}
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git submodule update --init --recursive

      - name: Setup system dependencies
        # default-jre-headless runs the PlantUML jar that asciidoctor-diagram
        # bundles, which the programmer guide's PDF build uses to render its
        # PlantUML diagram.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra \
            default-jre-headless

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false
          rubygems: '3.3.26'

      - name: Install Asciidoctor
        # asciidoctor-diagram renders the PlantUML diagrams in the integrator and
        # programmer guides during their PDF builds.
        run: |
          gem install \
            asciidoctor:2.0.26 \
            asciidoctor-pdf:2.3.9 \
            asciidoctor-diagram:3.2.1 \
            asciidoctor-diagram-plantuml:1.2026.2 \
            asciidoctor-diagram-ditaamini:1.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'

      - name: Sync Python dependencies
        run: uv sync

      - name: Build HTML documentation
        # Combined multi-book build  --
        # one Antora run produces all four books plus the native switcher.
        if: env.SNAPSHOT_TAG == ''
        run: |
          make ocah-doc-combined-html OCAH_DOC_SITE_URL=/tt-oca-harness

      - name: Build PDF documentation
        # Each PDF product builds independently: one product's build failure must
        # not skip the others (a single `set -e` block would abort on the first
        # failure). A missing PDF degrades gracefully at the staging step, so a
        # failed build is a warning here, not a deploy failure.
        run: |
          for product in trm integrator programmer appnotes datasheets; do
            echo "::group::make ocah-doc-$product-pdf"
            if ! make "ocah-doc-$product-pdf"; then
              echo "::warning title=PDF build failed::ocah-doc-$product-pdf did not complete; its Downloads link will 404 until fixed"
            fi
            echo "::endgroup::"
          done

      # The snapshot is the staged site of the tag, served under /vX.Y/. The
      # main deploy it dispatches is what publishes it.
      - name: Publish the release documentation snapshot
        if: env.SNAPSHOT_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OCAH_DOC_SNAPSHOT: ${{ env.SNAPSHOT_TAG }}
        run: |
          uv run python tools/doc/release_docs.py stamp "$SNAPSHOT_TAG"
          site_dir=$(uv run python tools/doc/release_docs.py dir "$SNAPSHOT_TAG")
          make ocah-doc-stage-ghpages OCAH_DOC_SITE_URL="/$site_dir"
          tarball="$RUNNER_TEMP/docs-$SNAPSHOT_TAG.tar.gz"
          uv run python tools/doc/release_docs.py pack doc/_build/html_antora "$tarball"
          gh release upload "$SNAPSHOT_TAG" "$tarball" --clobber
          gh workflow run doc.yml --ref main

      # A push to main, a dispatch on main, or a successful dashboard run
      # deploys.
      - name: Deploy to GitHub Pages
        if: >-
          env.SNAPSHOT_TAG == '' && (
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          make ocah-doc-push-ghpages OCAH_DOC_RELEASE_SNAPSHOTS=1
