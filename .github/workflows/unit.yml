# Unit and sanity checks that need no simulator: host tests, tool unit tests,
# and the generated and vendored tree consistency gates.
name: unit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diff-class:
    runs-on: ubuntu-latest
    outputs:
      run_hardware_ci: ${{ steps.diff-class.outputs.run_hardware_ci }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git submodule update --init --recursive

      - name: Classify the diff
        id: diff-class
        run: |
          case "${{ github.event_name }}" in
            pull_request|push)
              python3 scripts/ci/diff_class.py --github-output >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run_hardware_ci=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # The DV runner's unit tests, including the SMC evidence checker that holds
  # each leaf's required_evidence tuple to the SMC_VPLAN card declaring it.
  # Scoped by its own path filter rather than by run_hardware_ci: a plan card
  # is an .adoc, so a card-only edit classifies documentation-only while still
  # being able to break the checker.
  dv-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # diff_class.py derives the PR diff itself; a shallow checkout has no
          # merge base to diff against. Same reason regen-regs fetches in full.
          fetch-depth: 0
      - name: Classify the diff
        id: scope
        shell: bash
        run: |
          run=true
          case "${{ github.event_name }}" in
            pull_request|push)
              set +e
              python3 scripts/ci/diff_class.py --is-dv-check-required
              # 0 in scope, 1 out of scope, anything else the classifier
              # failed: run the tests rather than skip on a broken answer.
              [ $? -eq 1 ] && run=false
              set -e
              ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Checkout submodules
        if: steps.scope.outputs.run == 'true'
        run: |
          git submodule update --init
      - name: Install uv
        if: steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Run the DV unit tests
        if: steps.scope.outputs.run == 'true'
        run: uv run --locked --group dv python -m unittest discover tools/dv/tests

  # Host unit tests for the SEP BL1 decision logic. Its manifest fixtures are
  # packed with the tt-oca-manifest packer, so the job needs that submodule and uv.
  bl1-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout the manifest submodule
        run: git submodule update --init hw/sys/sep/bootrom/prod/tools/tt-oca-manifest
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Run the BL1 host tests
        run: make -C hw/sys/smu/bl1 host-test

  # Host unit tests for SEP ROM drivers. tests/host has its own Makefile because
  # the ROM Makefile needs the tt-oca-manifest submodule just to parse.
  rom-host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run the ROM driver host tests
        run: make -C hw/sys/sep/bootrom/prod/tests/host

  doc-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true
      - name: Install the converter the block catalog tests convert through
        run: npm install -g @asciidoctor/core@3
      - name: Run the documentation unit tests
        run: |
          NODE_PATH="$(npm root -g)" python3 -m unittest discover tools/doc/tests

  # Deletes and regenerates every register block's collateral from the RDLs,
  # then fails if the working tree changes. The shared checker forces every
  # recipe, removes obsolete tracked outputs, validates Python/JSON artifacts,
  # and uses git status so new files also fail the check.
  regen-regs:
    needs: [diff-class]
    if: needs.diff-class.outputs.run_hardware_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check-regen-regs.sh --skip-if-unrelated re-derives the PR diff
          # itself (diff_class.py), the same way the diff-class job above
          # does. A shallow, single-commit checkout has no merge base to
          # diff against, so it always falls back to running the full
          # check; match diff-class's fetch-depth here so the bypass has
          # real history to work with.
          fetch-depth: 0
      - name: Checkout submodules
        run: |
          git submodule update --init
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Verify regenerated register collateral
        run: bash scripts/ci/check-regen-regs.sh --skip-if-unrelated .
      # Here rather than in its own job so the configs are checked against the
      # header this job just regenerated: they name OTP registers and fields, so
      # an RDL rename silently invalidates one. stdlib-only, hence --no-project;
      # 3.11 for tomllib.
      - name: eFuse preload configs load against the regenerated map
        run: |
          uv run --no-project --python 3.11 \
            hw/sys/sep/dv/cocotb/env/sep_generate_efuse_preload.py --selftest

  # Re-clones every vendor_package remote, applies patches/, and fails if
  # the committed upstream/ tree does not match. Catches a patch that no
  # longer applies and a hand-edit that never became a patch. tt-hw-debug
  # is not in vendor_package (its GitLab remote is not reachable here).
  vendor-diff:
    needs: [diff-class]
    if: needs.diff-class.outputs.run_hardware_ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install bender
        uses: pulp-platform/pulp-actions/bender-install@v2.5.1
      - name: Verify vendored IP patches apply
        run: bender vendor diff --git-throttle 8 --err_on_diff "Vendored upstream/ does not match the pinned remotes plus patches/. Run 'bender vendor init' and commit, or fix the patches."
