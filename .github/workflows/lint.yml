name: lint

on: [push, pull_request, workflow_dispatch]

jobs:
  # Builds the two tools every lint job below needs, once, as artifacts:
  # bender (only lint-sv-slang) and reviewdog (via the shared
  # .github/actions/reviewdog-report composite action).
  setup-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Install bender
        uses: pulp-platform/pulp-actions/bender-install@v2.5.1
      # bender-install puts the binary on PATH (currently ~/.cargo/bin), not
      # necessarily under /tools/bender/; stage from `command -v` like reviewdog.
      - name: Stage bender binary
        run: mkdir -p ./bender-bin && cp "$(command -v bender)" ./bender-bin/
      - name: Upload bender binary
        uses: actions/upload-artifact@v4
        with: { name: bender-bin, path: ./bender-bin/bender, retention-days: 1 }
      - name: Install reviewdog
        uses: reviewdog/action-setup@v1
      - name: Stage reviewdog binary
        run: mkdir -p ./reviewdog-bin && cp "$(command -v reviewdog)" ./reviewdog-bin/
      - name: Upload reviewdog binary
        uses: actions/upload-artifact@v4
        with: { name: reviewdog-bin, path: ./reviewdog-bin/reviewdog, retention-days: 1 }

  format-c:
    needs: setup-tools
    runs-on: ubuntu-latest
    permissions: { contents: read, checks: write, pull-requests: write }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Check C/C++ formatting (clang-format)
        run: make ocah-format-c-check 2>&1 | tee format_c.log || true
      - uses: ./.github/actions/reviewdog-report
        with:
          log-file: format_c.log
          # Two patterns, one per line - NOT comma-joined in a single -efm
          # value (see the efm input's description for why).
          efm: |
            %f:%l:%c: %m
            %-G%.%#
          level: error
          name: format-c

  lint-tcl:
    needs: setup-tools
    runs-on: ubuntu-latest
    permissions: { contents: read, checks: write, pull-requests: write }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Lint Tcl sources (tclint)
        run: make ocah-lint-tcl 2>&1 | tee lint_tcl.log || true
      - uses: ./.github/actions/reviewdog-report
        with: { log-file: lint_tcl.log, efm: '%f:%l:%c: %m', level: error, name: lint-tcl }
      # tclfmt --check output is `<path>: needs reformatting` with no
      # line/column info, so there's nothing for reviewdog to annotate
      # inline. Left as a plain step: its own exit code still gates the job.
      - name: Check Tcl formatting (tclfmt)
        run: make ocah-format-tcl-check

  # Temporarily disabled: ~25k pre-existing style findings still make the
  # reviewdog GitHub Check fail even with fail-level: none. Re-enable once
  # the hw/ style backlog is cleaned up.
  # lint-sv-verible:
  #   needs: setup-tools
  #   runs-on: ubuntu-latest
  #   permissions: { contents: read, checks: write, pull-requests: write }
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #     - name: Install Verible
  #       uses: chipsalliance/verible-actions-common/install-verible@main
  #       with: { verible_version: v0.0-4080-ga0a8d8eb }
  #     - name: Lint SystemVerilog style (verible-verilog-lint)
  #       run: make ocah-lint-sv-verible 2>&1 | tee lint_sv_verible.log || true
  #     - uses: ./.github/actions/reviewdog-report
  #       with: { log-file: lint_sv_verible.log, efm: '%f:%l:%c: %m', level: error, name: lint-sv-verible, fail-level: none }

  lint-sv-slang:
    needs: setup-tools
    runs-on: ubuntu-latest
    permissions: { contents: read, checks: write, pull-requests: write }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: bender-bin, path: ./bin }
      - run: chmod +x ./bin/bender && echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: Install slang
        run: |
          curl -fsSL -o slang.tgz https://github.com/MikePopoloski/slang/releases/download/v11.0/slang-linux-x86_64.tar.gz
          mkdir -p ./slang-bin && tar xzf slang.tgz -C ./slang-bin
          echo "$GITHUB_WORKSPACE/slang-bin" >> "$GITHUB_PATH"
      - name: Generate smu filelist (covers smc/sep/dtp too)
        run: make -C hw/sys/smu -f flow.mk ocah-lint-slang-flist OCAH_ROOT="$GITHUB_WORKSPACE"
      - name: Generate aou-rtl filelist
        run: make -C vendor/tenstorrent/aou-rtl/overlay -f flow.mk ocah-lint-slang-flist OCAH_ROOT="$GITHUB_WORKSPACE"
      - name: Lint smu (slang)
        run: slang -f hw/sys/smu/build/lint/smu.f --top smu --timescale=1ns/1ps --lint-only --single-unit --compat vcs --error-limit 0 --diag-json smu_diags.json || true
      - name: Convert smu diagnostics to rdjson
        run: python3 scripts/ci/slang_to_rdjson.py smu_diags.json > smu_diags.rdjson.json
      - uses: ./.github/actions/reviewdog-report
        with: { log-file: smu_diags.rdjson.json, format: rdjson, name: lint-sv-slang/smu }
      - name: Lint aou-rtl (slang)
        run: slang -f vendor/tenstorrent/aou-rtl/overlay/build/lint/AOU_TOP.f --top AOU_TOP --timescale=1ns/1ps --lint-only --single-unit --compat vcs --error-limit 0 --diag-json aou_diags.json || true
      - name: Convert aou-rtl diagnostics to rdjson
        run: python3 scripts/ci/slang_to_rdjson.py aou_diags.json > aou_diags.rdjson.json
      - uses: ./.github/actions/reviewdog-report
        with: { log-file: aou_diags.rdjson.json, format: rdjson, name: lint-sv-slang/aou }
