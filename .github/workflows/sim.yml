name: sim

# Pull-request and push gate: each CI-qualified DUT's `smoke` group on
# Verilator, once per framework. The scheduled regression tiers live in
# regress.yml. Both run the DV job through .github/actions/dv-run, so this
# file carries no tier policy and a regression-tier change can never alter
# the gate.

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

# Superseded PR runs are cancelled; sim jobs are too heavy to let stale PR
# pushes pile up. Only PR runs are ever auto-cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diff-class:
    runs-on: ubuntu-latest
    outputs:
      run_hardware_ci: ${{ steps.diff-class.outputs.run_hardware_ci }}
      smoke_skip: ${{ steps.smoke-scope.outputs.smoke_skip }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git submodule update --init --recursive

      - name: Classify the diff
        id: diff-class
        run: |
          case "${{ github.event_name }}" in
            pull_request|push)
              python3 scripts/ci/diff_class.py --github-output >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run_hardware_ci=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # smoke_skip lists the verilator-smoke rows no changed path reaches
      # (scripts/ci/smoke_scope.py). Pushes and dispatches leave it unset, and
      # so does a failure of either step below, which runs every row. A row
      # missing from the --view list always runs.
      - name: Install bender
        if: github.event_name == 'pull_request' && steps.diff-class.outputs.run_hardware_ci == 'true'
        continue-on-error: true
        uses: pulp-platform/pulp-actions/bender-install@v2.5.1

      - name: Scope the smoke checks
        id: smoke-scope
        if: github.event_name == 'pull_request' && steps.diff-class.outputs.run_hardware_ci == 'true'
        continue-on-error: true
        run: |
          python3 scripts/ci/smoke_scope.py --self-test
          python3 scripts/ci/smoke_scope.py --github-output --summary "$GITHUB_STEP_SUMMARY" \
            --view dtp:cocotb --view sep:cocotb --view smu:cocotb --view smc:cocotb \
            --view dtp:uvm --view sep:uvm --view smu:uvm --view smc:uvm >> "$GITHUB_OUTPUT"

  verilator-smoke:
    # The name is the row's check context, `verilator-smoke (<dut> <framework>)`;
    # main protection requires the cocotb ones. The explicit name keeps them
    # stable if the matrix gains another axis.
    name: verilator-smoke (${{ matrix.dut }} ${{ matrix.framework }})
    runs-on: ${{ matrix.runner }}
    needs: [diff-class]
    # Budget per DUT: a Verilator cache miss (from-source build) plus the
    # model build and the smoke group at --sim-jobs 2.
    timeout-minutes: 60
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        # One artifact and one run_dv.py invocation per CI-qualified DUT,
        # framework and tool. Extend this list only with combinations proven
        # Verilator-clean at head; see "Continuous integration" in
        # tools/dv/doc/run-dv.adoc. The framework names the row's context and
        # its artifact (dv-run-<dut>-verilator-smoke-<framework>). A new row
        # also needs its `<dut>:<framework>` in the smoke-scope step's --view
        # list.
        #
        # The single-IP benches (cross_trigger, axi_hang_detector) are not in
        # the gate: their smoke cost is one job of runner setup each for
        # seconds of simulation, and none is a required context. regress.yml
        # runs their full groups nightly.
        #
        # runner: the label this DUT's job runs on, and the only knob that sets
        # build parallelism (--build-jobs "$(nproc)" follows it). Every row
        # uses ubuntu-latest.
        include:
          - dut: dtp
            framework: cocotb
            runner: ubuntu-latest
          - dut: sep
            framework: cocotb
            runner: ubuntu-latest
          # `smu` carries the SMU regression (smu_wrapper.sv, one compile
          # profile with the real SEP). It runs the default `smoke` group,
          # which is toolchain-free by construction (its firmware smokes are
          # `fw_boot`), which this runner -- Verilator and nothing else --
          # needs.
          - dut: smu
            framework: cocotb
            runner: ubuntu-latest
          - dut: smc
            framework: cocotb
            runner: ubuntu-latest
          - dut: dtp
            framework: uvm
            runner: ubuntu-latest
          - dut: sep
            framework: uvm
            runner: ubuntu-latest
          - dut: smu
            framework: uvm
            runner: ubuntu-latest
          - dut: smc
            framework: uvm
            runner: ubuntu-latest
    env:
      # A required context must report, so this job always runs;
      # RUN_SMOKE=false skips the sim work for a documentation-only diff and
      # for a row the diff does not reach.
      RUN_SMOKE: ${{ needs.diff-class.outputs.run_hardware_ci == 'true' && !contains(fromJSON(needs.diff-class.outputs.smoke_skip || '[]'), format('{0}:{1}', matrix.dut, matrix.framework)) }}
    steps:
      - name: Skip a diff this check does not read
        if: env.RUN_SMOKE != 'true'
        run: echo "This diff changes no input of this smoke check; the simulation is not run."

      - name: Checkout
        if: env.RUN_SMOKE == 'true'
        uses: actions/checkout@v4

      # Checkout is skipped with the sim work, so this runner then has no git
      # repository. Submodule update must follow that same condition.
      - name: Checkout submodules
        if: env.RUN_SMOKE == 'true'
        run: |
          git submodule update --init --recursive

      # The SEP DV env reads src/oca/constants.py from the tt-oca-manifest
      # submodule as the authority for the OCA manifest layout, so without it 54
      # of 162 test modules fail to import and the run dies before any
      # simulation.
      - name: Check out the tt-oca-manifest submodule
        if: env.RUN_SMOKE == 'true' && matrix.dut == 'sep'
        run: |
          git submodule update --init hw/sys/sep/bootrom/prod/tools/tt-oca-manifest
          # Fail here rather than 54 import errors deep into the run.
          test -f hw/sys/sep/bootrom/prod/tools/tt-oca-manifest/src/oca/constants.py

      # The run id keeps the recorded native run_dir unique per run; the
      # tier segment keeps every tier's tree separate.
      - name: Run smoke tier
        if: env.RUN_SMOKE == 'true'
        uses: ./.github/actions/dv-run
        with:
          dut: ${{ matrix.dut }}
          framework: ${{ matrix.framework }}
          tool: verilator
          tier: smoke
          label: ${{ matrix.framework }}
          items: ${{ matrix.items || 'smoke' }}
          sim-jobs: 2
          run-dir: build/ci/runs/${{ matrix.dut }}/verilator/smoke/${{ github.run_id }}
