#
# check_no_vendor_paths.yaml
#
# Configuration for tools/dv/check_no_vendor_paths.py.
#
# forbidden_prefixes: path substrings that must NOT appear in any file
#   referenced by the public OSS filelist.  These match against the full
#   resolved absolute path of each file and against every path token found
#   inside -f / +incdir+ / `include lines.
#
# per_target_allowlist: a mapping from named "targets" (arbitrary labels) to
#   lists of prefix patterns that are allowed in that target's filelist.  Use
#   this sparingly — every allowlist entry is a known gap in the public flow.
#   All entries must have a "reason" field explaining why the exception exists.
#
# -------------------------------------------------------------------------
# Forbidden prefixes
# -------------------------------------------------------------------------
forbidden_prefixes:
  # Samsung foundry-specific paths
  - prefix: "/tech/samsung"
    description: "Samsung foundry GPIO, OTP, and standard-cell models"
  - prefix: "/tech/Samsung"
    description: "Samsung foundry models (capital-S variant)"
  - prefix: "samsung/LN04LPP"
    description: "Samsung LN04LPP process-specific models (relative path form)"
  - prefix: "/LN04LPP"
    description: "Samsung LN04LPP embedded in a longer absolute path"

  # Movellus vendor IP paths
  - prefix: "/vendor_ip/movellus"
    description: "Movellus PLL and droop-sensor simulation IP"

  # Cadence vendor IP paths
  - prefix: "/vendor_ip/cadence"
    description: "Cadence I3C controller and xSPI/DLL/PHY simulation IP"

  # Synopsys vendor IP paths
  - prefix: "/vendor_ip/synopsys"
    description: "Synopsys TRNG (DWC_trng) simulation IP"

  # Alpha Solutions vendor IP paths
  - prefix: "/vendor_ip/alpha_solutions"
    description: "Alpha Solutions temperature sensor simulation models"

  # Generic catch-all for any path rooted at /vendor_ip or /tech
  - prefix: "/vendor_ip/"
    description: "Generic vendor IP root — catch-all for unlisted vendor paths"
  - prefix: "/tech/"
    description: "Generic foundry/tech root — catch-all for unlisted foundry paths"

  # Internal server mounts sometimes appear in developer-local filelists
  - prefix: "/nfs/tools"
    description: "Internal NFS tool mount — not available in CI or to OSS contributors"
  - prefix: "/tools_vendor"
    description: "Internal vendor tool mount"
  - prefix: "/tools_soc"
    description: "Internal SoC tool mount"

# -------------------------------------------------------------------------
# Per-target allowlist overrides
# -------------------------------------------------------------------------
# Each entry has:
#   target:   arbitrary label matching the --target argument of check_no_vendor_paths.py
#   allow:    list of prefix strings to exempt from the forbidden_prefixes check
#   reason:   mandatory explanation; must reference a tracking issue or known gap

per_target_allowlist:
  # Example (currently no exceptions are granted):
  #
  # - target: "smc_vendor_dv"
  #   allow:
  #     - "/vendor_ip/movellus"
  #     - "/tech/samsung"
  #   reason: >
  #     Internal SMC vendor-accurate regression flow.  Not part of the public
  #     OSS filelist.  Tracked in OCAH issue #99 for eventual shim replacement.
  #
  # When an exception is granted, document it here and add the target label
  # to the workflow step that scans that filelist.
  []

# -------------------------------------------------------------------------
# File extension filter
# -------------------------------------------------------------------------
# Only lines in filelist files whose path ends with one of these extensions
# are checked for forbidden prefixes.  Lines that are Verilator flags
# (+define+, -Wno-*, --cc, etc.) are skipped regardless.
checked_extensions:
  - ".sv"
  - ".v"
  - ".vp"
  - ".svh"
  - ".vh"

# -------------------------------------------------------------------------
# Filelist directive prefixes that introduce a path token
# -------------------------------------------------------------------------
# These are the leading tokens that introduce a file or directory path in a
# Verilog/SystemVerilog filelist (.f file).  Lines starting with any of these
# are treated as path lines and their argument is extracted and checked.
filelist_path_directives:
  - "+incdir+"    # +incdir+<path>
  - "-f "         # -f <path>
  - "-F "         # -F <path> (some tools use capital F)
