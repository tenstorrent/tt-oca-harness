site:
  title: Open Chiplet Atlas Harness (OCAH) Programmer's Guide
  url: /
  start_page: ocah-programmer-guide::index.adoc
content:
  sources:
    - url: .
      branches: HEAD
      start_path: doc/programmer
      edit_url: false
asciidoc:
  attributes:
    kroki-default-format: svg
    kroki-fetch-diagram: true
  extensions:
    - asciidoctor-kroki
runtime:
  log:
    # See antora-playbook.yml for why this is raised from the default.
    failure_level: error
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./doc/ui-supplemental
output:
  dir: ./doc/programmer/_build/html_antora
