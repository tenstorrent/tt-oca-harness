# Tracks this repo's own acronyms and the one phrase each is canonically
# defined as. styles/config/scripts/AcronymDefinitions.tengo does the
# matching: it finds a spelled-out expansion of a tracked acronym anywhere
# in the document and flags it if it doesn't match the canonical phrase,
# regardless of how the wrong expansion is worded.
#
# Add an acronym only once its canonical expansion is confirmed stated
# somewhere in-tree -- grep for it, don't rely on general knowledge of what
# the acronym usually means. The map lives in the Tengo script, not here;
# add an acronym by editing AcronymDefinitions.tengo's `canonical` map and
# recording its source below.
#
# Canonical expansions:
#   DFD    = "Design-for-Debug"                              per hw/sys/smc/doc/dfd.adoc
#   OCA    = "Open Chiplet Atlas"                             per README.md, NOTICE, doc/**/antora.yml
#   OCAH   = "Open Chiplet Atlas Harness"                     per README.md
#   OCCP   = "Open Chiplet Configuration Protocol"            per hw/sys/smc/bootrom/prod/doc/index.adoc
#   OCTS   = "Open Chiplet Time Synchronization"              per hw/ip/system_timer_octs/regs/system_timer_octs.rdl
#   OCMI   = "Open Chiplet Management Interface"              per doc/home/src/features.adoc
#   OCCT   = "Open Chiplet Cross Triggering"                  per hw/ip/cross_trigger/cross_trigger_port/doc/index.adoc
#   SMC    = "System Management Controller"                   per doc/trm/src/architecture.adoc
#   SEP    = "Security Processor"                             per doc/programmer/src/index.adoc
#   DTP    = "Debug and Test Ports"                           per hw/sys/dtp/doc/overview.adoc ("&" and "and" both accepted)
#   SMU    = "System Management Unit"                         per doc/trm/src/architecture.adoc
#   SMN    = "System Management Network"                      per doc/home/src/features.adoc
