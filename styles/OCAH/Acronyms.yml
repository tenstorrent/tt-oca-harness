# Flags any spelled-out expansion of a tracked acronym that doesn't match
# the one this repo actually defines it as -- not just the specific wrong
# phrasings already caught in-tree (an earlier version of this rule was a
# plain substitution blocklist of those; see git history). The canonical
# map and the phrase-matching logic live in
# styles/config/scripts/AcronymDefinitions.tengo, so this catches a *novel*
# wrong expansion too, e.g. an AI assistant free-associating a
# plausible-sounding phrase for a three/four-letter acronym it was never
# told the meaning of, the same way it might misspell an uncommon word.
#
# Right-hand sides are quoted, not invented -- confirm with grep before
# adding an acronym, and cite the source in the script's `canonical` map
# comment or here:
#   DFD  = "Design-for-Debug"                    per hw/sys/smc/doc/dfd.adoc
#   OCA  = "Open Chiplet Atlas"                   per README.md, NOTICE, doc/**/antora.yml
#   OCCP = "Open Chiplet Communication Protocol"  per hw/sys/smc/bootrom/prod/doc/index.adoc
#   OCTS = "Open Chiplet Time Synchronization"    per hw/ip/system_timer_octs/regs/system_timer_octs.rdl
#
# Adding an acronym means editing the Tengo script's `canonical` map, not
# this file -- there's no YAML-only extension point for "the answer is X,
# flag anything else," which is why this extends `script` instead of the
# lower-effort `substitution` extends every other rule in this repo's Vale
# config uses.
extends: script
message: "%s"
level: error
scope: raw
script: AcronymDefinitions.tengo
