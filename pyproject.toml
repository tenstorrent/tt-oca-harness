[project]
name = "tt-ocah-reggen"
version = "0.1.0"
description = "OCAH register generation environment"
requires-python = ">=3.11,<3.14"
dependencies = [
  "clang-format==14.0.6",
  "ghp-import>=2.1.0",  # temporary: GitHub Pages deploy; see doc/gh-pages.mk
  "hjson>=3.1.0",
  "mako>=1.3.12",
  "peakrdl>=1.4.0",
  "peakrdl-cheader>=1.1.0",
  "peakrdl-html>=2.12.2",
  "peakrdl-markdown>=1.0.3",
  "peakrdl-rawheader>=0.2.4",
  "peakrdl-regblock>=1.2.0",
  "peakrdl-systemrdl>=1.0.1",
  "semantic-version>=2.10.0",
  "systemrdl-compiler>=1.32.2",
  "tclint==0.4.2",
]

[dependency-groups]
# Simulation environment for the native DV runner (tools/dv/run_dv.py). Kept out of
# default-groups so `uv sync` for reggen/docs does not pull the simulation stack.
dv = ["ocah-dv"]

[tool.uv]
package = false

[tool.uv.sources]
ocah-dv = { workspace = true }

[tool.uv.workspace]
members = ["hw/common/dv"]
