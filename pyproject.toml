[project]
name = "tt-ocah-reggen"
version = "0.1.0"
description = "OCAH register generation environment"
requires-python = ">=3.11,<3.14"
dependencies = [
  "clang-format==14.0.6",
  "codespell==2.4.3",
  "ghp-import>=2.1.0",  # temporary: GitHub Pages deploy; see doc/gh-pages.mk
  "hjson>=3.1.0",
  "mako>=1.3.12",
  "mypy==1.18.1",  # 1.19+ requires pathspec>=1.0.0, which conflicts with tclint's pathspec==0.11.2 pin
  "peakrdl>=1.4.0",
  "peakrdl-cheader>=1.1.0",
  "peakrdl-html>=2.12.2",
  "peakrdl-ipxact>=3.4.0",
  "peakrdl-markdown>=1.0.3",
  "peakrdl-rawheader>=0.2.4",
  "peakrdl-regblock>=1.2.0",
  "peakrdl-systemrdl>=1.0.1",
  "pre-commit==4.5.1",  # 4.6+ requires Git 2.31; supported environments include Git 2.26
  "pyelftools>=0.33",
  "pyyaml>=6.0.3",
  "ruff==0.16.5",
  "semantic-version>=2.10.0",
  "shellcheck-py==0.11.0.1",  # wraps the shellcheck binary; see shfmt-py below for the formatter half
  "shfmt-py==4.1.0",  # wraps the shfmt binary; no lint rules of its own, pairs with shellcheck-py
  "svdoc==0.3.0",  # RTL Modules Reference: module, parameter, and port tables
  "systemrdl-compiler>=1.32.2",
  "tclint==0.4.2",
  "tomllint==0.3.6",  # syntax-only: catches malformed DV testlist/sim-config TOML, no style rules
  "types-pyyaml>=6.0.12.20260815",
  "yamllint==1.37.1",  # 1.38+ requires pathspec>=1.0.0, which conflicts with tclint's pathspec==0.11.2 pin
]

[dependency-groups]
# Simulation environment for the native DV runner (tools/dv/run_dv.py). Kept out of
# default-groups so `uv sync` for reggen/docs does not pull the simulation stack.
dv = ["ocah-dv"]
# SEP virtual-platform harness (virtual_platform/): pexpect drives sep-vp, pyelftools
# backs the boot ROM's OTBN C-array generation. Sync with `uv sync --inexact --group vp`
# (--inexact so a previously synced dv group is not stripped). Kept out of
# default-groups like dv.
vp = [
    "pexpect>=4.8",
    "pyyaml>=6.0",
    "pytest>=7.0",
    "toml>=0.10",
    "pyelftools>=0.29",
    # The boot ROM's key_digests.c is generated on the host from PEM files; the
    # bootrom Makefile refuses to build without it, and the RISC-V toolchain
    # sandbox carries a bare python3.
    "cryptography>=41.0",
]
manifest = ["tt-oca-manifest"]

[tool.uv]
package = false

[tool.uv.sources]
ocah-dv = { workspace = true }
tt-oca-manifest = { workspace = true }

[tool.uv.workspace]
members = ["hw/common/dv", "hw/sys/sep/bootrom/prod/tools/tt-oca-manifest"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".claude",
  "*.md",
  "nonfree",
  "vendor",
  "**/build",
  "**/build_ot",
  "**/build_ot_pio",
  "**/regs/gen/py",
  "hw/sys/sep/bootrom/prod/tools/tt-oca-manifest",
  # The VP simulator is a submodule, so it is not covered by a .gitignore the
  # way virtual_platform/'s own downloads/ and local*/ trees are.
  "virtual_platform/tt-oca-harness-model",
  "virtual_platform/downloads",
  "virtual_platform/local*",
]

# The SMU DV `env` and `seq_lib` packages are namespace packages spanning the
# block and wrapper framework trees (hw/sys/smu/dv/README.md), so they carry no
# __init__.py; name them here so isort keeps treating their imports as
# first-party.
namespace-packages = [
  "hw/sys/smu/dv/cocotb/env",
  "hw/sys/smu/dv/cocotb/seq_lib",
  "hw/sys/smu/dv/cocotb_wrapper/env",
  "hw/sys/smu/dv/cocotb_wrapper/seq_lib",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/dv/tb_vcs/**/*.py" = ["E722", "E741", "F403", "F405", "F841"]
"**/cocotb/**/*.py" = ["E402"]
"hw/ip/i3ccore_wrap/dv/tb/*.py" = ["E402"]
# sep_reg_meta must import before sep_reg (it puts regs/gen/py on sys.path as
# a side effect); isort's alphabetical sort would put sep_reg first and break it.
"hw/sys/sep/dv/cocotb/env/sep_efuse_image.py" = ["I001"]
"hw/sys/sep/dv/cocotb/env/sep_generate_efuse_preload.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
# Lenient: most first-party Python here is loosely-typed DV/cocotb code, not a
# fully-annotated library. Mirrors the internal SOC team's own mypy config
# rather than demanding annotation coverage this codebase doesn't have yet.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
explicit_package_bases = true
# cocotb/cocotbext/pyuvm etc. live in the separate `dv` dependency group (see
# hw/common/dv/), not this environment; treat their absence as expected
# rather than an error on every DV file that imports them.
ignore_missing_imports = true
exclude = '''(?x)^(
  vendor/
  | nonfree/
  | .*/regs/gen/py/
  | .*/build(_ot|_ot_pio)?/
)'''

[tool.codespell]
# - regs/gen is generated from the .rdl sources next to it; a typo fix there
#   is reverted by the next `regen-regs` run, so the real fix belongs upstream.
# - tt-oca-harness-model is another repo, vendored as a submodule, so a finding
#   in it is fixable only by a pull request there -- the same reasoning as
#   tools/tt-oca-manifest above. virtual_platform's downloads/ and local*/ hold
#   extracted SystemC, Boost and CCI sources, which are build output.
# - chipyard_generated_files/crossbars/ot_pkg mirror flows/lint/verible.mk's
#   own excludes: generated or OpenTitan-origin RTL this repo doesn't hand-edit.
# - integration collateral is a symlink index over sources covered here or
#   intentionally skipped at their canonical generated/vendor locations.
# - dv/fw/include/metal and dv/fw/tests/coremark* are upstream SiFive Metal
#   HAL and EEMBC CoreMark sources, copied in rather than hand-maintained here.
# - *.pem is base64 key material, so any letter run in it can collide with a
#   dictionary entry. The test signing keys hit one such collision, which is
#   why the literal token is described rather than quoted here: quoting it
#   makes this file itself a finding.
# - tools/tt-oca-manifest is a submodule: another repo's sources, fixable only
#   by a PR there, so a finding in it cannot gate this repo. The same goes for
#   virtual_platform/tt-oca-harness-model
#
# - The below is in four blocks - vendor, generated, submodules, artifacts/binaries
skip = """\
\
*/vendor/*,*/nonfree/*,.git,\
*/dv/fw/include/metal,*/dv/fw/tests/coremark,coremark.h,\
*/local/pdks/*,\
\
*/integration/rdl/*,*/integration/ipxact/*,*/integration/constraint/*,\
*/regs/gen,*/chipyard_generated_files,*/crossbars,*/ot_pkg,\
*/doc/*/modules/*,*/_build/*,\
*/virtual_platform/downloads/*,*/virtual_platform/local/*,*/virtual_platform/local-ctr/*,\
\
*/tools/tt-oca-manifest,*/virtual_platform/tt-oca-harness-model/*,\
\
*.png,*.svg,*.woff,*.woff2,*.pdf,*.hex,*.parhex,*.core,*.pem,uv.lock,*.lock,\
*.dis,*.il,*.log\
"""
# interruptor(s): the RISC-V CLINT spec spells out the acronym as
# "Core-Local INTerruptor", matching every other occurrence in doc/; not the
# "interrupter" spelling codespell's dictionary otherwise prefers.
ignore-words-list = """\
STAP,stap,STAPs,staps,EDN,edn,OT,hart,Hart,THRE,thre,WEL,DED,ded,\
inout,Inout,ist,wit,dout,oen,chainIn,LockIn,DAA,clen,aack,thi,pres,te,\
Dum,ND,nd,RUNN,ASSIGNIN,Synopsys,synopsys,unsecure,Unsecure,UNSECURE,\
interruptor,Interruptor,interruptors,Interruptors,\
SpecField,specfield\
"""
