# checkmake config: minphony's default (require all/clean/test) assumes a
# conventional entry-point Makefile; this repo dispatches everything through
# `ocah-*`-prefixed targets instead (see ocah.mk), so that convention never
# applies here, not even to the top-level Makefile/ocah.mk. Empty `required`
# disables the rule rather than listing targets that don't exist by design.
# See flows/lint/checkmake.mk for how this is invoked.
[minphony]
required=
