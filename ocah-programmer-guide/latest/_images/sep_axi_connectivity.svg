<?xml version="1.0" encoding="UTF-8"?> <!-- SPDX-License-Identifier: Apache-2.0 --> <!-- SPDX-FileCopyrightText: 2026 Tenstorrent USA, Inc. --> <svg xmlns="http://www.w3.org/2000/svg" width="720" height="710" viewBox="0 0 720 710"      role="img" aria-labelledby="title description">   <title id="title">SEP AXI4 connectivity</title>   <desc id="description">Columns are initiators and rows are targets. A filled     circle marks a connection; a dash marks no connection. CPU IFI reaches     Scratch SRAM and Boot ROM. CPU LSU reaches every target except CPU TCM.     CPU DBG reaches every crossbar target except CPU TCM. DMA reaches every     crossbar target except DMA CSR and Entropy Pool. System Interface reaches     every crossbar target except CPU TCM, Reset Ctrl and System Periph.     Boot ROM connects only to CPU IFI and CPU LSU, outside the crossbar.</desc>   <rect width="720" height="710" rx="8" fill="#ffffff"/>   <g font-family="sans-serif" font-size="18" fill="#263238">     <text x="24" y="36" font-size="24" font-weight="bold">SEP AXI4 connectivity</text>     <circle cx="34" cy="64" r="6" fill="#176954"/>     <text x="50" y="70" font-size="16">Connected</text>     <path d="M178 64 h12" stroke="#617078" stroke-width="2"/>     <text x="200" y="70" font-size="16">Not connected</text>     <text x="24" y="109" font-size="16" font-weight="bold">CROSSBAR TARGETS</text>     <text x="465" y="109" font-size="16" font-weight="bold" text-anchor="middle">INITIATORS</text>     <rect x="24" y="122" width="672" height="54" rx="4" fill="#e6eeeb"/>     <g text-anchor="middle" font-weight="bold">       <text x="270" y="155">CPU IFI</text>       <text x="366" y="155">CPU LSU</text>       <text x="462" y="155">CPU DBG</text>       <text x="558" y="155">DMA</text>       <text x="654" y="145">System</text>       <text x="654" y="166">Interface</text>     </g>     <g id="cpu-tcm">       <rect x="24" y="179" width="672" height="40" fill="#f1f5f3"/>       <text x="36" y="205">CPU TCM</text>       <path d="M264 199 h12" stroke="#617078" stroke-width="2"/>       <path d="M360 199 h12" stroke="#617078" stroke-width="2"/>       <path d="M456 199 h12" stroke="#617078" stroke-width="2"/>       <circle cx="558" cy="199" r="6" fill="#176954"/>       <path d="M648 199 h12" stroke="#617078" stroke-width="2"/>     </g>     <g id="scratch-sram">       <rect x="24" y="219" width="672" height="40" fill="#ffffff"/>       <text x="36" y="245">Scratch SRAM</text>       <circle cx="270" cy="239" r="6" fill="#176954"/>       <circle cx="366" cy="239" r="6" fill="#176954"/>       <circle cx="462" cy="239" r="6" fill="#176954"/>       <circle cx="558" cy="239" r="6" fill="#176954"/>       <circle cx="654" cy="239" r="6" fill="#176954"/>     </g>     <g id="dma-csr">       <rect x="24" y="259" width="672" height="40" fill="#f1f5f3"/>       <text x="36" y="285">DMA CSR</text>       <path d="M264 279 h12" stroke="#617078" stroke-width="2"/>       <circle cx="366" cy="279" r="6" fill="#176954"/>       <circle cx="462" cy="279" r="6" fill="#176954"/>       <path d="M552 279 h12" stroke="#617078" stroke-width="2"/>       <circle cx="654" cy="279" r="6" fill="#176954"/>     </g>     <g id="wdt">       <rect x="24" y="299" width="672" height="40" fill="#ffffff"/>       <text x="36" y="325">WDT</text>       <path d="M264 319 h12" stroke="#617078" stroke-width="2"/>       <circle cx="366" cy="319" r="6" fill="#176954"/>       <circle cx="462" cy="319" r="6" fill="#176954"/>       <circle cx="558" cy="319" r="6" fill="#176954"/>       <circle cx="654" cy="319" r="6" fill="#176954"/>     </g>     <g id="reset-ctrl">       <rect x="24" y="339" width="672" height="40" fill="#f1f5f3"/>       <text x="36" y="365">Reset Ctrl</text>       <path d="M264 359 h12" stroke="#617078" stroke-width="2"/>       <circle cx="366" cy="359" r="6" fill="#176954"/>       <circle cx="462" cy="359" r="6" fill="#176954"/>       <circle cx="558" cy="359" r="6" fill="#176954"/>       <path d="M648 359 h12" stroke="#617078" stroke-width="2"/>     </g>     <g id="crypto-periph">       <rect x="24" y="379" width="672" height="40" fill="#ffffff"/>       <text x="36" y="405">Crypto Periph</text>       <path d="M264 399 h12" stroke="#617078" stroke-width="2"/>       <circle cx="366" cy="399" r="6" fill="#176954"/>       <circle cx="462" cy="399" r="6" fill="#176954"/>       <circle cx="558" cy="399" r="6" fill="#176954"/>       <circle cx="654" cy="399" r="6" fill="#176954"/>     </g>     <g id="system-periph">       <rect x="24" y="419" width="672" height="40" fill="#f1f5f3"/>       <text x="36" y="445">System Periph</text>       <path d="M264 439 h12" stroke="#617078" stroke-width="2"/>       <circle cx="366" cy="439" r="6" fill="#176954"/>       <circle cx="462" cy="439" r="6" fill="#176954"/>       <circle cx="558" cy="439" r="6" fill="#176954"/>       <path d="M648 439 h12" stroke="#617078" stroke-width="2"/>     </g>     <g id="io-periph">       <rect x="24" y="459" width="672" height="40" fill="#ffffff"/>       <text x="36" y="485">IO Periph</text>       <path d="M264 479 h12" stroke="#617078" stroke-width="2"/>       <circle cx="366" cy="479" r="6" fill="#176954"/>       <circle cx="462" cy="479" r="6" fill="#176954"/>       <circle cx="558" cy="479" r="6" fill="#176954"/>       <circle cx="654" cy="479" r="6" fill="#176954"/>     </g>     <g id="entropy-pool">       <rect x="24" y="499" width="672" height="40" fill="#f1f5f3"/>       <text x="36" y="525">Entropy Pool</text>       <path d="M264 519 h12" stroke="#617078" stroke-width="2"/>       <circle cx="366" cy="519" r="6" fill="#176954"/>       <circle cx="462" cy="519" r="6" fill="#176954"/>       <path d="M552 519 h12" stroke="#617078" stroke-width="2"/>       <circle cx="654" cy="519" r="6" fill="#176954"/>     </g>     <g id="axi-extension">       <rect x="24" y="539" width="672" height="40" fill="#ffffff"/>       <text x="36" y="565">AXI Extension</text>       <path d="M264 559 h12" stroke="#617078" stroke-width="2"/>       <circle cx="366" cy="559" r="6" fill="#176954"/>       <circle cx="462" cy="559" r="6" fill="#176954"/>       <circle cx="558" cy="559" r="6" fill="#176954"/>       <circle cx="654" cy="559" r="6" fill="#176954"/>     </g>     <text x="24" y="617" font-size="16" font-weight="bold">DEDICATED PATH — OUTSIDE THE CROSSBAR</text>     <g id="boot-rom">       <rect x="24" y="634" width="672" height="40" fill="#f1f5f3"/>       <text x="36" y="660">Boot ROM</text>       <circle cx="270" cy="654" r="6" fill="#176954"/>       <circle cx="366" cy="654" r="6" fill="#176954"/>       <path d="M456 654 h12" stroke="#617078" stroke-width="2"/>       <path d="M552 654 h12" stroke="#617078" stroke-width="2"/>       <path d="M648 654 h12" stroke="#617078" stroke-width="2"/>     </g>   </g> </svg> 