<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="339px" preserveAspectRatio="none" style="width:517px;height:339px;background:#FFFFFF;" version="1.1" viewBox="0 0 517 339" width="517px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="470.7559" x="21.2031" y="16"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="446.9414" x="35.0176" y="37.1387">External interrupt taken - Control transferred to external interrupt handler</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="338.498" x="87.332" y="69.9688"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="314.6836" x="101.1465" y="91.1074">Claim interrupt at the PLIC, receiving an interrupt ID</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="380.2227" x="66.4697" y="123.9375"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="356.4082" x="80.2842" y="145.0762">Determine the interrupting peripheral from the interrupt ID</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="481.1621" x="16" y="177.9063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="457.3477" x="29.8145" y="199.0449">Handle the interrupt condition - peripheral no longer signalling the interrupt</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="230.8262" x="141.168" y="231.875"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207.0117" x="154.9824" y="253.0137">Complete the interrupt at the PLIC</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="256.2852" x="128.4385" y="285.8438"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.4707" x="142.2529" y="306.9824">Return from external interrupt handler</text><line style="stroke:#181818;stroke-width:1;" x1="256.5811" x2="256.5811" y1="49.9688" y2="69.9688"/><polygon fill="#181818" points="252.5811,59.9688,256.5811,69.9688,260.5811,59.9688,256.5811,63.9688" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="256.5811" x2="256.5811" y1="103.9375" y2="123.9375"/><polygon fill="#181818" points="252.5811,113.9375,256.5811,123.9375,260.5811,113.9375,256.5811,117.9375" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="256.5811" x2="256.5811" y1="157.9063" y2="177.9063"/><polygon fill="#181818" points="252.5811,167.9063,256.5811,177.9063,260.5811,167.9063,256.5811,171.9063" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="256.5811" x2="256.5811" y1="211.875" y2="231.875"/><polygon fill="#181818" points="252.5811,221.875,256.5811,231.875,260.5811,221.875,256.5811,225.875" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="256.5811" x2="256.5811" y1="265.8438" y2="285.8438"/><polygon fill="#181818" points="252.5811,275.8438,256.5811,285.8438,260.5811,275.8438,256.5811,279.8438" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><?plantuml-src VL1B3e903DrxYXv0Bu1BC974XV464oZGq6b96Op7TmQD6JHnr-Pz-buBE3q2cZW6aZZOCWK8RaI10vGgmPGXc9EvYo2s41JmLp4uQHdjk2kWP4S-Wrpq6n2kbxhSWs63T2VfmKd6gQkah33kdWHNmGTDx0cDfW4j7krC_PRmbf_N35zGez9I84rrCXDHO9KU3MRgOnLEHpRA