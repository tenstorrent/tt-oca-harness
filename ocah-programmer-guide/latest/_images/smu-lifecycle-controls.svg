<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1000" viewBox="0 0 1050 1000" role="img" aria-labelledby="title desc"> <!-- SPDX-License-Identifier: CC-BY-4.0 --> <!-- SPDX-FileCopyrightText: 2026 Tenstorrent USA, Inc. --> <title id="title">SEP lifecycle and feature-control distribution</title><desc id="desc">Lifecycle and feature-control inputs feed the SEP lifecycle controller. Separate rows identify each output and its consumers without crossing wires.</desc> <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#405469"/></marker></defs> <rect width="1050" height="1000" fill="white"/> <g font-family="DejaVu Sans, sans-serif" fill="#182c40"> <text x="24" y="34" font-size="22" font-weight="700" text-anchor="start"> <tspan x="24" dy="0">SEP lifecycle and feature-control distribution</tspan> </text> <text x="24" y="69" font-size="19" font-weight="700" text-anchor="start"> <tspan x="24" dy="0">Inputs to the SEP lifecycle controller and feature-control logic</tspan> </text> <rect x="24" y="91" width="315" height="79" rx="6" fill="#e8f3ff" stroke="#42759b" stroke-width="1.5"/> <text x="181.5" y="124.805" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="181.5" dy="0">OTP shadow registers</tspan> <tspan x="181.5" dy="22.950000000000003">LC_STATE, SIP_DIS, SYS_DIS</tspan> </text> <path d="M181.5 170 L181.5 204" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="363" y="91" width="315" height="79" rx="6" fill="#e8f3ff" stroke="#42759b" stroke-width="1.5"/> <text x="520.5" y="124.805" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="520.5" dy="0">Demotion CSRs</tspan> <tspan x="520.5" dy="22.950000000000003">DEMOTE_1/2 and LOCK_1/2</tspan> </text> <path d="M520.5 170 L520.5 204" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="702" y="91" width="324" height="79" rx="6" fill="#e8f3ff" stroke="#42759b" stroke-width="1.5"/> <text x="864.0" y="124.805" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="864.0" dy="0">Security disable</tspan> <tspan x="864.0" dy="22.950000000000003">SEC_DIS token match</tspan> </text> <path d="M864.0 170 L864.0 204" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="24" y="211" width="1002" height="66" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="525.0" y="250.8" font-size="20" font-weight="400" text-anchor="middle"> <tspan x="525.0" dy="0">SEP lifecycle controller and feature-control logic</tspan> </text> <text x="24" y="321" font-size="16" font-weight="700" text-anchor="start"> <tspan x="24" dy="0">OUTPUT / INTERNAL CONTROL</tspan> </text> <text x="480" y="321" font-size="16" font-weight="700" text-anchor="start"> <tspan x="480" dy="0">CONSUMER AND EFFECT</tspan> </text> <rect x="24" y="343" width="405" height="76" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="226.5" y="387.12" font-size="18" font-weight="400" text-anchor="middle"> <tspan x="226.5" dy="0">dbg_disable_o</tspan> </text> <path d="M429 381 L467 381" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="474" y="343" width="552" height="76" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="750.0" y="375.30499999999995" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="750.0" dy="0">DTP: disable selected STAPs, SIBs</tspan> <tspan x="750.0" dy="22.950000000000003">and SMC-fabric JTAG2AXI access</tspan> </text> <rect x="24" y="435" width="405" height="76" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="226.5" y="479.12" font-size="18" font-weight="400" text-anchor="middle"> <tspan x="226.5" dy="0">lc_state_o</tspan> </text> <path d="M429 473 L467 473" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="474" y="435" width="552" height="76" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="750.0" y="467.30499999999995" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="750.0" dy="0">SMC: eFuse JTAG access policy and LC_STATE CSR</tspan> <tspan x="750.0" dy="22.950000000000003">SMU boundary: lc_state_o</tspan> </text> <rect x="24" y="527" width="405" height="76" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="226.5" y="571.12" font-size="18" font-weight="400" text-anchor="middle"> <tspan x="226.5" dy="0">security_disable_o</tspan> </text> <path d="M429 565 L467 565" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="474" y="527" width="552" height="76" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="750.0" y="559.305" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="750.0" dy="0">SMC: sep_security_disable_i</tspan> <tspan x="750.0" dy="22.950000000000003">Security-disable override for the eFuse wrapper</tspan> </text> <rect x="24" y="619" width="405" height="76" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="226.5" y="650.97" font-size="18" font-weight="400" text-anchor="middle"> <tspan x="226.5" dy="0">sep_fuse_dft_disable_o</tspan> <tspan x="226.5" dy="24.3">smc_fuse_dft_disable_o</tspan> </text> <path d="M429 657 L467 657" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="474" y="619" width="552" height="76" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="750.0" y="651.305" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="750.0" dy="0">SMU boundary outputs for adopter DFT insertion</tspan> <tspan x="750.0" dy="22.950000000000003">Gate the respective DFT OTP access paths</tspan> </text> <rect x="24" y="711" width="405" height="76" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="226.5" y="755.12" font-size="18" font-weight="400" text-anchor="middle"> <tspan x="226.5" dy="0">feat_ctrl.sep_debug</tspan> </text> <path d="M429 749 L467 749" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="474" y="711" width="552" height="76" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="750.0" y="743.305" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="750.0" dy="0">SEP inbound AXI filter</tspan> <tspan x="750.0" dy="22.950000000000003">1: bypass filter; 0: filter external traffic</tspan> </text> <rect x="24" y="803" width="405" height="76" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="226.5" y="834.97" font-size="18" font-weight="400" text-anchor="middle"> <tspan x="226.5" dy="0">LC_STATE</tspan> <tspan x="226.5" dy="24.3">lcc_demote_state_1/2</tspan> </text> <path d="M429 841 L467 841" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="474" y="803" width="552" height="76" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="750.0" y="835.305" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="750.0" dy="0">Key Manager: lifecycle / demotion context</tspan> <tspan x="750.0" dy="22.950000000000003">Demotion state also reaches the SMU boundary</tspan> </text> <text x="24" y="936" font-size="16" font-weight="400" text-anchor="start"> <tspan x="24" dy="0">Each row is a separate control path. Names identify signals, not additional hardware blocks.</tspan> <tspan x="24" dy="21.6">Demotion CSRs clear on SEP cold reset; security disable overrides the normal feature restrictions.</tspan> </text> </g></svg> 