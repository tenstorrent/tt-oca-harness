<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="582" viewBox="0 0 1040 582" role="img" aria-labelledby="title desc">
<title id="title">Scrambler datapath</title>
<desc id="desc">Datapath of the combinational scrambler module. scrambler_key_i and addr_i feed u_addr_tweak, which repeats the address to 32 bits and XORs it with the key to form round_key. The address scramble function addr_scrambleN XORs addr_i with the low ADDR_WIDTH key bits, passes the result through sbox3 and sbox4 lanes and the permN permutation, and drives scrambled_addr_o. On the write path, write_data_i is XORed with round_key, passed through eight sbox4 S-boxes and then perm32, or perm8 on each byte when BYTE_WISE is 1, and leaves as scrambled_write_data_o. On the read path, scrambled_read_data_i passes through iperm32, or iperm8 per byte, then eight ibox4 inverse S-boxes, and is XORed with round_key to give read_data_o. The memory is outside the module.</desc>
