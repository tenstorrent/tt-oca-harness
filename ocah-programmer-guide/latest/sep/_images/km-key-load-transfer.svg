<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1348" viewBox="0 0 1040 1348" role="img" aria-labelledby="title desc">
<title id="title">Key load and key transfer</title>
<desc id="desc">Sequence diagram with five lifelines: SEP host firmware, the u_mailbox SEP-KM mailbox, KM firmware on u_cpu, the Key and Policy Vault u_kpv, and the crypto engines. Key load (CMD_KEY_LOAD, 0x26): the SEP pushes a command frame with KEY_SIZE, DEST_VALID, KEY_DATA and PAYLOAD_CRC32; the mailbox interrupts the KM; the KM pops the frame, checks the header CRC-8, sequence number, command ID, length and payload CRC, then KEY_SIZE and DEST_VALID, finds free consecutive slots, computes the CRC-32C of the key and registers a handle with DEST_VALID and that CRC; it shreds the slots, writes the key and write-locks the slots; it pushes RESP_CMD success with KEY_HANDLE, REQ_SIZE and DEST_VALID; the mailbox interrupts the SEP, which pops the response and keeps the handle. Key transfer (CMD_KEY_TRANSFER, 0x24): the SEP pushes KEY_HANDLE and DEST_ENGINE; after the same framing checks and argument range checks the KM reads the key slots and checks their CRC-32C against the registry, checks DEST_ENGINE against DEST_VALID, reads the key again and writes it into each requested engine as two masked key shares before setting key valid; it pushes RESP_CMD success with KEY_HANDLE and DEST_ENGINE, and the SEP pops the response. Crypto operation: the SEP configures and starts the engine, which interrupts the SEP when done.</desc>
