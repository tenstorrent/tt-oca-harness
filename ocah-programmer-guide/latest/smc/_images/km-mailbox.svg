<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="822" viewBox="0 0 1040 822" role="img" aria-labelledby="title desc">
<title id="title">Key Manager mailbox</title>
<desc id="desc">Block diagram of u_mailbox (km_mailbox). A KM-side AXI4-Lite subordinate port from u_xbar and a SEP-side AXI4-Lite subordinate port from the SEP host each enter an address decode. On the SEP side, SEP_WRITE_DATA pushes u_inbound_fifo and SEP_READ_DATA pops u_outbound_fifo; on the KM side, KM_WRITE_DATA pushes u_outbound_fifo and KM_READ_DATA pops u_inbound_fifo. Every other address reaches the side's own register block, u_km_regs or u_sep_regs, which hold STATUS, CTRL, IRQ_STATUS, IRQ_ENABLE and WRITE_SEPARATOR. Each FIFO word is 32 data bits plus a separator bit. Both register blocks see the depth, full, empty and separator status of both FIFOs, and a FLUSH from either side clears both FIFOs. Each register block ORs its enabled interrupt sources into mbox_irq_to_km_o or mbox_irq_to_sep_o.</desc>
