<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" role="img" aria-labelledby="title desc">
  <title id="title">eFuse sensing response stream</title>
  <desc id="desc">Timing of automatic fuse sensing. The sense FSM issues one READ for the whole bank, moves from ST_READ to ST_WAIT, and counts each single-cycle fuse_command_resp.valid strobe. Each strobe stores fuse_command_resp.data into the shadow register indexed by words_received_q and increments the counter, including back-to-back strobes on consecutive cycles. On the last word, when words_received_q equals NumShadowWords minus one, the FSM stores the final word, moves to ST_FINISHED without incrementing, and fuse_sense_done rises one cycle later.</desc>
  <defs>
    <marker id="red-end" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#b91c1c"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #1f2937; }
      .title { font-weight: bold; font-size: 16px; }
      .sig { font-family: "Courier New", monospace; font-size: 11px; }
      .cyc { font-size: 11px; fill: #6b7280; }
      .val { font-family: "Courier New", monospace; font-size: 10px; }
      .gap { font-size: 14px; font-weight: bold; fill: #6b7280; }
      .anno { font-size: 11px; fill: #b91c1c; }
      .frame { fill: #ffffff; stroke: #6b7280; stroke-width: 1; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .clk { fill: none; stroke: #374151; stroke-width: 1.5; }
      .bus { fill: #dbeafe; stroke: #315b9a; stroke-width: 1; }
      .x { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 1; }
      .valid { fill: none; stroke: #287a45; stroke-width: 2; }
      .done { fill: none; stroke: #7c3aed; stroke-width: 2; }
      .cause { fill: none; stroke: #b91c1c; stroke-width: 1; marker-end: url(#red-end); }
    </style>
  </defs>

  <rect x="210" y="10" width="750" height="28" class="frame"/>
  <text x="585" y="30" text-anchor="middle" class="title">eFuse sensing FSM</text>

  <text x="970" y="62" text-anchor="end" class="anno">last word: words_received_q == 255 (NumShadowWords - 1)</text>
  <text x="970" y="78" text-anchor="end" class="anno">store values[255], go to ST_FINISHED, no further increment</text>
  <path d="M820 84 V166" class="cause"/>

  <!-- Cycle grid -->
  <path d="M210 100 V425 M280 100 V425 M350 100 V425 M420 100 V425 M490 100 V425 M560 100 V425 M630 100 V425" class="grid"/>
  <path d="M680 100 V425 M750 100 V425 M820 100 V425 M890 100 V425 M960 100 V425" class="grid"/>

  <text x="198" y="112" text-anchor="end" class="cyc">cycle</text>
  <text x="245" y="112" text-anchor="middle" class="cyc">0</text>
  <text x="315" y="112" text-anchor="middle" class="cyc">1</text>
  <text x="385" y="112" text-anchor="middle" class="cyc">2</text>
  <text x="455" y="112" text-anchor="middle" class="cyc">3</text>
  <text x="525" y="112" text-anchor="middle" class="cyc">4</text>
  <text x="595" y="112" text-anchor="middle" class="cyc">5</text>
  <text x="715" y="112" text-anchor="middle" class="cyc">n</text>
  <text x="785" y="112" text-anchor="middle" class="cyc">n+1</text>
  <text x="855" y="112" text-anchor="middle" class="cyc">n+2</text>
  <text x="925" y="112" text-anchor="middle" class="cyc">n+3</text>

  <!-- Signal names -->
  <text x="198" y="141" text-anchor="end" class="sig">clk</text>
  <text x="198" y="185" text-anchor="end" class="sig">efuse_sense_state_q</text>
  <text x="198" y="229" text-anchor="end" class="sig">fuse_command_resp.valid</text>
  <text x="198" y="273" text-anchor="end" class="sig">fuse_command_resp.data[31:0]</text>
  <text x="198" y="317" text-anchor="end" class="sig">words_received_q</text>
  <text x="198" y="366" text-anchor="end" class="sig">shadow_efuse.values[N]</text>
  <text x="198" y="414" text-anchor="end" class="sig">fuse_sense_done</text>

  <!-- Break between cycle 5 and cycle n -->
  <text x="655" y="142" text-anchor="middle" class="gap">...</text>
  <text x="655" y="186" text-anchor="middle" class="gap">...</text>
  <text x="655" y="230" text-anchor="middle" class="gap">...</text>
  <text x="655" y="274" text-anchor="middle" class="gap">...</text>
  <text x="655" y="318" text-anchor="middle" class="gap">...</text>
  <text x="655" y="367" text-anchor="middle" class="gap">...</text>
  <text x="655" y="415" text-anchor="middle" class="gap">...</text>

  <!-- clk -->
  <path d="M210 150 V125 H245 V150 H280 V125 H315 V150 H350 V125 H385 V150 H420 V125 H455 V150 H490 V125 H525 V150 H560 V125 H595 V150 H630" class="clk"/>
  <path d="M680 150 V125 H715 V150 H750 V125 H785 V150 H820 V125 H855 V150 H890 V125 H925 V150 H960" class="clk"/>

  <!-- efuse_sense_state_q -->
  <polygon points="210,181.5 215,169 275,169 280,181.5 275,194 215,194" class="bus"/>
  <text x="245" y="185" text-anchor="middle" class="val">ST_READ</text>
  <polygon points="280,181.5 285,169 625,169 630,181.5 625,194 285,194" class="bus"/>
  <text x="455" y="185" text-anchor="middle" class="val">ST_WAIT</text>
  <polygon points="680,181.5 685,169 815,169 820,181.5 815,194 685,194" class="bus"/>
  <text x="750" y="185" text-anchor="middle" class="val">ST_WAIT</text>
  <polygon points="820,181.5 825,169 955,169 960,181.5 955,194 825,194" class="bus"/>
  <text x="890" y="185" text-anchor="middle" class="val">ST_FINISHED</text>

  <!-- fuse_command_resp.valid -->
  <path d="M210 238 H350 V213 H420 V238 H490 V213 H630 V238" class="valid"/>
  <path d="M680 238 H750 V213 H820 V238 H960" class="valid"/>

  <!-- fuse_command_resp.data -->
  <polygon points="210,269.5 215,257 345,257 350,269.5 345,282 215,282" class="x"/>
  <polygon points="350,269.5 355,257 415,257 420,269.5 415,282 355,282" class="bus"/>
  <text x="385" y="273" text-anchor="middle" class="val">ABCD_1234</text>
  <polygon points="420,269.5 425,257 485,257 490,269.5 485,282 425,282" class="x"/>
  <polygon points="490,269.5 495,257 555,257 560,269.5 555,282 495,282" class="bus"/>
  <text x="525" y="273" text-anchor="middle" class="val">ABCD_5A5A</text>
  <polygon points="560,269.5 565,257 625,257 630,269.5 625,282 565,282" class="bus"/>
  <text x="595" y="273" text-anchor="middle" class="val">ABCD_BEEF</text>
  <polygon points="680,269.5 685,257 745,257 750,269.5 745,282 685,282" class="x"/>
  <polygon points="750,269.5 755,257 815,257 820,269.5 815,282 755,282" class="bus"/>
  <text x="785" y="273" text-anchor="middle" class="val">ABCD_F00D</text>
  <polygon points="820,269.5 825,257 955,257 960,269.5 955,282 825,282" class="x"/>

  <!-- words_received_q -->
  <polygon points="210,313.5 215,301 415,301 420,313.5 415,326 215,326" class="bus"/>
  <text x="315" y="317" text-anchor="middle" class="val">0</text>
  <polygon points="420,313.5 425,301 555,301 560,313.5 555,326 425,326" class="bus"/>
  <text x="490" y="317" text-anchor="middle" class="val">1</text>
  <polygon points="560,313.5 565,301 625,301 630,313.5 625,326 565,326" class="bus"/>
  <text x="595" y="317" text-anchor="middle" class="val">2</text>
  <polygon points="680,313.5 685,301 955,301 960,313.5 955,326 685,326" class="bus"/>
  <text x="820" y="317" text-anchor="middle" class="val">255</text>

  <path d="M420 241 V298" class="cause"/>
  <path d="M560 241 V298" class="cause"/>

  <!-- shadow_efuse.values -->
  <polygon points="210,362 215,345 415,345 420,362 415,379 215,379" class="x"/>
  <text x="315" y="366" text-anchor="middle" class="val">reset value</text>
  <polygon points="420,362 425,345 555,345 560,362 555,379 425,379" class="bus"/>
  <text x="490" y="359" text-anchor="middle" class="val">[0]</text>
  <text x="490" y="373" text-anchor="middle" class="val">ABCD_1234</text>
  <polygon points="560,362 565,345 625,345 630,362 625,379 565,379" class="bus"/>
  <text x="595" y="359" text-anchor="middle" class="val">[1]</text>
  <text x="595" y="373" text-anchor="middle" class="val">ABCD_5A5A</text>
  <polygon points="680,362 685,345 815,345 820,362 815,379 685,379" class="bus"/>
  <text x="750" y="366" text-anchor="middle" class="val">[254]</text>
  <polygon points="820,362 825,345 955,345 960,362 955,379 825,379" class="bus"/>
  <text x="890" y="359" text-anchor="middle" class="val">[255]</text>
  <text x="890" y="373" text-anchor="middle" class="val">ABCD_F00D</text>

  <!-- fuse_sense_done -->
  <path d="M210 423 H630" class="done"/>
  <path d="M680 423 H890 V398 H960" class="done"/>
</svg>
