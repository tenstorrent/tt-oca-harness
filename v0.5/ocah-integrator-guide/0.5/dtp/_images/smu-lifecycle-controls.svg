<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">SEP lifecycle and feature-control distribution</title>
<desc id="desc">The OTP shadow registers (LC_STATE, SIP_DIS and SYS_DIS), the demotion CSRs and the security-disable token feed the SEP Life Cycle Controller and its Feature Control logic. dbg_disable_o parks the DTP STAPs, closes the DFT and DFD SIBs and blocks SMC-fabric JTAG2AXI. lc_state_o sets the SMC eFuse JTAG policy and LC_STATE CSR and leaves the SMU, security_disable_o drives the SMC eFuse security-disable override, and the fuse DFT disables leave the SMU for adopter DFT insertion. Inside the SEP, feat_ctrl.sep_debug bypasses the inbound AXI filter, and the demotion state reaches the Key Manager and the SMU boundary.</desc>
<defs>
