<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="624" viewBox="0 0 1040 624" role="img" aria-labelledby="title desc">
<title id="title">Entropy source ring-oscillator complex</title>
<desc id="desc">Entropy source ring-oscillator complex, in three bands. Sample clock, one per lane: a clock mux selects rosc_sample_clk_i or a shared ring oscillator of 109 stages with a 53-stage tap, which runs when any lane is enabled and detunes when any lane detunes; a five-stage ripple divider and divide-select clock muxes give divide-by-1 to divide-by-32 as sample_clk[i]. Noise lane, twelve instances: the lane ring oscillator, enabled by RING_OSC_ENABLE[i], is sampled by a flop on sample_clk[i], synchronized by two flops on clk_i and decorrelated into a byte for the BIW extractor. An 8-bit health test on that byte drives an auto-tune FSM, and a detune select chooses the auto-tune state or RING_OSC_TUNE.DETUNE[i] as the lane detune. Ring oscillator: a NAND2 stage gated by enable_i feeds a buffer chain; the tap mux takes the stage TAPPED_LENGTH-1 output or the stage TOTAL_LENGTH-1 output under detune_i, feeds it back to the NAND2 and drives noise_o through an output buffer.</desc>
