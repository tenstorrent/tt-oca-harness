<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="966" viewBox="0 0 1040 966" role="img" aria-labelledby="title desc">
<title id="title">SMC pad ring GPIO interfaces and adopter pad shims</title>
<desc id="desc">The local crossbar u_smc_local_xbar, inside u_smc_base, sends the peripheral window to u_smc_peripherals. There the peripheral crossbar u_smc_periph_axi_lite_xbar sends the GPIO interface window to u_smc_padring and the smc_external window out of u_smc_peripherals and the SMC. Inside u_smc_padring, u_gpio_intf_demux decodes one 16-byte slot per pad to the 65 gpio controllers gen_gpio_intf[0] to gen_gpio_intf[64].u_gpio_interface and answers any other address with DECERR from u_intf_demux_err_slv. The combinational LSIO pad map assigns the SMC peripheral pad functions to fixed pads and drives each controller's LSIO plane. Each controller's pad-facing wires leave the SMC for the adopter's pad integration, where a gpio_shim per pad drives the technology pad macro. The adopter decodes the smc_external window and gives each gpio_shim its gpio_ctrl slot; the remaining targets of that window are adopter-specific.</desc>
