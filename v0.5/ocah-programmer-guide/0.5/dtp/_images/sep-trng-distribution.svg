<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="624" viewBox="0 0 1040 624" role="img" aria-labelledby="title desc">
<title id="title">SEP TRNG and DRBG entropy distribution</title>
<desc id="desc">SEP TRNG and DRBG entropy distribution. Inside sep_crypto, the TRNG block u_sep_trng holds the entropy source and the DRBG. The entropy source sends a 32-bit entropy stream to the DRBG, where a seed packer builds 384-bit seeds from twelve words for CSRNG; EDN draws from CSRNG and fills three AXI-Stream endpoint FIFOs of eight entries. The crypto AXI interconnect reaches the entropy source, CSRNG and EDN registers and the external TRNG registers. The three DRBG streams and three external TRNG streams enter a source select of three 2:1 muxes controlled by EXT_TRNG_SRC_SEL. Stream 0 feeds the Key Manager DRBG sampler. Stream 1 feeds an EDN adapter with a four-entry staging FIFO, a round-robin arbiter and a one-entry FIFO per client, serving AES, KMAC, OTBN RND and OTBN URND over native EDN. Stream 2 feeds a one-client EDN adapter that fills the entropy pool outside sep_crypto, which packs words to 64 bits into a 32-entry FIFO read through the SEP local crossbar.</desc>
