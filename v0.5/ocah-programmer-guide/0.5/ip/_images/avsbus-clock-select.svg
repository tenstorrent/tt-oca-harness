<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="422" viewBox="0 0 1040 422" role="img" aria-labelledby="title desc">
<title id="title">AVSBus clock selection</title>
<desc id="desc">clk_reg_i and clk_ref_i each pass a clock gate, u_apbclk_clkgate and u_refclk_clkgate, which close while AVS_CFG_1.TURN_OFF_ALL_PREMUX_CLOCKS is set. The anti-glitch mux u_refclk_apbclk_mux, a prim_ag_clk_mux, selects clk_reg_i when AVS_CLOCK_SELECT[1] is 0 and clk_ref_i when it is 1, and selects clk_ref_i during reset. The test mux u_test_clkmux2_0 replaces the result with clk_test_i while test_en_i is high, giving pre_div_clk. In the programmable divider u_clk_div, pre_div_clk feeds both the divider, set by CLK_DIVIDER_VALUE and CLK_DIVIDER_DUTY_CYCLE_NUMERATOR, and the bypass input of the glitch-free post-divider mux, which AVS_CLOCK_SELECT[0] switches to the divided clock. Its output avs_clk clocks the AVS-domain logic and passes the clock gate u_avs_bus_clkgate, enabled by the protocol FSM, to avs_clock_o. test_en_i forces both select bits to 0.</desc>
