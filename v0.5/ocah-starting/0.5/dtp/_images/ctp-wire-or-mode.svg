<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="522" viewBox="0 0 1040 522" role="img" aria-labelledby="title desc">
<title id="title">Cross Trigger Port in wire-OR mode</title>
<desc id="desc">The Cross Trigger Port with CONFIG.MODE set to wire-OR, showing only the logic that is active in that mode. ct_src_i starts u_pulse_stretcher; the stretched pulse is registered as the CT_Req_out pad output enable and as busy_o. The pad output data is invert_i, so an enabled pad pulls the shared wire low (or high when inverted), and the pad input enable is 1. The pad input passes through two synchroniser registers and an XOR with invert_i into a falling-edge detector, a register holding the previous level and an AND gate with one inverted input; its registered output is ct_dst_o. The other three pads are disabled.</desc>
