<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="446" viewBox="0 0 1040 446" role="img" aria-labelledby="title desc">
<title id="title">Entropy source decorrelator</title>
<desc id="desc">Entropy source decorrelator, entropy_decorrelator, with LENGTH 29. The synchronized noise bit noise_i is XORed with the feedback bit and shifted into ff_stage[0]; the chain shifts through ff_stage[28] on every enabled clk_i cycle. The feedback is ff_stage[28], forced to 0 while bypass_i is high so raw noise shifts through unmixed. The top eight stages, ff_stage[28:21], are ANDed with byte_mask_i. A downsample counter reloads from sample_clk_div_i each time it reaches zero; at zero the output register captures the masked byte as entropy_byte_sample_o and pulses entropy_byte_valid_o for one cycle, so a byte leaves every sample_clk_div_i plus one cycles. enable_i holds the chain and reloads the counter while low.</desc>
