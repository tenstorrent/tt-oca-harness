<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="772" viewBox="0 0 1040 772" role="img" aria-labelledby="title desc">
<title id="title">SMC output fabric</title>
<desc id="desc">Outbound path of smc_output_fabric. A request from the input fabric (56-bit address, 6-bit ID) reaches the 1 to 3 demux u_output_axi_demux. Addresses in the 8 MiB M-mode window at 0x0100_0000 above the local or the global SMC base go through the M-mode output remap u_mmode_addr_remap, addresses in the 8 MiB Xvisor window at 0x0180_0000 above either base go through the Xvisor output remap u_xvisor_addr_remap, and every other address goes through u_prim_axi_user_override_struct. Each output remap has 8 regions of 1 MiB; the M-mode remap sets the AxUSER source ID to MMODE (0xC), the Xvisor remap sets it to OTHERS (0) and the direct path sets it to SMC (3). The 3 to 1 mux u_output_mux merges the paths and widens the ID from 6 to 8 bits. This remap stage exists when NO_ADDR_REMAP is 0, as smc_config_pkg sets it; with NO_ADDR_REMAP set to 1 a single ID converter from 6 to 8 bits replaces it. The 16-entry outbound traffic filter u_smc_sys_outbound_filter, which passes traffic that matches no entry, then drives the system AXI output (56-bit address, 8-bit ID).</desc>
<defs>
