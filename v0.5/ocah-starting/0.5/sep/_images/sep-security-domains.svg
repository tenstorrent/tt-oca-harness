<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="552" viewBox="0 0 1040 552" role="img" aria-labelledby="title desc">
<title id="title">SEP security domains</title>
<desc id="desc">A SiP holds three chiplets on one JTAG chain. External debug enters the PTAP of chiplet 1, the primary chiplet with its own SEP and LCC. There, SIP_DBG, the SiP-owner domain gate, admits the traffic and opens Case 1: the I/O STAP that forwards the chain to the next chiplet, host scan injection and DFD. CHIPLET_DBG, a chiplet-owner domain gate, adds Case 2: the SMC STAP, extra STAPs, non-secure DFT, SMC fabric JTAG2AXI and, with SMC_FUSE_DBG, the SMC fuse DFT path. SEP_DBG adds Case 3: the SEP STAP, secure DFT and, with SEP_FUSE_DBG, the SEP fuse DFT path. Chiplet 2 has no SEP, so its PTAP passes traffic to its local assets and to its STAP without a local gate; only SIP_DBG of chiplet 1 governs it. Chiplet 3 has its own SEP and repeats the three gates of chiplet 1 with its own SIP_DBG, CHIPLET_DBG and SEP_DBG.</desc>
