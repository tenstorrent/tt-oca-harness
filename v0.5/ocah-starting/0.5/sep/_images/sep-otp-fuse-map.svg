<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1030" viewBox="0 0 1040 1030" role="img" aria-labelledby="title desc">
<title id="title">SEP OTP fuse map</title>
<desc id="desc">The SEP fuse bank holds 8192 bits, 256 32-bit words from offset 0x000 to 0x3FF, drawn eight words per row. From offset 0x000: LOCKS (64 bits), LOCKS_SPARE, LC_STATE, SBOOT_DIS and TRANSIENT_RMA_EN (32 bits each), SIP_DIS and SYS_DIS (64 bits each), then the 256-bit RMA_SIP_TOKEN_DIGEST, RMA_CHIPLET_TOKEN_DIGEST and CLASS_KEY, the 32-bit CHIPLET_PUBK_REVOKE, the 256-bit BL1_VERSION, BL2_VERSION, CHIPLET_UID, SIP_PUBK_HASH0, SIP_UID, SYS_PUBK_HASH and SYS_UID, the 32-bit STATUS_RPT, ROM_CTL and SYSCLK_FREQ_MHZ, the 256-bit CHIPLET_PUBK_HASH0 and CHIPLET_PUBK_HASH1, the 32-bit REQUIRED_SIGNERS and REQUIRED_ALGS, the 256-bit CHIPLET_PUBK_PQC_HASH0, CHIPLET_PUBK_PQC_HASH1, SIP_PUBK_PQC_HASH0, SYS_PUBK_PQC_HASH, SIP_PUBK_HASH1, SIP_PUBK_PQC_HASH1, SEP_CHIPLET_ID, SEP_SIP_ID and SEP_SYS_ID, and nine 256-bit spare fields, spare0 to spare8, from 0x2E0 to the end. The lock, lifecycle, disable-vector and RMA digest fields are held in non-scannable shadow storage; CLASS_KEY, CHIPLET_UID, SIP_UID and SYS_UID are also non-scannable and read as zero downstream in secure test mode.</desc>
