<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="586" viewBox="0 0 1040 586" role="img" aria-labelledby="title desc">
<title id="title">SiP cross-trigger topology</title>
<desc id="desc">A package of six chiplets numbered 0 to 5. Chiplets 0, 1 and 2 each have a CTP in wire-OR mode whose CT_Req_out pad joins one shared open-drain wire, which also reaches a package pin. Point-to-point CTP pairs link Chiplet 4 to Chiplet 0, Chiplet 0 to Chiplet 3 and Chiplet 3 to Chiplet 5, each with four wires: request out to request in and acknowledge out to acknowledge in in both directions. Chiplet 0 therefore has three CTPs and bridges the wire-OR group to the point-to-point chiplets; Chiplet 3 has two. In every chiplet the CTM connects to each CTP and to the local CLAs.</desc>
