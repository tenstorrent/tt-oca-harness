default:
  tags: [chiplet-ip]

stages:
  - guard

unexpected-root-pipeline:
  stage: guard
  script:
    - |
      echo "This repository's GitLab mirror must use the trusted parent pipeline configured in the project CI/CD settings."
      echo "If this root .gitlab-ci.yml ran, that configuration regressed."
      exit 1
