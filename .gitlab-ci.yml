default:
  tags: [chiplet-ip]

stages:
  - init
  - nonfree

# The only nonfree knob CI sets: swap ocah.mk's SSH default for an HTTPS URL
# carrying the runner's access token (NONFREE_REPO_PAT is a masked project
# variable). Which commit to check out stays in ocah.mk, so the open tree and the
# nonfree tree always move in lockstep. Both jobs inherit this, and the trigger
# job hands it to the child pipeline, which has to re-clone nonfree into its own
# workspace (trigger:forward:yaml_variables defaults to true and covers inherited
# variables).
variables:
  OCAH_NONFREE_REMOTE: "https://x-access-token:${NONFREE_REPO_PAT}@github.com/tenstorrent/tt-oca-harness-nonfree.git"

# Run on mirror-sync pushes, MRs, external PRs (GitHub mirror), manual web
# triggers, and scheduled pipelines (the weekly EDA checks in the nonfree child
# select themselves via the SCHEDULE_TYPE variable set on each schedule).
.ci_rules: &ci_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'external_pull_request_event'
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_PIPELINE_SOURCE == 'schedule'

init:
  stage: init
  <<: *ci_rules
  script:
    - |
      set -e
      # `trigger:` must include a child YAML. Job `rules` are fixed when the
      # parent is created, so they cannot read this classification, and an
      # env var cannot skip the trigger without a companion change. Schedule
      # and web always clone. A documentation-only push or PR writes a
      # one-job child so the required GitHub check still goes green.
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] || [ "$CI_PIPELINE_SOURCE" = "web" ]; then
        make ocah-nonfree-init
      elif python3 scripts/ci/diff_class.py --write-documentation-only-child nonfree/ci.yml; then
        echo "Documentation-only diff; companion child is a one-job report."
      else
        make ocah-nonfree-init
      fi
  artifacts:
    paths:
      - nonfree/ci.yml

nonfree:
  stage: nonfree
  needs: [ init ]
  <<: *ci_rules
  variables:
    # Child jobs see CI_PIPELINE_SOURCE == 'parent_pipeline'; hand them the
    # parent's source so their rules can distinguish web/schedule/push runs.
    PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
  trigger:
    include:
      - artifact: nonfree/ci.yml
        job: init
    strategy: depend
    forward:
      # Forward schedule/web-form pipeline variables (SCHEDULE_TYPE and the
      # weekly *_TOP_MODULE knobs) into the child pipeline; yaml_variables
      # stays at its default (true) and covers PARENT_PIPELINE_SOURCE above.
      pipeline_variables: true
