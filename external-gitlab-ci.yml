# This configuration is loaded by the tt-oca-harness mirror through its
# ci_config_path setting. Keeping it outside the mirrored repository prevents a
# pull request from changing the pipeline definition that GitLab executes.
workflow:
  rules:
    - if: '$CI_PROJECT_PATH == "tensix/soc/tt-oca-harness"'
    - when: never

default:
  tags: [chiplet-ip]

stages:
  - init
  - nonfree

variables:
  OCAH_NONFREE_REMOTE: "https://x-access-token:${NONFREE_REPO_PAT}@github.com/tenstorrent/tt-oca-harness-nonfree.git"
  OCAH_NONFREE_REV:
    value: "main"
    description: "Nonfree branch or commit to check out"
  # The private submodules use SSH URLs in .gitmodules, but GitLab runners do
  # not carry an organization-authorized SSH key. The harness init target uses
  # this token to rewrite only those submodule URLs to authenticated HTTPS.
  OCAH_SUBMODULE_TOKEN: "${OCA_BOOT_MANIFEST_OCA_MODEL_PAT}"

.ci_rules: &ci_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == 'push'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'external_pull_request_event'
    - if: $CI_PIPELINE_SOURCE == 'web'
    - if: $CI_PIPELINE_SOURCE == 'schedule'

init:
  stage: init
  <<: *ci_rules
  script:
    - |
      set -e
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] || [ "$CI_PIPELINE_SOURCE" = "web" ]; then
        git clone "$OCAH_NONFREE_REMOTE" nonfree
        git -C nonfree checkout "$OCAH_NONFREE_REV"
      else
        git fetch --depth=1 origin main
        git show origin/main:scripts/ci/diff_class.py > .trusted-diff-class.py
        if python3 .trusted-diff-class.py --write-documentation-only-child nonfree/ci.yml; then
          echo "Documentation-only diff; companion child is a one-job report."
        else
          git clone "$OCAH_NONFREE_REMOTE" nonfree
          git -C nonfree checkout "$OCAH_NONFREE_REV"
        fi
        rm -f .trusted-diff-class.py
      fi
  artifacts:
    paths:
      - nonfree/ci.yml

nonfree:
  stage: nonfree
  needs: [init]
  <<: *ci_rules
  variables:
    PARENT_PIPELINE_SOURCE: $CI_PIPELINE_SOURCE
  trigger:
    include:
      - artifact: nonfree/ci.yml
        job: init
    strategy: depend
    forward:
      pipeline_variables: true
