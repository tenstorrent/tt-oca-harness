# Path packages resolving against the vendored trees. Transitive pulp-platform
# packages (common_cells/axi/...) are pinned to their vendored paths in Bender.local.
dependencies:
  aou: { path: "vendor/tenstorrent/aou-rtl" }
  el2: { path: "vendor/chipsalliance/Cores-VeeR-EL2" }
  idma: { path: "vendor/pulp-platform/idma" }
  opentitan: { path: "vendor/lowRISC/opentitan" }
  picorv32: { path: "vendor/tenstorrent/tt-picorv32" }

# Third-party IP vendored into vendor/<org>/<pkg>/upstream via `bender vendor init`.
# Each package has a hand-authored Bender.yml at its root so it resolves as a local
# path package; local patches live in patches/, generated collateral in overlay/
# (never touched by vendor init).
vendor_package:
  # OpenTitan: prim + per-IP rtl/hjson + the curated util/reggen + util/design/mubi
  # file set (imported by tools/regs/reggen_wrapper.py to export register hjson to
  # SystemRDL), all via include_from_upstream. NB: bender ignores
  # include_from_upstream when a `mapping:` is present, so these are explicit file
  # entries rather than a mapping block.
  - name: opentitan
    target_dir: vendor/lowRISC/opentitan/upstream
    upstream: { git: "https://github.com/tenstorrent/tt-opentitan.git", rev: "bbe4dbf28bbfe815dcd11d723dc3e38635b46704" }
    include_from_upstream:
      - "hw/ip/prim/rtl"
      - "hw/ip/prim_generic/rtl"
      - "hw/ip/prim_generic/lint"
      # Per-IP rtl (incl. reggen-generated reg_pkg/reg_top) + the <ip>.hjson that
      # feeds the SystemRDL register flow. dma/spi_host are vendored under their
      # upstream names; the register flow renames them to secure_dma/spi_controller.
      # entropy_src: only its hjson feeds the register flow.
      - "hw/ip/otbn/rtl"
      - "hw/ip/otbn/data/otbn.hjson"
      - "hw/ip/aon_timer/rtl"
      - "hw/ip/aon_timer/data/aon_timer.hjson"
      - "hw/ip/csrng/rtl"
      - "hw/ip/csrng/data/csrng.hjson"
      - "hw/ip/edn/rtl"
      - "hw/ip/edn/data/edn.hjson"
      - "hw/ip/dma/rtl"
      - "hw/ip/dma/data/dma.hjson"
      - "hw/ip/spi_host/rtl"
      - "hw/ip/spi_host/data/spi_host.hjson"
      - "hw/ip/aes/rtl"
      - "hw/ip/aes/data/aes.hjson"
      - "hw/ip/hmac/rtl"
      - "hw/ip/hmac/data/hmac.hjson"
      - "hw/ip/kmac/rtl"
      - "hw/ip/kmac/data/kmac.hjson"
      - "hw/ip/entropy_src/rtl"
      - "hw/ip/entropy_src/data/entropy_src.hjson"
      # Curated util/reggen + util/design/mubi modules imported by reggen_wrapper.py
      # to export <ip>.hjson -> SystemRDL.
      - "util/reggen/access.py"
      - "util/reggen/alert.py"
      - "util/reggen/bits.py"
      - "util/reggen/bus_interfaces.py"
      - "util/reggen/clocking.py"
      - "util/reggen/countermeasure.py"
      - "util/reggen/enum_entry.py"
      - "util/reggen/exporter.py"
      - "util/reggen/feature.py"
      - "util/reggen/field.py"
      - "util/reggen/inter_signal.py"
      - "util/reggen/interrupt.py"
      - "util/reggen/ip_block.py"
      - "util/reggen/lib.py"
      - "util/reggen/memory.py"
      - "util/reggen/multi_register.py"
      - "util/reggen/params.py"
      - "util/reggen/reg_base.py"
      - "util/reggen/reg_block.py"
      - "util/reggen/register.py"
      - "util/reggen/signal.py"
      - "util/reggen/systemrdl_exporter.py"
      - "util/reggen/systemrdl/udp.py"
      - "util/reggen/systemrdl/udp.rdl"
      - "util/reggen/window.py"
      - "util/design/mubi/prim_mubi.py"
    exclude_from_upstream:
      # FPGA RegFile variants are never selected (SEP uses RegFileFF).
      - "hw/ip/otbn/rtl/otbn_rf_base_fpga.sv"
      - "hw/ip/otbn/rtl/otbn_rf_bignum_fpga.sv"
    patch_dir: "vendor/lowRISC/opentitan/patches"

  # pulp-platform packages. Each upstream/ is reproduced at the pinned rev; the
  # per-package Bender.yml + patches/ + overlay/ are committed and not touched by
  # vendor init.
  - name: common_verification
    target_dir: "vendor/pulp-platform/common_verification/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-common_verification.git", rev: "c5d97a1fae01d2d8e8e311dee341b6b8849dcf38" }
    include_from_upstream:
      - "src"
      - "test"
    patch_dir: "vendor/pulp-platform/common_verification/patches"

  - name: common_cells
    target_dir: "vendor/pulp-platform/common_cells/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-common_cells.git", rev: "b74f0ad63600762ef101cf1d3365d19dfbb3123b" }
    include_from_upstream:
      - "src"
      - "include"
      - "test"
    patch_dir: "vendor/pulp-platform/common_cells/patches"

  # apb is flattened via per-file mapping (src/<f> -> <f>); only the sources tt-oca
  # instantiates are mapped. The patch-bearing mapping is listed first so the
  # apb_demux fix applies before the per-file copies.
  - name: apb
    target_dir: "vendor/pulp-platform/apb/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-apb.git", rev: "77ddf073f194d44b9119949d2421be59789e69ae" }
    patch_dir: "vendor/pulp-platform/apb/patches"
    mapping:
      - { from: "src/apb_demux.sv",   to: "apb_demux.sv",   patch_dir: "." }
      - { from: "src/apb_pkg.sv",     to: "apb_pkg.sv" }
      - { from: "src/apb_intf.sv",    to: "apb_intf.sv" }
      - { from: "src/apb_cdc.sv",     to: "apb_cdc.sv" }
      - { from: "include",            to: "include" }

  # axi pinned at the merge-base; in-place edits + extra modules are applied via the
  # patch. scripts/fabric_gen + block_flow customizations live in overlay/
  # (committed, not vendor-init managed).
  - name: axi
    target_dir: "vendor/pulp-platform/axi/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-axi.git", rev: "808e7b326f9f259bd2831847d9362291500db641" }
    include_from_upstream:
      - "src"
      - "include"
    patch_dir: "vendor/pulp-platform/axi/patches"

  # idma vendored at the v0.6.5-src release (target/rtl/ is empty upstream; the
  # generated bundle lives in overlay/target/). In-place src edits are the numbered
  # patches.
  - name: idma
    target_dir: "vendor/pulp-platform/idma/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-iDMA.git", rev: "b248755b3265ff88b826eeec5e23eef012ba61b5" }
    include_from_upstream:
      - "src"
    patch_dir: "vendor/pulp-platform/idma/patches"

  - name: axi_stream
    target_dir: "vendor/pulp-platform/axi_stream/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-axi_stream.git", rev: "54891ff40455ca94a37641b9da4604647878cc07" }
    include_from_upstream:
      - "src"
      - "include"
      - "test"
    patch_dir: "vendor/pulp-platform/axi_stream/patches"

  # obi/register_interface pruned to the instantiation closure tt-oca uses
  # (explicit include lists reproduce that set).
  - name: obi
    target_dir: "vendor/pulp-platform/obi/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-obi.git", rev: "b3f47e00e3a60ee3346253e3e7be7d1f732f05fd" }
    include_from_upstream:
      - "src/obi_pkg.sv"
      - "include/obi/typedef.svh"
    patch_dir: "vendor/pulp-platform/obi/patches"

  - name: register_interface
    target_dir: "vendor/pulp-platform/register_interface/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-register_interface.git", rev: "d6e1d4cdaab7870f4faf3f88a1c788eaf5ac129d" }
    include_from_upstream:
      - "src/reg_intf.sv"
      - "src/reg_demux.sv"
      - "src/reg_mux.sv"
      - "src/periph_to_reg.sv"
      - "src/axi_to_reg_v2.sv"
      - "include/register_interface/typedef.svh"
      - "include/register_interface/assign.svh"
    patch_dir: "vendor/pulp-platform/register_interface/patches"

  # VeeR EL2 core pinned at the merge-base (zero RTL delta, so no patch). Generated
  # config snapshots live in overlay/.
  - name: veer_el2
    target_dir: "vendor/chipsalliance/Cores-VeeR-EL2/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-Cores-VeeR-EL2.git", rev: "b5e2e9d0d2383b2cb6d864b6b36d689a09bfb684" }
    include_from_upstream:
      - "design"
      - "configs"
      - "tools"
      - "testbench"
    patch_dir: "vendor/chipsalliance/Cores-VeeR-EL2/patches"

  - name: picorv32
    target_dir: "vendor/tenstorrent/tt-picorv32/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-picorv32.git", rev: "9cc836f58580d59d90e8a764382aa78acb14d399" }
    include_from_upstream:
      - "picorv32.sv"
      - "picorv32_axi.sv"
      - "picorv32_axi_adapter.sv"
      - "picorv32_pcpi_div.sv"
      - "picorv32_pcpi_fast_mul.sv"
      - "picorv32_pcpi_mul.sv"
      - "picorv32_regs.sv"
      - "picorv32_wb.sv"
    patch_dir: "vendor/tenstorrent/tt-picorv32/patches"

  # AXI-over-UCIe (AoU) bridge IP, developed by BOS Semiconductors and Tenstorrent
  # natively in the tenstorrent org (not a fork of a third-party upstream). RTL/ is
  # the synthesizable design (incl. its AXI4MUX_3X1/ and LIB/ subtrees); csr/ is the
  # SystemRDL register description. DOC/, INTEG/, VERIF/, and scripts/ are excluded
  # (docs, timing/power collateral, cocotb testbench, and lint/collateral scripts).
  - name: aou
    target_dir: "vendor/tenstorrent/aou-rtl/upstream"
    upstream: { git: "https://github.com/tenstorrent/aou-rtl.git", rev: "28716da1c1e588636f88410d47846714c63058eb" }
    include_from_upstream:
      - "RTL"
      - "csr"
    patch_dir: "vendor/tenstorrent/aou-rtl/patches"

# Auto-generated open-tree RTL source wiring for Plan C.
# Keep this source list limited to open-tree roots and exclude stale 1-core, DV/FV,
# testbench, build, and generated-documentation collateral.
sources:
  - target: all(not(dv), not(fv))
    include_dirs:
      - hw/common/assert
      - hw/ip/dfd/rtl/misc
      - hw/ip/dfd/rtl/pkg
      - hw/ip/efuse/rtl/svh
      - hw/sys/smc/rtl/smc_cpu
      - vendor/chipsalliance/Cores-VeeR-EL2/overlay/snapshots/sep
      - vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl
      - vendor/pulp-platform/idma/overlay/target/rtl/include/idma
