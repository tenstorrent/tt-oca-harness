      # =====================================================================
      # Adams Bridge PQC (ML-DSA-87 / ML-KEM-1024) + Caliptra KV client helpers
      #   vendor/chipsalliance/adams-bridge : chipsalliance/adams-bridge @ e59eba9
      #   vendor/chipsalliance/caliptra-rtl : caliptra-rtl @ ec349a89 (KV clients only;
      #                               kv.sv vault NOT compiled -- sep_abr_kv_shim replaces it)
      # Two defines, deliberately set together here so they can never disagree:
      #   CALIPTRA   - required BY THE VENDORED RTL; gates abr_top's Caliptra
      #                Key-Vault ports and the kv_* client helpers. Do not use it
      #                as a feature switch in OCAH code.
      #   SEP_ABR_EN - OCAH's own switch for "is the Adams Bridge block present in
      #                this SEP build". Used by SEP crypto RTL and
      #                hw/top/sep_ip_integration.sv (engine + SRAMs). Enabling ABR
      #                therefore always brings CALIPTRA along; sep_crypto.sv also
      #                carries an elaboration check that rejects the mismatch.
      # File order follows vendor/chipsalliance/adams-bridge/upstream/src/abr_top/config/abr_top.vf.
      # =====================================================================
      - defines:
          CALIPTRA: ~
          SEP_ABR_EN: ~
        include_dirs:
          - vendor/chipsalliance/caliptra-rtl/upstream/src/keyvault/rtl
          - vendor/chipsalliance/caliptra-rtl/upstream/src/caliptra_prim/rtl
