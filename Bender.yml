package:
  name: tt-oca-harness
  authors:
    - "Noah Betik <nbetik@tenstorrent.com>"
    - "Nicole Boettcher <nboettcher@tenstorrent.com>"
    - "Frank Chen <fchen@tenstorrent.com>"
    - "Zhimin Chen <zhiminchen@tenstorrent.com>"
    - "Carlos Gewehr <cgewehr@tenstorrent.com>"
    - "Minshao Ho <minshaoho@tenstorrent.com>"
    - "Andrew Hsiao <ahsiao@tenstorrent.com>"
    - "Bruce Hsu <brucehsu@tenstorrent.com>"
    - "Henry Lai <yenhenglai@tenstorrent.com>"
    - "Leo Li <lizhili@tenstorrent.com>"
    - "Haohao Liao <hliao@tenstorrent.com>"
    - "Ben Melton <bmelton@tenstorrent.com>"
    - "Alessandro Ottaviano <aottaviano@tenstorrent.com>"
    - "Kai Qin <kqin@tenstorrent.com>"
    - "Paul Scheidt <pscheidt@tenstorrent.com>"
    - "Adam Taback <ataback@tenstorrent.com>"

# Path dependencies on the vendored trees (transitive pins in Bender.local).
dependencies:
  aou: { path: "vendor/tenstorrent/aou" }
  tt_dfd: { path: "vendor/tenstorrent/tt-hw-debug" }
  el2: { path: "vendor/chipsalliance/Cores-VeeR-EL2" }
  idma: { path: "vendor/pulp-platform/idma" }
  opentitan: { path: "vendor/lowRISC/opentitan" }
  picorv32: { path: "vendor/tenstorrent/tt-picorv32" }

# Third-party IP vendored under vendor/<org>/<pkg>/upstream via `bender vendor init`.
vendor_package:
  # OpenTitan: prim, per-IP rtl/hjson, and the reggen/mubi file set.
  - name: opentitan
    target_dir: vendor/lowRISC/opentitan/upstream
    upstream: { git: "https://github.com/tenstorrent/tt-opentitan.git", rev: "d1ce369cb357a7a4718c75f11567742a78a7ed07" }
    include_from_upstream:
      - "hw/ip/prim/rtl"
      - "hw/ip/prim_generic/rtl"
      - "hw/ip/prim_generic/lint"
      # Per-IP rtl + the <ip>.hjson feeding the SystemRDL register flow.
      - "hw/ip/otbn/rtl"
      - "hw/ip/otbn/data/otbn.hjson"
      # OTBN assembler toolchain (otbn_as/otbn_ld + the insn/csr yamls they
      # read), tracer RTL for the UVM testbenches, and the AES C reference
      # model + DPI (sep.f / nonfree_smu.f).
      - "hw/ip/otbn/data/base-insns.yml"
      - "hw/ip/otbn/data/bignum-insns.yml"
      - "hw/ip/otbn/data/csr.yml"
      - "hw/ip/otbn/data/enc-schemes.yml"
      - "hw/ip/otbn/data/insns.yml"
      - "hw/ip/otbn/data/otbn.ld.tpl"
      - "hw/ip/otbn/data/wsr.yml"
      - "hw/ip/otbn/dv/tracer/rtl"
      - "hw/ip/otbn/util"
      - "hw/ip/aes/model"
      - "hw/ip/aes/dv/aes_model_dpi"
      - "hw/ip/aon_timer/rtl"
      - "hw/ip/aon_timer/data/aon_timer.hjson"
      - "hw/ip/csrng/rtl"
      - "hw/ip/csrng/data/csrng.hjson"
      - "hw/ip/edn/rtl"
      - "hw/ip/edn/data/edn.hjson"
      - "hw/ip/dma/rtl"
      - "hw/ip/dma/data/dma.hjson"
      - "hw/ip/spi_host/rtl"
      - "hw/ip/spi_host/data/spi_host.hjson"
      - "hw/ip/aes/rtl"
      - "hw/ip/aes/data/aes.hjson"
      - "hw/ip/hmac/rtl"
      - "hw/ip/hmac/data/hmac.hjson"
      - "hw/ip/kmac/rtl"
      - "hw/ip/kmac/data/kmac.hjson"
      - "hw/ip/entropy_src/rtl"
      - "hw/ip/entropy_src/data/entropy_src.hjson"
      # Package-only imports: OCAH does not instantiate these IPs.
      # Vendored OT blocks still import the package names.
      - "hw/ip/lc_ctrl/rtl/lc_ctrl_pkg.sv"
      - "hw/ip/lc_ctrl/rtl/lc_ctrl_state_pkg.sv"
      - "hw/ip/lc_ctrl/rtl/lc_ctrl_reg_pkg.sv"
      - "hw/ip/keymgr/rtl/keymgr_pkg.sv"
      - "hw/ip/keymgr/rtl/keymgr_reg_pkg.sv"
      - "hw/ip/otp_ctrl/rtl/otp_ctrl_pkg.sv"
      # reggen + mubi modules used to export <ip>.hjson to SystemRDL.
      - "util/reggen/access.py"
      - "util/reggen/alert.py"
      - "util/reggen/bits.py"
      - "util/reggen/bus_interfaces.py"
      - "util/reggen/clocking.py"
      - "util/reggen/countermeasure.py"
      - "util/reggen/enum_entry.py"
      - "util/reggen/exporter.py"
      - "util/reggen/feature.py"
      - "util/reggen/field.py"
      - "util/reggen/inter_signal.py"
      - "util/reggen/interrupt.py"
      - "util/reggen/ip_block.py"
      - "util/reggen/lib.py"
      - "util/reggen/memory.py"
      - "util/reggen/multi_register.py"
      - "util/reggen/params.py"
      - "util/reggen/reg_base.py"
      - "util/reggen/reg_block.py"
      - "util/reggen/register.py"
      - "util/reggen/signal.py"
      - "util/reggen/systemrdl_exporter.py"
      - "util/reggen/systemrdl/udp.py"
      - "util/reggen/systemrdl/udp.rdl"
      - "util/reggen/window.py"
      - "util/design/mubi/prim_mubi.py"
    exclude_from_upstream:
      # Unused FPGA RegFile variants.
      - "hw/ip/otbn/rtl/otbn_rf_base_fpga.sv"
      - "hw/ip/otbn/rtl/otbn_rf_bignum_fpga.sv"
      # Bazel and SCA-campaign collateral unused by the vendored OTBN toolchain.
      - "hw/ip/otbn/util/BUILD"
      - "hw/ip/otbn/util/shared/BUILD"
      - "hw/ip/otbn/util/otbn_fi_campaign.py"
      - "hw/ip/otbn/util/otbn_tvla_campaign.py"
    patch_dir: "vendor/lowRISC/opentitan/patches"

  # pulp-platform packages, each pinned to a vendored rev.
  - name: common_verification
    target_dir: "vendor/pulp-platform/common_verification/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-common_verification.git", rev: "c5d97a1fae01d2d8e8e311dee341b6b8849dcf38" }
    include_from_upstream:
      - "src"
      - "test"
    patch_dir: "vendor/pulp-platform/common_verification/patches"

  - name: common_cells
    target_dir: "vendor/pulp-platform/common_cells/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-common_cells.git", rev: "c0961324117d186b1c4d87e2815dd31389ca7838" }
    include_from_upstream:
      - "src"
      - "include"
      - "test"
    patch_dir: "vendor/pulp-platform/common_cells/patches"

  # apb: flattened per-file mapping of the sources tt-oca instantiates.
  - name: apb
    target_dir: "vendor/pulp-platform/apb/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-apb.git", rev: "77ddf073f194d44b9119949d2421be59789e69ae" }
    patch_dir: "vendor/pulp-platform/apb/patches"
    mapping:
      - { from: "src/apb_demux.sv",   to: "apb_demux.sv",   patch_dir: "." }
      - { from: "src/apb_pkg.sv",     to: "apb_pkg.sv" }
      - { from: "src/apb_intf.sv",    to: "apb_intf.sv" }
      - { from: "src/apb_cdc.sv",     to: "apb_cdc.sv" }
      - { from: "include",            to: "include" }

  # axi: pinned rev with in-place edits and extra modules applied via patch.
  - name: axi
    target_dir: "vendor/pulp-platform/axi/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-axi.git", rev: "c27b1f2efd04ec464b89cedacc4c0df0452772e9" }
    include_from_upstream:
      - "src"
      - "include"
    patch_dir: "vendor/pulp-platform/axi/patches"

  # idma: vendored src with in-place edits; generated bundle lives in overlay/.
  - name: idma
    target_dir: "vendor/pulp-platform/idma/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-iDMA.git", rev: "4664f8bd7eb2f10c732215bb5f9d43e0a8e08238" }
    include_from_upstream:
      - "src"
    patch_dir: "vendor/pulp-platform/idma/patches"

  # UNBENT bus error unit (pulp-platform/unbent), Solderpad 0.51.
  # AXI wrapper path only; OBI wrapper intentionally excluded.
  - name: unbent
    target_dir: "vendor/pulp-platform/unbent/upstream"
    upstream: { git: "https://github.com/tenstorrent-forks/unbent.git", rev: "2df7a3f0307739d3813cf77db8228720b39a94f8" }
    include_from_upstream:
      - "LICENSE"
      - "src/bus_err_unit_reg_pkg.sv"
      - "src/bus_err_unit_bare.sv"
      - "src/bus_err_unit_reg_top.sv"
      - "src/bus_err_unit.sv"
      - "src/axi_err_unit_wrap.sv"

  - name: axi_stream
    target_dir: "vendor/pulp-platform/axi_stream/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-axi_stream.git", rev: "54891ff40455ca94a37641b9da4604647878cc07" }
    include_from_upstream:
      - "src"
      - "include"
      - "test"
    patch_dir: "vendor/pulp-platform/axi_stream/patches"

  # obi/register_interface: pruned to the sources tt-oca instantiates.
  - name: obi
    target_dir: "vendor/pulp-platform/obi/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-obi.git", rev: "b3f47e00e3a60ee3346253e3e7be7d1f732f05fd" }
    include_from_upstream:
      - "src/obi_pkg.sv"
      - "include/obi/typedef.svh"
    patch_dir: "vendor/pulp-platform/obi/patches"

  - name: register_interface
    target_dir: "vendor/pulp-platform/register_interface/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-register_interface.git", rev: "d6e1d4cdaab7870f4faf3f88a1c788eaf5ac129d" }
    include_from_upstream:
      - "src/reg_intf.sv"
      - "src/reg_demux.sv"
      - "src/reg_mux.sv"
      - "src/periph_to_reg.sv"
      - "src/axi_to_reg_v2.sv"
      - "include/register_interface/typedef.svh"
      - "include/register_interface/assign.svh"
    patch_dir: "vendor/pulp-platform/register_interface/patches"

  # Adams Bridge post-quantum engine (ML-DSA-87 / ML-KEM-1024).
  # Only the RTL reachable from abr_top; the testbench and coverage collateral
  # are left out.
  - name: adams_bridge
    target_dir: "vendor/chipsalliance/adams-bridge/upstream"
    upstream: { git: "https://github.com/chipsalliance/adams-bridge.git", rev: "e59eba955eac2a1adcb059f250641ede78e304be" }
    include_from_upstream:
      - "LICENSE"
      - "src/abr_top/rtl"
      - "src/abr_libs/rtl"
      - "src/abr_prim/rtl"
      - "src/abr_prim_generic/rtl"
      - "src/abr_sampler_top/rtl"
      - "src/abr_sha3/rtl"
      - "src/barrett_reduction/rtl"
      - "src/cbd_sampler/rtl"
      - "src/compress/rtl"
      - "src/decompose/rtl"
      - "src/decompress/rtl"
      - "src/exp_mask/rtl"
      - "src/makehint/rtl"
      - "src/norm_check/rtl"
      - "src/ntt_top/rtl"
      - "src/pk_decode/rtl"
      - "src/power2round/rtl"
      - "src/rej_bounded/rtl"
      - "src/rej_sampler/rtl"
      - "src/sample_in_ball/rtl"
      - "src/sigdecode_h/rtl"
      - "src/sig_decode_z/rtl"
      - "src/sig_encode_z/rtl"
      - "src/sk_decode/rtl"
      - "src/sk_encode/rtl"
    patch_dir: "vendor/chipsalliance/adams-bridge/patches"

  # Caliptra KeyVault: only the client-side helpers Adams Bridge uses under
  # `ifdef CALIPTRA`. The vault itself and its registers are not vendored;
  # sep_abr_kv_shim serves the key-vault read/write instead.
  - name: caliptra_keyvault
    target_dir: "vendor/chipsalliance/caliptra-rtl/upstream"
    upstream: { git: "https://github.com/chipsalliance/caliptra-rtl.git", rev: "ec349a89a0fe7bbe24f16c6bb05f9779d5a3d4c6" }
    include_from_upstream:
      - "LICENSE"
      - "src/keyvault/rtl/kv_macros.svh"
      - "src/keyvault/rtl/kv_defines_pkg.sv"
      - "src/keyvault/rtl/kv_fsm.sv"
      - "src/keyvault/rtl/kv_read_rule_check.sv"
      - "src/keyvault/rtl/kv_write_rule_check.sv"
      - "src/keyvault/rtl/kv_read_client.sv"
      - "src/keyvault/rtl/kv_write_client.sv"
      - "src/libs/rtl/caliptra_sva.svh"
      - "src/caliptra_prim/rtl/caliptra_prim_assert.sv"
      - "src/caliptra_prim/rtl/caliptra_prim_assert_standard_macros.svh"
      - "src/caliptra_prim/rtl/caliptra_prim_assert_dummy_macros.svh"
      - "src/caliptra_prim/rtl/caliptra_prim_assert_yosys_macros.svh"
      - "src/caliptra_prim/rtl/caliptra_prim_assert_sec_cm.svh"
      - "src/caliptra_prim/rtl/caliptra_prim_flop_macros.sv"
    patch_dir: "vendor/chipsalliance/caliptra-rtl/patches"

  # VeeR EL2 core; config snapshots live in overlay/.
  - name: veer_el2
    target_dir: "vendor/chipsalliance/Cores-VeeR-EL2/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-Cores-VeeR-EL2.git", rev: "07a51d817c5042f57850e931a1fb5e6a557a9333" }
    include_from_upstream:
      - "design"
      - "configs"
      - "tools"
      - "testbench"
    patch_dir: "vendor/chipsalliance/Cores-VeeR-EL2/patches"

  - name: picorv32
    target_dir: "vendor/tenstorrent/tt-picorv32/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-picorv32.git", rev: "9cc836f58580d59d90e8a764382aa78acb14d399" }
    include_from_upstream:
      - "picorv32.sv"
      - "picorv32_axi.sv"
      - "picorv32_axi_adapter.sv"
      - "picorv32_pcpi_div.sv"
      - "picorv32_pcpi_fast_mul.sv"
      - "picorv32_pcpi_mul.sv"
      - "picorv32_regs.sv"
      - "picorv32_wb.sv"
    patch_dir: "vendor/tenstorrent/tt-picorv32/patches"

  # Tenstorrent DFD (Design-for-Debug) IP: CLA + DST + trace sink.
  # TODO: enable once the tt_hw_debug GitLab remote is reachable from CI. Until
  # then vendor/tenstorrent/tt-hw-debug/upstream/ is a hand-mirrored subset -
  # see that package's Bender.yml. Keep include_from_upstream in sync with it.
  # - name: tt_dfd
  #   target_dir: "vendor/tenstorrent/tt-hw-debug/upstream"
  #   upstream: { git: "<gitlab-url>/tt_hw_debug.git", rev: "<pin>" }
  #   include_from_upstream:
  #     - "rtl"
  #     - "dependencies/common"
  #   patch_dir: "vendor/tenstorrent/tt-hw-debug/patches"

  # AXI-over-UCIe (AoU) bridge IP: RTL, CSR SystemRDL, and the MAS.
  - name: aou
    target_dir: "vendor/tenstorrent/aou/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-oca-harness-aou.git", rev: "08863921a328579bc96f3141b05113c11d7ac84c" }
    include_from_upstream:
      - "RTL"
      - "csr"
      - "DOC/MAS"
      - "DOC/integration_guide"
    patch_dir: "vendor/tenstorrent/aou/patches"

  # I3C controller/target core. The wrapper and memory primitives are left out;
  # this tree supplies its own through i3ccore_wrap.
  - name: i3c-core
    target_dir: "vendor/chipsalliance/i3c-core/upstream"
    upstream: { git: "https://github.com/tenstorrent/tt-i3c-core.git", rev: "a6361105cd3432699da636f1f5e6f1eb4df09ed2" }
    include_from_upstream:
      - "LICENSE"
      - "src"
    exclude_from_upstream:
      - "src/i3c_wrapper.sv"
      - "src/libs/mem"
      - "src/*.f"
    patch_dir: "vendor/chipsalliance/i3c-core/patches"

  - name: i3c-core-caliptra-rtl
    target_dir: "vendor/chipsalliance/i3c-core/upstream/third_party/caliptra-rtl"
    upstream: { git: "https://github.com/tenstorrent/caliptra-rtl-fork.git", rev: "8bd654eba57cfaa0688f9c4804b23253d0235dfc" }
    include_from_upstream:
      - "LICENSE"
      - "src/axi/rtl/axi_addr.v"
      - "src/axi/rtl/axi_if.sv"
      - "src/axi/rtl/i3ccore_axi_pkg.sv"
      - "src/caliptra_prim/rtl/caliptra_prim_assert.sv"
      - "src/caliptra_prim/rtl/caliptra_prim_assert_dummy_macros.svh"
      - "src/caliptra_prim/rtl/caliptra_prim_assert_sec_cm.svh"
      - "src/caliptra_prim/rtl/caliptra_prim_assert_standard_macros.svh"
      - "src/caliptra_prim/rtl/caliptra_prim_assert_yosys_macros.svh"
      - "src/caliptra_prim/rtl/caliptra_prim_flop_macros.sv"
      - "src/libs/rtl/caliptra_sva.svh"
      - "src/libs/rtl/skidbuffer.v"
    patch_dir: "vendor/chipsalliance/i3c-core/patches/caliptra-rtl"

  - name: i3c-core-cocotbext-i3c
    target_dir: "vendor/chipsalliance/i3c-core/upstream/third_party/cocotbext-i3c"
    upstream: { git: "https://github.com/antmicro/cocotbext-i3c.git", rev: "6456315697d980ba59ff09448b89941346a3ce16" }
    include_from_upstream:
      - "LICENSE"
      - "pyproject.toml"
      - "src"
    patch_dir: "vendor/chipsalliance/i3c-core/patches/cocotbext-i3c"

# RTL sources are partitioned by composable subsystem targets.
sources:
  # Shared files are selected when any owning subsystem is requested.
  # Selecting dtp, sep, and smc together also selects SMU integration.
  - target: all(dtp, not(sep))
    files:
      - hw/sys/sep/regs/gen/sv/sep_addrmap_pkg.sv
  - target: any(dtp, sep, smc, key_manager, uart, system_timer_octs)
    include_dirs:
      - hw/common/assert
      - hw/ip/efuse/rtl/svh
    files:
      - hw/common/och_prim/rtl/prim_jtag_pkg.sv
      - hw/common/och_prim/rtl/prim_ram_1p_adv_ext_pkg.sv
  - target: smc
    include_dirs:
      - hw/sys/smc/rtl/smc_cpu
      - hw/ip/i3ccore_wrap/rtl
      - vendor/chipsalliance/i3c-core/upstream/src
      - vendor/chipsalliance/i3c-core/upstream/src/libs
      - vendor/chipsalliance/i3c-core/upstream/third_party/caliptra-rtl/src/axi/rtl
      - vendor/chipsalliance/i3c-core/upstream/third_party/caliptra-rtl/src/caliptra_prim/rtl
      - vendor/chipsalliance/i3c-core/upstream/third_party/caliptra-rtl/src/libs/rtl
    files:
      - hw/ip/avsbus_controller/regs/gen/sv/avsbus_controller_addrmap_pkg.sv
  - target: sep
    files:
      - hw/ip/axi_alias_remap/regs/gen/sv/alias_remap_addrmap_pkg.sv
  - target: any(sep, smc)
    files:
      - hw/ip/axi_filter/regs/gen/sv/filter_ctrl_addrmap_pkg.sv
      - hw/ip/axi_lite_mailbox_unit/regs/gen/sv/axil_mailbox_addrmap_pkg.sv
      - hw/ip/axi_lite_mailbox_unit/regs/gen/sv/axil_mailbox_sep_wrap_addrmap_pkg.sv
      - hw/ip/axi_lite_mailbox_unit/regs/gen/sv/axil_mailbox_smc_wrap_addrmap_pkg.sv
  - target: smc
    files:
      - hw/ip/dfd/regs/gen/sv/smc_cla_addrmap_pkg.sv
  - target: any(sep, smc)
    files:
      - hw/ip/efuse/dv/models/regs/gen/sv/efuse_shim_ctrl_addrmap_pkg.sv
      - hw/ip/efuse/dv/models/efuse_bank_addrmap_pkg.sv
      - hw/ip/efuse/regs/gen/sv/efuse_interface_ctrl_addrmap_pkg.sv
      - hw/ip/efuse/regs/gen/sv/efuse_mmr_addrmap_pkg.sv
  - target: sep
    files:
      - hw/ip/entropy_source/regs/gen/sv/entropy_source_addrmap_pkg.sv
  - target: smc
    files:
      - hw/ip/gpio/regs/gen/sv/gpio_ctrl_addrmap_pkg.sv
      - hw/ip/gpio/regs/gen/sv/gpio_intf_addrmap_pkg.sv
      - hw/ip/gpio/regs/gen/sv/gpio_wrap_addrmap_pkg.sv
      - hw/ip/i2c/regs/gen/sv/i2c_addrmap_pkg.sv
      - hw/ip/i2c/regs/gen/sv/i2c_ctrl_addrmap_pkg.sv
      - hw/ip/i2c/regs/gen/sv/i2c_wrap_addrmap_pkg.sv
      - hw/ip/i3ccore_wrap/regs/gen/sv/oca_i3c_wrap_addrmap_pkg.sv
  - target: any(sep, key_manager)
    files:
      - hw/ip/key_manager/regs/gen/sv/abr_wrapper_key_addrmap_pkg.sv
      - hw/ip/key_manager/regs/gen/sv/aes_wrapper_key_addrmap_pkg.sv
      - hw/ip/key_manager/regs/gen/sv/hmac_wrapper_key_addrmap_pkg.sv
      - hw/ip/key_manager/regs/gen/sv/key_manager_addrmap_pkg.sv
      - hw/ip/key_manager/regs/gen/sv/km_csr_addrmap_pkg.sv
      - hw/ip/key_manager/regs/gen/sv/km_drbg_sampler_addrmap_pkg.sv
      - hw/ip/key_manager/regs/gen/sv/km_kpv_addrmap_pkg.sv
      - hw/ip/key_manager/regs/gen/sv/km_mailbox_km_addrmap_pkg.sv
      - hw/ip/key_manager/regs/gen/sv/km_mailbox_sep_addrmap_pkg.sv
