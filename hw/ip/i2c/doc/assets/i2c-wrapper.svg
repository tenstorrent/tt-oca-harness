<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">OCAH I2C wrapper</title>
<desc id="desc">i2c_wrap has one AXI-Lite subordinate port, 32-bit address and 32-bit data, on its single clock clk_i. The axi_lite_demux u_axi_lite_demux compares the request address against the base and size of each register map and selects one of NUM_I2CS + 2 ports: one per I2C instance, the shared control map and an error subordinate. Each instance gen_i2cs[i].u_i2c holds u_i2c_reg, the PeakRDL-generated AXI-Lite register block for the i2c map, which drives hwif_out into u_i2c_core and takes hwif_in back from it. u_i2c_core is the OpenTitan I2C core: controller FSM, target FSM, bus monitor and the FMT, RX, TX and ACQ FIFOs. Its SCL, SDA, SMBus SUS and SMBus ALERT inputs pass through two-flop synchronizers. Each instance drives its slice of scl_o, sda_o, smbsus_no, smbalert_no, i2c_irq_o, i2c_debug_o and the four DMA ready outputs. u_i2c_ctrl_reg is the PeakRDL-generated i2c_ctrl block with one I2C_CTRL register per instance; its SMBUS_EN fields drive each instance's smbus_en input, and its I2C_EN and I2C_CONTROLLER_MODE_EN fields leave the wrapper on i2c_en_o and i2c_controller_mode_en_o. Addresses outside every map reach u_prim_axi_lite_err_slv, which answers DECERR with read data 0xBADCAB1E.</desc>
