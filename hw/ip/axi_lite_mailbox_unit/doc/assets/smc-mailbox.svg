<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="652" viewBox="0 0 1040 652" role="img" aria-labelledby="title desc">
<title id="title">SMC mailboxes</title>
<desc id="desc">u_smc_axil_mailbox is an axi_lite_mailbox_unit with 32 mailboxes. Its single AXI-Lite subordinate port, 32-bit address and 64-bit data, comes from the mailbox target of smc_internal_axi_lite_xbar, and its clock is the idle-gated SMC clock from the axi_cg_snoop u_mailbox_cg. The PULP axi_lite_demux u_mailbox_demux selects one of 64 ports from address bits 16 to 11 above 0xC001_8000. Mailbox m occupies the 4 KiB at 0xC001_8000 + m x 0x1000: its outbound port at offset 0x000 and its inbound port at offset 0x800, each a 2 KiB aperture with ten registers. Each mailbox is gen_mailbox[m].u_axi_lite_mailbox, a PULP axi_lite_mailbox, and holds two 2-entry, 64-bit FIFOs; WRITE_DATA of one port pushes the FIFO that READ_DATA of the other port pops. Each port raises a level-sensitive, active-high interrupt. The 32 inbound-port interrupts are SMC CPU interrupts 288 to 319; the 32 outbound-port interrupts leave the SMC on smc_ext_mailbox_interrupts_o, which the SMU passes to its boundary. Mailboxes 1 to 30 are identical to mailboxes 0 and 31.</desc>
