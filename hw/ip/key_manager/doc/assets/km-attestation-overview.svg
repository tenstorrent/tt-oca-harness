<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="618" viewBox="0 0 1040 618" role="img" aria-labelledby="title desc">
<title id="title">Key Manager additions for attestation</title>
<desc id="desc">Block diagram of the Key Manager with the parts that attestation adds. Existing parts: the KM CPU with its ROM and SRAM, the Key and Policy Vault of 64 slots, the KM-internal crossbar, the hardwired fuse, life-cycle and demotion inputs, the mailbox to the SEP CPU, the SEP host path to the crypto engines and the key ports from the crossbar to the engine key registers. New parts on the crossbar: a root key vault of 8 slots for the hardware and software roots, a PCR vault of 32 PCRs of 384 bits with a lock bit per PCR, a SHA-2 engine for SHA-256 and SHA-384 that computes the extend for the PCR vault, and an attestation key vault of 8 slots that is reachable in ROM mode only. Further new parts: a DEVICE_UID fuse that is hardwired to a DEVICE_UID input with a warm and a cold read lock, a device-state restart that restarts the KM when the life-cycle or demotion state changes, a front-door path from the crossbar to the engines, and an ownership switch in front of the engine host registers and memories that only the KM can set. The engines are OTBN, Adams Bridge, HMAC, AES and KMAC.</desc>
