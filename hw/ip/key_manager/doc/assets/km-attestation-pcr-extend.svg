<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="458" viewBox="0 0 1040 458" role="img" aria-labelledby="title desc">
<title id="title">PCR extend path</title>
<desc id="desc">Extend path of the PCR vault. The KM CPU writes a 384-bit measurement into the measurement register of the PCR vault and requests an extend of one PCR. Hardware feeds the old value of that PCR from the PCR bank and the measurement to the SHA-2 engine, which computes the new value as SHA-384 of the old value followed by the measurement, and writes the new value back into the PCR bank. The PCR bank holds 32 PCRs of 384 bits that are zero after a cold reset. The lock bits, one per PCR, are set by the KM CPU and cleared only by a cold reset; a set lock bit blocks the extend of its PCR. The KM CPU reads PCR values and lock bits, and it uses the SHA-2 engine through a separate register interface for the HMAC and key derivation of the ROM.</desc>
<defs>
<marker id="ae" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="#103525"/></marker>
<marker id="as" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="3" refY="4.5" orient="auto"><path d="M10,0 L0,4.5 L10,9 Z" fill="#103525"/></marker>
<marker id="ne" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="#336633"/></marker>
<marker id="ns" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="3" refY="4.5" orient="auto"><path d="M10,0 L0,4.5 L10,9 Z" fill="#336633"/></marker>
<marker id="ge" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#5b6670"/></marker>
<marker id="ce" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#42759b"/></marker>
<style>
text { font-family: Arial, sans-serif; font-size: 15px; fill: #484848; }
.b { font-size: 17px; font-weight: bold; fill: #103525; }
.bs { font-size: 15px; font-weight: bold; fill: #103525; }
.s { font-size: 13px; fill: #484848; }
.smu { fill: #ffffff; stroke: #77736b; stroke-width: 1.5; }
.fabric { fill: #fff0cc; stroke: #937027; stroke-width: 2; }
.core { fill: #ffffff; stroke: #937027; stroke-width: 2; }
.external { fill: #f2f2f2; stroke: #77736b; stroke-width: 1.5; }
.new { fill: #e8f0e8; stroke: #336633; stroke-width: 2; }
.key { fill: #e8f3ff; stroke: #42759b; stroke-width: 2; }
.axi { fill: none; stroke: #103525; stroke-width: 2.5; marker-start: url(#as); marker-end: url(#ae); }
.axin { fill: none; stroke: #336633; stroke-width: 2.5; stroke-dasharray: 8 5; marker-start: url(#ns); marker-end: url(#ne); }
.der { fill: none; stroke: #103525; stroke-width: 2.5; marker-end: url(#ae); }
.hw { fill: none; stroke: #336633; stroke-width: 2.5; marker-end: url(#ne); }
.sigo { fill: none; stroke: #5b6670; stroke-width: 1.5; marker-end: url(#ge); }
.sign { fill: none; stroke: #5b6670; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#ge); }
.sigplain { fill: none; stroke: #5b6670; stroke-width: 1.5; }
.cert { fill: none; stroke: #42759b; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#ce); }
</style>
</defs>
<rect width="1040" height="458" fill="#ffffff"/>
<rect class="core" x="20" y="60" width="150" height="80" rx="6"/>
<text class="bs" x="95" y="104.5" text-anchor="middle">KM CPU</text>
<rect class="smu" x="280" y="40" width="440" height="352" rx="6"/>
<text class="b" x="292" y="380" text-anchor="start">PCR vault</text>
<rect class="new" x="302" y="70" width="200" height="60" rx="6"/>
<text class="bs" x="402" y="96" text-anchor="middle">Measurement register</text>
<text class="s" x="402" y="113.5" text-anchor="middle">384 bits</text>
<rect class="new" x="302" y="200" width="200" height="110" rx="6"/>
<text class="bs" x="402" y="242.5" text-anchor="middle">PCR bank</text>
<text class="s" x="402" y="260" text-anchor="middle">32 PCRs of 384 bits</text>
<text class="s" x="402" y="277" text-anchor="middle">zero after a cold reset</text>
<rect class="new" x="524" y="200" width="176" height="110" rx="6"/>
<text class="bs" x="612" y="225.5" text-anchor="middle">Lock bits</text>
<text class="s" x="612" y="243" text-anchor="middle">one per PCR</text>
<text class="s" x="612" y="260" text-anchor="middle">set by the KM CPU,</text>
<text class="s" x="612" y="277" text-anchor="middle">cleared by a cold reset;</text>
<text class="s" x="612" y="294" text-anchor="middle">a set bit blocks the extend</text>
<rect class="new" x="784" y="70" width="240" height="180" rx="6"/>
<text class="bs" x="904" y="147.5" text-anchor="middle">SHA-2 engine</text>
<text class="s" x="904" y="165" text-anchor="middle">new value =</text>
<text class="s" x="904" y="182" text-anchor="middle">SHA-384(old value || measurement)</text>
<path class="axi" d="M174,100 L298,100"/>
<text class="s" x="225" y="92" text-anchor="middle">extend request</text>
<path class="axi" d="M95,144 L95,255 L298,255"/>
<text class="s" x="188" y="273" text-anchor="middle">PCR values, lock bits</text>
<path class="axi" d="M95,56 L95,20 L904,20 L904,66"/>
<text class="s" x="500" y="14" text-anchor="middle">hashing for the ROM: HMAC and key derivation</text>
<path class="hw" d="M502,100 L780,100"/>
<text class="s" x="612" y="92" text-anchor="middle">measurement</text>
<path class="hw" d="M402,200 L402,165 L780,165"/>
<text class="s" x="612" y="157" text-anchor="middle">old value</text>
<path class="hw" d="M904,250 L904,350 L402,350 L402,314"/>
<text class="s" x="612" y="341" text-anchor="middle">new value</text>
<path class="sigo" d="M524,255 L506,255"/>
<rect class="new" x="16" y="422" width="40" height="18" rx="4"/>
<text class="s" x="64" y="436" text-anchor="start">New</text>
<rect class="core" x="118" y="422" width="40" height="18" rx="4"/>
<text class="s" x="166" y="436" text-anchor="start">Exists today</text>
<path class="axi" d="M268.1,431 L304.1,431"/>
<text class="s" x="318.1" y="436" text-anchor="start">Register access by the KM CPU</text>
<path class="hw" d="M531.8,431 L571.8,431"/>
<text class="s" x="585.8" y="436" text-anchor="start">Extend path, hardware only</text>
<path class="sigo" d="M772.1,431 L812.1,431"/>
<text class="s" x="826.1" y="436" text-anchor="start">Lock</text>
</svg>
