<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="934" viewBox="0 0 1040 934" role="img" aria-labelledby="title desc">
<title id="title">Key Manager architecture</title>
<desc id="desc">Block diagram of key_manager. The CPU u_cpu (picorv32_wrapper) holds the PicoRV32 RV32EMC core with its PCPI CRC unit, and the ROM and SRAM interfaces u_rom_if (parity) and u_sram_if (scrambling and parity), which connect to the 16 KiB ROM and 32 KiB SRAM hard macros outside the block. The CPU AXI4-Lite master drives the crossbar u_xbar. The crossbar serves four internal subordinates, u_kmcsr, u_mailbox, u_drbg_sampler and u_kpv, and six external ports: the key CSRs of Adams Bridge, OTBN, AES, KMAC and HMAC, and the SEP eFuse controller through an address remap. The CPU receives three interrupts: km_irq from u_kmcsr, the mailbox interrupt from u_mailbox and the Adams Bridge ML-KEM shared-key interrupt. u_kmcsr receives otp_data_i and drives recoverable_err_o and the scrambler, SRAM lock and execute-mode controls of u_cpu, which returns its error events. The SEP host reaches u_mailbox through mbox_sep_req_i and receives mbox_irq_to_sep_o. u_drbg_sampler receives the DRBG AXI-Stream, u_kpv receives wipe_state_i, and u_cpu drives unrecoverable_err_o. u_reset_conditioner turns cold_rst_ni, warm_rst_ni, test_en_i and scan_rst_ni into the cold and warm resets of every instance.</desc>
