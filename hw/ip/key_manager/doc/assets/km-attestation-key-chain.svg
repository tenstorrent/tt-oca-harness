<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="764" viewBox="0 0 1040 764" role="img" aria-labelledby="title desc">
<title id="title">Attestation key chain</title>
<desc id="desc">Derivation of the attestation keys in three columns: inputs held in hardware on the left, secrets kept in the attestation key vault in the middle and signing keys on the right. DEVICE_UID and the ROM-identity PCR, which holds the hash of the SEP boot ROM measured and locked by BL0, derive the identity secret. The identity secret and PCR0, which holds the boot state, the signer keys and the BL1 hash measured and locked by BL0, derive the BL1 secret. The BL1 secret and PCR2, which holds the BL2 measurement measured and locked by BL1, derive the BL2 secret. The BL2 secret and PCR4, which holds the BL3 measurement measured and locked by BL2, derive the BL3 secret. The life-cycle and demotion state, sampled by the KM from its hardwired inputs, is a further input to the BL1, BL2 and BL3 secrets. Each secret derives one signing key: the identity key, the BL1 key, the BL2 key and the BL3 key. The identity key signs the certificate of the BL1 key, the BL1 key that of the BL2 key, and the BL2 key that of the BL3 key.</desc>
<defs>
