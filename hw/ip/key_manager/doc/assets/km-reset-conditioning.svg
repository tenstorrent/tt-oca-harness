<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="588" viewBox="0 0 1040 588" role="img" aria-labelledby="title desc">
<title id="title">Key Manager reset conditioning</title>
<desc id="desc">Reset conditioning inside key_manager. cold_rst_ni is the asynchronous reset of the two-flop synchroniser u_sync in u_cold_rst_sync, whose scan multiplexer selects scan_rst_ni while test_en_i is set and drives rst_cold_aasd_no. A NAND of warm_rst_ni and soft_rst_n from u_kmcsr triggers the warm hold counter, which rst_cold_aasd_no resets asynchronously and which holds the warm reset for at least 10 clk_i cycles; its scan multiplexer drives rst_warm_sync_no. The cold reset fans out to u_cpu (rst_ni), u_kpv, u_drbg_sampler, u_mailbox and u_kmcsr (cold_rst_ni). The warm reset drives u_cpu (rst_sync_ni) and u_xbar (rst_ni) as reset pins, and u_kpv, u_drbg_sampler, u_mailbox and u_kmcsr (warm_rst_ni) as a synchronous clear.</desc>
