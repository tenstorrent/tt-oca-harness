<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="562" viewBox="0 0 1040 562" role="img" aria-labelledby="title desc">
<title id="title">Crypto engine ownership</title>
<desc id="desc">Ownership of one crypto engine, which is OTBN, Adams Bridge, HMAC, AES or KMAC. The SEP-side masters, which are the SEP CPU, the debug module, the DMA and the external port, reach the ownership switch through the SEP host path, and the SEP reset controller sends its reset request for the engine to the switch. The KM CPU reaches the switch through the new front-door path, and the ownership bit of the Key Manager, which a cold reset sets to SEP and which only the KM changes, selects the owner. While the SEP owns the engine the host path is open and the front door is closed. While the KM owns it the front door is open, the host path is closed and the SEP reset request is held off. The switch drives the host registers and memories of the engine and the engine reset. The key port from the KM CPU through the key port isolation to the key registers of the engine is unchanged.</desc>
<defs>
<marker id="ae" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="#103525"/></marker>
<marker id="as" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="3" refY="4.5" orient="auto"><path d="M10,0 L0,4.5 L10,9 Z" fill="#103525"/></marker>
<marker id="ne" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="#336633"/></marker>
<marker id="ns" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="3" refY="4.5" orient="auto"><path d="M10,0 L0,4.5 L10,9 Z" fill="#336633"/></marker>
<marker id="ge" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#5b6670"/></marker>
<marker id="ce" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#42759b"/></marker>
