.fabric { fill: #fff0cc; stroke: #937027; stroke-width: 2; }
.core { fill: #ffffff; stroke: #937027; stroke-width: 2; }
.external { fill: #f2f2f2; stroke: #77736b; stroke-width: 1.5; }
.new { fill: #e8f0e8; stroke: #336633; stroke-width: 2; }
.key { fill: #e8f3ff; stroke: #42759b; stroke-width: 2; }
.axi { fill: none; stroke: #103525; stroke-width: 2.5; marker-start: url(#as); marker-end: url(#ae); }
.axin { fill: none; stroke: #336633; stroke-width: 2.5; stroke-dasharray: 8 5; marker-start: url(#ns); marker-end: url(#ne); }
.der { fill: none; stroke: #103525; stroke-width: 2.5; marker-end: url(#ae); }
.hw { fill: none; stroke: #336633; stroke-width: 2.5; marker-end: url(#ne); }
.sigo { fill: none; stroke: #5b6670; stroke-width: 1.5; marker-end: url(#ge); }
.sign { fill: none; stroke: #5b6670; stroke-width: 1.5; stroke-dasharray: 6 4; marker-end: url(#ge); }
.sigplain { fill: none; stroke: #5b6670; stroke-width: 1.5; }
.cert { fill: none; stroke: #42759b; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#ce); }
</style>
</defs>
