<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="536" viewBox="0 0 1040 536" role="img" aria-labelledby="title desc">
<title id="title">Accelerator key path</title>
<desc id="desc">Key and host paths into one crypto engine wrapper, shown for a generic engine &lt;eng&gt; (OTBN, AES, KMAC or HMAC). Top row: the key_manager 32-bit AXI4-Lite key port passes through u_&lt;eng&gt;_key_isolate in sep_crypto_axi_interconnect and ends on u_&lt;eng&gt;_wrapper_key_reg, whose write-only KEY_SHARE0 and KEY_SHARE1 words and KEY_CTRL.KEY_VALID bit drive the keymgr_key_i sideload port of the engine core. Bottom row: the SEP host 64-bit AXI4 path passes through u_axi_demux, width and protocol conversion and u_&lt;eng&gt;_host_isolate, then axi_lite_to_tlul into the engine's TL-UL registers. The engine core drives its interrupts and alerts.</desc>
<defs>
<marker id="ae" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="#103525"/></marker>
<marker id="as" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="3" refY="4.5" orient="auto"><path d="M10,0 L0,4.5 L10,9 Z" fill="#103525"/></marker>
<marker id="ge" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#5b6670"/></marker>
