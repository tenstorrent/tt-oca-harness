schema_version = 1

# UART and Log Engine wrapper IP-level scenarios.

[[tests]]
name = "uart_log_engine_wrap_sanity_test"
module = { cocotb = "uart_log_engine_wrap_sanity_test" }
seed = 1
timeout_sec = 600
tags = ["smoke", "ci", "uart"]
run_modes = ["smoke"]

[[tests]]
name = "uart_log_engine_wrap_log_path_test"
module = { cocotb = "uart_log_engine_wrap_log_path_test" }
seed = 1
timeout_sec = 900
tags = ["uart", "log_engine"]
run_modes = ["functional"]

[[groups]]
name = "smoke"
tests = ["uart_log_engine_wrap_sanity_test"]

[[groups]]
name = "all"
tests = ["uart_log_engine_wrap_sanity_test", "uart_log_engine_wrap_log_path_test"]
