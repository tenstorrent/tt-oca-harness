schema_version = 1

# UART wrapper IP-level scenarios.

[[tests]]
name = "uart_wrap_sanity_test"
module = { cocotb = "uart_wrap_sanity_test" }
seed = 1
timeout_sec = 600
tags = ["smoke", "ci", "uart"]
run_modes = ["smoke"]

[[tests]]
name = "uart_wrap_line_test"
module = { cocotb = "uart_wrap_line_test" }
seed = 1
timeout_sec = 900
tags = ["uart", "line", "log_engine"]
run_modes = ["functional"]

[[groups]]
name = "smoke"
tests = ["uart_wrap_sanity_test"]

[[groups]]
name = "all"
tests = ["uart_wrap_sanity_test", "uart_wrap_line_test"]
