<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
<title id="title">SMC UART wrapper</title>
<desc id="desc">uart_wrap has one AXI-Lite register port, 32-bit address and 32-bit data, and one AXI-Lite log-fetch manager port, 56-bit address and 64-bit data, on its single clock clk_i. The axi_lite_demux u_csr_axi_lite_demux compares the register address against each instance window, 0x400 apart, and selects one of NUM_UARTS + 1 ports: one per uart_log_engine_wrap instance and the error subordinate u_csr_axi_lite_err_slv, which answers DECERR with read data 0xBADCAB1E. Each instance gen_uart_log_engine_wraps[i].u_uart_log_engine_wrap holds a UART 16550 and, when GEN_LOG_ENGINES bit i is set, a log engine. The instances' log-fetch manager ports meet in the axi_lite_mux u_log_fetch_axi_lite_mux, whose output is the wrapper's log-fetch port. Each instance drives its slice of the UART serial and modem ports, the DMA ready outputs, uart_en_o, uart_err_o, uart_irq_o and log_engine_irq_o.</desc>
