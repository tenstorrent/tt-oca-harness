<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="836" viewBox="0 0 1040 836" role="img" aria-labelledby="title desc">
<title id="title">UART and log-engine wrapper</title>
<desc id="desc">uart_log_engine_wrap has one AXI-Lite register port, 32-bit address and 32-bit data, from uart_wrap, and one AXI-Lite log-fetch manager port, 56-bit address and 64-bit data, back to uart_wrap. Everything runs on clk_i. The axi_lite_demux u_csr_axi_lite_demux decodes the register port by base and size onto four maps: the UART, the log engine, the PeakRDL control block u_uart_log_engine_ctrl_reg, whose CTRL.UART_EN drives uart_en_o, and the error subordinate u_csr_axi_lite_err_slv, which answers DECERR. The UART map reaches port 0 of the axi_lite_mux u_log_write_axi_lite_mux, whose port 1 is the log engine's log-write manager; the mux output is the register port of u_uart_16550. Inside u_uart_16550 an axi_lite_demux sends DLL and DLM to the divisor-latch registers while LCR.DLAB is set, writes to THR and FCR to the write-only registers, and everything else to the main registers; all three are PeakRDL blocks connected to u_uart_core, which holds the TX and RX FIFOs, transmitter and receiver, and synchronizes rx_i and the modem inputs with two-flop synchronizers. The log engine, present when GEN_LOG_ENGINE is set, holds the PeakRDL block u_log_engine_reg, the 16-entry round-robin u_arbiter_tree, the log fetch FSM and its axi_lite_from_mem converter to the log-fetch port, the 64-bit read-data FIFO u_rdata_fifo, and the log write FSM and its axi_lite_from_mem converter to the log-write port. uart_txrdy_o paces the log write FSM. log_engine_irq_o comes from the log engine's interrupt registers; the UART drives uart_irq_o, uart_err_o, uart_rxrdy_o and uart_txrdy_o.</desc>
