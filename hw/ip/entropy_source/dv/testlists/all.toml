schema_version = 1

[[tests]]
name = "entropy_source_sanity_test"
module = { cocotb = "entropy_source_sanity_test" }
seed = 1
timeout_sec = 600
tags = ["smoke", "ci", "entropy_source", "csr"]
run_modes = ["smoke"]

[[tests]]
name = "entropy_source_datapath_test"
module = { cocotb = "entropy_source_datapath_test" }
seed = 1
timeout_sec = 600
tags = ["entropy_source", "datapath", "decorrelator"]
run_modes = ["functional"]

[[tests]]
name = "entropy_source_fifo_test"
module = { cocotb = "entropy_source_fifo_test" }
seed = 1
timeout_sec = 600
tags = ["entropy_source", "fifo"]
run_modes = ["functional"]

[[tests]]
name = "entropy_source_health_test"
module = { cocotb = "entropy_source_health_test" }
seed = 1
timeout_sec = 600
tags = ["entropy_source", "health", "tuning"]
run_modes = ["functional"]

[[tests]]
name = "entropy_source_debug_test"
module = { cocotb = "entropy_source_debug_test" }
seed = 1
timeout_sec = 600
tags = ["entropy_source", "debug"]
run_modes = ["functional"]

[[groups]]
name = "smoke"
tests = ["entropy_source_sanity_test"]

[[groups]]
name = "all"
tests = [
  "entropy_source_sanity_test",
  "entropy_source_datapath_test",
  "entropy_source_fifo_test",
  "entropy_source_health_test",
  "entropy_source_debug_test",
]
