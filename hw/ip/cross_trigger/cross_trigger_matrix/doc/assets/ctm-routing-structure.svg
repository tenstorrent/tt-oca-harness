<svg xmlns="http://www.w3.org/2000/svg" width="720" height="784" viewBox="0 0 720 784" role="img" aria-labelledby="title desc">
<title id="title">Cross Trigger Matrix routing structure</title>
<desc id="desc">The cross_trigger_matrix routes 26 CT_Dst inputs, ct_dst_i[25:0], to 26 CT_Src outputs. Each output j has its own u_src_selector instance, gen_src_selectors[j]. Inside it, every input bit ct_dst_i[i] is ANDed with select bit i of the CT_SRC[j].CONFIG_0.CT_DST_SELECT field, the 26 AND outputs are OR-reduced, and the result is registered on clk_i to give ct_src_o[j]. The figure draws selectors 0 and 25 with the AND gates for inputs 0, 1 and 25. The u_reg block, cross_trigger_matrix_reg, is programmed over AXI-Lite and drives every select field; the ct_dst_i bus fans out to every selector.</desc>
