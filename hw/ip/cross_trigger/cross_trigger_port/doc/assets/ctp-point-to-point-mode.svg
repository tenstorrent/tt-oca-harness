<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="772" viewBox="0 0 1040 772" role="img" aria-labelledby="title desc">
<title id="title">Cross Trigger Port in point-to-point mode</title>
<desc id="desc">The Cross Trigger Port with CONFIG.MODE set to point-to-point, showing only the logic that is active in that mode. ct_src_i starts the sender state machine in u_handshake_ctrl. Its ct_req_out_o, XOR invert_i, is registered onto the CT_Req_out pad, whose output enable is 1. The CT_Ack_in and CT_Req_in pad inputs, enabled by registered 1s, each pass through two synchroniser registers and an XOR with invert_i into the handshake controller; CT_Req_in also feeds u_edge_detector, whose output is unused. The handshake ct_ack_out_o, XOR invert_i, is registered onto the CT_Ack_out pad, enabled by a registered 1. The handshake busy_o and ct_dst_o are registered once more to become the port's busy_o and ct_dst_o. handshake_reset_i from CONFIG.RESET resets the sender state machine.</desc>
