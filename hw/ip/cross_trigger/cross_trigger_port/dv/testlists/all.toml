schema_version = 1

# Cross Trigger Port IP-level scenarios.

[[tests]]
name = "ctp_sanity_test"
module = { cocotb = "ctp_sanity_test" }
seed = 1
timeout_sec = 600
tags = ["smoke", "ci", "ctp"]
run_modes = ["smoke"]

[[tests]]
name = "ctp_wire_or_test"
module = { cocotb = "ctp_wire_or_test" }
seed = 1
timeout_sec = 900
tags = ["ctp", "wire_or"]
run_modes = ["functional"]

[[tests]]
name = "ctp_wire_or_bus_test"
module = { cocotb = "ctp_wire_or_bus_test" }
seed = 1
timeout_sec = 900
tags = ["ctp", "wire_or"]
run_modes = ["functional"]

[[tests]]
name = "ctp_p2p_test"
module = { cocotb = "ctp_p2p_test" }
seed = 1
timeout_sec = 900
tags = ["ctp", "p2p"]
run_modes = ["functional"]

[[tests]]
name = "ctp_mode_switch_test"
module = { cocotb = "ctp_mode_switch_test" }
seed = 1
timeout_sec = 900
tags = ["ctp", "wire_or", "p2p"]
run_modes = ["functional"]

[[groups]]
name = "smoke"
tests = ["ctp_sanity_test"]

[[groups]]
name = "all"
tests = [
  "ctp_sanity_test",
  "ctp_wire_or_test",
  "ctp_wire_or_bus_test",
  "ctp_p2p_test",
  "ctp_mode_switch_test",
]
