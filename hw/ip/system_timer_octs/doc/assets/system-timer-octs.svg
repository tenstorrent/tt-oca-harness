<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="736" viewBox="0 0 1040 736" role="img" aria-labelledby="title desc">
<title id="title">System Timer OCTS</title>
<desc id="desc">The system_timer_octs block holds the timer core u_timer_core and its register block u_reg. The inbound timer_sync_load_i and timer_cnt_credit_i pulses are each flopped in clk_i and pass through a prim_edge_detector, u_sync_load_detector and u_credit_cnt_detector, which synchronizes them with two flops and detects the rising edge; the resulting pulses are masked while is_primary_i selects PRIMARY mode. In SECONDARY mode the sync-load pulse sets the sticky enable, and both pulses reset the credit tracking, which accumulates cur_credits by STEP, keeps the expected count and counts credit-starved cycles as credit_expired_o. The 64-bit count timer_count_q loads the preset, advances by one in PRIMARY mode, and in SECONDARY mode advances by STEP while credits are left or jumps to the expected count plus CREDIT_VAL on a credit pulse; it drives timer_count_o. In PRIMARY mode the credit counter runs from 0 to CREDIT_VAL-1 and the pulse state machine drives timer_sync_load_o after START and timer_cnt_credit_o at each credit period, each for PULSE_WIDTH cycles. The wrapper keeps the largest credit_expired_o value for CREDIT_EXPIRED. The AXI-Lite register block supplies START, CTRL and the preset, reads back mode, running and count, and drives timer_gpio_enable_o.</desc>
