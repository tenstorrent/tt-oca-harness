version = 1

[registers]
"i3c_csr.I3CBase.HCI_VERSION" = "Identifies the implemented MIPI I3C HCI version."
"i3c_csr.I3CBase.HC_CONTROL" = "Controls host-controller bus operation, mode selection, transaction abort, and Hot-Join handling."
"i3c_csr.I3CBase.CONTROLLER_DEVICE_ADDR" = "Configures the controller dynamic address and indicates whether that address is valid."
"i3c_csr.I3CBase.HC_CAPABILITIES" = "Reports the host-controller capabilities implemented by this instance."
"i3c_csr.I3CBase.RESET_CONTROL" = "Requests a controller soft reset or selective PIO queue and FIFO resets. Reset requests are self-clearing."
"i3c_csr.I3CBase.PRESENT_STATE" = "Reports current controller state, including active-controller bus ownership."
"i3c_csr.I3CBase.INTR_STATUS" = "Reports host-controller error and exceptional-condition status. Implemented status fields are write-one-to-clear."
"i3c_csr.I3CBase.INTR_STATUS_ENABLE" = "Enables individual host-controller interrupt status sources."
"i3c_csr.I3CBase.INTR_SIGNAL_ENABLE" = "Routes enabled host-controller interrupt sources to the interrupt output."
"i3c_csr.I3CBase.INTR_FORCE" = "Forces host-controller interrupts for software testing."
"i3c_csr.I3CBase.DAT_SECTION_OFFSET" = "Reports the Device Address Table section offset and size."
"i3c_csr.I3CBase.DCT_SECTION_OFFSET" = "Configures the Device Characteristic Table section offset, size, and ENTDAA index."
"i3c_csr.I3CBase.PIO_SECTION_OFFSET" = "Reports the PIO section offset."
"i3c_csr.PIOControl.COMMAND_PORT" = "Accepts a 64-bit command descriptor as two consecutive 32-bit writes. The second write enqueues the descriptor."
"i3c_csr.PIOControl.RESPONSE_PORT" = "Returns one 32-bit response descriptor from the response queue."
"i3c_csr.PIOControl.TX_DATA_PORT" = "Writes transmit data to the TX FIFO. This port shares its address with the read-only RX data port."
"i3c_csr.PIOControl.RX_DATA_PORT" = "Reads received data from the RX FIFO. This port shares its address with the write-only TX data port."
"i3c_csr.PIOControl.IBI_PORT" = "Returns IBI status and payload data. Payload data is padded to a 4-byte boundary."
"i3c_csr.PIOControl.QUEUE_THLD_CTRL" = "Configures command, response, and IBI queue thresholds."
"i3c_csr.PIOControl.DATA_BUFFER_THLD_CTRL" = "Configures TX and RX start and ready thresholds, encoded as powers of two."
"i3c_csr.PIOControl.QUEUE_SIZE" = "Reports command, response, IBI, TX, and RX queue depths."
"i3c_csr.PIOControl.ALT_QUEUE_SIZE" = "Reports extended IBI and alternate response queue sizes."
"i3c_csr.PIOControl.PIO_INTR_STATUS" = "Reports PIO queue-threshold and transfer-event interrupt status."
"i3c_csr.PIOControl.PIO_INTR_STATUS_ENABLE" = "Enables individual PIO interrupt status sources."
"i3c_csr.PIOControl.PIO_INTR_SIGNAL_ENABLE" = "Routes enabled PIO interrupt sources to the interrupt output."
"i3c_csr.I3C_EC.StdbyCtrlMode.STBY_CR_CONTROL" = "Configures standby-controller operation, dynamic-address-assignment methods, target transactions, and controller-role handoff."
"i3c_csr.I3C_EC.StdbyCtrlMode.STBY_CR_DEVICE_ADDR" = "Configures standby-controller dynamic and static addresses."
"i3c_csr.I3C_EC.StdbyCtrlMode.STBY_CR_CAPABILITIES" = "Reports standby-controller capabilities."
