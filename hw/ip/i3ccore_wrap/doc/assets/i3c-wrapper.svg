<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="746" viewBox="0 0 1040 746" role="img" aria-labelledby="title desc">
<title id="title">OCAH I3C wrapper</title>
<desc id="desc">i3ccore_wrapper has one AXI-Lite subordinate port, 32-bit address and 32-bit data, on its single clock clk_i. The PULP axi_lite_demux u_axil_demux, with every channel registered and up to eight transactions outstanding, selects instance i when the address minus BASE_ADDR lies in the i-th 0x1000 window, and instance 0 when it lies in none. Each generated instance subtracts i times 0x1000 from the address and passes a 12-bit offset to its i3c_wrapper. Inside i3c_wrapper the AXI-Lite port reaches the CHIPS Alliance i3c-core u_i3c, drawn as a black box, as single-beat AXI4 with length 0, WLAST 1 and ID and user zero. SCL and SDA inputs pass straight to the core. The wrapper ties scl_o low and drives scl_oe_o with the inverse of the core's SCL level. sda_o is the core's SDA level, and sda_oe_o is sel_od_pp_o OR the inverse of sda_o. sel_od_pp_o, irq_o, the recovery signals and the DAT, DCT and RLT memory ports pass through to per-instance vectors on the i3ccore_wrapper boundary. Instances 1 to N-1 are identical to instance 0.</desc>
