schema_version = 1

# One entry per regression module. `module` is the Python file basename
# (cocotb MODULE=). dv/cocotb/tests/ also holds i3c_ibi_diag, an IBI receive
# diagnostic that is intentionally not listed here.

[[tests]]
name = "test_i3ccore"
module = "test_i3ccore"
seed = 1
timeout_sec = 1800
tags = ["xresolve"]
run_modes = ["block"]

