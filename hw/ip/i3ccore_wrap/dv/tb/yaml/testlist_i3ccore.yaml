#include project_i3ccore.yaml

# TTEM testlist for the i3ccore block cocotb tests (Option-A pilot).
# Each entry maps one block cocotb module (cocotb_top) to a TTEM-managed sim.
# A whole module runs all its @cocotb.test functions; add `cocotb_test:` to pin
# a single testcase within a multi-test module.
testlist_i3ccore: &testlist_i3ccore
  <<: *project_i3ccore

  dummy: false
  simscope_dump: false

  stack: flist,compile_i3ccore,sim

  # Default compile stage entry (resolves to the cocotb compile target).
  compile:
    name: compile
    <<: *compile_i3ccore

  simulate:
    name: dummy
    <<: *i3ccore_simulate

  # Per-test base (the name avoids '_test' so TTEM does not list the template
  # itself as a runnable testcase — TTEM treats any key containing '_test' as a
  # testcase). The test config is the simulate config.
  i3ccore_sim_base: &i3ccore_sim_base
    lsf: false
    waves: false
    coverage: false
    c_seed: random
    <<: *i3ccore_simulate

  # --------------------------------------------------------------------------
  # Pilot tests  (key MUST contain '_test'; cocotb_top is the .py module name)
  # --------------------------------------------------------------------------
  # Single-test module: runs test_setnewda.
  i3c_setnewda_test: &i3c_setnewda_test
    name: i3c_setnewda_test
    cocotb_top: i3c_setnewda
    compile_target: compile_i3ccore
    <<: *i3ccore_sim_base

  # Multi-test module: runs all 4 @cocotb.test functions in i3c_error_sanity.py.
  i3c_error_sanity_test: &i3c_error_sanity_test
    name: i3c_error_sanity_test
    cocotb_top: i3c_error_sanity
    compile_target: compile_i3ccore
    <<: *i3ccore_sim_base
