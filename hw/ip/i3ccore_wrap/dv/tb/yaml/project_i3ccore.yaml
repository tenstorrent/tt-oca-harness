#include project_default.yaml

# TTEM project for the i3ccore block TB (pure-cocotb, no UVM).
# Mirrors project_smc_chiplet.yaml but targets tb_i3ccore directly and runs each
# block cocotb module via TTEM's native cocotb support (cocotb: true). The
# per-test python module is selected with `cocotb_top:` in the testlist, and an
# optional specific testcase with `cocotb_test:`.
project_i3ccore: &project_i3ccore
  <<: *project_default

  project: i3ccore

  user: brucehsu

  lsf:
    job_name: i3ccore
    queue: normal
    license: 'VCSCompiler_Net=1:VCSRuntime_Net=1'
    <<: *lsf

  # Regenerate the bender filelist (i3ccore_filelist.f) in the TB dir.
  # Use $OCH_ROOT (reliably absolute); $TB_ROOT is forced to "." by TTEM before
  # the testlist variables load, so it is unsafe in path expressions.
  flist: >
    cd $OCH_ROOT/hw/periph/i3ccore_wrap/tb && make filelist

  variables:
    <<: *variables
    # Simulator, license, and cocotb runtime paths are supplied by the user
    # environment or CI wrapper.
    TB_ROOT: $OCH_ROOT/hw/periph/i3ccore_wrap/tb
    OUT: $OCH_ROOT/hw/periph/i3ccore_wrap/tb/out
    # PYTHONPATH so the symlinked cocotb module can import its siblings
    # (i3c_test_base / i3c_rand / i3c_api), the generated register headers
    # (I3CCSR_reg), the shared constrained-random core, and cocotbext-i3c.
    PYTHONPATH: $OCH_ROOT/hw/periph/i3ccore_wrap/tb:$OCH_ROOT/hw/periph/i3ccore_wrap/data/registers/py_headers:$OCH_ROOT/dv/common/cocotb:$OCH_ROOT/vendor/chipsalliance/i3c-core/upstream/third_party/cocotbext-i3c/src
    COCOTB_REDUCED_LOG_FMT: 1
    COCOTB_HDL_TIMEUNIT: 1ns
    COCOTB_HDL_TIMEPRECISION: 1ps
    TOPLEVEL: tb_i3ccore
    # MODULE is set per-test via `cocotb_top:` in the testlist.

  # Compile target: build tb_i3ccore with the cocotb VPI (cocotb: true makes
  # TTEM append +vpi -load <libcocotbvpi_vcs.so> +define+COCOTB_SIM=1).
  compile_i3ccore: &compile_i3ccore
    name: compile_i3ccore
    cocotb: true
    cocotb_rtl_top: tb_i3ccore
    stop_on_fail: true
    partcomp: false
    verilog_defines:
      SIM
      VCS
      COMMON_CELLS_ASSERTS_OFF
      I3C_USE_AXI_LITE
    include_dirs:
      $OCH_ROOT/hw/periph/i3ccore_wrap/tb
    comp_flags:
      -top tb_i3ccore -full64 -sverilog -lca +rad -kdb +nospecify
      -timescale=1ns/1ps
      -debug_access+all
      +lint=PCWM +warn=noCWUC +warn=noUII-L +lint=TFIPC-L
    filelist:
      $OCH_ROOT/hw/periph/i3ccore_wrap/tb/i3ccore_ttem.f
    <<: *compile

  # Base simulate config for cocotb block tests.
  i3ccore_simulate: &i3ccore_simulate
    timeout: 30  # minutes
    cocotb: true
    cocotb_rtl_top: tb_i3ccore
    compile_target: compile_i3ccore
    run_flags: -licqueue
    <<: *simulate

  simulate:
    name: dummy
    <<: *i3ccore_simulate

  # Non-null overrides so TTEM's schema validation passes (project_default
  # leaves these empty; the block TB doesn't normally use waves/coverage here).
  waves:
    comp_options: -kdb +define+FSDB_FIX
    run_options: +waves +fsdb+delta +vcs+dumparrays
    open: $VERDI_HOME/bin/verdi -dbdir $OUT/compile_i3ccore/simv.daidir -ssf $OUT/waves.fsdb
    <<: *waves

  coverage:
    options: -cm line+tgl+cond+fsm+branch
    urg_options: -dir merged_cov.vdb -dbname merged_cov -log merge.log
    <<: *coverage
