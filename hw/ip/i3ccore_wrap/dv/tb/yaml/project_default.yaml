---
project_default: &project_default

  project: template

  user: add_username

  dummy: true

  stack:

  cgen_cmd:

  post_cmd:

  flist:

  interactive: true

  ruby_seed: fixed

  template: vcs

  simscope_dump: false

  append_run_args:

  clean_cmd:
    clean:
    clean_lib:
    clean_comp:
    clean_sim:

  lsf: &lsf
    job_name:
    run_cmd: bsub -env "all,LD_LIBRARY_PATH=$LD_LIBRARY_PATH,PATH=$PATH"
    wait_cmd: bsub -I
    sim_mem: mem=20
    sim_cpu: 1
    comp_mem: mem=20
    comp_cpu: 8
    license:
    duration: 2m
    queue: regress
    comp_license:
    comp_license_duration:
    sim_license:
    sim_license_duration:

  variables: &variables
    OUT:
    OCH_ROOT: ${OCH_ROOT}
    RUBY_SEED: '1234567'

  compile: &compile
    name: compile
    stop_on_fail: false
    lsf: false
    verilog_defines:
    filelist:
    include_dirs:
    verilog_lib:
    comp_args:
    ram_models: false
    ram_models_cmd: "+define+RAM_MODELS"
    xprop: false
    rand_cdc: false
    waves: false
    coverage: false
    comp_flags:
    c_flags:
    cocotb: false
    cocotb_flist: []
    partcomp: false
    distcomp: false
    distsim: false

  simulate: &simulate
    description:
    lsf: false
    waves: false
    coverage: false
    run_flags:
    run_args:
    uvm_testname:
    c_testname:
    c_seed: 1234
    uvm_seed: 1234
    uvm_verbosity: UVM_LOW
    timeout:
    compile_target: compile
    copy_files: []
    distsim_cmd:

  coverage: &coverage
    options:
    open: $VERDI_HOME/bin/verdi -cov -covdir merged_cov.vdb -elfile cov_exclude.el
    urg_options:
    scratch_dir:

  waves: &waves
    comp_options:
    run_options:
    open: $VERDI_HOME/bin/verdi -dbdir simv.daidir -ssf waves.fsdb

  post_sim_template: &post_sim_template
    pass_pattern:
      regex: 'Simulation PASSED|TEST PASSED|passed|PASS'
    fail_pattern_0:
      regex: 'ERROR: |Error-\[|\[ERROR\]|ERROR \[t=|Error: |ERROR \['
    fail_pattern_1:
      regex: 'Fatal: \"|\[FATAL ERROR\]|FATAL ERROR \[t=|Fatal: |FATAL \['
    fail_pattern_2:
      regex: 'UVM_ERROR /|\[[^]]*\]\s*UVM_ERROR|UVM_ERROR .*@\s*\d'
    fail_pattern_3:
      regex: 'UVM_FATAL /|\[[^]]*\]\s*UVM_FATAL|UVM_FATAL .*@\s*\d'
    fail_pattern_4:
      regex: 'Solver failed|\[FAIL\]:|Failed'
    fail_pattern_5:
      regex: '\[WARNING\]|qqqError:'
    fail_pattern_6:
      regex: 'An unexpected termination has occurred in|Stack trace follows:|Dumping VCS Annotated Stack:|error while loading shared libraries'
    fail_pattern_7:
      regex: 'failed|FAIL=[1-9]\d*|Traceback'

  post_sim:
    ignore_pattern:
      regex: ''
    <<: *post_sim_template
