<text class="t" x="230" y="103" text-anchor="middle">DTMCS register</text>
<text class="s" x="230" y="123" text-anchor="middle">32 bits</text>
<rect class="fabric" x="160" y="168" width="140" height="54" rx="4"/>
<text class="t" x="230" y="191" text-anchor="middle">DMI register</text>
<text class="s" x="230" y="211" text-anchor="middle">41 bits</text>

<rect class="external" x="370" y="62" width="300" height="200" rx="6"/>
