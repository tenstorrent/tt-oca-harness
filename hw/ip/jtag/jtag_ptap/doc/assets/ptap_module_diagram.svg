<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="860" height="560" viewBox="0 0 860 560">
  <defs>
    <style>
      text { font-family: sans-serif; fill: #333333; }
      .title  { font-size: 14px; font-weight: bold; }
      .label  { font-size: 12px; }
      .small  { font-size: 10px; fill: #555555; }
      .port   { font-size: 10px; font-family: monospace; fill: #333333; }
      .reg    { font-size: 10px; fill: #333333; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#4a7baa"/>
    </marker>
    <marker id="arr-g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#555555"/>
    </marker>
  </defs>

  <text x="14" y="22" class="title">PTAP — Primary TAP Architecture</text>

  <!-- ── Outer PTAP boundary ─────────────────────────────────────────── -->
  <rect x="10" y="34" width="840" height="440" rx="6"
        fill="none" stroke="#4a7baa" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="24" y="54" class="label" font-weight="bold" fill="#4a7baa">PTAP</text>

  <!-- ── TAP Controller ─────────────────────────────────────────────── -->
  <rect x="70" y="70" width="140" height="80" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="140" y="106" class="label" text-anchor="middle">TAP</text>
  <text x="140" y="122" class="label" text-anchor="middle">Controller</text>

  <!-- PTAP_TMS / TRST: arrive via a jog to the right of left-port labels -->
  <text x="14" y="196" class="port">PTAP_TMS</text>
  <text x="14" y="210" class="port">PTAP_TRST_N</text>
  <polyline points="68,165 54,165 54,190 70,110"
            fill="none" stroke="#555555" stroke-width="1" marker-end="url(#arr-g)"/>

  <!-- ── Instruction Register ──────────────────────────────────────── -->
  <rect x="270" y="70" width="140" height="60" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="340" y="100" class="label" text-anchor="middle">Instruction</text>
  <text x="340" y="116" class="label" text-anchor="middle">Register (IR)</text>

  <!-- TAP Controller → IR -->
  <line x1="210" y1="95" x2="270" y2="95" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ── Instruction Decoder ─────────────────────────────────────────── -->
  <rect x="470" y="70" width="140" height="60" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="540" y="100" class="label" text-anchor="middle">Instruction</text>
  <text x="540" y="116" class="label" text-anchor="middle">Decoder</text>

  <!-- IR → Decoder -->
  <line x1="410" y1="100" x2="470" y2="100" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ── TDR Select block ──────────────────────────────────────────── -->
  <rect x="670" y="70" width="140" height="60" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="740" y="100" class="label" text-anchor="middle">TDR Select</text>
  <text x="740" y="116" class="small" text-anchor="middle">INST_SELECT[NUM_INST-1:0]</text>

  <!-- Decoder → TDR Select -->
  <line x1="610" y1="100" x2="670" y2="100" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ── TDR bank (column, y=150 downward) ─────────────────────────── -->

  <rect x="670" y="150" width="140" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="740" y="172" class="reg" text-anchor="middle">BYPASS</text>

  <rect x="670" y="192" width="140" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="740" y="214" class="reg" text-anchor="middle">IDCODE</text>

  <rect x="670" y="234" width="140" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="740" y="256" class="reg" text-anchor="middle">DEBUG_CONTROL</text>

  <rect x="670" y="276" width="140" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="740" y="298" class="reg" text-anchor="middle">IC_RESET</text>

  <rect x="670" y="318" width="140" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="740" y="340" class="reg" text-anchor="middle">TMP_STATUS</text>

  <rect x="670" y="360" width="140" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="740" y="382" class="reg" text-anchor="middle">JTAG_CAPS</text>

  <rect x="670" y="402" width="140" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="740" y="424" class="reg" text-anchor="middle">INV / ZLB / iJTAG</text>

  <!-- TDR select vertical bus (runs left of TDR column, x=660) -->
  <line x1="660" y1="130" x2="660" y2="436" stroke="#4a7baa" stroke-width="1" stroke-dasharray="4 2"/>
  <!-- Horizontal taps from bus into each TDR left edge -->
  <line x1="660" y1="167" x2="670" y2="167" stroke="#4a7baa" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="660" y1="209" x2="670" y2="209" stroke="#4a7baa" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="660" y1="251" x2="670" y2="251" stroke="#4a7baa" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="660" y1="293" x2="670" y2="293" stroke="#4a7baa" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="660" y1="335" x2="670" y2="335" stroke="#4a7baa" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="660" y1="377" x2="670" y2="377" stroke="#4a7baa" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="660" y1="419" x2="670" y2="419" stroke="#4a7baa" stroke-width="1" marker-end="url(#arr)"/>
  <!-- Bus from TDR Select down to bus start -->
  <line x1="660" y1="130" x2="740" y2="130" stroke="#4a7baa" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="740" y1="130" x2="740" y2="150" stroke="#4a7baa" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ── STAP Select block ──────────────────────────────────────────── -->
  <rect x="270" y="185" width="140" height="60" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="340" y="212" class="label" text-anchor="middle">STAP Select</text>
  <text x="340" y="228" class="small" text-anchor="middle">mux secondary scan</text>

  <!-- Decoder → STAP Select (routed below decoder block) -->
  <polyline points="540,130 540,215 410,215"
            fill="none" stroke="#4a7baa" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arr)"/>

  <!-- ── Scan Path Mux ──────────────────────────────────────────────── -->
  <rect x="270" y="295" width="140" height="60" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="340" y="322" class="label" text-anchor="middle">Scan Path Mux</text>
  <text x="340" y="338" class="small" text-anchor="middle">(IR / TDR / STAP)</text>

  <!-- ── TMP Controller ─────────────────────────────────────────────── -->
  <rect x="470" y="295" width="140" height="60" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="540" y="322" class="label" text-anchor="middle">TMP Controller</text>
  <text x="540" y="338" class="small" text-anchor="middle">CH_RESET_N output</text>

  <!-- ── External ports (left side) ──────────────────────────────────── -->

  <!-- PTAP_TDI: enters IR at top -->
  <text x="14" y="78" class="port">PTAP_TDI</text>
  <line x1="68" y1="75" x2="270" y2="79" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>

  <!-- BSR_SI / IJTAG_SI: enters Scan Path Mux.
       Label at y=305, line starts at x=68 (clear of left text block) y=305 -->
  <text x="14" y="310" class="port">BSR_SI /</text>
  <text x="14" y="323" class="port">IJTAG_SI</text>
  <line x1="68" y1="320" x2="270" y2="325" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>

  <!-- PTAP_TDO: exits Scan Path Mux left -->
  <text x="14" y="360" class="port">PTAP_TDO</text>
  <line x1="270" y1="348" x2="68" y2="348" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>

  <!-- ── Note (scan path summary) ────────────────────────────────────── -->
  <rect x="70" y="400" width="560" height="64" rx="4"
        fill="#f8f8f8" stroke="#cccccc" stroke-width="1"/>
  <text x="350" y="420" class="small" text-anchor="middle">
    Scan data path: PTAP_TDI → IR (on IR-scan) or through selected TDR →
  </text>
  <text x="350" y="436" class="small" text-anchor="middle">
    Scan Path Mux → PTAP_TDO.  TAP Controller drives Capture/Shift/Update.
  </text>
  <text x="350" y="452" class="small" text-anchor="middle">
    STAP_TDI/TDO feed the secondary scan chain; selected by STAP Select block.
  </text>

  <!-- ── External interface note (below PTAP boundary) ────────────────
       Five downstream outputs that exit the TDR bank rightward.
       Placed below the PTAP dashed box (bottom at y=474) with clear margin.
       These are named here rather than attached to specific register boxes to
       avoid overlapping the TDR column. -->
  <rect x="10" y="482" width="840" height="72" rx="4"
        fill="#f0f4f8" stroke="#4a7baa" stroke-width="1"/>
  <text x="430" y="498" class="small" text-anchor="middle" font-weight="bold">
    External interface outputs from TDR bank (right side of PTAP):
  </text>
  <text x="430" y="514" class="small" text-anchor="middle">
    SMC_AXI_SI · SMC_OTP_SI · SEP_OTP_SI (JTAG2AXI bridge scan inputs, lifecycle-gated)
  </text>
  <text x="430" y="530" class="small" text-anchor="middle">
    STAP_TDI (secondary scan chain input) · CAPTURE_DR (data register scan control)
  </text>
  <text x="430" y="546" class="small" text-anchor="middle">
    See PTAP port reference for full list. Interface descriptions are in adjacent architecture text.
  </text>

</svg>
