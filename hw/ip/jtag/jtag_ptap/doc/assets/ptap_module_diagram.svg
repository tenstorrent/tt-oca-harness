<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="860" height="480" viewBox="0 0 860 480">
  <defs>
    <style>
      text { font-family: sans-serif; fill: #333333; }
      .title  { font-size: 14px; font-weight: bold; }
      .label  { font-size: 12px; }
      .small  { font-size: 10px; fill: #555555; }
      .port   { font-size: 10px; font-family: monospace; fill: #333333; }
      .reg    { font-size: 10px; fill: #333333; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#4a7baa"/>
    </marker>
    <marker id="arr-g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#555555"/>
    </marker>
  </defs>

  <text x="14" y="22" class="title">PTAP — Primary TAP Architecture</text>

  <!-- ── Outer PTAP boundary ─────────────────────────────────────────── -->
  <rect x="10" y="36" width="840" height="430" rx="6"
        fill="none" stroke="#4a7baa" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="24" y="56" class="label" font-weight="bold" fill="#4a7baa">PTAP</text>

  <!-- ── TAP Controller ─────────────────────────────────────────────── -->
  <rect x="50" y="68" width="130" height="80" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="115" y="102" class="label" text-anchor="middle">TAP</text>
  <text x="115" y="118" class="label" text-anchor="middle">Controller</text>
  <text x="115" y="134" class="small" text-anchor="middle">PTAP_TMS / TRST</text>

  <!-- ── Instruction Register ──────────────────────────────────────── -->
  <rect x="240" y="68" width="130" height="60" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="305" y="96" class="label" text-anchor="middle">Instruction</text>
  <text x="305" y="112" class="label" text-anchor="middle">Register (IR)</text>

  <!-- ── Instruction Decoder ─────────────────────────────────────────── -->
  <rect x="430" y="68" width="130" height="60" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="495" y="96" class="label" text-anchor="middle">Instruction</text>
  <text x="495" y="112" class="label" text-anchor="middle">Decoder</text>

  <!-- Arrows: controller → IR → Decoder -->
  <line x1="180" y1="105" x2="240" y2="98" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="370" y1="98" x2="430" y2="98" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ── TDR bank ──────────────────────────────────────────────────── -->
  <!-- TDR Select -->
  <rect x="630" y="68" width="120" height="60" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="690" y="96" class="label" text-anchor="middle">TDR Select</text>
  <text x="690" y="112" class="small" text-anchor="middle">INST_SELECT[NUM_INST-1:0]</text>
  <line x1="560" y1="98" x2="630" y2="98" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Individual TDRs -->
  <rect x="630" y="155" width="100" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="680" y="177" class="reg" text-anchor="middle">BYPASS</text>

  <rect x="630" y="196" width="100" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="680" y="218" class="reg" text-anchor="middle">IDCODE</text>

  <rect x="630" y="237" width="100" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="680" y="259" class="reg" text-anchor="middle">DEBUG_CONTROL</text>

  <rect x="630" y="278" width="100" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="680" y="300" class="reg" text-anchor="middle">IC_RESET</text>

  <rect x="630" y="319" width="100" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="680" y="341" class="reg" text-anchor="middle">TMP_STATUS</text>

  <rect x="630" y="360" width="100" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="680" y="382" class="reg" text-anchor="middle">JTAG_CAPS</text>

  <rect x="630" y="401" width="100" height="34" rx="3" fill="#f0f4f8" stroke="#888888" stroke-width="1"/>
  <text x="680" y="423" class="reg" text-anchor="middle">INV / ZLB / iJTAG</text>

  <!-- TDR select vertical bus -->
  <line x1="690" y1="128" x2="690" y2="435" stroke="#888888" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- ── STAP Select block ──────────────────────────────────────────── -->
  <rect x="240" y="180" width="130" height="60" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="305" y="205" class="label" text-anchor="middle">STAP Select</text>
  <text x="305" y="221" class="small" text-anchor="middle">mux STAP into scan</text>

  <!-- Arrow from decoder to STAP select -->
  <polyline points="495,128 495,210 370,210"
            fill="none" stroke="#4a7baa" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arr)"/>

  <!-- ── IR Select mux ──────────────────────────────────────────────── -->
  <rect x="240" y="280" width="130" height="60" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="305" y="306" class="label" text-anchor="middle">IR Select</text>
  <text x="305" y="322" class="small" text-anchor="middle">scan path mux</text>

  <!-- ── TMP Controller ─────────────────────────────────────────────── -->
  <rect x="430" y="280" width="130" height="60" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="495" y="306" class="label" text-anchor="middle">TMP Controller</text>
  <text x="495" y="322" class="small" text-anchor="middle">CH_RESET_N</text>

  <!-- ── External ports (left) ─────────────────────────────────────── -->
  <text x="8"  y="78"  class="port" text-anchor="start">PTAP_TDI</text>
  <text x="8"  y="148" class="port" text-anchor="start">PTAP_TMS / TRST</text>
  <text x="8"  y="310" class="port" text-anchor="start">BSR_SI / IJTAG_SI</text>

  <line x1="48" y1="75" x2="240" y2="88" stroke="#555555" stroke-width="1" marker-end="url(#arr-g)"/>
  <line x1="48" y1="145" x2="50" y2="105" stroke="#555555" stroke-width="1" marker-end="url(#arr-g)"/>
  <line x1="48" y1="308" x2="240" y2="305" stroke="#555555" stroke-width="1" marker-end="url(#arr-g)"/>

  <!-- ── External ports (right / bottom) ───────────────────────────── -->
  <text x="752" y="265" class="port">SMC_AXI_SI</text>
  <text x="752" y="285" class="port">SMC_OTP_SI</text>
  <text x="752" y="305" class="port">SEP_OTP_SI</text>
  <text x="752" y="325" class="port">STAP_SI</text>
  <text x="752" y="345" class="port">CAPTURE_STAP / DR</text>

  <!-- TDO output -->
  <text x="8" y="395" class="port">PTAP_TDO</text>
  <line x1="240" y1="393" x2="48" y2="393" stroke="#555555" stroke-width="1" marker-end="url(#arr-g)"/>
  <line x1="240" y1="393" x2="240" y2="310" stroke="#555555" stroke-width="1" stroke-dasharray="3 2"/>

</svg>
