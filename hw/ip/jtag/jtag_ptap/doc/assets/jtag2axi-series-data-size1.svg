.a-rosc { fill: none; stroke: #336633; stroke-width: 1.8; marker-end: url(#m-rosc); }
.n-jtag { fill: none; stroke: #42759b; stroke-width: 1.8; }
.a-jtag { fill: none; stroke: #42759b; stroke-width: 1.8; marker-end: url(#m-jtag); }
.n-spi { fill: none; stroke: #5b6670; stroke-width: 1.8; }
.a-spi { fill: none; stroke: #5b6670; stroke-width: 1.8; marker-end: url(#m-spi); }
.n-slate { fill: none; stroke: #5b6670; stroke-width: 1.8; }
.a-slate { fill: none; stroke: #5b6670; stroke-width: 1.8; marker-end: url(#m-slate); }
.n-pg { fill: none; stroke: #336633; stroke-width: 1.8; }
.a-pg { fill: none; stroke: #336633; stroke-width: 1.8; marker-end: url(#m-pg); }
.axil { fill: none; stroke: #103525; stroke-width: 1.5; marker-start: url(#as); marker-end: url(#ae); }
.sigd { fill: none; stroke: #5b6670; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#ge); }
.axin { fill: none; stroke: #103525; stroke-width: 2.5; }
.axis { fill: none; stroke: #103525; stroke-width: 2.5; marker-start: url(#as); }
.axie { fill: none; stroke: #103525; stroke-width: 2.5; marker-end: url(#ae); }
.axiln { fill: none; stroke: #103525; stroke-width: 1.5; }
</style>
