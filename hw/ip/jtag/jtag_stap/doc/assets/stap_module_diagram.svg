<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="860" height="430" viewBox="0 0 860 430">
  <defs>
    <style>
      text { font-family: sans-serif; fill: #333333; }
      .title  { font-size: 14px; font-weight: bold; }
      .label  { font-size: 12px; }
      .small  { font-size: 10px; fill: #555555; }
      .port   { font-size: 10px; font-family: monospace; fill: #333333; }
      .note   { font-size: 9px; fill: #666666; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#4a7baa"/>
    </marker>
    <marker id="arr-g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#555555"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#aa5555"/>
    </marker>
  </defs>

  <text x="14" y="22" class="title">STAP — Secondary TAP (one instance per STAP port)</text>

  <!-- ── Outer STAP boundary ────────────────────────────────────────── -->
  <rect x="10" y="34" width="720" height="300" rx="6"
        fill="none" stroke="#4a7baa" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="24" y="54" class="label" font-weight="bold" fill="#4a7baa">STAP (N-th instance)</text>

  <!-- ─────────────────────────────────────────────────────────────────
       CLIENT SIDE (left column):  client_scan_in_i  →  stap_scan_in
                                   host_tdi_i        →  stap_tdi
       ──────────────────────────────────────────────────────────────── -->

  <!-- stap_scan_in node (optional SCAN_IN_PIPE, default: direct assign) -->
  <!-- Represented as a small pass node at x=100 -->

  <!-- SIB (prim_jtag_sib_mux_pre)  x=110..280, y=68..188 -->
  <rect x="110" y="68" width="170" height="120" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="195" y="98"  class="label" text-anchor="middle">SIB</text>
  <text x="195" y="114" class="small" text-anchor="middle">prim_jtag_sib_mux_pre</text>
  <text x="195" y="130" class="small" text-anchor="middle">client_scan_in → sib mux</text>
  <text x="195" y="146" class="small" text-anchor="middle">host_scan_out / host_scan_in</text>
  <text x="195" y="162" class="small" text-anchor="middle">client_scan_out (±lockup)</text>

  <!-- 3DCR scan register  x=360..530, y=68..148 -->
  <rect x="360" y="68" width="170" height="80" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="445" y="100" class="label" text-anchor="middle">3DCR</text>
  <text x="445" y="116" class="small" text-anchor="middle">prim_jtag_scan_reg</text>
  <text x="445" y="132" class="small" text-anchor="middle">tms_hold · stap_sel · config_hold</text>

  <!-- SIB host_scan_out → 3DCR scan_in (direct, no extra flop) -->
  <line x1="280" y1="108" x2="360" y2="108"
        stroke="#4a7baa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="318" y="103" class="note" text-anchor="middle">host_scan_out</text>

  <!-- 3DCR scan_out → SIB host_scan_in (return, routed below both blocks) -->
  <polyline points="445,148 445,180 195,180 195,188"
            fill="none" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="318" y="195" class="note" text-anchor="middle">client_reg_scan_out → host_sib_scan_in</text>

  <!-- TDO lockup flop (always present, on ~TCK)  x=360..530, y=220..270 -->
  <rect x="360" y="220" width="170" height="50" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="445" y="242" class="label" text-anchor="middle">TDO Lockup</text>
  <text x="445" y="258" class="small" text-anchor="middle">flop on ~TCK → host_tdo_int</text>

  <!-- stap_scan_in → TDO lockup (feeds host_tdo_int, not through SIB/3DCR) -->
  <!-- stap_scan_in enters SIB at the mux, but also branches to TDO lockup.
       Route: from left input y=80 (client_scan_in_i), branch down at x=60 to y=245 -->
  <polyline points="60,80 60,245 360,245"
            fill="none" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="14" y="215" class="note">stap_scan_in</text>
  <text x="14" y="226" class="note">(→ TDO lockup)</text>

  <!-- Security gate block  x=560..700, y=100..180 -->
  <rect x="560" y="100" width="140" height="80" rx="4"
        fill="#fce8e8" stroke="#aa5555" stroke-width="1.5"/>
  <text x="630" y="124" class="label" text-anchor="middle" fill="#aa5555">Security</text>
  <text x="630" y="140" class="label" text-anchor="middle" fill="#aa5555">Gate</text>
  <text x="630" y="158" class="small" text-anchor="middle">stap_sel masked</text>
  <text x="630" y="172" class="small" text-anchor="middle">update_en masked</text>

  <!-- TDO lockup → security gate → host_tdo_o -->
  <polyline points="530,245 545,245 545,140 560,140"
            fill="none" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="544" y="200" class="note" text-anchor="middle">host_tdo_int</text>

  <!-- security_disable_i enters security gate from below -->
  <line x1="630" y1="210" x2="630" y2="180"
        stroke="#aa5555" stroke-width="1.2" marker-end="url(#arr-r)"/>
  <text x="630" y="224" class="port" text-anchor="middle" fill="#aa5555">security_disable_i</text>

  <!-- stap_sel from 3DCR → security gate (control path, dashed) -->
  <polyline points="530,108 545,108 545,120 560,120"
            fill="none" stroke="#aa5555" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr-r)"/>

  <!-- ── Input ports (left of STAP boundary) ────────────────────────── -->

  <!-- client_scan_in_i → SIB client scan-in mux (via stap_scan_in / stap_tdi sel) -->
  <text x="14" y="80" class="port">client_scan_in_i</text>
  <line x1="108" y1="77" x2="14" y2="77" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>
  <line x1="14" y1="77" x2="108" y2="77" stroke="#555555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- host_tdi_i → SIB mux via stap_tdi (alternative scan-in path) -->
  <text x="14" y="100" class="port">host_tdi_i</text>
  <line x1="14" y1="97" x2="108" y2="97" stroke="#555555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="62" y="92" class="note" text-anchor="middle">(stap_tdi)</text>

  <!-- client_tap_ctrl_i / client_scan_ctrl_i -->
  <text x="14" y="130" class="port">client_tap_ctrl_i</text>
  <line x1="14" y1="127" x2="108" y2="127" stroke="#555555" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="14" y="148" class="port">client_scan_ctrl_i</text>
  <line x1="14" y1="145" x2="108" y2="145" stroke="#555555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ── Output ports (right of STAP boundary) ──────────────────────── -->

  <!-- host_tdo_o exits security gate right -->
  <text x="706" y="130" class="port">host_tdo_o</text>
  <line x1="700" y1="127" x2="708" y2="127" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>

  <!-- host_tdo_oen_o (from stap_sel && shift_en, not through gate) -->
  <text x="706" y="148" class="port">host_tdo_oen_o</text>
  <line x1="700" y1="145" x2="708" y2="145" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>

  <!-- host_tap_ctrl_o -->
  <text x="706" y="168" class="port">host_tap_ctrl_o</text>
  <line x1="700" y1="165" x2="708" y2="165" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>

  <!-- client_scan_out_o exits SIB left/below -->
  <text x="14" y="168" class="port">client_scan_out_o</text>
  <line x1="110" y1="165" x2="14" y2="165" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>

  <!-- ── Notes ──────────────────────────────────────────────────────── -->
  <rect x="10" y="346" width="840" height="76" rx="4"
        fill="#f8f8f8" stroke="#cccccc" stroke-width="1"/>
  <text x="430" y="362" class="small" text-anchor="middle">
    Scan-in mux: stap_sel=1 routes host_tdi_i (upstream TDO) through SIB into 3DCR; stap_sel=0 routes client_scan_in_i.
  </text>
  <text x="430" y="378" class="small" text-anchor="middle">
    TDO path: client_scan_in_i (= stap_scan_in) → TDO lockup flop (~TCK) → host_tdo_int → security gate → host_tdo_o.
  </text>
  <text x="430" y="394" class="small" text-anchor="middle">
    SIB↔3DCR: host_sib_scan_out feeds 3DCR scan_in; 3DCR scan_out returns to host_sib_scan_in. No extra flop on this path.
  </text>
  <text x="430" y="410" class="small" text-anchor="middle">
    Security: security_disable_i forces stap_sel=0, host_tdo_o=0, and masks update_en so 3DCR cannot update.
  </text>

</svg>
