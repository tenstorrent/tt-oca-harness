<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="818" viewBox="0 0 1040 818" role="img" aria-labelledby="title desc">
<title id="title">STAP architecture and gating</title>
<desc id="desc">The jtag_stap module. client_scan_in_i, optionally through the SCAN_IN_PIPE stage, becomes stap_scan_in, which passes through the falling-edge TDO lockup flop u_tdo_lockup_flop and an AND gate that forces it low while security_disable_i is high, to host_tdo_o and the secondary TAP. The secondary TAP returns host_tdi_i, optionally through the falling-edge TDI_LOCKUP stage. The scan-in mux passes that return while stap_sel is set and stap_scan_in otherwise, into the SIB u_sib_mux_pre. The SIB inserts the 3-bit 3DCR u_3dcr_scan_reg (tms_hold, stap_sel_int, config_hold) into the chain through host_sib_scan_out and client_reg_scan_out, and its one-bit register drives client_scan_out_o. The 3DCR update enable is the SIB's update_en ANDed with NOT security_disable_i. The 3DCR reset is client TRST ANDed with config_hold_sticky, a falling-edge copy of config_hold, ORed with the scan reset. stap_sel is stap_sel_int ANDed with NOT security_disable_i; it selects the scan-in mux, selects the host TMS between the client TMS and tms_hold, and with the client shift enable drives host_tdo_oen_o. TCK and TRST pass from client_tap_ctrl_i to host_tap_ctrl_o unchanged.</desc>
