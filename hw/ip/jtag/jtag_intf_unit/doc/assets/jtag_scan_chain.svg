<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="860" height="400" viewBox="0 0 860 400">
  <defs>
    <style>
      text { font-family: sans-serif; fill: #333333; }
      .title  { font-size: 14px; font-weight: bold; }
      .label  { font-size: 12px; }
      .small  { font-size: 10px; fill: #555555; }
      .port   { font-size: 10px; font-family: monospace; fill: #333333; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#4a7baa"/>
    </marker>
    <marker id="arr-g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#555555"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#998866"/>
    </marker>
  </defs>

  <text x="14" y="22" class="title">JIU — JTAG Interface Unit Scan Chain</text>

  <!-- ── External JTAG pads ─────────────────────────────────────────── -->
  <rect x="14" y="48" width="74" height="100" rx="3"
        fill="#e8e8e8" stroke="#888888" stroke-width="1.2"/>
  <text x="51" y="74" class="small" text-anchor="middle" font-weight="bold">External</text>
  <text x="51" y="88" class="small" text-anchor="middle">JTAG</text>
  <text x="51" y="102" class="small" text-anchor="middle">Pads</text>
  <text x="51" y="118" class="port" text-anchor="middle">TDI→</text>
  <text x="51" y="133" class="port" text-anchor="middle">←TDO</text>

  <!-- ── PTAP ────────────────────────────────────────────────────────── -->
  <rect x="110" y="48" width="120" height="100" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="170" y="84" class="label" text-anchor="middle">PTAP</text>
  <text x="170" y="100" class="small" text-anchor="middle">Instruction</text>
  <text x="170" y="115" class="small" text-anchor="middle">Register</text>
  <text x="170" y="130" class="small" text-anchor="middle">TDR Select</text>

  <!-- Pads → PTAP: TDI is INPUT to JIU/PTAP (ptap_client_tdi_i) -->
  <line x1="88"  y1="90" x2="110" y2="90" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>
  <text x="14"  y="88" class="port">TDI in</text>

  <!-- PTAP → Pads: TDO is OUTPUT from JIU/PTAP (ptap_client_tdo_o) -->
  <line x1="110" y1="120" x2="88" y2="120" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>
  <text x="14"  y="118" class="port">TDO out</text>

  <!-- ── STAP chain (top) ───────────────────────────────────────────── -->
  <text x="250" y="42" class="small" font-weight="bold">STAP secondary scan chain — PTAP drives STAP_TDI; STAP_TDO returns to PTAP</text>

  <rect x="250" y="48" width="90" height="50" rx="3" fill="#dce8f4" stroke="#4a7baa" stroke-width="1"/>
  <text x="295" y="70" class="small" text-anchor="middle">STAP to I/O</text>
  <text x="295" y="84" class="small" text-anchor="middle">(optional)</text>

  <rect x="358" y="48" width="90" height="50" rx="3" fill="#dce8f4" stroke="#4a7baa" stroke-width="1"/>
  <text x="403" y="70" class="small" text-anchor="middle">STAP to SMC</text>
  <text x="403" y="84" class="small" text-anchor="middle">(optional)</text>

  <rect x="466" y="48" width="90" height="50" rx="3" fill="#dce8f4" stroke="#4a7baa" stroke-width="1"/>
  <text x="511" y="70" class="small" text-anchor="middle">STAP to SEP</text>
  <text x="511" y="84" class="small" text-anchor="middle">(optional)</text>

  <rect x="574" y="48" width="110" height="50" rx="3" fill="#dce8f4" stroke="#4a7baa" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="629" y="70" class="small" text-anchor="middle">Additional</text>
  <text x="629" y="84" class="small" text-anchor="middle">STAP(s) (optional)</text>

  <!-- PTAP STAP_TDI out → first STAP input -->
  <line x1="230" y1="73" x2="250" y2="73" stroke="#4a7baa" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- STAP chain links -->
  <line x1="340" y1="73" x2="358" y2="73" stroke="#4a7baa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="448" y1="73" x2="466" y2="73" stroke="#4a7baa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="556" y1="73" x2="574" y2="73" stroke="#4a7baa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- TDO return from last STAP → PTAP scan mux (dashed return path) -->
  <polyline points="684,73 716,73 716,152 230,152 230,120"
            fill="none" stroke="#4a7baa" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="472" y="170" class="small" text-anchor="middle">STAP_TDO return — selected stage's TDO feeds PTAP scan mux</text>

  <!-- ── iJTAG SIB chains (bottom half) ────────────────────────────── -->
  <text x="110" y="195" class="small" font-weight="bold">iJTAG SIB Network — TDR scan paths selected by PTAP instruction</text>

  <!-- Horizontal select bus down from PTAP -->
  <line x1="170" y1="148" x2="170" y2="215" stroke="#998866" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="170" y1="215" x2="750" y2="215" stroke="#998866" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- iJTAG chain blocks -->
  <rect x="110" y="225" width="100" height="50" rx="3" fill="#f5f0e8" stroke="#998866" stroke-width="1"/>
  <text x="160" y="247" class="small" text-anchor="middle">Secure DFT</text>
  <text x="160" y="263" class="small" text-anchor="middle">iJTAG</text>

  <rect x="224" y="225" width="108" height="50" rx="3" fill="#f5f0e8" stroke="#998866" stroke-width="1"/>
  <text x="278" y="247" class="small" text-anchor="middle">Non-Secure DFT</text>
  <text x="278" y="263" class="small" text-anchor="middle">iJTAG</text>

  <rect x="346" y="225" width="100" height="50" rx="3" fill="#f5f0e8" stroke="#998866" stroke-width="1"/>
  <text x="396" y="247" class="small" text-anchor="middle">DFD</text>
  <text x="396" y="263" class="small" text-anchor="middle">iJTAG</text>

  <rect x="460" y="225" width="100" height="50" rx="3" fill="#f5f0e8" stroke="#998866" stroke-width="1"/>
  <text x="510" y="247" class="small" text-anchor="middle">SMC fabric</text>
  <text x="510" y="263" class="small" text-anchor="middle">JTAG2AXI</text>

  <rect x="574" y="225" width="100" height="50" rx="3" fill="#f5f0e8" stroke="#998866" stroke-width="1"/>
  <text x="624" y="247" class="small" text-anchor="middle">SMC OTP</text>
  <text x="624" y="263" class="small" text-anchor="middle">JTAG2AXIL</text>

  <rect x="688" y="225" width="100" height="50" rx="3" fill="#f5f0e8" stroke="#998866" stroke-width="1"/>
  <text x="738" y="247" class="small" text-anchor="middle">SEP OTP</text>
  <text x="738" y="263" class="small" text-anchor="middle">JTAG2AXIL</text>

  <!-- Drops from horizontal bus to each chain -->
  <line x1="160" y1="215" x2="160" y2="225" stroke="#998866" stroke-width="1" marker-end="url(#arr-r)"/>
  <line x1="278" y1="215" x2="278" y2="225" stroke="#998866" stroke-width="1" marker-end="url(#arr-r)"/>
  <line x1="396" y1="215" x2="396" y2="225" stroke="#998866" stroke-width="1" marker-end="url(#arr-r)"/>
  <line x1="510" y1="215" x2="510" y2="225" stroke="#998866" stroke-width="1" marker-end="url(#arr-r)"/>
  <line x1="624" y1="215" x2="624" y2="225" stroke="#998866" stroke-width="1" marker-end="url(#arr-r)"/>
  <line x1="738" y1="215" x2="738" y2="225" stroke="#998866" stroke-width="1" marker-end="url(#arr-r)"/>

  <!-- REG labels below each chain -->
  <rect x="110" y="285" width="100" height="26" rx="2" fill="#efefef" stroke="#aaaaaa" stroke-width="1"/>
  <text x="160" y="303" class="small" text-anchor="middle">REG</text>
  <rect x="224" y="285" width="108" height="26" rx="2" fill="#efefef" stroke="#aaaaaa" stroke-width="1"/>
  <text x="278" y="303" class="small" text-anchor="middle">REG</text>
  <rect x="346" y="285" width="100" height="26" rx="2" fill="#efefef" stroke="#aaaaaa" stroke-width="1"/>
  <text x="396" y="303" class="small" text-anchor="middle">REG</text>
  <rect x="460" y="285" width="100" height="26" rx="2" fill="#efefef" stroke="#aaaaaa" stroke-width="1"/>
  <text x="510" y="303" class="small" text-anchor="middle">REG</text>
  <rect x="574" y="285" width="100" height="26" rx="2" fill="#efefef" stroke="#aaaaaa" stroke-width="1"/>
  <text x="624" y="303" class="small" text-anchor="middle">REG</text>
  <rect x="688" y="285" width="100" height="26" rx="2" fill="#efefef" stroke="#aaaaaa" stroke-width="1"/>
  <text x="738" y="303" class="small" text-anchor="middle">REG</text>

  <!-- SIB → REG vertical connections -->
  <line x1="160" y1="275" x2="160" y2="285" stroke="#888888" stroke-width="1"/>
  <line x1="278" y1="275" x2="278" y2="285" stroke="#888888" stroke-width="1"/>
  <line x1="396" y1="275" x2="396" y2="285" stroke="#888888" stroke-width="1"/>
  <line x1="510" y1="275" x2="510" y2="285" stroke="#888888" stroke-width="1"/>
  <line x1="624" y1="275" x2="624" y2="285" stroke="#888888" stroke-width="1"/>
  <line x1="738" y1="275" x2="738" y2="285" stroke="#888888" stroke-width="1"/>

  <!-- Serial TDO return: leftmost chain serial-out → PTAP TDO mux -->
  <polyline points="110,311 94,311 94,358 800,358 800,311 788,311"
            fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr-g)"/>
  <text x="450" y="375" class="small" text-anchor="middle">Selected chain REG output feeds PTAP TDO mux; only one chain active per instruction</text>

</svg>
