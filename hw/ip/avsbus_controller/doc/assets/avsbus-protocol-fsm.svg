<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="834" viewBox="0 0 1040 834" role="img" aria-labelledby="title desc">
<title id="title">AVSBus protocol state machine</title>
<desc id="desc">After reset the protocol FSM enters AVS_SLAVE_RESYNC and holds avs_mdata_o high until its resync counter reaches 34. It then launches a frame through AVS_LAUNCH_FRAME_POST_RESYNC when a frame is ready, or waits in AVS_IDLE. From idle a ready frame starts the first subframe; with STOP_AVS_CLOCK_ON_IDLE set, a ready frame returns to the resync instead, as does a due resync while no frame is ready. Each subframe box pairs a SHIFT state that shifts 32 bits with the END state that evaluates them. The first subframe goes to the middle subframe when another frame is ready and to the last subframe otherwise; the middle subframe repeats while frames are ready. The last subframe starts a new first subframe when a frame is ready and otherwise returns to idle. A retry condition in the middle or last subframe, with MAX_RETRIES above zero, enters the retry states: the transmit-and-receive variant after a middle subframe, the transmit variant after a last subframe, both followed by the receive variant. From the receive variant the FSM retries again while retries remain, processes a held reply in AVS_PROCESS_PREVIOUS_SDATA if one is pending, or returns to the resync; processing the held reply either retries it or returns to the resync.</desc>
