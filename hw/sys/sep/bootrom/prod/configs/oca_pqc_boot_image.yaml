# Full SPI image for the SEP boot ROM: the RSA-3072 signed OCA bundle placed at
# both manifest slots the ROM reads.
#
# The bare `oca-classic` pack emits a bundle starting at offset 0; the ROM looks
# for manifests at PRIMARY_MANIFEST_OFFSET / BACKUP_MANIFEST_OFFSET (see
# include/boot_flash.h), so the bootable artefact is this combined image, not the
# bundle. Both slots carry the same bundle, which is what makes the backup path
# and the rotate_update strap testable without a second build.
#
# Layout (classic body is 4096 B, so each payload sits one body past its
# manifest, leaving room to grow before the next slot):
#   0x01000  primary manifest (36864 B)   0x0A000  primary payload
#   0x41000  backup  manifest (36864 B)   0x4A000  backup  payload
manifest_format: oca-combined
name: "OCAH SEP PQC-variant SPI image"

total_size: 0x50000
pad_byte: 0xFF

combos:
  - name: primary
    config: configs/oca_pqc_boot_test.yaml
    manifest_offset: 0x1000
    payload_offset: 0xA000

  - name: backup
    config: configs/oca_pqc_boot_test.yaml
    manifest_offset: 0x41000
    payload_offset: 0x4A000
