# OCAH SEP Non-Secure Boot Test — manifest config for tt-boot-manifest.
#
# Produces an unsigned SPI image: secure_boot 0, signature_type 0, no signing
# key.

meta:
  disable_checks: true

# BL1 executes from SEP ICCM, so the packer must validate the BL1 entry point
# against ICCM's window rather than its default.
platform:
  sep_iram_base: 0xC0000000
  sep_iram_size: 0x00040000

primary:
  manifest:
    description: "OCAH SEP non-secure boot test"
    timestamp: 946702799
    content_version:
      major: 1
      minor: 0
      patch: 0
    boot_arguments:
      secure_boot: 0
      BL2_demotion: 0
      payload_offset: 0x1000
      use_ext_sram: 0
    signature_type: 0  # No signature
    signing_authority: "local"
    signing_key_name: "none"
    signing_key_id: "0"
    signing_key_file: "$ROOT/tests/signing_keys/rsa_private_key.dev0.pem"
    public_key_sel:
      selection: 0
      rom_key_index: 0
    usage_constraints:
      selectors:
        chiplet_id: 0b00000000
        package_id: 0b00000000
        life_cycle_states: 0
        BL1_demotion: 0
      chiplet_id: [0xa5a5a5a5, 0xa5a5a5a5, 0xa5a5a5a5, 0xa5a5a5a5, 0xa5a5a5a5, 0xa5a5a5a5, 0xa5a5a5a5, 0xa5a5a5a5]
      package_id: [0xa5a5a5a5, 0xa5a5a5a5, 0xa5a5a5a5, 0xa5a5a5a5, 0xa5a5a5a5, 0xa5a5a5a5, 0xa5a5a5a5, 0xa5a5a5a5]
      life_cycle_states: 0x7
      BL1_demotion: 0
    encrypted_payload: 0
    encryption_type: 1
    encryption_iv: "00112233445566778899aabbccddeeff"
    encryption_key_input: "9BA9BD532A50BD4DA008B20E1D1FE05400000000000000000000000000000000"
    encryption_kdf_input: "ffeeddccbbaa99887766554433221100c0c1c2c3c4c5c6c7c8c9cacbcccdcecf"
    encryption_derived_key: "a6a3a5b9ae7a9e141484ab2ba268cb41"
    manifest_identifier: 0x314c4254  # "TBL1"
    manifest_version_major: 1
    manifest_version_minor: 0
    security_version: 0
    security_version_update: 0
  toc:
    version_major: 1
    version_minor: 0
  payload_images:
    - load_addr: 0xC0000000  # SEP ICCM base (IFU fetches BL1 here)
      type: 'SEPBL1'
      version: 1
      offset: 0x1000
      description: "OCAH SEP BL1 test (bl1_pass_test)"
      entry_point: 0xC0000000  # equals sep_iram_base, so the packed offset is 0
      file_path: "$OCH_ROOT/fw/tests/bl1_pass_test/build/bl1_pass_test.bin"
  spi:
    description: "SPI TLV for OCAH SEP (keep_default_init)"
    flags:
      keep_default_init: 1
    spi_freq: 25
    spi_dll_margin_rom: 0x00
    spi_dll_margin_tlv: 0x00
    discovery_ctrl: 0x00000480
    dq_timing: 0x00000101
    dqs_timing: 0x00000404
    gate_lpbk: 0x00280030
    dll_slave: 0x00003311
    dll_master: 0x00140058
    misc: 0x00000001
    rb_valid_time: 0x00002710

