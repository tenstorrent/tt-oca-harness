version = 1

[[views]]
name = "sep-cpu-logical"
title = "SEP CPU Logical Address Space"
columns = ["base", "end", "size", "label", "description"]

[[views.rows]]
kind = "region"
label = "External"
base = 0x00000000
size = 0x10000000
description = "External to the chiplet but outside SMU."

[[views.rows]]
kind = "region"
label = "SEP Local"
base = 0x10000000
size = 0x10000000
description = "Direct SEP-local resources."

[[views.rows]]
kind = "region"
label = "SEP External"
base = 0x20000000
size = 0x20000000
description = "Reserved adopter extension aperture."

[[views.rows]]
kind = "region"
label = "SMC"
base = 0x40000000
size = 0x40000000
description = "SMC resources."

[[views.rows]]
kind = "region"
label = "SMU"
base = 0x80000000
size = 0x40000000
description = "SMU resources, including DTP."

[[views.rows]]
kind = "region"
label = "SEP CPU Resources"
base = 0xC0000000
size = 0x10000000
description = "EL2 ICCM, DCCM, and interrupt-controller resources."

[[views.rows]]
kind = "alias"
key = "sep-local-alias"
label = "SEP Local Alias"
base = 0xD0000000
size = 0x30000000
description = "CPU-local alias of the direct 0x10000000–0x3FFFFFFF range."

[[views]]
name = "sep-cpu-resources"
title = "SEP EL2 CPU Resources"
derive_gaps = true
bounds_start = 0xC0000000
bounds_end = 0xD0000000
columns = ["base", "end", "size", "label", "description"]

[[views.rows]]
selector = "sep_iccm"
label = "ICCM"
expected_address = 0xC0000000
expected_kind = "mem"

[[views.rows]]
selector = "sep_dccm"
label = "DCCM"
expected_address = 0xC0040000
expected_kind = "mem"

[[views.rows]]
selector = "pic"
label = "PIC"
aperture_size = 0x8000
expected_address = 0xC0080000
expected_kind = "addrmap"

[[views]]
name = "sep-components"
title = "SEP Component Address Map"
include_all = true
columns = ["base", "end", "size", "occupied_size", "label", "description"]

[[views.rows]]
selector = "sep_boot_rom"
description = "BL0 immutable instruction memory."
expected_address = 0x10040000
