# SPDX-License-Identifier: Apache-2.0
#
# SEP OSS simulation config (native build/filelist manifest).
# DUT = `sep_wrapper` (the bare `sep` core plus its IP integration); vendor-clean
# by construction (bender_targets deliberately exclude "simulation").

schema_version = 1

# Launch entry: selected by `--dut sep`. Two run modes: no_cpu, where a cocotbext-axi
# AxiMaster drives the CPU LSU bus (the stub is its sole driver) to exercise the SEP
# register/fabric map, and cpu, where VeeR EL2 boots firmware. The shared stage
# graph + tool list come from profile = "native" (Verilator is the verified OSS backend).
name = "sep"
profile = "native"
description = "SEP (Security Processor) OSS cocotb DV flow (no_cpu AXI + cpu firmware boot)"
# Verilator remains the pre-merge acceptance backend. VCS/Xcelium are supported by
# the native cocotb runner for development iteration and share the same OSS-safe
# filelist/stub injection.
default_tool = "verilator"
tools = ["verilator", "xcelium", "vcs"]

[testlist]
path = "testlists/all.toml"
format = "toml_list"

# The vendored adams_bridge abr_reg has two immediate assertions on
# external_wr_ack / external_rd_ack (abr_reg.sv). They fire once at t=0 fs,
# before reset releases, because the ack strobes are still X and an X fails
# `assert(!ack || ...)`. Benign X-init in third-party IP whose datapath OSS DV
# does not exercise.
#
# They live in the POST-reset branch of an always_ff, so they are REAL runtime
# protocol checks -- waiving them by file:line alone would also hide a genuine
# runtime violation. Two patterns are therefore needed, and they work as a pair:
#
#   ignore    -- drops the "Error:" line, which VCS prints WITHOUT a timestamp.
#   hard-fail -- the companion line DOES carry the timestamp
#                ("...abr_reg.sv", 67: ...: started at 0fs failed at 0 fs).
#                Matching "failed at <non-zero>" turns any post-time-0 firing of
#                those exact assertions back into a hard failure.
#
# So the t=0 X-init noise is waived and nothing else is: a real runtime abr_reg
# violation still fails the run, loudly, on the timestamped line.
#
# ($assertoff in the TB does not work here -- it races the always_ff's own
# time-0 evaluation and the assertion fires first.)
[pass_fail]
extra_ignore_patterns = [
  'abr_reg\.sv.*at time 0',
  'abr_reg\.sv", (67|69):',
]
extra_hard_fail_patterns = [
  'abr_reg\.sv", (67|69):.*failed at [1-9]',
]

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "hw/sys/sep/dv/build"]

[build]
# Native build is driven by the Bender/filelist keys below; .core files are external-only.
top_module = "sep_uvm_top"
top_file = "hw/sys/sep/dv/tb/tb_top.sv"
# Extra tb sources compiled alongside tb_top: the outbound mailbox console/PASS
# monitor. The sep_wrapper DUT, its IP-integration models, and the eFuse
# models come from the Bender closure (`sep_wrapper` plus the `any(sep, smc)`
# groups). Excluded for OSS hygiene: proprietary IPs in nonfree. The wrapper
# SPI uses struct ports; the pad-mux shim is not in this filelist.
sources = [
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_regs.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_mul.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_fast_mul.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_div.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_axi_adapter.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_axi.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_wb.sv",
  "hw/sys/sep/dv/tb/sep_outbound_mbx.sv",
  # Clean-room AXI4 protocol checker, instantiated on the m_axi and s_axi
  # buses at the foot of tb_top. Assertion bodies are guarded by
  # OCAH_INC_ASSERT, which Verilator does not define, so it elaborates to an
  # empty module there and the rules are live only under VCS.
  "hw/common/dv/vip/ocah_axi_vip/sva/ocah_axi_sva.sv",
  # After bender flist so abr_wrapper_key_reg_pkg is already declared (see exclude_files).
  "hw/sys/sep/dv/shims/crypto/abr_wrapper_key_reg_stub.sv",
]
# PeakRDL abr_wrapper_key_reg miscompiles under Verilator 5.046 (nested-struct
# aggregate / hwif_in tied-'0 fold -> missing __PVT__MLKEM_SHARED_KEY). Drop the
# generated block from every target's bender flist; the stub above replaces it.
# A `--cov` compile (`VM_COVERAGE=1`) hits the same error on 5.046; 5.050
# compiles. Package files (*_reg_pkg.sv) stay — substring match is on this
# exact basename.
exclude_files = [
  "hw/ip/key_manager/regs/gen/sv/abr_wrapper_key_reg.sv",
]
# `stubs` are Verilator/VCS-compat overrides, listed ahead of
# the bender filelist so -Wno-MODDUP "first definition wins" selects them. prim_sync2 retargets
# the public prim_flop_2sync (it imports NO packages, so prepending it is safe).
#
# The sep_cpu stub is NOT prepended: it imports DUT packages (sep_pkg/el2_pkg) that are declared
# only inside the bender filelist, so a prepended copy would reference them before declaration.
# Instead the CPU-stub targets exclude the real hw/sys/sep/rtl/sep_cpu.sv from the bender filelist (via a
# per-target `exclude_files`) and append shims/cpu/sep_cpu_stub.sv through their `sources` list,
# where every DUT package is already declared. The stub is then the single sep_cpu definition (no
# MODDUP), and the full-CPU `default` target keeps the real sep_cpu untouched.
stubs = [
  "hw/sys/sep/dv/shims/prim/prim_sync2.sv",
  "hw/sys/sep/dv/shims/analog/entropy_ring_oscillator.sv",
]
filelist = "hw/sys/sep/dv/build/sep_dut_compile.f"
bender_filelist = "hw/sys/sep/dv/build/sep_bender.f"
work_dir = "hw/sys/sep/dv/build"
# Vendor-clean target set (verify with check_no_vendor_paths.py).
# NEVER add "simulation" — it pulls licensed I/O and a foundry padring (51 violations).
common_bender_targets = [
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "register_interface_l1",
]
# `sep_wrapper` adds hw/top/sep_{wrapper,ip_integration}.sv plus the vendored
# prim_ram_1p/prim_ram_1p_adv/prim_rom memory models the IP integration needs.
bender_targets = ["sep", "sep_el2", "sep_wrapper"]
# hw/common/assert carries ocah_assert.svh, included by the AXI protocol SVA.
incdirs = ["hw/sys/sep/dv/tb", "hw/common/assert"]

[build.options]
# SEP is a large cold build (VeeR EL2 + OTBN + full crypto). Parallelize the
# Verilator + C++ compile and split codegen into many TUs so g++ runs concurrently.
#
# Partition the build dir by input fingerprint so the two daily targets
# (default / lsu_stub_all_live) coexist instead of clobbering one shared model on
# every target switch. Each unchanged target then reuses its build; only a config
# or source change rebuilds it.
cache_enabled = true

[build.verilator]
# Keep the inherited output_split = 0 default. The SEP model's root header is ~25 MB and is included
# by every C++ TU, so fewer/larger TUs build faster than many small ones for this DUT.
ccache = true
# Replace cocotb's global --public-flat-rw with a scoped Verilator public config that exposes only
# the tb top (sep_uvm_top) to cocotb. Global public marks every signal public, which disables the
# AXI fabric split_var pragmas (rr_arb_tree/lzc/axi_demux) -> ~951 false combinational SCCs and a
# multi-million-entry ICO settle region that wedges Verilator. Scoping to the tb top keeps the fabric
# optimisable (SCCs -> ~61, model runs instead of wedging). The runner integration drops the global
# flag and injects this file; see runlib cocotb_public_scope().
public_scope = "hw/sys/sep/dv/sep_public_scope.vlt"
# Disable Verilator's DFG (data-flow-graph) optimisation pass. The eFuse AXI-Lite
# write path (efuse_interface_controller -> prim_axi_lite_to_apb_single ->
# axi_lite_to_apb) carries a circular combinational ready/valid loop on the APB
# response (apb_resp_i). With DFG enabled, the optimiser folds the loop signals and
# the optimised build settles the OTP-program register write to a hung fixed point:
# the AXI B-response for the EFUSE_PROGRAM_CTRL write never returns and the test
# wedges (reads converge, only the write deadlocks). A --trace build keeps those
# signals (so it cannot fold them) and runs fine, which is the tell that this is an
# optimiser convergence artifact, not RTL: the same write completes on VCS.
# -fno-dfg only disables an optimisation, so it can never make logic less correct;
# it lets the write-path loop settle to the same fixed point VCS/trace reach.
extra_args = ["-fno-dfg"]

[coverage.vcs]
# Restate the simulator defaults (`-cm`, `-cm_dir`) because a DUT table replaces
# the list rather than appending to it, then add the scope file.
#
# VCS-only because only this table applies the compile-time scope. A `--cov`
# run on another simulator grades an unscoped denominator. Coverage runs take
# `--target default` (one full-CPU elaboration; no_cpu force-splices the LSU
# VIP). Edit `sep_cov_scope.hier` then `--rebuild` -- the file is not
# fingerprinted.
#
# Scope has to be applied at COMPILE time. `urg -hier` prunes the report pages
# but still computes the headline score over the whole database, so the only way
# to keep the testbench out of the number is to keep it out of the database:
# `-cm_hier` limits what gets instrumented. That also shrinks the per-leaf
# databases and the sim time.
#
# The per-leaf dump is the inherited `[vcs.coverage_defaults].sim_args`
# (`-cm` + `-cm_dir {cov_dir}/simv.vdb`). Do not restate it here: an identical
# list is a deprecated duplicate and the runner refuses the config.
compile_args = [
  "-cm",
  "line+cond+tgl+fsm+branch+assert",
  "-cm_dir",
  "{build_cov_dir}",
  "-cm_hier",
  "{repo_root}/hw/sys/sep/dv/cov/config/vcs/sep_cov_scope.hier",
  # Extends the SAME scope file from code coverage to assertion coverage.
  # `-cm_hier` alone governs line/cond/fsm/tgl/branch only, so without this the
  # excluded hierarchy is gone from the code metrics but still graded for
  # assertions -- measured on the merged database: sep_cpu, u_m_axi_sva and
  # u_s_axi_sva each reported an ASSERT score with every code column `--`.
  # `-cm_common_hier` is a Limited Customer Availability feature; VCS refuses the
  # compile without `-lca` ("The '-cm_common_hier' flow requires a special
  # option"). No extra licence is needed -- only the opt-in switch.
  "-lca",
  "-cm_common_hier",
]

# Records the measured toggle-instrumentation cost so a future Verilator
# coverage flow does not rediscover it. That run needs its own scope story
# before its number is quotable.
[coverage.verilator]
# Not the graded number. Only [coverage.vcs] applies the compile-time scope.
# `--cov --tool verilator` fails C++ compile on 5.046 (`__PVT__MLKEM_SHARED_KEY`
# under `VM_COVERAGE=1`); 5.050 compiles.
# Toggle stays off: on this model it is ~95% of the database (~0.5 GB per leaf)
# and the costliest sim instrumentation. Replaces the simulator-default
# `--coverage`.
# --output-groups 0 compiles the generated .cpp files one by one instead of
# in --build-jobs groups. Verilator groups by file count, and on a
# coverage-instrumented model one group can become a translation unit of
# several hundred MB that a hosted runner cannot compile (measured on SMC).
build_args = ["--coverage-line", "--coverage-expr", "--coverage-user", "--output-groups", "0"]

[frameworks.cocotb]
# Flow-first layout: cocotb env/seq_lib/tests live under cocotb/ (room for a
# future uvm/ sibling). python_root puts env/ + seq_lib/ on the import path.
python_root = "hw/sys/sep/dv/cocotb"
test_dir = "hw/sys/sep/dv/cocotb/tests"
# Shared cocotb VIP (ocah_spi_vip, ocah_axi_vip, ...) lives at hw/common/dv/vip;
# add it to the import path so tests can `from ocah_spi_vip import OcahSpiFlash`.
python_paths = [
  "hw/common/dv/vip",
  # env/ on the path so env golden models can import siblings by bare name
  # (e.g. sep_entropy_golden -> sep_noise_golden) and keep standalone self-tests.
  "hw/sys/sep/dv/cocotb/env",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

[c_build.default]
# EL2 firmware images are generated by the runlib c_compile stage and consumed by
# CPU boot tests through sep_base_test.boot_firmware(). The build goes through the
# shared DV firmware engine (hw/common/dv/fw/compile.mk, driven by fw/fw.mk), which
# emits the gitignored .itcm/.dtcm hex images under fw/build/tests/<target>/ from
# tracked test/driver source.
#
# Toolchain resolution, in order: an explicit RISCV_TOOLCHAIN/RISCV_PREFIX from the
# environment wins; then the project container's riscv-gnu-toolchain; then a local
# xPack riscv-none-elf install (the macOS/Verilator-only route). NOTE: argv goes
# through str.format() for {fw_target}, and the runlib additionally REJECTS any
# other placeholder -- including a doubled ${{...}} -- so shell brace expansion is
# unavailable here. Concatenate with quoting instead: "$RV_PFX"gcc.
#
# RISCV_TOOLCHAIN + RISCV_PREFIX is the ONLY toolchain contract the shared engine
# accepts (hw/common/dv/fw/compile.mk); do not invent per-tool RISCV_GCC/_NM vars.
# When RISCV_TOOLCHAIN is given without RISCV_PREFIX we still probe the directory
# for both tool names, because the auto-detect loop that would have picked the
# right prefix is skipped in that case -- otherwise pointing RISCV_TOOLCHAIN at an
# xPack install would silently fall back to the riscv64-unknown-elf- prefix.
#
# PICOLIBC IS THE REAL GATE, and it is why this stage falls back to docker-run.sh.
# compile.mk builds with --specs=picolibc.specs, and the site riscv-gnu-toolchain
# installs have no picolibc -- so a resolved toolchain is NOT sufficient. We probe
# for picolibc.specs and, when it is absent, re-run the same make via
# scripts/docker-run.sh (container, or bubblewrap when OCAH_TOOLCHAIN_ROOTFS is
# set). Use `run-here`, not `run`: `run` remaps the repo to /work, so
# OCAH_ROOT="$PWD" does not resolve inside the container. `run-here` mounts 1:1
# at the host path and keeps the caller's cwd, matching the bwrap backend.
# Unset RISCV_TOOLCHAIN/RISCV_PREFIX on that fallback:
# run.sh points them at the host gcc (no picolibc), and that path is not inside
# the sandbox -- compile.mk must use the image gcc on PATH. A bare clone without
# picolibc still gets a working firmware image this way; the sim itself only
# needs the .hex.
cwd = "."
argv = [
  "bash",
  "-lc",
  "set -e; RV_TC=\"$RISCV_TOOLCHAIN\"; RV_PFX=\"$RISCV_PREFIX\"; if [ -z \"$RV_TC\" ]; then for c in /tools_soc/opensrc/riscv-gnu-toolchain/2025.01.20-rhel-8.10/bin \"$HOME\"/.local/opt/xpack-riscv-none-elf-gcc-*/bin; do if [ -x \"$c/riscv64-unknown-elf-gcc\" ]; then RV_TC=\"$c\"; RV_PFX=riscv64-unknown-elf-; break; fi; if [ -x \"$c/riscv-none-elf-gcc\" ]; then RV_TC=\"$c\"; RV_PFX=riscv-none-elf-; break; fi; done; fi; if [ -z \"$RV_PFX\" ]; then RV_PFX=riscv64-unknown-elf-; if [ -n \"$RV_TC\" ] && [ ! -x \"$RV_TC/riscv64-unknown-elf-gcc\" ] && [ -x \"$RV_TC/riscv-none-elf-gcc\" ]; then RV_PFX=riscv-none-elf-; fi; fi; MK=\"dv-fw-tests TEST={fw_target}\"; if [ -n \"$RV_TC\" ] && \"$RV_TC/$RV_PFX\"gcc -specs=picolibc.specs -E - </dev/null >/dev/null 2>&1; then exec make -C hw/sys/sep/dv/fw -f fw.mk $MK OCAH_ROOT=\"$PWD\" RISCV_TOOLCHAIN=\"$RV_TC\" RISCV_PREFIX=\"$RV_PFX\"; elif [ -x scripts/docker-run.sh ]; then echo \"[c_compile] host toolchain has no picolibc; building in the OCAH toolchain container\"; exec env -u RISCV_TOOLCHAIN -u RISCV_PREFIX ./scripts/docker-run.sh run-here make -C hw/sys/sep/dv/fw -f fw.mk $MK OCAH_ROOT=\"$PWD\"; else echo \"error: no picolibc-enabled RISC-V toolchain and no scripts/docker-run.sh\" >&2; exit 1; fi",
]
outputs = [
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.dtcm.hex",
  # ELF + nm listing (same link, produced unconditionally by compile.mk): the
  # CPU trace monitor symbolizes retired PCs from the .sym, and staging both
  # keeps sim-only reruns and post-mortem symbolization hermetic in the run dir.
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.tcm.elf",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.tcm.sym",
]

[c_build.boot_rom]
# The SEP Boot ROM (hw/sys/sep/bootrom/prod) is NOT built by the shared firmware
# engine -- it drives its own Makefile, links to ROM_BASE instead of the TCMs, and
# additionally packs a manifest+BL1 image. Tests select it with
# `firmware = { name = "boot_rom", mode = "boot_rom" }`, which is what makes
# `--stage sim` fail loudly with "firmware outputs missing" instead of silently
# simulating against a stale or absent image. The ROM lands in build/; the
# CPU-PIO variant builds into build_pio/ from the Makefile's
# pio-toolchain-images target, so this template only owns the host-vs-container
# decision.
#
# Two halves, split by TOOL dependency, so they cannot collapse into one command:
#   toolchain-images  needs the RISC-V toolchain WITH picolibc (the generated
#                     register headers close their packing checks with
#                     static_assert, i.e. <assert.h>, which is not freestanding).
#   pack-images       is pure Python and must run on the HOST: the packer's deps
#                     come from the tt-boot-manifest submodule's pyproject.toml
#                     via uv, and the ocah-toolchain image carries neither.
#
# Toolchain resolution and the picolibc probe are deliberately identical to
# [c_build.default] above -- see that block for why the probe (not mere toolchain
# presence) is the real gate. GCC_PREFIX differs from the engine's RISCV_PREFIX:
# this Makefile spells `$(GCC_PREFIX)-gcc`, so the value carries no trailing dash.
# Passing it as a full path prefix keeps PATH untouched. Make propagates
# command-line variables to sub-makes, so the recursive OTBN-app and bl1_pass_test
# builds inherit the same toolchain. The same toolchain probe is duplicated in
# four argv blocks; a fix must be applied in all four.
#
# NOTE: as in [c_build.default], argv goes through str.format() and the runlib
# rejects every placeholder except {fw_target} -- braces of any kind, including
# shell ${...} expansion, are unavailable here. Use "$VAR" and $(...) instead.
#
# pack-images writes the packed flash images into build/ alongside this ROM. They
# are drain-method-agnostic, so the build_pio/ variant reads the same copy.
# non_secure_boot.bin is the raw image the cocotb flash BFM preloads.
#
# NONFREE_ROOT= is load-bearing, not tidiness. reg_includes.mk puts the nonfree
# register headers on the include path whenever a nonfree/ checkout exists.
# The open-tree ROM must not compile against those headers: a workspace that
# has both would otherwise pick up nonfree symbols the pure-open DUT does not
# implement. Forcing NONFREE_ROOT= keeps the ROM image matched to this DUT.
#
# NONFREE_BOOTCODE_SOURCES= is load-bearing for the same reason, and separately:
# the ROM Makefile takes it with ?=, so a companion-supplied value in the
# environment survives NONFREE_ROOT= and links a driver for hardware outside this
# DUT. The SPI pad mux is the case that bites -- its store lands in an
# unimplemented sep_external aperture, the bus error raises NMI, and the CPU
# leaves the boot flow through the reset NMI vector in ICCM. Clearing both keeps
# the linked bootcode to what the open DUT implements.
# DCCM_SCRUB_BYTES is left at the product default (0x20000, matching vector.S's
# own #ifndef fallback). vector.S scrubs all 128KiB of DCCM before the C runtime
# starts, and because a store writes its ECC, that scrub is what establishes
# DCCM's ECC state -- on silicon, where DCCM powers up with random contents and
# random ECC, and here.
#
# This variant used to override it to 0 and let the testbench's backdoor TCM load
# supply ECC instead (tb_top.sv writes bd_riscv_ecc32 alongside every preloaded
# word), on the grounds that the scrub then bought no coverage. Two reasons that
# is no longer done: it substitutes the testbench for firmware on a step the
# firmware owns, and it masked the ROM's own check -- the preload put the correct
# g_data_init value into DCCM, which is exactly what
# rom_check_runtime_init_or_fail() reads to prove vector.S's .data copy ran, so a
# broken copy loop would still have passed.
#
# The scrub costs 2047 cycles on sep_rom_non_secure_boot_test (923653 with it vs
# 921606 without, same test and ROM), i.e. 0.22%. An earlier version of this
# comment claimed ~3.9x wall clock; that figure never reconciled with observed
# run times and was wrong.
cwd = "."
argv = [
  "bash",
  "-lc",
  "set -e; RV_TC=\"$RISCV_TOOLCHAIN\"; RV_PFX=\"$RISCV_PREFIX\"; if [ -z \"$RV_TC\" ]; then for c in /tools_soc/opensrc/riscv-gnu-toolchain/2025.01.20-rhel-8.10/bin \"$HOME\"/.local/opt/xpack-riscv-none-elf-gcc-*/bin; do if [ -x \"$c/riscv64-unknown-elf-gcc\" ]; then RV_TC=\"$c\"; RV_PFX=riscv64-unknown-elf-; break; fi; if [ -x \"$c/riscv-none-elf-gcc\" ]; then RV_TC=\"$c\"; RV_PFX=riscv-none-elf-; break; fi; done; fi; if [ -z \"$RV_PFX\" ]; then RV_PFX=riscv64-unknown-elf-; if [ -n \"$RV_TC\" ] && [ ! -x \"$RV_TC/riscv64-unknown-elf-gcc\" ] && [ -x \"$RV_TC/riscv-none-elf-gcc\" ]; then RV_PFX=riscv-none-elf-; fi; fi; ROM_DIR=hw/sys/sep/bootrom/prod; if [ -n \"$RV_TC\" ] && \"$RV_TC/$RV_PFX\"gcc -specs=picolibc.specs -E - </dev/null >/dev/null 2>&1; then GCC_P=$(printf %s \"$RV_PFX\" | sed 's/-$//'); make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= toolchain-images GCC_PREFIX=\"$RV_TC/$GCC_P\" RISCV_TOOLCHAIN=\"$RV_TC\" RISCV_PREFIX=\"$RV_PFX\"; elif [ -x scripts/docker-run.sh ]; then echo \"[c_compile] host toolchain has no picolibc; building the boot ROM in the OCAH toolchain container\"; env -u RISCV_TOOLCHAIN -u RISCV_PREFIX ./scripts/docker-run.sh run-here make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= toolchain-images; else echo \"error: no picolibc-enabled RISC-V toolchain and no scripts/docker-run.sh\" >&2; exit 1; fi; make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= pack-images secure_boot_spi encrypted_boot_spi decrypt_negative_images",
]
outputs = [
  "hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "hw/sys/sep/bootrom/prod/build/boot_rom.itcm.hex",
  "hw/sys/sep/bootrom/prod/build/boot_rom.dtcm.hex",
  # nm listing for the CPU trace monitor's ROM-PC symbolization.
  "hw/sys/sep/bootrom/prod/build/boot_rom.sym",
  "hw/sys/sep/bootrom/prod/build/non_secure_boot.bin",
  "hw/sys/sep/bootrom/prod/build/secure_boot.bin",
  # The SMC-SRAM staged image, produced by the same `pack-images` rule as the two
  # .bin files above. Declared because sep_boot_recovery_test passes it as
  # +sep_smc_mem_hex, and an undeclared input would let `--stage sim` start and
  # then die inside $readmemh instead of failing the output check.
  "hw/sys/sep/bootrom/prod/build/smc_mem.hex",
  # The three decryption-negative images, each the encrypted config plus one
  # override. Declared for the same reason: a missing image would otherwise
  # surface as an unexplained SPI flash of erased bytes mid-run.
  "hw/sys/sep/bootrom/prod/build/invalid_class_key.bin",
  "hw/sys/sep/bootrom/prod/build/invalid_encryption_iv.bin",
  "hw/sys/sep/bootrom/prod/build/invalid_kdf_input.bin",
]

[c_build.boot_rom_pio]
# The OT-transport Boot ROM again, but with the RX FIFO drained by CPU programmed
# I/O instead of the SECURE_DMA handshake (BOOT_OT_SPI_USE_PIO=1 -> build_pio/).
# boot_flash.h resolves the drain at compile time, so this is a genuinely separate
# binary: build_pio/boot_rom.elf does not even link ot_spi_flash_read_dma.
#
# Everything else -- toolchain probe, container fallback, NONFREE_ROOT= and the
# no-braces argv constraint -- is character-for-character [c_build.boot_rom].
# See that block for why each part is the way it is.
#
# Only `pack-images` here, no `secure_boot_spi`: the PIO test boots the unsigned
# image, and the signed one is the DMA variant's business. The packed bytes are
# drain-agnostic and land in the shared build/, so this does not rebuild them.
#
# The same toolchain probe is duplicated in four argv blocks; a fix must be
# applied in all four. Folding it into a script under tools/dv/ would also
# retire the no-braces constraint.
# DCCM_SCRUB_BYTES is left at the product default, as in every boot_rom variant.
# See [c_build.boot_rom] for why the testbench no longer supplies DCCM's ECC
# in place of vector.S's scrub.
cwd = "."
argv = [
  "bash",
  "-lc",
  "set -e; RV_TC=\"$RISCV_TOOLCHAIN\"; RV_PFX=\"$RISCV_PREFIX\"; if [ -z \"$RV_TC\" ]; then for c in /tools_soc/opensrc/riscv-gnu-toolchain/2025.01.20-rhel-8.10/bin \"$HOME\"/.local/opt/xpack-riscv-none-elf-gcc-*/bin; do if [ -x \"$c/riscv64-unknown-elf-gcc\" ]; then RV_TC=\"$c\"; RV_PFX=riscv64-unknown-elf-; break; fi; if [ -x \"$c/riscv-none-elf-gcc\" ]; then RV_TC=\"$c\"; RV_PFX=riscv-none-elf-; break; fi; done; fi; if [ -z \"$RV_PFX\" ]; then RV_PFX=riscv64-unknown-elf-; if [ -n \"$RV_TC\" ] && [ ! -x \"$RV_TC/riscv64-unknown-elf-gcc\" ] && [ -x \"$RV_TC/riscv-none-elf-gcc\" ]; then RV_PFX=riscv-none-elf-; fi; fi; ROM_DIR=hw/sys/sep/bootrom/prod; if [ -n \"$RV_TC\" ] && \"$RV_TC/$RV_PFX\"gcc -specs=picolibc.specs -E - </dev/null >/dev/null 2>&1; then GCC_P=$(printf %s \"$RV_PFX\" | sed 's/-$//'); make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= pio-toolchain-images GCC_PREFIX=\"$RV_TC/$GCC_P\" RISCV_TOOLCHAIN=\"$RV_TC\" RISCV_PREFIX=\"$RV_PFX\"; elif [ -x scripts/docker-run.sh ]; then echo \"[c_compile] host toolchain has no picolibc; building the CPU-PIO boot ROM in the OCAH toolchain container\"; env -u RISCV_TOOLCHAIN -u RISCV_PREFIX ./scripts/docker-run.sh run-here make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= pio-toolchain-images; else echo \"error: no picolibc-enabled RISC-V toolchain and no scripts/docker-run.sh\" >&2; exit 1; fi; make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= pack-images",
]
outputs = [
  "hw/sys/sep/bootrom/prod/build_pio/boot_rom.vmem",
  "hw/sys/sep/bootrom/prod/build_pio/boot_rom.itcm.hex",
  "hw/sys/sep/bootrom/prod/build_pio/boot_rom.dtcm.hex",
  # nm listing for the CPU trace monitor's ROM-PC symbolization.
  "hw/sys/sep/bootrom/prod/build_pio/boot_rom.sym",
  "hw/sys/sep/bootrom/prod/build/non_secure_boot.bin",
]

[c_build.km_rom_main]
# Production Key Manager ROM (hw/ip/key_manager/dv/fw production/rom_main).
# Not [c_build.default]: that template builds SEP EL2 TCM images via
# hw/sys/sep/dv/fw. rom_main is rv32emc KM firmware, and it must be built with
# ROM_KM_BOOT_WIPE_DEFAULT=0 / ROM_KM_UNREC_WIPE_DEFAULT=0 -- a default KM build
# wipes SRAM at boot and halts before RESP_KM_READY. Those defines live in
# cocotb/tests/km_fw/Makefile (stamp-guarded so a stale rom_boot.o cannot
# silently re-enable the wipe), so argv drives that target rather than fw.mk
# directly.
#
# Tests select it with `firmware = { name = "rom_main", mode = "km_rom_main" }`.
# Both keys are required: mode selects this block, and the declared output is
# what makes `--stage sim` fail with "firmware outputs missing" instead of
# loading an empty KM ROM. The plusarg stays `+km_rom_hex=rom_main.rom.parhex`;
# c_compile stages the basename into the sim CWD.
#
# The gitignored parhex is the built artifact. Do not commit it. The C source
# is tracked under hw/ip/key_manager/dv/fw.
#
# Toolchain: $RISCV_TOOLCHAIN if set, else a local xPack install, else the
# OCAH container via scripts/docker-run.sh. This block does not probe a
# site toolchain path. argv goes through str.format() and rejects every
# placeholder except {fw_target}, so use "$VAR" and $(...), never shell ${...}.
cwd = "."
argv = [
  "bash",
  "-lc",
  "set -e; RV_TC=\"$RISCV_TOOLCHAIN\"; RV_PFX=\"$RISCV_PREFIX\"; if [ -z \"$RV_TC\" ]; then for c in \"$HOME\"/.local/opt/xpack-riscv-none-elf-gcc-*/bin; do if [ -x \"$c/riscv64-unknown-elf-gcc\" ]; then RV_TC=\"$c\"; RV_PFX=riscv64-unknown-elf-; break; fi; if [ -x \"$c/riscv-none-elf-gcc\" ]; then RV_TC=\"$c\"; RV_PFX=riscv-none-elf-; break; fi; done; fi; if [ -z \"$RV_PFX\" ]; then RV_PFX=riscv64-unknown-elf-; if [ -n \"$RV_TC\" ] && [ ! -x \"$RV_TC/riscv64-unknown-elf-gcc\" ] && [ -x \"$RV_TC/riscv-none-elf-gcc\" ]; then RV_PFX=riscv-none-elf-; fi; fi; KM_FW=hw/sys/sep/dv/cocotb/tests/km_fw; if [ -n \"$RV_TC\" ] && \"$RV_TC/$RV_PFX\"gcc -specs=picolibc.specs -E - </dev/null >/dev/null 2>&1; then make -C \"$KM_FW\" rom_main RISCV_TOOLCHAIN=\"$RV_TC\" RISCV_PREFIX=\"$RV_PFX\"; elif [ -x scripts/docker-run.sh ]; then echo \"[c_compile] host toolchain has no picolibc; building KM rom_main in the OCAH toolchain container\"; env -u RISCV_TOOLCHAIN -u RISCV_PREFIX ./scripts/docker-run.sh run-here make -C \"$KM_FW\" rom_main; else echo \"error: no picolibc-enabled RISC-V toolchain and no scripts/docker-run.sh\" >&2; exit 1; fi",
]
outputs = [
  "hw/sys/sep/dv/cocotb/tests/rom_main.rom.parhex",
]

[defaults]
run_mode = "no_cpu"

[run_modes.no_cpu]
description = "CPU held off: cocotb AXI driver owns the CPU LSU splice"
timeout_sec = 1800
args = []

[run_modes.cpu]
description = "CPU firmware boot: VeeR EL2 owns its master buses and fetches firmware from TCM"
# CPU firmware sims need a longer wall-clock budget than no_cpu smoke.
# Per-test timeout_sec overrides this fallback where set.
timeout_sec = 3600
args = ["+cpu_boot"]

# One [targets.<name>] merges the former [compile_targets]/[run_targets] split.
# Tool-specific flags live under [targets.<name>.tools.<tool>].
# cocotb's runner forces a global --public-flat-rw. The runlib cocotb_public_scope() integration
# drops it and substitutes the scoped public config in `public_scope` above, because cocotb only
# needs the top-level sep_uvm_top ports (clocks/reset/boot controls + the flat s_axi_* bus); the
# CPU-LSU splice is SV-side inside tb_top (the no_cpu stub drives lsu_axi_req from lsu_req_drive;
# the LSU response is read back by hierarchical name), so no internal-signal VPI access is
# required. Global public marks every signal
# public, which disables the AXI fabric split_var pragmas -> ~951 false combinational SCCs + a
# multi-million-entry ICO settle region that wedges Verilator; scoping to the tb top avoids that.
# -Wno-MODDUP/REDEFMACRO allow the override stubs to shadow real modules.
#
# NOTE: the common Verilator -Wno-fatal/UNOPTFLAT/... flags come from the profile's
# [target_defaults.default] (native.toml). Do NOT redefine [target_defaults.default]
# here -- the profile->DUT merge REPLACES that array, which would drop the profile flags.
# Each target below therefore re-states the three SEP -Wno flags; the profile's
# [target_defaults.default] is still inherited (selected_target uses it as the fallback
# for every target name).
#
# Compile targets keep the normal regression models explicit:
#   * default            (cpu_all_live)     : full VeeR CPU; m_axi + j_axi live.
#   * lsu_stub_all_live  (CPU stubbed)      : no VeeR; m_axi + j_axi live.
#
# Daily commit/push validation is the two class regressions, not one mixed `all`
# run. `rom_fw` is a separate owner's class, not a member of `all`; run it only
# when Boot ROM firmware is in scope:
#   python3 tools/dv/run_dv.py --dut sep --items no_cpu --regress \
#       --tool verilator --stage flist --stage hdl_compile --stage sim
#   python3 tools/dv/run_dv.py --dut sep --items cpu --regress \
#       --tool verilator --stage flist --stage hdl_compile --stage sim
#   python3 tools/dv/run_dv.py --dut sep --items rom_fw --regress \
#       --tool verilator --stage flist --stage c_compile --stage hdl_compile --stage sim
# Add `--stage c_compile` when the selected CPU firmware is stale, or run that
# stage alone for a firmware-only rebuild.
# The wrapper keeps build parallelism high for both, uses high sim fanout for
# no_cpu, and bounds CPU firmware fanout while keeping the Verilator model
# single-threaded by default.
#
# `default` is the FALLBACK target. On VCS the full CPU supports both run modes:
# no_cpu force-splices the LSU VIP. Verilator no_cpu still selects
# lsu_stub_all_live. Coverage runs pass `--target default`.
#
# NOTE: the common Verilator -Wno-fatal/UNOPTFLAT/... flags come from the profile's
# [target_defaults.default] (native.toml). Each target re-states the three SEP -Wno flags;
# do NOT redefine [target_defaults.default].
[targets.default]
description = "cpu_all_live: full VeeR EL2 CPU; m_axi + j_axi always live (fallback for all cpu tests)"
build_dir = "hw/sys/sep/dv/build/cocotb"   # per-tool subdir appended: cocotb/<tool>
defines = [
  "SEP_SMN_INBOUND_AXI_LIVE",
  "SEP_JTAG_AXIL_LIVE",
]
# abr_wrapper_key_reg stub swap is DUT-wide ([build].exclude_files + sources):
# sep_crypto_abr_wrapper instantiates u_abr_key_csr again; Verilator still cannot
# compile the PeakRDL-generated block (see shims/crypto/abr_wrapper_key_reg_stub.sv).

[targets.default.tools.verilator]
flags = [
  # PeakRDL reg blocks reset their axil_resp_buffer struct-array via an NBA in a
  # for-loop (incl. the read-target sep_cpu_ctrl_reg) -> Verilator BLKLOOPINIT,
  # suppressed here (the loop-style reset is functionally correct for the read path).
  "-Wno-BLKLOOPINIT",
  "-Wno-UNUSEDSIGNAL",
  "-Wno-UNUSEDPARAM",
]

# rom_boot: default (full VeeR CPU) + a behavioral SMC AXI responder for the
# real-ROM non-secure boot test. SEP_SMC_MEM_MODEL enables an axi_sim_mem on the
# SEP->SMC AXI (sep_ext_to_smc_axi, tied off in the default TB) so the Boot ROM's
# SMC scratch/SRAM accesses (scratch round-trip, manifest fetch) get real R/W
# responses. Scoped to this target so the shared default/no_cpu Verilator models
# do not compile the sim-only axi_sim_mem.
[targets.rom_boot]
description = "cpu_all_live + behavioral SMC AXI responder (axi_sim_mem) for the real-ROM non-secure boot test"
build_dir = "hw/sys/sep/dv/build/rom_boot/cocotb"
defines = [
  "SEP_SMN_INBOUND_AXI_LIVE",
  "SEP_JTAG_AXIL_LIVE",
  "SEP_SMC_MEM_MODEL",
]
sources = [
  "vendor/pulp-platform/axi/upstream/src/axi_sim_mem.sv",
]

[targets.rom_boot.tools.verilator]
flags = [
  "-Wno-BLKLOOPINIT",
  "-Wno-UNUSEDSIGNAL",
  "-Wno-UNUSEDPARAM",
]

# CPU-stub model: SEP_CPU_STUB drops the VeeR EL2 core (shims/cpu/sep_cpu_stub.sv
# reproduces the LSU ROM/xbar demux verbatim) so the cocotb AXI driver owns the CPU-LSU
# splice. ~1.66x faster sim; runs every no_cpu test. m_axi + j_axi are always live here
# too (tb_top), so inbound-filter tests run on this model. Cannot run cpu run-mode tests.
[targets.lsu_stub_all_live]
description = "lsu_stub_all_live: CPU stubbed (no VeeR EL2, LSU demux preserved); m_axi + j_axi live; for no_cpu tests"
build_dir = "hw/sys/sep/dv/build/cocotb"
defines = ["SEP_CPU_STUB", "SEP_SMN_INBOUND_AXI_LIVE", "SEP_JTAG_AXIL_LIVE"]
# Drop the real CPU wrapper from the bender filelist and append the stub after it (so all
# DUT packages are declared ahead of the stub); the stub is the only sep_cpu definition.
exclude_files = [
  "hw/sys/sep/rtl/sep_cpu.sv",
]
sources = [
  "hw/sys/sep/dv/shims/cpu/sep_cpu_stub.sv",
]

[targets.lsu_stub_all_live.tools.verilator]
flags = ["-Wno-BLKLOOPINIT", "-Wno-UNUSEDSIGNAL", "-Wno-UNUSEDPARAM"]
