  # key_digests.c no longer holds.
  "hw/sys/sep/bootrom/prod/build/oca_rom_key1_boot.bin",
  "hw/sys/sep/bootrom/prod/build/oca_rom_key2_boot.bin",
  "hw/sys/sep/bootrom/prod/build/oca_rom_key3_boot.bin",
  "hw/sys/sep/bootrom/prod/build/oca_rom_key4_boot.bin",
  "hw/sys/sep/bootrom/prod/build/oca_rom_key5_boot.bin",
  "hw/sys/sep/bootrom/prod/build/oca_smc_mem.hex",
]

[c_build.boot_rom_ot_pio]
# The OT-transport Boot ROM again, but with the RX FIFO drained by CPU programmed
# I/O instead of the SECURE_DMA handshake (BOOT_OT_SPI_USE_PIO=1 -> build_ot_pio/).
# boot_flash.h resolves the drain at compile time, so this is a genuinely separate
# binary: build_ot_pio/boot_rom.elf does not even link ot_spi_flash_read_dma.
#
# Everything else -- RISCV_TOOLCHAIN-or-container, NONFREE_ROOT= and the
# no-braces argv constraint -- matches [c_build.boot_rom_ot]. See that block
# for why each part is the way it is.
#
# `oca-images` builds every variant in one go, so the PIO test gets the unsigned
# image it boots along with the rest. The packed bytes are drain-agnostic and land
# in the shared build/, so this does not rebuild them per variant.
#
# DCCM_SCRUB_BYTES is left at the product default, as in every boot_rom variant.
# See [c_build.boot_rom_ot] for why the testbench does not supply DCCM's ECC
# in place of vector.S's scrub.
cwd = "."
argv = [
  "bash",
  "-lc",
  "set -e; RV_TC=\"$RISCV_TOOLCHAIN\"; RV_PFX=\"$RISCV_PREFIX\"; if [ -z \"$RV_PFX\" ]; then RV_PFX=riscv64-unknown-elf-; if [ -n \"$RV_TC\" ] && [ ! -x \"$RV_TC/riscv64-unknown-elf-gcc\" ] && [ -x \"$RV_TC/riscv-none-elf-gcc\" ]; then RV_PFX=riscv-none-elf-; fi; fi; ROM_DIR=hw/sys/sep/bootrom/prod; make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= BUILD_DIR=build_ot_pio key-digests; if [ -n \"$RV_TC\" ]; then GCC_P=$(printf %s \"$RV_PFX\" | sed 's/-$//'); make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= BUILD_DIR=build_ot_pio BOOT_SPI_CONTROLLER_OT=1 BOOT_OT_SPI_USE_PIO=1 SEP_ENTROPY_BRINGUP=1 toolchain-images-build GCC_PREFIX=\"$RV_TC/$GCC_P\" RISCV_TOOLCHAIN=\"$RV_TC\" RISCV_PREFIX=\"$RV_PFX\"; elif [ -x scripts/docker-run.sh ]; then echo \"[c_compile] RISCV_TOOLCHAIN is unset; building the OT-PIO boot ROM in the OCAH toolchain container\"; env -u RISCV_TOOLCHAIN -u RISCV_PREFIX -u MAKEFLAGS -u MFLAGS ./scripts/docker-run.sh run-here make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= BUILD_DIR=build_ot_pio BOOT_SPI_CONTROLLER_OT=1 BOOT_OT_SPI_USE_PIO=1 RISCV_PREFIX=riscv64-unknown-elf- GCC_PREFIX=riscv64-unknown-elf SEP_ENTROPY_BRINGUP=1 toolchain-images-build; else echo \"error: scripts/docker-run.sh is required when RISCV_TOOLCHAIN is unset\" >&2; exit 1; fi; make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= oca-images",
]
outputs = [
  "hw/sys/sep/bootrom/prod/build_ot_pio/boot_rom.vmem",
  "hw/sys/sep/bootrom/prod/build_ot_pio/boot_rom.itcm.hex",
  "hw/sys/sep/bootrom/prod/build_ot_pio/boot_rom.dtcm.hex",
  # nm listing for the CPU trace monitor's ROM-PC symbolization.
  "hw/sys/sep/bootrom/prod/build_ot_pio/boot_rom.sym",
]

[c_build.km_rom_main]
# Key Manager application ROM (hw/ip/key_manager/approm/prod, entry src/rom_main.c).
# Not [c_build.default]: that template builds SEP EL2 TCM images via
# hw/sys/sep/dv/fw. rom_main is rv32emc KM firmware, and it must be built with
# KM_BOOT_WIPE=0 / KM_UNREC_WIPE=0 -- a default KM build wipes SRAM at boot and
# halts before RESP_KM_READY. cocotb/tests/km_fw/Makefile passes those knobs to
# the ROM Makefile, so argv drives that target rather than the ROM Makefile
# directly.
#
# Tests select it with `firmware = { name = "rom_main", mode = "km_rom_main" }`
# next to `+km_rom_hex=rom_main.rom.parhex`.
#
# Every c_compile builds the image from source in a directory private to this
# run and this test: "{build_dir}/{item}", under this run's c_compile stage
# directory. argv deletes that directory first and writes nothing outside it,
# so no object from an earlier build or another checkout state reaches the
# image, and no run writes a path another run reads. The km_fw Makefile builds
# with FW_BUILD_DIR set to it and leaves the image at
# "{build_dir}/{item}/rom_main.rom.parhex". The log then records
# `source-sha256` (every file under the KM application ROM and KM
# generated-header trees, build trees excluded, plus km_fw/Makefile, which
# carries the wipe knobs) and the sha256 of that image on one
# KM-ROM-IDENTITY line. The sim log's RUN-IDENTITY-FW line hashes the image
# the sim loads, so the image digest joins the sim to this build and the
# source digest.
#
# `outputs` is empty on purpose. The runlib renders {build_dir} differently
# when it stages outputs for the sim than when c_compile runs, so a declared
# output cannot name the private image. cocotb/dv_sim_prestage.py stages it
# instead: for a leaf with `+km_rom_hex=rom_main.rom.parhex` it copies this
# run's image into the sim directory, and it fails the leaf when the image is
# missing, so `--stage sim` without this run's c_compile fails loudly.
#
# Toolchain: $RISCV_TOOLCHAIN when that gcc has picolibc, else the OCAH
# container via scripts/docker-run.sh run-here, which keeps host paths 1:1, so
# the private build tree resolves inside it. No site, $HOME, or PATH probe.
# The sandbox make sets PYTHON=python3: add_rom_parity.py is stdlib, and the
# toolchain image has no uv. The host path keeps the locked uv default.
# argv accepts only the runlib placeholders ({fw_target}, {build_dir}, ...),
# so use "$VAR" and $(...), never shell ${...}.
cwd = "."
argv = [
  "bash",
  "-lc",
  "set -e; RV_TC=\"$RISCV_TOOLCHAIN\"; RV_PFX=\"$RISCV_PREFIX\"; if [ -z \"$RV_PFX\" ]; then RV_PFX=riscv64-unknown-elf-; if [ -n \"$RV_TC\" ] && [ ! -x \"$RV_TC/riscv64-unknown-elf-gcc\" ] && [ -x \"$RV_TC/riscv-none-elf-gcc\" ]; then RV_PFX=riscv-none-elf-; fi; fi; KM_FW=hw/sys/sep/dv/cocotb/tests/km_fw; KM_ITEM=\"{item}\"; if [ -z \"$KM_ITEM\" ]; then echo \"error: km_rom_main builds per test; no item given\" >&2; exit 1; fi; KM_BD=\"{build_dir}/$KM_ITEM\"; KM_IMG=\"$KM_BD/rom_main.rom.parhex\"; rm -rf \"$KM_BD\"; mkdir -p \"$KM_BD\"; KM_SRC_SHA=$(find hw/ip/key_manager/approm/prod hw/ip/key_manager/regs/gen/c \"$KM_FW/Makefile\" -type f ! -path \"*/build/*\" ! -path \"*/__pycache__/*\" ! -name \"*.o\" ! -name \"*.d\" -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d\" \" -f1); if [ -n \"$RV_TC\" ] && \"$RV_TC/$RV_PFX\"gcc -specs=picolibc.specs -E - </dev/null >/dev/null 2>&1; then make -C \"$KM_FW\" rom_main FW_BUILD_DIR=\"$KM_BD\" RISCV_TOOLCHAIN=\"$RV_TC\" RISCV_PREFIX=\"$RV_PFX\"; elif [ -x scripts/docker-run.sh ]; then echo \"[c_compile] RISCV_TOOLCHAIN is unset or has no picolibc; building KM rom_main in the OCAH toolchain container\"; env -u RISCV_TOOLCHAIN -u RISCV_PREFIX ./scripts/docker-run.sh run-here make -C \"$KM_FW\" rom_main FW_BUILD_DIR=\"$KM_BD\" PYTHON=python3; else echo \"error: no picolibc-enabled RISC-V toolchain and no scripts/docker-run.sh\" >&2; exit 1; fi; test -s \"$KM_IMG\"; KM_IMG_SHA=$(sha256sum \"$KM_IMG\" | cut -d\" \" -f1); echo \"[c_compile] KM-ROM-IDENTITY: image=$KM_IMG sha256=$KM_IMG_SHA source-sha256=$KM_SRC_SHA (hw/ip/key_manager/approm/prod hw/ip/key_manager/regs/gen/c $KM_FW/Makefile) build-dir=$KM_BD\"",
]
outputs = []

[c_build.km_rom_blob]
# Committed KM ROM blobs (cocotb/tests/km_rom*.parhex), assembled from
# cocotb/tests/km_fw/km_rom*.S. A test that boots one declares
# `firmware = { name = "<blob basename without .parhex>", mode = "km_rom_blob" }`
# next to its `+km_rom_hex=<blob>.parhex` plusarg.
#
# argv runs `make verify` for that one blob: it reassembles the .S into a
# scratch directory and compares the result byte for byte with the committed
# blob. A mismatch (STALE), a missing blob, or a failed assembly exits nonzero,
# c_compile fails, and the sim stage does not run. The blob itself is never
# rewritten here. The declared output is the committed blob, which c_compile
# stages into the sim CWD.
#
# Toolchain: $RISCV_TOOLCHAIN/$RISCV_PREFIX gcc when present, else the OCAH
# container via scripts/docker-run.sh run-here. The blobs link with -nostdlib,
# so picolibc is not required.
cwd = "."
argv = [
  "bash",
  "-lc",
  "set -e; RV_TC=\"$RISCV_TOOLCHAIN\"; RV_PFX=\"$RISCV_PREFIX\"; if [ -z \"$RV_PFX\" ]; then RV_PFX=riscv64-unknown-elf-; if [ -n \"$RV_TC\" ] && [ ! -x \"$RV_TC/riscv64-unknown-elf-gcc\" ] && [ -x \"$RV_TC/riscv-none-elf-gcc\" ]; then RV_PFX=riscv-none-elf-; fi; fi; KM_FW=hw/sys/sep/dv/cocotb/tests/km_fw; if [ -n \"$RV_TC\" ] && [ -x \"$RV_TC/$RV_PFX\"gcc ]; then GCC_P=$(printf %s \"$RV_PFX\" | sed 's/-$//'); make -C \"$KM_FW\" verify ROMS={fw_target} GCC_PREFIX=\"$RV_TC/$GCC_P\"; elif [ -x scripts/docker-run.sh ]; then echo \"[c_compile] RISCV_TOOLCHAIN is unset; verifying the KM ROM blob in the OCAH toolchain container\"; env -u RISCV_TOOLCHAIN -u RISCV_PREFIX -u MAKEFLAGS -u MFLAGS ./scripts/docker-run.sh run-here make -C \"$KM_FW\" verify ROMS={fw_target} PYTHON=python3; else echo \"error: no RISC-V toolchain and no scripts/docker-run.sh\" >&2; exit 1; fi; echo \"[c_compile] KM-ROM-IDENTITY: image=hw/sys/sep/dv/cocotb/tests/{fw_target}.parhex sha256=$(sha256sum hw/sys/sep/dv/cocotb/tests/{fw_target}.parhex | cut -d\" \" -f1) matches {fw_target}.S\"",
]
outputs = [
  "hw/sys/sep/dv/cocotb/tests/{fw_target}.parhex",
]

[c_build.el2_km_rom_coexist]
# EL2 firmware for sep_efuse_km_axil_cpu_mux_coexist_test, plus the verify
# step of [c_build.km_rom_blob] for the km_rom_coexist.parhex blob the same
# leaf boots on the KM CPU. A test has one firmware entry, so this mode runs
# both: argv first runs `make verify ROMS=km_rom_coexist` (a stale, missing or
# unassemblable blob fails c_compile before sim) and then the
# [c_build.default] EL2 build of {fw_target}. The toolchain rules of both
# blocks apply unchanged.
cwd = "."
argv = [
  "bash",
  "-lc",
  "set -e; RV_TC=\"$RISCV_TOOLCHAIN\"; RV_PFX=\"$RISCV_PREFIX\"; if [ -z \"$RV_PFX\" ]; then RV_PFX=riscv64-unknown-elf-; if [ -n \"$RV_TC\" ] && [ ! -x \"$RV_TC/riscv64-unknown-elf-gcc\" ] && [ -x \"$RV_TC/riscv-none-elf-gcc\" ]; then RV_PFX=riscv-none-elf-; fi; fi; KM_FW=hw/sys/sep/dv/cocotb/tests/km_fw; if [ -n \"$RV_TC\" ] && [ -x \"$RV_TC/$RV_PFX\"gcc ]; then GCC_P=$(printf %s \"$RV_PFX\" | sed 's/-$//'); make -C \"$KM_FW\" verify ROMS=km_rom_coexist GCC_PREFIX=\"$RV_TC/$GCC_P\"; elif [ -x scripts/docker-run.sh ]; then echo \"[c_compile] RISCV_TOOLCHAIN is unset; verifying the KM ROM blob in the OCAH toolchain container\"; env -u RISCV_TOOLCHAIN -u RISCV_PREFIX -u MAKEFLAGS -u MFLAGS ./scripts/docker-run.sh run-here make -C \"$KM_FW\" verify ROMS=km_rom_coexist PYTHON=python3; else echo \"error: no RISC-V toolchain and no scripts/docker-run.sh\" >&2; exit 1; fi; echo \"[c_compile] KM-ROM-IDENTITY: image=hw/sys/sep/dv/cocotb/tests/km_rom_coexist.parhex sha256=$(sha256sum hw/sys/sep/dv/cocotb/tests/km_rom_coexist.parhex | cut -d\" \" -f1) matches km_rom_coexist.S\"; RV_TC=\"$RISCV_TOOLCHAIN\"; RV_PFX=\"$RISCV_PREFIX\"; if [ -z \"$RV_PFX\" ]; then RV_PFX=riscv64-unknown-elf-; if [ -n \"$RV_TC\" ] && [ ! -x \"$RV_TC/riscv64-unknown-elf-gcc\" ] && [ -x \"$RV_TC/riscv-none-elf-gcc\" ]; then RV_PFX=riscv-none-elf-; fi; fi; MK=\"dv-fw-tests TEST={fw_target}\"; if [ -n \"$RV_TC\" ] && \"$RV_TC/$RV_PFX\"gcc -specs=picolibc.specs -E - </dev/null >/dev/null 2>&1; then exec make -C hw/sys/sep/dv/fw -f fw.mk $MK OCAH_ROOT=\"$PWD\" RISCV_TOOLCHAIN=\"$RV_TC\" RISCV_PREFIX=\"$RV_PFX\"; elif [ -x scripts/docker-run.sh ]; then echo \"[c_compile] no caller RISCV_TOOLCHAIN with picolibc; building in the OCAH toolchain container\"; exec env -u RISCV_TOOLCHAIN -u RISCV_PREFIX ./scripts/docker-run.sh run-here make -C hw/sys/sep/dv/fw -f fw.mk $MK OCAH_ROOT=\"$PWD\"; else echo \"error: set RISCV_TOOLCHAIN to a picolibc-enabled RISC-V toolchain, or provide scripts/docker-run.sh\" >&2; exit 1; fi",
]
outputs = [
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.tcm.elf",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.tcm.sym",
  "hw/sys/sep/dv/cocotb/tests/km_rom_coexist.parhex",
]

[defaults]
run_mode = "no_cpu"

[run_modes.no_cpu]
description = "CPU held off: cocotb AXI driver owns the CPU LSU splice"
timeout_sec = 1800
args = []

[run_modes.cpu]
description = "CPU firmware boot: VeeR EL2 owns its master buses and fetches firmware from TCM"
# CPU firmware sims need a longer wall-clock budget than no_cpu smoke.
# Per-test timeout_sec overrides this fallback where set.
timeout_sec = 3600
args = ["+cpu_boot"]

# Compile and run settings for a target share one [targets.<name>] table.
# Tool-specific flags live under [targets.<name>.tools.<tool>].
# cocotb's runner forces a global --public-flat-rw. The runlib cocotb_public_scope() integration
# drops it and substitutes the scoped public config in `public_scope` above: cocotb only needs
# the top-level sep_uvm_top ports (clocks/reset/boot controls + the flat s_axi_* bus); the
# CPU-LSU splice is SV-side inside tb_top (the no_cpu stub drives lsu_axi_req from lsu_req_drive;
# the LSU response is read back by hierarchical name), so no internal-signal VPI access is
# required. See [build.verilator] for the split_var constraint behind the scoping.
# -Wno-MODDUP/REDEFMACRO allow the override stubs to shadow real modules.
#
# NOTE: the common Verilator -Wno-fatal/UNOPTFLAT/... flags come from the profile's
# [target_defaults.default] (native.toml). Do NOT redefine [target_defaults.default]
# here -- the profile->DUT merge REPLACES that array, which would drop the profile flags.
# Each target below therefore re-states the three SEP -Wno flags; the profile's
# [target_defaults.default] is still inherited (selected_target uses it as the fallback
# for every target name).
#
# Compile targets keep the normal regression models explicit:
#   * default            (cpu_all_live)     : full VeeR CPU; m_axi + j_axi live.
#   * lsu_stub_all_live  (CPU stubbed)      : no VeeR; m_axi + j_axi live.
#
# Daily commit/push validation is the two class regressions, not one mixed `all`
# run. `rom_fw` is a separate owner's class, not a member of `all`; run it only
# when Boot ROM firmware is in scope:
#   python3 tools/dv/run_dv.py --dut sep --items cpu_stub --regress \
#       --tool verilator --stage flist --stage hdl_compile --stage sim
#   python3 tools/dv/run_dv.py --dut sep --items cpu --regress \
#       --tool verilator --stage flist --stage hdl_compile --stage sim
#   python3 tools/dv/run_dv.py --dut sep --items rom_fw --regress \
#       --tool verilator --stage flist --stage c_compile --stage hdl_compile --stage sim
# Add `--stage c_compile` when the selected CPU firmware is stale, or run that
# stage alone for a firmware-only rebuild.
# The wrapper keeps build parallelism high for both, uses high sim fanout for
# no_cpu, and bounds CPU firmware fanout while keeping the Verilator model
# single-threaded by default.
#
# `default` is the FALLBACK target. On VCS the full CPU supports both run modes:
# no_cpu force-splices the LSU VIP. Verilator no_cpu still selects
# lsu_stub_all_live. Coverage runs pass `--target default`.
[targets.default]
description = "cpu_all_live: full VeeR EL2 CPU; m_axi + j_axi always live (fallback for all cpu tests)"
build_dir = "hw/sys/sep/dv/build/cocotb"   # per-tool subdir appended: cocotb/<tool>
defines = [
  "SEP_SMN_INBOUND_AXI_LIVE",
  "SEP_JTAG_AXIL_LIVE",
]
[targets.default.tools.verilator]
flags = [
  # PeakRDL reg blocks reset their axil_resp_buffer struct-array via an NBA in a
  # for-loop (incl. the read-target sep_cpu_ctrl_reg) -> Verilator BLKLOOPINIT,
  # suppressed here (the loop-style reset is functionally correct for the read path).
  "-Wno-BLKLOOPINIT",
  "-Wno-UNUSEDSIGNAL",
  "-Wno-UNUSEDPARAM",
]

# rom_boot: default (full VeeR CPU) + the shared AXI slave agent on the SEP->SMC
# AXI for the real-ROM boot tests. SEP_SMC_MEM_MODEL places sep_ext_to_smc_axi
# (tied off in the default TB) on an ocah_axi_if through the VIP struct bridge,
# and the cocotb base test binds OcahAxiSlaveAgent to it so the Boot ROM's SMC
# scratch/SRAM accesses (scratch round-trip, manifest fetch) get real R/W
# responses. The interface and bridge sources are scoped to this target; the
# default/no_cpu models carry no SEP->SMC responder.
[targets.rom_boot]
description = "cpu_all_live + shared AXI slave agent on the SEP->SMC AXI for the real-ROM boot tests"
build_dir = "hw/sys/sep/dv/build/rom_boot/cocotb"
defines = [
  "SEP_SMN_INBOUND_AXI_LIVE",
  "SEP_JTAG_AXIL_LIVE",
  "SEP_SMC_MEM_MODEL",
]
sources = [
  "hw/common/dv/vip/ocah_axi_vip/interface/ocah_axi_if.sv",
  "hw/common/dv/vip/ocah_axi_vip/interface/ocah_axi_struct_bridge.sv",
]

[targets.rom_boot.tools.verilator]
flags = [
  "-Wno-BLKLOOPINIT",
  "-Wno-UNUSEDSIGNAL",
  "-Wno-UNUSEDPARAM",
]

# CPU-stub model: SEP_CPU_STUB drops the VeeR EL2 core (shims/cpu/sep_cpu_stub.sv
# reproduces the LSU ROM/xbar demux verbatim) so the cocotb AXI driver owns the CPU-LSU
# splice. Runs every no_cpu test. m_axi + j_axi are always live here
# too (tb_top), so inbound-filter tests run on this model. Cannot run cpu run-mode tests.
[targets.lsu_stub_all_live]
description = "lsu_stub_all_live: CPU stubbed (no VeeR EL2, LSU demux preserved); m_axi + j_axi live; for no_cpu tests"
build_dir = "hw/sys/sep/dv/build/cocotb"
defines = ["SEP_CPU_STUB", "SEP_SMN_INBOUND_AXI_LIVE", "SEP_JTAG_AXIL_LIVE"]
# Drop the real CPU wrapper from the bender filelist and append the stub after it (so all
# DUT packages are declared ahead of the stub); the stub is the only sep_cpu definition.
exclude_files = [
  "hw/sys/sep/rtl/sep_cpu.sv",
]
sources = [
  "hw/sys/sep/dv/shims/cpu/sep_cpu_stub.sv",
]

[targets.lsu_stub_all_live.tools.verilator]
flags = ["-Wno-BLKLOOPINIT", "-Wno-UNUSEDSIGNAL", "-Wno-UNUSEDPARAM"]

# SystemVerilog UVM view (`--dut sep --framework uvm`, VCS): the same DUT recipe
# (Bender targets, stubs) with the shared framework library and AXI VIP
# manifests ahead of the DUT sources, the
# SEP-local TB interface, and the two bench packages. A framework `[build]` list
# replaces the DUT-level one rather than appending to it, so the TB collateral
# both flows compile is restated here; the AXI protocol SVA comes from the VIP
# manifest, and the picorv32 KM core is left to the Bender flist (VCS rejects
# a module declared twice). The tool allowlist is restated because the DUT's
# top-level `tools` list would otherwise override the profile's.
[frameworks.uvm]
description = "SEP SV-UVM smoke flow (VCS)"
default_tool = "vcs"
tools = ["vcs"]

[frameworks.uvm.build]
source_lists = [
  "hw/common/dv/vip/ocah_lib/uvm/sources.toml",
  "hw/common/dv/vip/ocah_axi_vip/uvm/sources.toml",
]
filelist = "hw/sys/sep/dv/build/uvm/sep_uvm_compile.f"
bender_filelist = "hw/sys/sep/dv/build/uvm/sep_uvm_bender.f"
work_dir = "hw/sys/sep/dv/build/uvm"
# hw/sys/sep/regs/gen/svh carries the generated register header sep_env_pkg
# includes for addresses, reset values, and field masks.
incdirs = [
  "hw/sys/sep/dv/tb",
  "hw/common/assert",
  "hw/sys/sep/regs/gen/svh",
  "hw/sys/sep/dv/uvm/env",
  "hw/sys/sep/dv/uvm/seq_lib",
  "hw/sys/sep/dv/uvm/tests",
]
sources = [
  "hw/sys/sep/dv/tb/sep_outbound_mbx.sv",
  "hw/sys/sep/dv/cov/sv/sep_fcov.sv",
  "hw/sys/sep/dv/tb/sep_tb_if.sv",
  "hw/sys/sep/dv/uvm/env/sep_env_pkg.sv",
  "hw/sys/sep/dv/uvm/seq_lib/sep_seq_lib_pkg.sv",
]

[frameworks.uvm.sim]
args = ["+UVM_VERBOSITY=UVM_MEDIUM"]

# The no_cpu scenarios select target = "lsu_stub_all_live" (CPU stubbed, the
# stub is the sole LSU driver); the full-CPU default target force-splices the
# LSU request on VCS. Both share one SV-UVM build tree, partitioned by input
# fingerprint like the cocotb targets.
[frameworks.uvm.targets.default]
description = "SEP SV-UVM full-CPU target"
build_dir = "hw/sys/sep/dv/build/uvm"

[frameworks.uvm.targets.lsu_stub_all_live]
description = "SEP SV-UVM no_cpu target: CPU stubbed, LSU driven by the shared AXI VIP master"
build_dir = "hw/sys/sep/dv/build/uvm"
