# SPDX-License-Identifier: Apache-2.0
#
# SEP OSS simulation config (native build/filelist manifest).
# DUT = `sep_wrapper` (the bare `sep` core plus its IP integration); vendor-clean
# by construction (bender_targets deliberately exclude "simulation").

schema_version = 1

# Launch entry: selected by `--dut sep`. Two run modes: no_cpu, where a cocotbext-axi
# AxiMaster drives the CPU LSU bus (the stub is its sole driver) to exercise the SEP
# register/fabric map, and cpu, where VeeR EL2 boots firmware. The shared stage
# graph + tool list come from profile = "native-cocotb" (Verilator is the verified OSS backend).
name = "sep"
profile = "native-cocotb"
description = "SEP (Security Processor) OSS cocotb DV flow (no_cpu AXI + cpu firmware boot)"
# Verilator remains the pre-merge acceptance backend. VCS/Xcelium are supported by
# the native cocotb runner for development iteration and share the same OSS-safe
# filelist/stub injection.
default_tool = "verilator"
tools = ["verilator", "xcelium", "vcs"]

[testlist]
path = "testlists/all.toml"
format = "toml_list"

# Waive the vendored adams_bridge ABR register block's time-0 X-init immediate
# assertions (abr_reg.sv `external wr/rd_ack` $error, fired at t=0 fs before reset
# releases, on X-valued strobes). They are benign elaboration-time X artifacts in a
# third-party crypto IP that OSS DV does not exercise (the ABR datapath is stubbed;
# see [targets.default]'s abr_wrapper_key_reg swap) and are unrelated to any test's
# functional checks. Scoped to the specific file + "at time 0" so any real runtime
# abr_reg assertion still fails, and every other `Error:` line still fails. Needed
# because these appear in the full-CPU (VeeR) crypto compile, i.e. any cpu VCS test.
[pass_fail]
extra_ignore_patterns = ['abr_reg\.sv.*at time 0']

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "hw/sys/sep/dv/build"]

[build]
# Native build is driven by the Bender/filelist keys below; .core files are external-only.
top_module = "sep_uvm_top"
top_file = "hw/sys/sep/dv/tb/tb_top.sv"
# Extra tb sources compiled alongside tb_top: the outbound mailbox console/PASS
# monitor. The sep_wrapper DUT, its IP-integration models, and the eFuse
# shim/bank models all come from the Bender closure now: `sep_wrapper` supplies
# hw/top/sep_{wrapper,ip_integration}.sv and the `any(sep, smc)` groups supply
# the hw/ip/efuse model/reg files. The legacy och_sep_spi_mux_ctrl_ot register
# block no longer exists in this repository (the wrapper's SPI moved to struct
# ports), so it is no longer compiled.
sources = [
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_regs.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_mul.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_fast_mul.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_div.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_axi_adapter.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_axi.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_wb.sv",
  "hw/sys/sep/dv/tb/sep_outbound_mbx.sv",
  # After bender flist so abr_wrapper_key_reg_pkg is already declared (see exclude_files).
  "hw/sys/sep/dv/shims/crypto/abr_wrapper_key_reg_stub.sv",
]
# PeakRDL abr_wrapper_key_reg miscompiles under Verilator 5.046 (nested-struct
# aggregate / hwif_in tied-'0 fold -> missing __PVT__MLKEM_SHARED_KEY). Drop the
# generated block from every target's bender flist; the stub above replaces it.
# Package files (*_reg_pkg.sv) stay — substring match is on this exact basename.
exclude_files = [
  "hw/ip/key_manager/regs/gen/sv/abr_wrapper_key_reg.sv",
]
# FIXME(transition): `stubs` are transitional Verilator/VCS-compat overrides, listed ahead of
# the bender filelist so -Wno-MODDUP "first definition wins" selects them. prim_sync2 retargets
# the public prim_flop_2sync (it imports NO packages, so prepending it is safe). Remove each shim
# once it is no longer needed upstream.
#
# The sep_cpu stub is NOT prepended: it imports DUT packages (sep_pkg/el2_pkg) that are declared
# only inside the bender filelist, so a prepended copy would reference them before declaration.
# Instead the CPU-stub targets exclude the real hw/sys/sep/rtl/sep_cpu.sv from the bender filelist (via a
# per-target `exclude_files`) and append shims/cpu/sep_cpu_stub.sv through their `sources` list,
# where every DUT package is already declared. The stub is then the single sep_cpu definition (no
# MODDUP), and the full-CPU `default` target keeps the real sep_cpu untouched.
stubs = [
  "hw/sys/sep/dv/shims/prim/prim_sync2.sv",
  "hw/sys/sep/dv/shims/analog/entropy_ring_oscillator.sv",
]
filelist = "hw/sys/sep/dv/build/sep_dut_compile.f"
bender_filelist = "hw/sys/sep/dv/build/sep_bender.f"
work_dir = "hw/sys/sep/dv/build"
# Vendor-clean target set (verify with check_no_vendor_paths.py).
# NEVER add "simulation" — it pulls Cadence + Samsung padring (51 violations).
common_bender_targets = [
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "register_interface_l1",
]
# `sep_wrapper` adds hw/top/sep_{wrapper,ip_integration}.sv plus the vendored
# prim_ram_1p/prim_ram_1p_adv/prim_rom memory models the IP integration needs.
bender_targets = ["sep", "sep_el2", "sep_wrapper"]
# shims/prim is listed first so its prim_assert.sv shadows the vendored upstream OpenTitan
# copy (the runlib prepends these incdirs ahead of the bender filelist): it restores the
# `ifndef SYNTHESIS gating of ASSUME/COVER that the vendoring reorg dropped, so +define+SYNTHESIS
# neutralizes the unsupported `##[1:$]` concurrent assumptions Verilator cannot parse.
incdirs = ["hw/sys/sep/dv/shims/prim", "hw/sys/sep/dv/tb"]

[build.options]
# SEP is a large cold build (VeeR EL2 + OTBN + full crypto). Parallelize the
# Verilator + C++ compile and split codegen into many TUs so g++ runs concurrently.
#
# Partition the build dir by input fingerprint so the two daily targets
# (default / lsu_stub_all_live) coexist instead of clobbering one shared model on
# every target switch. Each unchanged target then reuses its build; only a config
# or source change rebuilds it.
cache_enabled = true

[build.verilator]
# Keep the inherited output_split = 0 default. The SEP model's root header is ~25 MB and is included
# by every C++ TU, so fewer/larger TUs build faster than many small ones for this DUT.
ccache = true
# Replace cocotb's global --public-flat-rw with a scoped Verilator public config that exposes only
# the tb top (sep_uvm_top) to cocotb. Global public marks every signal public, which disables the
# AXI fabric split_var pragmas (rr_arb_tree/lzc/axi_demux) -> ~951 false combinational SCCs and a
# multi-million-entry ICO settle region that wedges Verilator. Scoping to the tb top keeps the fabric
# optimisable (SCCs -> ~61, model runs instead of wedging). The runner integration drops the global
# flag and injects this file; see runlib cocotb_public_scope().
public_scope = "hw/sys/sep/dv/sep_public_scope.vlt"
# Disable Verilator's DFG (data-flow-graph) optimisation pass. The eFuse AXI-Lite
# write path (efuse_interface_controller -> prim_axi_lite_to_apb_single ->
# axi_lite_to_apb) carries a circular combinational ready/valid loop on the APB
# response (apb_resp_i). With DFG enabled, the optimiser folds the loop signals and
# the optimised build settles the OTP-program register write to a hung fixed point:
# the AXI B-response for the EFUSE_PROGRAM_CTRL write never returns and the test
# wedges (reads converge, only the write deadlocks). A --trace build keeps those
# signals (so it cannot fold them) and runs fine, which is the tell that this is an
# optimiser convergence artifact, not RTL: the same write completes on VCS.
# -fno-dfg only disables an optimisation, so it can never make logic less correct;
# it lets the write-path loop settle to the same fixed point VCS/trace reach.
extra_args = ["-fno-dfg"]

[cocotb]
# Flow-first layout: cocotb env/seq_lib/tests live under cocotb/ (room for a
# future uvm/ sibling). python_root puts env/ + seq_lib/ on the import path.
python_root = "hw/sys/sep/dv/cocotb"
test_dir = "hw/sys/sep/dv/cocotb/tests"
# Shared cocotb VIP (ocah_spi_vip, ocah_axi_vip, ...) lives at hw/common/dv/vip;
# add it to the import path so tests can `from ocah_spi_vip import OcahSpiFlash`.
python_paths = [
  "hw/common/dv/vip",
  # env/ on the path so env golden models can import siblings by bare name
  # (e.g. sep_entropy_golden -> sep_noise_golden) and keep standalone self-tests.
  "hw/sys/sep/dv/cocotb/env",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

[c_build.default]
# EL2 firmware images are generated by the runlib c_compile stage and consumed by
# CPU boot tests through sep_base_test.boot_firmware(). The build goes through the
# shared DV firmware engine (hw/common/dv/fw/compile.mk, driven by fw/fw.mk), which
# emits the gitignored .itcm/.dtcm hex images under fw/build/tests/<target>/ from
# tracked test/driver source.
#
# Toolchain resolution, in order: an explicit RISCV_TOOLCHAIN/RISCV_PREFIX from the
# environment wins; then the project container's riscv-gnu-toolchain; then a local
# xPack riscv-none-elf install (the macOS/Verilator-only route). NOTE: no ${...}
# brace expansions in argv -- these strings go through str.format() for {fw_target}.
#
# RISCV_TOOLCHAIN + RISCV_PREFIX is the ONLY toolchain contract the shared engine
# accepts (hw/common/dv/fw/compile.mk); do not invent per-tool RISCV_GCC/_NM vars.
# When RISCV_TOOLCHAIN is given without RISCV_PREFIX we still probe the directory
# for both tool names, because the auto-detect loop that would have picked the
# right prefix is skipped in that case -- otherwise pointing RISCV_TOOLCHAIN at an
# xPack install would silently fall back to the riscv64-unknown-elf- prefix.
cwd = "."
argv = [
  "bash",
  "-lc",
  "set -e; RV_TC=\"$RISCV_TOOLCHAIN\"; RV_PFX=\"$RISCV_PREFIX\"; if [ -z \"$RV_TC\" ]; then for c in /tools_soc/opensrc/riscv-gnu-toolchain/2025.01.20-rhel-8.10/bin \"$HOME\"/.local/opt/xpack-riscv-none-elf-gcc-*/bin; do if [ -x \"$c/riscv64-unknown-elf-gcc\" ]; then RV_TC=\"$c\"; RV_PFX=riscv64-unknown-elf-; break; fi; if [ -x \"$c/riscv-none-elf-gcc\" ]; then RV_TC=\"$c\"; RV_PFX=riscv-none-elf-; break; fi; done; fi; if [ -z \"$RV_PFX\" ]; then RV_PFX=riscv64-unknown-elf-; if [ -n \"$RV_TC\" ] && [ ! -x \"$RV_TC/riscv64-unknown-elf-gcc\" ] && [ -x \"$RV_TC/riscv-none-elf-gcc\" ]; then RV_PFX=riscv-none-elf-; fi; fi; exec make -C hw/sys/sep/dv/fw -f fw.mk dv-fw-tests TEST={fw_target} OCAH_ROOT=\"$PWD\" RISCV_TOOLCHAIN=\"$RV_TC\" RISCV_PREFIX=\"$RV_PFX\"",
]
outputs = [
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.dtcm.hex",
]

[defaults]
run_mode = "no_cpu"

[run_modes.no_cpu]
description = "CPU held off: cocotb AXI driver owns the CPU LSU splice"
timeout_sec = 1800
args = []

[run_modes.cpu]
description = "CPU firmware boot: VeeR EL2 owns its master buses and fetches firmware from TCM"
# Doubled from 1800 -> 3600: cpu firmware tests run heavier sims; the low-fanout/high-thread
# cpu regression policy should keep them under this, but the extra headroom guards the heaviest
# (crypto/dma). Per-test timeout_sec (also doubled to 3600 for cpu tests) overrides this fallback.
timeout_sec = 3600
args = ["+cpu_boot"]

# OD-19: one [targets.<name>] merges the former [compile_targets]/[run_targets] split.
# Tool-specific flags live under [targets.<name>.tools.<tool>].
# cocotb's runner forces a global --public-flat-rw. The runlib cocotb_public_scope() integration
# drops it and substitutes the scoped public config in `public_scope` above, because cocotb only
# needs the top-level sep_uvm_top ports (clocks/reset/boot controls + the flat s_axi_* bus); the
# CPU-LSU splice is SV-side inside tb_top (the no_cpu stub drives lsu_axi_req from lsu_req_drive;
# the LSU response is read back by hierarchical name), so no internal-signal VPI access is
# required. Global public marks every signal
# public, which disables the AXI fabric split_var pragmas -> ~951 false combinational SCCs + a
# multi-million-entry ICO settle region that wedges Verilator; scoping to the tb top avoids that.
# -Wno-MODDUP/REDEFMACRO allow the override stubs to shadow real modules.
#
# NOTE: the common Verilator -Wno-fatal/UNOPTFLAT/... flags come from the profile's
# [target_defaults.default] (native-cocotb.toml). Do NOT redefine [target_defaults.default]
# here -- the profile->DUT merge REPLACES that array, which would drop the profile flags.
# Each target below therefore re-states the SEP-specific common bits (SYNTHESIS + the
# three SEP -Wno flags); the profile's [target_defaults.default] is still inherited
# (selected_target uses it as the fallback for every target name).
#
# Compile targets keep the normal regression models explicit:
#   * default            (cpu_all_live)     : full VeeR CPU; m_axi + j_axi live.
#   * lsu_stub_all_live  (CPU stubbed)      : no VeeR; m_axi + j_axi live.
#
# Daily commit/push validation is two regressions, not one mixed `all` run:
#   python3 tools/dv/run_dv.py --dut sep --items no_cpu --regress \
#       --tool verilator --stage flist --stage hdl_compile --stage sim
#   python3 tools/dv/run_dv.py --dut sep --items cpu --regress \
#       --tool verilator --stage flist --stage hdl_compile --stage sim
# Add `--stage c_compile` when the selected CPU firmware is stale, or run that
# stage alone for a firmware-only rebuild.
# The wrapper keeps build parallelism high for both, uses high sim fanout for
# no_cpu, and bounds CPU firmware fanout while keeping the Verilator model
# single-threaded by default.
#
# `default` is the FALLBACK target -- unassigned tests + every cpu test land here safely
# (full CPU supports both run modes). no_cpu tests select lsu_stub_all_live for the sim
# speedup.
#
# NOTE: the common Verilator -Wno-fatal/UNOPTFLAT/... flags come from the profile's
# [target_defaults.default] (native-cocotb.toml). Each target re-states the SEP-specific
# common bits (SYNTHESIS + the three SEP -Wno flags); do NOT redefine [target_defaults.default].
[targets.default]
description = "cpu_all_live: full VeeR EL2 CPU; m_axi + j_axi always live (fallback for all cpu tests)"
build_dir = "hw/sys/sep/dv/build/cocotb"   # per-tool subdir appended: cocotb/<tool>
defines = [
  # SYNTHESIS no-ops every `ifndef SYNTHESIS` concurrent-assertion / cover block
  # (prim_assert.sv ASSERT/ASSUME, prim_alert_sender sequences, kmac sha3pad
  # `##[1:$]`), which Verilator cannot parse. Only assertion/debug code is gated.
  "SYNTHESIS",
  "SEP_SMN_INBOUND_AXI_LIVE",
  "SEP_JTAG_AXIL_LIVE",
]
# abr_wrapper_key_reg stub swap is DUT-wide ([build].exclude_files + sources):
# sep_crypto_abr_wrapper instantiates u_abr_key_csr again; Verilator still cannot
# compile the PeakRDL-generated block (see shims/crypto/abr_wrapper_key_reg_stub.sv).

[targets.default.tools.verilator]
flags = [
  # PeakRDL reg blocks reset their axil_resp_buffer struct-array via an NBA in a
  # for-loop (incl. the read-target sep_cpu_ctrl_reg) -> Verilator BLKLOOPINIT,
  # suppressed here (the loop-style reset is functionally correct for the read path).
  "-Wno-BLKLOOPINIT",
  "-Wno-UNUSEDSIGNAL",
  "-Wno-UNUSEDPARAM",
]

# rom_boot: default (full VeeR CPU) + a behavioral SMC AXI responder for the
# real-ROM non-secure boot test. SEP_SMC_MEM_MODEL enables an axi_sim_mem on the
# SEP->SMC AXI (sep_ext_to_smc_axi, tied off in the default TB) so the Boot ROM's
# SMC scratch/SRAM accesses (scratch round-trip, manifest fetch) get real R/W
# responses. Scoped to this target so the shared default/no_cpu Verilator models
# do not compile the sim-only axi_sim_mem. See sep-rom-non-secure-boot-design.md.
[targets.rom_boot]
description = "cpu_all_live + behavioral SMC AXI responder (axi_sim_mem) for the real-ROM non-secure boot test"
build_dir = "hw/sys/sep/dv/build/rom_boot/cocotb"
defines = [
  "SYNTHESIS",
  "SEP_SMN_INBOUND_AXI_LIVE",
  "SEP_JTAG_AXIL_LIVE",
  "SEP_SMC_MEM_MODEL",
]
sources = [
  "vendor/pulp-platform/axi/upstream/src/axi_sim_mem.sv",
]

[targets.rom_boot.tools.verilator]
flags = [
  "-Wno-BLKLOOPINIT",
  "-Wno-UNUSEDSIGNAL",
  "-Wno-UNUSEDPARAM",
]

# CPU-stub model: SEP_CPU_STUB drops the VeeR EL2 core (shims/cpu/sep_cpu_stub.sv
# reproduces the LSU ROM/xbar demux verbatim) so the cocotb AXI driver owns the CPU-LSU
# splice. ~1.66x faster sim; runs every no_cpu test. m_axi + j_axi are always live here
# too (tb_top), so inbound-filter tests run on this model. Cannot run cpu run-mode tests.
[targets.lsu_stub_all_live]
description = "lsu_stub_all_live: CPU stubbed (no VeeR EL2, LSU demux preserved); m_axi + j_axi live; for no_cpu tests"
build_dir = "hw/sys/sep/dv/build/cocotb"
defines = ["SYNTHESIS", "SEP_CPU_STUB", "SEP_SMN_INBOUND_AXI_LIVE", "SEP_JTAG_AXIL_LIVE"]
# Drop the real CPU wrapper from the bender filelist and append the stub after it (so all
# DUT packages are declared ahead of the stub); the stub is the only sep_cpu definition.
exclude_files = [
  "hw/sys/sep/rtl/sep_cpu.sv",
]
sources = [
  "hw/sys/sep/dv/shims/cpu/sep_cpu_stub.sv",
]

[targets.lsu_stub_all_live.tools.verilator]
flags = ["-Wno-BLKLOOPINIT", "-Wno-UNUSEDSIGNAL", "-Wno-UNUSEDPARAM"]
