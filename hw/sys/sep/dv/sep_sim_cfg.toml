# SPDX-License-Identifier: Apache-2.0
#
# SEP OSS simulation config (native build/filelist manifest).
# DUT = `sep_wrapper` (the bare `sep` core plus its IP integration); vendor-clean
# by construction (bender_targets exclude "simulation").

schema_version = 1

# Launch entry: selected by `--dut sep`. Two run modes: no_cpu, where a cocotbext-axi
# AxiMaster drives the CPU LSU bus (the stub is its sole driver) to exercise the SEP
# register/fabric map, and cpu, where VeeR EL2 boots firmware. The shared stage
# graph + tool list come from profile = "native" (Verilator is the verified OSS backend).
name = "sep"
profile = "native"
description = "SEP (Security Processor) OSS cocotb DV flow (no_cpu AXI + cpu firmware boot)"
# Verilator remains the pre-merge acceptance backend. VCS/Xcelium are supported by
# the native cocotb runner for development iteration and share the same OSS-safe
# filelist/stub injection.
default_tool = "verilator"
tools = ["verilator", "xcelium", "vcs"]

[testlist]
path = "testlists/all.toml"
format = "toml_list"

# The vendored adams_bridge abr_reg has two immediate assertions on
# external_wr_ack / external_rd_ack (abr_reg.sv). They fire once at t=0 fs,
# before reset releases, because the ack strobes are still X and an X fails
# `assert(!ack || ...)`. Benign X-init in third-party IP whose datapath OSS DV
# does not exercise.
#
# They live in the POST-reset branch of an always_ff, so they are REAL runtime
# protocol checks -- waiving them by file:line alone would also hide a genuine
# runtime violation. Two patterns are therefore needed, and they work as a pair:
#
#   ignore    -- drops the "Error:" line, which VCS prints WITHOUT a timestamp.
#   hard-fail -- the companion line DOES carry the timestamp
#                ("...abr_reg.sv", 67: ...: started at 0fs failed at 0 fs).
#                Matching "failed at <non-zero>" turns any post-time-0 firing of
#                those exact assertions back into a hard failure.
#
# So the t=0 X-init noise is waived and nothing else is: a real runtime abr_reg
# violation still fails the run, loudly, on the timestamped line.
#
# ($assertoff in the TB does not work here -- it races the always_ff's own
# time-0 evaluation and the assertion fires first.)
[pass_fail]
extra_ignore_patterns = [
  'abr_reg\.sv.*at time 0',
  'abr_reg\.sv", (67|69):',
]
extra_hard_fail_patterns = [
  'abr_reg\.sv", (67|69):.*failed at [1-9]',
]

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "hw/sys/sep/dv/build"]

[build]
# Native build is driven by the Bender/filelist keys below.
top_module = "sep_uvm_top"
top_file = "hw/sys/sep/dv/tb/tb_top.sv"
# Extra tb sources compiled alongside tb_top: the outbound mailbox console/PASS
# monitor. The sep_wrapper DUT, its IP-integration models, and the eFuse
# models come from the Bender closure (`sep_wrapper` plus the `any(sep, smc)`
# groups). Excluded for OSS hygiene: proprietary IPs in nonfree. The wrapper
# SPI uses struct ports; the pad-mux shim is not in this filelist.
sources = [
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_regs.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_mul.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_fast_mul.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_div.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_axi_adapter.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_axi.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_wb.sv",
  "hw/sys/sep/dv/tb/sep_outbound_mbx.sv",
  # FCOV covergroup sampler (VCS only; the module is `ifndef VERILATOR`).
  "hw/sys/sep/dv/cov/sv/sep_fcov.sv",
  # Clean-room AXI4 protocol checker, instantiated on the m_axi and s_axi
  # buses at the foot of tb_top. The Verilator targets pass no --assert, so
  # Verilator drops its two-state rules; the X-hygiene rules are gated by
  # OCAH_INC_ASSERT, which Verilator does not define. The rules are live
  # under VCS.
  "hw/common/dv/vip/ocah_axi_vip/sva/ocah_axi_sva.sv",
]
# `stubs` are OVERRIDE sources. Where the runner puts them is tool-dependent
# (tools/dv/runlib/stages.py), and the one below only takes effect under Verilator:
#   * Verilator (-Wno-MODDUP, FIRST definition wins) keeps the stub and emits it AHEAD of the
#     bender filelist, so it shadows the real RTL.
#   * VCS (LAST definition wins) DROPS any stub whose basename still appears in the bender
#     filelist -- a stub that has lagged the real port list would otherwise bind silently and
#     fail elaboration -- and emits the survivors after it. The stub below is therefore inert
#     under VCS, which is intended: the real entropy_ring_oscillator elaborates and simulates
#     correctly there.
# To make a stub bind under VCS too, drop the real file via `exclude_files`, the way the
# abr_wrapper_key_reg stub above does.
#
# SEP's two-stage synchronizers are OpenTitan prim_flop_2sync, which nothing stubs here. The analog entropy_ring_oscillator supplies
# a defined idle value under Verilator, which ignores the `#1` stage delays the ring needs to
# oscillate.
#
# The sep_cpu stub is NOT prepended: it imports DUT packages (sep_pkg/el2_pkg) that are declared
# only inside the bender filelist, so a prepended copy would reference them before declaration.
# Instead the CPU-stub targets exclude the real hw/sys/sep/rtl/sep_cpu.sv from the bender filelist (via a
# per-target `exclude_files`) and append shims/cpu/sep_cpu_stub.sv through their `sources` list,
# where every DUT package is already declared. The stub is then the single sep_cpu definition (no
# MODDUP), and the full-CPU `default` target keeps the real sep_cpu untouched.
stubs = [
  "hw/sys/sep/dv/shims/analog/entropy_ring_oscillator.sv",
]
filelist = "hw/sys/sep/dv/build/sep_dut_compile.f"
bender_filelist = "hw/sys/sep/dv/build/sep_bender.f"
work_dir = "hw/sys/sep/dv/build"
# Vendor-clean target set (verify with check_no_vendor_paths.py).
# NEVER add "simulation" -- it pulls licensed I/O and a foundry padring.
common_bender_targets = [
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "register_interface_l1",
]
# `sep_wrapper` adds hw/top/sep_{wrapper,ip_integration}.sv plus the vendored
# prim_ram_1p/prim_ram_1p_adv/prim_rom memory models the IP integration needs.
bender_targets = ["sep", "sep_el2", "sep_wrapper"]
# hw/common/assert carries ocah_assert.svh, included by the AXI protocol SVA.
# hw/sys/sep/regs/gen/svh carries the generated register header sep_fcov
# includes for CSR addresses, reset values, and field masks.
incdirs = [
  "hw/sys/sep/dv/tb",
  "hw/common/assert",
  "hw/sys/sep/regs/gen/svh",
]

[build.options]
# SEP is a large cold build (VeeR EL2 + OTBN + full crypto). Parallelize the
# Verilator + C++ compile and split codegen into many TUs so g++ runs concurrently.
#
# Partition the build dir by input fingerprint so the two daily targets
# (default / lsu_stub_all_live) coexist instead of clobbering one shared model on
# every target switch. Each unchanged target then reuses its build; only a config
# or source change rebuilds it.
cache_enabled = true

[build.verilator]
# Keep the inherited output_split = 0 default. The SEP model's root header is ~25 MB and is included
# by every C++ TU, so fewer/larger TUs build faster than many small ones for this DUT.
ccache = true
# Replace cocotb's global --public-flat-rw with a scoped Verilator public config that exposes only
# the tb top (sep_uvm_top) to cocotb. Global public marks every signal public, which disables the
# AXI fabric split_var pragmas (rr_arb_tree/lzc/axi_demux) and leaves false combinational SCCs
# whose ICO settle region wedges Verilator. Scoping to the tb top keeps the fabric optimisable.
# The runner integration drops the global flag and injects this file; see runlib
# cocotb_public_scope().
public_scope = "hw/sys/sep/dv/sep_public_scope.vlt"
# Disable Verilator's DFG (data-flow-graph) optimisation pass. The eFuse AXI-Lite
# write path (efuse_interface_controller -> prim_axi_lite_to_apb_single ->
# axi_lite_to_apb) carries a circular combinational ready/valid loop on the APB
# response (apb_resp_i). With DFG enabled, the optimiser folds the loop signals and
# the optimised build settles the OTP-program register write to a hung fixed point:
# the AXI B-response for the EFUSE_PROGRAM_CTRL write never returns (reads converge,
# only the write deadlocks). A build that keeps those signals (--trace, or -fno-dfg)
# settles the loop to the fixed point the RTL specifies, as VCS does.
extra_args = ["-fno-dfg"]

[coverage.vcs]
# Restate the simulator defaults (`-cm`, `-cm_dir`) because a DUT table replaces
# the list rather than appending to it, then add the scope file.
#
# VCS-only because only this table applies the compile-time scope. A `--cov`
# run on another simulator grades an unscoped denominator. Coverage runs take
# `--target default` (one full-CPU elaboration; no_cpu force-splices the LSU
# VIP). Edit `sep_cov_scope.hier` then `--rebuild` -- the file is not
# fingerprinted.
#
# Scope has to be applied at COMPILE time. `urg -hier` prunes the report pages
# but still computes the headline score over the whole database, so the only way
# to keep the testbench out of the number is to keep it out of the database:
# `-cm_hier` limits what gets instrumented. That also shrinks the per-leaf
# databases and the sim time.
#
# The per-leaf dump is the inherited `[vcs.coverage_defaults].sim_args`
# (`-cm` + `-cm_dir {cov_dir}/simv.vdb`). Do not restate it here: an identical
# list is a deprecated duplicate and the runner refuses the config.
#
# The cocotb VCS runner renders compile-time `{build_cov_dir}` at the
# unfingerprinted coverage dir (`…/coverage/cov_build.vdb`). The default
# design_artifact (`{build_cov_dir}`) is next to `simv` under the fingerprint,
# so the post-compile check looks in a directory the compile does not write.
# Point the check at the database the compile actually writes.
design_artifact = "{build_dir}/../cov_build.vdb"

# Assertion coverage is collected and scored whatever the `-cm` list says: in
# this VCS version `-cm assert` does not gate it, and the compile-time
# `-cm_common_hier` below is what keeps it inside the graded hierarchy. So the
# metric is dropped HERE, at report time, which is the only place that works.
#
# Why it is dropped: SEP assertions are predominantly negative controls, where
# the implication antecedent is an illegal condition. This environment drives
# legal stimulus only, so those assertions can never record a successful
# attempt. They are uncoverable by construction rather than by a stimulus gap,
# and grading them reports the absence of traffic the stimulus policy forbids.
#
# This changes the SCORE only. Every assertion stays compiled, evaluating and
# able to fail a test; nothing here touches checking. Restore `+assert` to the
# metric list if SEP ever gains an illegal-stimulus environment.
#
# Overrides the shared [vcs] report_cmd in hw/common/dv/configs/simulators.toml
# by adding `-metric`; the rest of the command is copied from it verbatim.
report_cmd = [
  "urg", "-full64",
  "-dir", "{merged}",
  "-report", "{report}",
  "-format", "both",
  "-metric", "line+cond+tgl+fsm+branch+group",
]
compile_args = [
  "-cm",
  "line+cond+tgl+fsm+branch+assert",
  "-cm_dir",
  "{build_cov_dir}",
  "-cm_hier",
  "{repo_root}/hw/sys/sep/dv/cov/config/vcs/sep_cov_scope.hier",
  # Extends the SAME scope file from code coverage to assertion coverage.
  # `-cm_hier` alone governs line/cond/fsm/tgl/branch only, so without this the
  # excluded hierarchy leaves the code metrics but remains graded for
  # assertions. `-cm_common_hier` is a Limited Customer Availability feature;
  # VCS refuses the compile without `-lca` ("The '-cm_common_hier' flow requires
  # a special option"), which is the opt-in switch.
  "-lca",
  "-cm_common_hier",
]

[coverage.verilator]
# Not the graded number. Only [coverage.vcs] applies the compile-time scope.
# `--cov --tool verilator` fails C++ compile on 5.046 (`__PVT__MLKEM_SHARED_KEY`
# under `VM_COVERAGE=1`); 5.050 compiles.
# Toggle stays off: on this model it is ~95% of the database (~0.5 GB per leaf)
# and the costliest sim instrumentation. Replaces the simulator-default
# `--coverage`.
# --output-groups 0 compiles the generated .cpp files one by one instead of
# in --build-jobs groups. Verilator groups by file count, and on a
# coverage-instrumented model one group can become a translation unit of
# several hundred MB that a hosted runner cannot compile (measured on SMC).
build_args = ["--coverage-line", "--coverage-expr", "--coverage-user", "--output-groups", "0"]

[frameworks.cocotb]
# Flow-first layout: cocotb env/seq_lib/tests live under cocotb/, the SV-UVM
# realization under its uvm/ sibling. python_root puts env/ + seq_lib/ on the
# import path.
python_root = "hw/sys/sep/dv/cocotb"
test_dir = "hw/sys/sep/dv/cocotb/tests"
# Shared cocotb VIP (ocah_spi_vip, ocah_axi_vip, ...) lives at hw/common/dv/vip;
# add it to the import path so tests can `from ocah_spi_vip import OcahSpiFlash`.
python_paths = [
  "hw/common/dv/vip",
  "hw/ip/entropy_source/dv/cocotb",
  # env/ on the path so SEP-only golden models can import siblings by bare name.
  "hw/sys/sep/dv/cocotb/env",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

[c_build.default]
# EL2 firmware images are generated by the runlib c_compile stage and consumed by
# CPU boot tests through sep_base_test.boot_firmware(). The build goes through the
# shared DV firmware engine (hw/common/dv/fw/compile.mk, driven by fw/fw.mk), which
# emits the gitignored .itcm/.dtcm hex images under fw/build/tests/<target>/ from
# tracked test/driver source.
#
# Toolchain: the caller's RISCV_TOOLCHAIN/RISCV_PREFIX wins when that gcc has
# picolibc. Otherwise the stage builds through scripts/docker-run.sh run-here.
# There is no site or home-directory probe. argv goes through str.format() for
# {fw_target}, and the runlib rejects any other placeholder -- including a
# doubled ${{...}} -- so shell brace expansion is unavailable here. Concatenate
# with quoting instead: "$RV_PFX"gcc.
#
# RISCV_TOOLCHAIN + RISCV_PREFIX is the ONLY toolchain contract the shared
# engine accepts (hw/common/dv/fw/compile.mk). When RISCV_TOOLCHAIN is given
# without RISCV_PREFIX we still probe that directory for both tool names.
#
# PICOLIBC IS THE REAL GATE. compile.mk builds with --specs=picolibc.specs.
# Use `run-here`, not `run`: `run` remaps the repo to /work, so
# OCAH_ROOT="$PWD" does not resolve inside the container. Unset
# RISCV_TOOLCHAIN/RISCV_PREFIX on the container fallback so compile.mk uses
# the image gcc on PATH.
#
# bwrap forwards the caller environment. `uv run` exports UV as the host
# binary and preamble.mk keeps it, so the rom_only post-process
# (elf-to-vmem.py, which imports pyelftools) cannot use that path. Drop UV
# and VIRTUAL_ENV, and keep uv's project environment, cache and interpreters
# under local/. The container engine does not forward those variables; that
# image has no uv, so this post-process still needs the sandbox uv on PATH
# rather than python3.
cwd = "."
argv = [
  "bash",
  "-lc",
  "set -e; RV_TC=\"$RISCV_TOOLCHAIN\"; RV_PFX=\"$RISCV_PREFIX\"; if [ -z \"$RV_PFX\" ]; then RV_PFX=riscv64-unknown-elf-; if [ -n \"$RV_TC\" ] && [ ! -x \"$RV_TC/riscv64-unknown-elf-gcc\" ] && [ -x \"$RV_TC/riscv-none-elf-gcc\" ]; then RV_PFX=riscv-none-elf-; fi; fi; MK=\"dv-fw-tests TEST={fw_target}\"; if [ -n \"$RV_TC\" ] && \"$RV_TC/$RV_PFX\"gcc -specs=picolibc.specs -E - </dev/null >/dev/null 2>&1; then exec make -C hw/sys/sep/dv/fw -f fw.mk $MK OCAH_ROOT=\"$PWD\" RISCV_TOOLCHAIN=\"$RV_TC\" RISCV_PREFIX=\"$RV_PFX\"; elif [ -x scripts/docker-run.sh ]; then echo \"[c_compile] no caller RISCV_TOOLCHAIN with picolibc; building in the OCAH toolchain container\"; exec env -u RISCV_TOOLCHAIN -u RISCV_PREFIX -u UV -u VIRTUAL_ENV UV_PROJECT_ENVIRONMENT=\"$PWD/local/bwrap-venv\" UV_CACHE_DIR=\"$PWD/local/bwrap-uv-cache\" UV_PYTHON_INSTALL_DIR=\"$PWD/local/bwrap-uv-python\" ./scripts/docker-run.sh run-here make -C hw/sys/sep/dv/fw -f fw.mk $MK OCAH_ROOT=\"$PWD\"; else echo \"error: set RISCV_TOOLCHAIN to a picolibc-enabled RISC-V toolchain, or provide scripts/docker-run.sh\" >&2; exit 1; fi",
]
outputs = [
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.dtcm.hex",
  # ELF + nm listing (same link, produced unconditionally by compile.mk): the
  # CPU trace monitor symbolizes retired PCs from the .sym, and staging both
  # keeps sim-only reruns and post-mortem symbolization hermetic in the run dir.
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.tcm.elf",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.tcm.sym",
]

[c_build.boot_rom]
# The SEP Boot ROM (hw/sys/sep/bootrom/prod) is NOT built by the shared firmware
# engine -- it drives its own Makefile, links to ROM_BASE instead of the TCMs, and
# additionally packs a manifest+BL1 image. Tests select it with
# `firmware = { name = "boot_rom", mode = "boot_rom" }`, which is what makes
# `--stage sim` fail loudly with "firmware outputs missing" instead of silently
# simulating against a stale or absent image.
#
# Two halves, split by TOOL dependency, so they cannot collapse into one command:
#   toolchain-images  needs the RISC-V toolchain WITH picolibc (the generated
#                     register headers close their packing checks with
#                     static_assert, i.e. <assert.h>, which is not freestanding).
#   oca-images        is pure Python and must run on the HOST: the packer's deps
#                     come from the tt-oca-manifest submodule's pyproject.toml via
#                     uv, and the ocah-toolchain image carries neither.
#
# Toolchain: an explicit $RISCV_TOOLCHAIN, or the OCAH container via
# scripts/docker-run.sh run-here. This block does not probe site, PATH, or
# $HOME toolchains. GCC_PREFIX differs from the engine's RISCV_PREFIX: this
# Makefile spells `$(GCC_PREFIX)-gcc`, so the value carries no trailing dash.
# Passing it as a full path prefix keeps PATH untouched. Make propagates
# command-line variables to sub-makes, so the recursive OTBN-app and
# bl1_pass_test builds inherit the same toolchain.
#
# NOTE: as in [c_build.default], argv goes through str.format() and the runlib
# rejects every placeholder except {fw_target} -- braces of any kind, including
# shell ${...} expansion, are unavailable here. Use "$VAR" and $(...) instead.
# DCCM_SCRUB_BYTES is left at the product default here, as in every
# boot_rom variant: vector.S's scrub establishes DCCM's ECC itself, which is what
# happens on silicon, so the testbench does not stand in for it.
cwd = "."
argv = [
  "bash",
  "-lc",
  "set -e; RV_TC=\"$RISCV_TOOLCHAIN\"; RV_PFX=\"$RISCV_PREFIX\"; if [ -z \"$RV_PFX\" ]; then RV_PFX=riscv64-unknown-elf-; if [ -n \"$RV_TC\" ] && [ ! -x \"$RV_TC/riscv64-unknown-elf-gcc\" ] && [ -x \"$RV_TC/riscv-none-elf-gcc\" ]; then RV_PFX=riscv-none-elf-; fi; fi; ROM_DIR=hw/sys/sep/bootrom/prod; make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= key-digests; if [ -n \"$RV_TC\" ]; then GCC_P=$(printf %s \"$RV_PFX\" | sed 's/-$//'); make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= SEP_ENTROPY_BRINGUP=1 toolchain-images-build GCC_PREFIX=\"$RV_TC/$GCC_P\" RISCV_TOOLCHAIN=\"$RV_TC\" RISCV_PREFIX=\"$RV_PFX\"; elif [ -x scripts/docker-run.sh ]; then echo \"[c_compile] RISCV_TOOLCHAIN is unset; building the boot ROM in the OCAH toolchain container\"; env -u RISCV_TOOLCHAIN -u RISCV_PREFIX -u MAKEFLAGS -u MFLAGS ./scripts/docker-run.sh run-here make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= RISCV_PREFIX=riscv64-unknown-elf- GCC_PREFIX=riscv64-unknown-elf SEP_ENTROPY_BRINGUP=1 toolchain-images-build; else echo \"error: scripts/docker-run.sh is required when RISCV_TOOLCHAIN is unset\" >&2; exit 1; fi; make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= oca-images",
]
outputs = [
  "hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "hw/sys/sep/bootrom/prod/build/boot_rom.itcm.hex",
  "hw/sys/sep/bootrom/prod/build/boot_rom.dtcm.hex",
  # nm listing for the CPU trace monitor's ROM-PC symbolization.
  "hw/sys/sep/bootrom/prod/build/boot_rom.sym",
  # The SMC-SRAM test loads this with +sep_smc_mem_hex: the OCA manifest rebased
  # to the SMC-SRAM base.
  "hw/sys/sep/bootrom/prod/build/oca_smc_mem.hex",
]

[c_build.boot_rom_ot]
# The same Boot ROM sources built for the OpenTitan SPI host instead of the SPI
# stub, landing in build_ot/ so both variants coexist. The variant knobs live in
# the Makefile's ot-* targets, not here, so this template only owns the
# host-vs-container decision -- see [c_build.boot_rom] for why that split exists
# and for the no-braces constraint on argv (str.format rejects every placeholder
# except {fw_target}, so use "$VAR" and $(...), never shell ${...}).
#
# The host-vs-container decision below is identical to [c_build.boot_rom]:
# explicit $RISCV_TOOLCHAIN or docker-run.sh run-here, with no implicit probe.
#
# oca-images runs into build_ot/ too, so oca_non_secure_boot.bin -- the raw image
# the cocotb flash BFM preloads -- sits beside the ROM it is read by, and a stale
# default-variant image can never be picked up by mistake.
#
# NONFREE_ROOT= is load-bearing, not tidiness. reg_includes.mk puts the nonfree
# register headers on the include path whenever a nonfree/ checkout exists.
# The open-tree ROM must not compile against those headers: a workspace that
# has both would otherwise pick up nonfree symbols the pure-open DUT does not
# implement. Forcing NONFREE_ROOT= keeps the ROM image matched to this DUT.
#
# NONFREE_BOOTCODE_SOURCES= is load-bearing for the same reason, and separately:
# the ROM Makefile takes it with ?=, so a companion-supplied value in the
# environment survives NONFREE_ROOT= and links a driver for hardware outside this
# DUT. The SPI pad mux is the case that bites -- its store lands in an
# unimplemented sep_external aperture, the bus error raises NMI, and the CPU
# leaves the boot flow through the reset NMI vector in ICCM. Clearing both keeps
# the linked bootcode to what the open DUT implements.
# DCCM_SCRUB_BYTES is left at the product default (0x20000, matching vector.S's
# own #ifndef fallback). vector.S scrubs all 128KiB of DCCM before the C runtime
# starts, and because a store writes its ECC, that scrub is what establishes
# DCCM's ECC state -- on silicon, where DCCM powers up with random contents and
# random ECC, and here.
#
# Overriding it to 0 and letting the testbench's backdoor TCM load supply ECC
# instead (tb_top.sv writes bd_riscv_ecc32 alongside every preloaded word) would
# substitute the testbench for firmware on a step the firmware owns, and would
# mask the ROM's own check: the preload would place the correct g_data_init
# value into DCCM, which is exactly what rom_check_runtime_init_or_fail() reads
# to prove vector.S's .data copy ran, so a broken copy loop would pass unnoticed.
# The scrub adds a negligible fraction of a boot run's cycles.
cwd = "."
argv = [
  "bash",
  "-lc",
  "set -e; RV_TC=\"$RISCV_TOOLCHAIN\"; RV_PFX=\"$RISCV_PREFIX\"; if [ -z \"$RV_PFX\" ]; then RV_PFX=riscv64-unknown-elf-; if [ -n \"$RV_TC\" ] && [ ! -x \"$RV_TC/riscv64-unknown-elf-gcc\" ] && [ -x \"$RV_TC/riscv-none-elf-gcc\" ]; then RV_PFX=riscv-none-elf-; fi; fi; ROM_DIR=hw/sys/sep/bootrom/prod; make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= BUILD_DIR=build_ot key-digests; if [ -n \"$RV_TC\" ]; then GCC_P=$(printf %s \"$RV_PFX\" | sed 's/-$//'); make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= BUILD_DIR=build_ot BOOT_SPI_CONTROLLER_OT=1 SEP_ENTROPY_BRINGUP=1 toolchain-images-build GCC_PREFIX=\"$RV_TC/$GCC_P\" RISCV_TOOLCHAIN=\"$RV_TC\" RISCV_PREFIX=\"$RV_PFX\"; elif [ -x scripts/docker-run.sh ]; then echo \"[c_compile] RISCV_TOOLCHAIN is unset; building the OT boot ROM in the OCAH toolchain container\"; env -u RISCV_TOOLCHAIN -u RISCV_PREFIX -u MAKEFLAGS -u MFLAGS ./scripts/docker-run.sh run-here make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= BUILD_DIR=build_ot BOOT_SPI_CONTROLLER_OT=1 RISCV_PREFIX=riscv64-unknown-elf- GCC_PREFIX=riscv64-unknown-elf SEP_ENTROPY_BRINGUP=1 toolchain-images-build; else echo \"error: scripts/docker-run.sh is required when RISCV_TOOLCHAIN is unset\" >&2; exit 1; fi; make -C \"$ROM_DIR\" NONFREE_ROOT= NONFREE_BOOTCODE_SOURCES= oca-images",
]
outputs = [
  "hw/sys/sep/bootrom/prod/build_ot/boot_rom.vmem",
  "hw/sys/sep/bootrom/prod/build_ot/boot_rom.itcm.hex",
  "hw/sys/sep/bootrom/prod/build_ot/boot_rom.dtcm.hex",
  # nm listing for the CPU trace monitor's ROM-PC symbolization.
  "hw/sys/sep/bootrom/prod/build_ot/boot_rom.sym",
  # OCA boot-manifest images -- the format the ROM parses. Listed so --stage sim
  # fails loudly on a stale image instead of simulating one. These are the
  # `oca-images` outputs the ROM tests actually load: the rest of what the target packs
  # belongs to the virtual platform's suite and has no consumer under hw/sys/sep/dv, so
  # declaring them here would gate this stage on artifacts no test in it reads.
  "hw/sys/sep/bootrom/prod/build/oca_non_secure_boot.bin",
  "hw/sys/sep/bootrom/prod/build/oca_secure_boot.bin",
  "hw/sys/sep/bootrom/prod/build/oca_encrypted_boot.bin",
  "hw/sys/sep/bootrom/prod/build/oca_otp_key_boot.bin",
  # Per-slot signed images. The ROM-key revoke families graft one slot out of these
  # (sep_manifest_mutate.rom_key_image / graft_slot) so the slot under test is signed by
