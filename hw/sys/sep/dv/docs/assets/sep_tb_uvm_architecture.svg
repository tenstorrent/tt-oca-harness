<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="880" viewBox="0 0 1270 880" role="img" aria-labelledby="title desc">
  <title id="title">SEP SV-UVM testbench architecture</title>
  <desc id="desc">The scenario virtual sequence runs on the active AXI VIP master, which drives the CPU load/store splice of sep_wrapper through lsu_master_vif. A passive mirror monitor feeds the sep_cpu_ctrl CSR reference model and the scoreboard. sep_tb_if carries clocks, reset and status. The protocol SVA, the scoreboard and the shared checker report into the UVM verdict.</desc>
