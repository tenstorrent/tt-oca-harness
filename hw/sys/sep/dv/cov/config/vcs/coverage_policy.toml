#
# SEP VCS coverage policy: scope only -- which hierarchy the code-coverage report
# grades -- with no [[thresholds]] and no [[holes]]: a threshold without an agreed
# score target would fail runs without saying anything true.
#
# Scope is NOT owned here. `-cm_hier` + `-cm_common_hier` at compile time decide
# what enters the database and therefore what the number means; the entry below
# is the report-time half, which only keeps the pages aligned with that scope.
# `--run-dir <dir> --stage cov_report` re-renders the pages from the same merged
# database, but it cannot widen or narrow the score. `--run-dir <dir> --waive`
# re-grades the rendered report against this file's [[holes]] and
# [[thresholds]] without running urg; it exits 2 when this [[native_files]]
# entry's digest differs from the one the report recorded.

schema_version = 1
dut = "sep"
scope_epoch = "sep-code-cov-v2b"

# Report-page pruning only. `urg -hier` drops rows from the report but scores
# the whole database regardless, so this entry keeps the pages aligned with the
# instrumented scope and records the file's hash in the manifest; it does not
# produce the number. The number's scope comes from `-cm_hier` at compile time.
[[native_files]]
tool = "vcs"
role = "scope"
path = "sep_cov_scope.hier"
apply_phase = "report"
# `-cm_common_hier` is the report-time half of the compile-time pairing: it makes
# `-hier` prune assertion pages as well as code pages, so the report matches the
# instrumented scope instead of showing assertion rows for excluded hierarchy.
args = ["-hier", "{path}", "-cm_common_hier"]

# Point-level structural ties in the PeakRDL-generated regblocks. Hierarchy-level
# scope lives in sep_cov_scope.hier; this file waives individual coverage objects
# inside blocks that stay graded, which `-hier` cannot express.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "sep_regblock_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# External-TRNG AXI-Stream payload. The stream has no master in this
# elaboration -- sep_ip_integration.sv:773 ties the request struct to zero in
# RTL, not in the testbench -- so tvalid/tdata/tstrb cannot present a second
# value on any of the three modules the struct crosses. The source-select mux
# that consumes the stream is deliberately NOT in this file: its select is a
# CSR field, so both arms stay graded.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "sep_ext_trng_payload_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Structurally tied inputs on the TT-owned SEP DMA wrapper. Each entry names
# the RTL tie. Stimulus gaps stay in the denominator. Checksums come from
# `urg -dump full_exclusions tgl` on the merged VDB, never by hand.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "sep_unreachable_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]
