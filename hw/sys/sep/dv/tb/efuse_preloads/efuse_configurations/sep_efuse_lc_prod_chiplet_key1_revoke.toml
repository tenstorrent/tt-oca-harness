# PROD lifecycle, CHIPLET fused key 1 programmed, ROM development key 0 revoked, CHIPLET fused key 1 REVOKED.
#
# Stimulus for sep_firmware_chiplet_pubkey_1_revoke_test.
#
# THREE THINGS ARE PROGRAMMED, AND EACH ONE CLOSES A DIFFERENT HOLE.
#
# 1. CHIPLET_PUBK_HASH1 holds SHA-256 of the dev0 RSA-3072 modulus -- the same
#    digest the ROM has compiled in at key_digests.c -- because that is the
#    only RSA-3072 private key this tree ships
#    (bootrom/prod/tools/tt-boot-manifest/tests/signing_keys/, whose other file
#    ec_private_key.pem the ROM cannot use). The reference generates a DEDICATED
#    key per fused slot and signs with it, so its fused digest differs from its
#    ROM-slot digest. Here they are
#    equal, and the consequence is stated in the testcase docstring: the digest
#    comparison alone cannot prove which arm of validate_signature ran. Items 2 and
#    3 are what close that.
#
#    The value is the LITTLE-ENDIAN serialisation of the digest, because
#    read_fuse_key() (manifest_crypto.c) rebuilds the 32-byte key from
#    eight mmio_read32() results, byte 0 first, and SepEfuseImage.set_int()
#    (sep_efuse_image.py) fills word i from bits [32i+31:32i].
#
# 2. CHIPLET_PUBK_HASH0 holds a DECOY: the same digest with bit 0 of byte 0
#    flipped. It is non-zero, so a ROM that addressed the WRONG chiplet fuse would
#    pass read_fuse_key()'s non-zero test and fail check_pubkey_hash() with
#    PUBK_HASH_MISMATCH instead of booting. A ROM that derives the digest
#    addresses as CHIPLET_PUBK_REVOKE + 0x100/0x120 reads the wrong words and is
#    refused here.
#
# 3. CHIPLET_PUBK_REVOKE bit 0 revokes ROM key slot 0. On the correct ROM this is
#    INERT -- the manifest selects a fused key, so the ROM-key arm
#    (manifest_crypto.c) is never entered and bit 0 is never tested. It is
#    a counterfactual: a ROM that ignored public_key_sel.selection and took the
#    ROM-key arm with index 0 would print KEY_REVOKED idx=0x00000000 and refuse the
#    image, which every member of this family forbids. It is also the
#    architecturally intended configuration for a fused-key part --
#    sep_efuse_map.rdl:727 says "Before the chiplet owner transfers a part to the
#    customer, the development-key bits shall be set (revoked)."
#
# Bits 16 and 17 revoke CHIPLET_PUBK_HASH0 and HASH1 (sep_efuse_map.rdl:727). They
# are disjoint from the ROM-slot bits [7:0]; nothing here is derived by counting
# past ROM slot 5. The reference uses bits 6 and 7, which are unused ROM-slot
# bits in THIS map -- do not copy them.
#
# BL1_VERSION and SBOOT_DIS stay 0: the rollback check runs before key selection
# (manifest_crypto.c) and SBOOT_DIS would skip the crypto chain
# altogether, so either one would preempt the path under test.
#
# THE REVOKING MEMBER. Bit 17 refuses CHIPLET fused key 1 in manifest_crypto.c,
# before read_fuse_key() and before rsa_3072_verify() run. The image this
# preload is paired with is re-signed and provably bootable, so revocation is the
# sole cause of the rejection -- and because BOTH manifest slots select the same
# fused key, one bit refuses both and the run is terminal.

[LC_STATE]
  [LC_STATE.fields.lc_state]
  value = 0xE1   # PROD (raw=0x1)

[CHIPLET_PUBK_HASH1]
  [CHIPLET_PUBK_HASH1.fields.key_hash]
  # SHA-256(dev0 RSA-3072 modulus) = 4676d023736b5ebd5131f75b062a355e9ae1790e80c872b5ee9b0c1fff04c3e3, little-endian
  value = 0xe3c304ff1f0c9beeb572c8800e79e19a5e352a065bf73151bd5e6b7323d07646

[CHIPLET_PUBK_HASH0]
  [CHIPLET_PUBK_HASH0.fields.key_hash]
  # Decoy: the same digest with byte 0 bit 0 flipped. Non-zero: a zero fuse
  # reads as FUSE_KEY_EMPTY, a different rejection.
  value = 0xe3c304ff1f0c9beeb572c8800e79e19a5e352a065bf73151bd5e6b7323d07647

[CHIPLET_PUBK_REVOKE]
  [CHIPLET_PUBK_REVOKE.fields.select]
  value = 0x00020001   # bit 0 = ROM dev key 0; bit 17 = CHIPLET_PUBK_HASH1
