# TEST_DEV with SIP_DBG and CHIPLET_DBG open (SIP_DIS clear,
# SYS_DIS.chiplet_dbg clear). SEP debug closed: SYS_DIS.sep_debug set.
#
# Only SYS_DIS.sep_debug differs between the _sepdbg_open and _sepdbg_closed
# images.
#
# Used by sep_debug_master_target_matrix_test_sba_sepdbg_closed.

[LC_STATE]
  # Differentially encoded {~raw[3:0], raw[3:0]}: raw 0x0 (TEST_DEV) stores as
  # 0xF0. See the directory README.
  [LC_STATE.fields.lc_state]
  value = 0xF0

[SYS_DIS]
  [SYS_DIS.fields.sep_debug]
  value = 1
  [SYS_DIS.fields.chiplet_dbg]
  value = 0
