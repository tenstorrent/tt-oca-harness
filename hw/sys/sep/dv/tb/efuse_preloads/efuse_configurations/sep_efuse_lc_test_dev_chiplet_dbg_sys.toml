# TEST_DEV with CHIPLET_DBG disabled by SYS_DIS, and SIP_DIS clear.
#
# The SYS_DIS half of SEP-ROM-SB-025: either vector alone locks debug.
#
# Used by sep_rom_dbg_lock_sys_dis_refuse_test.

[LC_STATE]
  # Differentially encoded {~raw[3:0], raw[3:0]}: raw 0x0 (TEST_DEV) stores as
  # 0xF0. See the directory README.
  [LC_STATE.fields.lc_state]
  value = 0xF0

[SYS_DIS]
  [SYS_DIS.fields.chiplet_dbg]
  value = 1
