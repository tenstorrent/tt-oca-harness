# PROD lifecycle with the secure-boot chicken bit blown.
#
# Proves the ROM honours SBOOT_DIS even in PROD, which is the only reason this
# image differs from sep_efuse_lc_prod: a test that reached the non-secure path
# because the lifecycle was permissive would prove nothing about the chicken bit.
#
# Used by sep_firmware_device_cntl_non_secure_boot_flow_test and by all four PROD
# members of the [S25] demotion group, where it is one of the three surfaces
# that must move together for an unsigned primary to boot -- the other two are
# manifest fields. Those members present an UNSIGNED primary, so
# this fuse is what lets it boot at all: the SBOOT_DIS shadow reaches the
# validator through plat_is_secure_boot_disabled() (oca_platform.c) and disables
# the crypto chain the PROD lifecycle would otherwise enforce. Remove it and
# every one of them fails loudly at PUBK_ALGO_UNSUPPORTED rather than passing on
# the backup. See
# hw/sys/sep/dv/cocotb/tests/rom_fw/sep_demotion_prod_base.py.

[LC_STATE]
  [LC_STATE.fields.lc_state]
  value = 0xE1   # PROD (raw=0x1)

[SBOOT_DIS]
  [SBOOT_DIS.fields.disable_secure_boot]
  value = 0x1
