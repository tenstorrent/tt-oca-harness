# PROD lifecycle with the secure-boot chicken bit blown.
#
# Proves the ROM honours SBOOT_DIS even in PROD, which is the only reason this
# image differs from sep_efuse_lc_prod: a test that reached the non-secure path
# because the lifecycle was permissive would prove nothing about the chicken bit.
#
# Used by sep_firmware_device_cntl_non_secure_boot_flow_test and by the PROD
# members of the [C15] demotion group, where it is one of the THREE surfaces the
# reference's +SECURE_BOOT_DIS drives -- the other two are manifest fields, and
# all three must move together. Those members present an UNSIGNED primary, so
# this fuse is what lets it boot at all: secure_boot_enabled() short-circuits on
# sboot_dis in manifest_load.c, before the PROD rule. Without it every one of them
# fails loudly at BAD_SIG_TYPE rather than passing on the backup. See
# rom_fw/sep_demotion_prod_base.py.

[LC_STATE]
  [LC_STATE.fields.lc_state]
  value = 0xE1   # PROD (raw=0x1)

[SBOOT_DIS]
  [SBOOT_DIS.fields.disable_secure_boot]
  value = 0x1
