# TEST_DEV with CHIPLET_DBG disabled by SIP_DIS.
#
# A debug-locked TEST_DEV part enforces secure boot (SEP-ROM-SB-025), so the ROM
# must refuse an image whose manifest does not ask to be verified, and report
# SBOOT_DBG_LOCK at [S18].
#
# Used by sep_rom_dbg_lock_sip_dis_refuse_test and sep_rom_dbg_lock_secure_boot_test.

[LC_STATE]
  # Differentially encoded {~raw[3:0], raw[3:0]}: raw 0x0 (TEST_DEV) stores as
  # 0xF0. See the directory README.
  [LC_STATE.fields.lc_state]
  value = 0xF0

[SIP_DIS]
  # SIP_DIS has no named bitfields in the generated header, so the whole 64-bit
  # vector is written at once. CHIPLET_DBG is bit 1.
  [SIP_DIS.fields.sip_dis]
  value = 0x2
