# PROD lifecycle with ROM public-key slot 5 revoked.
#
# CHIPLET_PUBK_REVOKE.select[7:0] is the ROM chiplet-creator classical key
# bitmap (sep_efuse_map.rdl:721-729); SEP ROM tests bit N for a manifest that
# selects ROM key slot N (manifest_crypto.c:180-182). 0x20 revokes slot 5 and
# nothing else, so slot 0 -- the one the signed test image actually binds to --
# stays usable and a rejection can only be attributed to the selected slot.
#
# Everything else matches sep_efuse_lc_prod.toml: PROD so secure boot is
# enforced, SBOOT_DIS clear so nothing opts out of it, and BL1_VERSION 0 so the
# rollback check (which runs before key selection) cannot pre-empt the
# revocation verdict. Used by
# sep_firmware_backup_pubkey_rom_5_revoked_key_test.

[LC_STATE]
  [LC_STATE.fields.lc_state]
  value = 0xE1   # PROD (raw=0x1)

[CHIPLET_PUBK_REVOKE]
  [CHIPLET_PUBK_REVOKE.fields.select]
  value = 0x20   # bit 5 -> ROM public-key slot 5 revoked
