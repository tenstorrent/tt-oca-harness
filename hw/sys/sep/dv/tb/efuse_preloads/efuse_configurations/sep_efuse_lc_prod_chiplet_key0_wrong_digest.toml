# PROD lifecycle, CHIPLET fused key 0 selected, but CHIPLET_PUBK_HASH0 holds a
# DECOY digest that the manifest's modulus does not hash to.
#
# Stimulus for sep_firmware_chiplet_pubkey_0_wrong_digest_test, and the ONE
# preload in this family whose SELECTED digest fuse is WRONG.
#
# WHAT THIS CLOSES, AND WHY IT NEEDS NO SECOND PRIVATE KEY.
# sep_efuse_lc_prod_chiplet_key0.toml programs the dev0 digest into
# CHIPLET_PUBK_HASH0 because dev0 is the only RSA-3072 key this tree ships, so
# that fuse value is byte-identical to the ROM's compiled-in
# public_key_digests[0] (key_digests.c). A ROM that took the fused arm,
# tested the right revocation bit and read the right fuse address, and then
# compared the manifest modulus against public_key_digests[0] instead of the
# fuse it had just read, would boot in sep_firmware_chiplet_pubkey_0_test and be
# refused in sep_firmware_chiplet_pubkey_0_revoke_test -- exactly as expected --
# and nothing in that family could see it (the residual
# rom_fw/sep_chiplet_pubkey_base.py discloses).
#
# Distinguishing the digest SOURCE needs the SELECTED FUSE to differ from
# public_key_digests[0] plus a NEGATIVE assertion, not a second signing key:
#
#   * correct ROM: read_fuse_key() returns the HASH0 decoy, check_pubkey_hash()
#     fails on it (manifest_crypto.c), both slots refused,
#     MANIFEST_ALL_FAILED, CRYPTO_FAIL=0x00030016;
#   * ROM comparing against public_key_digests[0]: BOOTS, and the testcase fails.
#
# THESE THREE FUSE VALUES ARE IDENTICAL TO
# sep_efuse_lc_prod_chiplet_key1.toml's, AND THAT IS THE POINT. With HASH0 =
# decoy and HASH1 = the real dev0 digest, this one fuse image makes a MATCHED PAIR
# out of two testcases that differ only in the manifest's public_key_sel:
#
#   * sep_firmware_chiplet_pubkey_1_test  selects FUSE_KEY_1 -> reads HASH1 ->
#     matches -> BOOTS;
#   * sep_firmware_chiplet_pubkey_0_wrong_digest_test selects FUSE_KEY_0 ->
#     reads HASH0 -> mismatch -> REFUSED.
#
# and it makes this testcase detect TWO defect classes rather than one. A ROM that
# read the WRONG chiplet fuse -- HASH1 where HASH0 was selected -- would find the
# real digest, verify, and BOOT, so this testcase fails on that defect too. Two
# different decoys would have caught only the compiled-in-table class; leaving the
# real digest in the unselected fuse is strictly more sensitive. The cost is
# attribution, not detection: a failure here does not by itself say WHICH wrong
# source was used, and the sibling sep_firmware_chiplet_pubkey_0_test (HASH0 real,
# HASH1 decoy) is what separates them.
#
# Both digest values are the LITTLE-ENDIAN serialisation of a 32-byte digest,
# because read_fuse_key() (manifest_crypto.c) rebuilds the key from eight
# mmio_read32() results, byte 0 first, and SepEfuseImage.set_int()
# (sep_efuse_image.py) fills word i from bits [32i+31:32i]. The decoy is
# non-zero: a zero fuse would fail read_fuse_key()'s non-zero test
# (manifest_crypto.c) and produce FUSE_KEY_EMPTY (the token is at
# manifest_crypto.c), which is a different rejection reason and a different
# testcase.
#
# CHIPLET_PUBK_REVOKE bit 0 revokes ROM development key 0, exactly as in every
# other member of this family: it is the ROM-key-arm counterfactual, inert on a
# correct ROM because the manifest selects a fused key. Bits 16 and 17
# (CHIPLET_PUBK_HASH0/1, sep_efuse_map.rdl:727) stay CLEAR -- revocation must not
# be what refuses this image, or the digest comparison is never reached
# (manifest_crypto.c precedes).
#
# BL1_VERSION and SBOOT_DIS stay 0, for the same reasons as in the sibling
# preloads: the rollback check runs before key selection and SBOOT_DIS would skip
# the crypto chain altogether.

[LC_STATE]
  [LC_STATE.fields.lc_state]
  value = 0xE1   # PROD (raw=0x1)

[CHIPLET_PUBK_HASH0]
  [CHIPLET_PUBK_HASH0.fields.key_hash]
  # DECOY, and this is the fuse the ROM must read for PUBK_SEL_FUSE_KEY_0:
  # SHA-256(dev0 RSA-3072 modulus) with byte 0 bit 0 flipped. It must NOT match
  # the modulus the manifest carries.
  value = 0xf65082842b03dfecbb617d03d2a7fd9ca03a7e6494c96e1ac2f5a83763ca71a6

[CHIPLET_PUBK_HASH1]
  [CHIPLET_PUBK_HASH1.fields.key_hash]
  # The REAL digest, in the fuse this testcase does NOT select. A ROM that read
  # the wrong chiplet fuse would find this, verify, and boot -- so this value is
  # what makes the wrong-fuse-address class detectable here as well.
  # SHA-256(dev0 RSA-3072 modulus) = a771ca6337a8f5c21a6ec994647e3aa09cfda7d2037d61bbecdf032b848250f6, little-endian
  value = 0xf65082842b03dfecbb617d03d2a7fd9ca03a7e6494c96e1ac2f5a83763ca71a7

[CHIPLET_PUBK_REVOKE]
  [CHIPLET_PUBK_REVOKE.fields.select]
  value = 0x00000001   # bit 0 = ROM dev key 0; bits 16/17 CLEAR
