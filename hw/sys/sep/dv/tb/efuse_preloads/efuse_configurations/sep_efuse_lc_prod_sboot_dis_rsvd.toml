# PROD lifecycle with a reserved bit set in SBOOT_DIS and the chicken bit clear.
#
# SBOOT_DIS is disable_secure_boot[0] plus rsvd[31:1], and rsvd is hw=rw in the
# RDL -- driven from the fuse array, not tied off -- so a part can present this
# word without the chicken bit being blown.
#
# Two ROM properties depend on this image, and a whole-word `!= 0` test of
# SBOOT_DIS would fail both (SEP-ROM-SB-041):
#
#   - a reserved bit must not read as "secure boot disabled";
#   - the ROM must treat the word as a fuse-integrity fault and stop, since on a
#     healthy part rsvd reads zero.
#
# PROD rather than TEST_DEV so a reserved bit wrongly taken for the chicken bit
# would actually change the outcome: under TEST_DEV the lifecycle alone declines
# to enforce, and the run would prove nothing.
#
# Used by sep_firmware_sboot_dis_rsvd_terminal_test.

[LC_STATE]
  # Differentially encoded {~raw[3:0], raw[3:0]}, which is the byte the OTP
  # physically holds: raw 0x1 (PROD) stores as 0xE1. See the directory README.
  [LC_STATE.fields.lc_state]
  value = 0xE1

[SBOOT_DIS]
  # A field value is shifted by that field's LSB, and rsvd is SBOOT_DIS[31:1],
  # so 0x1 here is the lowest reserved bit -- bit 1 of the 32-bit register. The
  # emitted word is 0x00000002, leaving disable_secure_boot (bit 0) clear.
  [SBOOT_DIS.fields.rsvd]
  value = 0x1
