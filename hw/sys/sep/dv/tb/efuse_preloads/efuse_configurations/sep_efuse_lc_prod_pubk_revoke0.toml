# PROD lifecycle with ROM public-key slot 0 revoked.
#
# CHIPLET_PUBK_REVOKE.select[7:0] is the ROM chiplet-creator classical key
# bitmap (sep_efuse_map.rdl:721-729); SEP ROM tests bit N for a manifest that
# selects ROM key slot N (oca_platform.c). 0x01 revokes slot 0 and
# nothing else, so a rejection can only be attributed to the selected slot.
#
# Everything else matches sep_efuse_lc_prod.toml: PROD so secure boot is
# enforced, SBOOT_DIS clear so nothing opts out of it, and BL1_VERSION 0 so the
# rollback check (which runs before key selection) cannot preempt the
# revocation verdict. Used by
# sep_firmware_backup_pubkey_rom_0_revoked_key_test and
# sep_firmware_primary_pubkey_rom_0_revoked_key_test.
#
# One of a family of six that differ by exactly one hex value, shared by the
# BACKUP-side and PRIMARY-side revoke families; see
# dv/cocotb/tests/rom_fw/sep_pubkey_rom_revoked_base.py and
# dv/cocotb/tests/rom_fw/sep_pubkey_rom_revoked_primary_base.py.

[LC_STATE]
  [LC_STATE.fields.lc_state]
  value = 0xE1   # PROD (raw=0x1)

[CHIPLET_PUBK_REVOKE]
  [CHIPLET_PUBK_REVOKE.fields.select]
  value = 0x01   # bit 0 -> ROM public-key slot 0 revoked
