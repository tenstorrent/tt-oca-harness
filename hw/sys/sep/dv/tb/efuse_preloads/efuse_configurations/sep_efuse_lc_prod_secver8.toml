# PROD lifecycle with a rollback floor that rejects the image under test.
#
# BL1_VERSION is the minimum security version SEP ROM will load. 0xff is set
# above the version the test image carries, so the ROM must refuse it; the test
# fails if the image boots. Used by
# sep_firmware_backup_invalid_security_version_test.

[LC_STATE]
  [LC_STATE.fields.lc_state]
  value = 0xE1   # PROD (raw=0x1)

[BL1_VERSION]
  [BL1_VERSION.fields.version]
  value = 0xff
