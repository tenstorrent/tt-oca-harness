# TEST_DEV lifecycle carrying the class key the encrypted-payload test decrypts.
#
# CLASS_KEY is the KBKDF root: ROM derives the payload AES key from it, so this
# value must stay byte-identical to the secret the packer encrypts with --
# configs/oca_encrypted_boot_test.yaml `encryption_secret`, the 32 bytes
# 00 01 .. 1f, stored little-endian -- or the payload decrypts to garbage. It is
# a published test vector, not a device secret. Used by
# sep_firmware_encrypted_boot_test. sep_rom_oca_encrypted_boot_test builds the
# same image in Python.
#
# TEST_DEV rather than PROD: the test exercises decryption, and PROD
# would additionally demand a valid signature, so a signature failure could mask
# a decryption failure.

[LC_STATE]
  [LC_STATE.fields.lc_state]
  value = 0xF0   # TEST_DEV (raw=0x0)

[CLASS_KEY]
  [CLASS_KEY.fields.key]
  value = 0x1f1e1d1c1b1a191817161514131211100f0e0d0c0b0a09080706050403020100
