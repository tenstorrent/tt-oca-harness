# TEST_DEV lifecycle with the secure-boot chicken bit blown.
#
# The TEST_DEV twin of sep_efuse_lc_prod_sboot_dis. Both cells of the fuse-lock
# 2x2 that blow SBOOT_DIS need one, and the lifecycle is the only thing that
# separates them: secure_boot_enabled() short-circuits on the fuse before it
# reads either the lifecycle or the manifest flag (manifest_load.c), so the two
# rows reach the same non-secure boot and the LC= console echo is what attributes
# each run to its own cell.
#
# TEST_DEV cannot be had by omitting the preload here. An unprogrammed OTP does
# sense TEST_DEV, but it also senses SBOOT_DIS = 0, which is the OTHER cell.
#
# LC_STATE is the differentially encoded byte {~raw, raw}; 0xF0 is raw 0x0. See
# README.md.

[LC_STATE]
  [LC_STATE.fields.lc_state]
  value = 0xF0   # TEST_DEV (raw=0x0)

[SBOOT_DIS]
  [SBOOT_DIS.fields.disable_secure_boot]
  value = 0x1
