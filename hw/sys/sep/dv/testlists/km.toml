schema_version = 1

# Key Manager scenarios. Each test contract is in docs/SEP_VPLAN.adoc. Entries on
# rom_main use real fuse sense (rom_main reads OTP at boot) and +esrc_noise_force
# (the ESRC ring oscillators do not oscillate under Verilator); c_compile builds
# rom_main.rom.parhex with the wipe defines off.

[[tests]]
name = "sep_km_mem_smoke_test"
module = { cocotb = "km.sep_km_mem_smoke_test", uvm = "sep_km_mem_smoke_test" }
firmware = { name = "km_rom", mode = "km_rom_blob" }
seed = 1
timeout_sec = 1800
tags = ["smoke", "km", "memory"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense", "+km_rom_hex=km_rom.parhex"]

[tests.overrides.uvm]
# The VCS sim stage does not stage firmware outputs into its CWD, so the
# SV-UVM run names the committed blob by path; this +km_rom_hex replaces the
# relative one (last plusarg wins).
args = ["+km_rom_hex={repo_root}/hw/sys/sep/dv/cocotb/tests/km_rom.parhex"]

[[tests]]
# The EL2 host and the KM PicoRV32 contend at u_km_efuse_axi_lite_mux. Real fuse sense
# keeps the host CHIPLET_UID read path live; the OTP image is staged to out/sep_efuse.hex.
name = "sep_efuse_km_axil_cpu_mux_coexist_test"
module = "km.sep_efuse_km_axil_cpu_mux_coexist_test"
firmware = { name = "km_efuse_coexist", mode = "el2_km_rom_coexist" }
seed = 1
timeout_sec = 5400
tags = ["km", "efuse", "subsystem", "cpu"]
run_modes = ["cpu"]
args = ["+km_rom_hex=km_rom_coexist.parhex"]

[[tests]]
# KM -> OTBN sideload consume-proof KAT on a known 384-bit key, frontdoor only.
# The KM firmware faults on an all-zero shadow, so the test senses a valid PROD
# OTP image.
name = "sep_km_otbn_sideload_kat_test"
module = "km.sep_km_otbn_sideload_kat_test"
firmware = { name = "rom_main", mode = "km_rom_main" }
seed = 1
timeout_sec = 7200
tags = ["km", "otbn", "subsystem", "entropy"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+esrc_noise_force", "+km_rom_hex=rom_main.rom.parhex"]

