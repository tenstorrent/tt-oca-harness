schema_version = 1

# Code-coverage stimulus suite. Rationale and per-test targets are in
# docs/SEP_COV_VPLAN.adoc.
#
# EVERY TEST HERE IS STIMULUS ONLY. It adds no checker, no scoreboard and no
# expected-value compare, and it sets `stimulus_only = True` so the own-evidence
# floor in sep_base_test does not apply. A PASS means a path was driven and the
# stimulus completed without an unexpected bus error. It means nothing else.
#
#   * Do NOT cite a sep_cov_* test as proof that a behaviour is correct.
#   * Do NOT count one toward a SEP_VPLAN row or as VPLAN evidence.
#   * Verification contracts live in docs/SEP_VPLAN.adoc and its tests.
#
# The group is named `stim`, not `cov`, so `--items stim` does not read as a
# coverage-report flag next to `--stage cov_report`, `cov/config/vcs/` and
# sep_cov_scope.hier. The `sep_cov_` test prefix marks what a test IS; `stim`
# names the group you run.
#
# WHICH GROUP RUNS THESE. They are NOT members of `all`: `all` is the set
# SEP_VPLAN grades, and a stimulus leaf grades nothing. Run them through
# `stim` on their own, or through `all_cov` (cpu + cpu_stub + stim), which is
# the set a coverage run measures.
#
# TO REMOVE THIS SUITE:
#   1. drop "stim.toml" from `includes` in all.toml
#   2. delete the whole `all_cov` group from all.toml
#   3. delete this file, cocotb/tests/**/sep_cov_*.py, cocotb/seq_lib/sep_cov_*.py
#      and cocotb/tests/km_rom_cov_*.parhex
#
# `all` needs no edit: it never held these tests.


# Code-coverage stimulus leaves for the SEP system fabric, system CSR and
# crypto interconnect (docs/SEP_COV_VPLAN.adoc). Every entry below is
# STIMULUS ONLY: it adds no checker, no scoreboard and no assertion, and it
# passes when the path was driven without an unexpected bus error. None of
# them may be cited as evidence for a SEP_VPLAN row.

[[tests]]
# Coverage stimulus only -- no contract is asserted. Pattern walk through
# START_ADDR, END_ADDR and FILTER_CONFIG on all 32 outbound and 16 inbound
# filter slots, so the replicated sep_system_csr filter register slices and
# the filter control structs move off their reset value. Leaves the
# write-once-set lock bit clear. no_cpu; +skip_fuse_sense.
name = "sep_cov_csr_filter_slot_data_walk_test"
module = "system.sep_cov_csr_filter_slot_data_walk_test"
seed = 1
timeout_sec = 1800
tags = ["coverage", "stimulus", "fabric", "filter", "csr", "system"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# Coverage stimulus only -- no contract is asserted. Sets FILTER_CONFIG.locked
# on all 48 filter slots and re-writes each locked slot, which is the only path
# that asserts the per-slot locked_reg_req and reaches the per-slot
# prim_axi_lite_err_slv. The lock holds until reset, so this must not share a
# run with sep_cov_csr_filter_slot_data_walk_test. no_cpu; +skip_fuse_sense.
name = "sep_cov_csr_filter_lock_all_slots_test"
module = "system.sep_cov_csr_filter_lock_all_slots_test"
seed = 1
timeout_sec = 1800
tags = ["coverage", "stimulus", "fabric", "filter", "csr", "system"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# Coverage stimulus only -- no contract is asserted. Pattern walk through
# REGION_START, REGION_END and REGION_ATTRS on all 16 local-master alias
# regions, and through REGION_ATTRS on all 16 AP and 16 STEE output-remap
# regions. The two output-remap control structs are at zero toggle today.
# no_cpu; +skip_fuse_sense.
name = "sep_cov_csr_remap_region_data_walk_test"
module = "system.sep_cov_csr_remap_region_data_walk_test"
seed = 1
timeout_sec = 1800
tags = ["coverage", "stimulus", "fabric", "remap", "csr", "system"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
