[[tests]]
# Coverage stimulus only -- no contract is asserted. Boots the KM firmware on
# real entropy, then sideloads a differently patterned key to HMAC, KMAC, OTBN
# and the ABR ML-DSA seed in one run, each from its own key-vault handle, so
# the wrapper KEY_SHARE words and the ABR key-vault shim indices leave their
# single value. Nothing is read back and no engine is run. Real fuse sense
# (PROD image), so no +skip_fuse_sense. no_cpu.
name = "sep_cov_crypto_key_share_walk_test"
module = "crypto.sep_cov_crypto_key_share_walk_test"
firmware = { name = "rom_main", mode = "km_rom_main" }
seed = 1
timeout_sec = 7200
tags = ["coverage", "stimulus", "crypto", "km", "sideload", "entropy"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+esrc_noise_force", "+km_rom_hex=rom_main.rom.parhex"]

