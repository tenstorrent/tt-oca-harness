# Coverage-stimulus leaves that close FSM arcs whose target is the FSM's own
# reset state. Those arcs have no `case`-arm assignment anywhere; the reset
# value of the state flop is what takes them, and VCS scores that like any
# other transition. Each leaf brings a block into a running state and then
# requests that block's per-IP software reset (SW_RESET_N in sep_reset_ctrl).
#
# Every leaf releases what it parks and restores SW_RESET_N in a `finally`,
# so no later leaf in the same regression inherits a held IP.
#
# Append these entries to testlists/stim.toml, and the names to the
# stimulus list in testlists/all.toml.

[[tests]]
# Coverage stimulus only -- asserts no contract. Per-IP reset of the Adams
# Bridge engine at seeded offsets inside a running ML-DSA or ML-KEM keygen,
# to drive the reset-only returns to idle in abr_ctrl, abr_sha3, abr_sha3pad,
# abr_keccak_round, abr_sampler_top, ntt_ctrl, makehint, pkdecode,
# power2round_ctrl, sample_in_ball_ctrl, sigdecode_h_ctrl, sigdecode_z_top,
# sigencode_z_top, skdecode_ctrl and skencode. ABR is not an EDN client, so
# no entropy bring-up is needed. no_cpu; +skip_fuse_sense.
name = "sep_cov_abr_reset_midop_test"
module = "crypto.sep_cov_abr_reset_midop_test"
seed = 1
timeout_sec = 3600
tags = ["coverage", "stimulus", "crypto", "abr", "reset", "fsm"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# Coverage stimulus only -- asserts no contract. Per-IP reset of the TRNG
# domain at seeded offsets while the entropy source, CSRNG and EDN are
# mid-flow, to drive the reset-only returns to idle in entropy_src_main_sm,
# csrng_main_sm, csrng_cmd_stage, csrng_ctr_drbg, edn_main_sm and edn_ack_sm.
# The crypto consumers stay idle and are quiesced before the TRNG, which is
# the ordering SepSwReset.begin_trng_recovery exists for. The entropy stack
# is reinitialized after every pulse. no_cpu; +skip_fuse_sense,
# +esrc_noise_force.
name = "sep_cov_trng_reset_midflow_test"
module = "system.sep_cov_trng_reset_midflow_test"
seed = 1
timeout_sec = 3600
tags = ["coverage", "stimulus", "entropy", "trng", "reset", "fsm", "system"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense", "+esrc_noise_force"]

