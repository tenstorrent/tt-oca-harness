timeout_sec = 7200
tags = ["coverage", "stimulus", "crypto", "km", "sideload", "entropy"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+esrc_noise_force", "+km_rom_hex=rom_main.rom.parhex"]

