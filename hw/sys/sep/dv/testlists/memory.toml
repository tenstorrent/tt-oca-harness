schema_version = 1

# Daily regression policy: run the cpu_stub and cpu groups separately,
# `python3 tools/dv/run_dv.py --dut sep --items <cpu_stub|cpu> --regress`. Tests with run_modes=["no_cpu"]
# select target="lsu_stub_all_live"; CPU firmware tests omit target and use the
# full-CPU default model.

# Non-firmware tests for memory-style boundary responders. Firmware-owned DMA
# tests stay in cpu.toml even when they exercise memory.

[[tests]]
name = "sep_boot_rom_smoke_test"
module = "cpu.sep_boot_rom_smoke_test"
seed = 1
timeout_sec = 3600
tags = ["smoke", "boot", "cpu", "rom", "memory", "ci"]
run_modes = ["cpu"]
args = ["+skip_fuse_sense"]

[[tests]]
name = "sep_sram_smoke_test"
module = "sram.sep_sram_smoke_test"
seed = 1
timeout_sec = 1800
tags = ["smoke", "sram", "memory"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# SRAM datapath breadth (the reference suite sram byte_strobe/byte_pattern/data_pattern/
# addr_boundary/write_read/sequential_access). Per-byte WSTRB lanes (neighbor-
# preserved), data patterns, base + top-valid boundary words, and single-beat
# sequential 64-bit words over the CPU-LSU AXI splice, each value-checked. The
# SRAM port is single-beat/no-burst. no_cpu; +skip_fuse_sense. Memory subsystem.
name = "sep_sram_datapath_breadth_test"
module = "sram.sep_sram_datapath_breadth_test"
seed = 1
timeout_sec = 1800
tags = ["sram", "memory", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
name = "sep_rom_sanity_test"
module = "cpu.sep_rom_sanity_test"
firmware = "rom_sanity_test"
seed = 1
timeout_sec = 3600
tags = ["boot", "cpu", "rom", "memory", "subsystem"]
run_modes = ["cpu"]
args = ["+skip_fuse_sense", "+sep_boot_rom_hex=rom_sanity_rom.hex"]

[[tests]]
# Boot ROM LSU data-read + write-ignored (the reference suite rom basic_read/sequential_read/
# content_verify/addr_boundary/write_ignore). EL2 firmware does CPU LSU loads from
# the boot ROM (0x1004_0000, on the dedicated lsu_rom_axi CPU port) value-checked
# against a known preloaded image (+sep_boot_rom_hex=mem_rom_test_rom.hex), then
# proves a store to a ROM word is silently ignored (content unchanged, NOT DECERR).
# cpu REQUIRED (ROM unreachable by the no_cpu splice); +skip_fuse_sense. Distinct
# from sep_rom_sanity_test (IFU-execute). Memory subsystem.
name = "sep_boot_rom_lsu_read_test"
module = "cpu.sep_boot_rom_lsu_read_test"
firmware = "rom_lsu_read_test"
seed = 1
timeout_sec = 3600
tags = ["boot", "cpu", "rom", "memory", "subsystem"]
run_modes = ["cpu"]
args = ["+skip_fuse_sense", "+sep_boot_rom_hex=mem_rom_test_rom.hex"]
