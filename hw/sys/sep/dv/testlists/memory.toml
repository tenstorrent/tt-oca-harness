schema_version = 1

# Non-firmware tests for memory-style boundary responders. Firmware-owned DMA
# tests stay in cpu.toml even when they exercise memory.

[[tests]]
name = "sep_boot_rom_smoke_test"
module = "cpu.sep_boot_rom_smoke_test"
seed = 1
timeout_sec = 3600
tags = ["smoke", "boot", "cpu", "rom", "memory", "ci"]
run_modes = ["cpu"]
args = ["+skip_fuse_sense"]

[[tests]]
name = "sep_sram_smoke_test"
module = { cocotb = "sram.sep_sram_smoke_test", uvm = "sep_sram_smoke_test" }
seed = 1
timeout_sec = 1800
tags = ["smoke", "sram", "memory"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# SRAM byte-lane, data-pattern, boundary and sequential-word breadth over the CPU-LSU
# splice.
name = "sep_sram_datapath_breadth_test"
module = "sram.sep_sram_datapath_breadth_test"
seed = 1
timeout_sec = 1800
tags = ["sram", "memory", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# Multi-beat FIXED and WRAP bursts into SEP SRAM answer SLVERR and leave SRAM unchanged
# (hw/sys/sep/doc/fabric.adoc#sep-sram-target).
name = "sep_sram_burst_type_test"
module = "sram.sep_sram_burst_type_test"
seed = 1
timeout_sec = 1800
tags = ["sram", "memory", "negative", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# INCR bursts of 1 to 256 beats from the SMN-inbound master with seeded attributes. The
# inbound filter decides on address, prot[1], user[3:0] and AxLEN only, so the data must
# not change.
name = "sep_sram_inbound_burst_attr_test"
module = "sram.sep_sram_inbound_burst_attr_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["sram", "memory", "fabric", "inbound", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
name = "sep_rom_sanity_test"
module = "cpu.sep_rom_sanity_test"
firmware = "rom_sanity_test"
seed = 1
timeout_sec = 3600
tags = ["boot", "cpu", "rom", "memory", "subsystem"]
run_modes = ["cpu"]
args = ["+skip_fuse_sense", "+sep_boot_rom_hex=rom_sanity_rom.hex"]

[[tests]]
# LSU reads of the boot ROM match the preloaded image; a store is ignored, NOT DECERR.
# cpu mode is required: the no_cpu splice cannot reach the ROM.
name = "sep_boot_rom_lsu_read_test"
module = "cpu.sep_boot_rom_lsu_read_test"
firmware = "rom_lsu_read_test"
seed = 1
timeout_sec = 3600
tags = ["boot", "cpu", "rom", "memory", "subsystem"]
run_modes = ["cpu"]
args = ["+skip_fuse_sense", "+sep_boot_rom_hex=mem_rom_test_rom.hex"]

[[tests]]
# sep_reset_n and sep_cpu_reset_n release only after rst_ni is high, fuse sensing is done
# and ext_boot_seq_done_i is high, in any arrival order. Real fuse sense of a staged
# image.
name = "sep_boot_release_terms_test"
module = "system.sep_boot_release_terms_test"
seed = 1
reseed = 3
timeout_sec = 3600
tags = ["boot", "reset", "efuse", "memory", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = []

[[tests]]
# Same module as sep_boot_release_terms_test, with the bench SMC fuse-sense indication
# held low for the whole leaf.
name = "sep_boot_release_terms_test_smc_hold"
module = "system.sep_boot_release_terms_test"
seed = 1
reseed = 3
timeout_sec = 3600
tags = ["boot", "reset", "efuse", "memory", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+sep_smc_fuse_sense_hold"]

[[tests]]
# A wdt_rst_ni or dbg_rstb_i pulse leaves the software reset requests, the engine state,
# the fault status, the SPI and DMA registers and a running DMA transfer intact. A cold
# reset clears them.
name = "sep_cpu_reset_retention_test"
module = "system.sep_cpu_reset_retention_test"
seed = 1
reseed = 4
timeout_sec = 3600
tags = ["reset", "cpu", "scratch", "dma", "memory", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# The same leaf on the full-CPU model: it adds the dbg_rstb_i sequence, the dbg_rstb_i
# overlap runs and the run-request synchronizer check, and fails without the full CPU.
name = "sep_cpu_reset_retention_test_dbg"
module = "system.sep_cpu_reset_retention_test"
seed = 1
reseed = 4
timeout_sec = 3600
tags = ["reset", "cpu", "scratch", "dma", "memory", "subsystem"]
run_modes = ["no_cpu"]
tools = ["vcs"]
target = "default"
args = ["+skip_fuse_sense", "+sep_require_full_cpu"]

[[tests]]
# A SW_RESET_N field resets exactly its domain after the domain paths report isolated.
# Accepted host transactions drain, later ones answer SLVERR, and sibling domains keep
# their state. The Key Manager leg uses the KM ROM image of the open Key Manager tests.
name = "sep_sw_reset_isolation_matrix_test"
module = "system.sep_sw_reset_isolation_matrix_test"
firmware = { name = "km_rom", mode = "km_rom_blob" }
seed = 1
reseed = 4
timeout_sec = 3600
tags = ["reset", "crypto", "isolation", "km", "memory", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense", "+km_rom_hex=km_rom.parhex"]

[[tests]]
# The per-IP JTAG override pair forces each domain reset or release whatever SW_RESET_N
# holds, without isolation. The sep_reset_n override leaves the rst_ni-domain blocks
# intact.
name = "sep_ip_reset_override_matrix_test"
module = "system.sep_ip_reset_override_matrix_test"
seed = 1
reseed = 4
timeout_sec = 3600
tags = ["reset", "jtag", "crypto", "isolation", "memory", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+sep_edn_jtag_reset_waive", "+sep_efuse_preload"]

[[tests]]
# Same module as sep_debug_master_target_matrix_test with the core held (no_cpu) on the
# full-CPU model. The debug-module system bus reaches the SEP fabric with 64-bit beats and
# a zero-extended 1-bit ID, and passes the local alias remap at the reset and at a moved
# window base. The leaf fails without the full CPU.
name = "sep_debug_master_target_matrix_test_sba"
module = "cpu.sep_debug_master_target_matrix_test"
seed = 1
reseed = 4
timeout_sec = 3600
tags = ["debug", "jtag", "dmi", "sba", "memory", "subsystem"]
tools = ["vcs"]
run_modes = ["no_cpu"]
target = "default"
args = ["+skip_fuse_sense"]

[[tests]]
# SEP SRAM serves every INCR length and every single-beat burst type. A multi-beat FIXED
# or WRAP burst from the inbound master answers SLVERR and changes nothing. A cold reset
# during an access leaves the interface usable.
name = "sep_sram_axi_shape_matrix_test"
module = "sram.sep_sram_axi_shape_matrix_test"
seed = 1
reseed = 4
timeout_sec = 3600
tags = ["sram", "fabric", "reset", "memory", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense", "+sep_axi_wrap_len1_inject"]

[[tests]]
# On a DMA-path TCM read a single-bit error returns corrected data, and a two-bit error
# returns an error response and sets DMA_BUS_ERR_STATUS.host_path_err. ICCM and DCCM do
# not alias. The leaf needs the TCM controller of the full CPU and fails without it.
name = "sep_tcm_dma_aperture_ecc_test"
module = "system.sep_tcm_dma_aperture_ecc_test"
seed = 1
reseed = 4
timeout_sec = 3600
tags = ["tcm", "ecc", "dma", "memory", "subsystem"]
tools = ["vcs"]
run_modes = ["no_cpu"]
target = "default"
args = ["+skip_fuse_sense", "+sep_require_full_cpu"]

[[tests]]
# Every boot ROM word reads the loaded image for 1, 2 and 4-byte reads, a store does not
# reach the macro, a stored-bit flip returns OKAY, and a cold reset during an access
# leaves the interface usable. Real fuse sense of a PROD image whose ROM_CTL is 0.
name = "sep_boot_rom_aperture_sweep_test"
module = "cpu.sep_boot_rom_aperture_sweep_test"
seed = 1
reseed = 4
timeout_sec = 3600
tags = ["boot", "rom", "cpu", "memory", "subsystem"]
run_modes = ["cpu"]
args = [
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod.toml",
]

[[tests]]
# The IFU demux sends ROM and SRAM fetches to their ports and every other fetch to a
# DECERR responder. The LSU demux routes ROM and crossbar targets, and the LSU cannot
# write the ICCM.
name = "sep_cpu_demux_unmapped_fetch_test"
module = "cpu.sep_cpu_demux_unmapped_fetch_test"
seed = 1
reseed = 4
timeout_sec = 3600
tags = ["cpu", "fabric", "decode", "memory", "subsystem"]
run_modes = ["cpu"]
args = ["+skip_fuse_sense"]

[[tests]]
# A single-bit CPU TCM error is corrected and counted and raises MCEIP at the threshold.
# An uncorrectable DCCM error traps with the stated cause. The errors come from the time-0
# flip list.
name = "sep_tcm_ecc_cpu_trap_test"
module = "cpu.sep_tcm_ecc_cpu_trap_test"
firmware = "tcm_ecc_cpu_trap_test"
seed = 1
reseed = 4
timeout_sec = 3600
tags = ["tcm", "ecc", "cpu", "trap", "memory", "subsystem"]
run_modes = ["cpu"]
args = ["+skip_fuse_sense", "+sep_tcm_flip_list=sep_tcm_ecc_flips.txt"]
