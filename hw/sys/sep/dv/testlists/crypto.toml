schema_version = 1

# Crypto and entropy scenarios. Each test contract is in docs/SEP_VPLAN.adoc.

[[tests]]
name = "sep_otbn_mem_smoke_test"
module = { cocotb = "otbn.sep_otbn_mem_smoke_test", uvm = "sep_otbn_mem_smoke_test" }
seed = 1
timeout_sec = 1800
tags = ["smoke", "otbn", "crypto", "memory"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# OTBN EXECUTE of ADD/XOR/AND against an independent golden. +esrc_noise_force
# feeds the post-reset URND wipe.
name = "sep_otbn_compute_rand_test"
module = "otbn.sep_otbn_compute_rand_test"
seed = 1
# No reseed: every run walks ADD, XOR and AND; the seed selects only the operands.
timeout_sec = 1800
tags = ["otbn", "crypto", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense", "+esrc_noise_force"]

