[[groups]]
# ROM firmware boot. Its own group because these are the only tests on the
# `rom_boot` RTL target and the boot_rom* firmware profiles -- a different build
# on both axes from cpu (default) and no_cpu (lsu_stub_all_live). Kept out of the
# `cpu` group so a CPU class regression is one build target, and so the ROM-FW
# owner can run
# `python3 tools/dv/run_dv.py --dut sep --items rom_fw --regress`
# without dragging in the SEP suite.
# NOT a member of `all`: `all` is the set this VPLAN grades and the set a coverage
# run measures, so a firmware class with another owner does not belong in it.
# Reaching these tests means naming `rom_fw` (or the test) explicitly.
name = "rom_fw"
tests = [
    "sep_rom_non_secure_boot_test",
    "sep_rom_ot_dma_boot_test",
    "sep_rom_ot_pio_boot_test",
    "sep_rom_ot_secure_boot_test",
    "sep_firmware_mbist_fail_test",
    "sep_scratch_7_test",
    "sep_firmware_device_cntl_non_secure_boot_flow_test",
    "sep_firmware_enforced_secure_boot_flow_test",
    "sep_firmware_cntl_secure_boot_flow_test",
    "sep_firmware_backup_invalid_signature_test",
    "sep_firmware_backup_invalid_security_version_test",
    "sep_firmware_backup_invalid_public_key_selection_test",
    "sep_spi_detect_success_test",
    "sep_spi_primary_fail_backup_test",
    # Subclass of the entry above; adds an SRAM scoreboard to the same failover.
    # Covers the EXT SRAM half only -- this ROM never clears SMC SRAM, so a green
    # run says nothing about that half. Slower than most of this group, and mostly
    # for an inherited reason: the clear it asserts is 65536 CPU stores, about
    # 1.05M clocks, a cost the entry above already pays. Compare in CYCLES:
    # sys_clk_period is randomised per run, so simulated-time and wall-second
    # figures are not comparable between runs.
    "sep_failover_sram_clear_assertion_test",
    "sep_spi_not_detected_terminal_test",
    "sep_firmware_encrypted_boot_test",
    "sep_firmware_mbist_pass_test",
    "sep_firmware_mbist_only_fail_test",
    "sep_boot_recovery_test",
    "sep_rotate_update_set_test",
    "sep_firmware_primary_invalid_key_hash_test",
    "sep_firmware_backup_invalid_key_hash_test",
    # The six-member ROM public-key revoke family. They share ONE
    # implementation, rom_fw/sep_pubkey_rom_revoked_base.py, and differ only in
    # _REVOKED_SLOT and the single OTP bit their own preload blows. Slot 0 is
    # the strictest member (the populated digest the image binds to) and is the
    # matched partner of sep_firmware_backup_rom_key_valid_test below.
    "sep_firmware_backup_pubkey_rom_0_revoked_key_test",
    "sep_firmware_backup_pubkey_rom_1_revoked_key_test",
    "sep_firmware_backup_pubkey_rom_2_revoked_key_test",
    "sep_firmware_backup_pubkey_rom_3_revoked_key_test",
    "sep_firmware_backup_pubkey_rom_4_revoked_key_test",
    "sep_firmware_backup_pubkey_rom_5_revoked_key_test",
    "sep_firmware_backup_invalid_signature_type_test",
    "sep_firmware_backup_rom_key_index_invalid_test",
    # Positive: valid ROM key slot on the backup, and a completed boot. Runs a
    # real RSA-3072 modexp on OTBN, so it is one of the slower entries here.
    "sep_firmware_backup_rom_key_valid_test",
    # Primary-side pair. Both end in a boot from the BACKUP, not a terminal
    # failure, and both run a modexp on the recovering slot.
    "sep_firmware_primary_invalid_public_key_selection_test",
    "sep_firmware_primary_invalid_security_version_test",
    # The primary-side counterparts of the group above. The six-member PRIMARY
    # revoke family shares ONE implementation,
    # rom_fw/sep_pubkey_rom_revoked_primary_base.py, but deliberately NOT one
    # outcome: slot 0 is TERMINAL, because the shipped backup selects ROM slot 0
    # as well and one fuse bit therefore refuses both manifests, while slots 1-5
    # fail over and boot from the unrevoked backup. The shared base measures which
    # of the two applies from the image rather than trusting the slot number, so a
    # packer change to the backup's rom_key_index fails loudly instead of leaving a
    # member asserting the wrong shape.
    "sep_firmware_primary_pubkey_rom_0_revoked_key_test",
    "sep_firmware_primary_pubkey_rom_1_revoked_key_test",
    "sep_firmware_primary_pubkey_rom_2_revoked_key_test",
    "sep_firmware_primary_pubkey_rom_3_revoked_key_test",
    "sep_firmware_primary_pubkey_rom_4_revoked_key_test",
    "sep_firmware_primary_pubkey_rom_5_revoked_key_test",
    # The two signature entries share error code 0x0003000c and are separable only
    # on the console: the VALUE case pins PUBK_SEL= to two occurrences and requires
    # RSA_VERIFY_FAIL, the TYPE case pins it to one and forbids RSA_VERIFY_FAIL.
    "sep_firmware_primary_invalid_signature_test",
    "sep_firmware_primary_invalid_signature_type_test",
    "sep_firmware_primary_rom_key_index_invalid_test",
    # Positive: valid ROM key slot on the PRIMARY, booting with NO failover at all,
    # and the matched partner of the revoke-0 member above -- the same flash bytes,
    # one bit of CHIPLET_PUBK_REVOKE apart.
    "sep_firmware_primary_rom_key_valid_test",
    # BL1 version, chiplet fused keys, demotion.
    # ACCEPT boundary of the rollback check, on a fuse floor spread across all eight
    # thermometer words so a truncated decode fails on FUSE_VER=0x00000008.
    "sep_firmware_bl1_ver_test",
    # The four-member CHIPLET FUSED key family. They share ONE implementation,
    # rom_fw/sep_chiplet_pubkey_base.py, and differ only in _CHIPLET_KEY and the
    # base they pick. This is the fused-key arm of validate_signature
    # (manifest_crypto.c), distinct code from the ROM-key arm the
    # pubkey_rom_* families cover. Each positive member and its revoke twin run
    # byte-identical flash images, one CHIPLET_PUBK_REVOKE bit apart.
    "sep_firmware_chiplet_pubkey_0_test",
    "sep_firmware_chiplet_pubkey_0_revoke_test",
    "sep_firmware_chiplet_pubkey_1_test",
    "sep_firmware_chiplet_pubkey_1_revoke_test",
    # The digest-SOURCE discriminator the four members above cannot be. Their fuse digest equals public_key_digests[0], so a ROM
    # comparing against the compiled-in table instead of the fuse is invisible to
    # them. Here the SELECTED fuse (HASH0) holds a decoy while the unselected one
    # (HASH1) holds the real digest, so BOTH a compiled-in-table comparison and a
    # wrong-fuse-address read boot and fail this testcase. Same flash image as the
    # positive member; the only difference is the fuse words, which are in turn
    # byte-identical to sep_efuse_lc_prod_chiplet_key1.toml's -- making this and
    # sep_firmware_chiplet_pubkey_1_test a matched pair on the FUSE side.
    "sep_firmware_chiplet_pubkey_0_wrong_digest_test",
    # The demotion decision. Eight members cover six of the seven outcomes the
    # block can produce -- see rom_fw/sep_demotion_decision_base.py for the
    # collapse map. The three PROD_END members are one observable (O1), because
    # rom_main.c returns before any manifest input is read; the remaining five are
    # O2a, O2b, O3a, O4 and O5. The seventh, O3b
    # (unauth_flag_0_prod_sel_bit_set), has no testcase and is this group's one
    # gap. Every member checks the DEMOTE_1/DEMOTE_2 registers and not only the
    # console, through the tb_top probes, because every demotion console string is
    # printed from a local computed one line earlier. The shared stimulus lives in
    # rom_fw/sep_demotion_prod_base.py
    # (PROD, secure boot disabled on both surfaces) and
    # rom_fw/sep_demotion_prod_end_base.py.
    "sep_firmware_demotion_decision_auth_flag_0_prod_end_test",
    "sep_firmware_demotion_decision_no_flag_prod_end_test",
    "sep_firmware_demotion_decision_no_flag_prod_end_sel_bit_set_test",
    "sep_firmware_demotion_decision_auth_flag_0_prod_test",
    "sep_firmware_demotion_decision_auth_flag_0_unauth_flag_0_prod_test",
    "sep_firmware_demotion_decision_auth_flag_0_prod_sel_bit_set_test",
    "sep_firmware_demotion_decision_no_flag_prod_sel_bit_set_test",
    "sep_firmware_demotion_decision_auth_flag_0_unauth_flag_0_prod_sel_bit_set_test",
    # O3b, the last of the seven outcomes to be covered.
    "sep_firmware_demotion_decision_unauth_flag_0_prod_sel_bit_set_test",
    # O3a again, but the only member whose decision follows a full crypto chain:
    # this reference entry carries no +SECURE_BOOT_DIS.
    "sep_firmware_demotion_decision_unauth_flag_30_prod_sel_bit_set_test",
    # Covered-by-O1. The first is the only PROD_END member carrying a live BL2
    # demotion request; the second's distinguishing bit is read by nothing in this
    # ROM.
    "sep_firmware_demotion_decision_unauth_flag_0_prod_end_test",
    "sep_firmware_demotion_decision_unauth_flag_30_prod_end_test",
    # Covered-by-O4: the announced collapse sibling of
    # ..._auth_flag_0_unauth_flag_0_prod_test, kept because it is the MINIMAL O4 --
    # the BL1 flag is clear, so the pair brackets the ignored input from both sides --
    # and because it gives O4 its first MEAS_DEMOTE assertion.
    "sep_firmware_demotion_decision_unauth_flag_0_prod_test",
    # O5 again, but with secure boot ENFORCED: this reference entry carries no
    # +SECURE_BOOT_DIS, so it is NOT the artefact-only duplicate of
    # ..._auth_flag_0_prod_test that that entry's collapse note predicts.
    "sep_firmware_demotion_decision_no_flag_prod_test",
    "sep_bl1_size_invalid_test",
    "sep_bl1_entry_invalid_test",
    # KNOWN-FAIL SENTINEL, kept red on purpose: the ROM's behaviour and the test
    # procedure disagree; see the long comment on its [[tests]] entry in
    # rom_fw.toml. A run whose ONLY failure is this test is the expected result.
    # Do not remove this line to get a green run.
    "sep_decryption_failure_terminal_test",
    "sep_mbist_fail_continue_test",
    "sep_warm_reset_invalid_hang_test",
    "sep_warm_reset_below_range_hang_test",
    "sep_warm_reset_unarmed_cold_boot_test",
    "sep_warm_reset_bad_target_exception_test",
    # SLOW ON PURPOSE: ~35-45 min. Two full RSA-3072 modexps on the real OTBN,
    # one per manifest slot. Adding this made a full `rom_fw` run about 40
    # minutes longer; see its [[tests]] entry in rom_fw.toml. Not a hang.
    "sep_otbn_rsa_verify_failure_test",
    # Manifest basic validity. The backup-side four use a
    # structural-failure base because these defects are rejected before
    # manifest_crypto_validate and therefore print neither CRYPTO_FAIL= nor
    # MANIFEST_OK.
    "sep_firmware_primary_manifest_identifier_test",
    "sep_firmware_backup_manifest_identifier_test",
    "sep_firmware_manifest_primary_invalid_chiplet_id_test",
    "sep_firmware_manifest_backup_invalid_chiplet_id_test",
    "sep_firmware_manifest_primary_invalid_package_id_test",
    "sep_firmware_manifest_backup_invalid_package_id_test",
    "sep_firmware_manifest_primary_lc_state_failure_test",
    "sep_firmware_manifest_backup_lc_state_failure_test",
    "sep_firmware_validate_backup_manifest_test",
    "sep_firmware_bad_manifest_hash_test",
    # Manifest / BL1 / SRAM association. The four ext-SRAM members are absent
    # because this ROM reads no manifest use_ext_sram field.
    #
    # SLOW ON PURPOSE: sep_firmware_manifest_primary_missing_sepbl1_test runs two
    # RSA-3072 modexps because the BL1-presence check follows signature validation.
    "sep_firmware_manifest_primary_missing_sepbl1_test",
    "sep_firmware_manifest_backup_missing_sepbl1_test",
    "sep_firmware_manifest_primary_reordered_sepbl1_test",
    "sep_firmware_manifest_primary_use_ext_sram_enabled_test",
    "sep_firmware_manifest_primary_use_ext_sram_disabled_test",
    "sep_firmware_manifest_backup_use_ext_sram_enabled_test",
    "sep_firmware_manifest_backup_use_ext_sram_disabled_test",
    "sep_boot_measurement_golden_test",
