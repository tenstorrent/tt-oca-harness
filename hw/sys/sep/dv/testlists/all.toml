schema_version = 1

# Aggregate testlist: merges category/IP testlists. Leaf files define each test
# once; tags provide custom subsets, and this file owns the regression groups.
#
# Pre-merge gate: run the three class regressions, not the mixed `all` group (the
# mixed path uses conservative fan-out, and the heavy rom_main tests are the
# known-flaky-under-`all`-concurrency set). `rom_fw` is a third class: those
# four tests use the `rom_boot` RTL target and the Boot ROM firmware profiles.
#
# python3 tools/dv/run_dv.py --dut sep --items no_cpu --regress \
# --tool verilator --stage flist --stage hdl_compile --stage sim
# python3 tools/dv/run_dv.py --dut sep --items cpu --regress \
# --tool verilator --stage flist --stage hdl_compile --stage sim
# python3 tools/dv/run_dv.py --dut sep --items rom_fw --regress \
# --tool verilator --stage flist --stage c_compile --stage hdl_compile --stage sim
#
# Add `--stage c_compile` when CPU firmware is stale, or run it alone for a
# firmware-only rebuild. Verilator is the acceptance backend; VCS/Xcelium are
# development accelerators only.
#
# no_cpu tests use target="lsu_stub_all_live" for the CPU-stubbed model. CPU
# firmware tests intentionally omit target and use the full-CPU default model.
# Keep group membership aligned with each test's first run_modes[] entry.
#
# Production Boot ROM firmware tests live in rom_fw.toml (ROM-FW owner). They
# run in the `all` and `rom_fw` groups, not `cpu`; this VPLAN does not grade them
# (see hw/sys/sep/dv/docs/SEP_VPLAN.adoc, ROM-FW ownership in Known Limitations).
includes = ["system.toml", "cpu.toml", "memory.toml", "km.toml", "crypto.toml", "efuse_lcc.toml", "spi.toml", "rom_fw.toml"]

# CI smoke gate (`--items smoke`), matching the dtp/smc/smu convention so the
# shared Jenkins/GitHub `items=smoke` parameter resolves for every DUT. One
# no_cpu test on purpose: it needs no RISC-V toolchain (no c_compile stage) and
# no firmware image, so it runs on a bare hosted/CI runner and still proves the
# whole flist -> hdl_compile -> sim chain plus the SEP AXI register map.
[[groups]]
name = "smoke"
tests = ["sep_axi_smoke_test"]

# Alias of `smoke` for callers that pass `--items sanity`. Prefer `smoke`.
[[groups]]
name = "sanity"
tests = ["sep_axi_smoke_test"]

