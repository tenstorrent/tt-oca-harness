schema_version = 1

# Aggregate testlist: merges category/IP testlists. Leaf files define each test
# once; tags provide custom subsets, and this file owns the regression groups.
#
# Pre-merge commands are in the Regression Groups section of docs/SEP_VPLAN.adoc. `rom_fw` is not a member of `all`.
#
# no_cpu tests use target="lsu_stub_all_live" for the CPU-stubbed model. CPU
# firmware tests omit target and use the full-CPU default model.
# Keep group membership aligned with each test's first run_modes[] entry.
#
# Production Boot ROM firmware tests live in rom_fw.toml. They run
# in the `rom_fw` group only -- not `cpu`, and not `all`; this VPLAN does not
# grade them (see hw/sys/sep/dv/docs/SEP_VPLAN.adoc, ROM-FW ownership in Known
# Limitations). They are still defined here through `includes` so a caller can
# name them, and so the catalog stays one file set.
includes = ["system.toml", "cpu.toml", "memory.toml", "km.toml", "crypto.toml", "efuse_lcc.toml", "spi.toml", "rom_fw.toml"]

# CI smoke gate (`--items smoke`), matching the dtp/smc/smu convention so the
# shared CI `items=smoke` parameter resolves for every DUT. One
# no_cpu test: it needs no RISC-V toolchain (no c_compile stage) and
# no firmware image, so it runs on a bare hosted/CI runner and still proves the
# whole flist -> hdl_compile -> sim chain plus the SEP AXI register map.
[[groups]]
name = "smoke"
tests = ["sep_axi_smoke_test"]

[[groups]]
# Every test this VPLAN grades. `cpu_stub` (CPU-stub target) and `cpu`
# (full-CPU target) are disjoint and together hold every member;
# `expected_count` pins the size. `rom_fw` is not a member: it runs a third RTL
# target and states firmware rather than hardware contracts. `all` is the
# coverage set.
#
# Two members are pinned to one simulator, so a single-simulator run of `all`
# logs the other as skipped_wrong_tool:
# - sep_km_ic_reset_release_test, VCS only (km.toml). Its contract is the
#   prim_rom noXOnCsI assertion. Verilator is two-state and prim_assert.sv
#   compiles RTL assertions out under it, so that check cannot fail there.
# - sep_abr_absent_decerr_test, Verilator only (crypto.toml). It needs the
#   lsu_stub_abr_absent model, and the VCS coverage run elaborates only the
#   `default` target, which keeps Adams Bridge.
