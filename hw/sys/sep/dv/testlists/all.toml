# Merged VCS code-coverage set: every test the SEP VPLAN grades, i.e. `all`
# minus the four `rom_fw` leaves. Those exercise ROM *firmware* rather than ROM
# hardware, are not graded by docs/SEP_VPLAN.adoc, and are the only tests on the
# `rom_boot` RTL target -- a third elaboration no other leaf reuses. ROM
# hardware coverage comes from sep_boot_rom_lsu_read_test instead.
#
# ssh soc-c-01 "<repo>/hw/sys/sep/dv/sim/run.sh cov_all --regress --cov"
