[[groups]]
# ROM firmware boot. Its own group because these are the only tests on the
# `rom_boot` RTL target and the boot_rom* firmware profiles -- a different build
# on both axes from cpu (default) and no_cpu (lsu_stub_all_live). Kept out of the
# `cpu` group so a CPU class regression is one build target, and so the ROM-FW
# owner can run
# `python3 tools/dv/run_dv.py --dut sep --items rom_fw --regress`
# without dragging in the SEP suite.
# Still a member of `all`: the boot path is worth exercising in a full sweep.
name = "rom_fw"
tests = [
    "sep_rom_non_secure_boot_test",
    "sep_rom_ot_dma_boot_test",
    "sep_rom_ot_pio_boot_test",
    "sep_rom_ot_secure_boot_test",
]
