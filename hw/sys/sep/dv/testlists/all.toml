    # published offset holding no manifest is terminal where the same rejection
    # on flash would fail over. The four fuse-lock rows are a 2x2 of sensed
    # LC_STATE against the SBOOT_DIS chicken bit; they share one flow, so each is
    # pinned to the two values the ROM itself echoes and forbids the other three
    # cells' values. All six end in the ROM's fuse-secret lock or, for the
