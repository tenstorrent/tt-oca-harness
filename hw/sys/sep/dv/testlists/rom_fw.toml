[[tests]]
# A wedged secure DMA fails the boot instead of hanging it.
#
# +sep_dma_host_stall holds the DMA host port's response channel idle, so the
# engine stays busy and reports neither DONE nor ERROR. The SMC-SRAM manifest read is the
# first DMA transfer and that path makes one attempt, so the ROM must time the
# transfer out, fail the slot with OCA_BOOT_ERR_DMA and halt with FAIL.
# Same ROM build and SMC image as sep_rom_non_secure_boot_test.
