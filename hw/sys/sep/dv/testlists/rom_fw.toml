[[tests]]
# BL1 security version EQUAL to the BL1_VERSION fuse floor -> accepted, boots.
#
# The ACCEPT boundary of check_security_version, which rejects only when
# manifest_ver < fuse_ver (manifest_crypto.c). Both slots are raised to
# security_version 36 and re-signed with dev0; the fuse floor is also 36.
#
# THE ACCEPT BOUNDARY, not the reject case, and the docstring says so at length.
# "manifest version := fuse version" is the equality case. The REJECT side is
# already covered twice here, by sep_firmware_backup_invalid_security_version_test
# and
# sep_firmware_primary_invalid_security_version_test; the primary-side ACCEPT
# boundary was covered by nothing.
#
# WHAT IT ADDS BEYOND THE BOUNDARY: all eight thermometer words, each
# distinguishable. Its preload gives word i exactly i+1 set bits, so the total is
# 1+2+...+8 = 36 and no plausible truncated, repeated or mis-indexed decode of those
# words reaches it (a literal "no other multiset" would be false -- 8+8+8+8+1+1+1+1
# also sums to 36 -- but no decode defect produces that multiset) -- where every
# other preload here concentrates its bits in word 0. The test requires the exact
# echo FUSE_VER=0x00000024, so any omitted, repeated or mis-indexed word changes the
# sum and fails. One bit per word (total 8) would be weaker: eight reads of the
# SAME word also sum to 8. Distinct per-word popcounts need at least 36 bits, and
# the manifest is raised to match, so the accept boundary is preserved.
#
# Needs +sep_crypto_edn_force: the primary is valid and runs a full RSA-3072 modexp.
name = "sep_firmware_bl1_ver_test"
module = "rom_fw.sep_firmware_bl1_ver_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 14400
tags = ["boot", "rom", "spi", "secure", "crypto", "otbn", "rsa", "rollback", "cpu", "subsystem", "dv_shortcut"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod_bl1ver36_spread.toml",
  "+sep_crypto_edn_force",
]


[[tests]]
# Manifest authenticates against CHIPLET FUSED key 0, unrevoked -> primary boots.
#
# One of four entries sharing ONE implementation,
# rom_fw/sep_chiplet_pubkey_base.py; this module's only substantive line is
# _CHIPLET_KEY = 0 and the base it picks. THE FUSED-KEY ARM IS DISTINCT CODE, not
# the ROM-key arm behind a different selector: validate_signature branches at
# manifest_crypto.c and the fused arm has its own fuse addressing, its
# own revocation bit and its own FUSE_KEY_EMPTY. These four items do not overlap the
# pubkey_rom_* families of batches R1 and R2.
#
# The preload does three things, each closing a different hole:
# CHIPLET_PUBK_HASH0 = SHA-256 of the dev0 modulus (the only usable RSA key here);
# CHIPLET_PUBK_HASH1 = a one-bit-flipped DECOY, so a ROM reading the wrong chiplet
# fuse fails PUBK_HASH_MISMATCH rather than booting -- a live guard, since
# manifest_crypto.c records that this ROM once read the wrong fuse words;
# and CHIPLET_PUBK_REVOKE bit 0 revokes ROM development key 0, which is inert on the
# correct ROM but makes a fall-through to the ROM-key arm print
# KEY_REVOKED idx=0x00000000, which this entry forbids.
#
# Matched pair with sep_firmware_chiplet_pubkey_0_revoke_test: byte-identical flash
# image, one CHIPLET_PUBK_REVOKE bit apart.
#
# Needs +sep_crypto_edn_force: the primary verifies and runs a real RSA-3072 modexp.
name = "sep_firmware_chiplet_pubkey_0_test"
module = "rom_fw.sep_firmware_chiplet_pubkey_0_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 14400
tags = ["boot", "rom", "spi", "secure", "crypto", "otbn", "rsa", "chiplet_key", "cpu", "subsystem", "dv_shortcut"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod_chiplet_key0.toml",
  "+sep_crypto_edn_force",
]


