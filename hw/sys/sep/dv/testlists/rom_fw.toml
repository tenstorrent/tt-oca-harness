[[tests]]
# TP049: the primary's ciphertext is corrupted and the manifest re-sealed, so the
# AES engine runs and the plaintext then fails the TOC identifier check.
# PROD + CLASS_KEY preload: PROD enforces the crypto chain from the lifecycle, and
# CLASS_KEY is the KBKDF root the ROM derives the AES key from.
# +esrc_noise_force brings the whole chain up, so every EDN client is served --
# AES on client 0 as well as OTBN's 2 and 3. Without it the AES masking PRNG
# never leaves reseed and the run hangs after DECRYPT_START (see
# sep_rom_oca_encrypted_boot_test).
#
# ############ RESOLVED 2026-09-14: the procedure step was over-generalised ############
#
# This entry was a deliberate known-fail sentinel while a specification question
# was open: TP049 step 5 read as "a decryption failure is TERMINAL and not
# backup-eligible", the ROM instead failed over to the backup and booted it, and
# CHK-NO-BACKUP-RETRY was left at full spec strength so the disagreement could not
# be hidden. The note here reserved the call for the procedure author.
#
# The procedure author has ruled, in the ROM's favour. The slot BUNDLE -- manifest
# and payload together, decryption and plaintext validation included -- is the unit
# of verification, and until a bundle is fully confirmed and the device begins
# locking for ROM exit, switching to the other slot is legitimate. That is what
# oca_boot.c's retry loop already implemented: every slot verdict is a WARN while
# retries remain, and only slot exhaustion is an ERROR with MANIFEST_ALL_FAILED.
# sep-boot-flow.puml agreed all along -- an invalid TOC identifier is a <<Warning>>
# routed to the (S) backup-retry connector.
#
# So the expectation changed, with that as the cited reason. This entry keeps the
# TERMINAL shape its name and base class describe, which under bundle-level
# failover requires the defect in BOTH slots; the one-slot shape moved to
# sep_decryption_failure_failover_test, which asserts the failover positively.
# Neither is a known-fail any more and both should run green.
#
# Two fixture defects were found and fixed while resolving this, either of which
# would have failed the run on its own:
#   * the CLASS_KEY preload carried a stale 16-byte AES-128-era key against an
#     AES-256 config, so BOTH slots decrypted to garbage and died at AES_PAD_BAD.
#     That also manufactured a false terminal outcome, which is what let the real
#     dispute hide for as long as it did.
#   * the testcase required PAYLOAD_OK (printed only after the WHOLE payload
#     validates, so unreachable here) and DECRYPT_START (a status-ring message,
#     never a console token).
#
# The verdict is MANIFEST_ERR=0x00030015 (OCA_FAIL_PAYLOAD_TOC), observed in run
# 20260914_145012. An earlier note here said 0x00030005; that predates the OCA
# result-code mapping and was stale.
# ################################################################################
name = "sep_decryption_failure_terminal_test"
module = "rom_fw.sep_decryption_failure_terminal_test"
target = "rom_boot"
firmware = { name = "boot_rom_ot", mode = "boot_rom_ot" }
seed = 1
# 21600 rather than 14400: an encrypted payload pays an AES decrypt on top of the
# RSA verify each slot already costs, and run 20260912_201006 capped it at
# 71.4 Mns of simulated time -- further than either passing comparable
# (backup_invalid_signature 55.2 Mns, bl1_size_invalid 61.2 Mns) and still inside
# RSA_EXEC. At the 4,959 ns/s it sustained, the verify and its tail need roughly
# 1,000-1,600 s more, so this matches the cap the other two-modexp members carry.
timeout_sec = 21600
tags = ["boot", "rom", "spi", "secure", "crypto", "encrypted", "error", "cpu", "subsystem", "dv_shortcut"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build_ot/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod_class_key.toml",
  "+esrc_noise_force",
]

[[tests]]
# The positive half of the bundle-level failover rule resolved on 2026-09-14: a
# defect found AFTER decryption -- deep inside the slot bundle -- must still fail
# over rather than end the boot. Same stimulus as the terminal member above but on
# the PRIMARY only, with the backup left shipped-valid and proved bootable before
# the run, so a green result means the ROM recovered rather than that nothing was
# wrong.
#
# Same preload and plusargs as the terminal member, and for the same reasons: PROD
