[[tests]]
# CHIPLET FUSED key 0 REVOKED -> both manifests refused -> terminal.
#
# CHIPLET_PUBK_REVOKE bit 16 refuses CHIPLET_PUBK_HASH0 (manifest_crypto.c
# selects the index tests it). Both slots select the same fused key and both
# are re-signed with dev0 and re-checked with verify_sealed before the run, so one
# fuse bit refuses two provably bootable manifests and the retry loop exhausts
# (MANIFEST_ALL_FAILED, manifest_load.c).
#
# THE STRICT FORM, for BOTH members. The ROM-slot revoke families of R1/R2 could
# only reach it at slot 0, because a non-zero slot binds to a digest the
# manifest's own modulus does not match and keeps a
# stale signature. Here the fuse digest is programmed and the
# image is re-signed, so revocation is the sole possible cause of the rejection.
#
# Bit 16, not bit 6: the sep_efuse_map RDL assigns [16]/[17] to
# CHIPLET_PUBK_HASH0/1. Bits 0x40/0x80 are unused ROM-slot bits in this map.
#
# No +sep_crypto_edn_force: revocation precedes rsa_3072_verify
# (manifest_crypto.c), so OTBN is never driven and RSA_VERIFY_START is
# forbidden. Matched pair with sep_firmware_chiplet_pubkey_0_test.
name = "sep_firmware_chiplet_pubkey_0_revoke_test"
module = "rom_fw.sep_firmware_chiplet_pubkey_0_revoke_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 7200
tags = ["boot", "rom", "spi", "secure", "error", "revocation", "chiplet_key", "cpu", "subsystem"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod_chiplet_key0_revoke.toml",
]


