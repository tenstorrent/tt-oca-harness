# Distinct from sep_firmware_primary_invalid_signature_type_test, which shares
# error code 0x0003000c (manifest.h, six arms): this entry pins the VALUED token
# PUBK_SEL=0x00000000 to TWO occurrences, one per slot, and requires
# RSA_VERIFY_FAIL; that one pins the BARE token PUBK_SEL= to ONE and forbids
# RSA_VERIFY_FAIL. Either half alone makes them mutually exclusive on one log.
