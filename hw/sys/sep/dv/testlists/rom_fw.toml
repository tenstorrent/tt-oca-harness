# lines are _REVOKED_SLOT = 2 and the FAILOVER base it picks. Its own OTP image is
# the rest of the stimulus: sep_efuse_lc_prod_pubk_revoke2.toml is
# sep_efuse_lc_prod.toml plus exactly that one bit, and the test asserts the
# bitmap is EXACTLY that bit.
#
# The outcome is a COMPLETED BOOT, not a terminal failure: only the primary
# selects slot 2, the backup keeps the shipped ROM slot 0
# (configs/secure_boot_test.yaml), and bit 2 does not revoke it. The
# reference grades the primary rejection WARNING and ends in EXEC_IMAGE.
#
# Slot 2's digest is another key's under TEST_BUILD (key_digests.c), so this entry
# also pins the ORDER -- revocation before the digest bind -- by forbidding
# PUBK_HASH_MISMATCH.
# NARROWED, disclosed in the module docstring: proving the stronger form would
# need a primary re-signed with slot 2's own key, which this tree does not
# ship, so this member proves only "revocation preempts the empty-digest arm".
#
# Needs +sep_crypto_edn_force: the backup is valid and runs a full RSA-3072
# modexp on OTBN. It grants OTBN's EDN handshakes only; the RSA assertions are
# untouched, so SIG_VALID still means the signature really verified.
name = "sep_firmware_primary_pubkey_rom_2_revoked_key_test"
module = "rom_fw.sep_firmware_primary_pubkey_rom_2_revoked_key_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 14400
tags = ["boot", "rom", "spi", "secure", "crypto", "error", "failover", "revocation", "cpu", "subsystem", "dv_shortcut"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod_pubk_revoke2.toml",
  "+sep_crypto_edn_force",
]

