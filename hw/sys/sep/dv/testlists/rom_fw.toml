# ############################################################################
# TOC major version and image count: the two SILENT arms of
# validate_manifest_payload (bootrom/prod/src/manifest_load.c). Neither prints a
# token of its own, so every row below is graded on its error code
# (0x00030006 for the version, 0x00030010 for the count), on the position of the
# rejection inside its slot's attempt, and on the bytes the flash device served
# at the field address. Each row also FORBIDS the sibling arm's code, so a row
# cannot pass on the other family's verdict. See cocotb/tests/rom_fw/sep_toc_defect.py.
#
# Two images are used, and which one a row loads is the encrypted/non-encrypted
# axis: secure_boot.bin has encrypted_payload = 0 on BOTH slots, encrypted_boot.bin
# has 1 on both. The encrypted rows plant the defect in the DECRYPTED payload and
# re-encrypt, because the ROM parses the TOC only after decrypt_payload; the
# encrypted image also needs the CLASS_KEY fuse preload, or decryption produces
# garbage and the run dies one arm earlier at BAD_TOC_ID.
#
# Every row needs +sep_crypto_edn_force. The primary rows run two RSA-3072
# modexps (the mutated primary's signature is re-sealed and verifies, then the
# recovering backup's); the encrypted rows additionally drive AES, which is EDN
# client 0. Budget the primary rows like sep_decryption_failure_terminal_test.
# ############################################################################

[[tests]]
