[[tests]]
# PRIMARY signature fails RSA verification; the backup verifies and boots.
#
# One bit of the primary signature's byte 0 is flipped (
# flip_signature_byte(byte_index=0, xor_mask=0x01)). The signature sits outside
# the hashed TBS, so no re-hash and no re-sign; verify_layout is asserted
# afterwards to prove the TBS hash is still intact and the slot really reaches
# rsa_3072_verify.
#
# The ONLY entry in this group whose PRIMARY drives the verifier, and it says so:
# primary_expected_rsa_starts = 1, so the shared base requires the primary's own
# RSA_EXEC between the primary read and the primary error and a total of
# exactly 2 across the run. Every other member declares 0.
#
# Distinct from sep_firmware_primary_invalid_signature_type_test, which shares
# the same error code: this entry pins the VALUED token
# PUBK_SEL=0x00000000 to TWO occurrences, one per slot, and requires
# RSA_PKCS1_FAIL; that one pins the BARE token PUBK_SEL= to ONE and forbids
# RSA_PKCS1_FAIL. Either half alone makes them mutually exclusive on one log.
#
# Needs +esrc_noise_force: TWO full modexps run here.
name = "sep_firmware_primary_invalid_signature_test"
module = "rom_fw.sep_firmware_primary_invalid_signature_test"
target = "rom_boot"
firmware = { name = "boot_rom_ot", mode = "boot_rom_ot" }
seed = 1
# 21600 rather than 14400: this member runs TWO RSA-3072 modexps -- one per slot
# -- and at the group's --sim-jobs 6 contention the 4 h cap cut it off inside the
# second one, 1-3 Mns of simulated time from finishing. Measured in run
# 20260911_003223: a passing verify costs ~2.3 Mns of simulated time, and a failing
# slot takes ~5.0 Mns from RSA_EXEC through to its terminal verdict. Each of the four
# members capped there was 94-99% of the way through. The extra 2 h is headroom over
# that shortfall, not a new budget.
timeout_sec = 21600
tags = ["boot", "rom", "spi", "secure", "crypto", "otbn", "rsa", "error", "failover", "cpu", "subsystem", "dv_shortcut"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build_ot/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod.toml",
  "+esrc_noise_force",
]

