[[tests]]
# BL1 security version carrying every device flag -> accepted, boots.
#
# The accept boundary of anti-rollback, which refuses a manifest that omits a flag
# the device holds: (device & ~manifest) != 0. security_version is a 128-flag
# bitmap, not a counter, so equality is the boundary. Both slots are written with
# exactly the device's flags and re-sealed.
#
# The preload spreads flags across all four words the platform reads -- the low 16
# bytes of BL1_VERSION -- each distinct and non-empty, so a truncated or
# mis-indexed read changes the verdict rather than passing. The reject side is
# covered by sep_firmware_backup_invalid_security_version_test and
# sep_firmware_primary_invalid_security_version_test.
#
# The device flags are read twice per slot: the library re-runs the check after the
# signature, so FUSE_VER= appears twice on the one slot attempted.
#
# Needs +esrc_noise_force: the primary is valid and runs a full RSA-3072 modexp.
name = "sep_firmware_bl1_ver_test"
module = "rom_fw.sep_firmware_bl1_ver_test"
target = "rom_boot"
firmware = { name = "boot_rom_ot", mode = "boot_rom_ot" }
seed = 1
timeout_sec = 14400
tags = ["boot", "rom", "spi", "secure", "crypto", "otbn", "rsa", "rollback", "cpu", "subsystem", "dv_shortcut"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build_ot/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod_bl1ver36_spread.toml",
  "+esrc_noise_force",
]


[[tests]]
# Manifest authenticates against CHIPLET FUSED key 0, unrevoked -> primary boots.
#
# One of four entries sharing ONE implementation,
# rom_fw/sep_chiplet_pubkey_base.py; this module's only substantive line is
# _CHIPLET_KEY = 0 and the base it picks. THE FUSED-KEY ARM IS DISTINCT CODE, not
# the ROM-key arm behind a different selector: the platform dispatches on the
# slot's bitmap region, and the fused arm has its own fuse addressing, its
# own revocation bit and its own PUBK_OTP_EMPTY. These four items do not overlap the
# pubkey_rom_* families of batches R1 and R2.
#
# The preload does three things, each closing a different hole:
# CHIPLET_PUBK_HASH0 = SHA-256 of the dev0 modulus (the only usable RSA key here);
# CHIPLET_PUBK_HASH1 = a one-bit-flipped DECOY, so a ROM reading the wrong chiplet
# fuse fails PUBK_UNAUTHORIZED rather than booting; and CHIPLET_PUBK_REVOKE bit 0
# revokes ROM development key 0, which is inert on the correct ROM but makes a
# fall-through to the ROM-key arm resolve slot 0, printing PUBK_SEL=0x00000000,
# which this entry forbids.
#
