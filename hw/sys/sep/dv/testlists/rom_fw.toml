# A positive test that passed because key selection never ran would prove nothing,
# so "it booted" is not the criterion. Four channels are required: PUBK_SEL=
# 0x00000000 and PUBK_REVOKE=0x00000000 each EXACTLY ONCE (the backup is never
# read, so a second echo means an unselected slot reached key selection);
