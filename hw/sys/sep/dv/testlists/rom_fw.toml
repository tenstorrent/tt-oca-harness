# ############################################################################
# PER-WORD SELECTOR AND v1.x LENGTH-BOUND CLOSURE. Three rows, each pairing a
# refused PRIMARY with an accepted BACKUP so both poles of one rule are graded in
# a single run.
#
# The two device-ID rows add the selected-and-matching and unselected-and-
# mismatching legs that the mismatch-only rows leave open. The rule they grade,
# the fuse-map model value their matching words depend on, and what the accepted
# slot does not establish are in
# cocotb/tests/rom_fw/sep_device_id_variation_base.py.
#
# The length row declares 2049 on the primary and 2048 on the backup under the
# same minor version, so MANIFEST_MAX_SIZE is bracketed from both sides -- the
# off-by-one the existing minor-nonzero rows (1188 accepted, 2052 refused) leave
# open.
# ############################################################################

[[tests]]
# PRIMARY selector_bits[7:0] = 0x24: word 2 matches at 0x00000000, word 5 carries
# the shipped 0xa5a5a5a5, and words 0/1/3/4 mismatch with their bits CLEAR, so
# CID_IDX must be 5. BACKUP selects all eight words at the matching value and
# boots. The package_id selector byte stays clear over eight mismatching words in
# both slots.
#
# Needs +sep_smc_fuse_sense_done: with a non-zero selector byte the ROM waits for
# smc_fuse_sense_done before reading the SMC fuse map and this TB has no SMC to
# raise it; without the plusarg the ROM burns its 1,000,000-iteration bounded wait
# on both slots and reaches the same verdict hours later. The timeout
# fall-through is therefore NOT exercised here.
# Needs +sep_crypto_edn_force: the recovering backup runs a full RSA-3072 modexp.
name = "sep_chiplet_id_per_word_variations_test"
module = "rom_fw.sep_chiplet_id_per_word_variations_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 14400
tags = ["boot", "rom", "spi", "secure", "manifest", "error", "cpu", "subsystem", "failover", "crypto", "efuse", "dv_shortcut"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod.toml",
  "+sep_crypto_edn_force",
  "+sep_smc_fuse_sense_done",
]

[[tests]]
