# (key_digests.c) and the slot the image is signed against, so the selector
# write is a no-op: the flash image is byte-identical to the shipped
# bootrom/prod/build/oca_secure_boot.bin and the test proves BOTH slots still pass
# verify_sealed and verify_public_key. Two provably bootable manifests refused by
# one fuse bit. Matched pair with sep_firmware_primary_rom_key_valid_test, which
# runs the identical image with the fuse clear and boots from the primary.
#
# No +esrc_noise_force: revocation precedes the signature step, so OTBN is
# never driven and RSA_EXEC is forbidden.
