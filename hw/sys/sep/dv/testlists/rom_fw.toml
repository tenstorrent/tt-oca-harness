schema_version = 1

# ROM firmware boot tests: the production Boot ROM on the `rom_boot` RTL target with the `boot_rom` /
# `boot_rom_pio` firmware profiles. They run only in the `rom_fw` group, not `cpu` or `all`; select
# them by group or by test name.

[[tests]]
# Non-secure boot of the production Boot ROM with the manifest served from SMC SRAM (SPI stubbed).
name = "sep_rom_non_secure_boot_test"
module = "rom_fw.sep_rom_non_secure_boot_test"
target = "rom_boot"
# The manifest packer needs `git submodule update --init hw/sys/sep/bootrom/prod/tools/tt-oca-manifest`.
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 3600
tags = ["boot", "rom", "cpu", "subsystem"]
run_modes = ["cpu"]
# No +skip_fuse_sense: the ROM lifecycle policy needs the LC_STATE that only the real fuse sense writes.
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_smc_mem_hex={repo_root}/hw/sys/sep/bootrom/prod/build/oca_smc_mem.hex",
]

[[tests]]
# OpenTitan SPI boot, SECURE_DMA drain; no SMC SRAM image is staged, so an SMC-SRAM fallback cannot pass.
name = "sep_rom_ot_dma_boot_test"
module = "rom_fw.sep_rom_ot_dma_boot_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
