# TOC defect rows: one planted TOC field per row. Encrypted rows use the CLASS_KEY preload.

[[tests]]
# Primary encrypted TOC major_version 2 must be refused with OCA_FAIL_PAYLOAD_TOC; the backup boots.
name = "sep_firmware_primary_encrypted_payload_toc_version_major_invalid_test"
module = "rom_fw.sep_firmware_primary_encrypted_payload_toc_version_major_invalid_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 21600
tags = ["boot", "rom", "spi", "secure", "manifest", "payload", "toc", "encrypted", "error", "failover", "crypto", "cpu", "subsystem", "dv_shortcut", "rtl_issue"]
run_modes = ["cpu"]
expect_fail = "B1_toc_version_major_not_rejected.md: the OCA library and the ROM do not compare toc_version_major, so a TOC major version above 1 is accepted"
expect_fail_match = "slot attempts read \\['0x00001000'\\], expected \\['0x00001000', '0x00041000'\\]: a failover is the primary then the backup, once each\\. Console: "
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod_class_key.toml",
  "+esrc_noise_force",
]

