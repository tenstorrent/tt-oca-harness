[[tests]]
# Secondary chiplet, valid published manifest. No +sep_boot_from_spi, so
# STRAPS_LO[25] stays clear, boot_from_spi() is false and the recovery arm is
# unreachable too -- rom_main.c lands on its else branch and prints
# BOOT_SECONDARY.
#
# The SMC responder publishes manifest offset 0x1000 in scratch[8] by default,
# which is where the packed smc_mem.hex really carries "TBL1". No
# +sep_smc_scratch8: the testcase asserts the plusarg is ABSENT for this member,
# so a stray one cannot turn it into a copy of its sibling.
#
# No efuse preload and no +sep_crypto_edn_force. The SMC image is the unsigned
# one and the zero OTP senses TEST_DEV, which the manifest permits, so secure
# boot is off by the manifest's own flag and there is no RSA work to feed entropy
# to. A PROD preload would force authentication of an unsigned image and this
# would become a signature test.
name = "sep_firmware_secondary_chiplet_bootcode_test"
module = "rom_fw.sep_firmware_secondary_chiplet_bootcode_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 7200
tags = ["boot", "rom", "secondary", "strap", "manifest", "cpu", "subsystem"]
run_modes = ["cpu"]
args = [
