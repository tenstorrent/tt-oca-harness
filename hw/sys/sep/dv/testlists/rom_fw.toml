[[tests]]
# VERILATOR ONLY, enforced by `tools` on the entry below. The scenario reads the
# SRAM array through cocotb.top at gen_ram_inst[0].u_mem.mem, which resolves under
# Verilator via sep_public_scope.vlt and not under VCS, where the walk fails on the
# generate index and the test errors before simulating. A group or tag selection
# under another tool drops this entry and says so; naming it in --items under one
# is an error rather than a silent no-op.
# TP080 -- the EXT SRAM is cleared between the primary rejection and the backup
# fetch. Subclasses the entry above and inherits its stimulus and every one of its
# failover checks unchanged; what it adds is an SRAM scoreboard.
#
# Same axes and the same two plusargs as its parent, because the scenario is the
# parent's scenario. No new plusarg, no new firmware profile, no testbench change:
# the SRAM macro's storage array is already public_flat_rw (sep_public_scope.vlt:38)
# and is therefore readable and writable from cocotb over VPI.
#
# TWO THINGS A READER SHOULD KNOW BEFORE TREATING A GREEN RUN AS FULL TP080
# COVERAGE.
#
# 1. It covers the EXT SRAM half of TP080 only, and the reason the other half is
#    missing is NOT that someone forgot a memset. sep-boot-flow.puml asks for
#    the SMC SRAM clear only "if SMC SRAM used", and puml:384-392 decides "used"
#    from a manifest bit declaring it. The OCA manifest declares no such bit, so
#    there is nothing for a producer to set and nothing for the ROM to branch on:
#    the payload is staged in EXT SRAM unconditionally. The run observes exactly
#    that -- it boots a
#    manifest with flag_args=0x00000000 and then logs COPY_SRC=0x10002000, i.e. the
#    payload staged in EXT SRAM (LOAD=0xC0000000 is BL1's ICCM destination, not the
#    staging area). So there is nothing for an SMC-clear
#    assertion to check. (Independently, the only path whose manifest comes from SMC
#    SRAM runs with no retries, so it has no retry window at all.) The test asserts nothing about SMC SRAM and says so in its own log
#    (CHK-SCOPE).
# 2. It is one of the slower members of this group, and almost all of that is
#    INHERITED rather than added here. The failover clear it asserts is 65536 CPU
#    stores (about 1.05M clocks), which sep_spi_primary_fail_backup_test above
#    pays as well without asserting on it. What this entry adds on top is the
#    scoreboard's VPI traffic (one 32768-word fill plus its read-back, and one
#    32768-word scan).
#
#    COMPARE IN CYCLES, NOT MILLISECONDS OR WALL SECONDS. The testbench randomises
#    sys_clk_period per run, so simulated-time and wall-clock figures are not
#    comparable between runs and an earlier version of this comment drew a wrong
#    conclusion from exactly that. The parent's three runs on disk span 20.09,
#    14.51 and 6.70 ms for the same work; the cycle count is what is invariant.
#    Cycle-normalised, the parent band is 772-816 s per Mcycle against this
#    entry's 856, so the scoreboard's attributable cost is roughly 97 s, about
#    7.5% -- not the ~148 s / ~12% a naive wall-second subtraction gives, because
#    that comparison used runs at 16 ns and 13 ns clock periods and TP080 also
#    executed 4.8% more cycles. Treat 7.5% as an estimate with a real error bar,
#    not as a measurement.
#    Do not "speed it up" by scanning fewer words -- the claim is that the whole
#    256 KiB was cleared, and a sparser scan cannot support it.
name = "sep_failover_sram_clear_assertion_test"
module = "rom_fw.sep_failover_sram_clear_assertion_test"
target = "rom_boot"
firmware = { name = "boot_rom_ot", mode = "boot_rom_ot" }
tools = ["verilator"]
seed = 1
timeout_sec = 7200
tags = ["boot", "rom", "spi", "failover", "sram", "cpu", "subsystem"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build_ot/boot_rom.vmem",
  "+sep_boot_from_spi",
]

