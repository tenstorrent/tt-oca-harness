[[tests]]
# The primary's ciphertext is corrupted and the manifest re-sealed, so the
# AES engine runs and the plaintext then fails the TOC identifier check.
# PROD + CLASS_KEY preload: PROD enforces the crypto chain from the lifecycle, and
# CLASS_KEY is the KBKDF root the ROM derives the AES key from.
# +sep_crypto_edn_force covers EDN client 0 (AES) as well as OTBN's 2/3; without
# it the AES masking PRNG never leaves reseed and the run hangs after
# DECRYPT_START (see sep_firmware_encrypted_boot_test).
#
# ################ THIS TEST IS EXPECTED TO FAIL. DO NOT "FIX" IT. ################
#
# It is a deliberate known-fail sentinel, kept red on purpose while a
# specification question is open. This framework has no xfail/expect_fail
# mechanism, so a red `rom_fw` or `all` run with THIS test as the only failure is
# the expected result, not a regression. Budget ~47 minutes for it.
#
# What it asserts and why it fails: the procedure says a decryption
# failure is TERMINAL. The ROM instead rejects the primary and fails over to the
# backup, which then boots -- observed as DECRYPT_OK, MANIFEST_ERR=0x00030005,
# then MANIFEST_SRC=0x00041000 and BL1_JUMP=0xC0000000. CHK-NO-BACKUP-RETRY is
# left at full spec strength and therefore fires.
#
# Who is right is NOT yet decided, which is exactly why this stays red. The
# authoritative flow diagram sides with the ROM: a primary
# with an invalid TOC identifier is a <<Warning>> routed to the (S) backup-retry
# connector, and only DECRYPTION_KEY_FAILED / DECRYPTION_FAILED are <<Error>> +
# kill. So the procedure step looks over-generalised -- but that is the procedure
# author's call to make, not DV's.
#
# Do NOT resolve this by relaxing CHK-NO-BACKUP-RETRY, by removing this entry from
# the groups in all.toml, or by deleting the test. Any of those hides an open
# specification dispute. When the procedure author rules, either the procedure is
# corrected (then this test's expectation changes with a cited reason) or the ROM
# is corrected (then this test goes green on its own).
#
# Full evidence, both variants, and the decision needed:
# ################################################################################
name = "sep_decryption_failure_terminal_test"
module = "rom_fw.sep_decryption_failure_terminal_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 14400
tags = ["boot", "rom", "spi", "secure", "crypto", "encrypted", "error", "cpu", "subsystem", "dv_shortcut"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod_class_key.toml",
  "+sep_crypto_edn_force",
]

# ############################################################################
# DECRYPTION INPUT NEGATIVES -- one wrong input each, three rows.
#
# The ROM's payload key and cipher depend on three inputs: the CLASS_KEY fuse, the
# manifest's encryption_kdf_input and the manifest's encryption_iv
# (manifest_crypto.c, decrypt_payload). Each row below makes exactly one of them
# wrong and leaves the other two, the ciphertext and the signature golden.
#
# None of the three is a decryption error: all three decrypt to garbage, print
# DECRYPT_OK and are refused one arm later with MANIFEST_ERR=0x00030005, so each
# row grades the ORDER as well as the code. Every row keeps a healthy recovery
# slot, so none of them settles the terminal-decryption requirement that
# sep_decryption_failure_terminal_test above owns. See
# cocotb/tests/rom_fw/sep_decrypt_input_defect.py for the per-row oracle.
#
# Each row's image is configs/encrypted_boot_test.yaml plus ONE override, built by
# `make -C hw/sys/sep/bootrom/prod decrypt_negative_images`.
#
# Every row needs +sep_crypto_edn_force (AES is EDN client 0, OTBN is 2/3) and two
# RSA-3072 modexps. Budget them like sep_decryption_failure_terminal_test.
# ############################################################################

