#
# The selector names slot 26 == OCA_KEY_SLOT_MAX + 1, the smallest slot the
# format reserves. A larger value would pass equally against a ROM that wrote
# >= instead of >; slot 25 is a valid fuse-held key.
#
# The load-bearing check is a COUNT, not a forbid, and the difference matters:
# the reserved-range check runs inside is_key_authorized, which the validator
# calls before the revocation check. That is a security property because
# revocation indexes its bitmap by slot number. The backup-side sibling can
# forbid PUBK_REVOKE= outright;
