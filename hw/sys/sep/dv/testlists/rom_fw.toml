[[tests]]
# PRIMARY is below the rollback floor; the backup, exactly AT the floor, boots.
#
# Its own OTP image is half the stimulus: sep_efuse_lc_prod_secver1.toml sets
# BL1_VERSION to a thermometer count of 1. The shipped image carries
# security_version 0 in both slots, so the primary is refused untouched and the
# backup is raised to 1 and RE-SEALED with the dev0 key that ships in this tree.
# Re-signing keeps the ROM's signature check enabled and passing on a
# legitimately signed image, and env/sep_payload_mutate.verify_signing_key proves
# the local
# signer reproduces the shipped signature byte for byte first.
#
# Anti-rollback runs after the root key is authorized and BEFORE the signature,
# and the entry asserts that ordering rather than assuming it: RSA_EXEC must not
# appear before the backup read, so the verdict is the intended REASON and not
# merely a rejection.
#
