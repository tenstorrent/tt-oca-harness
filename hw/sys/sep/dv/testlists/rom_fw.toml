schema_version = 1

# ROM firmware boot tests: the CPU runs the production Boot ROM against a behavioral SMC responder.
# They need the `rom_boot` RTL target and the `boot_rom`/`boot_rom_pio` firmware profiles.
# Run them through the `rom_fw` group or by test name; `cpu` and `all` do not include them.

[[tests]]
# Boots the production ROM over the SMC-SRAM manifest path and expects BL1 PASS on the mailbox.
name = "sep_rom_non_secure_boot_test"
module = "rom_fw.sep_rom_non_secure_boot_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 3600
tags = ["boot", "rom", "cpu", "subsystem"]
run_modes = ["cpu"]
# Needs the tt-boot-manifest submodule; real fuse sense, since the ROM checks sensed LC_STATE.
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_smc_mem_hex={repo_root}/hw/sys/sep/bootrom/prod/build/smc_mem.hex",
]

[[tests]]
# SPI boot with the SECURE_DMA drain; no SMC-SRAM image is staged, so a fallback cannot pass.
name = "sep_rom_ot_dma_boot_test"
module = "rom_fw.sep_rom_ot_dma_boot_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 7200
tags = ["boot", "rom", "spi", "cpu", "subsystem"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
]

[[tests]]
# SPI boot with the CPU-polled PIO drain (BOOT_OT_SPI_USE_PIO=1).
name = "sep_rom_ot_pio_boot_test"
module = "rom_fw.sep_rom_ot_pio_boot_test"
target = "rom_boot"
firmware = { name = "boot_rom_pio", mode = "boot_rom_pio" }
seed = 1
timeout_sec = 7200
tags = ["boot", "rom", "spi", "cpu", "subsystem"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build_pio/boot_rom.vmem",
  "+sep_boot_from_spi",
]

[[tests]]
# Secure SPI boot: the RSA-3072 image passes rollback, revocation, RSA verify and payload hash.
name = "sep_rom_ot_secure_boot_test"
module = "rom_fw.sep_rom_ot_secure_boot_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 14400
tags = ["boot", "rom", "spi", "secure", "crypto", "cpu", "subsystem", "dv_shortcut"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
  # DV shortcut: forces OTBN EDN grants, as the ROM starts no entropy chain; RSA checks stay intact.
  "+sep_crypto_edn_force",
]

[[tests]]
# MEM_REPAIR gate: a DFT status with only mem_repair_success clear halts the ROM before C code runs.
name = "sep_firmware_mbist_fail_test"
