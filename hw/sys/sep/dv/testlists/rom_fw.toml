# NOT prove rotation, because an unrotated ROM would reject 0x1000 as BAD_MAGIC
# and then boot 0x41000 anyway. The evidence is address ORDER (asserted on the
# console, on the retry label, and on the flash model's own transaction log), not
# the fact that it booted.
