[[tests]]
# MEM_REPAIR (MBIST) boot gate, PASS arm -- the partner of
# sep_firmware_mbist_fail_test. Same gate, same injection mechanism, opposite
# stimulus and opposite expectation.
#
# +sep_dft_status=00000112 is exactly the three bits the gate requires and
# NOTHING else: mem_repair_success (bit 1), mbist_done (bit 4), mbist_pass
# (bit 8). It deliberately leaves mem_repair_done (bit 0), mem_repair_abort
# (bit 2) and mbist_abort (bit 12) clear, so a gate that keyed on any of those
# would fail here. Injecting nothing would leave the tb default 0x113, which also
# boots but cannot tell which bits are load-bearing.
#
# This was 0x00000002 while the gate read only mem_repair_success. That value now
# HANGS, and correctly so: with mbist_done clear the ROM waits for MBIST to
# finish, times out, and treats it as a failure. If this entry is ever reverted to
# 0x02 the symptom will be a very slow hang, not an obvious rejection.
#
# The gate writes nothing on the pass path (it is pre-C assembly, and every
# console/status/scratch write sits on the failure branch), so this entry borrows
# the OT-SPI non-secure boot as its "and then it booted" evidence. That makes the
# axes and the timeout the same as sep_rom_ot_dma_boot_test's; it says nothing
# about SPI, which is downstream of the gate.
name = "sep_firmware_mbist_pass_test"
module = "rom_fw.sep_firmware_mbist_pass_test"
target = "rom_boot"
firmware = { name = "boot_rom_ot", mode = "boot_rom_ot" }
seed = 1
timeout_sec = 7200
tags = ["boot", "rom", "mbist", "cpu", "subsystem"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build_ot/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_dft_status=00000112",
]

