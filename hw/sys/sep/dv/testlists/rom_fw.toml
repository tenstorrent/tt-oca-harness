# MBIST arm of the boot gate, FAILURE case -- the leg neither existing MBIST
# test reaches. sep_firmware_mbist_fail_test injects 0xFFFFFFFD, which stops on
# the REPAIR arm before MBIST is ever evaluated, so without this entry the MBIST
# check added for sep-boot-flow.puml has no testcase that exercises its
# rejection at all.
#
# +sep_dft_status=00000012 = mem_repair_success (bit 1) SET so the repair arm
# passes, mbist_done (bit 4) SET so the gate stops polling and trusts the
# verdict, mbist_pass (bit 8) CLEAR so that verdict is a failure. The test
# asserts all three, because each one moves the run onto a different path: clear
# bit 1 and it stops on repair; clear bit 4 and it reaches the same handler by
# TIMEOUT instead, proving something else while still looking green.
#
# Reuses build_ot/ and the repair arm's axes for the same reason that one does:
# the gate is upstream of every transport decision, so the SPI variant cannot
# affect it. No +sep_boot_from_spi -- the ROM halts long before a transport is
# chosen, and passing it would imply this test says something about SPI.
