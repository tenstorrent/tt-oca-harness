[[tests]]
# Backup selects a ROM key slot with no compiled-in digest. The verification
# modulus comes from the manifest, so an unpopulated slot must fail closed:
# skipping the digest bind would verify a manifest against a modulus it supplied
# itself. Everything else about the backup is valid, so ROM_KEY_EMPTY is the only
# available verdict. Same PROD OTP as the sibling key tests -- an unrevoked slot
# and BL1_VERSION 0, so neither revocation nor rollback pre-empts the check.
name = "sep_firmware_backup_unpopulated_rom_key_slot_test"
module = "rom_fw.sep_firmware_backup_unpopulated_rom_key_slot_test"
target = "rom_boot"
firmware = { name = "boot_rom_ot", mode = "boot_rom_ot" }
seed = 1
timeout_sec = 7200
