# image, so both run bytes identical to bootrom/prod/build/secure_boot.bin and
# differ only in one bit of CHIPLET_PUBK_REVOKE. Fuse clear boots; bit 0 set
# refuses both manifests.
#
# A positive test that passed because key selection never ran would prove nothing,
# so "it booted" is not the criterion. Four channels are required: PUBK_SEL=
# 0x00000000 and PUBK_REVOKE=0x00000000 each EXACTLY ONCE (the backup is never
# read, so a second echo means an unselected slot reached key selection);
# RSA_VERIFY_START -> SIG_VALID -> CRYPTO_VALIDATE_OK in that order after the
# selector; and the DEVICE side -- not one read inside the backup slot span, which
# is the only channel that can say the PRIMARY served the boot, because a silent
# failover also reaches MANIFEST_OK.
