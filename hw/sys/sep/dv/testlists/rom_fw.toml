[[tests]]
# The CHIPLET digest fuse holds the WRONG value -> both slots refused, terminally.
#
# Closes the digest-source class that rom_fw/sep_chiplet_pubkey_base.py leaves
# open, and needs no second private key: distinguishing the digest source needs
# the fuse to
# differ from public_key_digests[0] plus a NEGATIVE assertion. A ROM that took
# the fused arm, tested the right revoke bit, read the right fuse address and
# then compared against the compiled-in table would BOOT here and fail this
# testcase; the four existing chiplet members cannot see it, because their fuse
# digest and public_key_digests[0] are byte-identical.
#
# THE SELECTED FUSE HOLDS A DECOY AND THE UNSELECTED ONE HOLDS THE REAL DIGEST,
# which makes this catch TWO classes rather than one: a ROM comparing against
# public_key_digests[0] boots, and so does a ROM that read the wrong chiplet fuse
# address. An earlier draft used two different decoys and caught only the first.
# The three fuse values are byte-identical to sep_efuse_lc_prod_chiplet_key1.toml's,
# so this testcase and sep_firmware_chiplet_pubkey_1_test are a matched pair on the
# FUSE side: one fuse image, two manifests differing only in public_key_sel,
# opposite verdicts. What it does NOT catch is the historical +0x100/+0x120
# wrong-ADDRESS derivation: that base reads a digest
# matching nothing and so produces the mismatch this entry already requires. R07
# conflates the two classes; the positive members cover the address one.
#
# Both slots select PUBK_SEL_FUSE_KEY_0 and are re-signed with dev0 by the SAME
# select_chiplet_fuse_key() call the positive member sep_firmware_chiplet_pubkey_0_test
# makes, so the two flash images are byte-identical and the only difference
# between "boots" and "refused" is two fuse words. CHIPLET_PUBK_REVOKE bits 16/17
# are CLEAR and PUBK_REVOKE=0x00000001 is required twice, so the revocation check
# provably ran and PERMITTED the key: the digest is the sole cause.
#
# No +esrc_noise_force: the digest bind precedes rsa_3072_verify
#, so OTBN is never driven and RSA_EXEC
# is forbidden. Two slot attempts, zero modexps.
name = "sep_firmware_chiplet_pubkey_0_wrong_digest_test"
module = "rom_fw.sep_firmware_chiplet_pubkey_0_wrong_digest_test"
target = "rom_boot"
firmware = { name = "boot_rom_ot", mode = "boot_rom_ot" }
seed = 1
timeout_sec = 14400
tags = ["boot", "rom", "spi", "secure", "lifecycle", "efuse", "chiplet", "chiplet_key", "pubkey", "cpu", "subsystem"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build_ot/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod_chiplet_key0_wrong_digest.toml",
]

[[tests]]
# OCA encrypted payload: AES-256-CBC ciphertext with the key derived from the
# CLASS_KEY eFuse bank through the OCA KDF. Signed as well as encrypted -- the
# format forbids encryption without secure boot -- so this is the signed test
# plus the decryption stretch, and it inherits that test's markers.
#
# The only DV test that drives the AES engine or runs the HMAC core as a KDF.
# Both drivers had latent bugs found during the OCA integration (HMAC key_length
# left unset and the key packed little-endian; AES KEY_LEN needing a one-hot
# encoding) which until now were only ever validated against the VP model.
#
# Needs +esrc_noise_force for the same reason the signed sibling does: the RSA
# verify still runs, OTBN parks in UrndRefresh without EDN entropy, and the ROM's
# own bring-up supplies that entropy from the real chain.
name = "sep_rom_oca_encrypted_boot_test"
module = "rom_fw.sep_rom_oca_encrypted_boot_test"
target = "rom_boot"
firmware = { name = "boot_rom_ot", mode = "boot_rom_ot" }
seed = 1
timeout_sec = 14400
tags = ["boot", "rom", "spi", "secure", "crypto", "oca", "cpu", "subsystem", "dv_shortcut"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build_ot/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+esrc_noise_force",
]

