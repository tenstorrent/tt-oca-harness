  # The image is signed, so the signature is still checked under SBOOT_DIS and OTBN needs EDN entropy.
  "+esrc_noise_force",
]

[[tests]]
# SBOOT_DIS reserved bits are a fuse-integrity fault, not a second chicken bit.
#
# The companion to the entry above, on the other half of the same register:
# there the chicken bit is blown and must be honoured, here a RESERVED bit is
# set and must not be mistaken for it. rsvd[31:1] is hw=rw in the RDL, so a real
# part can present a non-zero word without disable_secure_boot being blown, and
# [S18] stops on it (SEP-ROM-SB-041).
#
# +sep_efuse_preload carries an explicit path for the same reason as the entry
# above: a bare plusarg resolves to the committed default, which is TEST_DEV with
# an all-zero SBOOT_DIS and would make this vacuous.
#
# Neither +sep_boot_from_spi nor +esrc_noise_force: [S18] precedes boot-mode
# selection and SPI bring-up ([S21]) and entropy is brought up lazily by the
# first crypto callback, so no transport is chosen and no EDN handshake is owed.
# If this test ever needs either plusarg, the fault has stopped being terminal.
#
# Budget matches sep_firmware_mbist_fail_test: this run halts before any RSA
# work, and the ROM self-hash at [S17] is the expensive part in front of it.
name = "sep_firmware_sboot_dis_rsvd_terminal_test"
module = "rom_fw.sep_firmware_sboot_dis_rsvd_terminal_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 3600
tags = ["boot", "rom", "efuse", "secure", "lifecycle", "error", "cpu", "subsystem"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod_sboot_dis_rsvd.toml",
]

[[tests]]
# An OTBN that never executed must not report a verified signature.
#
# +sep_otbn_cmd_drop holds reg2hw.cmd.qe low so OTBN ignores every command while
# staying powered and idle, and the test forges the literal PKCS#1 v1.5 block
# into both slots' signature fields. The modexp result shares its DMEM buffer
# with the signature, so a block that never runs leaves the forgery in place for
# the checker to accept -- an unverified boot reported as a verified one. The
# ROM must refuse it on INTR_STATE.done instead.
#
# +esrc_noise_force is load-bearing: the signature path establishes entropy
# before OTBN, and without injected noise the health test stops the boot short
# of the verifier this entry exists to exercise.
#
# No +sep_efuse_preload: the packed image carries secure_boot_control, so
# verification is in force under the default TEST_DEV OTP, the same way
# sep_rom_ot_secure_boot_test relies on it.
name = "sep_otbn_no_op_bypass_test"
module = "rom_fw.sep_otbn_no_op_bypass_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
# No modexp runs on either slot, so this is far short of the full-RSA entries.
timeout_sec = 7200
tags = ["boot", "rom", "secure", "crypto", "otbn", "error", "cpu", "subsystem"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_otbn_cmd_drop",
  "+esrc_noise_force",
]

