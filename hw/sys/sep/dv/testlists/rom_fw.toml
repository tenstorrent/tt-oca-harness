[[tests]]
# Key revocation bitmap, CONSTRAINED-RANDOM. The seed draws the whole stimulus --
# the 8-bit CHIPLET_PUBK_REVOKE bitmap and both manifests' ROM key slots -- and
# the run lands in one of four classes: clean proceed, noisy proceed, primary
# failover, or both-revoked terminal. The last is the one nothing else here
# reaches: it is the only evidence that the revocation check is applied on the
# BACKUP path and not on the primary alone.
#
# NO +sep_efuse_preload ON PURPOSE. A committed preload short-circuits both the
# pre-sim staging hook and the runtime selector, so the bitmap could not vary per
# seed. Without it both readers take the randomized path and derive the same
# image from one shared draw (cocotb/env/sep_key_revocation_draw.py):
# dv_sim_prestage before the simulator starts, the testcase through
# select_efuse_image at run time. The DUT senses the TESTCASE's image -- the
# efuse model's $readmemh waits for reset, which releases long after the
# testcase writes its golden at 0 ns -- and the hook's copy is what the testcase
# compares that golden against, so two processes disagreeing about the draw
# fails loudly instead of testing a bitmap nothing predicted.
#
# The seed is the signoff seed: it draws the both-revoked terminal class with two
# DIFFERENT non-zero slots, which is the strongest single point in the space.
# Closure is a 27-bin model accumulated across seeds and is what gates
# regression_stable; raising `reseed` is the knob for it, at roughly 26 minutes
# per additional seed.
#
# +sep_crypto_edn_force because the proceed and failover classes run a real OTBN
# modexp; hence the dv_shortcut tag.
name = "sep_key_revocation_bitmap_random_test"
module = "rom_fw.sep_key_revocation_bitmap_random_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 17
timeout_sec = 14400
tags = ["boot", "rom", "spi", "secure", "manifest", "crypto", "revocation", "efuse", "random", "cpu", "subsystem", "dv_shortcut"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_crypto_edn_force",
]

