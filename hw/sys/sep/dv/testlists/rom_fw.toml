[[tests]]
# MBIST arm of the boot gate, FAILURE case -- the leg neither existing MBIST
# test reaches. sep_firmware_mbist_fail_test injects 0xFFFFFFFD, which stops on
# the REPAIR arm before MBIST is ever evaluated, so without this entry the MBIST
# check has no testcase that exercises its rejection at all.
#
# +sep_dft_status=00000012 = mem_repair_success (bit 1) SET so the repair arm
# passes, mbist_done (bit 4) SET so the gate stops polling and trusts the
# verdict, mbist_pass (bit 8) CLEAR so that verdict is a failure. The test
# asserts all three, because each one moves the run onto a different path: clear
# bit 1 and it stops on repair; clear bit 4 and it reaches the same handler by
# TIMEOUT instead, proving something else while still looking green.
#
# Reuses the boot_rom profile and the repair arm's axes for the same reason that one does:
# the gate is upstream of every transport decision, so the SPI variant cannot
# affect it. No +sep_boot_from_spi -- the ROM halts long before a transport is
# chosen, and passing it would imply this test says something about SPI.
name = "sep_firmware_mbist_only_fail_test"
module = "rom_fw.sep_firmware_mbist_only_fail_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 3600
tags = ["boot", "rom", "mbist", "error", "cpu", "subsystem"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_dft_status=00000012",
]

[[tests]]
# MEM_REPAIR (MBIST) boot gate, PASS arm -- the partner of
# sep_firmware_mbist_fail_test. Same gate, same injection mechanism, opposite
# stimulus and opposite expectation.
#
# +sep_dft_status=00000112 is exactly the three bits the gate requires and
# NOTHING else: mem_repair_success (bit 1), mbist_done (bit 4), mbist_pass
# (bit 8). It deliberately leaves mem_repair_done (bit 0), mem_repair_abort
# (bit 2) and mbist_abort (bit 12) clear, so a gate that keyed on any of those
# would fail here. Injecting nothing would leave the tb default 0x113, which also
# boots but cannot tell which bits decide it.
#
# This was 0x00000002 while the gate read only mem_repair_success. That value now
# HANGS, and correctly so: with mbist_done clear the ROM waits for MBIST to
# finish, times out, and treats it as a failure. If this entry is ever reverted to
# 0x02 the symptom will be a very slow hang, not an obvious rejection.
#
# The gate writes nothing on the pass path (it is pre-C assembly, and every
# console/status/scratch write sits on the failure branch), so this entry borrows
# the OT-SPI non-secure boot as its "and then it booted" evidence. That makes the
# axes and the timeout the same as sep_rom_ot_dma_boot_test's; it says nothing
# about SPI, which is downstream of the gate.
name = "sep_firmware_mbist_pass_test"
module = "rom_fw.sep_firmware_mbist_pass_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 7200
tags = ["boot", "rom", "mbist", "cpu", "subsystem"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_dft_status=00000112",
]

[[tests]]
# Recovery boot: PRIMARY_CHIPLET=1 + BOOT_RECOVERY=1 -> SMC-SRAM manifest.
#
# Three plusargs carry the whole stimulus and all three are required:
#   +sep_boot_from_spi   seeds STRAPS_LO[25] (primary_chiplet). Without it the ROM
#                        takes the SECONDARY arm, which reaches the same SMC-SRAM
#                        wait loop and would look almost identical -- so the test
#                        forbids BOOT_SECONDARY rather than trusting the strap.
#   +sep_straps_lo       seeds STRAPS_LO[19] (boot_recovery). 0x00080000 sets
#                        that bit and no other; the testbench ORs it with
#                        primary_chiplet from +sep_boot_from_spi.
#   +sep_smc_mem_hex     stages the manifest+BL1 image at the SMC-SRAM base, which
#                        is where the recovery path fetches from.
#
# smc_mem.hex and the ROM both come from build/: the packed image is
# transport-agnostic (same reason sep_rom_ot_dma_boot_test reads
# build/non_secure_boot.bin), and [c_build.boot_rom] runs `pack-images`, which
# is the rule that produces it.
#
# The ROM CAN drive the flash and the flash BFM is attached and preloaded, so
# "no SPI reads" is a real observation about a capable ROM declining a working
# device rather than one that could not have read it anyway.
name = "sep_boot_recovery_test"
module = "rom_fw.sep_boot_recovery_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 7200
tags = ["boot", "rom", "recovery", "strap", "cpu", "subsystem"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_straps_lo=00080000",
  "+sep_smc_mem_hex={repo_root}/hw/sys/sep/bootrom/prod/build/smc_mem.hex",
]

