[[tests]]
# TP061E: a corrupted RSA signature is rejected by the OTBN verify itself.
#
# Both slots carry a single flipped signature bit, so the primary's rejection IS
# the retry trigger (the procedure's step 5) and the backup then makes the run
# terminal. Distinct from sep_firmware_backup_invalid_signature_test, which puts
# BAD_MAGIC on the primary and therefore covers neither the "invalid signature is
# a retryable class" leg nor the OTBN result itself: it requires only
# RSA_PKCS1_FAIL, which is also reached when OTBN fails to
# init, load or execute. This entry requires RSA_EXEC then RSA_PKCS1_FAIL per
# slot and forbids the three engine-error markers.
#
# +esrc_noise_force is required (OTBN parks in UrndRefresh with no entropy
# chain up), hence the dv_shortcut tag. It forces the noise source only; the
# health tests, CSRNG, EDN and every RSA input and assertion are untouched.
#
# ### THIS IS ONE OF THE SLOWEST TESTS IN THE GROUP. Budget ~35-45 minutes. ###
# Two full RSA-3072 modular exponentiations run on the real OTBN, one per slot,
# at roughly 5 ms of simulated time each. If a `rom_fw` or `all` regression
# suddenly takes ~40 minutes longer than you remember, this entry is why. Do not
# lower timeout_sec: the modexp cost is real work, not a hang.
#
# It is NOT the only slow member, and an earlier version of this comment wrongly
# said it was. sep_bl1_size_invalid_test (~2013 s), sep_bl1_entry_invalid_test
# (~2289 s) and sep_decryption_failure_terminal_test (~2837 s) each run two
# modexps as well, and the last of those is slower than this one. What is
# specific to this entry is that the two modexps ARE the feature under test
# rather than a cost paid on the way to something else.
name = "sep_otbn_rsa_verify_failure_test"
module = "rom_fw.sep_otbn_rsa_verify_failure_test"
target = "rom_boot"
firmware = { name = "boot_rom_ot", mode = "boot_rom_ot" }
seed = 1
# 21600 rather than 14400: this member runs TWO RSA-3072 modexps -- one per slot
# -- and at the group's --sim-jobs 6 contention the 4 h cap cut it off inside the
# second one, 1-3 Mns of simulated time from finishing. Measured in run
# 20260911_003223: a passing verify costs ~2.3 Mns of simulated time, and a failing
# slot takes ~5.0 Mns from RSA_EXEC through to its terminal verdict. Each of the four
# members capped there was 94-99% of the way through. The extra 2 h is headroom over
# that shortfall, not a new budget.
timeout_sec = 21600
tags = ["boot", "rom", "spi", "secure", "crypto", "otbn", "rsa", "error", "failover", "cpu", "subsystem", "dv_shortcut"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build_ot/boot_rom.vmem",
  "+sep_boot_from_spi",
  "+sep_efuse_preload={repo_root}/hw/sys/sep/dv/tb/efuse_preloads/efuse_configurations/sep_efuse_lc_prod.toml",
  "+esrc_noise_force",
]

