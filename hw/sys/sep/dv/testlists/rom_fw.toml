# then compared against the compiled-in table would BOOT here and fail this
# testcase; the four existing chiplet members cannot see it, because their fuse
# digest and public_key_digests[0] are byte-identical.
#
# THE SELECTED FUSE HOLDS A DECOY AND THE UNSELECTED ONE HOLDS THE REAL DIGEST,
# which makes this catch TWO classes rather than one: a ROM comparing against
# public_key_digests[0] boots, and so does a ROM that read the wrong chiplet fuse
# address. An earlier draft used two different decoys and caught only the first.
