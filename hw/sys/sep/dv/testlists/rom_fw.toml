[[tests]]
# The EXT SRAM is cleared between the primary rejection and the backup
# fetch. Subclasses sep_spi_primary_fail_backup_test and inherits its stimulus
# and every one of its failover checks unchanged; what it adds is an SRAM
# scoreboard.
#
# Same axes and the same two plusargs as its parent, because the scenario is the
# parent's scenario. No new plusarg, no new firmware profile, no testbench change:
# the SRAM macro's storage array is already public_flat_rw (sep_public_scope.vlt)
# and is therefore readable and writable from cocotb over VPI.
#
# TWO THINGS A READER SHOULD KNOW BEFORE TREATING A GREEN RUN AS FULL COVERAGE.
#
# 1. It covers the EXT SRAM half only, and the reason the other half is
#    missing is NOT that someone forgot a memset. The boot flow asks for the SMC
#    SRAM clear only when SMC SRAM is used, and decides "used"
#    from the manifest USE_EXT bit. The stimulus side of that is implemented and in
#    use: the packer emits the bit (bootrom/prod/tools/tt-boot-manifest/src/
#    pack_images.py) and every image this tree boots is built with it CLEAR
#    (bootrom/prod/configs/non_secure_boot_test.yaml and its secure/encrypted
#    siblings all set use_ext_sram: 0). What is missing is the ROM's consuming
#    branch: FLAG_ARGS_BIT_USE_EXT_SRAM (bootrom/prod/include/manifest.h) is
#    referenced nowhere under bootrom/prod/src, and manifest_load.c stages
#    the payload in EXT SRAM regardless. The run observes exactly that -- it boots a
#    manifest with flag_args=0x00000000 and then logs COPY_SRC=0x10002000, i.e. the
#    payload staged in EXT SRAM (LOAD=0xC0000000 is BL1's ICCM destination, not the
#    staging area). So there is nothing for an SMC-clear
#    assertion to check. (Independently, the only path whose manifest comes from SMC
#    SRAM runs num_retries = 0, manifest_load.c, so it has no retry window at
#    all.) The test asserts nothing about SMC SRAM and says so in its own log
#    (CHK-SCOPE).
# 2. It is one of the slower members of this group, and almost all of that is
#    INHERITED rather than added here. The failover clear it asserts is 65536 CPU
#    stores: measured in run 20260829_111100, MANIFEST_ERR=0x00030002 at 2154352 ns
#    to MANIFEST_BACKUP at 18963904 ns is about 1.05M of that run's ~1.62M clocks.
#    sep_spi_primary_fail_backup_test pays the same cost in CYCLES -- it just
#    does not assert anything about it. What this entry adds on top is the
#    scoreboard's VPI traffic (one 32768-word fill plus its read-back, and one
#    32768-word scan).
#
#    COMPARE IN CYCLES, NOT MILLISECONDS OR WALL SECONDS. The testbench randomises
#    sys_clk_period per run, so simulated-time and wall-clock figures are not
#    comparable between runs. The parent's three runs on disk span 20.09,
#    14.51 and 6.70 ms for the same work; the cycle count is what is invariant.
#    Cycle-normalised, the parent band is 772-816 s per Mcycle against this
#    entry's 856, so the scoreboard's attributable cost is roughly 97 s, about
#    7.5% -- not the ~148 s / ~12% a naive wall-second subtraction gives, because
#    that comparison used runs at 16 ns and 13 ns clock periods and this entry
#    also executed 4.8% more cycles. Treat 7.5% as an estimate with a real error bar,
#    not as a measurement.
#    Do not "speed it up" by scanning fewer words -- the claim is that the whole
#    256 KiB was cleared, and a sparser scan cannot support it.
name = "sep_failover_sram_clear_assertion_test"
module = "rom_fw.sep_failover_sram_clear_assertion_test"
target = "rom_boot"
firmware = { name = "boot_rom", mode = "boot_rom" }
seed = 1
timeout_sec = 7200
tags = ["boot", "rom", "spi", "failover", "sram", "cpu", "subsystem"]
run_modes = ["cpu"]
args = [
  "+sep_boot_rom_hex={repo_root}/hw/sys/sep/bootrom/prod/build/boot_rom.vmem",
  "+sep_boot_from_spi",
]

[[tests]]
# Both slot addresses blank, terminal error and hang. Expected outcome is fw_done
# with fw_pass=0, so this test drives its own poll loop rather than
