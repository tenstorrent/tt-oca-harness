# slots rom_key_index 0 (configs/secure_boot_test.yaml:43-45), so one
# bit refuses the primary AND the backup and the retry loop exhausts
# (MANIFEST_ALL_FAILED). Slots 1-5 fail over and boot. The
# base measures that from the image instead of testing slot == 0.
