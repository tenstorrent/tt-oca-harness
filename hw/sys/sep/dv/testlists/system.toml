[[tests]]
# axil_mailbox interface breadth (randomized-rep, TX path; the reference suite
# sep_mailbox_64bit_data_test + sep_mailbox_misc_regs_test +
# sep_fabric_mailbox_fifo_closure_test ). CPU-LSU master on the local
# outbound_mailbox_0 aperture (0x10A0_0000; no inbound filter): native 64-bit WRITE_DATA push
# (randomized payloads + first-fill length + WIRQT), STATUS full/write_level_above vs a golden TX
# depth model, WIRQT write-threshold IRQ + IRQP gate + W1C, read-empty (0xFEEDDEAD+SLVERR+
# ERROR_FLAGS.read_error read-clear + eirq W1C), write-full (SLVERR+write_error), CTRL flush.
# TX-only. Round-trip readback + read-threshold need a peer-side WRITE to the INBOUND
# aperture (inbound_mailbox_0 @ 0x10A0_0800, port1); a clean VCS repro proved that
# external smn_inbound can fill it and CPU-LSU can pop the value through outbound_mailbox_0.
# Keep this rep scoped to the reference suite TX mailbox-data intent; put peer-path closure in a
# separate fabric/mailbox testcase if it becomes permanent.
# Distinct from #8 (->PIC->CPU delivery). no_cpu; +skip_fuse_sense (local mailbox, no OTP dep).
name = "sep_axil_mailbox_iface_rand_test"
module = "system.sep_axil_mailbox_iface_rand_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["mailbox", "axil_mailbox", "fifo", "interrupt", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# Per-IP SW-reset domain isolation (the reference suite\'s sep_clock_uvm_sw_reset_per_ip_test ).
# With entropy brought up, hold a LIVE golden-checked crypto RESULT in each of two engines --
# HMAC SHA-256 DIGEST and AES ECB-256 DATA_OUT (the AES masking-PRNG reseed consumes the
# entropy) -- then pulse one engine's SW_RESET_N (0x1080_3000, active-low) and prove the
# sibling's held ciphertext/digest is bit-exact intact while the pulsed engine's own result
# clears; reverse the roles. Stateful crypto-result neighbor-survival a single-IP tb can't
# see; complements `sep_reset_wdt_sanity_test`. no_cpu; +skip_fuse_sense (entropy/crypto independent of OTP lifecycle).
name = "sep_crypto_per_ip_reset_isolation_test"
module = "system.sep_crypto_per_ip_reset_isolation_test"
seed = 1
timeout_sec = 3600
tags = ["reset", "crypto", "isolation", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense", "+esrc_noise_force"]

[[tests]]
# Inbound-filter per-entry RULE matrix (the reference suite's
# sep_inbound_filter_blockbydefault_test +
# sep_inbound_filter_programming_ownership_test +
# sep_inbound_id_remap_test). Filter ACTIVE (sep_debug=0, real PROD fuse):
# CPU-LSU programs allow-entries; the external SMN master proves allow-addr->OKAY+value,
# non-allowed->DECERR (block-by-default), and read_en/write_en gating. Walks entry 0
# and 7 x two windows x rw/r/w (match-all src_id=0) plus entry 0 / window 0
# source-ID match and mismatch. Distinct from
# `sep_lcc_uvm_inbound_filter_gating_test` (global sep_debug skip gate). no_cpu + ext SMN master; REAL PROD fuse sense.
# CHK-OWNERSHIP-WINDOW is a hard assert (RTL OKAY vs hw/sys/sep/doc/fabric.adoc DECERR after
# an allow-list on the CFG window). Expected red, not an XFAIL.
name = "sep_fabric_inbound_filter_rule_matrix_test"
module = "system.sep_fabric_inbound_filter_rule_matrix_test"
seed = 1
timeout_sec = 3600
tags = ["fabric", "inbound_filter", "security", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

