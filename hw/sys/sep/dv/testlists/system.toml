run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# Per-IP SW-reset domain isolation (the reference suite\'s sep_clock_uvm_sw_reset_per_ip_test ).
# With entropy brought up, hold a LIVE golden-checked crypto RESULT in each of two engines --
# HMAC SHA-256 DIGEST and AES ECB-256 DATA_OUT (the AES masking-PRNG reseed consumes the
# entropy) -- then pulse one engine's SW_RESET_N (0x1080_3000, active-low) and prove the
# sibling's held ciphertext/digest is bit-exact intact while the pulsed engine's own result
# clears; reverse the roles. Then, while HMAC SW_RESET_N is held, the same DIGEST_0
# address returns DECERR on read (HMAC CFG write also DECERR) while AES DATA_OUT_0 stays OKAY; after release
# DIGEST_0 is OKAY at reset. Drain-before-reset is not claimed. no_cpu; +skip_fuse_sense
# (entropy/crypto independent of OTP lifecycle).
name = "sep_crypto_per_ip_reset_isolation_test"
module = "system.sep_crypto_per_ip_reset_isolation_test"
seed = 1
timeout_sec = 3600
tags = ["reset", "crypto", "isolation", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense", "+esrc_noise_force"]

