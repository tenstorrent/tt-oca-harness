[[tests]]
# Fabric decode-error / negative response (the reference suite\'s sep_cpu_lsu_negative_matrix_test # + sep_cpu_ifu_invalid_target_test +
# sep_fabric_xbar_error_closure_test ). The CPU-LSU AXI master reads
# an unmapped local address -> exact DECERR (allow_timeout=False so a wedge fails),
# while a known-mapped CSR on the same bus returns OKAY + value. COVERED_STRONGER:
# asserts the exact spec response vs the reference suite's any-non-OKAY/timeout-tolerated check.
# no_cpu (host drives the CPU-LSU splice); +skip_fuse_sense (decode is independent
# of OTP/entropy).
name = "sep_fabric_decode_error_response_test"
module = "system.sep_fabric_decode_error_response_test"
