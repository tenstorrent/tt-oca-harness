[[tests]]
# Reserved rows of hw/sys/sep/doc/memory_map.adoc must be refused. Walks the
# gaps BETWEEN block windows; sep_fabric_deadspace_decode_test walks the dead
# tail INSIDE a window. Expectation is spec-derived; the crossbar decode table
# is logged as a cross-check, never used to build the expectation.
name = "sep_axi_map_refuse_test"
module = "system.sep_axi_map_refuse_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["fabric", "axi", "decode", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# Unmapped points next to live registers: system-CSR holes, the reserved row
# above SEP CPU control, the mailbox page's upper half, past each eFuse sibling
# block and the SPI host, and every remap / filter array slot tail. Each answers
# the response code and read data the SEP memory map states, and none aliases
# onto a live word. Every slot tail inside the RDL allocation (base +
# TOTAL_SIZE), the last slot's tail included, reads zero with OKAY; where the
# map lists that last tail past the extent, the RDL allocation grades it. A live
# word with no RDL reset is written before it is read. Addresses come from the
# generated register export.
name = "sep_unmapped_access_policy_test"
module = "system.sep_unmapped_access_policy_test"
seed = 1
timeout_sec = 1800
tags = ["fabric", "axi", "decode", "negative", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# AXI transaction IDs on the response path. Eight scratch words are primed
# with eight distinct values, then read with eight reads outstanding at once,
# one per ID; each must return its own word. Directed, not randomized: the
# proof is a value compare, and a random ID on either side would remove it.
name = "sep_axi_id_routing_test"
module = "system.sep_axi_id_routing_test"
seed = 1
timeout_sec = 1800
tags = ["fabric", "axi", "id", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# Narrow-write byte masking and memory-window readback. Every AxSIZE at every
# legal lane offset on every seed; the seed varies staged data only. The
# window compare is the only checker that catches a read-mask defect, which
# returns a correct response with zeroed data.
name = "sep_axi_strobe_window_test"
module = "system.sep_axi_strobe_window_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["fabric", "axi", "strobe", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# A 64-bit CSR read on each crypto host path named in crypto.adoc must return
# the data its spec defines: both 32-bit words at OTBN, HMAC, AES, KMAC and
# ESRC; the addressed lane at CSRNG and EDN (DRBG lane adapter). Serially and
# with concurrent reads on distinct ids. Golden is the DUT's own
# single-beat path. No burst: the spec answers any crypto AxLEN != 0 DECERR.
name = "sep_crypto_csr_wide_access_test"
module = "system.sep_crypto_csr_wide_access_test"
seed = 1
timeout_sec = 900
tags = ["fabric", "axi", "crypto", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# Partial-lane read determinism. A read narrower than the 64-bit beat only
# obligates the responder to drive the addressed byte lanes (a 32-bit CSR
# leaves RDATA[63:32] undriven; a narrow-ARSIZE beat leaves every
# non-addressed lane undriven), so the value handed back must be a pure
# function of the addressed lanes: exact against an independent golden and
# identical on re-read around a checked disturbing access. Complements
# sep_axi_strobe_window_test (write-side masking): here the read extraction
# is on trial. All 36 byte-run slices + all 14 aligned narrow-ARSIZE cells +
# the all-zeros/all-ones CSR patterns run on every seed.
name = "sep_axi_partial_lane_read_test"
module = "system.sep_axi_partial_lane_read_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["fabric", "axi", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# AXI channel ordering, swept over the whole write-safe register inventory:
# the three legal AW/W orderings at every register, crossed with the three
# transfer sizes on the scratch words. Each block terminates AXI at its own
# register adapter, so the ordering contract has to hold at each of them. An
# adapter that latches its pending-write flag on AW accept answers OKAY while
# dropping the data, so the cell compares the readback, not the response, and
# a follow-on write to a second register in the block catches a stale flag
# committing the next write to the wrong target.
name = "sep_axi_order_sweep_test"
module = "system.sep_axi_order_sweep_test"
seed = 1
reseed = 3
timeout_sec = 3600
tags = ["fabric", "axi", "protocol", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# All three AW/W/AR orderings at a drbg_axil64_lane_adapter port. The
# fabric-driven leaves below reach the DUT's own adapters but can present only
# the aw-then-ar ordering: the crossbar delivers W one cycle after AW and
# re-serializes to that order whatever the master presents, which
# CHK-CONCURRENT-CAL measures at both ends. This leaf drives a TB-owned second
# instance of the same module at its port, so every legal ordering is
# presentable to the cycle and the vehicle's own reset clears a wedge between
# cells. It grades the MODULE; the leaves below grade the integration.
name = "sep_drbg_axil_adapter_port_arbitration_test"
module = "system.sep_drbg_axil_adapter_port_arbitration_test"
seed = 1
reseed = 1
timeout_sec = 3600
tags = ["fabric", "axi", "protocol", "system", "trng", "drbg"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# Unsupported accesses at drbg_axil64_lane_adapter: a misaligned read and a
# write whose strobe is not the addressed lane's must answer SLVERR and forward
# nothing. The DUT's CSRNG and EDN adapters are reached over s_axi; the
# TB-owned vehicle instance covers the strobe patterns one AXI transfer cannot
# place at a DUT port.
name = "sep_drbg_axil_adapter_refusal_test"
module = "system.sep_drbg_axil_adapter_refusal_test"
seed = 1
reseed = 1
timeout_sec = 3600
tags = ["fabric", "axi", "protocol", "system", "trng", "drbg"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

