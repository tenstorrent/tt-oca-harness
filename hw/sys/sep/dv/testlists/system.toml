[[tests]]
# Per-IP SW-reset domain isolation (the reference suite\'s sep_clock_uvm_sw_reset_per_ip_test ).
# With entropy brought up, hold a LIVE golden-checked crypto RESULT in each of two engines --
# HMAC SHA-256 DIGEST and AES ECB-256 DATA_OUT (the AES masking-PRNG reseed consumes the
# entropy) -- then pulse one engine's SW_RESET_N (0x1080_3000, active-low) and prove the
# sibling's held ciphertext/digest is bit-exact intact while the pulsed engine's own result
# clears; reverse the roles. Once URND is being acknowledged, a KMAC software
# reset is stepped across that acknowledge period. The KMAC endpoint's edn_ack
# and edn_bus stay 0 on every gated-reset edge, and URND may complete its own
# beat. CHK-EDN-LEAD software-resets KMAC, AES and OTBN while their endpoint
# holds a word, and requires edn_ack and edn_bus at 0 on the last cycle before
# the gated reset falls and on every asserted-reset cycle. CHK-EDN-DISCARD
# requires that no held word is acknowledged to any client afterwards.
# CHK-EDN-HOLD arms on a KMAC software-reset edge that still presents a URND
# word staged with edn_ack low. An empty-FIFO gap, where the next cycle reads
# 0, is not that arm. An edge that presents a different word fails, and so
# does every candidate edge zeroing the word. CHK-EDN-HOLD-KEEP requires that
# same word to be the one URND is acknowledged with, including when the
# acknowledge is the edge cycle.
# Then, while HMAC SW_RESET_N is held, the same DIGEST_0
# address returns SLVERR on read (HMAC CFG write also SLVERR) while AES DATA_OUT_0 stays OKAY; after release
# DIGEST_0 is OKAY at reset. Drain-before-reset IS claimed on the HMAC path:
# CHK-DRAIN-ORDER (reset waits for both AXI-Lite paths to drain),
# CHK-HOST-DRAIN (reads accepted before the request resolve OKAY) and
# CHK-DRAIN-ARRIVAL (a read arriving mid-drain also resolves). The other three
# accelerator domains are not claimed. no_cpu; +skip_fuse_sense
# (entropy/crypto independent of OTP lifecycle).
name = "sep_crypto_per_ip_reset_isolation_test"
module = "system.sep_crypto_per_ip_reset_isolation_test"
seed = 1
timeout_sec = 3600
tags = ["reset", "crypto", "isolation", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense", "+esrc_noise_force"]

