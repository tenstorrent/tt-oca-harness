[[tests]]
# Partial-lane read determinism. A read narrower than the 64-bit beat only
# obligates the responder to drive the addressed byte lanes (a 32-bit CSR
# leaves RDATA[63:32] undriven; a narrow-ARSIZE beat leaves every
# non-addressed lane undriven), so the value handed back must be a pure
# function of the addressed lanes: exact against an independent golden and
# identical on re-read around a checked disturbing access. Complements
# sep_axi_strobe_window_test (write-side masking): here the read extraction
# is on trial. All 36 byte-run slices + all 14 aligned narrow-ARSIZE cells +
# the all-zeros/all-ones CSR patterns run on every seed.
name = "sep_axi_partial_lane_read_test"
module = "system.sep_axi_partial_lane_read_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["fabric", "axi", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# AXI channel ordering, swept over the whole write-safe register inventory:
# the three legal AW/W orderings at every register, crossed with the three
# transfer sizes on the scratch words. Each block terminates AXI at its own
# register adapter, so the ordering contract has to hold at each of them. An
# adapter that latches its pending-write flag on AW accept answers OKAY while
# dropping the data, so the cell compares the readback, not the response, and
# a follow-on write to a second register in the block catches a stale flag
# committing the next write to the wrong target.
name = "sep_axi_order_sweep_test"
module = "system.sep_axi_order_sweep_test"
seed = 1
reseed = 3
timeout_sec = 3600
tags = ["fabric", "axi", "protocol", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]

[[tests]]
# The same sweep driven from the SMN inbound master. m_axi reaches the same
# eleven IP block adapters through the inbound filter, so an adapter that
# mishandles a channel ordering has to be caught from both TB-driven buses.
# The walk opens allow windows first, and does not sweep the sixteen
# INBOUND_FILTER_CTRL blocks: those CSRs gate the access in flight, so writing
# them would measure filter reprogramming. They stay swept on s_axi.
name = "sep_axi_order_sweep_m_axi_test"
module = "system.sep_axi_order_sweep_m_axi_test"
seed = 1
reseed = 3
timeout_sec = 3600
tags = ["fabric", "axi", "protocol", "system", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+skip_fuse_sense"]
