schema_version = 1

# Daily regression policy: run the cpu_stub and cpu groups separately,
# `python3 tools/dv/run_dv.py --dut sep --items <cpu_stub|cpu> --regress`. Tests with run_modes=["no_cpu"]
# select target="lsu_stub_all_live"; CPU firmware tests omit target and use the
# full-CPU default model.

[[tests]]
name = "sep_efuse_sense_test"
module = "efuse.sep_efuse_sense_test"
seed = 1
timeout_sec = 1800
tags = ["smoke", "efuse", "ci"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
# Pin the committed default preload (bare +sep_efuse_preload, no path) so the two
# tests cover both sources: preload+backdoor here vs random+AXI in the image test.
args = ["+sep_efuse_preload"]

[[tests]]
name = "sep_efuse_image_test"
module = "efuse.sep_efuse_image_test"
seed = 1
timeout_sec = 1800
tags = ["smoke", "efuse"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

[[tests]]
name = "sep_efuse_lcc_lc_state_stitch_test"
module = "lcc.sep_efuse_lcc_lc_state_stitch_test"
seed = 1
timeout_sec = 1800
tags = ["lcc", "subsystem", "efuse"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
# Program-failure injection is a one-shot per reset. count=1 fails the first
# bank write after each reset, which is the floor the retry check requires.
# percent stays 0: a second probabilistic failure is the same PROGRAM_DONE+ERR
# the secure-TM guard produces, so it cannot be told apart from the guard.
# The model's LFSR seed is still passed so the one-shot is reproducible.
args = [
    "+sep_efuse_prog_fail_count=1",
    "+sep_efuse_prog_fail_percent=0",
    "+sep_efuse_prog_fail_seed={seed}",
]

[[tests]]
# TEST_DEV JTAG allow leg for the two windows the PROD mux test denies.
# Real fuse sense (no +skip_fuse_sense): the JTAG gate reads the sensed
# LC_STATE. TEST_DEV is not PROD or RMA_SIP, so shadow and
# EFUSE_PROGRAM_CTRL answer OKAY.
name = "sep_efuse_jtag_window_allow_test"
module = "efuse.sep_efuse_jtag_window_allow_test"
seed = 1
timeout_sec = 1800
tags = ["efuse", "jtag"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

[[tests]]
# eFuse JTAG-AXIL + EL2-CPU mux arbitration (the reference suite's
# sep_efuse_jtag_axil_el2_cpu_mux_test). EL2 firmware loops eFuse-MMR traffic while cocotb drives the real
# axil_sep_otp_jtag port (j_axi_* AxiLiteMaster) concurrently; both arbitrate at the
# eFuse AXI-Lite mux. Real-sensed PROD image makes the JTAG path LC-restricted, so a
# single image proves allowed-MMR coexistence AND the LC-gated shadow deny
# (0xbadcab1e) with no backdoor force. cpu run mode + REAL fuse sense (NO
# +skip_fuse_sense -- the JTAG LC gate depends on the sensed lc_state).
# PROD/RMA_SIP JTAG may reach the MMR token block (TOKEN_I / TOKEN_EOP /
# MATCH) and must DECERR on shadow and the program/read interface.
name = "sep_efuse_jtag_axil_el2_cpu_mux_test"
module = "efuse.sep_efuse_jtag_axil_el2_cpu_mux_test"
firmware = "efuse_jtag_el2_mux_test"
seed = 1
timeout_sec = 3600
tags = ["efuse", "jtag", "mux", "cpu", "subsystem"]
run_modes = ["cpu"]

[[tests]]
# eFuse program x write-lock on every legal spare field (never LC_STATE).
# RAND-REP: unlocked program + write-lock reject on SPARE0..SPARE7 every seed;
# the seed selects only the bit offsets inside each spare. Real fuse sense.
# Clear-after-program.
name = "sep_efuse_program_lock_matrix_test"
module = "efuse.sep_efuse_program_lock_matrix_test"
seed = 1
# No reseed: the walk visits SPARE0..SPARE7 every run, so slot coverage does not
# depend on how many seeds CI draws. Only the bit offsets within each spare are
# seed-selected.
timeout_sec = 1800
tags = ["efuse", "lock", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

[[tests]]
# Lifecycle demote product: LC x DEMOTE_1/2 x a small DIS subset. RAND-REP.
# feat_ctrl vs spec golden and one live inbound-filter gate per cell. Real fuse
# sense. The stitch test stays the LC->feat_ctrl e2e.
name = "sep_lcc_demote_feat_ctrl_matrix_test"
module = "lcc.sep_lcc_demote_feat_ctrl_matrix_test"
seed = 1
timeout_sec = 1800
tags = ["lcc", "demote", "efuse", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

[[tests]]
# eFuse shadow write-policy sweep: every otp_fuse_controller.adoc fuse-field row
# except LC_STATE. RANDCFG: set-only rows OR-merge; SW-writable rows
# overwrite. LOCK is both RDL windows after the other rows. Word index
# and bit patterns come from the run seed.
# Real fuse sense. Program x lock stays a different mechanism.
name = "sep_efuse_set_only_monotonicity_test"
module = "efuse.sep_efuse_set_only_monotonicity_test"
seed = 1
timeout_sec = 1800
tags = ["efuse", "set_only", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

[[tests]]
# SEC_DIS token-match override. RAND-NONE. Real fuse sense. tb_top binds
# SEP_SEC_DISABLE_TOKEN to SHA-256 of the all-zero token. The first match
# is before sense-done and must leave the sense-gated reset held. After
# sense, zero opens FEAT_CTRL; token=1 mismatches and restores fail-closed
# PROD.
# Does not force sec_dis.
name = "sep_sec_dis_override_test"
module = "efuse.sep_sec_dis_override_test"
seed = 1
timeout_sec = 1800
tags = ["efuse", "lcc", "sec_dis", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

[[tests]]
# RMA token match vs mismatch -> LC update, then the comparator redundancy
# fault path (collapse / disagree / common-mode / sticky IRQ). RANDCFG: token
# values from the run seed; SIP and CHIPLET both walk match and mismatch.
# Real fuse sense. Does not stretch the stitch e2e.
name = "sep_efuse_rma_token_rand_test"
module = "efuse.sep_efuse_rma_token_rand_test"
seed = 1
timeout_sec = 1800
tags = ["efuse", "lcc", "rma", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

[[tests]]
# Frontdoor RMA-SIP hashes drive both latch-enable events. The testbench force
# reaches only the otherwise tied-low digest test_en input for scan-freeze.
name = "sep_efuse_digest_latch_fault_test"
module = "efuse.sep_efuse_digest_latch_fault_test"
seed = 1
timeout_sec = 1800
tags = ["efuse", "lcc", "rma", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

[[tests]]
# Locked-field shadow access pulses sep_internal_interrupts[33]. RAND-REP:
# write-lock and read-lock every seed. RANDCFG: which SPARE0..7 fields carry
# write-lock, read-lock, and the unlocked contrast. Real fuse sense, LC_PROD.
# Shadow aperture, not OTP program. Pulse-only combinational IRQ. no_cpu.
name = "sep_locked_field_access_irq_path_test"
module = "efuse.sep_locked_field_access_irq_path_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["efuse", "interrupt", "lock", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

[[tests]]
# KM public-ID OTP readout. RANDCFG: the three SEP_*_ID values and which one
# carries its eFuse read lock. Real fuse sense, LC_PROD. The KM ROM image copies
# the KMCSR OTP_SEP_*_ID words to KM SRAM, sets the KM-side OTP_READ_LOCK bits
# and copies them again. no_cpu.
name = "sep_efuse_km_public_id_test"
module = "efuse.sep_efuse_km_public_id_test"
firmware = { name = "km_rom_otp_id", mode = "km_rom_blob" }
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["efuse", "km", "lock", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+km_rom_hex=km_rom_otp_id.parhex"]

[[tests]]
# SECURE_TM shadow-write lock. The field map marks LOCKS/LOCKS_SPARE, LC_STATE,
# SIP_DIS and SYS_DIS SECURE_TM_LOCK, so a shadow write to them is refused while
# the latched TEST_EN strap is high. Each field takes the same seeded payload
# twice: strap low, where it must land, and strap high, where the value must not
# move and the locked-field interrupt must pulse. A SECURE_TM_UNLOCK spare stays
# writable with the strap up, so the deny is the lock and not a dead write path.
# Real fuse sense, LC_PROD, no_cpu.
#
# Plusarg-selected variant: the module is the locked-field leaf, and
# +secure_tm_lock selects this scenario, so the module does not end in this
# entry name. See Naming Rules in docs/SEP_VPLAN.adoc.
name = "sep_efuse_secure_tm_write_lock_test"
module = "efuse.sep_locked_field_access_irq_path_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["efuse", "interrupt", "lock", "secure_tm", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+secure_tm_lock"]

[[tests]]
# Both eFuse FSMs fail closed from an illegal state. read_state_q and
# program_state_q are two bits whose legal encodings are 2'b01 and 2'b10; no
# frontdoor stimulus can produce 2'b00 or 2'b11, so the recovery the RTL
# asserts on them is unreachable without injection. Forces one illegal encoding
# for one cycle, on each FSM, for both illegal values, and grades the recovery
# on DUT outputs: back to idle, no command to the bank, error+done set,
# and the read-back data is not the sensed control word. A live read precedes
# and follows
# the injections, so the refusal is not a dead block. Real fuse sense, LC_PROD.
name = "sep_efuse_illegal_state_fail_closed_test"
module = "efuse.sep_efuse_illegal_state_fail_closed_test"
seed = 1
timeout_sec = 1800
tags = ["efuse", "fault", "fail-closed", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

[[tests]]
# LC_STATE next state on the shadow write-1-to-set path -- the writer the
# lifecycle stitch walk does not drive (that one programs an OTP bit and
# re-senses). The OTP image is a t=0 deposit that survives reset, so each
# sensed starting state is its own leaf: +lc_start selects the walk and must
# agree with the image dv_sim_prestage.py stages for that leaf name. The test
# reads the sensed nibble off the DUT and fails if they disagree.
# Every cell value-checks the LC_STATE shadow word AND the LCC FEAT_CTRL decode
# of the same state. RANDCFG: tokens and the LC_STATE[31:8] pattern come from
# the seed; the cells within a leaf are fixed, so no contract is seed-selected.
# Real fuse sense, no_cpu.
#
# The seven sep_lcc_lc_state_w1s_* entries are plusarg-selected variants of one
# module, sep_lcc_lc_state_transition_matrix_test: +lc_start=N picks the start
# state, so none of them ends the module name. See Naming Rules in
# docs/SEP_VPLAN.adoc.
#
# PROD: W1S no-clear, the RMA_SIP token gate, the RMA_CHIPLET ordering gate
# (with its token gate already open), then the authorized advance to RMA_SIP.
name = "sep_lcc_lc_state_w1s_prod_test"
module = "lcc.sep_lcc_lc_state_transition_matrix_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["lcc", "efuse", "rma", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+lc_start=1"]

[[tests]]
# PROD with both demote groups asserted. Demotion is volatile debug state and
# not a lifecycle term, so the same advance must succeed; FEAT_CTRL proves the
# demotion actually took, so the advance cannot pass vacuously.
name = "sep_lcc_lc_state_w1s_prod_demote_test"
module = "lcc.sep_lcc_lc_state_transition_matrix_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["lcc", "efuse", "rma", "demote", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+lc_start=1", "+lc_demote"]

[[tests]]
# RMA_SIP_0: bit 0 is a don't-care inside 001X, the CHIPLET token gate, the
# authorized advance to RMA_CHIPLET, then off the named set entirely -- which
# must fail FEAT_CTRL closed to 0 and be terminal with both tokens matched.
name = "sep_lcc_lc_state_w1s_rma_sip_test"
module = "lcc.sep_lcc_lc_state_transition_matrix_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["lcc", "efuse", "rma", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+lc_start=2"]

[[tests]]
# RMA_CHIP_0: bit 0 is a don't-care inside 011X too.
name = "sep_lcc_lc_state_w1s_rma_chiplet_test"
module = "lcc.sep_lcc_lc_state_transition_matrix_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["lcc", "efuse", "rma", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+lc_start=6"]

[[tests]]
# PROD_END: every reachable set lands outside the named encodings, which is the
# chapter's "the only permitted transition is to INVALID". One sensed start
# allows one exit, so the two exits are two leaves: the ungated bit 0 here,
# the RMA_SIP-matched bit 1 in the next entry.
name = "sep_lcc_lc_state_w1s_prod_end_test"
module = "lcc.sep_lcc_lc_state_transition_matrix_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["lcc", "efuse", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+lc_start=8", "+lc_prod_end_exit=bit0"]

[[tests]]
# PROD_END, RMA exit: an RMA_SIP token match then a write of bit 1 must still
# land on INVALID, never on a named RMA state.
name = "sep_lcc_lc_state_w1s_prod_end_rma_test"
module = "lcc.sep_lcc_lc_state_transition_matrix_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["lcc", "efuse", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+lc_start=8", "+lc_prod_end_exit=rma_sip"]

[[tests]]
# Transient RMA from PROD_END: the same W1S and token rules apply on a path with
# no bus request at all, INVALID result included.
name = "sep_lcc_lc_state_w1s_transient_test"
module = "lcc.sep_lcc_lc_state_transition_matrix_test"
seed = 1
reseed = 3
timeout_sec = 1800
tags = ["lcc", "efuse", "rma", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"
args = ["+lc_start=8", "+lc_transient_rma"]
