name = "sep_lcc_feat_ctrl_state_matrix_rand_test"
module = "lcc.sep_lcc_feat_ctrl_state_matrix_rand_test"
seed = 1
reseed = 4
timeout_sec = 3600
tags = ["lcc", "feat_ctrl", "demotion", "rand_rep", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

[[tests]]
# Transient RMA update by token match changes the state shadow and burns no fuse.
# RAND-REP.
name = "sep_efuse_transient_rma_rand_test"
module = "efuse.sep_efuse_transient_rma_rand_test"
seed = 1
reseed = 4
timeout_sec = 3600
tags = ["efuse", "lcc", "rma", "rand_rep", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

[[tests]]
# Token match, mismatch shapes, hold, channel independence, no reset of the token
