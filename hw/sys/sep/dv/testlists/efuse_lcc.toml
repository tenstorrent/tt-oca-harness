module = "lcc.sep_lcc_state_codeword_rand_test"
seed = 1
reseed = 4
timeout_sec = 1800
tags = ["lcc", "sigint", "rand_rep", "subsystem"]
run_modes = ["no_cpu"]
target = "lsu_stub_all_live"

[[tests]]
# Feature control per lifecycle state, strap and demotion, disable-vector ownership,
