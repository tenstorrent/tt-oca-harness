<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="588" viewBox="0 0 1040 588" role="img" aria-labelledby="title desc">
<title id="title">eFuse sensing state machine</title>
<desc id="desc">The sensing state machine in efuse_shadow_regs has four states. StIdle moves to StRead once rst_ni is released. StRead issues one READ fuse command at address 0 for all 256 shadow words and moves to StWait. In StWait each fuse_command_resp.valid strobe stores fuse_command_resp.data into the shadow word indexed by words_received_q and increments the counter. The strobe that arrives while words_received_q is 255 stores the last word and moves to StFinished, which is terminal; fuse_sense_done_o rises one cycle later. The timing diagram below shows the StRead to StWait step, strobes in cycles 2, 4 and 5, including a back-to-back pair, and the last word arriving in cycle n+1, with StFinished from cycle n+2 and fuse_sense_done_o from cycle n+3.</desc>
