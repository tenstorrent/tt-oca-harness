<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="702" viewBox="0 0 1040 702" role="img" aria-labelledby="title desc">
<title id="title">SEP CPU subsystem</title>
<desc id="desc">sep_cpu wraps the VeeR EL2 core complex u_el2_veer_wrapper: an RV32IMC core with the Zba, Zbb, Zbc and Zbe bit-manipulation extensions and 16 PMP entries, its IFU and LSU bus interfaces, a PIC with 255 external sources, the debug module with its JTAG TAP and DMI port, the ICCM controller (256 KiB in 4 banks at 0xC000_0000), the DCCM controller (128 KiB in 2 banks at 0xC004_0000) and the DMA slave port that gives the local crossbar's cpu_tcm target backdoor access to them. The instruction cache is not configured. The ICCM and DCCM RAM macros sit outside sep_cpu, in sep_tcm_wrapper, and connect through the TCM memory interface. The IFU, LSU and debug system-bus masters are AXI4 with 64-bit data and 3-bit IDs; the debug master's 1-bit ID is zero-extended. Each passes a local alias remap that rewrites the 768 MiB window at SEP_LOCAL_BASE_ADDR to 0x1000_0000. The IFU demux sends boot ROM addresses to ifu_rom_axi_req_o, SEP SRAM addresses to ifu_sram_axi_req_o and everything else to a DECERR slave; the LSU demux sends boot ROM addresses to lsu_rom_axi_req_o and everything else to lsu_xbar_axi_req_o; the debug master leaves on dbg_axi_req_o. JTAG, the DMI enables and uncore port, the interrupt sources, NMI, timer and software interrupts and the MPC and PMU halt and run handshakes enter on the left; mpc_reset_run_req_i passes a two-flop synchronizer.</desc>
