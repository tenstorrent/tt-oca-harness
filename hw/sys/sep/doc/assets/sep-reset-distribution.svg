<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1050" viewBox="0 0 1040 1050" role="img" aria-labelledby="title desc">
<title id="title">SEP reset distribution</title>
<desc id="desc">Reset distribution inside the SEP. Boundary reset inputs enter on the left and the watchdog reset request leaves on the right. rst_ni fans out to u_sep_reset_ctrl, to the eFuse wrapper and the always-reset logic of u_sep_crypto, to u_sep_wdt_wrap, and to the local crossbar, the eFuse shim demux and the entropy pool. The eFuse wrapper releases sep_intermediate_reset_no once fuse sensing and ext_boot_seq_done_i are done; u_sep_reset_ctrl applies the JTAG IC_RESET override from jtag_sep_reset_ctrl_i and synchronises the result into sep_reset_no. sep_reset_no resets the Key Manager cold domain, the system peripherals, the SPI host, the DMA and the SRAM and boot ROM interfaces. sep_cpu_reset_no is sep_reset_no ANDed with wdt_rst_ni and resets the CPU and the warm scratch registers. The seven isolation-sequenced resets sep_crypto_gated_rst_no reset the crypto engines, the TRNG and the Key Manager warm domain. dbg_rstb_i and jtag_trst_ni reset the CPU debug module and TAP.</desc>
