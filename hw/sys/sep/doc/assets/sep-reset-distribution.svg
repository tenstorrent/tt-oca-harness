<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1188" viewBox="0 0 1040 1188" role="img" aria-labelledby="title desc">
<title id="title">SEP reset distribution</title>
<desc id="desc">Reset distribution inside the SEP. Boundary inputs enter on the left and the watchdog reset request leaves on the right. u_sep_efuse_wrapper, part of u_sep_crypto, turns rst_ni and ext_boot_seq_done_i into sep_intermediate_reset_n. u_sep_reset_ctrl turns it, with the JTAG overrides, wdt_rst_ni and the DFT inputs, into sep_reset_n, sep_cpu_reset_n and the seven sep_crypto_gated_rst_n resets. sep_reset_n resets the Key Manager cold domain, the system peripherals, the SPI host, the DMA and the SRAM and boot ROM interfaces. sep_cpu_reset_n resets the EL2 core and the warm scratch registers. The gated resets reach the TRNG, OTBN, AES, HMAC, KMAC, Adams Bridge and the Key Manager warm domain. rst_ni resets the crypto interconnect, life cycle controller, eFuse shim mux, alert receivers, encoders, EDN AXIS adapters, the TRNG power-on reset, the watchdog, the local crossbar, the eFuse shim demux and the entropy pool. dbg_rstb_i and jtag_trst_ni reset the EL2 debug module and JTAG TAP.</desc>
