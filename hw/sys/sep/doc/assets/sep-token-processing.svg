<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="722" viewBox="0 0 1040 722" role="img" aria-labelledby="title desc">
<title id="title">SEP token processing</title>
<desc id="desc">Inside efuse_token_processing, JTAG or SEP software writes each 256-bit token as eight words into its array in efuse_mmr_reg, RMA_SIP_TOKEN_I, RMA_CHIPLET_TOKEN_I or SEC_DISABLE_TOKEN_I, and sets that token's go bit in TOKEN_EOP. Each token has its own SHA-256 engine, whose digest and sticky digest-valid bit feed its own triple-redundant comparator. The two RMA comparators compare against RMA_SIP_TOKEN_DIGEST and RMA_CHIPLET_TOKEN_DIGEST from the eFuse shadow registers and run only once fuse_sense_done_i is high. The SEC_DIS comparator compares against a digest built from 32 prim_rev_cell instances set by SEP_SEC_DISABLE_TOKEN and does not wait for sensing. Each comparator drives a 6-bit match code into a flop; the RMA flops drive rma_sip_token_match_q_o and rma_chiplet_token_match_q_o. The unregistered SEC_DIS match code, compared with 6'b010101 and ANDed with a rev-cell enable, drives security_disable_o. Each comparator's redundancy fault sets a bit in token_match_fault_sticky_q, whose OR is token_match_fault_o. The shadow map gate passes shadow_regs_i to shadow_regs_o once fuse_sense_done_i or security_disable_o is high, and otherwise drives zero with an INVALID lifecycle state.</desc>
