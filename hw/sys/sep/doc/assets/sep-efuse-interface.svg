<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="868" viewBox="0 0 1040 868" role="img" aria-labelledby="title desc">
<title id="title">eFuse controller and interface shim</title>
<desc id="desc">The SEP and SMC eFuse wrappers each instantiate efuse_interface_controller, which the adopter connects to an interface shim in front of the fuse bank. In sep_efuse_wrapper the 64-bit AXI4 functional port passes through axi_dw_converter and axi_to_axi_lite and is multiplexed with the Key Manager AXI-Lite port; these are SEP only. Both wrappers pass the OTP JTAG AXI-Lite port through a lifecycle filter that answers blocked accesses with an error. Inside the controller an AXI-Lite multiplexer merges the functional and JTAG ports, and an address decode sends the bank control window to the shim and the rest through an AXI-Lite to APB bridge. An APB demultiplexer selects the MMR window (efuse_token_processing, SEP only), the MAP window (efuse_shadow_regs with the sensing FSM, shadow map and field locks), the CTRL window (efuse_interface_ctrl_reg) or an error response. The CTRL registers drive the program and read interfaces. A priority multiplexer selects sensing, then program, then read, and efuse_guard filters the fuse command against the field locks and, in SEP, the RMA token bits before it reaches the shim. The shim holds the bank control registers, a read FSM and a write FSM with read-back, and selects one of them onto the APB request to the fuse bank model. Dashed outlines mark the logic present only in SEP, where HAS_LC_STATE is 1.</desc>
