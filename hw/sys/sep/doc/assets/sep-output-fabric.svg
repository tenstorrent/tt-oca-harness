<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="932" viewBox="0 0 1040 932" role="img" aria-labelledby="title desc">
<title id="title">SEP output fabric</title>
<desc id="desc">Outbound path of sep_system_peripherals for local-master traffic. A request from the sep_system_peripherals target of the SEP local crossbar (32-bit address, 6-bit ID) is zero-extended to 56 address bits by u_local_master_addr_fixer, passes the 16-region local-master alias remap u_local_master_remap_wrap (4 KiB granule) and the register cut u_local_master_remap_cut, and reaches the 1 to 5 demux u_axi_demux. The demux decodes in priority order: the SMC aperture to sep_ext_to_smc_axi_req_o, unfiltered; the SMU aperture or any address at or above 0x1_0000_0000 to the outbound filter mux; the 8 MiB AP region at 0x1100_0000 and the 8 MiB STEE region at 0x1180_0000 through the output remaps u_ap_remap and u_stee_remap, each of 16 regions of 512 KiB and setting the source ID to OTHERS, to the same mux; and every other address to the sep_local_from_remap initiator of the peripheral crossbar shown in the input fabric. The 3 to 1 mux u_outbound_filter_mux widens the ID from 6 to 8 bits and feeds the 32-entry outbound filter u_outbound_filter, which blocks by default, has no bypass, and drives smn_outbound_axi_req_o to the sep_out initiator of the SMU crossbar.</desc>
