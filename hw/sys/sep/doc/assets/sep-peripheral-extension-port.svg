<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="736" viewBox="0 0 1040 736" role="img" aria-labelledby="title desc">
<title id="title">SEP peripheral extension port</title>
<desc id="desc">SEP reaches peripherals two ways. Its only local peripheral is the SPI host: the sep_io target of the SEP local crossbar is downsized to 32 bits, converted to AXI-Lite and demultiplexed to the SPI host u_sep_ot_spi_wrap or a DECERR responder, and the quad SPI signals leave for the SPI pads. The SMC peripherals are reached through the SMC aperture: the route demux in sep_system_peripherals sends it on sep_ext_to_smc_axi_req_o, AXI4 with a 56-bit address and 6-bit ID, without the outbound filter. The SMU wires it directly to the SMC's sep_axi_in port, with no crossbar and no clock-domain crossing. In the SMC input fabric u_sep_region_demux passes addresses inside the SMC local or global window, truncated to 32 bits, and answers every other address with DECERR; the local fabric rebases the address onto the SMC local base and the sep_in initiator of smc_local_xbar reaches every target. The peripheral port is converted to 32-bit AXI-Lite for the peripheral crossbar, which serves the UART, I2C and AVSBus controllers through clock-domain crossings and the I3C, GPIO and the remaining SMC peripheral registers directly.</desc>
