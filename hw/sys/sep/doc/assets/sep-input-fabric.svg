<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="846" viewBox="0 0 1040 846" role="img" aria-labelledby="title desc">
<title id="title">SEP input fabric</title>
<desc id="desc">Inbound path of sep_system_peripherals. A request from the SMU crossbar on smn_inbound_axi_req_i (56-bit global address, 6-bit ID) passes the inbound traffic filter u_inbound_filter (16 entries, block by default, bypassed while SEP_DBG is set), then u_inbound_global_to_local_addr_remap, which rebases the window of SEP_REGION_SIZE bytes at SEP_GLOBAL_BASE_ADDR to address 0 and passes other addresses unchanged. It enters the 2 by 3 peripheral crossbar u_sep_system_peripherals_xbar_wrapper, whose other initiator is the SEP_LOCAL port of the output fabric's u_axi_demux. The crossbar sends 0x10A0_0000 to 0x10A0_FFFF to the mailbox, 0x10A1_0000 to 0x10A4_FFFF and 0x1080_2000 to 0x1080_20FF to the system CSRs, both through AXI to AXI-Lite converters, and every other address below 0x4000_0000 to smn_inbound_from_xbar; anything else gets DECERR. The mailbox leg passes u_mailbox_addr_fixer (56 to 32 bits) into the 8-mailbox u_sep_axil_mailbox, whose inbound interrupts go to the SEP CPU PIC and outbound interrupts to the SMC. The smn_inbound_from_xbar leg is truncated to 32 address bits and its ID converted from 7 to 3 bits before it leaves on smn_inbound_to_sep_axi_req_o for the ext initiator of the SEP local crossbar. The system CSRs program the filter entries and the SEP aperture used by the remap.</desc>
