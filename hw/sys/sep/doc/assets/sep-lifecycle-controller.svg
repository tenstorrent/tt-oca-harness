<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="604" viewBox="0 0 1040 604" role="img" aria-labelledby="title desc">
<title id="title">SEP lifecycle controller</title>
<desc id="desc">Inside sep_lifecycle_ctrl, u_lc_state_dec decodes the differentially encoded LC_STATE[7:0] from the eFuse shadow registers into a 4-bit state and a signal-integrity error, lc_sigint_err, which leaves the block as lc_sigint_err_o. The feature control decode combines the decoded state, SIP_DIS[63:0], SYS_DIS[63:0] and the DEMOTE_1 and DEMOTE_2 demote bits into the 64-bit feat_ctrl for TEST_DEV, PROD, PROD_END, RMA_SIP, RMA_CHIPLET or INVALID, and forces it to zero on an integrity error. A multiplexer selects all ones instead while security_disable_i from token processing is high. The result is feat_ctrl_o, is written back to the read-only FEAT_CTRL register, and feeds the debug-disable derivation, which drives the 11-bit dbg_disable_o to the DTP and the SEP and SMC fuse DFT disables. The SEP crypto fabric reaches sep_lifecycle_ctrl_reg over 64-bit AXI4 through axi_to_axi_lite. The DEMOTE_1 and DEMOTE_2 demote bits also pass through the differential encoders u_demote_1_diff_enc and u_demote_2_diff_enc to lcc_demote_state_1_o and lcc_demote_state_2_o, which reach the Key Manager and leave the SEP.</desc>
