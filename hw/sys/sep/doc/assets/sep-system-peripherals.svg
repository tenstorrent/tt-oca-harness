<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="676" viewBox="0 0 1040 676" role="img" aria-labelledby="title desc">
<title id="title">SEP system peripherals</title>
<desc id="desc">Overview of sep_system_peripherals in both directions. Outbound, a local-master request from the SEP local crossbar is widened from 32 to 56 address bits, passes the 16-region alias remap and a register cut, and reaches the route demux. The demux sends the SMC aperture straight to the SMC without filtering; the SMU aperture and addresses at or above 0x1_0000_0000 to the outbound mux; the AP and STEE regions through their 16-region output remaps, which set the source ID to OTHERS, to the same mux; and every other address to the peripheral crossbar. The mux feeds the 32-entry outbound filter, whose output goes to the system interconnect. Inbound, a request from the system interconnect passes the 16-entry inbound filter and the global-to-local remap into the peripheral crossbar, which serves the 8-mailbox unit and the system CSRs and returns every other address below 0x4000_0000, converted to 32 address bits and a 3-bit ID, to the local crossbar. The mailbox unit raises inbound interrupts to the SEP CPU and outbound interrupts to the SMC; the system CSRs program the remaps, the filters and the apertures.</desc>
