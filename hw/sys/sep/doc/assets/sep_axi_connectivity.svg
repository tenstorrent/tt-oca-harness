<svg xmlns="http://www.w3.org/2000/svg" width="920" height="654" viewBox="0 0 920 654" role="img" aria-labelledby="title desc">
<title id="title">SEP AXI4 connectivity</title>
<desc id="desc">Columns are the SEP local crossbar initiators, ifu_sram, lsu, dbg, dma and ext; rows are its ten targets, plus the boot ROM, which the IFU and LSU reach through a dedicated AXI mux outside the crossbar. A filled circle marks a permitted path and a dash marks none, following the Connectivity parameter in sep_local_axi_xbar_pkg.sv.</desc>
<defs>
<marker id="ae" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="#103525"/></marker>
<marker id="as" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="3" refY="4.5" orient="auto"><path d="M10,0 L0,4.5 L10,9 Z" fill="#103525"/></marker>
