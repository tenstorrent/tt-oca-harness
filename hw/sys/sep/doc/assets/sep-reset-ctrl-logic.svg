<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="624" viewBox="0 0 1040 624" role="img" aria-labelledby="title desc">
<title id="title">SEP Reset Controller reset logic</title>
<desc id="desc">Reset logic that builds the SEP resets. In u_sep_efuse_wrapper, part of u_sep_crypto, an AND gate combines rst_ni, ext_boot_seq_done_i and fuse-sense done, and a synchroniser turns the result into sep_intermediate_reset_n. In u_sep_reset_ctrl the JTAG IC_RESET override mux, selected by the .ovrd field of jtag_sep_reset_ctrl_i and taking its .val field on input 1, and the 2-flop u_sep_reset_sync turn it into sep_reset_no. An AND gate combines sep_reset_n with wdt_rst_ni and a scan bypass mux follows, giving sep_cpu_reset_no. A 2-flop synchroniser u_wdt_rst_sync, reset by rst_ni, captures wdt_rst_ni and a scan bypass mux follows, giving sep_wdt_reset_no. For each of the seven SW_RESET_N bits, an AND gate combines an isolate sequencer output with sep_reset_n, a JTAG IP override mux fed by synchronised override bits follows, then a scan bypass mux, forming sep_crypto_gated_rst_no. Each scan bypass mux selects scan_rst_ni while test_en_i is high. rst_ni resets the isolation sequencers, the JTAG IP override synchronisers and u_wdt_rst_sync.</desc>
