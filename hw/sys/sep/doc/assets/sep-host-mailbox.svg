<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="632" viewBox="0 0 1040 632" role="img" aria-labelledby="title desc">
<title id="title">SEP host mailboxes</title>
<desc id="desc">u_sep_axil_mailbox is an axi_lite_mailbox_unit with 8 mailboxes. Its single AXI-Lite subordinate port, 32-bit address and 64-bit data, comes from the mailbox target of the peripheral crossbar through u_mailbox_a2l_1 and u_mailbox_addr_fixer. The axi_lite_demux u_mailbox_demux selects one of 16 ports from address bits 14 to 11 above 0x10A0_0000. Mailbox m occupies the 4 KiB at 0x10A0_0000 + m x 0x1000: its outbound port at offset 0x000 and its inbound port at offset 0x800, each a 2 KiB aperture with ten registers. Each mailbox holds two 8-entry, 64-bit FIFOs; WRITE_DATA of one port pushes the FIFO that READ_DATA of the other port pops. Each port raises a level-sensitive, active-high interrupt. The eight inbound-port interrupts are PIC sources 1 to 8 of the SEP CPU; the eight outbound-port interrupts leave SEP on smc_mailbox_interrupt_o and reach the SMC as its peripheral interrupts 7 to 0. Mailboxes 1 to 6 are identical to mailboxes 0 and 7.</desc>
