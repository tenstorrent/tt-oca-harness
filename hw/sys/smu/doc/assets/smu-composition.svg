<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="668" viewBox="0 0 1040 668" role="img" aria-labelledby="title desc">
<title id="title">SMU composition</title>
<desc id="desc">The OCAH SMU joins the SEP, the SMC and the DTP around an AXI4 crossbar with three initiators and three targets (SEP, SMC and the external SMN port), with no self-directed paths. The external port reaches the SMN through clock-domain crossings outside the SMU. The SEP and the AXI4 crossbar are present only when the CFG.SEP field is 1 and are drawn with dashed outlines. DTP bridges external JTAG to the SMC AXI port and to the SEP and SMC TAPs. The SEP to SMC direct port gives the SEP unfettered access to the SMC. The SMC clock control and reset manager drive chiplet clock and reset control. The SEP drives its OTP bank and passes its QSPI interface to the SMC. The SMC drives its OTP bank and 65 GPIO pads, which carry the QSPI, UART, I3C, I2C and AVSBus interfaces. A future safety bus links a future safety monitor to the SEP and SMC. Hatched blocks with dashed outlines are future.</desc>
