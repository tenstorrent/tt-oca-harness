<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="832" viewBox="0 0 1040 832" role="img" aria-labelledby="title desc">
<title id="title">SMU reset sources and consumers</title>
<desc id="desc">Reset inputs enter the SMC and DTP from the left, and scan_rst_ni reaches the DTP, SEP and SMC. The SMC generates powergood_stable for the DTP and SEP, rst_wdt_n for the SEP, and rst_primary_smc_clk_no for the DTP, SEP, AXI infrastructure and the boundary, together with the reference- and peripheral-domain boundary resets. The DTP drives the SEP STAP reset, the inverted SMC CPU JTAG reset, and the host TAP and scan-chain resets.</desc>
