<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="664" viewBox="0 0 1040 664" role="img" aria-labelledby="title desc">
<title id="title">SMU clock sources and consumers</title>
<desc id="desc">SMU clock inputs enter from the left and reach the DTP, SEP, SMC and AXI infrastructure instances; clk_smu_i reaches all of them and clk_ref_i reaches the SEP and SMC. The DTP generates JTAG TCK for the SEP and SMC debug TAPs and the host TAPs and scan chains, the SEP generates the SPI serial clock for the SMC and the SPI pad, and the SMC gates the peripheral clock for I3C.</desc>
