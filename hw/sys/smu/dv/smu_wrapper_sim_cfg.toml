schema_version = 1

# Launch entry: selected by `--dut smu_wrapper` (registered in
# hw/common/dv/configs/duts.toml). Production-wrapper baseline.
#
# DUT is hw/top/smu_wrapper.sv (smu + smc_ip_integration + sep_ip_integration),
# pulled through the `smu_wrapper` bender target — same OSS composition as
# smc_wrapper / sep_wrapper. TB attaches smc_cpu_mem_integration on the
# passthrough CPU memory ports and keeps the cocotb observe surface.
#
# Independent of the SEP=0 bare-`smu` catalog in smu_sim_cfg.toml; both configs
# share this DV root and the build/runs evidence directory.
name = "smu_wrapper"
profile = "native"
description = "Production-wrapper OSS baseline: no-SEP and real-SEP smoke"
default_tool = "verilator"
tools = ["verilator", "vcs", "xcelium"]

[testlist]
path = "testlists/wrapper.toml"
format = "toml_list"

# Waive abr_reg.sv external wr/rd_ack $error. On the wrapper SEP=1 profile the
# ABR datapath is not meaningfully exercised; the assertion fires at t=0 and
# again after reset release (e.g. 8 ns), so waive by file (not only "at time 0").
[pass_fail]
extra_ignore_patterns = ['abr_reg\.sv']

[native.stages.clean]
kind = "clean"
paths = [
  "{run_dir}",
  "hw/sys/smu/dv/build/cocotb_wrapper_no_sep",
  "hw/sys/smu/dv/build/cocotb_wrapper_sep_rtl",
  "hw/sys/smu/dv/build/work_wrapper",
  "hw/sys/smu/dv/build/firmware",
]

[build]
top_module = "smu_wrapper_uvm_top"
top_file = "hw/sys/smu/dv/tb/tb_wrapper_top.sv"
filelist = "hw/sys/smu/dv/build/smu_wrapper_dut_compile.f"
bender_filelist = "hw/sys/smu/dv/build/smu_wrapper_bender.f"
work_dir = "hw/sys/smu/dv/build/work_wrapper"
common_bender_targets = [
  "tech_cells_generic_exclude_deprecated",
  "tech_cells_generic_exclude_tc_sram",
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "idma_rtl",
  "register_interface_l1",
]
# smu pulls smc+dtp; sep+sep_el2 supply the real SEP subsystem and EL2 CPU;
# smu_wrapper adds hw/top/{smu_wrapper,smc_ip_integration,sep_ip_integration,
# smc_cpu_mem_integration}. `simulation` is deliberately NOT set: the
# sep×simulation slice references absolute /tech and /vendor_ip model paths
# that only exist on internal hosts.
bender_targets = [
  "smu",
  "smc",
  "dtp",
  "sep",
  "sep_el2",
  "smu_wrapper",
]
# Prepend SEP prim_assert shim so `include "prim_assert.sv" resolves to the
# SYNTHESIS-gated ASSUME/COVER macros (see smu_sim_cfg.toml).
incdirs = [
  "hw/sys/sep/dv/shims/prim",
  "hw/sys/smu/dv/tb",
]
# Licensed/vendor sim collateral pulled by the sep×simulation bender slice is
# not part of the OSS wrapper hierarchy — mirror the smu/sep OSS excludes.
# Stale foundry path keep-listed (file absent in OSS tree). Real SEP=1 TCM
# blocker is foundry ram_* cells inside hw/sys/sep/rtl/sep_tcm_wrapper.sv.
# DV sep_tcm_wrapper shim REMOVED (policy: no placeholder).
exclude_files = [
  "sep_cdns_spi_wrap.sv",
  "cdn_ip6184_19e8_dll_phy",
  "cdn_xspi",
  "ln04lpp_gpio_lib_t12.v",
  "ln04lpp_gpio_lib_t18.v",
  "ln04lpp_esd_lib_t12.v",
  "ln04lpp_esd_lib_t18.v",
  "padring_dv_wrapper.sv",
  "tt_spi_devices.sv",
  "tt_bidir_delay.sv",
  "meta/models/spi",
  "hw/sep/sep_tcm_wrapper.sv",
  # Mirror OSS SMC: Bender.lock may still resolve Package(i3c-core) to stale
  # deps/i3c-core while smc also lists vendor/chipsalliance/i3c-core (TimingWidth
  # / rlt_mem_*). Drop the stale deps tree so i3c_pkg matches upstream.
  "deps/i3c-core",
]
stubs = [
  # Tooling shims only (OSS prim port / X-init). No product-module overrides.
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync2.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync3.sv",
]
sources = [
  # pulp axi_sim_mem: SEP-standard VIP for SMN outbound (not a custom placeholder).
  "vendor/pulp-platform/axi/upstream/src/axi_sim_mem.sv",
  # SEP=1 key_manager pulls picorv32; Bender package files are not always
  # on the smu_wrapper closure — mirror sep_sim_cfg.toml.
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_regs.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_mul.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_fast_mul.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_div.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_axi_adapter.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_axi.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_wb.sv",
]

[build.verilator]
public_scope = "hw/sys/smu/dv/tb/smu_wrapper_public_scope.vlt"
ccache = true

[build.options]
build_jobs = 8

[frameworks.cocotb]
# Wrapper flow keeps its own PyUVM tree so module names stay independent of
# the bare-smu cocotb/ catalog sharing this DV root.
python_root = "hw/sys/smu/dv/cocotb_wrapper"
test_dir = "hw/sys/smu/dv/cocotb_wrapper/tests"
python_paths = [
  "hw/common/dv/vip",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

# Firmware/preload builds. Outputs are the staging manifest: the sim stage
# copies each declared output into the per-test run directory, where the
# time-zero SV loaders resolve the plusarg basenames.
[c_build.elaboration]
cwd = "."
argv = [
  "python3",
  "hw/sys/smu/dv/fw/build_firmware.py",
  "--target",
  "preloads",
]
outputs = [
  "hw/sys/smu/dv/build/firmware/preloads/smc_rom_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/smc_efuse_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_efuse_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_boot_rom_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_itcm_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_dtcm_default.hex",
]

[c_build.smc_smoke]
cwd = "."
argv = [
  "python3",
  "hw/sys/smu/dv/fw/build_firmware.py",
  "--target",
  "smu_smc_smoke",
]
outputs = [
  "hw/sys/smu/dv/build/firmware/smu_smc_smoke/smu_smc_smoke.rom.hex",
  "hw/sys/smu/dv/build/firmware/preloads/smc_efuse_default.hex",
]

[c_build.sep_smoke]
cwd = "."
argv = [
  "python3",
  "hw/sys/smu/dv/fw/build_firmware.py",
  "--target",
  "smu_sep_smoke",
]
outputs = [
  "hw/sys/smu/dv/build/firmware/smu_sep_arm/smu_sep_arm.rom.hex",
  "hw/sys/smu/dv/build/firmware/smu_sep_smoke/smu_sep_smoke.itcm.hex",
  "hw/sys/smu/dv/build/firmware/smu_sep_smoke/smu_sep_smoke.dtcm.hex",
  "hw/sys/smu/dv/build/firmware/smu_sep_smoke/smu_sep_smoke.sym",
  "hw/sys/smu/dv/build/firmware/boot_rom/smu_sep_boot_rom.hex",
  "hw/sys/smu/dv/build/firmware/preloads/smc_efuse_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_efuse_default.hex",
]

[run_modes.smoke]
description = "Production-wrapper baseline for no-SEP and real-SEP targets"
timeout_sec = 1800
args = [
  "+skip_fuse_sense",
  # Required with +skip_fuse_sense after efuse_shadow_regs preload gate (mirror smc_wrapper).
  "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
]

[run_modes.no_sep]
description = "SMC firmware boot in the OSS smu_wrapper with SEP=0"
timeout_sec = 1800
args = [
  "+skip_fuse_sense",
  "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
]

[run_modes.sep_rtl]
description = "SMC-assisted real SEP RTL boot in the OSS smu_wrapper"
timeout_sec = 3600
args = [
  "+skip_fuse_sense",
  "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
  # SEP shadow array is 256×32b (8Kb); do not reuse the 768-word SMC preload.
  "+sep_shadow_reg_preload={repo_root}/hw/sys/smu/dv/assets/default_sep_efuse_shadow_reg.preload",
]

[targets.default]
description = "Fallback: OSS wrapper no-SEP profile"
build_dir = "hw/sys/smu/dv/build/cocotb_wrapper_no_sep"
defines = [
  "SYNTHESIS",
  "SIM",
  "SMU_NO_SEP",
  "TEC_RV_ICG=clockhdr",
  "RV_BUILD_AXI4=1",
  "RV_BUILD_AXI_NATIVE=1",
]

[targets.default.tools.verilator]
flags = [
  "-Wno-BLKLOOPINIT",
  "+define+VERILATOR",
  "+define+ASSERTS_OFF",
]

[targets.compile_smu_chiplet_no_sep]
description = "OSS smu_wrapper with NoSepCfg and SEP=0"
build_dir = "hw/sys/smu/dv/build/cocotb_wrapper_no_sep"
defines = [
  "SYNTHESIS",
  "SIM",
  "SMU_NO_SEP",
  "TEC_RV_ICG=clockhdr",
  "RV_BUILD_AXI4=1",
  "RV_BUILD_AXI_NATIVE=1",
]

[targets.compile_smu_chiplet_no_sep.tools.verilator]
flags = [
  "-Wno-BLKLOOPINIT",
  "+define+VERILATOR",
  "+define+ASSERTS_OFF",
]

[targets.compile_smu_chiplet_sep_rtl]
description = "OSS smu_wrapper with DefaultCfg, SEP=1, and the real EL2 CPU"
build_dir = "hw/sys/smu/dv/build/cocotb_wrapper_sep_rtl"
defines = [
  "SYNTHESIS",
  "SIM",
  "SMU_SEP_RTL",
  "TEC_RV_ICG=clockhdr",
  "RV_BUILD_AXI4=1",
  "RV_BUILD_AXI_NATIVE=1",
]

[targets.compile_smu_chiplet_sep_rtl.tools.verilator]
flags = [
  "-Wno-BLKLOOPINIT",
  "+define+VERILATOR",
  "+define+ASSERTS_OFF",
]
