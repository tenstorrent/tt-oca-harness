schema_version = 1

# Launch entry: selected by `--dut smu`, resolved by the directory convention
# (hw/sys/smu/dv + <name>_sim_cfg.toml), or by `--dut smu_wrapper`, which
# hw/common/dv/configs/duts.toml registers as an `alias_of = "smu"` and so
# resolves to this same config and identity.
#
# This is the SMU regression. The bare `smu #(.SEP(0))` block bench is
# smu_block_sim_cfg.toml.
#
# DUT is hw/top/smu_wrapper.sv (smu + smc_ip_integration + sep_ip_integration),
# pulled through the `smu_wrapper` bender target — same OSS composition as
# smc_wrapper / sep_wrapper. The CPU memory macros come with
# smc_ip_integration; the TB keeps the cocotb observe surface.
#
# Independent of the SEP=0 block bench in
# smu_block_sim_cfg.toml; both configs share this DV root and the build/runs
# evidence directory.
name = "smu"
profile = "native"
description = "Production-wrapper OSS baseline: no-SEP and real-SEP smoke"
default_tool = "verilator"
tools = ["verilator", "vcs", "xcelium"]

[testlist]
path = "testlists/wrapper.toml"
format = "toml_list"

# Waive abr_reg.sv external wr/rd_ack $error. On the wrapper SEP=1 profile the
# ABR datapath is not meaningfully exercised; the assertion fires at t=0 and
# again after reset release (e.g. 8 ns), so waive by file (not only "at time 0").
[pass_fail]
extra_ignore_patterns = ['abr_reg\.sv']

[native.stages.clean]
kind = "clean"
paths = [
  "{run_dir}",
  "hw/sys/smu/dv/build/cocotb_wrapper_no_sep",
  "hw/sys/smu/dv/build/cocotb_wrapper_sep_rtl",
  "hw/sys/smu/dv/build/work_wrapper",
  "hw/sys/smu/dv/build/firmware",
]

[build]
top_module = "smu_wrapper_uvm_top"
top_file = "hw/sys/smu/dv/tb/tb_wrapper_top.sv"
filelist = "hw/sys/smu/dv/build/smu_wrapper_dut_compile.f"
bender_filelist = "hw/sys/smu/dv/build/smu_wrapper_bender.f"
work_dir = "hw/sys/smu/dv/build/work_wrapper"
common_bender_targets = [
  "tech_cells_generic_exclude_deprecated",
  "tech_cells_generic_exclude_tc_sram",
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "idma_rtl",
  "register_interface_l1",
]
# smu pulls smc+dtp; sep+sep_el2 supply the real SEP subsystem and EL2 CPU;
# smu_wrapper adds hw/top/{smu_wrapper,smc_ip_integration,sep_ip_integration}.
# `simulation` is not a target here: the sep×simulation slice references
# simulation models by absolute paths outside the repository.
bender_targets = [
  "smu",
  "smc",
  "dtp",
  "sep",
  "sep_el2",
  "smu_wrapper",
]
# Prepend SEP prim shims so `include` of prim_* resolves to the OSS overlays
# (see smu_block_sim_cfg.toml).
incdirs = [
  "hw/sys/sep/dv/shims/prim",
  "hw/sys/smu/dv/tb",
  # ocah_fcov_macros.svh, so an assertion or coverage include resolves
  # here too; the cov/sv functional-coverage modules themselves are
  # instantiated in tb/tb_top.sv and compile on smu_block, not here.
  "hw/common/assert",
]
# Vendor simulation collateral that an overlay of the sep bender graph can pull
# in and that the smu_wrapper hierarchy never instantiates: a licensed SPI
# controller wrapper and its DLL PHY, the pad and ESD libraries,
# padring_dv_wrapper and the SPI flash models. Excluded so Verilator is not
# made to parse their switch-level primitives; same denylist as
# smu_block_sim_cfg.toml.
exclude_files = [
  "sep_cdns_spi_wrap.sv",
  "cdn_ip6184_19e8_dll_phy",
  "cdn_xspi",
  "ln04lpp_gpio_lib_t12.v",
  "ln04lpp_gpio_lib_t18.v",
  "ln04lpp_esd_lib_t12.v",
  "ln04lpp_esd_lib_t18.v",
  "padring_dv_wrapper.sv",
  "tt_spi_devices.sv",
  "tt_bidir_delay.sv",
  "meta/models/spi",
  # Bender.lock resolves Package(i3c-core) to deps/i3c-core while smc also lists
  # vendor/chipsalliance/i3c-core; both define i3c_pkg (TimingWidth / rlt_mem_*),
  # so only the vendor copy is compiled, as in hw/sys/smc/dv.
  "deps/i3c-core",
]
stubs = [
  # Tooling shims only (OSS prim port / X-init). No product-module overrides.
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync2.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync3.sv",
]
sources = [
  # axi_cut (+ its spill_register deps) registers the ext_out channels at the
  # boundary, ahead of the responder in tb_wrapper_top.sv. Two things it
  # buys: the crossbar's ext_out aw_valid does not settle until late in the
  # cycle, and the cut makes every request channel edge-aligned and stable for
  # a whole cycle; and it breaks the combinational path across the boundary so
  # the responder's ready is not in the crossbar's timing cone.
  #
  # Outbound (ext_out) boundary: the shared AXI VIP interface the slave agent
  # binds and the bridge that places the cut's struct port on it.
  "hw/common/dv/vip/ocah_axi_vip/interface/ocah_axi_if.sv",
  "hw/common/dv/vip/ocah_axi_vip/interface/ocah_axi_struct_bridge.sv",
  "vendor/pulp-platform/common_cells/upstream/src/spill_register_flushable.sv",
  "vendor/pulp-platform/common_cells/upstream/src/spill_register.sv",
  "vendor/pulp-platform/axi/upstream/src/axi_cut.sv",
  # SMC CPU-memory DV hooks: the ROM and scratch image backdoors, the access
  # counters and the firmware mailbox. Binds into smc_ip_integration, which
  # holds the memory macros. hw/sys/smc/dv carries the same entry; without it
  # this environment has none of those hooks.
  # smc_cpu_mem_dv.sv resolves the scratch bank decode through this package;
  # hw/sys/smc/dv/smc_sim_cfg.toml lists the pair in the same order.
  "hw/sys/smc/dv/models/smc_scratch_map_pkg.sv",
  "hw/sys/smc/dv/models/smc_cpu_mem_dv.sv",
  # SEP=1 key_manager pulls picorv32; Bender package files are not always
  # on the smu_wrapper closure — mirror sep_sim_cfg.toml.
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_regs.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_mul.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_fast_mul.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_div.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_axi_adapter.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_axi.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_wb.sv",
]

[build.verilator]
public_scope = "hw/sys/smu/dv/tb/smu_wrapper_public_scope.vlt"
ccache = true

[coverage.verilator]
# Line / branch (--coverage-line), expression, and SVL user coverage, replacing
# the simulator default `--coverage`, which would enable every form including
# toggle. Toggle is absent: this DUT elaborates the real SEP/SMC/DTP wrappers,
# and unscoped toggle is the 0.5 GB-per-leaf case. Scoped toggle lives on
# `--dut smu_block`.
build_args = ["--coverage-line", "--coverage-expr", "--coverage-user"]

[build.options]
build_jobs = 8

[frameworks.cocotb]
# Wrapper flow keeps its own PyUVM tree so module names stay independent of
# the bare-smu cocotb/ catalog sharing this DV root.
python_root = "hw/sys/smu/dv/cocotb_wrapper"
test_dir = "hw/sys/smu/dv/cocotb_wrapper/tests"
python_paths = [
  "hw/common/dv/vip",
  # Shared PyUVM env and seq_lib, one package each for both DUTs. seq_lib
  # modules import each other as `from seq_lib.x`, so they only resolve inside
  # a package of that name, and `seq_lib` can only ever be one package -- see
  # smu_block_sim_cfg.toml, which puts the same directory on its path.
  "hw/sys/smu/dv/common",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

# Firmware/preload builds. Outputs are the staging manifest: the sim stage
# copies each declared output into the per-test run directory, where the
# time-zero SV loaders resolve the plusarg basenames.
[c_build.elaboration]
cwd = "."
argv = [
  "python3",
  "hw/sys/smu/dv/fw/build_firmware.py",
  "--target",
  "preloads",
]
outputs = [
  "hw/sys/smu/dv/build/firmware/preloads/smc_rom_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/smc_efuse_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_efuse_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_boot_rom_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_itcm_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_dtcm_default.hex",
]

[c_build.smc_smoke]
cwd = "."
argv = [
  "python3",
  "hw/sys/smu/dv/fw/build_firmware.py",
  "--target",
  "smu_smc_smoke",
]
outputs = [
  "hw/sys/smu/dv/build/firmware/smu_smc_smoke/smu_smc_smoke.rom.hex",
  "hw/sys/smu/dv/build/firmware/preloads/smc_efuse_default.hex",
]

# Real SEP DV firmware, built by the SEP fw engine rather than this DV root's
# build_firmware.py. That engine links against picolibc + libsep.a, which the
# host toolchain does not carry, so the build runs in the OCAH toolchain
# container (scripts/docker-run.sh auto-selects podman, else docker).
#
# PREREQUISITE: the container image must exist -- `./scripts/docker-run.sh build`.
# On hosts whose $HOME is small, point podman storage elsewhere first, e.g.
#   export XDG_DATA_HOME=<big-fs>/podman/share XDG_RUNTIME_DIR=<big-fs>/podman/run
#
# Unlike the smu/dv/fw images, these are `objcopy -O verilog` hex (an @0 record
# plus space-separated bytes). Both forms are byte-wide $readmemh input, so the
# tb_wrapper_top.sv TCM loader reads either without change.
# Shared by every real-SEP-firmware test: one build, every image staged. Adding
# a P2 anchor means appending its TEST= to the argv and its images to outputs,
# not cloning this table.
#
# Two producers. The SEP boot-ROM trampoline, SMC arm ROM and efuse preloads
# come from this DV root's freestanding builder; the TCM images come from the
# container. The trampoline jumps to 0xC000_0000, which is each image's _start.
[c_build.sep_dv_fw]
cwd = "."
argv = [
  "bash",
  "-c",
  "python3 hw/sys/smu/dv/fw/build_firmware.py --target smu_sep_smoke && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_boot_health && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_sanity && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_modules && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_efuse && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_wdt && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_dma && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_bidirect && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_remap && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=rom_no_tcm_preload_mem_init && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_spi && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smc_xbar && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smc_notify && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=hello_world && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_lcc_flow && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_entropy_bringup && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_aes && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_otbn && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=sep TEST=sep_smu_ext_axi && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=smc TEST=smu_sep_ext_axi && ./scripts/docker-run.sh run make ocah-dv-fw-tests TARGET=smc TEST=smc_sep_xbar && python3 hw/sys/smu/dv/fw/build_firmware.py --target smu_sep_bidirect && python3 hw/sys/smu/dv/fw/build_firmware.py --target smu_sep_ext_axi",
]
outputs = [
  "hw/sys/sep/dv/fw/build/tests/sep_smu_boot_health/sep_smu_boot_health.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_boot_health/sep_smu_boot_health.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_boot_health/sep_smu_boot_health.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_sanity/sep_smu_sanity.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_sanity/sep_smu_sanity.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_sanity/sep_smu_sanity.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_modules/sep_smu_modules.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_modules/sep_smu_modules.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_modules/sep_smu_modules.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_efuse/sep_smu_efuse.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_efuse/sep_smu_efuse.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_efuse/sep_smu_efuse.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_wdt/sep_smu_wdt.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_wdt/sep_smu_wdt.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_wdt/sep_smu_wdt.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_dma/sep_smu_dma.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_dma/sep_smu_dma.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_dma/sep_smu_dma.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_bidirect/sep_smu_bidirect.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_bidirect/sep_smu_bidirect.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_bidirect/sep_smu_bidirect.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_remap/sep_smu_remap.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_remap/sep_smu_remap.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_remap/sep_smu_remap.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/rom_no_tcm_preload_mem_init/rom_no_tcm_preload_mem_init.vmem",
  "hw/sys/sep/dv/fw/build/tests/rom_no_tcm_preload_mem_init/rom_no_tcm_preload_mem_init.rom_only.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_spi/sep_smu_spi.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_spi/sep_smu_spi.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_spi/sep_smu_spi.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smc_xbar/sep_smc_xbar.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smc_xbar/sep_smc_xbar.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smc_xbar/sep_smc_xbar.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smc_notify/sep_smc_notify.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smc_notify/sep_smc_notify.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smc_notify/sep_smc_notify.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/hello_world/hello_world.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/hello_world/hello_world.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_lcc_flow/sep_smu_lcc_flow.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_lcc_flow/sep_smu_lcc_flow.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_lcc_flow/sep_smu_lcc_flow.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_entropy_bringup/sep_smu_entropy_bringup.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_entropy_bringup/sep_smu_entropy_bringup.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_entropy_bringup/sep_smu_entropy_bringup.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_aes/sep_smu_aes.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_aes/sep_smu_aes.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_aes/sep_smu_aes.tcm.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_otbn/sep_smu_otbn.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_otbn/sep_smu_otbn.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_otbn/sep_smu_otbn.tcm.sym",
  "hw/sys/smc/dv/fw/build/tests/smc_sep_xbar/smc_sep_xbar.ecc.hex",
  "hw/sys/smc/dv/fw/build/tests/smc_sep_xbar/smc_sep_xbar.sram.sym",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_ext_axi/sep_smu_ext_axi.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_ext_axi/sep_smu_ext_axi.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/sep_smu_ext_axi/sep_smu_ext_axi.tcm.sym",
  "hw/sys/smc/dv/fw/build/tests/smu_sep_ext_axi/smu_sep_ext_axi.ecc.hex",
  "hw/sys/smc/dv/fw/build/tests/smu_sep_ext_axi/smu_sep_ext_axi.sram.sym",
  "hw/sys/smu/dv/build/firmware/smu_sep_ext_axi_arm/smu_sep_ext_axi_arm.rom.hex",
  "hw/sys/smu/dv/build/firmware/smu_sep_bidirect_arm/smu_sep_bidirect_arm.rom.hex",
  "hw/sys/smu/dv/build/firmware/smu_sep_arm/smu_sep_arm.rom.hex",
  "hw/sys/smu/dv/build/firmware/boot_rom/smu_sep_boot_rom.hex",
