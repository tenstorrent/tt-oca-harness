# Run modes carry no eFuse plusargs. `+skip_fuse_sense` and the shadow-register
# preloads are declared per test in testlists/wrapper.toml, next to the reason
# each claim tolerates the skip; the boot-stall leaves carry none and sense
# their OTP image through the wrapper's SMC eFuse model. $value$plusargs
# returns the first match, so a preload named here would override a test's own.
[run_modes.smoke]
description = "Production-wrapper baseline"
timeout_sec = 1800
args = []

[run_modes.sep_rtl]
description = "SMC-assisted real SEP RTL boot in the OSS smu_wrapper"
timeout_sec = 3600
args = []

[run_modes.sep_rtl_no_shadow]
description = "Real-SEP wrapper for the lifecycle leaves, whose SEP shadow image is their own"
timeout_sec = 3600
args = []

# Fuse-sense run modes. Every other run mode above passes +skip_fuse_sense,
# under which efuse_shadow_regs.sv drives fuse_sense_done from the plusarg
# rather than from the sense sequence and loads the shadow array from the
# preload file. A test that observes fuse-sense completion has to run without
# it, so the eFuse bank models supply the sensed data. The shadow preload
# plusargs are read only under +skip_fuse_sense, so the SMC one is inert here
# and the SEP one is left off entirely.
[run_modes.sep_rtl_fuse_sense]
description = "Real-SEP wrapper with real SMC and SEP fuse sense"
timeout_sec = 3600
args = [
  "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
]

[targets.default]
description = "Fallback: the single OSS wrapper profile (SEP=1, real EL2 CPU)"
build_dir = "hw/sys/smu/dv/build/cocotb_wrapper"
defines = [
]

[targets.default.tools.verilator]
flags = [
  "-Wno-BLKLOOPINIT",
