schema_version = 1

# Launch entry: selected by `--dut smu`, resolved by the directory convention
# (hw/sys/smu/dv + <name>_sim_cfg.toml), or by `--dut smu_wrapper`, which
# hw/common/dv/configs/duts.toml registers as an `alias_of = "smu"` and so
# resolves to this same config and identity.
#
# This is the SMU regression. The bare `smu #(.SEP(0))` block bench is
# smu_block_sim_cfg.toml.
#
# DUT is hw/top/smu_wrapper.sv (smu + smc_ip_integration + sep_ip_integration),
# pulled through the `smu_wrapper` bender target — same OSS composition as
# smc_wrapper / sep_wrapper. The CPU memory macros come with
# smc_ip_integration; the TB keeps the cocotb observe surface.
#
# Independent of the SEP=0 block bench in
# smu_block_sim_cfg.toml; both configs share this DV root and the build/runs
# evidence directory.
name = "smu"
profile = "native"
description = "Production-wrapper OSS regression on the single SEP=1 compile profile"
default_tool = "verilator"
tools = ["verilator", "vcs", "xcelium"]

[testlist]
path = "testlists/wrapper.toml"
format = "toml_list"

# Waive abr_reg.sv external wr/rd_ack $error. On the wrapper SEP=1 profile the
# ABR datapath is not meaningfully exercised; the assertion fires at t=0 and
# again after reset release (e.g. 8 ns), so waive by file (not only "at time 0").
#
# Every other PeakRDL-regblock external-ack check fires once at time 0 on a
# four-state simulator: the check is an immediate assertion in the `else`
# branch of the reset always_ff, and the first clock edge sees `arst_n` = X.
# It is generated code, so it cannot be gated in the tree, and $assertoff
# races the time-0 evaluation. Ignore exactly the time-0 fire; the same
# assertion failing at any later time stays a hard fail.
[pass_fail]
extra_ignore_patterns = [
  'abr_reg\.sv',
  'assert_bad_ext_(wr|rd)_ack: at time 0 [a-z]s$',
]
extra_hard_fail_patterns = ['assert_bad_ext_(wr|rd)_ack: started at .* failed at [1-9]']

[native.stages.clean]
kind = "clean"
paths = [
  "{run_dir}",
  "hw/sys/smu/dv/build/cocotb_wrapper",
  "hw/sys/smu/dv/build/work_wrapper",
  "hw/sys/smu/dv/build/firmware",
]

[build]
top_module = "smu_wrapper_uvm_top"
top_file = "hw/sys/smu/dv/tb/tb_wrapper_top.sv"
filelist = "hw/sys/smu/dv/build/smu_wrapper_dut_compile.f"
bender_filelist = "hw/sys/smu/dv/build/smu_wrapper_bender.f"
work_dir = "hw/sys/smu/dv/build/work_wrapper"
common_bender_targets = [
  "tech_cells_generic_exclude_deprecated",
  "tech_cells_generic_exclude_tc_sram",
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "idma_rtl",
  "register_interface_l1",
]
# smu pulls smc+dtp; sep+sep_el2 supply the real SEP subsystem and EL2 CPU;
# smu_wrapper adds hw/top/{smu_wrapper,smc_ip_integration,sep_ip_integration}.
# `simulation` is not a target here: the sep×simulation slice references
# simulation models by absolute paths outside the repository.
bender_targets = [
  "smu",
  "smc",
  "dtp",
  "sep",
  "sep_el2",
  "smu_wrapper",
]
incdirs = [
  "hw/sys/smu/dv/tb",
  # ocah_fcov_macros.svh, included by the cov/sv functional-coverage modules.
  "hw/common/assert",
]
# Vendor simulation collateral that an overlay of the sep bender graph can pull
# in and that the smu_wrapper hierarchy never instantiates: a licensed SPI
# controller wrapper and its DLL PHY, the pad and ESD libraries,
# padring_dv_wrapper and the SPI flash models. Excluded so Verilator is not
# made to parse their switch-level primitives; same denylist as
# smu_block_sim_cfg.toml.
exclude_files = [
  "sep_cdns_spi_wrap.sv",
  "cdn_ip6184_19e8_dll_phy",
  "cdn_xspi",
  "ln04lpp_gpio_lib_t12.v",
  "ln04lpp_gpio_lib_t18.v",
  "ln04lpp_esd_lib_t12.v",
  "ln04lpp_esd_lib_t18.v",
  "padring_dv_wrapper.sv",
  "tt_spi_devices.sv",
  "tt_bidir_delay.sv",
  "meta/models/spi",
]
stubs = [
  # Tooling shims only (OSS prim port / X-init). No product-module overrides.
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync2.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync3.sv",
]
sources = [
  # axi_cut (+ its spill_register deps) registers the ext_out channels at the
  # boundary, ahead of the responder in tb_wrapper_top.sv. Two things it
  # buys: the crossbar's ext_out aw_valid does not settle until late in the
  # cycle, and the cut makes every request channel edge-aligned and stable for
  # a whole cycle; and it breaks the combinational path across the boundary so
  # the responder's ready is not in the crossbar's timing cone.
  #
  # Outbound (ext_out) boundary: the shared AXI VIP interface the slave agent
  # binds and the bridge that places the cut's struct port on it.
  "hw/common/dv/vip/ocah_axi_vip/interface/ocah_axi_if.sv",
  "hw/common/dv/vip/ocah_axi_vip/interface/ocah_axi_struct_bridge.sv",
  "vendor/pulp-platform/common_cells/upstream/src/spill_register_flushable.sv",
  "vendor/pulp-platform/common_cells/upstream/src/spill_register.sv",
  "vendor/pulp-platform/axi/upstream/src/axi_cut.sv",
  # SMC CPU-memory DV hooks: the ROM and scratch image backdoors, the access
  # counters and the firmware mailbox. Binds into smc_ip_integration, which
  # holds the memory macros. hw/sys/smc/dv carries the same entry; without it
  # this environment has none of those hooks.
  # smc_cpu_mem_dv.sv resolves the scratch bank decode through this package;
  # hw/sys/smc/dv/smc_sim_cfg.toml lists the pair in the same order.
  "hw/sys/smc/dv/models/smc_scratch_map_pkg.sv",
  "hw/sys/smc/dv/models/smc_cpu_mem_dv.sv",
  # SEP=1 key_manager pulls picorv32; Bender package files are not always
  # on the smu_wrapper closure — mirror sep_sim_cfg.toml.
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_regs.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_mul.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_fast_mul.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_pcpi_div.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_axi_adapter.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_axi.sv",
  "vendor/tenstorrent/tt-picorv32/upstream/picorv32_wb.sv",
  # Functional-coverage modules (cov/sv/), instantiated in tb/tb_wrapper_top.sv
  # on this bench's signal names; smu_block_sim_cfg.toml carries the same set
  # minus smu_clk_fcov, whose clock mirrors only this bench exposes. Their
  # cover properties are the `user` points --coverage-user records.
  "hw/sys/smu/dv/cov/sv/smu_boot_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_xbar_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_rst_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_clk_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_lc_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_dtp_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_ext_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_clkstop_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_dbg_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_nosep_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_alias_fcov.sv",
]

[build.verilator]
public_scope = "hw/sys/smu/dv/tb/smu_wrapper_public_scope.vlt"
ccache = true

[coverage.verilator]
# Line / branch (--coverage-line), expression, toggle and SVL user coverage,
# replacing the simulator default `--coverage`.
#
# Toggle is what an integration level owns: whether the interconnect it wires
# up was actually exercised. It is affordable on this DUT only because
# smu_wrapper_cov_scope.vlt drops the subsystem, vendored and generated trees
# at compile time, which is the same reason `--dut smu_block` can carry it.
build_args = [
  "--coverage-line",
  "--coverage-expr",
  "--coverage-toggle",
  "--coverage-user",
  "{repo_root}/hw/sys/smu/dv/cov/config/verilator/smu_wrapper_cov_scope.vlt",
]
# Two DUTs share this dv tree, so the policy is named per DUT rather than
# discovered at cov/config/verilator/coverage_policy.toml.
policy_file = "hw/sys/smu/dv/cov/config/verilator/smu_wrapper_coverage_policy.toml"

[coverage.vcs]
# Commercial signoff path, the same shape as hw/sys/smc/dv/smc_sim_cfg.toml
# [coverage.vcs]. The simulator defaults (`-cm`, `-cm_dir`) are restated
# because a DUT table replaces the list, then the scope file is added.
# `-cm_hier` limits what is instrumented at compile time; `-cm_common_hier`
# extends the same file to assertion coverage and needs `-lca`.
# Edit `smu_wrapper_cov_scope.hier` then `--rebuild`.
compile_args = [
  "-cm",
  "line+cond+tgl+fsm+branch+assert",
  "-cm_dir",
  "{build_cov_dir}",
  "-cm_hier",
  "{repo_root}/hw/sys/smu/dv/cov/config/vcs/smu_wrapper_cov_scope.hier",
  "-lca",
  "-cm_common_hier",
]

[build.options]
# The hosted CI runner has four vCPUs and 16 GB; the wrapper model (SEP with
# the EL2, the four-core SMC and the DTP) is the largest Verilated model in the
# tree, so the compile parallelism matches that runner instead of oversubscribing it.
build_jobs = 4

[frameworks.cocotb]
# Wrapper flow keeps its own PyUVM tree so module names stay independent of
# the bare-smu cocotb/ catalog sharing this DV root.
python_root = "hw/sys/smu/dv/cocotb_wrapper"
test_dir = "hw/sys/smu/dv/cocotb_wrapper/tests"
python_paths = [
  "hw/common/dv/vip",
  # Shared PyUVM env and seq_lib, one package each for both DUTs. seq_lib
  # modules import each other as `from seq_lib.x`, so they only resolve inside
  # a package of that name, and `seq_lib` can only ever be one package -- see
  # smu_block_sim_cfg.toml, which puts the same directory on its path.
  "hw/sys/smu/dv/common",
  # The DTP bench's DV-owned JTAG tables (dtp_types: instruction opcodes, IR
  # width) as top-level modules. The DTP `env` package itself cannot go on
  # the path: `env` is the wrapper flow's own PyUVM package.
  "hw/sys/dtp/dv/cocotb/env",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

# Firmware/preload builds. Outputs are the staging manifest: the sim stage
# copies each declared output into the per-test run directory, where the
# time-zero SV loaders resolve the plusarg basenames.
#
# Every block runs fw/build_firmware.py, which owns the toolchain decision for
# this DV root: the caller's RISCV_TOOLCHAIN/RISCV_PREFIX when that gcc has
# picolibc, otherwise the same invocation inside the OCAH toolchain container
# through scripts/docker-run.sh run-here (`run-here`, not `run`: `run` remaps
# the repo to /work and the engine's OCAH_ROOT would not resolve). There is no
# site, PATH or home-directory probe, so no block here needs a RISC-V gcc on
# the host. `preloads` compiles nothing and never resolves a toolchain.
#
# argv goes through str.format() for {fw_target}, and the runlib rejects any
# other placeholder.
[c_build.elaboration]
cwd = "."
argv = [
  "python3",
  "hw/sys/smu/dv/fw/build_firmware.py",
  "--target",
  "preloads",
]
outputs = [
  "hw/sys/smu/dv/build/firmware/preloads/smc_rom_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/smc_efuse_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_efuse_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_boot_rom_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_itcm_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_dtcm_default.hex",
]

[c_build.smc_smoke]
cwd = "."
argv = [
  "python3",
  "hw/sys/smu/dv/fw/build_firmware.py",
  "--target",
  "smu_smc_smoke",
]
outputs = [
  "hw/sys/smu/dv/build/firmware/smu_smc_smoke/smu_smc_smoke.rom.hex",
  "hw/sys/smu/dv/build/firmware/preloads/smc_efuse_default.hex",
  # The SEP=1 wrapper loads its SEP boot ROM, TCMs and eFuse at time zero and
  # is fatal without them; build_firmware.py writes these zero-filled preloads
  # for every --target, so staging them costs nothing.
  "hw/sys/smu/dv/build/firmware/preloads/sep_efuse_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_boot_rom_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_itcm_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_dtcm_default.hex",
]

[c_build.sep_smoke]
cwd = "."
argv = [
  "python3",
  "hw/sys/smu/dv/fw/build_firmware.py",
  "--target",
  "smu_sep_smoke",
]
outputs = [
  "hw/sys/smu/dv/build/firmware/smu_sep_arm/smu_sep_arm.rom.hex",
  "hw/sys/smu/dv/build/firmware/smu_sep_smoke/smu_sep_smoke.itcm.hex",
  "hw/sys/smu/dv/build/firmware/smu_sep_smoke/smu_sep_smoke.dtcm.hex",
  "hw/sys/smu/dv/build/firmware/smu_sep_smoke/smu_sep_smoke.sym",
  "hw/sys/smu/dv/build/firmware/boot_rom/smu_sep_boot_rom.hex",
  "hw/sys/smu/dv/build/firmware/preloads/smc_efuse_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_efuse_default.hex",
]

# Real SEP DV firmware: the {fw_target} image from the SEP firmware engine
# (hw/sys/sep/dv/fw, picolibc + libsep.a) together with the SMC arm ROM, the
# SEP boot-ROM trampoline and the blank eFuse preloads from this DV root's
# builder. Tests select it with `firmware = { name = "<engine test>", mode =
# "sep_dv_fw" }`; the trampoline jumps to 0xC000_0000, which is each image's
# _start.
#
# The engine images are `objcopy -O verilog` hex (an @0 record plus
# space-separated bytes) while the smu/dv/fw images are one byte per line.
# Both forms are byte-wide $readmemh input, so the tb_wrapper_top.sv TCM loader
# reads either without change.
[c_build.sep_dv_fw]
cwd = "."
argv = [
  "python3",
  "hw/sys/smu/dv/fw/build_firmware.py",
  "--target",
  "smu_sep_arm",
  "--sep-test",
  "{fw_target}",
]
outputs = [
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.dtcm.hex",
  # ELF + nm listing from the same link: +sep_sym resolves the terminal-loop
  # PCs from the .sym, and staging both keeps sim-only reruns hermetic.
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.tcm.elf",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.tcm.sym",
  "hw/sys/smu/dv/build/firmware/smu_sep_arm/smu_sep_arm.rom.hex",
  "hw/sys/smu/dv/build/firmware/boot_rom/smu_sep_boot_rom.hex",
  "hw/sys/smu/dv/build/firmware/preloads/smc_efuse_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_efuse_default.hex",
]

# The one engine image that boots from ROM with no TCM preload: fw.mk links it
# in its rom_only mode and emits a VMEM for +sep_boot_rom_hex instead of TCM
# hex, so the SEP boot-ROM trampoline is not staged.
[c_build.sep_dv_fw_rom_only]
cwd = "."
argv = [
  "python3",
  "hw/sys/smu/dv/fw/build_firmware.py",
  "--target",
  "smu_sep_arm",
  "--sep-test",
  "{fw_target}",
]
outputs = [
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.vmem",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.rom_only.elf",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.rom_only.sym",
  "hw/sys/smu/dv/build/firmware/smu_sep_arm/smu_sep_arm.rom.hex",
  "hw/sys/smu/dv/build/firmware/preloads/smc_efuse_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_efuse_default.hex",
]

# SEP<->SMC bidirectional handshake: the SMC half is the smu_sep_bidirect_arm
# ROM from this DV root's builder in place of smu_sep_arm.
[c_build.sep_dv_fw_bidirect_arm]
cwd = "."
argv = [
  "python3",
  "hw/sys/smu/dv/fw/build_firmware.py",
  "--target",
  "smu_sep_bidirect",
  "--sep-test",
  "{fw_target}",
]
outputs = [
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.itcm.hex",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.dtcm.hex",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.tcm.elf",
  "hw/sys/sep/dv/fw/build/tests/{fw_target}/{fw_target}.tcm.sym",
  "hw/sys/smu/dv/build/firmware/smu_sep_bidirect_arm/smu_sep_bidirect_arm.rom.hex",
  "hw/sys/smu/dv/build/firmware/boot_rom/smu_sep_boot_rom.hex",
  "hw/sys/smu/dv/build/firmware/preloads/smc_efuse_default.hex",
  "hw/sys/smu/dv/build/firmware/preloads/sep_efuse_default.hex",
]

# Dual-firmware leaves: the SEP {fw_target} image plus one SMC engine image
# (hw/sys/smc/dv/fw; the 72-bit ECC hex for +smc_scratch_ram_hex and its nm
