#
# SMU wrapper (`--dut smu`) Verilator coverage policy.
#
# GENERATED from a measured run: the [[holes]] below are the `user` points the
# graded run left unhit, each carried with a category, a rationale, an owner
# and an expiry. Regenerate them from a fresh coverage-details.json rather
# than editing them by hand; this header is the only part written by a person.
# They were measured from the no_sep target of `--dut smu --items sep0_all
# --cov`.
#
# No [[thresholds]] are set here. A floor on the `user` family is set only
# from a measured weekly `--cov` database, by the SMU DV owner, together with
# `max_unclassified_points` -- see SMU_COVERAGE_POLICY.adoc. The effective
# percentage is still reported, just not gated.
#
# ONE POLICY, TWO TARGETS. [coverage.verilator].policy_file is resolved per
# tool, not per target, so this one file grades both
# compile_smu_chiplet_no_sep and compile_smu_chiplet_sep_rtl. An accepted
# waiver whose selector matches a COVERED point is a hard ConfigError, so the
# holes are generated from the no_sep run -- the target CI gates -- and a
# point that can only fire with SEP present must not exist on that
# elaboration. The `g_sep` generate blocks in cov/sv/*_fcov.sv are what makes
# that true: tb_wrapper_top.sv passes SepPresent = 1'b0 under
# `ifdef SMU_NO_SEP, so those points are never elaborated there, never enter
# the no_sep database, and are never named here. Grading a sep_rtl run
# against this file therefore cannot conflict; it is not gated and may show a
# lower effective percentage.
#
# Three mechanisms, do not confuse them:
#
#   smu_wrapper_cov_scope.vlt  `coverage_off` -> the point never enters the
#                              database. Structural OUT, by source file.
#   SepPresent                 the `g_sep` generate blocks described above.
#                              Structural OUT, by elaboration.
#   [[holes]] here             the point exists and is not hit, carried with a
#                              rationale, an owner and a review date. Its
#                              selectors include `hierarchy`, which the .vlt
#                              cannot express.
#
# Two DUTs share this DV root, so the policy is named per DUT rather than
# discovered at cov/config/verilator/coverage_policy.toml; the block bench
# carries smu_block_coverage_policy.toml.

