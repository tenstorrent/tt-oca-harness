# The wrapper interface toggle rate: the ports of smu_wrapper, a port counting
# as toggled when any of its bits has. The SEP-facing ports are live only on
# the sep_rtl target, so each target carries its own floor, set below the
# values its own databases measured so that seed noise does not fail a run
# while a regression does. The plan works toward 85 percent on sep_rtl.
[[thresholds]]
id = "wrapper-interface-toggle-sep-rtl"
tool = "verilator"
target = "compile_smu_chiplet_sep_rtl"
scope = "smu_wrapper_uvm_top.u_dut"
metric_family = "toggle_signal"
population = "effective"
minimum_percent = 0.0

[[thresholds]]
id = "wrapper-interface-toggle-no-sep"
tool = "verilator"
target = "compile_smu_chiplet_no_sep"
scope = "smu_wrapper_uvm_top.u_dut"
metric_family = "toggle_signal"
population = "effective"
minimum_percent = 45.0
