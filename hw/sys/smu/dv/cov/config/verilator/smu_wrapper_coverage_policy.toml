status = "accepted"
confidence = "medium"
rationale = "deferred: no enrolled test drives this condition - deferred: no enrolled stimulus in this phase (SMU-RST-COLD.S1:cold_reset_async_assert_without_clock)"
owner = "smu-dv"
reviewer = "smu-dv"
date = "2026-09-11"
expires = "2026-12-10"
expected_matches = 1
[[holes.native]]
tool = "verilator"
metric_family = "user"
hierarchy = "smu_wrapper_uvm_top.u_smu_rst_fcov.c_cold_reset_async_assert_without_clock"

