#
# SMU wrapper (`--dut smu`) Verilator coverage policy.
#
# GENERATED from a measured run: the [[holes]] below are the `user` points the
# graded run left unhit, each carried with a category, a rationale, an owner
# and an expiry. Regenerate them from a fresh coverage-details.json rather
# than editing them by hand; this header is the only part written by a person.
# They were measured from `--dut smu --items all --cov` on the single
# `compile_smu_chiplet` target (102 leaves, Verilator 5.050:
# user 98 of 107 points hit, 98.00 effective after the seven rows below).
# `all` is the coverage set, as it is for SEP; `hosted` is its toolchain-free
# subset and leaves the SEP firmware and lifecycle stimulus out. The four
# `g_sep` rows are the points that measurement left unhit: one
# unreachable from the wrapper boundary, two waiting on a SEP-firmware leaf,
# one whose model wants the last-word form first.
#
# No floor is set on the `user` family; one is set only from a measured
# weekly `--cov` database, by the SMU DV owner, together with
# `max_unclassified_points` -- see SMU_COVERAGE_POLICY.adoc. The effective
# percentage is still reported, just not gated. The Verilator set does not
# collect toggle; the wrapper's toggle is graded on the VCS flow by
# ../vcs/smu_wrapper_coverage_policy.toml.
#
# The wrapper has one target, `compile_smu_chiplet`, with SEP elaborated. An
# accepted waiver whose selector matches a COVERED point is a hard
# ConfigError, so a hole may only name a point the graded database leaves
# unhit. The `g_sep` generate blocks in cov/sv/*_fcov.sv elaborate the points
# that need SEP only when SEP is present.
#
# Three mechanisms, do not confuse them:
#
#   smu_wrapper_cov_scope.vlt  `coverage_off` -> the point never enters the
#                              database. Structural OUT, by source file.
#   SepPresent                 the `g_sep` generate blocks described above.
#                              Structural OUT, by elaboration.
#   [[holes]] here             the point exists and is not hit, carried with a
#                              rationale, an owner and a review date. Its
#                              selectors include `hierarchy`, which the .vlt
#                              cannot express.
#
# smu_sim_cfg.toml names this file explicitly rather than relying on the
# cov/config/verilator/coverage_policy.toml discovery.

