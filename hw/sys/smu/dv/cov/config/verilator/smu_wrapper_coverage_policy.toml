# The wrapper interface toggle rate: the ports of smu_wrapper, a port counting
# as toggled when any of its bits has. The floor sits below the values the
# first databases measured (50.6 percent with the SEP=0 test set, 57.2 with
# the SEP=1 set), so a real regression fails the grade and seed noise does
# not; the plan works toward 85 percent.
[[thresholds]]
id = "wrapper-interface-toggle"
tool = "verilator"
scope = "smu_wrapper_uvm_top.u_dut"
metric_family = "toggle_signal"
population = "effective"
minimum_percent = 45.0
