#
# SMU block-bench (`--dut smu_block`) Verilator coverage policy.
#
# GENERATED from a measured run: the [[holes]] below are the `user` points the
# graded run left unhit, each carried with a category, a rationale, an owner
# and an expiry. Regenerate them from a fresh coverage-details.json rather
# than editing them by hand; this header is the only part written by a person.
# They were measured from `--dut smu_block --items all --cov`.
#
# No [[thresholds]] are set here. A floor on the `user` family is set only
# from a measured weekly `--cov` database, by the SMU DV owner, together with
# `max_unclassified_points` -- see SMU_COVERAGE_POLICY.adoc. The effective
# percentage is still reported, just not gated.
#
# Three mechanisms, do not confuse them:
#
#   smu_cov_scope.vlt   `coverage_off` -> the point never enters the database.
#                       Structural OUT, by source file.
#   SepPresent          the `g_sep` generate blocks in cov/sv/*_fcov.sv. A
#                       point whose observable only exists with SEP
#                       elaborated is not elaborated at all on a SEP=0 build,
#                       so it never reaches the database and no waiver has to
#                       name it. This bench is SEP=0 and passes 1'b0.
#   [[holes]] here      the point exists and is not hit, carried with a
#                       rationale, an owner and a review date. Its selectors
#                       include `hierarchy`, which the .vlt cannot express.
#
# ---------------------------------------------------------------------------
# Why this DUT collects toggle and not line/branch/expression
# ---------------------------------------------------------------------------
# Counted on the built model rather than assumed: Verilator emits ZERO line,
# branch or expression instrumentation sites for anything under
# hw/sys/smu/rtl/. smu.sv is 1326 lines with two always blocks, 79 continuous
# assigns and one if/case -- it wires SMC, DTP, SEP and the crossbar together,
# and structural code has almost nothing for those three families to
# instrument.
#
# The previous argument list produced 1350556 sites, every one of them
# somebody else's:
#
#   vendor/**                    886526   65.6%
#   chipyard-generated CPU        272220   20.2%
#   hw/ip/**                      132652    9.8%
#   hw/common/**                   49040    3.6%
#   hw/sys/smc/**                   9928    0.7%
#   hw/sys/smu/dv/** (TB)            186    0.0%
#   hw/sys/smu/rtl/**                  0    0.0%
#
# Toggle instruments nets. For an integration level that is the question worth
# asking -- was the interconnect this DUT wires up actually exercised -- and
# it is the one the subsystem DV packages cannot answer, because none of them
# sees SMU's boundary.
#
# ---------------------------------------------------------------------------
# What the scope achieves, and what it does not
# ---------------------------------------------------------------------------
# smu_cov_scope.vlt takes the toggle denominator from 1350556 sites to 19611,
# and drops SMC, DTP, SEP, hw/ip, hw/common, the CPU cluster and the TB
# entirely. Of what remains:
#
#   vendor/pulp-platform/axi (axi_lite_demux.sv)    12886   65.7%
#   vendor/tenstorrent/tt-hw-debug (generic_dff*)    5705   29.1%
#   hw/sys/smu/rtl/smu.sv                            1020    5.2%
#
# Every one of those 18591 vendored sites sits under `.u_smc` or `.u_dtp`;
# none is under SMU's own crossbar. So the intent is unambiguous and only the
# mechanism falls short: no file pattern reaches those two trees. `*vendor/*`,
# `*pulp-platform/*`, `*tt-hw-debug/*` and the bare `*axi_lite_demux.sv` /
# `*generic_dff.sv` forms were each built and counted, here and on SMC, and
# every one left the numbers unchanged.
#
# ---------------------------------------------------------------------------
# The toggle holes this file does not carry yet
# ---------------------------------------------------------------------------
# The `user` family below is graded. The toggle residue is reachable by
# hierarchy, which is a policy selector:
#
#   [[holes.native]]
#   tool = "verilator"
#   metric_family = "toggle"
#   hierarchy = "*.u_smc.*"      # and a second rule for "*.u_dtp.*"
#
# with `category = "out_of_scope"` and `disposition = "exclude_scope"` -- a
# non-actionable disposition, so no issue link is required -- and a
# `population = "effective"` threshold so the graded number is SMU's own
# interconnect.
#
# They are not written yet because `expected_matches` must equal the exact
# number of observations each selector matches, and a mismatch is a hard
# ConfigError. Once a run with toggle enabled on this configuration exists,
# read the two counts from its cov/merged.dat, add the two rules, then add the
# owner-approved threshold with `max_unclassified_points = 0`, which is the
# knob that makes a run fail on a new, unclassified hole.

