#
# SMU Verilator coverage policy.
#
# Scope carrier only: no [[thresholds]] and no [[holes]]. It gives the SMU
# coverage scope a version-controlled carrier; a threshold is set only from
# measured numbers.
#
# Two mechanisms, do not confuse them:
#
#   smu_cov_scope.vlt   `coverage_off` -> the point never enters the database.
#                       Structural OUT, by source file.
#   [[holes]] here      the point exists and is not hit, carried with a
#                       rationale, an owner and a review date. Its selectors
#                       include `hierarchy`, which the .vlt cannot express.
#
# ---------------------------------------------------------------------------
# Why this DUT collects toggle and not line/branch/expression
# ---------------------------------------------------------------------------
# Verilator emits ZERO line, branch or expression instrumentation sites for
# anything under hw/sys/smu/rtl/: smu.sv wires SMC, DTP, SEP and the crossbar
# together and carries almost no procedural logic. An unscoped build of those
# three families produces on the order of 1.3 million sites, all of them in
# the vendored trees, the chipyard-generated CPU cluster, hw/ip, hw/common,
# hw/sys/smc and the TB.
#
# Toggle instruments nets. For an integration level that is the question worth
# asking -- was the interconnect this DUT wires up actually exercised -- and
# it is the one the subsystem DV packages cannot answer, because none of them
# sees SMU's boundary.
#
# ---------------------------------------------------------------------------
# What the scope achieves, and what it does not
# ---------------------------------------------------------------------------
# smu_cov_scope.vlt drops SMC, DTP, SEP, hw/ip, hw/common, the CPU cluster and
# the TB entirely. Of what remains, two vendored trees hold the large majority
# of the toggle sites: vendor/pulp-platform/axi (axi_lite_demux.sv) and
# vendor/tenstorrent/tt-hw-debug (generic_dff*); hw/sys/smu/rtl/smu.sv holds
# the rest.
#
# Every one of those vendored sites sits under `.u_smc` or `.u_dtp`; none is
# under SMU's own crossbar. So the intent is unambiguous and only the
# mechanism falls short: no file pattern reaches those two trees. `*vendor/*`,
# `*pulp-platform/*`, `*tt-hw-debug/*` and the bare `*axi_lite_demux.sv` /
# `*generic_dff.sv` forms all leave the site count unchanged.
#
# ---------------------------------------------------------------------------
# The holes this file cannot carry without a measured database
# ---------------------------------------------------------------------------
# The residue is reachable by hierarchy, which is a policy selector:
#
#   [[holes.native]]
#   tool = "verilator"
#   metric_family = "toggle"
#   hierarchy = "*.u_smc.*"      # and a second rule for "*.u_dtp.*"
#
# with `category = "out_of_scope"` and `disposition = "exclude_scope"` -- a
# non-actionable disposition, so no issue link is required -- and a
# `population = "effective"` threshold so the graded number is SMU's own
# interconnect.
#
# `expected_matches` must equal the exact number of observations each selector
# matches, and a mismatch is a hard ConfigError. That count exists only in a
# coverage database (cov/merged.dat of a run with this configuration); a value
# written from build-time site totals fails closed on the first run.
# `max_unclassified_points = 0` in [[thresholds]] is the knob that makes a run
# fail on a new, unclassified hole.

schema_version = 1
dut = "smu_block"
scope_epoch = "smu-toggle-v1"
