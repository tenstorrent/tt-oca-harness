[[holes]]
id = "fcov-smu-c_alias_base_address_remapped"
title = "alias base address remapped"
category = "missing_stimulus"
disposition = "waive"
status = "accepted"
confidence = "medium"
rationale = "deferred: no enrolled test drives this condition - the point needs a SEP transfer at the alias window's first byte, SEP-view 0x4000_0000, which is SMC WDT0's first register; the SEP firmware images the all group loads use the CPU_CTRL and SRAM aliases above it (sep_smc_bringup.h). The anchor is a SEP-firmware leaf on this bench, smu_sep_bidirect_test being the nearest (SMU-ALIAS.S2:alias-base-address-remapped)"
owner = "smu-dv"
reviewer = "smu-dv"
date = "2026-09-23"
expires = "2026-12-10"
expected_matches = 1
[[holes.native]]
tool = "vcs"
metric_family = "user"
hierarchy = "smu_wrapper_uvm_top.u_smu_alias_fcov.g_sep.c_alias_base_address_remapped"

[[holes]]
id = "fcov-smu-c_alias_top_address_remapped"
title = "alias top address remapped"
category = "coverage_model_gap"
disposition = "waive"
status = "accepted"
confidence = "medium"
rationale = "the point compares the transfer address with the window's last byte, SEP-view 0x7FFF_FFFF, which only a byte-sized access can present; an aligned word access to the last word starts at 0x7FFF_FFF8 and never matches. The window's top also lies past every SMC-side mapping, so the access answers DECERR. The point wants the last-word form smc_map_fcov uses (in_win over the last eight bytes) before a leaf can be asked to walk it (SMU-ALIAS.S2:alias-top-address-remapped)"
owner = "smu-dv"
reviewer = "smu-dv"
date = "2026-09-23"
expires = "2026-12-10"
expected_matches = 1
[[holes.native]]
tool = "vcs"
metric_family = "user"
hierarchy = "smu_wrapper_uvm_top.u_smu_alias_fcov.g_sep.c_alias_top_address_remapped"

[[holes]]
id = "fcov-smu-c_map_smc_size_zero"
title = "c map smc size zero"
category = "needs_review"
disposition = "waive"
status = "accepted"
confidence = "medium"
rationale = "credit withheld pending a design answer: smu_axi_xbar forms the SMC crossbar rule as end = base + size, so REGION_SIZE = 0 gives start == end, and the decoder's own map check (addr_decode_dync check_start: start < end or end == 0) fails the leaf that writes it on VCS. The point calls the zero window a legal state that denies the whole region; the decoder calls the rule invalid. Until the SMU owner says which, no leaf drives the value (SMU-XBAR-MAP.S3:map-smc-size-zero)"
owner = "smu-dv"
reviewer = "smu-dv"
date = "2026-09-23"
expires = "2026-12-10"
expected_matches = 1
[[holes.native]]
tool = "vcs"
metric_family = "user"
hierarchy = "smu_wrapper_uvm_top.u_smu_xbar_fcov.c_map_smc_size_zero"
