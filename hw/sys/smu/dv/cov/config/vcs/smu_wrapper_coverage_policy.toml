confidence = "medium"
rationale = "no subordinate behind the SMU crossbar answers an exclusive access: every AXI interconnect in the SEP and SMC is built without atomics and the memory adapters tie exokay off, so EXOKAY cannot appear on ext_in"
owner = "smu-dv"
reviewer = "smu-dv"
date = "2026-09-11"
expires = "2026-12-10"
expected_matches = 1
