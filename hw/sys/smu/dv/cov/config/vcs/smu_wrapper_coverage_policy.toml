#
# SMU wrapper (`--dut smu`) VCS coverage policy, the counterpart of
# ../verilator/smu_wrapper_coverage_policy.toml on the commercial flow.
#
# urg has no `user` family. The `OCAH_FCOV_COVER` points of cov/sv are
# `cover property` statements, which urg reads under its assert metric
# together with the `assert property` statements left in scope by
# smu_wrapper_cov_scope.hier, so the functional-coverage floor is a rule on
# the `assertion` family. Its report splits the two (`Summary for Cover
# Properties`, `Summary for Assertions` in cov/report/asserts.txt).
#
# `toggle` is the runner's native family, urg's TOGGLE column: every bit of
# every port of smu_wrapper, both directions, after the exclusions named
# below have left the population. The wrapper is wiring, so its ports are
# what it owns, and this is the same family and the same reading every other
# DUT is graded on. The floor is set from the measured `all` database
# (102 leaves: toggle 96.27, assertion 89.72 effective).
#
# Two DUTs share this DV root, so the policy is named per DUT rather than
# discovered at cov/config/vcs/coverage_policy.toml.

schema_version = 1
dut = "smu"
scope_epoch = "smu-vcs-cov-v1"

[[thresholds]]
id = "assertion"
tool = "vcs"
metric_family = "assertion"
population = "effective"
minimum_percent = 80.0

[[thresholds]]
id = "toggle"
tool = "vcs"
metric_family = "toggle"
population = "effective"
minimum_percent = 80.0

# Fields urg leaves out of the wrapper's port toggle, each class with its
# reason in the file's ANNOTATION lines. Regenerated from urg's exclusion
# template by gen_smu_wrapper_toggle_exclusions.py; README.md lists the classes.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smu_wrapper_toggle_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Covergroups declared inside the RTL the wrapper instantiates. `-cm_hier` does
# not reach covergroups, so the vendored I3C controllers' groups would otherwise
# sit in urg's GROUP score beside the wrapper's own cov/sv covergroups.
# Regenerated from urg's group exclusion template by
# gen_smu_wrapper_group_exclusions.py; README.md lists the classes.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smu_wrapper_group_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]
