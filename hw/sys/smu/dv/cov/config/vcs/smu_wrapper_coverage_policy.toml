#
# SMU wrapper (`--dut smu`) VCS coverage policy, the counterpart of
# ../verilator/smu_wrapper_coverage_policy.toml on the commercial flow.
#
# The `OCAH_FCOV_COVER` points of cov/sv are `cover property` statements. urg
# reads them under its assert metric together with the `assert property`
# statements left in scope by smu_wrapper_cov_scope.hier, and splits the two in
# cov/report/asserts.txt (`Summary for Cover Properties`, `Summary for
# Assertions`); the runner reads the cover-property summary as the `user`
# family. `user` is floored at 100: every collected point is hit by an enrolled
# leaf of `all`, so the row fails on a point going dark rather than on a score.
#
# No code-metric family carries a floor, the way DTP's policy
# (hw/sys/dtp/dv/cov/config/vcs/coverage_policy.toml) and SEP's
# (hw/sys/sep/dv/cov/config/vcs/coverage_policy.toml) set none: the runner
# reports the family figures, a run's status comes from its tests, and
# SMU_COVERAGE_POLICY.adoc states the targets the figures are read against. A
# floor on `toggle` or on urg's ASSERT column would fail a run without saying
# anything true -- a number moving is not a defect, and SMU has no formal
# unreachability analysis to prove that what is left in the toggle denominator
# is reachable at all.
#
# `toggle` is still collected and still reported: every bit of every net of the
# units smu_wrapper_cov_scope.hier keeps -- smu_wrapper, smu, smu_axi_xbar and
# the other SMU-owned units under u_smu -- both directions, after the
# exclusions named below have left the population.
#
# Two DUTs share this DV root, so the policy is named per DUT rather than
# discovered at cov/config/vcs/coverage_policy.toml.

schema_version = 1
dut = "smu"
scope_epoch = "smu-vcs-cov-v3"

[[thresholds]]
id = "user"
tool = "vcs"
metric_family = "user"
population = "effective"
minimum_percent = 100.0

# Fields urg leaves out of the wrapper's port toggle, each class with its
# reason in the file's ANNOTATION lines. Regenerated from urg's exclusion
# template by the companion's gen_smu_wrapper_toggle_exclusions.py; README.md
# lists the classes.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smu_wrapper_toggle_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Toggle points of smu, smu_wrapper and smu_axi_xbar, and
# the condition rows and branch arms two classes name, each class with its
# fact in the file's ANNOTATION lines. Regenerated from urg's exclusion
# templates and the raw report of an `all` run by
# the companion's gen_smu_cov_toggle_exclusions.py; README.md lists the classes.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smu_toggle_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Covergroups declared inside the RTL the wrapper instantiates. `-cm_hier` does
# not reach covergroups, so the vendored I3C controllers' groups would otherwise
# sit in urg's GROUP score beside the wrapper's own cov/sv covergroups.
# Regenerated from urg's group exclusion template by
# the companion's gen_smu_wrapper_group_exclusions.py; README.md lists the
# classes.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smu_wrapper_group_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]
