#
# SMU VCS coverage policy: scope only -- which hierarchy the code-coverage report
# grades -- with no [[thresholds]] and no [[holes]].
#
# NOTHING HERE HAS BEEN RUN ON VCS. There is no SMU coverage compile, merge or
# report on VCS, so there is no score to set a threshold from and no unhit
# point to carry as a hole; a threshold without a measured number would fail
# runs without saying anything true. The graded SMU policies today are the
# Verilator ones: ../verilator/smu_block_coverage_policy.toml for this DUT and
# ../verilator/smu_wrapper_coverage_policy.toml for `--dut smu`.
#
# Scope is NOT owned here. `-cm_hier` + `-cm_common_hier` at compile time
# decide what enters the database and therefore what the number means; the
# entry below is the report-time half, which only keeps the pages aligned with
# that scope. No compile passes smu_cov_scope.hier yet -- see
# cov/config/vcs/README.md for what wiring it up takes.
#
# Named per DUT rather than discovered at cov/config/vcs/coverage_policy.toml,
# for the same reason the Verilator policies are: `smu` and `smu_block` share
# this DV root, the canonical path resolves identically for both, and whichever
# DUT the file does not name fails `--validate-configs`.
# [coverage.vcs].policy_file in smu_block_sim_cfg.toml names this file.
#
# `--run-dir <dir> --stage cov_report` re-renders the pages from the same
# merged database, but it cannot widen or narrow the score. `--run-dir <dir>
# --waive` re-grades the rendered report against this file's [[holes]] and
# [[thresholds]] without running urg; it exits 2 when this [[native_files]]
# entry's digest differs from the one the report recorded.

schema_version = 1
dut = "smu_block"
scope_epoch = "smu-code-cov-v1"

# Report-page pruning only. `urg -hier` drops rows from the report but scores
# the whole database regardless, so this entry keeps the pages aligned with the
# instrumented scope and records the file's hash in the manifest; it does not
# produce the number. The number's scope comes from `-cm_hier` at compile time.
[[native_files]]
tool = "vcs"
role = "scope"
path = "smu_cov_scope.hier"
apply_phase = "report"
# `-cm_common_hier` is the report-time half of the compile-time pairing: it makes
# `-hier` prune assertion pages as well as code pages, so the report matches the
# instrumented scope instead of showing assertion rows for excluded hierarchy.
args = ["-hier", "{path}", "-cm_common_hier"]
