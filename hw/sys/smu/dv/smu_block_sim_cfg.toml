schema_version = 1

# The bare block bench: `smu #(.SEP(0))` instantiated directly, with its
# technology-specific interfaces tied off rather than attached to the
# open-source IP integration. SEP=0 is hardcoded in tb/tb_top.sv.
#
# It carries the SEP=0 composition proofs (testlists/nosep.toml), the two
# leaves that cannot run on `--dut smu`, and the SV-UVM
# view, whose harness is the `UVM` shape of this TB. testlists/all.toml records
# why each is here.
#
# Executable plan: enrolled groups in testlists/all.toml
# Two frameworks share this config and one tb_top: cocotb/PyUVM (default) and
# SV-UVM (`--framework uvm`, VCS; see the [frameworks.uvm] overlay at the
# bottom). Shared stage graph + tool list come from profile = "native".
name = "smu_block"
profile = "native"
description = "Bare smu #(.SEP(0)) block bench: the SEP=0 composition proofs, the two leaves that cannot run on --dut smu, plus the SV-UVM view"
default_framework = "cocotb"

[testlist]
path = "testlists/all.toml"
format = "toml_list"

# The PeakRDL-regblock external-ack checks are immediate assertions in the
# `else` branch of each register block's reset always_ff. On a four-state
# simulator the first clock edge at time 0 sees `arst_n` = X, takes that
# branch and evaluates X operands, so every regblock in the bench prints one
# `Error:` line at time 0 that the runner's fail pattern matches. The check is
# generated, so it cannot be gated in the tree, and $assertoff races the
# time-0 evaluation. Ignore exactly the time-0 fire; the same assertion
# failing at any later time stays a hard fail.
[pass_fail]
extra_ignore_patterns = ['assert_bad_ext_(wr|rd)_ack: at time 0 [a-z]s$']
extra_hard_fail_patterns = ['assert_bad_ext_(wr|rd)_ack: started at .* failed at [1-9]']

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "hw/sys/smu/dv/build"]

[build]
top_module = "smu_uvm_top"
top_file = "hw/sys/smu/dv/tb/tb_top.sv"
sources = [
  # Outbound SMN boundary: the shared AXI VIP interface the slave agent binds
  # and the bridge that places the crossbar's struct port on it.
  "hw/common/dv/vip/ocah_axi_vip/interface/ocah_axi_if.sv",
  "hw/common/dv/vip/ocah_axi_vip/interface/ocah_axi_struct_bridge.sv",
  # Flow-shared functional-coverage modules (cov/sv/): compiled in BOTH flows --
  # this list feeds the cocotb/Verilator filelist, and the
  # [frameworks.uvm.build] sources list (which replaces this one) repeats the
  # entries. Instantiated in tb/tb_top.sv.
  "hw/sys/smu/dv/cov/sv/smu_boot_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_xbar_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_rst_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_lc_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_dtp_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_ext_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_clkstop_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_dbg_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_nosep_fcov.sv",
]
filelist = "hw/sys/smu/dv/build/smu_block_dut_compile.f"
bender_filelist = "hw/sys/smu/dv/build/smu_block_bender.f"
work_dir = "hw/sys/smu/dv/build"
common_bender_targets = [
  "tech_cells_generic_exclude_deprecated",
  "tech_cells_generic_exclude_tc_sram",
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "idma_rtl",
  "register_interface_l1",
]
# smu pulls smc+dtp; sep+sep_el2 supply sep_* packages / EL2 (needed by sep_pkg
# even when SEP=0 — the sep module is not instantiated).
# No `simulation` target: the sep×simulation bender slice references simulation
# models by absolute paths outside the repository, and none of its files
# (padring/pad/SPI/DLL-PHY sim models, OTBN tracer) are in the SMU SEP=0
# `smu_uvm_top` hierarchy. Mirrors smu_sim_cfg.toml.
bender_targets = ["smu", "smc", "dtp", "sep", "sep_el2"]
incdirs = [
  "hw/sys/smu/dv/tb",
  # ocah_fcov_macros.svh, included by the cov/sv functional-coverage modules.
  "hw/common/assert",
]
# Vendor simulation collateral that an overlay of the sep bender graph can pull
# in and that the SMU SEP=0 hierarchy never instantiates (the SPI path is the
# OpenTitan spi_controller): a licensed SPI controller wrapper and its DLL PHY,
# the pad and ESD libraries, padring_dv_wrapper and the SPI flash models.
# Excluded so Verilator is not made to parse their switch-level primitives
# (pmos/rmos/highz).
exclude_files = [
  "sep_cdns_spi_wrap.sv",
  "cdn_ip6184_19e8_dll_phy",
  "cdn_xspi",
  "ln04lpp_gpio_lib_t12.v",
  "ln04lpp_gpio_lib_t18.v",
  "ln04lpp_esd_lib_t12.v",
  "ln04lpp_esd_lib_t18.v",
  "padring_dv_wrapper.sv",
  "tt_spi_devices.sv",
  "tt_bidir_delay.sv",
  "meta/models/spi",
]
stubs = [
  # Tooling shims only (OSS prim port / X-init). No product-module overrides.
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync2.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync3.sv",
]

[build.verilator]
# Drop cocotb global --public-flat-rw via public_scope (.vlt); observe-only hier.
public_scope = "hw/sys/smu/dv/smu_public_scope.vlt"
ccache = true

[build.options]
# Parallelize Verilator codegen + cocotb make C++ compile.
build_jobs = 8

[coverage.verilator]
# Toggle plus SVL user coverage, over the scope in
# cov/config/verilator/smu_cov_scope.vlt. Replaces the simulator-default
# `--coverage` (which enables all forms).
#
# WHY TOGGLE AND NOT LINE/BRANCH/EXPRESSION. This DUT is the bare
# `smu #(.SEP(0))` interconnect: smu.sv wires SMC, DTP, SEP and the AXI
# crossbar together and carries almost no procedural code, so Verilator emits
# no line, branch or expression instrumentation site for anything under
# hw/sys/smu/rtl/. Every site an unscoped line/branch/expression build produces
# (on the order of a million) belongs to vendored IP, the generated CPU
# cluster, hw/ip, hw/common or SMC, and those families cannot grade SMU
# because there is nothing of SMU's for them to instrument.
#
# Toggle instruments nets, which is what an integration level owns: whether
# the interconnect it wires up was actually exercised. That is the question
# this DUT can answer and the subsystem packages cannot.
#
# WHY SCOPE IS LOAD-BEARING. Toggle over the whole elaborated model -- SMC
# cluster and vendored fabric included -- is ~0.5 GB per leaf.
# smu_cov_scope.vlt drops all of it at compile time, so the toggle denominator
# is SMU's own RTL. Enabling toggle without the scope file reproduces that
# database.
#
# --output-groups 0 compiles the generated .cpp files one by one instead of
# in --build-jobs groups. Verilator groups by file count, and on a
# coverage-instrumented model one group can become a translation unit of
# several hundred MB that a hosted runner cannot compile.
build_args = [
  "--coverage-toggle",
  "--coverage-user",
  "--output-groups",
  "0",
  "{repo_root}/hw/sys/smu/dv/cov/config/verilator/smu_cov_scope.vlt",
]
# Named explicitly rather than left to the canonical
# cov/config/<tool>/coverage_policy.toml discovery, because `smu` and
# `smu_block` share one hw/sys/smu/dv tree: the canonical path resolves
# identically for both, and whichever DUT the file does not name fails
# `--validate-configs` on the dut mismatch. A DUT-qualified filename lets
# the wrapper `--dut smu` carry its own without collision.
policy_file = "hw/sys/smu/dv/cov/config/verilator/smu_block_coverage_policy.toml"

[frameworks.cocotb]
python_root = "hw/sys/smu/dv/cocotb"
test_dir = "hw/sys/smu/dv/cocotb/tests"
python_paths = [
  "hw/common/dv/vip",
  # Shared PyUVM env (smu_dv_env) and the merged seq_lib, outside both cocotb
  # trees so neither DUT owns them. `env` and `seq_lib` can each resolve to only
  # one package -- a regular package wins the import over a namespace one at any
  # path position -- so each has a single home.
  "hw/sys/smu/dv/common",
  # Reuse DTP JTAG helpers (types / tap device / IDCODE decode) without copying.
  "hw/sys/dtp/dv/cocotb",
  # The same DV-owned tables as top-level modules (`import dtp_types`), the
  # spelling the shared seq_lib uses so it resolves under `--dut smu` too.
  "hw/sys/dtp/dv/cocotb/env",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

[run_modes.smoke]
description = "Phase-1 smoke: SMC reset/AXI, DTP JTAG IDCODE, no-SEP config"
timeout_sec = 1800
# Skip OTP fuse-sense FSM so primary reset can release without a real eFuse model.
# +rom_hex required by real OCAH4CORECluster_mems (in smc_ip_integration).
args = [
  "+skip_fuse_sense",
  "+rom_hex={repo_root}/hw/sys/smc/dv/assets/smc_rom_default.hex",
]

[run_modes.smc]
description = "Phase-1 SMC / no-SEP wrapper tests"
timeout_sec = 1800
args = [
  "+skip_fuse_sense",
  "+rom_hex={repo_root}/hw/sys/smc/dv/assets/smc_rom_default.hex",
]

[run_modes.dtp]
description = "Phase-1 DTP / JTAG / boot-stall / xtrig tests"
timeout_sec = 1800
args = [
  "+skip_fuse_sense",
  "+rom_hex={repo_root}/hw/sys/smc/dv/assets/smc_rom_default.hex",
]

[run_modes.fabric]
description = "Phase-1 SEP=0 fabric: SMN port, ID-width, DECERR, remap, ATOP"
timeout_sec = 1800
args = [
  "+skip_fuse_sense",
  "+rom_hex={repo_root}/hw/sys/smc/dv/assets/smc_rom_default.hex",
]

[targets.default]
description = "SMU Phase-1 SEP=0 cocotb target — primary backend is VCS"
build_dir = "hw/sys/smu/dv/build/cocotb_block"

[targets.default.tools.vcs]
flags = [
  "-assert",
  "svaext",
]

[targets.default.tools.verilator]
flags = [
  "-Wno-BLKLOOPINIT",
  "+define+VERILATOR",
  "+define+ASSERTS_OFF",
]

# --- SV-UVM framework overlay (selected by `--framework uvm`; VCS via the shared native
# profile). Shares the DUT RTL recipe above; only the SV-UVM deltas live here. ONE tb_top module
# for both frameworks: +define+UVM (from the profile's [frameworks.uvm] overlay) switches
# tb/tb_top.sv from the ported cocotb shape to the self-contained SV-UVM shape, which
# `include`s uvm/tests/smu_tests.sv.
[frameworks.uvm]
description = "SMU SV-UVM smoke flow (VCS)"

[frameworks.uvm.build]
# The shared framework library and the VIP SV-UVM layers come from their owned ordered
# manifests, expanded in listed order AHEAD of this table's own incdirs/sources (dedup-merge)
# — never hand-copy library or VIP paths here. Compile order stays load-bearing and explicit:
# the generated filelist emits the expanded `sources` AFTER the bender filelist (DUT packages
# visible), then `top_file` last:
#   ocah_lib manifest -> ocah_jtag_vip manifest -> ocah_axi_vip manifest
#   (each: evidence base -> interface -> collateral -> UVM pkg)
#   -> TB collateral -> the embedded DTP's bench layer (dtp_tb_if, the generated
#      cross-trigger address map, dtp_env_pkg) -> smu_tb_if -> smu_env_pkg
#   -> smu_seq_lib_pkg -> tb_top.sv
# SMU integrates DTP, so the SMU bench checks the embedded DTP with the DTP bench's own
# reference models, TAP checker, and scoreboard (dtp_env_pkg); the AXI VIP manifest is
# there because dtp_env_pkg imports its package. smu_env_pkg compiles before
# smu_seq_lib_pkg: the scenario virtual sequences run on the smu_virtual_sequencer the env
# package declares.
source_lists = [
  "hw/common/dv/vip/ocah_lib/uvm/sources.toml",
  "hw/common/dv/vip/ocah_jtag_vip/uvm/sources.toml",
  "hw/common/dv/vip/ocah_axi_vip/uvm/sources.toml",
]
filelist = "hw/sys/smu/dv/build/uvm_block/smu_block_uvm_compile.f"
bender_filelist = "hw/sys/smu/dv/build/uvm_block/smu_block_uvm_bender.f"
work_dir = "hw/sys/smu/dv/build/uvm_block"
incdirs = [
  "hw/sys/smu/dv/tb",
  "hw/common/assert",
  "hw/sys/dtp/dv/uvm/env",
  "hw/sys/smu/dv/uvm/env",
  "hw/sys/smu/dv/uvm/seq_lib",
  "hw/sys/smu/dv/uvm/tests",
]
# This list REPLACES the cocotb [build].sources list; the AXI VIP interface and
# struct bridge arrive through the ocah_axi_vip manifest above, so only the
# coverage modules are repeated here.
sources = [
  # The same functional-coverage modules the [build] sources list carries.
  "hw/sys/smu/dv/cov/sv/smu_boot_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_xbar_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_rst_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_lc_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_dtp_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_ext_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_clkstop_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_dbg_fcov.sv",
  "hw/sys/smu/dv/cov/sv/smu_nosep_fcov.sv",
  # The embedded DTP's bench layer: its three TB interface partitions (the reference
  # models and the TAP checker read the DTP observables through them; dtp_env binds
  # all three), the generated cross-trigger port address map dtp_types reads (the
  # Bender DUT layer carries only the regblock), and the DTP environment package.
  "hw/sys/dtp/dv/tb/dtp_tb_if.sv",
  "hw/sys/dtp/dv/tb/dtp_scan_if.sv",
  "hw/sys/dtp/dv/tb/dtp_xtrig_if.sv",
  "hw/ip/cross_trigger/cross_trigger_port/regs/gen/sv/cross_trigger_port_addrmap_pkg.sv",
  "hw/sys/dtp/dv/uvm/env/dtp_env_pkg.sv",
  # The SMU bench.
  "hw/sys/smu/dv/tb/smu_tb_if.sv",
  "hw/sys/smu/dv/uvm/env/smu_env_pkg.sv",
  "hw/sys/smu/dv/uvm/seq_lib/smu_seq_lib_pkg.sv",
]

[frameworks.uvm.sim]
args = ["+UVM_VERBOSITY=UVM_MEDIUM"]

[frameworks.uvm.targets.default]
description = "SMU SV-UVM default target"
build_dir = "hw/sys/smu/dv/build/uvm_block"
# The bare `UVM` define (selects the SV-UVM shape of the shared tb_top.sv) comes from the
# native profile's [frameworks.uvm] overlay — no per-DUT copy.
