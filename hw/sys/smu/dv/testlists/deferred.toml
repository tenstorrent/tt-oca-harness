# Deferred / universe catalog — NOT included by testlists/all.toml.
# Full stream narrative (OUT / deferred): docs/SMU_VPLAN.md Appendix A
# Master P1/P2 plan: docs/SMU_VPLAN.md
# Phase-1 executable set: docs/SMU_OSS_VPLAN_PHASE1.md
# Result-reporting policy: docs/SMU_VPLAN.md §13
#
# Ownership:
#   sep / interop / SEP=1 fabric matrix → SEP=1 colleague track
#   depth / toggle / modeled protocol → Phase-2 or child OSS SMC/SEP TBs
#
# These entries preserve names for handoff; test bodies are not Phase-1 scope.
#
# REPORTING POLICY: nothing in this file is enrolled in testlists/all.toml,
# is never run by the sep0_all / wrapper regressions, and MUST NOT be counted
# or reported as a passing result. Each section banner below records the
# blocker or plan status (`BLOCKER:` / `PLANNED:`), so blocked tests retain
# their blocker details next to the test names.

# ----- SEP=1 real SEP under SMU -----
# BLOCKER: real SEP RTL boots under `--dut smu_wrapper` target
# `compile_smu_chiplet_sep_rtl` (boot-ROM -> ICCM execution proven), but the
# SEP external-AXI console/pass-marker path stalls inside
# `sep_system_peripherals` — the firmware store to 0x8000_0000 never exits the
# SMN-outbound port, so firmware-driven SEP tests cannot report deterministic
# pass/fail. Owner: SEP=1 track (docs/SMU_VPLAN.md Appendix A.1). Do not
# enroll until the console-path stall is fixed.
