# ----- Real SMC/SEP interop -----
# BLOCKER: two independent blockers gate real interop pass claims:
#   1. SEP mailbox demux/select-to-port mapping — SMC-to-SEP mailbox AW/W
#      reaches `sep_system_peripherals.mailbox_axil_req` at 0x10A00800 but the
#      AXI-Lite mailbox returns SLVERR, routes to the outbound slave-port probe,
#      and never asserts FIFO push (sep_mailbox_b_err=1, sep_mailbox_push=0).
#      RTL fix needed in the SEP mailbox integration; see
#      dv/smu/tb/doc/smu_vplan.md "Known blockers".
#   2. SEP console/pass-marker path — same as the SEP=1 section above.
# No mailbox challenge-response pass may be claimed until both SMC and SEP
# sides complete deterministically. Tests tagged `modeled` used a SEP-facing
