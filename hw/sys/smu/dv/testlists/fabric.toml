schema_version = 1

# SMU Phase-1 (SEP=0) — fabric / external SMN path.
# With SEP=0 there is no 3x3 smu_axi_xbar; coverage is SMC<->ext ID path,
# unmapped/DECERR, SEP-OTP err-slv, ATOP reject, and global-base remap.
# Executable contract: enrolled groups in this file / testlists/all.toml

# smc_cpu_traffic_ext_axi_test is defined in smc.toml (also in fabric group).

[[tests]]
name = "smu_axi_external_port_connectivity_test"
module = "smu_axi_external_port_connectivity_test"
seed = 1
timeout_sec = 1800
tags = ["fabric", "phase1"]
run_modes = ["fabric"]

