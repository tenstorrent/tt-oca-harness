schema_version = 1

# The residual `--dut smu` leaves. The rest of this stream was migrated onto
# --dut smu_wrapper and retired; testlists/all.toml records why these two
# stayed.
# Executable contract: enrolled groups in this file / testlists/all.toml

[[tests]]
name = "smu_dtp_jtag2axi_abort_mid_op_test"
module = "smu_dtp_jtag2axi_abort_mid_op_test"
seed = 1
timeout_sec = 1800
tags = ["dtp", "jtag2axi", "tier_c", "depth"]
run_modes = ["dtp"]

# One VPLAN scenario, two implementations: cocotb module vs SV-UVM class
# (+UVM_TESTNAME). This binding map is why the leaf stays on this DUT: the
# SV-UVM realization's harness is the `UVM` shape of tb/tb_top.sv, which is
# this DUT, and this is the only scenario bound to it (uvm/tests/ carries
# smu_dtp_jtag_smoke_test.svh and its base). Retiring the entry took
# `--dut smu --framework uvm --items smu_dtp_jtag_smoke_test` with it. The
# cocotb side of the same scenario also runs on smu_wrapper, where it is
# enrolled in migrated_dtp; that copy is the one the regression scores.
[[tests]]
name = "smu_dtp_jtag_smoke_test"
module = { cocotb = "smu_dtp_jtag_smoke_test", uvm = "smu_dtp_jtag_smoke_test" }
seed = 1
timeout_sec = 1800
tags = ["dtp", "smoke", "phase1"]
run_modes = ["dtp", "smoke"]
