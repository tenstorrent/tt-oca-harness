schema_version = 1

# SMC↔SEP / SMC↔DTP interop catalog — NOT included by testlists/all.toml.
# Commercial anchors: oca_smu SMU_INTEROP_VPLAN.md + Blocked_SEP_Exec list.
# Name registry: deferred.toml. See docs/SMU_VPLAN.md Appendix A.2.
#
# Real dual-firmware interop stays behind #3582 IFU + mailbox blockers.
# `modeled` names are SEP-facing BFM protocol shapers only (§13 config class).

includes = ["deferred.toml"]

[[groups]]
name = "interop_real_blocked"
tests = [
  "smc_sep_interoperability_test",
  "smc_sep_xbar_test",
  "smu_bidirect_test",
  "smc_sep_interoperability_strict_test",
  "smc_sep_xbar_strict_test",
  "smu_bidirect_strict_test",
  "smu_smc_stall_sep_test",
]

[[groups]]
name = "interop_modeled"
tests = [
  "smc_sep_interaction_test",
  "smc_sep_multi_cmd_test",
  "smc_sep_service_req_test",
  "smc_sep_error_recovery_test",
  "smc_sep_seq_validation_test",
  "smc_sep_notification_test",
  "smc_sep_fw_request_test",
  "smc_sep_bidirectional_test",
]

