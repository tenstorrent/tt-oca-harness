schema_version = 1

# The SEP=0 composition leaves. Each one proves something that only exists
# when smu elaborates with SEP=0: the gen_no_sep arm (direct ID converters,
# no crossbar), the SEP aperture and lifecycle tie-offs, and the DTP built
# without its SEP debug slice. The production wrapper on --dut smu elaborates
# SEP=1, so these run here on the bare smu #(.SEP(0)) bench.

[[tests]]
name = "smu_axi_xbar_structure_test"
module = "smu_axi_xbar_structure_test"
seed = 1
timeout_sec = 1800
tags = ["fabric", "no_sep", "tier_c", "depth"]
run_modes = ["fabric"]

[[tests]]
name = "smu_axi_external_port_connectivity_test"
module = "smu_axi_external_port_connectivity_test"
seed = 1
timeout_sec = 1800
tags = ["fabric", "no_sep"]
run_modes = ["fabric"]

[[tests]]
name = "smu_no_sep_configuration_test"
module = "smu_no_sep_configuration_test"
seed = 1
timeout_sec = 1800
tags = ["smc", "no_sep", "smoke"]
run_modes = ["smc"]

[[tests]]
name = "smu_smc_security_demote_pm_test"
module = "smu_smc_security_demote_pm_test"
seed = 1
timeout_sec = 1800
tags = ["smc", "no_sep", "security"]
run_modes = ["smc"]

[[tests]]
name = "smu_dtp_ptap_otp_instr_scan_test"
module = "smu_dtp_ptap_otp_instr_scan_test"
seed = 1
timeout_sec = 1800
tags = ["dtp", "jtag", "otp", "no_sep", "tier_c", "depth"]
run_modes = ["dtp"]
