schema_version = 1

# Residual testlist for --dut smu, the bare `smu #(.SEP(0))` DUT.
#
# This file used to carry the whole Phase-1 SEP=0 regression: 56 leaves across
# smc.toml / dtp.toml / fabric.toml and fifteen overlapping phase and rank
# groups. All of it now runs on --dut smu_wrapper, which instantiates the same
# smu with the open-source IP integration attached, so the duplicates were
# retired rather than maintained twice. testlists/wrapper.toml is the SMU
# regression; its `all` group is the whole of it.
#
# Two leaves stayed, neither because of a defect.
# smu_dtp_jtag2axi_abort_mid_op_test aborts an OTP operation mid-flight, so it
# has to observe SINGLE_OP report BUSY first. That is free here, where smu.sv
# re-exposes the eFuse interface and the TB leaves it unterminated so the
# operation hangs BUSY forever. On smu_wrapper the real SMC eFuse model answers
# in tens of clk_smu, against a 39-bit DR shift -- the operation is always
# finished before any JTAG capture completes, so the window does not exist.
# Giving it one needs a stallable eFuse hook in the wrapper TB, which is a
# testbench feature rather than a fix; until then the bare DUT hosts this leaf
# and this file exists for it.
#
# smu_dtp_jtag_smoke_test stays for a different reason: it is the one VPLAN
# scenario with an SV-UVM implementation as well as a cocotb one, and the
# SV-UVM harness is the `UVM` shape of tb/tb_top.sv -- this DUT. Its testlist
# entry carries the `module = { cocotb, uvm }` binding map that
# `--dut smu --framework uvm` resolves through. The cocotb side also runs on
# smu_wrapper, enrolled in migrated_dtp, and that is the copy the regression
# scores; this entry exists so the SV-UVM view keeps a scenario to run.
#
# Baseline at retirement: --dut smu --items all 56/56 PASS, and every retired
# leaf green on smu_wrapper (migrated_fabric 14/14, migrated_smc 12/12,
# migrated_dtp 26/27, the one red being RTL issue #1599 and DUT-independent).

includes = ["dtp.toml"]

[[groups]]
name = "all"
tests = [
  "smu_dtp_jtag2axi_abort_mid_op_test",
  "smu_dtp_jtag_smoke_test",
]

# .github/workflows/sim.yml runs one fixed tier -- `--items smoke` -- for every
# DUT in its matrix, so this DUT needs the group to exist by that name. It
# carries no firmware, which matters: the hosted runner in .github/actions/dv-run installs
# Verilator and nothing else, so a group needing the RISC-V toolchain cannot
# run there. It is also the scenario the SV-UVM view binds to, so
# `--framework uvm --items smoke --skip-unimplemented` still selects something.
[[groups]]
name = "all"
# Every testcase this DUT defines. Sign-off asks for one group that is
# the whole enrolled set, so a reviewer can run it without knowing which
# feature lists exist.
