  "+sep_dtcm_hex={repo_root}/hw/sys/smu/dv/build/firmware/preloads/sep_dtcm_default.hex",
  # +skip_fuse_sense: no OTP/eFuse data is read.
  "+skip_fuse_sense",
  "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
