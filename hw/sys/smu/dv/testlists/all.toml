schema_version = 1

# Aggregate Phase-1 (SEP=0) testlist for --dut smu.
# Executable contract: docs/SMU_OSS_VPLAN_PHASE1.md
# SEP=1 / interop / depth inventory: testlists/deferred.toml (not included).
# Result-reporting policy: docs/SMU_VPLAN.md §13.
# Only groups in this file (and testlists/wrapper.toml for --dut smu_wrapper)
# produce reportable passing results; deferred.toml names never do.

includes = ["smc.toml", "dtp.toml", "fabric.toml"]

[[groups]]
name = "smoke"
tests = [
    "smu_smc_smoke_test",
    "smu_dtp_jtag_smoke_test",
    "smu_no_sep_configuration_test",
    "smu_ext_boot_seq_gate_test",
]

