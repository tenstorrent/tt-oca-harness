[[groups]]
name = "smoke"
# The scheduled CI set for pull requests: sim.yml runs `--items smoke` for
# every DUT. Sized like dtp (2 leaves) and sep (1) rather than standing in for
# a regression. The nightly and weekly tiers schedule `sep0_all` instead, so
# this group is only the gate.
#
# smu_ext_boot_seq_gate_test stays, and gains the `smoke` tag it was missing.
# It looks like the one to drop -- it never carried the tag -- but `sep0_all`
# does not contain it, so this group is its only scheduled home and dropping
# it would have taken it out of CI entirely.
tests = [
    "smu_smc_smoke_test",
    "smu_dtp_jtag_smoke_test",
    "smu_no_sep_configuration_test",
    "smu_ext_boot_seq_gate_test",
]
expected_count = 4

