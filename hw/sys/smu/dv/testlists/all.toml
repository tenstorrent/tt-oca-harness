schema_version = 1

# Aggregate Phase-1 (SEP=0) testlist for --dut smu.
# Executable contract: enrolled groups in this file / testlists/all.toml
# The SEP=1 / interop / depth inventory is not ported.
# Result-reporting policy: only enrolled groups report PASS.
# Only groups in this file (and testlists/wrapper.toml for --dut smu_wrapper)
# produce reportable passing results.

includes = ["smc.toml", "dtp.toml", "fabric.toml"]

[[groups]]
name = "all"
