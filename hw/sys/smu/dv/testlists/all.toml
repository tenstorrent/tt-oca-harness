  "+rom_hex=smu_sep_arm.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=rom_no_tcm_preload_mem_init.vmem",
  "+sep_no_tcm_preload",
  "+sep_sym=rom_no_tcm_preload_mem_init.rom_only.sym",
  # +skip_fuse_sense: SEP firmware/probe claim; no OTP/eFuse data is read.
  "+skip_fuse_sense",
  "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
  "+sep_shadow_reg_preload={repo_root}/hw/sys/smu/dv/assets/default_sep_efuse_shadow_reg.preload",
]

# SEP OpenTitan SPI host transfer, graded at the SMC LSIO pads. The image runs a
# command / address / receive sequence with no flash model and no pad select.
# Every clk_smu cycle, the sequence checks that the SMC SPI pins carry the host
# request and return the pad data lanes to the host, as a DV-owned pin table
# with a spec citation per row states. It counts the SCK rises the firmware's byte
# counts give, at the pads and at the host, checks the CS# framing, the output
# enables and the transmit bytes, drives a seeded word on the receive pad and
# grades the RXDATA word the host pops, and requires the pads to stay still
# while the host is idle. Eight per-stage fail loops name where the firmware
# stalled.
[[tests]]
name = "smu_sep_spi_test"
module = "smu_sep_spi_test"
target = "compile_smu_chiplet"
firmware = { name = "sep_smu_spi", mode = "sep_dv_fw" }
seed = 1
timeout_sec = 1800
tags = ["firmware", "sep", "real_rtl", "real_fw", "spi"]
run_modes = ["sep_rtl"]
args = [
  "+rom_hex=smu_sep_arm.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=smu_sep_boot_rom.hex",
  "+sep_itcm_hex=sep_smu_spi.itcm.hex",
  "+sep_dtcm_hex=sep_smu_spi.dtcm.hex",
  "+sep_sym=sep_smu_spi.tcm.sym",
  # +skip_fuse_sense: SEP firmware/probe claim; no OTP/eFuse data is read.
