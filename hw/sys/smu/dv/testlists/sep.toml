schema_version = 1

# SEP=1 catalog for `--dut smu` / handoff — NOT included by testlists/all.toml.
# Mirror of commercial oca_smu gates (testlist_smu_chiplet.yaml):
#   SMU_Dev_with_SEP_Regression          → group sep_probe
#   Manual_SMU_Blocked_SEP_Exec_Regression → group sep_exec_blocked
#
# Bodies live in deferred.toml (name registry). This file only groups them for
# listing / future enrollment. See docs/SMU_VPLAN.md Appendix A.1–A.1b.
# Result-reporting: nothing here is reportable as PASS until enrolled into
# all.toml or wrapper.toml green groups (SMU_VPLAN.md §13).

includes = ["deferred.toml"]

[[groups]]
name = "sep_exec_blocked"
tests = [
  "smu_sep_smoke_test",
  "smu_sep_sanity_test",
  "smu_sep_spi_test",
  "smu_sep_modules_test",
  "smu_sep_dma_test",
  "smu_sep_efuse_test",
  "smu_sep_wdt_test",
  "smu_sep_aes_test",
  "smu_sep_otbn_test",
  "smu_sep_wdt_strict_test",
  "smu_sep_aes_strict_test",
  "smu_sep_otbn_strict_test",
  "smu_cla_sep_cpu_debug_control_test",
]

