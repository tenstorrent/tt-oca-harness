# OTBN CSR reachability, a narrow claim: the image writes five OTBN
# CSRs and parks, which proves those writes cross the SEP outbound fabric
# (BlockByDefault=1) without a store access fault, since a filtered write would
# trap and never reach the pass loop. It proves nothing functional about OTBN --
# there is no IMEM/DMEM load and no EXECUTE, and the firmware's own pass/fail
# branch keys off a volatile int nothing assigns, so the fail branch is
# unreachable. See the seq docstring. This image needs no entropy.
[[tests]]
name = "smu_sep_otbn_test"
module = "smu_sep_otbn_test"
target = "compile_smu_chiplet"
firmware = { name = "sep_smu_otbn", mode = "sep_dv_fw" }
seed = 1
timeout_sec = 3600
tags = ["firmware", "sep", "real_rtl", "real_fw", "crypto"]
run_modes = ["sep_rtl"]
args = [
  "+rom_hex=smu_sep_arm.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=smu_sep_boot_rom.hex",
  "+sep_itcm_hex=sep_smu_otbn.itcm.hex",
  "+sep_dtcm_hex=sep_smu_otbn.dtcm.hex",
  "+sep_sym=sep_smu_otbn.tcm.sym",
  # +skip_fuse_sense: SEP firmware/probe claim; no OTP/eFuse data is read.
  "+skip_fuse_sense",
  "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
  "+sep_shadow_reg_preload={repo_root}/hw/sys/smu/dv/assets/default_sep_efuse_shadow_reg.preload",
]

# ext_in-driven SEP + SMC routing: the three-party test the sys-inbound path
# exists for. The external master is played by the sequence on the flat ext_in_*
# pins tb_wrapper_top.sv exposes. Protocol and every address
# come from the firmwares' shared header
# hw/sys/sep/dv/fw/tests/common/smu_sep_ext_axi_protocol.h.
# The sequence re-vectors the SMC cores to smu_sep_ext_axi_smc_entry, read from
# the built .sram.sym, over JTAG2AXI.
#
# Enrolled in sep_smc_sram_blocked. The preload is handled: smc_4core_cpu
# zeroes the scratch RAM at boot to establish valid ECC, and
# tb_wrapper_top.sv holds that FSM off whenever +smc_scratch_ram_hex
# supplies an image, so the image survives.
#
# The core reaches the image carrying the ROM's state (mtvec among it), so its
# first trap vectors to address 0. common/seq_lib/smc_cpu_revector.py instead
# performs what the firmware's header calls the SEP-driven or cocotb-backdoor
# boot: RESET_VECTOR on all four cores and a tile-reset pulse over the DTP's
# JTAG2AXI, the way hw/sys/smc/dv/cocotb/seq_lib/smc_cpu_vip_utils.py does it
# over its CSR agent. The cluster never drains, so the RESET_TIMEOUT force in
# smc_cpu_ctrl_wrap is what applies the reset.
#
# SMC scratch RAM is CPU-private (see smu_sep_smc_xbar_test), so no fetch
# follows the release and the group never reports PASS.
[[tests]]
name = "smu_sep_ext_axi_test"
module = "smu_sep_ext_axi_test"
target = "compile_smu_chiplet"
firmware = { name = "sep_smu_ext_axi", mode = "sep_dv_fw_smu_sep_ext_axi" }
seed = 1
timeout_sec = 3600
tags = ["firmware", "sep", "smc", "real_rtl", "real_fw", "interop"]
run_modes = ["sep_rtl"]
args = [
  "+rom_hex=smu_sep_arm.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=smu_sep_boot_rom.hex",
  "+sep_itcm_hex=sep_smu_ext_axi.itcm.hex",
  "+sep_dtcm_hex=sep_smu_ext_axi.dtcm.hex",
  "+sep_sym=sep_smu_ext_axi.tcm.sym",
  "+smc_scratch_ram_hex=smu_sep_ext_axi.ecc.hex",
  "+smc_sym=smu_sep_ext_axi.sram.sym",
  # +skip_fuse_sense: SEP firmware/probe claim; no OTP/eFuse data is read.
  "+skip_fuse_sense",
  "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
  "+sep_shadow_reg_preload={repo_root}/hw/sys/smu/dv/assets/default_sep_efuse_shadow_reg.preload",
]

