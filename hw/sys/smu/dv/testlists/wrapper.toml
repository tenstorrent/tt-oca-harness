# Firmware-driven SEP lifecycle flow. The SEP LCC is the source of the
# chiplet's lifecycle posture. Three consumers act on it (lc_state -> SMC,
# dbg_disable -> DTP, feat_ctrl). The firmware drives the DEMOTE registers
# and the sequence checks the posture moved at the consumers, not only
# inside the register block. The write-once DEMOTE lock keeps the demote
# stages non-vacuous.
[[tests]]
name = "smu_sep_lcc_flow_test"
module = "smu_sep_lcc_flow_test"
