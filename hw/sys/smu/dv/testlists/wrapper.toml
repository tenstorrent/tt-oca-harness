# SEP AP/STEE output-remap programming. The firmware is a stimulus generator,
# not self-checking: its writes are write-only so its fail path is provably dead
# and the linker drops the symbol. The verdict is the testbench's golden compare
# of the remap table, gated on the offsets having changed during the run.
#
# The firmware emits no fence between its remap stores and the tail jump
# into the pass loop. The sequence drains for SETTLE_CYCLES before sampling
# the remap table, then compares both region-0 offsets against golden.
[[tests]]
name = "smu_sep_remap_test"
module = "smu_sep_remap_test"
target = "compile_smu_chiplet"
firmware = { name = "sep_smu_remap", mode = "sep_dv_fw" }
seed = 1
timeout_sec = 1800
tags = ["firmware", "sep", "real_rtl", "real_fw", "fabric"]
run_modes = ["sep_rtl"]
args = [
  "+rom_hex=smu_sep_arm.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=smu_sep_boot_rom.hex",
  "+sep_itcm_hex=sep_smu_remap.itcm.hex",
  "+sep_dtcm_hex=sep_smu_remap.dtcm.hex",
  "+sep_sym=sep_smu_remap.tcm.sym",
  # +skip_fuse_sense: SEP firmware/probe claim; no OTP/eFuse data is read.
  "+skip_fuse_sense",
  "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
  "+sep_shadow_reg_preload={repo_root}/hw/sys/smu/dv/assets/default_sep_efuse_shadow_reg.preload",
]

# The SEP loads its own TCM: no testbench preload at all. This is the one image
# in the tree that boots from ROM and uses secure DMA to move code into ICCM, so
# it covers the step the TCM backdoor hides. The boot ROM is loaded exactly as
# the OSS SEP DV testbench loads it -- +sep_boot_rom_hex into u_sep_boot_rom.mem
# -- and +sep_no_tcm_preload leaves ICCM/DCCM zeroed at reset.
[[tests]]
name = "smu_sep_rom_tcm_load_test"
module = "smu_sep_rom_tcm_load_test"
target = "compile_smu_chiplet"
firmware = { name = "rom_no_tcm_preload_mem_init", mode = "sep_dv_fw_rom_only" }
seed = 1
timeout_sec = 1800
tags = ["firmware", "sep", "real_rtl", "real_fw", "boot"]
run_modes = ["sep_rtl"]
args = [
  "+rom_hex=smu_sep_arm.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=rom_no_tcm_preload_mem_init.vmem",
  "+sep_no_tcm_preload",
  "+sep_sym=rom_no_tcm_preload_mem_init.rom_only.sym",
  # +skip_fuse_sense: SEP firmware/probe claim; no OTP/eFuse data is read.
