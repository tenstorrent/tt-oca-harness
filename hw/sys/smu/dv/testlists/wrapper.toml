schema_version = 1

# The SMU regression, run via `run_dv.py --dut smu`. One compile profile,
# compile_smu_chiplet in smu_sim_cfg.toml: the wrapper with the real SEP
# subsystem and EL2 CPU, shared by every leaf, so a regression pays one
# Verilator build and coverage merges across the whole selection.
# Result-reporting policy: only enrolled groups report PASS.
# Run modes: `sep_rtl` (+skip_fuse_sense, shadow preloads) and
# `sep_rtl_fuse_sense` (real SMC and SEP fuse sense).
#
# `all` here is the whole SMU regression. smu_wrapper is the same
# smu with the open-source IP integration attached, so there is one catalog.
# testlists/all.toml holds the --dut smu_block leaves: the SEP=0 composition
# proofs (testlists/nosep.toml), which need smu #(.SEP(0)), and the two leaves
# recorded there that cannot run on the wrapper.
#
# The SEP=1 profile is enrolled in `smoke`: the EL2 ICCM/DCCM macros come
# from the upstream VeeR mem_lib.sv already on the Bender closure, and
# tb_wrapper_top.sv backdoor-loads +sep_itcm_hex / +sep_dtcm_hex into them, so
# `smu_sep_smoke_test` reaches real boot readiness (boot-ROM fetch → ICCM
# execution → DCCM stores) instead of trapping in a zeroed ICCM.

[[tests]]
name = "smu_wrapper_elaboration_sep_rtl_test"
module = "smu_wrapper_elaboration_test"
target = "compile_smu_chiplet"
firmware = { name = "elaboration", mode = "elaboration" }
seed = 1
timeout_sec = 1200
tags = ["build", "smoke", "sep", "real_rtl"]
run_modes = ["sep_rtl"]
args = [
  "+expected_sep=1",
  "+rom_hex=smc_rom_default.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=sep_boot_rom_default.hex",
  "+sep_itcm_hex=sep_itcm_default.hex",
  "+sep_dtcm_hex=sep_dtcm_default.hex",
  # +skip_fuse_sense: elaboration claim; no eFuse word is read.
  "+skip_fuse_sense",
  "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
  "+sep_shadow_reg_preload={repo_root}/hw/sys/smu/dv/assets/default_sep_efuse_shadow_reg.preload",
]

