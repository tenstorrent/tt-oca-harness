# SEP-driven SMC bring-up plus the SEP<->SMC crossbar handshake. The SMC does
# not boot itself here: its image is placed in SMC SRAM by the testbench
# (+smc_scratch_ram_hex, the 72-bit .ecc.hex) and the SEP polls SRAM[0] for the
# cookie, then re-vectors all four cores and pulses their reset. The sequence
# reconciles the built SMC image's entry and cookie against the protocol
# constants first, so a relink fails loudly instead of hanging in bring-up.
#
# Enrolled in sep_smc_sram_blocked. Blocked on SMC SRAM visibility, not on
# this test. Everything
# up to the cookie poll works: the image contract reconciles (entry 0xC00601B2,
# cookie 0x41014081), the testbench reports "stripe-loaded scratch
# smc_sep_xbar.ecc.hex", and the SEP reaches its poll. But the SEP then spins at
# main+0xda reading 0x4006_0000 and never sees the cookie, ~97% of 33055
# retires. SEP->SMC itself is fine: smu_sep_bidirect_test read/write-checks SMC
# CPU_CTRL scratch over the same path, and this image's own scratch12 write sits
# right after the loop. The difference is the target -- SMC scratch RAM is on
# the CPU-private memory interface: scratch_ram_intf_req_o originates in
# smc_4core_cpu.sv / smc_cpu_wrapper.sv and leaves smc.sv as a port with the
# memory macros hanging off it inside smc_ip_integration. smc.sv exposes no AXI
# aperture onto that RAM, so a master arriving through sys-inbound has no path
# to it: the image loads ("bank0 nonzero=41") and the SEP still spins on the
# cookie read. sep_smc_interop and sep_smc_mbox_irq use the same
# sep_smc_bringup_from_sram helper and are blocked identically.
[[tests]]
name = "smu_sep_smc_xbar_test"
module = "smu_sep_smc_xbar_test"
target = "compile_smu_chiplet_sep_rtl"
firmware = { name = "sep_smc_xbar", mode = "sep_dv_fw" }
seed = 1
timeout_sec = 1800
tags = ["firmware", "sep", "smc", "real_rtl", "real_fw", "interop"]
run_modes = ["sep_rtl"]
args = [
  "+rom_hex=smu_sep_arm.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=smu_sep_boot_rom.hex",
  "+sep_itcm_hex=sep_smc_xbar.itcm.hex",
  "+sep_dtcm_hex=sep_smc_xbar.dtcm.hex",
  "+sep_sym=sep_smc_xbar.tcm.sym",
  "+smc_scratch_ram_hex=smc_sep_xbar.ecc.hex",
  "+smc_sym=smc_sep_xbar.sram.sym",
]

