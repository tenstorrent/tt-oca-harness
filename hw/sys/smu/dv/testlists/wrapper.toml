# SEP lifecycle flow: real eFuse sense, then firmware-driven demotes. The SEP
# LCC is the source of the chiplet's lifecycle posture. Three consumers act on
# it (lc_state -> SMC, dbg_disable -> DTP, feat_ctrl). The sequence samples the
# consumers before the SEP sense delivers the LC word and after
# sep_fuse_sense_done_o, then the firmware drives the DEMOTE registers and the
# sequence checks the posture moved at the consumers, not only inside the
# register block. The write-once DEMOTE lock keeps the demote stages
# non-vacuous.
[[tests]]
name = "smu_sep_lcc_flow_test"
module = "smu_sep_lcc_flow_test"
target = "compile_smu_chiplet"
firmware = { name = "sep_smu_lcc_flow", mode = "sep_dv_fw" }
seed = 1
timeout_sec = 1800
tags = ["firmware", "sep", "smc", "dtp", "real_rtl", "real_fw", "lifecycle"]
run_modes = ["sep_rtl"]
args = [
  "+rom_hex=smu_sep_arm.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  # The SEP sense reads this image; its LC word (all-zero, raw 0x0) is TEST_DEV.
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=smu_sep_boot_rom.hex",
  "+sep_itcm_hex=sep_smu_lcc_flow.itcm.hex",
  "+sep_dtcm_hex=sep_smu_lcc_flow.dtcm.hex",
  "+sep_sym=sep_smu_lcc_flow.tcm.sym",
  # Real fuse sense (no +skip_fuse_sense): the lc_state / dbg_disable posture the
  # checks observe is the SEP eFuse controller's own sense of +sep_efuse_hex.
]

