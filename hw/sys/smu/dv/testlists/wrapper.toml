# SEP entropy stack brought up by firmware, with entropy proven to reach the
# DRBG. Uses the +esrc_noise_force exception documented in tb_wrapper_top.sv:
# the ESRC ring oscillators do not self-oscillate under Verilator, so the raw
# noise is driven at the first node of the chain and everything downstream is
# the real RTL. This is the prerequisite the AES and OTBN anchors wait on.
[[tests]]
name = "smu_sep_entropy_test"
module = "smu_sep_entropy_test"
target = "compile_smu_chiplet"
firmware = { name = "sep_smu_entropy_bringup", mode = "sep_dv_fw" }
seed = 1
timeout_sec = 3600
tags = ["firmware", "sep", "real_rtl", "real_fw", "entropy", "crypto"]
run_modes = ["sep_rtl"]
args = [
  "+rom_hex=smu_sep_arm.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=smu_sep_boot_rom.hex",
  "+sep_itcm_hex=sep_smu_entropy_bringup.itcm.hex",
  "+sep_dtcm_hex=sep_smu_entropy_bringup.dtcm.hex",
  "+sep_sym=sep_smu_entropy_bringup.tcm.sym",
  "+esrc_noise_force",
  # +skip_fuse_sense: SEP firmware/probe claim; no OTP/eFuse data is read.
  "+skip_fuse_sense",
  "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
  "+sep_shadow_reg_preload={repo_root}/hw/sys/smu/dv/assets/default_sep_efuse_shadow_reg.preload",
]

