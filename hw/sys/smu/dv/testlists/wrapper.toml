schema_version = 1

# Production-wrapper baseline catalog, run via `run_dv.py --dut smu_wrapper`.
# Independent of the bare-smu all.toml catalog. Compile profiles are the
# [targets.*] tables in smu_wrapper_sim_cfg.toml selected per test.
# Result-reporting policy: only enrolled groups report PASS.
# Config classes here: `no_sep` run mode = no-SEP; `sep_rtl` = real SEP RTL.
#
# SIGNOFF NOTE: wrapper `all` / `smoke` is the production-wrapper merge-gate
# only. It is NOT a substitute for bare `--dut smu --items sep0_all`.
# Shared name `smu_smc_smoke_test` must be tagged WRAPPER vs BARE in logs.
#
# Commercial mirror (oca_smu chiplet testlist YAML naming):
#   SMU_Dev_with_SEP_Regression          = probe/connectivity (no CPU exec)
#   Manual_SMU_Blocked_SEP_Exec_Regression = needs real SEP fetch/retire
#
# The SEP=1 profile is enrolled in the merge gate: the EL2 ICCM/DCCM macros come
# from the upstream VeeR mem_lib.sv already on the Bender closure, and
# tb_wrapper_top.sv backdoor-loads +sep_itcm_hex / +sep_dtcm_hex into them, so
# `smu_sep_smoke_test` reaches real boot readiness (boot-ROM fetch → ICCM
# execution → DCCM stores) instead of trapping in a zeroed ICCM.

[[tests]]
name = "smu_wrapper_elaboration_no_sep_test"
module = "smu_wrapper_elaboration_test"
target = "compile_smu_chiplet_no_sep"
firmware = { name = "elaboration", mode = "elaboration" }
seed = 1
timeout_sec = 600
tags = ["build", "smoke", "no_sep"]
run_modes = ["no_sep"]
args = [
  "+expected_sep=0",
  "+rom_hex=smc_rom_default.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
]

[[tests]]
name = "smu_wrapper_elaboration_sep_rtl_test"
module = "smu_wrapper_elaboration_test"
target = "compile_smu_chiplet_sep_rtl"
firmware = { name = "elaboration", mode = "elaboration" }
seed = 1
timeout_sec = 1200
tags = ["build", "smoke", "sep", "real_rtl"]
run_modes = ["sep_rtl"]
args = [
  "+expected_sep=1",
  "+rom_hex=smc_rom_default.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=sep_boot_rom_default.hex",
  "+sep_itcm_hex=sep_itcm_default.hex",
  "+sep_dtcm_hex=sep_dtcm_default.hex",
]

[[tests]]
