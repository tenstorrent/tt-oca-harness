# SEP-driven SMC bring-up plus the SEP<->SMC crossbar handshake. The SMC does
# not boot itself here: its image is placed in SMC SRAM by the testbench
# (+smc_scratch_ram_hex, the 72-bit .ecc.hex) and the SEP polls SRAM[0] for the
# cookie, then re-vectors all four cores and pulses their reset. The sequence
# reconciles the built SMC image's entry and cookie against the protocol
# constants first, so a relink fails loudly instead of hanging in bring-up.
#
# Enrolled in sep_smc_sram_blocked. SMC scratch RAM is on the CPU-private
# memory interface: scratch_ram_intf_req_o originates in
# hw/sys/smc/rtl/smc_cpu/smc_4core_cpu.sv and smc_cpu_wrapper.sv and leaves
# smc.sv as a port, with the memory macros hanging off it inside
# smc_ip_integration. smc.sv exposes no AXI aperture onto that RAM, so a
# master arriving through sys-inbound has no path to it and the SEP's cookie
# poll never completes. smu_sep_ext_axi_test is blocked by the same limit.
[[tests]]
name = "smu_sep_smc_xbar_test"
module = "smu_sep_smc_xbar_test"
target = "compile_smu_chiplet"
firmware = { name = "sep_smc_xbar", mode = "sep_dv_fw_smc_sep_xbar" }
seed = 1
timeout_sec = 1800
tags = ["firmware", "sep", "smc", "real_rtl", "real_fw", "interop"]
run_modes = ["sep_rtl"]
args = [
  "+rom_hex=smu_sep_arm.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=smu_sep_boot_rom.hex",
  "+sep_itcm_hex=sep_smc_xbar.itcm.hex",
  "+sep_dtcm_hex=sep_smc_xbar.dtcm.hex",
  "+sep_sym=sep_smc_xbar.tcm.sym",
  "+smc_scratch_ram_hex=smc_sep_xbar.ecc.hex",
  "+smc_sym=smc_sep_xbar.sram.sym",
  # +skip_fuse_sense: SEP firmware/probe claim; no OTP/eFuse data is read.
  "+skip_fuse_sense",
  "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
  "+sep_shadow_reg_preload={repo_root}/hw/sys/smu/dv/assets/default_sep_efuse_shadow_reg.preload",
