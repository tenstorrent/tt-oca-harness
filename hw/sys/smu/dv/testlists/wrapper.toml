# Enrolled so the leaf stays selectable; it cannot pass on this DUT.
#
# smu_dtp_jtag2axi_abort_mid_op_test aborts an OTP op mid-flight, so it first
# has to see SINGLE_OP report BUSY. The block bench leaves the OTP interface
# unterminated and the op hangs BUSY, which makes that observable there. Here
# the real SMC eFuse model from smc_ip_integration answers, and status is
# already SUCCESS when the first poll shifts out.
#
# The window is not a tuning problem: one SINGLE_OP DR shift is 39 bits of TCK
# (~1.5us at the randomized JTAG periods) against an OTP that responds in tens
# of clk_smu, so the op finishes before any JTAG capture completes. A
# deep-pipeline SERIES read does not substitute -- SERIES_CTRL's status field
# reports the control transaction, not the data pipeline, and reads SUCCESS on
# both DUTs. Reaching this scenario needs a way to hold the OTP response off
# (a stallable eFuse model hook), which is a testbench feature.
[[groups]]
name = "needs_otp_stall"
tests = [
  "smu_dtp_jtag2axi_abort_mid_op_test",  # the real OTP model answers before the BUSY poll can capture it
]

# Runnable, not passing: the claim it checks is not met by the RTL as built.
#
# smu_cold_reset_async_assert_test holds every wrapper clock static and asserts
# rst_cold_ni, expecting the cold-stable and primary-reset outputs to fall
# without a clock edge (port_table.adoc: "Asynchronous assertion"). The SMC
# reset controller instead samples rst_cold_ni through a clk_ref_i deglitch
# shift register, so with the clocks stopped no output moves. The test stays
# here so the discrepancy is visible until the spec or the RTL settles it.
[[groups]]
name = "p0_pending"
tests = [
  "smu_cold_reset_async_assert_test",
]
expected_count = 1

