# TEST_DEV: debug is open here with a blank eFuse -- feat_ctrl is
# ~(sip_dis | sys_dis) in this state, so sip_debug is set without any demote --
# and a JTAG2AXI SINGLE_OP must reach the DTP->SMC debug AXI port. This is the
# permissive half; without it, 'no transaction' in the gated case could equally
# mean a broken TAP or a wrong scan payload. Note PROD would NOT work here: its
# feat_ctrl is zero except func_reserved until a demote opens the window, so
# PROD with a non-demoting payload has debug disabled just like PROD_END.
