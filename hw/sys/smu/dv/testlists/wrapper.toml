# SEP module touch-point matrix: AES, HMAC and KMAC stages run on-chip and the
# image parks in a per-stage terminal loop, so a failure names the module. The
# stage mask is compile-time; the test derives its watch set from the symbol
# table, so a stage compiled out is reported as not covered rather than passed.
#
# The AES stage needs entropy: OpenTitan AES reseeds its masking PRNG from
# crypto-EDN. The image calls sep_entropy_bringup() before that stage and
# parks in a separate entropy fail loop if it does not complete, so a missing
# prerequisite is not scored as an AES defect. +esrc_noise_force supplies the
# raw noise the ring oscillators cannot generate under Verilator -- the same
# exception hw/sys/sep/dv takes. HMAC and KMAC need no entropy.
[[tests]]
name = "smu_sep_modules_test"
module = "smu_sep_modules_test"
target = "compile_smu_chiplet_sep_rtl"
firmware = { name = "sep_smu_modules", mode = "sep_dv_fw" }
seed = 1
timeout_sec = 3600
tags = ["firmware", "sep", "real_rtl", "real_fw", "crypto"]
run_modes = ["sep_rtl"]
args = [
  "+rom_hex=smu_sep_arm.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=smu_sep_boot_rom.hex",
  "+sep_itcm_hex=sep_smu_modules.itcm.hex",
  "+sep_dtcm_hex=sep_smu_modules.dtcm.hex",
  "+sep_sym=sep_smu_modules.tcm.sym",
  "+esrc_noise_force",
]

