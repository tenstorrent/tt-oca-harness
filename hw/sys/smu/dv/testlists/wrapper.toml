schema_version = 1

# Production-wrapper baseline catalog, run via `run_dv.py --dut smu_wrapper`.
# Independent of the bare-smu all.toml catalog. Compile profiles are the
# [targets.*] tables in smu_wrapper_sim_cfg.toml selected per test.
# Result-reporting policy: docs/SMU_VPLAN.md §13.
# Config classes here: `no_sep` run mode = no-SEP; `sep_rtl` = real SEP RTL.
#
# SIGNOFF NOTE: wrapper `all` / `smoke` is the production-wrapper merge-gate
# only. It is NOT a substitute for bare `--dut smu --items sep0_all`.
# Shared name `smu_smc_smoke_test` must be tagged WRAPPER vs BARE in logs.
#
# Commercial mirror (oca_smu chiplet testlist YAML naming):
#   SMU_Dev_with_SEP_Regression          = probe/connectivity (no CPU exec)
#   Manual_SMU_Blocked_SEP_Exec_Regression = needs real SEP fetch/retire (#3582)
#
# OSS wrapper merge-gate (`all` / `smoke`) keeps only bring-up that does NOT
# require SEP CPU execution. `smu_sep_smoke_test` stays defined for the live
# #3582 IFU reproducer but is enrolled only under `sep_exec_blocked`.

[[tests]]
name = "smu_wrapper_elaboration_no_sep_test"
module = "smu_wrapper_elaboration_test"
target = "compile_smu_chiplet_no_sep"
firmware = { name = "elaboration", mode = "elaboration" }
seed = 1
timeout_sec = 600
tags = ["build", "smoke", "no_sep"]
run_modes = ["no_sep"]
args = [
  "+expected_sep=0",
  "+rom_hex=smc_rom_default.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
]

[[tests]]
name = "smu_wrapper_elaboration_sep_rtl_test"
module = "smu_wrapper_elaboration_test"
target = "compile_smu_chiplet_sep_rtl"
firmware = { name = "elaboration", mode = "elaboration" }
seed = 1
timeout_sec = 1200
tags = ["build", "smoke", "sep", "real_rtl"]
run_modes = ["sep_rtl"]
args = [
  "+expected_sep=1",
  "+rom_hex=smc_rom_default.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=sep_boot_rom_default.hex",
  "+sep_itcm_hex=sep_itcm_default.hex",
  "+sep_dtcm_hex=sep_dtcm_default.hex",
]

[[tests]]
name = "smu_smc_smoke_test"
module = "smu_smc_smoke_test"
target = "compile_smu_chiplet_no_sep"
firmware = { name = "smu_smc_smoke", mode = "smc_smoke" }
seed = 1
timeout_sec = 1800
tags = ["firmware", "smoke", "smc", "no_sep"]
run_modes = ["no_sep"]
args = [
  "+rom_hex=smu_smc_smoke.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
]

# Live #3582 reproducer (Manual_SMU_Blocked_SEP_Exec_Regression). Default-run
# gate is correct at CPU reset release, but IFU never issues boot-ROM fetches
# (boot_rom_reqs=0, halt=X). Not reportable as PASS until SEP fetch fix lands.
[[tests]]
name = "smu_sep_smoke_test"
module = "smu_sep_smoke_test"
target = "compile_smu_chiplet_sep_rtl"
firmware = { name = "smu_sep_smoke", mode = "sep_smoke" }
seed = 1
timeout_sec = 3600
tags = ["firmware", "smoke", "smc", "sep", "real_rtl", "blocked_sep_exec"]
run_modes = ["sep_rtl"]
args = [
  "+rom_hex=smu_sep_arm.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=smu_sep_boot_rom.hex",
  "+sep_itcm_hex=smu_sep_smoke.itcm.hex",
  "+sep_dtcm_hex=smu_sep_smoke.dtcm.hex",
]

# Merge-gate smoke: no SEP CPU (SEP=1 deferred until foundry ram_* for TCM).
[[groups]]
name = "smoke"
tests = [
  "smu_wrapper_elaboration_no_sep_test",
  "smu_smc_smoke_test",
]

[[groups]]
name = "build_smoke"
tests = [
  "smu_wrapper_elaboration_no_sep_test",
]

# Default `--items all` for smu_wrapper — green surface only (no SEP=1 TCM hack).
[[groups]]
name = "all"
tests = [
  "smu_wrapper_elaboration_no_sep_test",
  "smu_smc_smoke_test",
]

# Quarantine: needs foundry ram_* (OSS sep_tcm_wrapper present; DV shim
# removed) and/or SEP IFU (#3582).
[[groups]]
name = "sep_tcm_deferred"
tests = [
  "smu_wrapper_elaboration_sep_rtl_test",
  "smu_sep_smoke_test",
]

# Quarantine: real SEP firmware boot / retire (oca_smu Blocked_SEP_Exec).
[[groups]]
name = "sep_exec_blocked"
tests = [
  "smu_sep_smoke_test",
]

# Full wrapper catalog including the blocked SEP exec leaf (manual / debug).
[[groups]]
name = "all_with_sep_exec"
tests = [
  "smu_wrapper_elaboration_no_sep_test",
  "smu_smc_smoke_test",
  "smu_wrapper_elaboration_sep_rtl_test",
  "smu_sep_smoke_test",
]


