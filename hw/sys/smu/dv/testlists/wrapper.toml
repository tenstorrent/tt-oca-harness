# ext_in-driven SEP + SMC routing: the three-party test the sys-inbound path
# exists for. The external master is played by the sequence on the flat ext_in_*
# pins tb_wrapper_top.sv exposes. Protocol and every address
# come from the firmwares' shared header
# hw/sys/sep/dv/fw/tests/common/smu_sep_ext_axi_protocol.h.
# The sequence re-vectors the SMC cores to smu_sep_ext_axi_smc_entry, read from
# the built .sram.sym, over JTAG2AXI.
#
# Enrolled in sep_smc_sram_blocked. The preload is handled: smc_4core_cpu
# zeroes the scratch RAM at boot to establish valid ECC, and
# tb_wrapper_top.sv holds that FSM off whenever +smc_scratch_ram_hex
# supplies an image, so the image survives.
#
# The hand-off is handled too. Jumping to the image from the ROM left the core
# carrying the ROM's state -- mtvec among it -- so its first trap went to address
# 0. seq_lib/smc_cpu_revector.py does what the firmware's own header calls the
# SEP-driven or cocotb-backdoor boot instead: RESET_VECTOR on all four cores and
# a forced tile-reset pulse, over the DTP's JTAG2AXI, the way
# hw/sys/smc/dv/cocotb/seq_lib/smc_cpu_vip_utils.py does it over its CSR agent.
#
# That sequence is applied, not merely issued, and was checked against the
# design's own gating rather than against its own return codes. A JTAG2AXI write
# to CPU_CTRL lands: writing SCRATCH_0 moves the value the testbench observes on
# smc_scratch_0_o off the 0xACAFACA1 the ROM left. With the writes landing at the
# right time, smc_cpu_ctrl_wrap reaches force_apply=1 / withhold=0 -- the cluster
# never drains, so the RESET_TIMEOUT force is what applies the reset, exactly the
# path that register exists for -- and all four cores go to core_reset_n=0 and
# then back to 1. The tile reset really is taken and released.
#
# What still blocks this test is that nothing follows the release: neither the
# ROM nor the scratch read counter moves again, and no further instruction
# retires, so the cores issue no fetch at all rather than fetching the wrong
# thing. The image itself is present -- the backdoor reports its stripe load.
# Whatever answers that also answers smu_sep_smc_xbar_test, which is blocked on
# the CPU-private-SRAM limit this group is named for; neither test in the group
# can report PASS until then.
[[tests]]
name = "smu_sep_ext_axi_test"
module = "smu_sep_ext_axi_test"
target = "compile_smu_chiplet_sep_rtl"
firmware = { name = "sep_smu_ext_axi", mode = "sep_dv_fw" }
seed = 1
timeout_sec = 3600
tags = ["firmware", "sep", "smc", "real_rtl", "real_fw", "interop"]
run_modes = ["sep_rtl"]
args = [
  "+rom_hex=smu_sep_arm.rom.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+sep_efuse_hex=sep_efuse_default.hex",
  "+sep_boot_rom_hex=smu_sep_boot_rom.hex",
  "+sep_itcm_hex=sep_smu_ext_axi.itcm.hex",
  "+sep_dtcm_hex=sep_smu_ext_axi.dtcm.hex",
  "+sep_sym=sep_smu_ext_axi.tcm.sym",
  "+smc_scratch_ram_hex=smu_sep_ext_axi.ecc.hex",
  "+smc_sym=smu_sep_ext_axi.sram.sym",
]

