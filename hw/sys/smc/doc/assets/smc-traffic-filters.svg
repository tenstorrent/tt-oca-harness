<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="876" viewBox="0 0 1040 876" role="img" aria-labelledby="title desc">
<title id="title">SMC traffic filter mechanism</title>
<desc id="desc">Decode of axi_filter_wrap, the block behind the SMC inbound filter u_smc_sys_inbound_filter and outbound filter u_smc_sys_outbound_filter. The upper part is one traffic_filter, instantiated once per entry and channel. An entry hits when all five conditions hold: the address lies between START_ADDR and END_ADDR compared on bits 55 to 12 when allow_burst is set and on bits 55 to 3 otherwise; AxPROT[1] equals allow_ns; src_id is 0 or equals the source ID in AxUSER[3:0]; allow_burst is set or AxLEN is 0; and entry_enabled is set. Group ID matching is not built into the SMC instances. Separately, the entry's permission bit, write_allowed for AW or read_allowed for AR, gated with AxVALID, gives its pass bit. The lower part is one channel of axi_filter_wrap; AW and AR each have their own copy. The 16 hit bits drive a priority encoder that returns the lowest-numbered hitting entry and whether any entry hit. With a hit, the transaction is blocked if that entry's pass bit is clear; with no hit, it is blocked if BlockByDefault is set, which is 1 for the inbound and 0 for the outbound instance. filter_skip_i would force a pass but is tied to 0 in the SMC. The block decision selects the port of the demux u_axi_demux: allowed transactions continue to the filtered output and blocked ones go to u_axi_err_slv, which answers with DECERR.</desc>
