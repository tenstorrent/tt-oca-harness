<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="780" viewBox="0 0 1040 780" role="img" aria-labelledby="title desc">
<title id="title">Tile-request-driven FLR isolation</title>
<desc id="desc">Highlighted: a tile on the primary chiplet raises cfg_flr_pf_active_i. Its synchronised rising edge sets ISOLATE_REQ_SMC, so the SMC-enabled bits of isolate_req_o[31:0] isolate the chiplet tiles, and starts the FLR counters. The FLR cool reset asserts the primary chiplet's primary reset and drives BP_COOL_RESET_N_O, which reaches the secondary chiplet's BP_COOL_RESET_N_I and asserts its primary reset. Two chiplets, primary above secondary, each with an SMC holding the CPU, u_smc_reset_unit and u_smc_padring. In u_smc_reset_unit, cfg_flr_pf_active_i from a tile passes a synchroniser and edge detector into the FLR counters; the isolation OR combines ISOLATE_REQ_REG written by the CPU, the PINEN bits qualified by the GPIO 53 ISOLATE_REQ pad and the SMCEN bits qualified by ISOLATE_REQ_SMC into isolate_req_o[31:0] to the chiplet tiles; the primary reset is the AND of the FLR cool reset, the cool-reset pin BP_COOL_RESET_N_I and the cold reset BP_RESET_N. The FLR cool reset also drives the GPIO 62 BP_COOL_RESET_N_O pad. The board drives BP_RESET_N to both chiplets and ISOLATE_REQ to the primary chiplet. The primary chiplet's BP_COOL_RESET_N_O connects to the secondary chiplet's BP_COOL_RESET_N_I; the primary chiplet's BP_COOL_RESET_N_I and the secondary chiplet's BP_COOL_RESET_N_O are not connected, and the secondary chiplet ties cfg_flr_pf_active_i and ISOLATE_REQ low and leaves isolate_req_o unconnected.</desc>
