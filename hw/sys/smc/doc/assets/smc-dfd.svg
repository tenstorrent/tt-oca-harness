<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="676" viewBox="0 0 1040 676" role="img" aria-labelledby="title desc">
<title id="title">SMC DFD block diagram</title>
<desc id="desc">Block diagram of smc_dfd_wrap, the SMC design-for-debug block. On the left of the wrapper the debug-bus mux tree takes the 64-lane, 16-bit-per-lane debug_bus_i from smc_base: eight level-3 tt_debug_bus_mux instances reduce it to 32 lanes and four level-2 instances to 16 lanes, all selected by dbg_mux_sel from the DFX CSRs. Below them the clock gate u_dfd_clk_gate gates clk_smc_i under dfd_cg_en to clock the muxes and the DFD IP, and the time-tick generator counts clk_ref_i edges in Gray code and synchronises them into a CLA time tick. The DFD IP u_dfd_top, dfd_top_cla_dst_apb, holds one core logic analyzer (CLA) and one debug signal trace instance (DST). The CLA is fed with the 16 muxed lanes; its mux_sel stage selects the 64-bit debug bus that the CLA evaluates and passes to the DST with trace control. The DST feeds the trace network interface, which feeds the trace network and funnel; its trace sink writes eight external trace RAMs of 256 × 64 bits. The instruction trace (N-Trace) is not built, the trace AXI master is tied off, the JTAG register port is tied off and the timestamp inputs are tied to zero. The memory-mapped registers take APB from smc_local_xbar. The CLA drives the clock-stop and cross-trigger outputs through a mask set by bit 0 of xtrig_clk_halt_mask, accepts cross-triggers from the DTP, and drives the debug interrupt, sixteen custom actions and the debug marker. Its GPIO toggle and local halt-clock outputs are unconnected.</desc>
