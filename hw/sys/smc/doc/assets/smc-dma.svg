<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="786" viewBox="0 0 1140 786" role="img" aria-labelledby="title desc">
<title id="title">SMC DMA and data-accelerator path</title>
<desc id="desc">u_smc_data_accelerator_wrap takes the DMA control port from the local crossbar (AXI4, 32-bit address, 64-bit data, 8-bit ID). Its demux u_dma_ctrl_demux sends a single-beat access that falls in the DMA's registers to the DMA, after the address is cut to 9 bits, and every burst or other access to u_dma_ctrl_err_slv, which answers SLVERR. The zeroer control port arrives separately from the internal CSR crossbar (AXI-Lite, 32-bit address, 64-bit data). In u_dma_wrap (idma_wrapper) the frontend u_idma_frontend_wrapper passes a register cut, an AXI4-to-register converter from 64 to 32 bits, the idma_reg64_2d registers, a 4-entry request FIFO and the idma_nd_midend 2D midend. The request manager is a passthrough for one control and one master interface. The backend u_idma_backend_wrapper has no manager-to-backend FIFO; idma_backend_rw_axi holds the read and write managers with a 16-beat buffer, up to 32 outstanding transactions and R-AW coupling, and its read and write ports, each with 2-bit IDs, are merged by u_backend_axi_mux to one 3-bit-ID port behind a register cut. The frontend clock comes from u_frontend_cg, an AXI snoop of the control port; the request manager and backend clock comes from u_request_maneger_cg. u_axi_mux merges the DMA and zeroer master ports, adding one ID bit, onto the port to the input fabric (AXI4, 56-bit address, 64-bit data, 4-bit ID). The zeroer busy and interrupt outputs leave on the left and the DMA busy and interrupt outputs at the bottom.</desc>
