<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="710" viewBox="0 0 1040 710" role="img" aria-labelledby="title desc">
<title id="title">SMC memory zeroer</title>
<desc id="desc">u_zeroer takes its control port from u_axi_demux (AXI4, 5-bit address, 64-bit data, 8-bit ID) and converts it to AXI-Lite for the u_zeroer_reg registers DEST_ADDR, SIZE and CTRL_STATUS, which run on reg_clk from the u_zeroer_cg bus snoop. The clear state machine runs on axi_clk from u_axi_clk_gater, which is enabled while the zeroer is busy. Reset enters ST_IDLE (3'b001). A write to CTRL_STATUS with SIZE non-zero latches DEST_ADDR and SIZE and moves to ST_ISSUE_ADDR (3'b010), which drives AWVALID with an aligned address and a burst length of up to 256 beats that never crosses a 4 KiB boundary. AWREADY moves to ST_ISSUE_DATA (3'b100), which drives zero data with byte strobes for every beat. When the last beat is accepted the machine returns to ST_ISSUE_ADDR if bytes remain and to ST_IDLE if none do. Any illegal state encoding enters ST_ERROR (3'b000), which holds the zeroer busy with no interrupt until reset. The AW and W channels leave on the master port to u_axi_mux (AXI4, 56-bit address, 64-bit data, 3-bit ID); the B channel is always ready and its response code is not checked, and the AR and R channels are tied off. outstanding_reqs counts accepted addresses up and write responses down. zeroer_busy_o is high outside ST_IDLE, on a start and while the count is non-zero; zeroer_intp_o pulses when busy falls while INT_EN is set.</desc>
