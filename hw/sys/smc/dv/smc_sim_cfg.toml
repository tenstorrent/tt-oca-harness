schema_version = 1

# Launch entry: this merged sim_cfg is selected by `--dut smc` (via duts.toml or the hw/**
# convention). The shared stage graph + tool list come from profile = "native-cocotb".
name = "smc"
profile = "native-cocotb"
description = "SMC OSS cocotb smoke and coverage flow"

[testlist]
path = "testlists/all.toml"
format = "toml_list"

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "dv/oss/hw/sys/smc/dv/build"]

[build]
# Native build is driven by the Bender/filelist keys below; .core files are external-only.
top_module = "smc_uvm_top"
top_file = "dv/oss/hw/sys/smc/dv/tb/tb_top.sv"
# Extra tb sources compiled alongside tb_top. This follows the OSS
# memory-shim pattern and provides behavioral responders for bare SMC CPU
# ROM/scratch/cache memory ports.
sources = [
  "dv/oss/hw/sys/smc/dv/shims/mem/tb_smc_cpu_mem_responder.sv",
  "dv/oss/hw/sys/smc/dv/shims/mem/tb_smc_output_mem_responder.sv",
  "dv/oss/hw/sys/smc/dv/shims/mem/tb_smc_gpio_ctrl_rw_stub.sv",
  "dv/oss/hw/sys/smc/dv/shims/mem/tb_smc_i3c_mem_responder.sv",
  "dv/oss/hw/sys/smc/dv/shims/analog/tb_smc_efuse_responder.sv",
]
filelist = "dv/oss/hw/sys/smc/dv/build/smc_dut_compile.f"
bender_filelist = "dv/oss/hw/sys/smc/dv/build/smc_bender.f"
work_dir = "dv/oss/hw/sys/smc/dv/build"
common_bender_targets = [
  "tech_cells_generic_exclude_deprecated",
  "tech_cells_generic_exclude_tc_sram",
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "idma_rtl",
  "register_interface_l1",
]
bender_targets = ["smc", "simulation"]
incdirs = ["dv/oss/hw/sys/smc/dv/tb"]
# Bender.lock still resolves Package(i3c-core) to stale deps/i3c-core while the
# smc target also lists vendor/chipsalliance/i3c-core (I3C rebase #3934). Drop
# the stale deps tree so i3c_pkg matches i3c_wrapper (rlt_mem_*).
exclude_files = [
  "deps/i3c-core",
]
# FIXME(transition): `stubs` is a transitional Verilator-compat override set, listed ahead of the
# bender filelist (-Wno-MODDUP first-wins). Remove once these shims are no longer needed upstream.
stubs = [
  "dv/oss/hw/sys/smc/dv/tb/verilator_stubs/prim_sync2.sv",
  "dv/oss/hw/sys/smc/dv/tb/verilator_stubs/smc_dfx_ctrl_status_wrap.sv",
  "dv/oss/hw/sys/smc/dv/tb/verilator_stubs/smc_subsystem_resets.sv",
  "dv/oss/hw/sys/smc/dv/tb/verilator_stubs/smc_cool_reset_wrap.sv",
  "dv/oss/hw/sys/smc/dv/tb/verilator_stubs/smc_reset_unit.sv",
]

[build.verilator]
# SMC cocotb tests use top-level lifted ports and do not require internal VPI
# access. Avoid cocotb's default public-flat model because it expands the SMC
# GPIO filter hierarchy into a very large generated C++ model.
disable_public_flat_rw = true
# Compile generated C++ serially and without optimization to avoid OOM kills on
# large SMC CPU/peripheral objects.
low_mem_make = true

[cocotb]
# Uniform flow-first layout: cocotb tests live under cocotb/.
python_root = "dv/oss/hw/sys/smc/dv/cocotb"
test_dir = "dv/oss/hw/sys/smc/dv/cocotb/tests"
# Shared cocotb VIP (ocah_spi_vip, ocah_axi_vip, ...) lives at hw/common/dv/vip;
# add it to the import path so tests can `from ocah_spi_vip import OcahSpiFlash`.
python_paths = [
  "dv/oss/hw/common/dv/vip",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

[run_modes.smoke]
description = "Minimal public reset smoke for contributor bring-up"
timeout_sec = 1800
# Default OTP image so fuse-sense completes (~5.5 us) and releases warm reset
# (SCRATCH_COLD_WARM_*). Absolute path: sim cwd is attempt_*/make.
args = [
  "+smc_efuse_hex=/proj_soc/user_dev/minshaoho/tryrun/os_oca/dv/oss/hw/sys/smc/dv/assets/smc_efuse_default.hex",
]

# OD-19: one [targets.<name>] merges the former [compile_targets]/[run_targets] split.
# Tool-specific flags live under [targets.<name>.tools.<tool>].
[targets.default]
description = "DUT-only SMC cocotb target for public smoke and coverage"
build_dir = "dv/oss/hw/sys/smc/dv/build/cocotb"   # per-tool subdir appended: cocotb/<tool>
defines = [
  # SYNTHESIS no-ops assertion/cover blocks that Verilator cannot parse.
  "SYNTHESIS",
]

[targets.default.tools.verilator]
flags = [
  # PeakRDL reg blocks (scratch_reg, system_timer_octs_reg, uart_log_engine_ctrl_reg) reset their
  # axil_resp_buffer struct-array via an NBA in a for-loop -> Verilator BLKLOOPINIT; suppressed
  # here because the loop-style reset is functionally correct.
  "-Wno-BLKLOOPINIT",
]
