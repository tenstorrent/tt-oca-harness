schema_version = 1

# Launch entry: `--dut smc` (discovered by the directory convention).
# tb_top.sv instantiates hw/top/smc_wrapper.sv (smc + smc_ip_integration,
# which carries the CPU memory macros); the bare DUT name selects that
# wrapper-based TB.
name = "smc"
profile = "native"
description = "SMC OSS cocotb: smc_wrapper under tb_top"
default_tool = "verilator"
tools = ["vcs", "verilator", "xcelium"]

[testlist]
path = "testlists/all.toml"
format = "toml_list"

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "hw/sys/smc/dv/build"]

[build]
top_module = "smc_uvm_top"
top_file = "hw/sys/smc/dv/tb/tb_top.sv"
filelist = "hw/sys/smc/dv/build/smc_dut_compile.f"
bender_filelist = "hw/sys/smc/dv/build/smc_bender.f"
work_dir = "hw/sys/smc/dv/build"
common_bender_targets = [
  "tech_cells_generic_exclude_deprecated",
  "tech_cells_generic_exclude_tc_sram",
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "idma_rtl",
  "register_interface_l1",
]
# smc_wrapper Bender target pulls hw/top/smc_wrapper.sv.
bender_targets = ["smc", "smc_wrapper"]
incdirs = [
  "hw/sys/sep/dv/shims/prim",
  "hw/sys/smc/dv/tb",
]
exclude_files = [
  "hw/oss-example/wrapper/smc/smc_padring_ext.sv",
  "hw/oss-example/wrapper/smu/smu_wrapper.sv",
  "hw/oss-example/wrapper/sep/sep_ip_integration.sv",
  "hw/oss-example/meta/registers/rtl/och_sep_spi_mux_ctrl_ot_reg_pkg.sv",
  "hw/oss-example/meta/registers/rtl/och_sep_spi_mux_ctrl_ot_reg.sv",
  "deps/i3c-core",
]
stubs = [
  # Tooling shims only (OSS prim port / X-init). No product-module overrides.
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync2.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync3.sv",
]
sources = [
  # SEP rom_boot posture: pulp axi_sim_mem (under axi_simulation, not axi_rtl).
  "vendor/pulp-platform/axi/upstream/src/axi_sim_mem.sv",
  # Two prims the SMC DUT instantiates but no `smc` Bender target supplies:
  #   prim_fifo_async <- hw/common/och_prim/rtl/prim_refclk_count_w_cdc.sv:79
  #                      (Bender.yml:152, target any(opentitan_smu, sep, smu))
  #   prim_rst_sync   <- hw/ip/efuse/rtl/efuse_interface_controller.sv:159
  #                      (Bender.yml:64,  target any(opentitan_smu, sep, smu, key_manager))
  # Without them both cells elaborate as unresolved: VCS/Xcelium refuse the
  # build outright, and Verilator only proceeds because `-Wno-fatal` demotes
  # the missing-module error to a warning and black-boxes them -- so a CDC FIFO
  # and a reset synchronizer were silently absent from every SMC run. The
  # upstream fix is to add `smc` to those two Bender targets; this DV-local
  # source entry unblocks all three simulators without editing vendor/.
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_fifo_async.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_rst_sync.sv",
  # prim_flop_2sync instantiates prim_cdc_rand_delay when SIMULATION is defined
  # (it is, see targets.default.tools.*). Bender.yml:38-42 records exactly this
  # gap for `dtp` and closes it with `target: all(dtp, simulation)`; `smc` has
  # the same hole and no equivalent entry. Upstream fix: add
  # `target: all(smc, simulation)` carrying this file.
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_cdc_rand_delay.sv",
  # prim_ram_1p backs the CPU cluster memory macros
  # (smc_cpu/mem_swaps/4core/OCAH4CORECluster_mem_swaps.sv:95, reached via
  # smc_cpu_mem_integration -> prim_ram_1p_adv_ext). Bender.yml:81,197 carry it
  # only for any(sep_wrapper, smu_wrapper) / any(opentitan_smu, sep, smu); the
  # smc/smc_wrapper targets get prim_ram_1p_adv_ext but not the macro it wraps,
  # so every CPU icache/dcache tag+data array elaborated as a black box.
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_ram_1p.sv",
  # prim_subreg/prim_subreg_ext back idma_reg64_2d_reg_top (the iDMA register
  # file); prim_arbiter_tree backs log_engine. All three sit in Bender.yml under
  # any(opentitan_smu, sep, smu) only, so under smc/smc_wrapper the DMA CSR
  # subregs and the log-engine arbiter elaborated as black boxes.
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_subreg.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_subreg_ext.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_arbiter_tree.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_subreg_arb.sv",
  # DV collateral for the CPU memory macros: counters, FW mailbox, the ECC
  # inject hook and the image backdoors, bound into smc_ip_integration.
  # Not in the Bender wrapper target -- only this TB binds it.
  "hw/sys/smc/dv/models/smc_cpu_mem_dv.sv",
]

[build.verilator]
disable_public_flat_rw = true
public_scope = "hw/sys/smc/dv/tb/smc_public_scope.vlt"
low_mem_make = true
ccache = true

[build.options]
build_jobs = 8

[frameworks.cocotb]
python_root = "hw/sys/smc/dv/cocotb"
test_dir = "hw/sys/smc/dv/cocotb/tests"
python_paths = [
  "hw/common/dv/vip",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

[c_build.default]
# Build the selected SMC C test and declare every time-zero preload consumed by
# the firmware boot test. run_dv stages these basenames into the simulator cwd.
cwd = "."
argv = [
  "bash",
  "-lc",
  "make ocah-dv-fw-tests TARGET=smc TEST={fw_target} && cp hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload hw/sys/smc/dv/fw/build/tests/{fw_target}/",
]
outputs = [
  "hw/sys/smc/dv/fw/build/tests/{fw_target}/{fw_target}.ecc.hex",
  "hw/sys/smc/dv/fw/build/tests/{fw_target}/default_efuse_shadow_reg.preload",
]

[run_modes.smoke]
description = "SMC functional smoke (smc_wrapper under tb_top)"
timeout_sec = 1800
args = [
  "+smc_efuse_hex={repo_root}/hw/sys/smc/dv/assets/smc_efuse_default.hex",
  "+rom_hex={repo_root}/hw/sys/smc/dv/assets/smc_rom_default.hex",
]

[targets.default]
description = "OSS SMC cocotb target"
build_dir = "hw/sys/smc/dv/build/cocotb"
defines = [
  "SYNTHESIS",
]

[targets.default.tools.verilator]
flags = [
  "-Wno-BLKLOOPINIT",
  "+define+VERILATOR",
  "+define+ASSERTS_OFF",
]
