schema_version = 1

# Launch entry: `--dut smc` (discovered by the directory convention).
# tb_top.sv instantiates hw/top/smc_wrapper.sv (smc + smc_ip_integration,
# which carries the CPU memory macros); the bare DUT name selects that
# wrapper-based TB. Two frameworks share this config and one tb_top:
# cocotb/PyUVM (default) and SV-UVM (`--framework uvm`, VCS; see the
# [frameworks.uvm] overlay at the bottom). Shared stage graph + tool list
# come from profile = "native".
name = "smc"
profile = "native"
description = "SMC OSS DV flow (cocotb/PyUVM default, SV-UVM via --framework uvm)"
default_framework = "cocotb"
default_tool = "verilator"
tools = ["vcs", "verilator", "xcelium"]

[testlist]
path = "testlists/all.toml"
format = "toml_list"

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "hw/sys/smc/dv/build"]

[build]
top_module = "smc_uvm_top"
top_file = "hw/sys/smc/dv/tb/tb_top.sv"
filelist = "hw/sys/smc/dv/build/smc_dut_compile.f"
bender_filelist = "hw/sys/smc/dv/build/smc_bender.f"
work_dir = "hw/sys/smc/dv/build"
common_bender_targets = [
  "tech_cells_generic_exclude_deprecated",
  "tech_cells_generic_exclude_tc_sram",
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "idma_rtl",
  "register_interface_l1",
]
# smc_wrapper Bender target pulls hw/top/smc_wrapper.sv.
bender_targets = ["smc", "smc_wrapper"]
incdirs = [
  "hw/sys/sep/dv/shims/prim",
  "hw/sys/smc/dv/tb",
]
exclude_files = [
  "hw/oss-example/wrapper/smc/smc_padring_ext.sv",
  "hw/oss-example/wrapper/smu/smu_wrapper.sv",
  "hw/oss-example/wrapper/sep/sep_ip_integration.sv",
  "hw/oss-example/meta/registers/rtl/och_sep_spi_mux_ctrl_ot_reg_pkg.sv",
  "hw/oss-example/meta/registers/rtl/och_sep_spi_mux_ctrl_ot_reg.sv",
  "deps/i3c-core",
]
stubs = [
  # Tooling shims only (OSS prim port / X-init). No product-module overrides.
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync2.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync3.sv",
]
sources = [
  # SEP rom_boot posture: pulp axi_sim_mem (under axi_simulation, not axi_rtl).
  "vendor/pulp-platform/axi/upstream/src/axi_sim_mem.sv",
  # DV collateral for the CPU memory macros: counters, FW mailbox, the ECC
  # inject hook and the image backdoors, bound into smc_ip_integration.
  # Not in the Bender wrapper target -- only this TB binds it.
  "hw/sys/smc/dv/models/smc_cpu_mem_dv.sv",
]

[build.verilator]
disable_public_flat_rw = true
public_scope = "hw/sys/smc/dv/tb/smc_public_scope.vlt"
low_mem_make = true
ccache = true

[build.options]
build_jobs = 8

[frameworks.cocotb]
python_root = "hw/sys/smc/dv/cocotb"
test_dir = "hw/sys/smc/dv/cocotb/tests"
python_paths = [
  "hw/common/dv/vip",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

[c_build.default]
# Build the selected SMC C test and declare every time-zero preload consumed by
# the firmware boot test. run_dv stages these basenames into the simulator cwd.
cwd = "."
argv = [
  "bash",
  "-lc",
  "make ocah-dv-fw-tests TARGET=smc TEST={fw_target} && cp hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload hw/sys/smc/dv/fw/build/tests/{fw_target}/",
]
outputs = [
  "hw/sys/smc/dv/fw/build/tests/{fw_target}/{fw_target}.ecc.hex",
  "hw/sys/smc/dv/fw/build/tests/{fw_target}/default_efuse_shadow_reg.preload",
]

[run_modes.smoke]
description = "SMC functional smoke (smc_wrapper under tb_top)"
timeout_sec = 1800
args = [
  "+smc_efuse_hex={repo_root}/hw/sys/smc/dv/assets/smc_efuse_default.hex",
  "+rom_hex={repo_root}/hw/sys/smc/dv/assets/smc_rom_default.hex",
]

[targets.default]
description = "OSS SMC cocotb target"
build_dir = "hw/sys/smc/dv/build/cocotb"
# SYNTHESIS is not set on any tool (same as SEP). It no-ops every
# `ifndef SYNTHESIS` block (OpenTitan ASSERT macros, PeakRDL register
# checks, Chipyard sim-only `$error` / plusargs). Verilator still compiles
# those macros out because prim_assert.sv / ocah_assert.svh gate on
# VERILATOR; VCS and Xcelium run them. The shared native profile keeps
# COMMON_CELLS_ASSERTS_OFF, so PULP common_cells inline asserts stay off
# on every backend. Verilator also keeps +define+ASSERTS_OFF below.

[targets.default.tools.verilator]
flags = [
  "-Wno-BLKLOOPINIT",
  "+define+VERILATOR",
  "+define+ASSERTS_OFF",
]

# --- SV-UVM framework overlay (selected by `--framework uvm`; VCS via the shared native
# profile). Shares the DUT RTL recipe above; only the SV-UVM deltas live here. ONE tb_top module
# for both frameworks: +define+UVM (from the profile's [frameworks.uvm] overlay) switches
# tb/tb_top.sv from the ported cocotb shape to the self-contained SV-UVM shape, which
# `include`s uvm/tests/smc_tests.sv.
[frameworks.uvm]
description = "SMC SV-UVM smoke flow (VCS)"
# The top-level `tools`/`default_tool` above serve the cocotb view; the UVM view runs on the
# commercial simulators only (Verilator has no SV-UVM support), so the overlay restates them.
default_tool = "vcs"
tools = ["vcs"]

[frameworks.uvm.build]
# The shared framework library and the AXI VIP SV-UVM layer come from their owned ordered
# manifests, expanded in listed order AHEAD of this table's own incdirs/sources (dedup-merge)
# — never hand-copy library or VIP paths here. Compile order stays load-bearing and explicit:
# the generated filelist emits the expanded `sources` AFTER the bender filelist (DUT packages
# visible), then `top_file` last:
#   ocah_lib manifest -> ocah_axi_vip manifest
#   (each: evidence base -> interface -> collateral -> UVM pkg)
#   -> library-resolved DUT primitives -> TB collateral -> smc_tb_if -> smc_env_pkg
#   -> smc_seq_lib_pkg -> tb_top.sv
# The generated SMC address map (smc_top_addrmap_pkg) the ref model and the CSR sequences
# read arrives through the bender filelist (Bender.yml target `smc`); listing it here would
# compile the package twice.
# smc_env_pkg compiles before smc_seq_lib_pkg: the scenario virtual sequences run on the
# smc_virtual_sequencer the env package declares.
source_lists = [
  "hw/common/dv/vip/ocah_lib/uvm/sources.toml",
  "hw/common/dv/vip/ocah_axi_vip/uvm/sources.toml",
]
filelist = "hw/sys/smc/dv/build/uvm/smc_uvm_compile.f"
bender_filelist = "hw/sys/smc/dv/build/uvm/smc_uvm_bender.f"
work_dir = "hw/sys/smc/dv/build/uvm"
incdirs = [
  "hw/sys/sep/dv/shims/prim",
  "hw/sys/smc/dv/tb",
  "hw/common/assert",
  "hw/sys/smc/dv/uvm/env",
  "hw/sys/smc/dv/uvm/seq_lib",
  "hw/sys/smc/dv/uvm/tests",
]
# This list REPLACES the cocotb [build].sources list, so the TB collateral both flows compile
# (the SYS_OUT axi_sim_mem responder and the CPU memory DV binding) is repeated here.
sources = [
  # DUT-support primitives the Bender `smc` targets reach only through their exported +incdir
  # paths: Verilator searches include directories for unresolved modules, VCS compiles only
  # what a filelist names. This is the set Verilator's dependency file records for the cocotb
  # build (macro headers excluded: they arrive through +incdir in both flows). prim_cipher_pkg
  # leads: prim_prince and prim_subst_perm import it, and VCS resolves package scopes at
  # analysis time (Verilator never elaborates those two, so it never loaded the package).
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_cipher_pkg.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_arbiter_tree.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_cdc_rand_delay.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_diff_encode.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_fifo_async.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_prince.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_ram_1p.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_ram_1p_adv.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_rst_sync.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_secded_inv_22_16_dec.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_secded_inv_22_16_enc.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_secded_inv_39_32_dec.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_secded_inv_39_32_enc.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_secded_inv_hamming_22_16_dec.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_secded_inv_hamming_22_16_enc.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_secded_inv_hamming_39_32_dec.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_secded_inv_hamming_39_32_enc.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_subreg.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_subreg_arb.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_subreg_ext.sv",
  "vendor/lowRISC/opentitan/upstream/hw/ip/prim/rtl/prim_subst_perm.sv",
  "vendor/tenstorrent/tt-hw-debug/upstream/dependencies/common/generic_mem_model.sv",
  "vendor/tenstorrent/tt-hw-debug/upstream/rtl/trace/trace_mem.sv",
  "vendor/tenstorrent/tt-hw-debug/upstream/rtl/trace/trace_mem_sink.sv",
  # TB collateral shared with the cocotb flow.
  "vendor/pulp-platform/axi/upstream/src/axi_sim_mem.sv",
  "hw/sys/smc/dv/models/smc_cpu_mem_dv.sv",
  "hw/sys/smc/dv/tb/smc_tb_if.sv",
  "hw/sys/smc/dv/uvm/env/smc_env_pkg.sv",
  "hw/sys/smc/dv/uvm/seq_lib/smc_seq_lib_pkg.sv",
]

[frameworks.uvm.sim]
args = ["+UVM_VERBOSITY=UVM_MEDIUM"]

[frameworks.uvm.targets.default]
description = "SMC SV-UVM default target"
build_dir = "hw/sys/smc/dv/build/uvm"
# The bare `UVM` define (selects the SV-UVM shape of the shared tb_top.sv) comes from the
# native profile's [frameworks.uvm] overlay — no per-DUT copy.
