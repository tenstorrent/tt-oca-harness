schema_version = 1

# Launch entry: this merged sim_cfg is selected by `--dut smc` (via duts.toml or the hw/**
# convention). The shared stage graph + tool list come from profile = "native-cocotb".
name = "smc"
profile = "native-cocotb"
description = "SMC OSS cocotb smoke and coverage flow"

[testlist]
path = "testlists/all.toml"
format = "toml_list"

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "hw/sys/smc/dv/build"]

[build]
# Native build is driven by the Bender/filelist keys below; .core files are external-only.
top_module = "smc_uvm_top"
top_file = "hw/sys/smc/dv/tb/tb_top.sv"
# Extra tb sources compiled alongside tb_top. Behavioral stand-ins live under
# models/ (aligned with DTP/SEP taxonomy: vip in common, models DUT-local,
# stubs in tb/verilator_stubs). Bare SMC uses the same CPU prim macros as
# smc_wrapper via smc_cpu_mem_integration; eFuse uses the shared
# efuse_interface_shim + efuse_bank_model (Bender smc target); GPIO-ctrl
# is a DECERR terminator (same as smc_ip_integration).
sources = [
  "hw/top/smc_cpu_mem_integration.sv",
  "hw/sys/smc/dv/models/mem/tb_smc_output_mem_responder.sv",
  "hw/sys/smc/dv/models/mem/tb_smc_i3c_mem_responder.sv",
]
filelist = "hw/sys/smc/dv/build/smc_dut_compile.f"
bender_filelist = "hw/sys/smc/dv/build/smc_bender.f"
work_dir = "hw/sys/smc/dv/build"
common_bender_targets = [
  "tech_cells_generic_exclude_deprecated",
  "tech_cells_generic_exclude_tc_sram",
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "idma_rtl",
  "register_interface_l1",
]
bender_targets = ["smc", "simulation"]
incdirs = ["hw/sys/smc/dv/tb"]
# Bender.lock still resolves Package(i3c-core) to stale deps/i3c-core while the
# smc target also lists vendor/chipsalliance/i3c-core (I3C rebase #3934). Drop
# the stale deps tree so i3c_pkg matches i3c_wrapper (rlt_mem_*).
exclude_files = [
  "deps/i3c-core",
]
# Verilator-only module overrides listed ahead of the Bender filelist
# (-Wno-MODDUP first-wins). See tb/verilator_stubs/README.md. Not used by VCS.
stubs = [
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync2.sv",
  # SYNC_STAGES=3 path (i2c_enable -> LSIO); same init-zero rationale as sync2.
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync3.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/smc_dfx_ctrl_status_wrap.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/smc_subsystem_resets.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/smc_cool_reset_wrap.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/smc_reset_unit.sv",
]

[build.verilator]
# SMC cocotb tests use top-level lifted ports and do not require internal VPI
# access. Avoid cocotb's default public-flat model because it expands the SMC
# GPIO filter hierarchy into a very large generated C++ model.
disable_public_flat_rw = true
public_scope = "hw/sys/smc/dv/tb/smc_public_scope.vlt"
# Compile generated C++ serially and without optimization to avoid OOM kills on
# large SMC CPU/peripheral objects.
low_mem_make = true

[cocotb]
# Uniform flow-first layout: cocotb tests live under cocotb/.
python_root = "hw/sys/smc/dv/cocotb"
test_dir = "hw/sys/smc/dv/cocotb/tests"
# Shared cocotb VIP (ocah_spi_vip, ocah_axi_vip, ...) lives at hw/common/dv/vip;
# add it to the import path so tests can `from ocah_spi_vip import OcahSpiFlash`.
python_paths = [
  "hw/common/dv/vip",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

[run_modes.smoke]
description = "Minimal public reset smoke for contributor bring-up"
timeout_sec = 1800
# Default OTP image so fuse-sense completes (~5.5 us) and releases warm reset
# (SCRATCH_COLD_WARM_*). {repo_root} is expanded before sim launch (cwd is
# attempt_*/make, so repo-relative paths alone would not resolve).
args = [
  "+smc_efuse_hex={repo_root}/hw/sys/smc/dv/assets/smc_efuse_default.hex",
  # Satisfy OCAH4CORECluster_rom_ext (+rom_hex) under +define+SIM; FW tests
  # may override via +smc_rom_hex backdoor into the same prim_rom.mem.
  "+rom_hex={repo_root}/hw/sys/smc/dv/assets/smc_rom_default.hex",
]

# OD-19: one [targets.<name>] merges the former [compile_targets]/[run_targets] split.
# Tool-specific flags live under [targets.<name>.tools.<tool>].
[targets.default]
description = "DUT-only SMC cocotb target for public smoke and coverage"
build_dir = "hw/sys/smc/dv/build/cocotb"   # per-tool subdir appended: cocotb/<tool>
defines = [
  # SYNTHESIS no-ops assertion/cover blocks that Verilator cannot parse.
  "SYNTHESIS",
  "SIM",
]

[targets.default.tools.verilator]
flags = [
  # PeakRDL reg blocks (scratch_reg, system_timer_octs_reg, uart_log_engine_ctrl_reg) reset their
  # axil_resp_buffer struct-array via an NBA in a for-loop -> Verilator BLKLOOPINIT; suppressed
  # here because the loop-style reset is functionally correct.
  "-Wno-BLKLOOPINIT",
]
