schema_version = 1

# Official SMC OSS launch entry: `--dut smc_wrapper` (registered in
# hw/common/dv/configs/duts.toml). DUT is hw/top/smc_wrapper.sv
# (smc + smc_ip_integration + smc_cpu_mem_integration). TB
# (tb_wrapper_top.sv) exposes the same cocotb port surface as bare smc so
# the shared SmcEnv smoke catalog runs. Prefer this over `--dut smc`.
name = "smc_wrapper"
profile = "native-cocotb"
description = "OFFICIAL: smc_wrapper (smc + smc_ip_integration) cocotb smoke via shared SmcEnv"
default_tool = "verilator"
tools = ["vcs", "verilator", "xcelium"]

[testlist]
# Reuse the bare-smc catalog (smoke / all groups). Elaboration remains under
# testlists/wrapper.toml for the cocotb/wrapper/ entry point.
path = "testlists/all.toml"
format = "toml_list"

[native.stages.clean]
kind = "clean"
paths = [
  "{run_dir}",
  "hw/sys/smc/dv/build/cocotb_wrapper",
  "hw/sys/smc/dv/build/work_wrapper",
]

[build]
top_module = "smc_wrapper_uvm_top"
top_file = "hw/sys/smc/dv/tb/tb_wrapper_top.sv"
filelist = "hw/sys/smc/dv/build/smc_wrapper_dut_compile.f"
bender_filelist = "hw/sys/smc/dv/build/smc_wrapper_bender.f"
work_dir = "hw/sys/smc/dv/build/work_wrapper"
common_bender_targets = [
  "tech_cells_generic_exclude_deprecated",
  "tech_cells_generic_exclude_tc_sram",
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "idma_rtl",
  "register_interface_l1",
]
# smc + smu_oss_wrapper pulls OSS models/integration; smc_wrapper adds
# smc_wrapper.sv; open_source_dv_files supplies OSS efuse_bank_model.
bender_targets = ["smc", "smu_oss_wrapper", "smc_wrapper", "open_source_dv_files"]
incdirs = [
  "hw/sys/sep/dv/shims/prim",
  "hw/sys/smc/dv/tb",
]
exclude_files = [
  "hw/oss-example/wrapper/smc/smc_padring_ext.sv",
  "hw/oss-example/wrapper/smu/smu_wrapper.sv",
  "hw/oss-example/wrapper/sep/sep_ip_integration.sv",
  "hw/oss-example/meta/registers/rtl/och_sep_spi_mux_ctrl_ot_reg_pkg.sv",
  "hw/oss-example/meta/registers/rtl/och_sep_spi_mux_ctrl_ot_reg.sv",
  "deps/i3c-core",
]
stubs = [
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync2.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/prim_sync3.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/smc_dfx_ctrl_status_wrap.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/smc_subsystem_resets.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/smc_cool_reset_wrap.sv",
  "hw/sys/smc/dv/tb/verilator_stubs/smc_reset_unit.sv",
]
sources = [
  "hw/sys/smc/dv/models/mem/tb_smc_output_mem_responder.sv",
  "hw/sys/smc/dv/models/mem/tb_smc_i3c_mem_responder.sv",
]

[build.verilator]
disable_public_flat_rw = true
public_scope = "hw/sys/smc/dv/tb/smc_wrapper_public_scope.vlt"
low_mem_make = true
ccache = true

[build.options]
build_jobs = 8

[cocotb]
# Shared bare SmcEnv catalog — tb_wrapper_top matches smc_uvm_top port names.
python_root = "hw/sys/smc/dv/cocotb"
test_dir = "hw/sys/smc/dv/cocotb/tests"
python_paths = [
  "hw/common/dv/vip",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

[run_modes.smoke]
description = "smc_wrapper functional smoke (shared SmcEnv catalog)"
timeout_sec = 1800
# Use the real efuse image so fuse-sense completes via smc_ip_integration.
args = [
  "+smc_efuse_hex={repo_root}/hw/sys/smc/dv/assets/smc_efuse_default.hex",
  # Satisfy OCAH4CORECluster_rom_ext (+rom_hex) under +define+SIM; FW tests
  # may override via +smc_rom_hex backdoor into the same prim_rom.mem.
  "+rom_hex={repo_root}/hw/sys/smc/dv/assets/smc_rom_default.hex",
]

[targets.default]
description = "OSS smc_wrapper cocotb target"
build_dir = "hw/sys/smc/dv/build/cocotb_wrapper"
defines = [
  "SYNTHESIS",
  "SIM",
]

[targets.default.tools.verilator]
flags = [
  "-Wno-BLKLOOPINIT",
  "+define+VERILATOR",
  "+define+ASSERTS_OFF",
]
