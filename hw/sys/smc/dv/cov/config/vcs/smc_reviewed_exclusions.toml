#
# SMC coverage exclusions design engineering reviewed for this bench in an
# earlier repository, recorded by category against this tree's names. The
# reviewed dumps are not part of this repository; `[review]` names where they
# were reviewed. smc_reviewed_exclusions.py resolves every entry against urg's
# templates of a graded run and keeps only the points that run's raw report
# leaves uncovered; gen_smc_cov_exclusions.py and
# gen_smc_ports_only_exclusions.py write them into the file each class names.
# The toggle nets of a [[unit]] are planned by smc_toggle_exclusions.py and
# written by gen_smc_toggle_exclusions.py, gated the same way.
# README.md states every class.
#
# [[object]]: a module or an instance (`[*]` for any index) and the toggle
#   signals (`[*]` any index, `p.*` every field under p, `*` every signal),
#   bit or part selects with their direction, line blocks by statement text,
#   FSM states or transitions (`*` for all) and condition rows it covers.
# [[unit]]: an instance graded on its ports: its own ports stay graded, and
#   its internal signals and every instance beneath it are excluded while
#   uncovered.
# Every entry carries its class, whose fact, retiring condition and reviewer
# apply to it, and the reviewed file it comes from.

schema_version = 1

[review]
repository = "tt-oca-hw"
commit = "cb678bff"
path = "dv/smc/tb/tb_uvm/exclusion_files"
reviewer = "DE + DV peer"
files = [
  "smc_chiplet_synced/smc_exclusions_path_valid.el",
  "smc_synced_fullexclude.fsm.el",
  "smc_synced_module_filtered.tgl.el",
  "smc_synced_module_filtered.line.el",
  "smc_synced_module_filtered.fsm.el",
  "smc_synced_inst_filtered.tgl.el",
  "smc_cluster.el",
  "smc_filter.el",
  "smc_env_apb_axi_if.el",
  "uart_log_engine_rep0_self_toggle_exclusions.el",
  "uart_log_engine_rep0_wrapper_toggle_exclusions.el",
]
# Inside a [[unit]], a PeakRDL register block's points and every FSM point take
# these classes, so they land in the register-block and FSM files.
unit_regblock_class = "A13-REGBLOCK-IN-PORTS-ONLY-UNIT"
unit_fsm_class = "F11-FSM-IN-PORTS-ONLY-UNIT"

[[class]]
id = "A12-REGBLOCK-FIELDS-REVIEWED"
file = "smc_regblock_exclusions.el"
fact = "design engineering reviewed these PeakRDL register-block fields and interface bits as not exercised by the SMC bench."
retired_by = "an enrolled leaf that covers the point, or design engineering withdrawing the review"
reviewer = "DE + DV peer"

[[class]]
id = "A13-REGBLOCK-IN-PORTS-ONLY-UNIT"
file = "smc_regblock_exclusions.el"
fact = "this PeakRDL register block sits inside a unit graded on its ports (a T-series class), which design engineering reviewed excluding whole; its line blocks and condition rows are excluded while uncovered, and its toggle nets go with the unit's."
