#
# SMC VCS coverage policy, the counterpart of hw/sys/sep/dv/cov/config/vcs/
# coverage_policy.toml. It names the exclusion files the report applies; no
# family carries a floor, the runner prints every family and grades nothing on
# this flow.

schema_version = 1
dut = "smc"
scope_epoch = "smc-vcs-cov-v1"

# Register block structural facts: A1 NO-STALL and A2 NO-ERROR across the
# PeakRDL blocks, plus A3 NO-READ-CHANNEL, A4 READ-NEVER-ERRORS and A5
# INPUT-UNCONNECTED, which belong to one block each, and A6 SINGLEPULSE-RETAIN,
# the retain row of a field the RDL declares singlepulse, A7 SINGLEPULSE-LOADS,
# the load-skipping path of such a field's flop, and C1 CONTRADICTORY-PATH, a
# branch path whose own decisions contradict. B1 PARTIAL-LANE-WRITE
# joins them and is the bench's own: the AXI agent writes whole 32-bit words, so
# on a block whose cpuif is no wider no write-branch row that needs a lane off
# has an access behind it here. A block with a wider cpuif takes a half-word
# write from the same agent and keeps those rows graded.
# B7 DFX-INPUTS-TIED is the bench's too: it ties the four DFX status inputs the
# boot sequencer waits on high, so their input-low arms have no stimulus.
# The file header and the generator's docstring state them.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_regblock_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# XOR reduction networks (CRC, parity): condition coverage enumerates 2^n
# input combinations of a function the tests compare by its output.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_xor_network_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]


# FSM facts (F2 DEFAULT, F3 TIEOFF, F4 PARAM-OFF, F5 RESET-EDGE, F6
# ENABLE-EDGE, F7 SCL-HELD-LOW, F8 NO-INTERFERENCE, F9 LOOP-INDEX-EXTRACTION): the always_comb default read as an edge from every state, the
# states a write master cannot reach because the integration ties its response
# inputs to zero, a decode state whose arm a parameter leaves unelaborated, the
# edges that exist only as a state register's reset assignment, and the one an
# enable-edge load cannot supply, the I2C fan-in overrides a state holding SCL
# low cannot take, and those a state that never drives the bus cannot. B2
# UNAIMED-OVERRIDE is the bench's own: the rest of those override edges wait on
# a bus event or write landing in a chosen sub-bit state, which the bench cannot
# place. F9 is the extraction's: a combinational loop index is not a state. B4
# is the bench's: it ties the CPU SRAM auto-init bypass high.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_fsm_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Features the integration leaves out (P1 NTRACE-OFF, P2 SKIP-TIED-OFF, P3
# WREN-TIED, P4 SINGLE-SOURCE, P5 INSTR-TYPE-CONST, P6 LC-STATE-OFF, P7
# NO-ERROR-CAP, P8 WREN-TIED-ZERO, P9 DEBUG-WIDTH-64, P10
# PACKET-SHORTER-THAN-BANK, P11 UART-SELF-CHECK, P12 BREAK-IMPLIES-FRAMING, P13
# CLAMP-TIED, P14 JTAG-MMR-TIED, P15 SECURE-TM-TIED, P16 SINK-ENABLE-CONST, P17
# ONE-TRACE-CORE, P18 TDR-OVERRIDE-TIED, P19 NTR-RAM-READ-TIED, P20
# TCOUNT-SELECT-PAIRED, P22 DFD-CONTROL-TIED, P24 DIVIDER-INIT-NEVER-SET, C5
# SIGNAL-IDENTITY, and F3
# TIEOFF's branch paths; B6 SIM-ONLY-FUSE-BYPASS is the bench's and its
# policy's, as no leaf passes the simulation-only +skip_fuse_sense plusarg the
# DV policy forbids, and B8 DFD-BENCH-INPUTS-TIED is the bench's, which ties the
# CLA crosstrigger and TDR clock-stop inputs, as B9 SECURITY-DISABLE-TIED
# is for the eFuse security-disable input): the
# DFD clamps, JTAG MMR requester, eFuse secure test mode and AVS TDR override
# are tied off, the sink enables and trace
# core count are fixed by parameters, and the
# trace wrapper is
# instantiated with zero
# N-trace instances, the AXI filter with its skip input tied to zero, the eFuse
# without lifecycle state and the iDMA backend without error handling, and the
# CLA holds one reserved write enable at the zero its write structure gives it
# and leaves the snapshot Hi half unelaborated at a 64-bit debug bus, and a VLT
# packet is shorter than an accumulator bank, so those conditions have no
# stimulus.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_disabled_feature_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Toggle inside units of OpenTitan origin (T1 OPENTITAN-PORTS-ONLY). A unit
# that comes from OpenTitan is graded on its ports, its internals being verified
# upstream, while every other unit the scope keeps is graded on all of its nets. `-cm_tgl portsonly` is a whole-run option and
# cannot say that per unit, so the nets are excluded at report time instead.
# gen_smc_opentitan_toggle_exclusions.py writes the file and checks each unit's
# copyright line; README.md lists the ten units.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_opentitan_toggle_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Covergroups declared inside vendored RTL. `-cm_hier` does not reach
# covergroups, so the six I3C controllers' groups would otherwise sit in urg's
# GROUP score beside SMC's own cov/sv covergroups. Regenerated from urg's group
# exclusion template by gen_smc_group_exclusions.py; README.md lists the class.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_group_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]
