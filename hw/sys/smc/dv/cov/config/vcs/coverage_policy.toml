#
# SMC VCS coverage policy, the counterpart of hw/sys/sep/dv/cov/config/vcs/
# coverage_policy.toml. It names the exclusion files the report applies; no
# family carries a floor, the runner prints every family and grades nothing on
# this flow.

schema_version = 1
dut = "smc"
scope_epoch = "smc-vcs-cov-v1"

# PeakRDL register-block structural facts (A1 to A11, C1, C3, C4), the bench's
# own B1 and B7, and the reviewed A12 and A13 from smc_reviewed_exclusions.toml.
# README.md states each class's fact, under "Exclusion files" and "Exclusions
# design engineering reviewed".
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_regblock_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# XOR reduction networks, class X1. README.md, "Exclusion files".
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_xor_network_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# FSM extraction and tie-off facts (F2 to F9), the bench's own B2 and B4, and
# the reviewed F10 and F11 from smc_reviewed_exclusions.toml. README.md,
# "Exclusion files" and "Exclusions design engineering reviewed".
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_fsm_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Features the integration leaves out and the condition facts that follow from
# them (P1 to P31, C5 to C16, D1, D2, A3, A11, C4, F3), plus the bench's own B6,
# B8, B9 and B12 to B14. README.md, "Exclusion files" and "Why these
# exclusions".
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_disabled_feature_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Toggle rows of the classes whose fact names a whole signal or a bit window,
# split by scope: the module file holds the rows true of every instance of a
# module, the instance file those true of one instance. T1 to T12, UNION-ALIAS,
# EFUSE-IMAGE-COPY, EFUSE-FIELD-MAP-CONST, VERSION-ID-CONST, ERR-SLV-CONST,
# ATOP-ZERO, EXT-IRQ-TIED and PARTIAL-VECTOR; README.md, "Toggle granularity"
# and "Units graded on their ports", gives each class's fact and granularity.
# Only the bit-directions the graded run leaves uncovered are written, so both
# files are regenerated from each graded run.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_toggle_module_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_toggle_instance_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# The line blocks and condition rows inside the ports-only units T2 to T12,
# which smc_reviewed_exclusions.toml records; their toggle points are in the two
# files above. The file is regenerated from each graded run. README.md, "Units
# graded on their ports".
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_ports_only_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Covergroups declared inside vendored RTL, class GROUP-VENDORED-I3C: `-cm_hier`
# does not reach covergroups, so the six I3C controllers' groups would otherwise
# sit in urg's GROUP score beside SMC's own. Regenerated from urg's group
# exclusion template. README.md, "Exclusion files".
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_group_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Fields design engineering reviewed as not exercised by this bench, R1 to R9 by
# family, recorded in smc_reviewed_exclusions.toml. Report-gated per bit and
# direction and regenerated from each graded run. README.md, "Exclusions design
# engineering reviewed".
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_reviewed_field_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# The code-coverage points a formal unreachability analysis over the `hosted fw`
# regression's merged coverage database proves no stimulus reaches in the
# bench's environment (SMC_FCOV.adoc, Unreachability exclusion list); URG
# applies it at report time and applies no entry whose scope checksum differs
# from the reported design. The digest pins the file: a regenerated list takes
# a new entry.
[[native_files]]
tool = "vcs"
role = "unreachable"
path = "smc_unreachable.el"
apply_phase = "report"
args = ["-elfile", "{path}"]
sha256 = "d9f63fedf8bbe2f3ada6d8bfe9a16ce9927061cb9c49717b934656059b675c9c"

# urg reports the cov/sv cover properties under `user`; the runner grades the
# family by the tool's own figure. This file carries no `[[holes]]` row for
# it: every collected point is hit by an enrolled leaf, and a point this bench
# cannot reach sits in Phase 2 and is not collected (SMC_FCOV.adoc). The three
# smc_axi_chan_fcov instances under smc_fabric_fcov (u_sep_in, u_sys_in,
# u_jtag_axi) are separate hierarchies here, so a selector on one of them
# names one manager.
