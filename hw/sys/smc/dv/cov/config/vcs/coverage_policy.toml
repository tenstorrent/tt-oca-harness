#
# SMC VCS coverage policy, the counterpart of hw/sys/sep/dv/cov/config/vcs/
# coverage_policy.toml. It names the exclusion files the report applies; no
# family carries a floor, the runner prints every family and grades nothing on
# this flow.

schema_version = 1
dut = "smc"
scope_epoch = "smc-vcs-cov-v1"

# Register block structural facts: A1 NO-STALL and A2 NO-ERROR across the
# PeakRDL blocks, plus A3 NO-READ-CHANNEL, A4 READ-NEVER-ERRORS and A5
# INPUT-UNCONNECTED, which belong to one block each, and A6 SINGLEPULSE-RETAIN,
# the retain row of a field the RDL declares singlepulse. The file header and
# the generator's docstring state them.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_regblock_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# XOR reduction networks (CRC, parity): condition coverage enumerates 2^n
# input combinations of a function the tests compare by its output.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_xor_network_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]


# FSM facts (F1 LOOPVAR, F2 DEFAULT, F3 TIEOFF, F4 PARAM-OFF, F5 RESET-EDGE,
# F6 ENABLE-EDGE): a loop variable reported as an FSM, the always_comb default
# read as an edge from every state, the states a write master cannot reach
# because the integration ties its response inputs to zero, a decode state whose
# arm a parameter leaves unelaborated, the edges that exist only as a state
# register's reset assignment, and those an enable-edge load cannot reach.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_fsm_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Features the integration leaves out (P1 NTRACE-OFF, P2 SKIP-TIED-OFF, P3
# WREN-TIED, P4 SINGLE-SOURCE, P5 INSTR-TYPE-CONST, P6 LC-STATE-OFF, P7
# NO-ERROR-CAP, P8 WREN-TIED-ZERO): the trace wrapper is instantiated with zero
# N-trace instances, the AXI filter with its skip input tied to zero, the eFuse
# without lifecycle state and the iDMA backend without error handling, and the
# CLA holds one reserved write enable at the zero its write structure gives it,
# so those conditions have no stimulus.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_disabled_feature_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Covergroups declared inside vendored RTL. `-cm_hier` does not reach
# covergroups, so the six I3C controllers' groups would otherwise sit in urg's
# GROUP score beside SMC's own cov/sv covergroups. Regenerated from urg's group
# exclusion template by gen_smc_group_exclusions.py; README.md lists the class.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_group_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]
