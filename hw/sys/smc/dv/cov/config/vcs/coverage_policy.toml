#
# SMC VCS coverage policy, the counterpart of hw/sys/sep/dv/cov/config/vcs/
# coverage_policy.toml. It names the exclusion files the report applies; no
# family carries a floor, the runner prints every family and grades nothing on
# this flow.

schema_version = 1
dut = "smc"
scope_epoch = "smc-vcs-cov-v1"

# Register block structural facts: A1 NO-STALL and A2 NO-ERROR across the
# PeakRDL blocks, plus A3 NO-READ-CHANNEL, A4 READ-NEVER-ERRORS and A5
# INPUT-UNCONNECTED, which belong to one block each. The file header and the
# generator's docstring state them.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_regblock_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# XOR reduction networks (CRC, parity): condition coverage enumerates 2^n
# input combinations of a function the tests compare by its output.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_xor_network_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]


# FSM facts (F1 LOOPVAR, F2 DEFAULT, F3 TIEOFF, F4 PARAM-OFF, F5 RESET-EDGE): a
# loop variable reported as an FSM, the always_comb default read as an edge from
# every state, a write master whose response inputs the integration ties to zero,
# a decode state whose arm a parameter leaves unelaborated, the edges that
# exist only as a state register's reset assignment, and those an enable-edge
# load cannot reach.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_fsm_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# A feature the build leaves out (P1 NTRACE-OFF): the trace wrapper is
# instantiated with zero N-trace instances, so the trace sink's N-trace half
# has no source and its conditions no stimulus.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_disabled_feature_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]

# Covergroups declared inside vendored RTL. `-cm_hier` does not reach
# covergroups, so the six I3C controllers' groups would otherwise sit in urg's
# GROUP score beside SMC's own cov/sv covergroups. Regenerated from urg's group
# exclusion template by gen_smc_group_exclusions.py; README.md lists the class.
[[native_files]]
tool = "vcs"
role = "exclude"
path = "smc_group_exclusions.el"
apply_phase = "report"
args = ["-elfile", "{path}"]
