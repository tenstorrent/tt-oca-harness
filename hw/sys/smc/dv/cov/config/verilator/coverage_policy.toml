#
# SMC Verilator coverage policy.
#
# Two mechanisms, do not confuse them:
#
#   smc_cov_scope.vlt   `coverage_off` -> the point never enters the database.
#                       Structural OUT: code this DUT does not own.
#   [[holes]] here      the point exists and is not hit, carried with a
#                       category, a rationale and an owner.
#
# Scope: smc_cov_scope.vlt drops the chipyard-generated CPU cluster, TB code and
# most vendored RTL at compile time, following the SEP precedent
# (hw/sys/sep/dv/cov/config/vcs/README.md). Third-party RTL and the generated
# CPU cluster dominate the unscoped denominator. The gap: `coverage_off -file
# "*vendor/*"` does not reach vendor/pulp-platform/** or
# vendor/tenstorrent/tt-hw-debug/**, so those stay in the denominator; no file
# pattern reaches them (see cov/config/vcs/README.md).
#
# `hw/ip/**` stays in scope: it is Tenstorrent IP that SMC integrates, and
# integration coverage of those blocks is part of what SMC-level DV is for.
#
# The scoped number is "the SMC DUT minus the CPU cluster, the I3C core, the
# lowRISC prims and TB code" -- not "SMC coverage". Quote it that way.
#
# Public gate is the `user` family: every `cov/sv` point is hit or classified.
# `max_unclassified_points = 0` on that row fails a new unclassified user hole.
# line / branch / expression floors are regression guards only and do not set
# that knob: those families still have unclassified vendor and generated-CPU
# points that `smc_cov_scope.vlt` cannot drop.
#
# The coverage set is `--items hosted fw`: the package regression `all`
# less the three `dual` leaves, which elaborate a second build target that
# the coverage merge cannot combine with `default` (SEP names its coverage
# set the same way, `all` less `rom_fw`). `hosted` alone is the
# toolchain-free CI tier; the fw leaves carry the PLIC, I2C, UART and OCTS
# stimulus that no hosted leaf drives.
#
# Floors: line 78.0 / branch 75.9 / expression 69.0 were set from the
# hosted measurement (Verilator 5.050, 168 leaves: line 78.0977,
# branch 75.9964, expression 69.0966) and stay as regression guards; the
# `hosted fw` measurement (192 leaves) read line 97.50, branch
# 89.07, expression 86.46 and user 407 of 467. Every collected `user`
# point is expected to be hit by an enrolled leaf; a point this bench cannot
# legally reach is not collected (see the Phase 2 list in SMC_FCOV.adoc)
# rather than waived here. The `[[holes]]` below are the three points that
# remain: one blocked by a spec-versus-RTL disagreement on NEXT_ID, and two
# that Verilator alone cannot observe (the VCS run records them).
#
# Hole categories in this file:
#   missing_stimulus  no enrolled test drives the condition; the rationale
#                     names the cell and, where one is proposed, the test.
#   needs_review      the cell is blocked by an open spec finding (SF-nnn in
#                     SMC_SPEC_REVIEW); the point stays on the implemented
#                     behaviour and takes no credit until it is answered.
#   unreachable       no stimulus this bench can present can satisfy the
#                     point (the rationale names the blocking path).
# Selectors are exact hierarchies with expected_matches = 1; a point that
# starts firing makes the grade fail loudly, which is intended.

schema_version = 1
dut = "smc"
scope_epoch = "smc-fcov-v1"

[[thresholds]]
id = "smc-user-effective"
tool = "verilator"
metric_family = "user"
population = "effective"
minimum_percent = 100.0
max_unclassified_points = 0

[[thresholds]]
id = "smc-line-effective"
tool = "verilator"
metric_family = "line"
population = "effective"
minimum_percent = 78.0

[[thresholds]]
id = "smc-branch-effective"
tool = "verilator"
metric_family = "branch"
population = "effective"
minimum_percent = 75.9

[[thresholds]]
id = "smc-expression-effective"
tool = "verilator"
metric_family = "expression"
population = "effective"
minimum_percent = 69.0

[[holes]]
id = "fcov-smc-c_next_id_0_zero_on_invalid_setup"
title = "c next id 0 zero on invalid setup"
category = "missing_stimulus"
disposition = "cover"
status = "open"
confidence = "medium"
rationale = "blocked by the point model: NEXT_ID_0 reads the idma transfer-id generator directly (idma_transfer_id_gen.sv resets next_q to 2 and wraps to 1 or 2 on overflow) and the reg frontend presents it unconditionally for an implemented stream, so the register can never read 0 and the point cannot be satisfied by any stimulus (SMC-DMA-STREAM0.S2:next-id-0-zero-on-invalid-setup)"
owner = "smc-dv"
reviewer = "smc-dv"
issues = ["https://github.com/tenstorrent/tt-oca-harness/issues/2420"]
expected_matches = 1
[[holes.native]]
tool = "verilator"
metric_family = "user"
hierarchy = "smc_uvm_top.u_smc_dma_fcov.c_next_id_0_zero_on_invalid_setup"

[[holes]]
id = "fcov-smc-c_i2c0_scl_contention"
