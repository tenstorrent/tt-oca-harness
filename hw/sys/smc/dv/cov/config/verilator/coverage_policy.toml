title = "c done0 cleared after read"
category = "missing_stimulus"
disposition = "waive"
status = "accepted"
confidence = "medium"
rationale = "blocked by the point model: DONE_0 reads the monotonic retired-transfer counter (idma_transfer_id_gen.sv resets completed_q to 1 and wraps to 1 or 2), so it never returns to 0 and a read does not clear it; the point requires the register to read 0 on a read strobe whose previous sample was non-zero, which no stimulus can produce (SMC-DMA-STREAM0.S3:done0-cleared-after-read)"
