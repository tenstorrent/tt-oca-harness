[[holes]]
id = "fcov-smc-c_bresp_exokay"
title = "c bresp exokay"
category = "unreachable"
disposition = "waive"
status = "accepted"
confidence = "medium"
rationale = "unreachable from this bench boundary: EXOKAY is an exclusive-access response, and every inbound manager reaches the local fabric through axi_to_axi_lite (smc_local_xbar.sv:214,285,358), whose AXI4-Lite master side has no lock and no exclusive monitor; nothing in the SMC hierarchy instantiates an exclusive-capable subordinate (axi_to_mem is used only in sep.sv). A SEP_IN write issued with AxLOCK=1 was answered OKAY, not EXOKAY"
owner = "smc-dv"
reviewer = "smc-dv"
date = "2026-09-11"
expires = "2026-12-10"
expected_matches = 1
[[holes.native]]
tool = "verilator"
metric_family = "user"
hierarchy = "smc_uvm_top.u_smc_fabric_fcov.u_*.c_bresp_exokay"

