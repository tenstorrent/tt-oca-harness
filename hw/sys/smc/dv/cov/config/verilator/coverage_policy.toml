[[holes]]
id = "fcov-smc-c_data_phase_beat_count_matches_addresses"
title = "c data phase beat count matches addresses"
category = "missing_stimulus"
disposition = "waive"
status = "accepted"
confidence = "medium"
rationale = "blocked by the point model: the address and beat counters are cleared by trigger_starts_e in the same sample in which the zeroer asserts mst_awvalid in ST_ISSUE_ADDR, so the first accepted address beat is dropped and aw_count_q is 0 at the return to idle; measured with completed 1-beat and 256-beat operations, which reach c_return_to_idle but not this point (SMC-ZERO-FSM.S3:data-phase-beat-count-matches-addresses). SYS_OUT AW/W ready backpressure does not reach the zeroer: the shared accelerator axi_mux registers the address channel (smc_data_accelerator_wrap.sv SpillAw), and with a 4-cycle SYS_OUT AW/W stall the zeroer's own aw_ready stayed high for the whole operation (1 address beat accepted, 0 stalled). Counting the first address beat needs it to lose arbitration in that exact sample, which only a concurrent DMA address beat can cause"
owner = "smc-dv"
reviewer = "smc-dv"
date = "2026-09-11"
expires = "2026-12-10"
expected_matches = 1
[[holes.native]]
tool = "verilator"
metric_family = "user"
hierarchy = "smc_uvm_top.u_smc_zeroer_fcov.c_data_phase_beat_count_matches_addresses"
