id = "fcov-smc-c_sep_in_wstrb_none"
title = "c sep in wstrb none"
category = "unreachable"
disposition = "waive"
status = "accepted"
confidence = "medium"
rationale = "the bench AXI manager cannot present the beat: the cocotbext AXI4 master derives WSTRB from the byte range the payload covers, so a W beat exists only because it carries enabled bytes and an all-zero strobe is never driven, and ocah_axi_master_driver.py:354-362 rejects any partial strobe outright (the backend supports contiguous writes only). Driving one raw AW/W pair on the channel sources beside the engine is not available either: the engine's own B-response task asserts on a response whose ID it did not issue"
owner = "smc-dv"
reviewer = "smc-dv"
date = "2026-09-11"
expires = "2026-12-10"
expected_matches = 1
