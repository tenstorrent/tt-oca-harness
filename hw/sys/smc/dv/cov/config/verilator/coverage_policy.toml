#
# SMC Verilator coverage policy.
#
# Two mechanisms, do not confuse them:
#
#   smc_cov_scope.vlt   `coverage_off` -> the point never enters the database.
#                       Structural OUT: code this DUT does not own.
#   [[holes]] here      the point exists and is not hit, carried with a
#                       rationale, an owner and an expiry date.
#
# Scope: smc_cov_scope.vlt drops the chipyard-generated CPU cluster, TB code and
# most vendored RTL at compile time, following the SEP precedent
# (hw/sys/sep/dv/cov/config/vcs/README.md). Third-party RTL and the generated
# CPU cluster dominate the unscoped denominator. The gap: `coverage_off -file
# "*vendor/*"` does not reach vendor/pulp-platform/** or
# vendor/tenstorrent/tt-hw-debug/**, so those stay in the denominator; no file
# pattern reaches them (see cov/config/vcs/README.md).
#
# `hw/ip/**` stays in scope: it is Tenstorrent IP that SMC integrates, and
# integration coverage of those blocks is part of what SMC-level DV is for.
#
# The scoped number is "the SMC DUT minus the CPU cluster, the I3C core, the
# lowRISC prims and TB code" -- not "SMC coverage". Quote it that way.
#
# Public gate is the `user` family: every `cov/sv` point is hit or classified.
# `max_unclassified_points = 0` on that row fails a new unclassified user hole.
# line / branch / expression floors are regression guards only and do not set
# that knob: those families still have unclassified vendor and generated-CPU
# points that `smc_cov_scope.vlt` cannot drop.
#
# Floors are the effective percentages of a measured
# `--dut smc --items hosted --cov` run (Verilator 5.050) taken when that
# group listed 168 leaves: line 78.0977, branch 75.9964, expression
# 69.0966, user 100.0. This file carries 54 accepted user `[[holes]]`
# rows (every `expected_matches` is 1). This tree's `hosted` group
# lists 176.
#
# The holes below were measured from `--dut smc --items hosted --cov`.
#
# Hole categories in this file:
#   missing_stimulus  no enrolled test drives the condition; the rationale
#                     names the cell and, where one is proposed, the test.
#   needs_review      the cell is blocked by an open spec finding (SF-nnn in
#                     SMC_SPEC_REVIEW); the point stays on the implemented
#                     behaviour and takes no credit until it is answered.
#   unreachable       no stimulus this bench can present can satisfy the
#                     point (the rationale names the blocking path).
# Selectors are exact hierarchies with expected_matches = 1; a point that
# starts firing makes the grade fail loudly, which is intended.

