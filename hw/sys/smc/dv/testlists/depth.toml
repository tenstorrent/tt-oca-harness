[[tests]]
name = "smc_cpu_firmware_boot_test"
module = "smc_cpu_firmware_boot_test"
seed = 1
timeout_sec = 3600
tags = ["ci", "vplan_gap", "cpu_depth", "u3_fw_boot", "pyuvm"]
run_modes = ["smoke"]
# {repo_root} paths: simulator cwd is attempt_*/make, not the repo root.
# SMC_002 card: real fuse sense (no +skip_fuse_sense); ROM-only boot
# (no +smc_scratch_ram_hex) so CHK-ROM-IS-TARGET / CHK-EFUSE-SENSE-DONE hold.
# +smc_hold_cpu_boot: keep pad57 boot_stall from t=0 until the sequence
# programs RESET_VECTOR then releases (prevents fetch before revector).
# min_pass.rom.hex: sync-free RV64 stub at ROM window (writes 0xACAFACA1).
# Both +rom_hex and +smc_rom_hex point at min_pass so the smoke-mode
# default smc_rom_default.hex cannot remain the sole identity (OCAH loads
# the first +rom_hex; smc_cpu_mem_dv then prefers +smc_rom_hex).
args = [
    "+smc_hold_cpu_boot",
    "+smc_rom_hex={repo_root}/hw/sys/smc/dv/assets/min_pass.rom.hex",
    "+rom_hex={repo_root}/hw/sys/smc/dv/assets/min_pass.rom.hex",
]

