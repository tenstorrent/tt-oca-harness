schema_version = 1

# Lifecycle and DFT boot-refusal tests, ported from the reference
# `Main_SMC_BL0_Regression_Small`. What these have in common is that the testbench has to
# change something the dual bench used to hold constant: the target's lifecycle state, or
# its BISR/MBIST reporting. Both are now per-instance inputs of smc_dual_inst.
#
# smc_occp_jump_rejection_test rides the rom-only driver with one extra plusarg, because a
# secure lifecycle is the only difference between it and the rest of that family. The other
# three have their own drivers: the ROM is expected to refuse to boot, so a gate that waits
# for TEST_PASS would never fire.
#
# +FORCE_STATUS_REPORTING, +PLL_DISABLE_HACK and +SEP_RING_BUFFER_RANDOM_DISABLE are not
# carried: they are straps or reference-TB knobs with no consumer here. +BOOT_I3C is
# carried but selects nothing, since no strap is readable in this bench -- the rom-only
# testlist records both in full. One plusarg is specific to this file:
#   +FORCE_ROM_MEM_DFT   programs the reference's MBIST eFuse fields and clears its
#                        mem-repair bypass strap. The production ROM reads neither -- its
#                        early check consults only the bypass strap and DFX_CTRL_STATUS --
#                        and this bench drives those status lines from the test module, so
#                        there is nothing for a plusarg to switch on.

[[tests]]
name = "smc_occp_jump_rejection_test"
module = "smc_occp_rom_only_test"
target = "dual"
seed = 1
timeout_sec = 7200
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_jump_reject", mode = "occp_rom_only" }
# +lc_state=1 is the reference's +SECURE_MODE=1: is_secure_mode() in
# fw/common/occp/occp_interfaces.c reads CHIP_CONFIG.LC_STATE and treats 1 and 8 as secure.
# Without it this test runs on the unsecure default and the ROM has no reason to reject
# the jump, so the entry would pass for the wrong reason.
args = [
    "+BOOT_I3C",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_jump_reject.rom.hex",
    "+occp_case=smc_occp_jump_rejection_test",
    "+lc_state=1",
    "+rom_test_timeout=200000000",
]

[[tests]]
name = "smc_rom_invalid_lc_state_test"
module = "smc_rom_invalid_lc_state_test"
target = "dual"
seed = 1
timeout_sec = 7200
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_master", mode = "occp_rom_only" }
# No +lc_state: the illegal value is drawn from 0x9..0xF per run, as the reference does.
args = [
    "+BOOT_I3C",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_master.rom.hex",
    "+rom_test_timeout=1000000000",
]

