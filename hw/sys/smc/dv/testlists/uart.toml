schema_version = 1

# BFM rebuilds of the commercial UART depth tests.
[[tests]]
name = "smc_uart_fifo_basic_trigger_reset_test"
module = "smc_uart_fifo_basic_trigger_reset_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "uart", "depth", "pyuvm"]
run_modes = ["smoke"]

[[tests]]
name = "smc_uart_irq_sources_priority_test"
module = "smc_uart_irq_sources_priority_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "uart", "depth", "pyuvm"]
run_modes = ["smoke"]

[[tests]]
name = "smc_uart_error_conditions_test"
module = "smc_uart_error_conditions_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "uart", "depth", "pyuvm"]
run_modes = ["smoke"]
args = ["+smc_uart_cross_3to0"]

[[tests]]
name = "smc_uart_baud_word_parity_format_test"
module = "smc_uart_baud_word_parity_format_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "uart", "depth", "pyuvm"]
run_modes = ["smoke"]

[[tests]]
name = "smc_uart_extremes_misc_test"
module = "smc_uart_extremes_misc_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "uart", "depth", "pyuvm"]
run_modes = ["smoke"]

[[tests]]
name = "smc_uart_sanity_test"
module = "smc_uart_sanity_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "uart", "depth", "pyuvm"]
run_modes = ["smoke"]
args = ["+smc_uart_cross_3to0"]

# Log-engine INTR_ENABLE masks irq_o only: INTR_STATUS latches while masked
# and clears only on W1C.
[[tests]]
name = "smc_log_engine_intr_mask_test"
module = "smc_log_engine_intr_mask_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "uart", "pyuvm"]
run_modes = ["smoke"]

[[groups]]
name = "uart"
tests = [
    "smc_uart_fifo_basic_trigger_reset_test",
    "smc_uart_irq_sources_priority_test",
    "smc_uart_error_conditions_test",
    "smc_uart_baud_word_parity_format_test",
    "smc_uart_extremes_misc_test",
    "smc_uart_sanity_test",
    "smc_log_engine_intr_mask_test",
]

[[tests]]
name = "smc_uart_spi_log_engine_test"
module = "smc_uart_spi_log_engine_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "pyuvm"]
run_modes = ["smoke"]

[[tests]]
name = "smc_uart_log_engine_reg_rw_test"
module = "smc_uart_log_engine_reg_rw_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "depth_uart_log", "pyuvm"]
run_modes = ["smoke"]

[[tests]]
name = "smc_uart_loopback_test"
module = "smc_uart_loopback_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "depth_uart_log", "pyuvm"]
run_modes = ["smoke"]

[[groups]]
name = "depth_uart_log"
tests = [
    "smc_uart_log_engine_reg_rw_test",
]
