schema_version = 1

# Deferred SMC OSS tests — NOT included by testlists/all.toml.
#
# BLOCKER tags:
#   needs_i3c_dat_dct  — TB I3C prim_ram removed; needs real DAT/DCT macros
#                        (smc_wrapper / smu_wrapper boundary; integration
#                        passthrough — product gap)
#   needs_dtp_csr_sub  — smc_wrapper TB only: DTP err_slv removed; idle
#                        axil_dtp_csr_resp. NOT an SMU gap (smu.sv wires DTP).
#   rtl_placeholder    — exercises pll/pvt OKAY wraps only (adopter IP pending)
#   fake_bfm           — Python fake BFM retired
#   tb_glue / not_dut_rtl — TB-only demo (e.g. hardcoded capture token); not DUT RTL

