schema_version = 1
# Dual-SMC bring-up: the three leaves that elaborate `target = "dual"`
# ([targets.dual] in smc_sim_cfg.toml: tb_top.sv built with `SMC_DUAL`, so a
# second SMC instance and the shared I3C bus exist). Every entry loads a ROM or
# firmware image, so none is toolchain-free. `dual` is one of the three class
# groups that partition `all` (see all.toml); the hours-long
# smc_occp_dual_unsecure_boot_test is in holdout.toml.

[[tests]]
name = "smc_dual_elaboration_test"
module = "smc_dual_elaboration_test"
target = "dual"
seed = 1
timeout_sec = 1800
tags = ["build", "dual"]
run_modes = ["dual"]
# A ROM image is mandatory even for an elaboration probe: with neither
# +rom_bin64 nor +rom_hex, OCAH4CORECluster_rom_ext $errors at time zero rather
# than leaving the array X (OCAH4CORECluster_mem_swaps.sv).
# Both instances load the production ROM here. The probe holds boot_stall while
# it checks the boot-stall contract, then releases it to check that memory init
# completes -- so the ROMs do start executing near the end of the run.
firmware = { name = "prod_rom", mode = "bootrom" }
args = [
    "+rom_bin64=prod_rom.bin64",
]

[[tests]]
name = "smc_dual_axi_sram_probe_test"
module = "smc_dual_axi_sram_probe_test"
target = "dual"
seed = 1
timeout_sec = 1800
tags = ["build", "dual"]
run_modes = ["dual"]
# Answers "can an inbound AXI manager reach the CPU scratch window", which the
# payload staging depends on, and asserts the I3C CSR instance decode. Same
# mandatory-ROM reasoning as the elaboration test above. boot_stall is released
# on both instances -- holding it keeps fuse_reset_n asserted and the CPU
# cluster in reset, so the scratch window would never answer -- which means
# both production ROMs do run during this test.
firmware = { name = "prod_rom", mode = "bootrom" }
args = [
    "+rom_bin64=prod_rom.bin64",
]

[[tests]]
name = "smc_occp_sanity_test"
# smc_occp_rom_only_test is the shared driver for the whole rom-only OCCP family:
# controller firmware drives, the target's production ROM answers, nothing is
# transferred and nothing JUMPs. Members are separated by their +bfm_rom_hex image
# and their plusargs, which is why `name` differs from `module` here.
module = "smc_occp_rom_only_test"
target = "dual"
seed = 1
# GET_VERSION plus one 4-byte OCCP WRITE -- no payload, no JUMP, so well under
# a millisecond of sim time. The bound below is headroom for a stalled
# exchange, not a target.
timeout_sec = 3600
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_sanity", mode = "occp_rom_only" }
# Two images, one per role. Bare basenames because run_dv stages every declared
# c_build output next to the simulator cwd.
#   +rom_bin64          target: production boot ROM (loaded into BOTH instances
#                       by OCAH4CORECluster_rom_ext, then overridden on u_bfm)
#   +bfm_rom_hex        controller: the occp_sanity DV image, applied to u_bfm
#                       only, at #0.3 so it wins over the shared load
#   +occp_case          label for the driver's log and assertion text
#   +rom_test_timeout   the reference environment's value. occp_sanity names no
#                       override, so it takes the 200 ms baseline that
#                       smc_rom_test_template carries in `run_flags`
#   +fuse_transport_timeout
#                       the reference's +FORCE_MIN_TRANSPORT_TIMEOUT: pin the
#                       OCCP transport timeout fuse at its minimum instead of
#                       randomising it. This is the only BL0 member that asks
#                       for it, and without it the fuse is unprogrammed on half
#                       the runs, which is a different ROM path
args = [
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_sanity.rom.hex",
    "+occp_case=smc_occp_sanity_test",
    "+rom_test_timeout=200000000",
    "+fuse_transport_timeout=400",
]

[[groups]]
# The SMC_DUAL class of `all`: every leaf with `target = "dual"`. expected_count
# fails the run when a dual leaf joins `all` and misses this class, or leaves it.
name = "dual"
expected_count = 3
tests = [
    "smc_dual_axi_sram_probe_test",
    "smc_dual_elaboration_test",
    "smc_occp_sanity_test",
]
