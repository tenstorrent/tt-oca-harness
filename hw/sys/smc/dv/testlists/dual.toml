schema_version = 1

# Dual-SMC OCCP boot catalog, run via `run_dv.py --dut smc_dual`.
# Independent of the single-instance all.toml catalog.

[[tests]]
name = "smc_dual_elaboration_test"
module = "smc_dual_elaboration_test"
seed = 1
timeout_sec = 1800
tags = ["build", "smoke", "dual"]
run_modes = ["dual"]
# A ROM image is mandatory even for an elaboration probe: with neither
# +rom_bin64 nor +rom_hex, OCAH4CORECluster_rom_ext $errors at time zero rather
# than leaving the array X (mem_swaps/4core/OCAH4CORECluster_mem_swaps.sv:267).
# Both instances load the production ROM here. The probe holds boot_stall while
# it checks the boot-stall contract, then releases it to check that memory init
# completes -- so the ROMs do start executing near the end of the run.
firmware = { name = "prod_rom", mode = "bootrom" }
args = [
    "+rom_bin64=prod_rom.bin64",
    "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
]

[[tests]]
name = "smc_dual_axi_sram_probe_test"
module = "smc_dual_axi_sram_probe_test"
seed = 1
timeout_sec = 1800
tags = ["build", "smoke", "dual"]
run_modes = ["dual"]
# Answers "can an inbound AXI manager reach the CPU scratch window", which the
# payload staging depends on, and asserts the I3C CSR instance decode. Same
# mandatory-ROM reasoning as the elaboration test above. boot_stall is released
# on both instances -- holding it keeps fuse_reset_n asserted and the CPU
# cluster in reset, so the scratch window would never answer -- which means
# both production ROMs do run during this test.
firmware = { name = "prod_rom", mode = "bootrom" }
args = [
    "+rom_bin64=prod_rom.bin64",
    "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
]

[[tests]]
name = "smc_occp_dual_unsecure_boot_test"
module = "smc_occp_dual_unsecure_boot_test"
seed = 1
# Headroom for the measurement, not a target. The payload is a full sram-mode
# image (~15 KB), and every byte of it crawls over a ~2.6 MHz serial bus that
# Verilator simulates cycle by cycle: ~3.1 us of sim time per byte, against a
# model that runs ~7.3 us of sim per wall-clock second. Projected ~52 ms sim /
# ~2 h wall. Recorded properly once measured; if that cost is unacceptable the
# numbers go back for a scope decision rather than the payload being quietly
# shrunk (design doc section 5).
timeout_sec = 21600
tags = ["ci", "dual", "occp_boot", "prod_rom"]
run_modes = ["dual"]
firmware = { name = "dual_occp", mode = "dual_occp" }
# Three images, one per role. run_dv stages every declared c_build output next
# to the simulator cwd, which is why these are bare basenames.
#   +rom_bin64        target: production boot ROM (loaded into BOTH instances by
#                     OCAH4CORECluster_rom_ext, then overridden on u_bfm below)
#   +bfm_rom_hex      controller: the DV OCCP master image, applied to u_bfm
#                     only, at #0.3 so it wins over the shared load
#   +occp_payload_bin the image cocotb stages into the controller's SRAM over
#                     AXI and the controller then streams over I3C. An ordinary
#                     sram-mode test image; no ROM embedding and no striped
#                     backdoor is involved
#   +occp_payload_sym the test derives the OCCP JUMP entry offset from this
#                     (&main - &_enter) rather than hardcoding it
args = [
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_unsecure_boot_test.rom.hex",
    "+occp_payload_bin=hello_world.sram.bin",
    "+occp_payload_sym=hello_world.sram.sym",
    "+smc_shadow_reg_preload={repo_root}/hw/sys/smc/dv/assets/default_efuse_shadow_reg.preload",
]

[[groups]]
name = "all"
tests = [
    "smc_dual_elaboration_test",
    "smc_dual_axi_sram_probe_test",
    "smc_occp_dual_unsecure_boot_test",
]

[[groups]]
name = "smoke"
tests = [
    "smc_dual_elaboration_test",
    "smc_dual_axi_sram_probe_test",
]

[[groups]]
name = "occp_dual"
tests = [
    "smc_occp_dual_unsecure_boot_test",
]
