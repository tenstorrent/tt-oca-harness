schema_version = 1

# The payload and manifest flows, ported from the reference
# `Main_SMC_BL0_Regression_Small`. What separates these from the rom-only family is that
# something ends up executing on the target: a payload the testbench staged, or one the
# controller transferred and the ROM validated.
#
# smc_occp_dual_unsecure_boot_test, the fourth member of this family, stays in dual.toml
# where it also serves as the dual OCCP bring-up scenario.
#
# +FORCE_HW_AUTO_ZERO and +SECURE_MODE=0 are not carried: they are straps, and no strap is
# readable in this bench. +BOOT_I3C is carried but selects nothing, for the same reason.
# +SECURE_MODE=1 does have an effect and is carried, as +lc_state.

[[tests]]
name = "smc_occp_random_jump_test"
module = "smc_occp_random_jump_test"
target = "dual"
seed = 1
timeout_sec = 7200
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_jump", mode = "occp_payload" }
# The testbench stages hello_world in the target and publishes where it went; the
# controller reads that back over OCCP and jumps the target into it. The address is
# redrawn per run, which is the point of the test.
args = [
    "+BOOT_I3C",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_jump.rom.hex",
    "+occp_payload_bin=hello_world.sram.bin",
    "+occp_payload_sym=hello_world.sram.sym",
    "+rom_test_timeout=200000000",
]

[[tests]]
name = "smc_occp_validate_boot_test"
module = "smc_occp_validate_boot_test"
target = "dual"
seed = 1
timeout_sec = 7200
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_validate_boot_test", mode = "occp_rom_only" }
# No payload: this checks the ROM's manifest handoff for an address the controller
# invents, so nothing has to be transferred or executed.
args = [
    "+BOOT_I3C",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_validate_boot_test.rom.hex",
    "+rom_test_timeout=200000000",
]

[[tests]]
name = "smc_occp_secure_boot_test"
module = "smc_occp_secure_boot_test"
target = "dual"
seed = 1
# The payload crosses I3C byte by byte, as in smc_occp_dual_unsecure_boot_test, and the
# secure flow then republishes it and reboots the cores. Headroom, not a target.
timeout_sec = 21600
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_secure_boot_test", mode = "occp_payload" }
# +lc_state=1 is the reference's +SECURE_MODE=1, and it is what makes this test differ
# from the unsecure boot flow: on a secure lifecycle the ROM publishes a manifest instead
# of jumping, and the testbench stands in for the SEP that would boot it.
args = [
    "+BOOT_I3C",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_secure_boot_test.rom.hex",
    "+occp_payload_bin=hello_world.sram.bin",
    "+occp_payload_sym=hello_world.sram.sym",
    "+lc_state=1",
    # The reference names no override, so this is the 200 ms template baseline. Note it
    # then doubles its own bound for the post-manifest boot phase; here one bound covers
    # both phases, so this is the tighter of the two.
    "+rom_test_timeout=200000000",
]

[[groups]]
name = "occp_payload_boot"
tests = [
    "smc_occp_random_jump_test",
    "smc_occp_validate_boot_test",
    "smc_occp_secure_boot_test",
]
