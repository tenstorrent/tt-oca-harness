schema_version = 1

[[tests]]
name = "smc_irq_observe_test"
module = "smc_irq_observe_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "irq"]
run_modes = ["smoke"]

[[tests]]
name = "smc_irq_multi_sample_test"
module = "smc_irq_multi_sample_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "irq"]
run_modes = ["smoke"]

# Hang-detector CTRL.irq_test fire/clear on the sys/sep/data detectors and their
# OR; a real bus-stall timeout is not claimed.
[[tests]]
name = "smc_hang_detector_sanity_test"
module = "smc_hang_detector_sanity_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "irq", "hang"]
run_modes = ["smoke"]

# BFM: SEP outstanding stall timeout (tb_sep_axi_r_hold); not irq_test.
[[tests]]
name = "smc_hang_detector_disable_test"
module = "smc_hang_detector_disable_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "irq", "hang"]
run_modes = ["smoke"]

[[tests]]
name = "smc_hang_detector_timeout_test"
module = "smc_hang_detector_timeout_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "irq", "hang"]
run_modes = ["smoke"]

# BFM: SYS_IN outstanding stall timeout (tb_sys_axi_r_hold); not SEP / irq_test.
[[tests]]
name = "smc_hang_detector_sys_timeout_test"
module = "smc_hang_detector_sys_timeout_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "irq", "hang"]
run_modes = ["smoke"]

# BFM: DATA_ACCEL outstanding stall (tb_output_axi_resp_hold + DMA); not SEP/SYS / irq_test.
[[tests]]
name = "smc_hang_detector_data_timeout_test"
module = "smc_hang_detector_data_timeout_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "irq", "hang"]
run_modes = ["smoke"]

# BFM: hang OR reaches the PLIC source pin via peripheral_interrupts[30].
# Unique vs smc_hang_detector_sanity_test, which stops at the smc_base OR.
[[tests]]
name = "smc_hang_detector_plic_route_test"
module = "smc_hang_detector_plic_route_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "irq", "hang", "plic"]
run_modes = ["smoke"]

# Unique PVT digital pin (the analog macros are placeholder RTL).
[[tests]]
name = "smc_temp_interrupt_test"
module = "smc_temp_interrupt_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "irq", "pvt"]
run_modes = ["smoke"]

# Wrapper ext_interrupts_i[0] through its synchronizer, rising and falling.
[[tests]]
name = "smc_ext_interrupts_pin_test"
module = "smc_ext_interrupts_pin_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "irq", "ext"]
run_modes = ["smoke"]

[[groups]]
name = "irq"
tests = [
    "smc_irq_observe_test",
    "smc_irq_multi_sample_test",
    "smc_irq_during_powergood_glitch_test",
    "smc_hang_detector_sanity_test",
    "smc_hang_detector_timeout_test",
    "smc_hang_detector_sys_timeout_test",
    "smc_hang_detector_data_timeout_test",
    "smc_hang_detector_plic_route_test",
    "smc_temp_interrupt_test",
    "smc_ext_interrupts_pin_test",
]

[[tests]]
name = "smc_mailbox_irq_test"
module = "smc_mailbox_irq_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "axil", "canonical"]
run_modes = ["smoke"]
