schema_version = 1

# Leaves defined but outside `all`. `all` is the set the VPLAN grades and the
# set a coverage run measures; every entry here is kept out of it for a reason
# its comment states, stays selectable by name or by its group below, and is
# documented as a hold-out in docs/SMC_VPLAN.adoc (Known Limitations,
# "Held-out testcases"). Nothing here counts toward a PASS of the package.
#
# Three kinds of entry:
#
#   * `rtl_issue` -- reproducers for filed RTL defects, EXPECTED TO FAIL against
#     current RTL. Each carries `expect_fail = "<reason>"`, which the runner
#     grades (the observed FAIL is PASS, an observed PASS is FAIL with the
#     reason "the defect is gone"), and `expect_fail_match`, the regex the
#     failure message must match so a leaf failing for another reason is FAIL.
#     The weekly tier runs the group on its own row (.github/workflows/
#     regress.yml), green while the defects stand and red the week one is
#     fixed; the leaf then moves back to its feature testlist without the
#     `expect_fail` pair. No `ci` tag: a graded expected failure must never
#     count in the hosted set. One test per defect.
#   * `occp_boot` / `occp_dual` -- held out on runtime. The production ROM's
#     whole reset-to-OCCP path (`run_modes = ["prod_rom"]`, 3600 s) and the
#     dual-SMC unsecure boot (hours of wall clock while a full sram image
#     crosses a ~2.6 MHz serial bus that Verilator simulates cycle by cycle).
#     Each runs on demand as its own group.
#   * `held_out` -- leaves whose current failure is a comparison the leaf
#     cannot make on this RTL until a ruling. smc_ref_clock_timer_rate_test
#     fails the rate comparison it was written to make: clk_rst.adoc places
#     the OCTS system timer in the reference clock domain and the RTL clocks
#     it from clk_smc_i. A leaf whose blocker is a filed RTL defect goes here
#     too, with the issue in its comment, and returns to its feature testlist,
#     `all` and `hosted` when the fix merges.
#
# `ci` marks the leaves a hosted runner can run to PASS; no entry here carries
# it.

[[tests]]
# Dead offsets inside seven register windows wrap onto live registers and the
# bus answers OKAY (wrap_to_live=7 read_alias=6 of 8 checkable probes): the
# wrapper truncates to the PeakRDL address width before any range check, so
# 0xC001_6208 lands on outbound filter 0 START_ADDR, 0xC000_A04C on
# TIMER_PRESET_LO, and so on. OKAY-into-void with the live register untouched
# is tallied, not asserted -- see the sequence docstring for the scope.
name = "smc_deadspace_decode_test"
module = "smc_deadspace_decode_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue"]
run_modes = ["smoke"]
expect_fail = "#585: dead offsets in seven register windows wrap onto live registers with an OKAY response"
expect_fail_match = "aliased live registers \\(wrap_to_live=[1-9][0-9]* read_alias="

[[tests]]
name = "smc_prod_rom_occp_ready_test"
module = "smc_prod_rom_occp_ready_test"
seed = 1
timeout_sec = 3600
tags = ["occp_boot", "prod_rom"]
run_modes = ["prod_rom"]
firmware = { name = "prod_rom", mode = "bootrom" }
# +smc_hold_cpu_boot: hold boot_stall from t=0 so the sequence programs
# RESET_VECTOR before any core fetches (same first-boot path as SMC_002).
# Real fuse sense (no +skip_fuse_sense): the ROM reads straps and fuses itself.
args = [
    "+rom_bin64=prod_rom.bin64",
    "+smc_hold_cpu_boot",
]

[[tests]]
name = "smc_occp_dual_unsecure_boot_test"
module = "smc_occp_dual_unsecure_boot_test"
target = "dual"
seed = 1
# Headroom, not a target. The payload is a full sram-mode image (~15 KB), and
# every byte of it crawls over a ~2.6 MHz serial bus that Verilator simulates
# cycle by cycle, so the run takes hours of wall clock.
timeout_sec = 21600
tags = ["dual", "occp_boot", "prod_rom"]
run_modes = ["dual"]
firmware = { name = "dual_occp", mode = "dual_occp" }
# Three images, one per role. run_dv stages every declared c_build output next
# to the simulator cwd, which is why these are bare basenames.
#   +rom_bin64        target: production boot ROM (loaded into BOTH instances by
#                     OCAH4CORECluster_rom_ext, then overridden on u_bfm below)
#   +bfm_rom_hex      controller: the DV OCCP master image, applied to u_bfm
#                     only, at #0.3 so it wins over the shared load
#   +occp_payload_bin the image cocotb stages into the controller's SRAM over
#                     AXI and the controller then streams over I3C. An ordinary
#                     sram-mode test image; no ROM embedding and no striped
#                     backdoor is involved
#   +occp_payload_sym the test derives the OCCP JUMP entry offset from this
#                     (&main - &_enter) rather than hardcoding it
args = [
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_unsecure_boot_test.rom.hex",
    "+occp_payload_bin=hello_world.sram.bin",
    "+occp_payload_sym=hello_world.sram.sym",
]

[[tests]]
name = "smc_ref_clock_timer_rate_test"
module = "smc_ref_clock_timer_rate_test"
seed = 1
timeout_sec = 1800
tags = ["clock"]
run_modes = ["smoke"]

[[groups]]
# Filed-defect reproducers; the weekly tier's own row.
name = "rtl_issue"
expected_count = 1
tests = [
    "smc_deadspace_decode_test",
]

[[groups]]
# Production boot ROM to its OCCP loop; on demand, about one hour.
name = "occp_boot"
tests = [
    "smc_prod_rom_occp_ready_test",
]

[[groups]]
# Dual-SMC OCCP unsecure boot; on demand, hours.
name = "occp_dual"
tests = [
    "smc_occp_dual_unsecure_boot_test",
]

[[groups]]
# Leaves waiting on an RTL/spec ruling; run on demand to re-measure. Guarded so a
name = "held_out"
expected_count = 1
tests = [
    "smc_ref_clock_timer_rate_test",
]
