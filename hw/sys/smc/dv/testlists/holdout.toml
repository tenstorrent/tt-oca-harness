    "smc_prod_rom_occp_ready_test",
]

[[groups]]
# Leaves whose comparison the RTL and the specification disagree on, and the
# observation leaves waiting on a specification ruling; run on demand.
name = "held_out"
expected_count = 4
tests = [
    "smc_ref_clock_timer_rate_test",
    "smc_zeroer_busy_trigger_obs_test",
    "smc_flr_counter_timing_obs_test",
    "smc_bresp_evidence_obs_test",
