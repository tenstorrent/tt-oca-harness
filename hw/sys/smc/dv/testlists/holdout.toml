schema_version = 1

# Leaves defined but outside `all`. `all` is the set the VPLAN grades and the
# set a coverage run measures; every entry here is kept out of it for a reason
# its comment states, stays selectable by name or by its group below, and is
# documented as a hold-out in docs/SMC_VPLAN.adoc (Known Limitations,
# "Held-out testcases"). Nothing here counts toward a PASS of the package.
#
# Four kinds of entry:
#
#   * `rtl_issue` -- reproducers for filed RTL defects, EXPECTED TO FAIL against
#     current RTL. Each carries `expect_fail = "<reason>"`, which the runner
#     grades (the observed FAIL is PASS, an observed PASS is FAIL with the
#     reason "the defect is gone"), and `expect_fail_match`, the regex the
#     failure message must match so a leaf failing for another reason is FAIL.
#     The weekly tier runs the group on its own row (.github/workflows/
#     regress.yml), green while the defects stand and red the week one is
#     fixed; the leaf then moves back to its feature testlist without the
#     `expect_fail` pair. No `ci` tag: a graded expected failure must never
#     count in the hosted set. One test per defect.
#   * `occp_boot` -- held out on runtime. The production ROM's whole
#     reset-to-OCCP path (`run_modes = ["prod_rom"]`, 3600 s) runs on
#     demand. The hours-long dual-SMC boot case belongs to `occp_rom`.
#   * `held_out` -- leaves whose comparison the RTL and the specification
#     disagree on, and leaves blocked by a filed RTL defect; each entry's
#     comment states the disagreement or the defect in words. An observation
#     leaf waiting on a specification ruling belongs here too: it passes, logs
#     `OBS-*` lines for the disputed value and grades nothing about it; its
#     comment states the open question in words and the VPLAN held-out table
#     names the issue that holds the ruling.
#     smc_ref_clock_timer_rate_test compares the OCTS system timer rate against
#     clk_rst.adoc, which places the timer in the reference clock domain, while
#     the RTL clocks it from clk_smc_i.
#   * scope-named UVM groups -- UVM-only leaves excluded from `all` and
#     `hosted` because those groups do not run the UVM framework. Each group is
#     named for the verification scope it exercises (`csr_uvm_extended`,
#     `wdt_uvm_extended`, `cg_uvm_extended`, `mailbox_uvm_extended`) and runs on demand.
#
# `ci` marks the leaves a hosted runner can run to PASS; no entry here carries
# it.

[[tests]]
# ISOLATE_REQ_SMC_REG clears its FLR-latched request on any write with a byte
# enable anywhere in the register, whatever the data (smc_cool_reset_wrap.sv);
# reset_unit.rdl makes the request a sw=rw field at bit 0.
name = "smc_isolate_req_smc_lane_test"
module = "smc_isolate_req_smc_lane_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue"]
run_modes = ["smoke"]
expect_fail = "ISOLATE_REQ_SMC_REG: a write outside bit 0's byte lane clears the FLR-latched request"
expect_fail_match = "cleared the FLR-latched request from a byte lane the field does not"

[[tests]]
# CPU_CTRL.WDT_TIMEOUT written to 0 with no first-stage timeout raises
# smc_wdt_second_timeout_o on the next clock and holds the warm domain in
# reset (smc_cpu_ctrl_wrap.sv flags the second timeout whenever the reloaded
# counter reads 0); cpu_ctrl.rdl gives the field no range and defines no 0.
name = "smc_wdt_timeout_zero_idle_test"
module = "smc_wdt_timeout_zero_idle_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue"]
run_modes = ["smoke"]
expect_fail = "WDT_TIMEOUT=0 raises the second-stage timeout with no first-stage timeout"
expect_fail_match = "CHK-WDT-TIMEOUT-ZERO-IDLE FAIL"

[[tests]]
# A SCRATCH_COLD_WARM read while the warm reset is asserted is accepted by the
# primary-domain axi_lite_demux and never answered (smc_misc_wrap.sv has no
# isolation on the warm-domain leg), so the peripheral crossbar's read channel
# hangs after the release. The in-reset response is recorded, not graded;
# cpu.adoc states the isolation rule only for the CPU cluster's own ports.
name = "smc_warm_domain_access_during_reset_test"
module = "smc_warm_domain_access_during_reset_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue"]
run_modes = ["smoke"]
expect_fail = "a SCRATCH_COLD_WARM read during the warm reset hangs the peripheral crossbar after the release"
expect_fail_match = "CHK-WARM-DOMAIN-ACCESS-IN-RESET FAIL"

[[tests]]
# The CLA debug interrupt stays asserted after the CDbgEapStatus W2C write
# (cla_node_eap.sv feeds the interrupt flop back without consulting the
# status; core_logic_analyzer.sv gives the set priority over the clear);
# dfd_cla.rdl names the W2C as the ISR's acknowledge.
name = "smc_dfd_cla_irq_w2c_release_test"
module = "smc_dfd_cla_irq_w2c_release_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue"]
run_modes = ["smoke"]
expect_fail = "the CLA debug interrupt is not released by the EapStatus W2C write"
expect_fail_match = "CHK-CLA-IRQ-W2C-RELEASE FAIL"

[[tests]]
# The CLA global clock-halt request is a set-only flop (cla_action_gen.sv)
# cleared by the SMC primary reset alone; the W2C, EnableEap and
# DisableGlobalClockHalt do not reach it, where the wrapper port, dfd.adoc and
# dfd_cla.rdl describe a level that follows the action.
name = "smc_dfd_cla_clock_halt_release_test"
module = "smc_dfd_cla_clock_halt_release_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue"]
run_modes = ["smoke"]
expect_fail = "the CLA clock-halt request stays asserted after the action drops and DisableGlobalClockHalt is set"
expect_fail_match = "CHK-CLA-CLOCK-HALT-RELEASE FAIL"

[[tests]]
name = "smc_prod_rom_occp_ready_test"
module = "smc_prod_rom_occp_ready_test"
seed = 1
timeout_sec = 3600
tags = ["occp_boot", "prod_rom"]
run_modes = ["prod_rom"]
firmware = { name = "prod_rom", mode = "bootrom" }
# +smc_hold_cpu_boot: hold boot_stall from t=0 so the sequence programs
# RESET_VECTOR before any core fetches (same first-boot path as SMC_002).
# Real fuse sense (no +skip_fuse_sense): the ROM reads straps and fuses itself.
args = [
    "+rom_bin64=prod_rom.bin64",
    "+smc_hold_cpu_boot",
]

[[tests]]
name = "smc_ref_clock_timer_rate_test"
module = "smc_ref_clock_timer_rate_test"
seed = 1
timeout_sec = 1800
tags = ["clock"]
run_modes = ["smoke"]

[[tests]]
# Observation leaf: a CTRL_STATUS trigger while the zeroer is busy
# is dropped during issue and accepted while responses drain, with one
# completion interrupt for two jobs; zeroer.adoc and zeroer_ctrl.rdl state
# no rule for it. The OBS-ZEROER-BUSY lines record both windows; the CHK line
# grades liveness only.
name = "smc_zeroer_busy_trigger_obs_test"
module = "smc_zeroer_busy_trigger_obs_test"
seed = 1
timeout_sec = 1800
tags = ["zeroer"]
run_modes = ["smoke"]

[[tests]]
# Observation leaf: the FLR pre-delay is N+1 clk_ref_i cycles, the
# hold is M, and an edge during a running sequence is ignored; reset_unit.rdl
# names neither the clock nor the offset. The OBS-FLR lines record each
# (N, M) leg; the CHK line grades liveness only.
name = "smc_flr_counter_timing_obs_test"
module = "smc_flr_counter_timing_obs_test"
seed = 1
timeout_sec = 1800
tags = ["reset", "flr"]
run_modes = ["smoke"]

[[tests]]
# Observation leaf: the merged BRESP of a split two-beat write
# whose beats answer differently has no stated rule. The OBS-BRESP lines
# record every declared past-extent and gap write beside its DECERR
# declaration and the OBS-BURST lines the merged response; the CHK lines
# grade the table counts and that live words are unchanged.
name = "smc_bresp_evidence_obs_test"
module = "smc_bresp_evidence_obs_test"
seed = 1
timeout_sec = 1800
tags = ["fabric", "decode"]
run_modes = ["smoke"]

