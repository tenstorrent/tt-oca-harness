    "smc_wdt_feed_zerocmp_test",
    "smc_wdt_core_awake_gate_test",
    "smc_wdt_second_stage_reset_test",
]

[[groups]]
# Filed-defect reproducers; the weekly tier's own row.
name = "rtl_issue"
expected_count = 5
tests = [
    "smc_isolate_req_smc_lane_test",
    "smc_wdt_timeout_zero_idle_test",
    "smc_warm_domain_access_during_reset_test",
    "smc_dfd_cla_irq_w2c_release_test",
    "smc_dfd_cla_clock_halt_release_test",
]

[[groups]]
# Production boot ROM to its OCCP loop; on demand, about one hour.
name = "occp_boot"
