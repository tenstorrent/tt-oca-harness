[[tests]]
# reset_unit.rdl:87-95 and :18-26 declare both as sw=rw with onwrite=woset, so a
# taken lock cannot be released, and smc_subsystem_resets.sv gates each target's
# writes with the inverted lock. Both properties, on both pairs, are asserted
# here and nowhere else. One testcase rather than two: the registers have the
# same declaration and the same gate, so a second would differ only in two
# addresses.
name = "smc_reset_unit_lock_test"
# One VPLAN scenario, two implementations: cocotb module vs SV-UVM class (+UVM_TESTNAME).
module = { cocotb = "smc_reset_unit_lock_test", uvm = "smc_reset_unit_lock_test" }
seed = 1
timeout_sec = 1800
tags = ["ci", "reset"]
run_modes = ["smoke"]

