[[tests]]
name = "smc_cpu_firmware_boot_test"
module = "smc_cpu_firmware_boot_test"
seed = 1
timeout_sec = 3600
tags = ["ci"]
run_modes = ["smoke"]
# {repo_root} paths: simulator cwd is attempt_*/make, not the repo root.
# SMC_002 card: real fuse sense (no +skip_fuse_sense); ROM-only boot
# (no +smc_scratch_ram_hex) so CHK-ROM-IS-TARGET / CHK-EFUSE-SENSE-DONE hold.
# +smc_hold_cpu_boot: keep pad57 boot_stall from t=0 until the sequence
# programs RESET_VECTOR then releases (prevents fetch before revector).
# min_pass.rom.hex: sync-free RV64 stub at ROM window (writes 0xACAFACA1).
# Both +rom_hex and +smc_rom_hex point at min_pass so the smoke-mode
# default smc_rom_default.hex cannot remain the sole identity (OCAH loads
# the first +rom_hex; smc_cpu_mem_dv then prefers +smc_rom_hex).
args = [
    "+smc_hold_cpu_boot",
    "+smc_rom_hex={repo_root}/hw/sys/smc/dv/assets/min_pass.rom.hex",
    "+rom_hex={repo_root}/hw/sys/smc/dv/assets/min_pass.rom.hex",
]

[[tests]]
name = "smc_ecc_fault_inject_test"
module = "smc_ecc_fault_inject_test"
seed = 1
timeout_sec = 1800
tags = ["ci"]
run_modes = ["smoke"]
# Scratch-bank0 inject fire needs live CPU fetch of a preloaded scratch image.
# Hold boot until the seq arms inject + programs the scratch reset vector.
args = [
    "+smc_hold_cpu_boot",
    "+smc_scratch_ram_hex={repo_root}/hw/sys/smc/dv/assets/min_pass.ecc.hex",
]

[[tests]]
# Corrupts the stored 72-bit codeword rather than the rdata path, so the CPU's
# own ECC logic reacts. Paired with smc_ecc_codeword_ded_test: same location,
# one bit vs two. smc_ecc_fault_inject_test scores the rdata-side hook instead.
name = "smc_ecc_codeword_sec_test"
module = "smc_ecc_codeword_sec_test"
seed = 1
timeout_sec = 1800
tags = ["ci"]
run_modes = ["smoke"]
args = [
    "+smc_hold_cpu_boot",
    "+smc_scratch_ram_hex={repo_root}/hw/sys/smc/dv/assets/min_pass.ecc.hex",
]

[[tests]]
# Two flipped bits in the same codeword: uncorrectable, so cluster_ded_o must
# assert on the reset-vector fetch.
name = "smc_ecc_codeword_ded_test"
module = "smc_ecc_codeword_ded_test"
seed = 1
timeout_sec = 1800
tags = ["ci"]
run_modes = ["smoke"]
args = [
    "+smc_hold_cpu_boot",
    "+smc_scratch_ram_hex={repo_root}/hw/sys/smc/dv/assets/min_pass.ecc.hex",
]

