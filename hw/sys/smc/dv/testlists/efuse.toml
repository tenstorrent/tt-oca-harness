# The read-lock precondition of this scenario is supplied by this asset (word 0
# sets JTAG_PUBLIC_IDENTITY_READ_LOCK), so it is named here rather than inherited
# silently from the bench-wide default in smc_sim_cfg.toml.
args = [
    "+smc_efuse_hex={repo_root}/hw/sys/smc/dv/assets/smc_efuse_default.hex",
]

