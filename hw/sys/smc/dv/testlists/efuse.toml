# No GPIO-strap or external-interrupt testcase is enrolled here. smc_wrapper
# declares no captured_straps_i, so the strap feature has no testcase
# (docs/SMC_VPLAN.adoc, Known Limitations); external interrupts are
# covered by smc_ext_interrupts_pin_test (irq.toml). ext_interrupts_i[255:1] is
# tied to 0 in tb/tb_top.sv, so an external-interrupt testcase beyond bit 0
# needs TB work before it can exist.

[[tests]]
# #1989: smc_efuse_pkg.sv sizes the fuse word counter as $clog2(256) = 8 bits,
# so efuse_shadow_regs.sv's `efuse_word_counter_t'(NumShadowWords)` is 0, the
# sense request asks for no words and the store guard admits none. Sense still
# completes and every shadow word reads 0 with OKAY; the first row of this
# leaf's map sweep, LOCKS word 0 against the preload image, is the measurement.
name = "smc_efuse_map_read_test"
module = "smc_efuse_map_read_test"
seed = 1
timeout_sec = 1800
tags = ["ci"]
run_modes = ["smoke"]

