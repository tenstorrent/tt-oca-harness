# No GPIO-strap testcase is enrolled: smc_wrapper declares no captured_straps_i,
# so the strap feature has no testcase (docs/SMC_VPLAN.adoc, Known Limitations).
# External interrupts are covered from irq.toml (smc_ext_interrupts_pin_test,
# bit 0) and by smc_fw_plic_claim_test in fw.toml, which drives bits 16:2
# through tb_ext_interrupts_hi_i.

[[tests]]
# The default asset programs only LOCKS word 0, so every other content row of
# this sweep compares zeros; the smc_efuse_image_*_test leaves below sense images
# that fill every word.
name = "smc_efuse_map_read_test"
module = "smc_efuse_map_read_test"
seed = 1
timeout_sec = 1800
tags = ["ci"]
run_modes = ["smoke"]

