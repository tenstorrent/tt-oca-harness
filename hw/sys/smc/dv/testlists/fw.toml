[[tests]]
# Log-engine images: the engine's data path is CPU-side (SRAM fetch, UART write,
# MCR.LOOP return through the UART's own receiver), which no cocotb body drives.
# The bench reads the SRAM source and the engine's programming back after the
# verdict; single_entry also exposes the received-data interrupt on the UART
# IRQ line, and fetch_err's unmapped address is probed from SEP_IN for DECERR.
