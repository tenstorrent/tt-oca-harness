[[tests]]
# I2C images: I2C_0 and I2C_1 talk to each other under firmware, so both need
# the shared pad bus (+smc_i2c_shared_bus, as the cocotb I2C0<->I2C1 leaves do).
# A passive decoder on tb_i2c0_scl/sda grades the wire against floors each
# image implies; the firmware grades its own CSR-side checks.
#
# i2c_sanity: controller bring-up, a 3-byte write with STOP and a NACKed probe.
name = "smc_fw_i2c_sanity_test"
module = "smc_fw_i2c_sanity_test"
seed = 1
timeout_sec = 3600
tags = ["firmware", "cpu", "i2c"]
run_modes = ["smoke"]
firmware = "i2c_sanity"
args = [
    "+smc_hold_cpu_boot",
    "+smc_scratch_ram_hex=i2c_sanity.ecc.hex",
    "+smc_i2c_shared_bus",
]

[[tests]]
# i2c_target_sanity: target bring-up whose step S6 needs a host that STOPs
