]

[[tests]]
# ACQ-full auto-stretch and its release by ACQ reset. The stretch is a duration
# on SCL no register reports; the image parks at two markers and the bench
# samples the target's own SCL pull in each window before acknowledging.
# The simulated time is set by the 70-byte standard-mode write that fills ACQ,
# about 7 ms timed by the periph clock, and nothing in it depends on the seed.
# +pll_sys_period_ns=10 runs clk_smc_i at 100 MHz, one of the two periods
# pll_wrap offers, so the bench toggles the core clock an eighth as often over
# that span; the periph clock that times I2C stays at 200 MHz.
name = "smc_fw_i2c_acq_fifo_stretch_reset_test"
module = "smc_fw_i2c_acq_fifo_stretch_reset_test"
seed = 1
timeout_sec = 3600
tags = ["firmware", "cpu", "i2c"]
run_modes = ["smoke"]
firmware = "i2c_acq_fifo_stretch_reset"
args = [
    "+smc_hold_cpu_boot",
    "+smc_scratch_ram_hex=i2c_acq_fifo_stretch_reset.ecc.hex",
    "+smc_i2c_shared_bus",
    "+pll_sys_period_ns=10",
]

