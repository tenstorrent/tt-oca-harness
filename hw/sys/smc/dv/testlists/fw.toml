[[tests]]
# Word stores into the half of a 64-bit register word whose fields they do not
# address. The core replicates the word onto the fields' lanes with the strobes
# clear, a case SEP_IN cannot make because its master zero-fills those lanes.
name = "smc_fw_narrow_store_lane_test"
module = "smc_fw_narrow_store_lane_test"
