[[groups]]
# Balanced-IP regression: one slot per distinct proven property, per IP.
# Selected from the 147 enrolled by (a) removing testcases that share a sequence
# class with a stronger sibling, (b) removing testcases whose only assert is a
# self-count or a Verilator-invariant resolvability gate, then (c) ranking what
# remains by proof strength inside each IP and applying a per-IP budget.
# Reaches 100% of the register-symbol and TB-probe coverage the full 147 reach
# that is carried by a fail-capable testcase.
name = "balanced_ip"
tests = [
    # --- avsbus (2) ---
    "smc_avsbus_clock_config_proxy_test",
    "smc_sideband_protocol_smoke_test",
    # --- axil (4) ---
    "smc_6agent_observability_test",
    "smc_axil_burst_idle_test",
    "smc_axil_idle_test",
    "smc_canonical_smoke_test",
    # --- clk_cg (3) ---
    "smc_axi_error_response_depth_test",
    "smc_combined_observability_test",
    "smc_cpu_ctrl_map_depth_test",
    # --- cpu (4) ---
    "smc_cluster_beu_test",
    "smc_cpu_reset_source_test",
    "smc_mutex_semaphore_test",
    "smc_reference_counter_test",
    # --- dfx (2) ---
    "smc_dfx_status_abort_test",
    "smc_ecc_dfd_dbs_sanity_test",
    # --- dma (4) ---
    "smc_cg_test_mode_bypass_test",
    "smc_clk_multi_window_test",
    "smc_dma_cg_activity_test",
    "smc_static_cg_sanity_test",
    # --- efuse (9) ---
    "smc_efuse_boundary_signals_test",
    "smc_efuse_jtag_lc_access_matrix_test",
    # PROD/RMA JTAG-OTP access control: non-identity read and write return
    # DECERR + 0xBADCAB1E while CHIPLET_ID/PACKAGE_ID return OKAY. The decision
    # is DUT RTL (smc_efuse_wrapper.sv:86-89 identity decode, :129-135 lc-gated
    # demux, :145 RESP_DATA 32'hbadcab1e) and the scored value has NO
    # efuse_bank_model dependence -- the sequence explicitly refuses to score
    # rdata on the ALLOW path. Enrolled here as the honest counterpart to
    # smc_efuse_otp_burn_shadow_test, whose proof does rest on the adopter model.
    "smc_efuse_jtag_lc_negative_test",
    "smc_efuse_locked_access_interrupt_test",
    "smc_efuse_map_read_test",
    "smc_efuse_otp_burn_shadow_test",
    "smc_efuse_otp_clock_config_depth_test",
    "smc_efuse_otp_clock_test",
    "smc_efuse_read_program_timeout_test",
    # --- gpio (9) ---
    "smc_5agent_observability_test",
    "smc_gpio_filter_access_sep_test",
    "smc_gpio_irq_active_test",
    "smc_gpio_irq_type_matrix_test",
    "smc_gpio_multi_sample_test",
    "smc_gpio_observe_test",
    "smc_gpio_output_driveback_test",
    "smc_gpio_p0_int_test",
    "smc_gpio_p0_mux_test",
    # --- hang (1) ---
    "smc_hang_detector_sanity_test",
    # --- i2c (11) ---
    "smc_i2c_cg_sanity_test",
    "smc_i2c_fifo_full_test",
    "smc_i2c_master_target_test",
    "smc_i2c_p0_fifo_test",
    "smc_i2c_p0_multictrl_test",
    "smc_i2c_p0_nack_test",
    "smc_i2c_p0_stretch_test",
    "smc_i2c_p0_timeout_test",
    "smc_i2c_target_smbus_test",
