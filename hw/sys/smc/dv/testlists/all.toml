schema_version = 1

# Aggregate testlist: merges the per-feature testlists. Leaf files define each
# test once; this file owns the regression groups, and the DUT sim_cfg points
# at it so `--items` and `--tag` resolve across every leaf list.
#
# `all` is every test this VPLAN grades and the set a coverage run measures.
# Three class groups partition it by what the leaf needs to build, with no
# overlap and nothing left over:
#
#   hosted  toolchain-free, single-instance model  -- the scheduled nightly and
#           weekly tiers on the hosted GitHub runners (three seeds)
#   fw      firmware images built in the c_compile stage (RISC-V GCC with
#           picolibc, or scripts/docker-run.sh)
#   sanity  the SMC_DUAL elaboration, loading a ROM or firmware image
#
# Leaves outside `all` are either in holdout.toml, with the reason recorded
# there, or in the `occp_rom` group selected explicitly from smc_rom.toml.
# docs/SMC_VPLAN.adoc (Known Limitations) records the hold-outs.
#
# python3 tools/dv/run_dv.py --dut smc --items all --tool verilator --regress
# python3 tools/dv/run_dv.py --dut smc --items hosted --tool verilator --regress --reseed 3
includes = [
    "axil.toml",
    "clock.toml",
    "combined.toml",
    "cpu.toml",
    "dma.toml",
    "efuse.toml",
    "fabric.toml",
    "fw.toml",
    "gpio.toml",
    "holdout.toml",
    "i2c.toml",
    "irq.toml",
    "jtag.toml",
    "mailbox.toml",
    "power.toml",
    "register.toml",
    "reset.toml",
    "smc_rom.toml",
    "spi.toml",
    "uart.toml",
]

