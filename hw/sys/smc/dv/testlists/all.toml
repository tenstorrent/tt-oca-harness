schema_version = 1

# Aggregate testlist: merges all per-feature testlists. The DUT sim_cfg
# points at this file so `--tag smoke` resolves across every leaf list.
# Mirrors the shared all.toml convention.
#
# TB-policy deferred (I3C DAT, DTP CSR idle, pll/pvt placeholder, fake BFM):
# testlists/deferred.toml — NOT included here.
includes = ["reset.toml", "i2c.toml", "uart.toml", "clock.toml", "irq.toml", "gpio.toml", "axil.toml", "combined.toml", "batch_b.toml", "batch_c.toml", "batch_d.toml", "occp_boot.toml", "dual.toml", "vplan_triplets.toml", "p1_coverage_gap.toml", "p1_coverage_gap_r2.toml", "p1_coverage_gap_r3.toml", "p1_coverage_gap_r4.toml"]

