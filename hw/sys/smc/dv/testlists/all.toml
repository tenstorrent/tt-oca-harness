[[groups]]
name = "smoke"
# The per-PR gate. sim.yml runs `--items smoke` on each pull request.
#
# Three leaves, one each for something the bench cannot come up without:
# canonical bring-up, the reset path, and a CSR frontdoor read. Toolchain-free
# and about a second each.
#
# Nightly and weekly schedule `hosted` (the toolchain-free class of `all`),
# so the gate stays small without taking any leaf off the
# scheduled tiers.
tests = [
    "smc_canonical_smoke_test",
    "smc_cold_reset_test",
    "smc_register_sanity_test",
]
expected_count = 3
