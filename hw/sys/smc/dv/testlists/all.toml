[[groups]]
# Balanced-IP regression: one slot per distinct proven property, per IP.
# Selection (a) removes testcases that share a sequence class with a stronger
# sibling, (b) removes testcases whose only assert is a self-count or a
# Verilator-invariant resolvability gate, then (c) ranks what remains by proof
# strength inside each IP under a per-IP budget.
