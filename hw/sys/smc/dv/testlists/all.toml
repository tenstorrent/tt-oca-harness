[[groups]]
name = "all"
# The package regression, so a reviewer can run it without knowing which
# feature lists exist. It is not every test the package defines.
#
# The three `target = "dual"` bring-up scenarios are in: the runner builds both
# targets in one invocation and schedules each testcase against its own, so a
# second SMC_DUAL elaboration is the only extra cost and it is paid once.
#
# Two testcases are held out on runtime alone; each runs in its own group:
#
#   smc_occp_dual_unsecure_boot_test  hours of wall clock: a full sram image
#                                     crosses a ~2.6 MHz serial bus that
#                                     Verilator simulates cycle by cycle. Runs
#                                     as `dual_all` / `occp_dual`.
#   smc_prod_rom_occp_ready_test      the production ROM's whole reset-to-OCCP
#                                     path, `run_modes = ["prod_rom"]`. Runs as
#                                     `occp_boot`, and carries the `ci` tag.
#
# Test names that are catalogued but have no module under cocotb/tests/ are
# dispositioned in hw/sys/smc/doc/dv/SMC_DEFERRED_DISPOSITION.adoc.
#
# The `rtl_issue` group is out: its members (smc_deadspace_decode_test and
# smc_remap_cla_test among them) fail on RTL defects rather than test defects,
# every entry carries `expect_fail`, and the weekly tier runs the group on its
# own row so a graded expected failure never counts as a pass here or in
# `hosted`. rtl_issue.toml is included above so the names resolve; see that
# file for the conventions and the members.
#
# `smc_ref_clock_timer_rate_test` is held out for a different reason: it fails
# on the rate comparison it was written to make. clk_rst.adoc:37-39 places the
# OCTS system timer in the reference clock domain; smc_peripherals.sv:945-947
# clocks system_timer_octs from clk_smc_i. On seed 608337836 (ref 12 ns, smc
# 5 ns) TIMER_COUNT advanced 992 counts while 428 clk_ref_i edges and 1026
# clk_smc_i edges elapsed over the same window, against a tolerance of 14, so
# the count tracks clk_smc_i and not clk_ref_i. It keeps its [[tests]] entry
# and runs from cpu.toml.
# The four smc_cpu_*_wedge_test leaves remain catalogued in cpu.toml for
# directed DV use, but are held out of regression groups pending DV review.
# Guarded by expected_count, as dtp, sep and rtl_issue already are: the loader
# errors when this list and the count diverge, so a leaf cannot be added to a
# feature testlist and silently miss the regression.
