    # PROD/RMA JTAG-OTP access control: non-identity read and write return
    # DECERR + 0xBADCAB1E while CHIPLET_ID/PACKAGE_ID return OKAY. The decision
    # is DUT RTL (smc_efuse_wrapper.sv:86-89 identity decode, :129-135 lc-gated
    # demux, :145 RESP_DATA 32'hbadcab1e) and the scored value has NO
