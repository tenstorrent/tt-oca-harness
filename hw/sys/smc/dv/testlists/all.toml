schema_version = 1

# Aggregate testlist: merges the per-feature testlists. Leaf files define each
# test once; this file owns the regression groups, and the DUT sim_cfg points
# at it so `--items` and `--tag` resolve across every leaf list.
#
# `all` is every test this VPLAN grades and the set a coverage run measures.
# `expected_count` on the group below is the membership gate; these class
# groups select by what a leaf needs to build and do not between them cover
# `all`:
#
#   hosted  toolchain-free, single-instance model  -- the scheduled nightly and
#           weekly tiers on the hosted GitHub runners (three seeds)
#   fw      firmware images built in the c_compile stage (RISC-V GCC with
#           picolibc, or scripts/docker-run.sh). Not every firmware leaf is
#           here: the mmio-wedge pair is enrolled through `cpu`
#   sanity  the SMC_DUAL elaboration, loading a ROM or firmware image. Held out
#           of `all`, which elaborates one target per run
#
# Leaves outside `all` are either in holdout.toml, with the reason recorded
# there, or in the `occp_rom` group selected explicitly from smc_rom.toml.
# docs/SMC_VPLAN.adoc (Known Limitations) records the hold-outs.
#
# python3 tools/dv/run_dv.py --dut smc --items all --tool verilator --regress
# python3 tools/dv/run_dv.py --dut smc --items hosted --tool verilator --regress --reseed 3
includes = [
    "axil.toml",
    "clock.toml",
    "combined.toml",
    "cpu.toml",
    "dma.toml",
    "efuse.toml",
    "fabric.toml",
    "fw.toml",
    "gpio.toml",
    "holdout.toml",
    "i2c.toml",
    "irq.toml",
    "jtag.toml",
    "mailbox.toml",
    "power.toml",
    "register.toml",
    "reset.toml",
    "smc_rom.toml",
    "spi.toml",
    "uart.toml",
]

[[groups]]
# The package regression. It is not every test the package defines --
# holdout.toml, the `sanity` dual-SMC set and the on-demand `occp_rom` group
# hold the rest.
# Guarded by expected_count, as dtp and sep are: the loader errors when this
# list and the count diverge, so a leaf cannot be added to a feature testlist
# and silently miss the regression.
