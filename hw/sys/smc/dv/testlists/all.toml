# The whole enrolled set, so a reviewer can run the regression without knowing
# which feature lists exist.
#
# It is not every test the package defines, and the difference is deliberate.
# 12 test modules under cocotb/tests/ are in no testlist:
#
#   smc_pll_awm_freq_sweep_test        smc_pvt_analog_sensor_test
#   smc_pll_cgm_awm_config_test        smc_pvt_droop_test
#   smc_pll_dvfs_depth_test            smc_i3c_ccc_ibi_full_test
#   smc_pll_pvt_clock_config_test
#
#     -- deferred by TB policy: placeholder PLL/PVT RTL, and the I3C DAT/DCT
#        backing RAM this bench does not instantiate. Recorded in SMC_VPLAN.adoc
#        under Known Limitations.
#
#   smc_captured_straps_test           smc_macro_axil_routing_test
#   smc_clint_csr_test                 smc_sideband_avsbus_octs_bfm_test
#   smc_dfd_dbs_fault_inject_test
#
#     -- NOT deferred anywhere. These five have no testlist entry, no VPLAN
#        entry and no recorded reason, so nothing schedules them and nothing
#        explains why. That is dv_policy 1.7 and it is open; do not read their
#        absence here as a decision.
#
# Two enrolled tests are also held out of this group, both red for a filed RTL
# reason rather than a test defect. They keep their own [[tests]] entries and
# run on demand; holding them out is a dv_policy §2 LINKED-ISSUE disposition,
# not a waiver, and neither should be re-added until its issue closes.
#
#   smc_remap_cla_test          -- its CLA reset sweep passes (82 registers, 6
#                                  with discriminating non-zero resets), but the
#                                  deny leg never completes: the SEP_IN read at
#                                  0xC016_0038 times out. That is #1488, the CLA
