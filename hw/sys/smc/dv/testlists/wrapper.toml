schema_version = 1

# Deferred smc_wrapper catalog. The wrapper DUT is intentionally unregistered
# until its current RTL API and build targets are ported.

[[tests]]
name = "smc_wrapper_elaboration_test"
module = "smc_wrapper_elaboration_test"
target = "default"
seed = 1
timeout_sec = 600
tags = ["build", "smoke", "wrapper"]
run_modes = ["smoke"]
args = [
  # FIXME(SMC-DV): restore and stage these wrapper assets in each run directory
  # before re-enabling the wrapper flow.
  "+rom_hex=smc_rom_default.hex",
  "+smc_efuse_hex=smc_efuse_default.hex",
  "+smc_shadow_reg_preload=default_efuse_shadow_reg.preload",
]

[[groups]]
name = "smoke"
tests = [
  "smc_wrapper_elaboration_test",
]

[[groups]]
name = "all"
tests = [
  "smc_wrapper_elaboration_test",
]
