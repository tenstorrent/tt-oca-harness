schema_version = 1

# The rom-only OCCP family, ported from the reference `Main_SMC_BL0_Regression_Small`.
#
# Every entry runs one shared driver, `smc_occp_rom_only_test`: the controller runs a
# rom-mode DV image from hw/sys/smc/dv/fw/tests and drives OCCP at the target, whose
# production boot ROM answers. Nothing is transferred and nothing JUMPs, which is what
# separates this family from smc_occp_dual_unsecure_boot_test. Members differ only in
# +bfm_rom_hex and +rom_test_timeout, so `name` differs from `module` throughout.
#
# smc_occp_sanity_test is the fourth member and stays in dual.toml, where it also serves
# as a dual bring-up scenario. The `occp_rom_only` group below lists it.
#
# +rom_test_timeout carries the reference environment's value: the per-test override from
# `run_args` when it names one, otherwise the 200 ms baseline that smc_rom_test_template
# puts in `run_flags`. It is an upper bound on the driver's poll loop, not a target -- the
# loop breaks as soon as either instance reports. timeout_sec = 7200 mirrors the reference
# template's wall-clock bound, which is what actually stops a hung exchange.
#
# No strap is readable in this bench: the block that drives them is not instantiated, so
# every strap reads as not-set and the branch behind it is unreachable. That is why the
# reference's strap plusargs are NOT carried here:
#   +FORCE_HW_AUTO_ZERO          strap 26
#   +FORCE_STATUS_REPORTING      forces STATUS_RPT_DISABLE to 0. It already reads 0 here,
#                                so status reporting is on and the reverse case is absent
#   +PLL_DISABLE_HACK            sets the controller's BL0_PLLCLK strap. It reads 0 here,
#                                so both instances run without PLL configuration
#   +DISABLE_AXI_SYSTEM_MONITOR  a reference-TB monitor this bench does not have
#   +random_sram                 a reference-TB SRAM preload this bench does not have
#
# +BOOT_I3C is carried to mirror the reference, but selects nothing here: I3C is what the
# firmware takes when the BOOT_I2C strap does not read as set, so every entry in this file
# runs I3C. The two interface-latch members reach I2C a different way -- their firmware
# calls I2C_GetDriverInstance() directly instead of going through initialize_interface().
#
# The reference also randomizes the ROM image itself (+rom_bin64=rom_randomized.bin64);
# this bench loads prod_rom.bin64 unmodified.

[[tests]]
name = "smc_occp_random_command_test"
module = "smc_occp_rom_only_test"
target = "dual"
seed = 1
timeout_sec = 7200
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_random_test", mode = "occp_rom_only" }
args = [
    "+BOOT_I3C",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_random_test.rom.hex",
    "+occp_case=smc_occp_random_command_test",
    "+rom_test_timeout=1000000000",
]

