[[tests]]
name = "smc_occp_interface_latch_test"
module = "smc_occp_rom_only_test"
target = "dual"
seed = 1
timeout_sec = 7200
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_interface_latch_test", mode = "occp_rom_only" }
# +fuse_i2c_ids is what makes this test mean anything: it programs the target's
# two OCCP I2C channels with different addresses instead of leaving both on the
# ROM's 0x55 fallback. With both on 0x55 the two interfaces are
# indistinguishable on a shared bus, so "the ROM latched to the first one"
# cannot be told from "the ROM answered on both".
args = [
    "+BOOT_I3C",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_interface_latch_test.rom.hex",
    "+occp_case=smc_occp_interface_latch_test",
    "+fuse_i2c_ids",
    "+rom_test_timeout=200000000",
]

[[tests]]
name = "smc_occp_interface_unlatch_test"
module = "smc_occp_rom_only_test"
target = "dual"
seed = 1
# Verilator reaches about 4% of +rom_test_timeout in 7200 s, so this family's default
# wall-clock bound kills the run while the exchange is still advancing.
timeout_sec = 21600
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_interface_unlatch_test", mode = "occp_rom_only" }
# Same +fuse_i2c_ids reason as smc_occp_interface_latch_test above.
args = [
    "+BOOT_I3C",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_interface_unlatch_test.rom.hex",
    "+occp_case=smc_occp_interface_unlatch_test",
    "+fuse_i2c_ids",
    "+rom_test_timeout=1000000000",
]

[[tests]]
name = "smc_occp_ring_buffer_stress_test"
module = "smc_occp_rom_only_test"
target = "dual"
seed = 1
# Same wall-clock reason as smc_occp_interface_unlatch_test above.
timeout_sec = 21600
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_ring_buffer_stress_test", mode = "occp_rom_only" }
# The controller drives the ROM's own status ring buffer here. This is not the SEP ring
# buffer family, which needs an AXI driver this bench does not have yet.
args = [
    "+BOOT_I3C",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_ring_buffer_stress_test.rom.hex",
    "+occp_case=smc_occp_ring_buffer_stress_test",
    "+rom_test_timeout=1000000000",
]

