schema_version = 1

# OCCP boot family: the real production boot ROM as the OCCP target.
#
# These are the only SMC OSS tests that run product firmware
# (hw/sys/smc/bootrom/prod) instead of a DV stub image. The ROM is built by
# [c_build.bootrom] in smc_sim_cfg.toml with I3C_CORE=swap, which selects the
# HCI target driver for the vendored OCA i3c-core this tree instantiates.
#
# `firmware = { name = "prod_rom", mode = "bootrom" }` selects that c_build
# template; run_dv then stages prod_rom.bin64 next to the simulator cwd, which
# is why +rom_bin64 below is a bare basename and not a {repo_root} path.
#
# `run_modes = ["prod_rom"]` is required. Omitting it falls
# back to the `smoke` mode, whose +rom_hex=assets/smc_rom_default.hex (16 lines
# of zeros) is applied by smc_cpu_mem_integration's #0.2 backdoor *after*
# OCAH4CORECluster_rom_ext loaded +rom_bin64 at #0.1 -- zeroing the production
# ROM's reset vector. See [run_modes.prod_rom] in smc_sim_cfg.toml.

[[tests]]
name = "smc_prod_rom_occp_ready_test"
module = "smc_prod_rom_occp_ready_test"
seed = 1
timeout_sec = 3600
tags = ["ci", "occp_boot", "prod_rom", "pyuvm"]
run_modes = ["prod_rom"]
firmware = { name = "prod_rom", mode = "bootrom" }
# +smc_hold_cpu_boot: hold boot_stall from t=0 so the sequence programs
# RESET_VECTOR before any core fetches (same first-boot path as SMC_002).
# Real fuse sense (no +skip_fuse_sense): the ROM reads straps and fuses itself.
args = [
    "+rom_bin64=prod_rom.bin64",
    "+smc_hold_cpu_boot",
]

[[groups]]
name = "occp_boot"
tests = [
    "smc_prod_rom_occp_ready_test",
]
