[[tests]]
name = "smc_mailbox_field_sweep_test"
module = "smc_mailbox_field_sweep_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "pyuvm"]
run_modes = ["smoke"]

[[tests]]
# OUTBOUND_MAILBOX_0.CTRL @0x48, which smc_mailbox_field_sweep_test cannot
# reach: its offset list stops at IRQEN @0x38. CTRL is sw=w, so the coverage is
# the flush's effect on STATUS rather than a readback.
name = "smc_mailbox_flush_test"
module = "smc_mailbox_flush_test"
seed = 1
timeout_sec = 1800
tags = ["ci", "pyuvm"]
run_modes = ["smoke"]

[[groups]]
name = "mailbox_depth"
tests = [
    "smc_mailbox_data_error_test",
]
