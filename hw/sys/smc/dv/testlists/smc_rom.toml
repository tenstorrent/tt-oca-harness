tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_jump", mode = "occp_payload" }
# The testbench stages hello_world in the target and publishes where it went; the
# controller reads that back over OCCP and jumps the target into it. The address is
# redrawn per run, which is the point of the test.
args = [
    "+BOOT_I3C",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_jump.rom.hex",
    "+occp_payload_bin=hello_world.sram.bin",
    "+occp_payload_sym=hello_world.sram.sym",
    "+rom_test_timeout=200000000",
]

[[tests]]
name = "smc_occp_validate_boot_test"
module = "smc_occp_validate_boot_test"
target = "dual"
seed = 1
timeout_sec = 7200
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_validate_boot_test", mode = "occp_rom_only" }
# No payload: this checks the ROM's manifest handoff for an address the controller
# invents, so nothing has to be transferred or executed.
args = [
    "+BOOT_I3C",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_validate_boot_test.rom.hex",
    "+rom_test_timeout=200000000",
]

[[tests]]
name = "smc_occp_secure_boot_test"
module = "smc_occp_secure_boot_test"
target = "dual"
seed = 1
# The payload crosses I3C byte by byte, as in smc_occp_dual_unsecure_boot_test, and the
# secure flow then republishes it and reboots the cores. Headroom, not a target.
timeout_sec = 21600
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_secure_boot_test", mode = "occp_payload" }
# +lc_state=1 selects a secure lifecycle, which is what makes this test differ from the
# unsecure boot flow: on a secure lifecycle the ROM publishes a manifest instead of
# jumping, and the testbench stands in for the SEP that would boot it.
args = [
    "+BOOT_I3C",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_secure_boot_test.rom.hex",
    "+occp_payload_bin=hello_world.sram.bin",
    "+occp_payload_sym=hello_world.sram.sym",
    "+lc_state=1",
    # One 200 ms bound covers both the transfer and the post-manifest boot phase.
    "+rom_test_timeout=200000000",
]

[[tests]]
name = "smc_occp_dual_unsecure_boot_test"
module = "smc_occp_dual_unsecure_boot_test"
target = "dual"
seed = 1
# Headroom, not a target. The payload is a full sram-mode image (~15 KB), and
# every byte of it crawls over a ~2.6 MHz serial bus that Verilator simulates
# cycle by cycle, so the run takes hours of wall clock.
timeout_sec = 21600
tags = ["dual", "occp_boot", "prod_rom"]
run_modes = ["dual"]
firmware = { name = "dual_occp", mode = "dual_occp" }
# Three images, one per role. run_dv stages every declared c_build output next
# to the simulator cwd, which is why these are bare basenames.
#   +rom_bin64        target: production boot ROM (loaded into BOTH instances by
#                     OCAH4CORECluster_rom_ext, then overridden on u_bfm below)
#   +bfm_rom_hex      controller: the DV OCCP master image, applied to u_bfm
#                     only, at #0.3 so it wins over the shared load
#   +occp_payload_bin the image cocotb stages into the controller's SRAM over
#                     AXI and the controller then streams over I3C. An ordinary
#                     sram-mode test image; no ROM embedding and no striped
#                     backdoor is involved
#   +occp_payload_sym the test derives the OCCP JUMP entry offset from this
#                     (&main - &_enter) rather than hardcoding it
args = [
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_unsecure_boot_test.rom.hex",
    "+occp_payload_bin=hello_world.sram.bin",
    "+occp_payload_sym=hello_world.sram.sym",
]

