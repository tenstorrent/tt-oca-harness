[[tests]]
name = "smc_occp_interface_latch_test"
module = "smc_occp_rom_only_test"
target = "dual"
seed = 1
timeout_sec = 7200
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "occp_interface_latch_test", mode = "occp_rom_only" }
# +fuse_i2c_ids is what makes this test mean anything: it programs the target's
# two OCCP I2C channels with different addresses instead of leaving both on the
# ROM's 0x55 fallback. With both on 0x55 the two interfaces are
# indistinguishable on a shared bus, so "the ROM latched to the first one"
# cannot be told from "the ROM answered on both".
args = [
    "+BOOT_I3C",
    "+FORCE_STATUS_REPORTING",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=occp_interface_latch_test.rom.hex",
    "+occp_case=smc_occp_interface_latch_test",
    "+fuse_i2c_ids",
    "+rom_test_timeout=200000000",
]

