target = "dual"
seed = 1
timeout_sec = 57600
tags = ["dual", "occp_boot", "bl0_small"]
run_modes = ["dual"]
firmware = { name = "sep_ring_buffer_test", mode = "occp_rom_only" }
# 600 writes into 512 slots; the ring keeps one slot empty, so at most 511 are retained.
# The firmware checks only the number of successful reads and that the reads after
# them report an empty buffer; it logs the entry values without comparing them, so
# which 511 entries the ROM hands back is not checked.
args = [
    "+BOOT_I3C",
    "+FORCE_STATUS_REPORTING",
    "+rom_bin64=prod_rom.bin64",
    "+bfm_rom_hex=sep_ring_buffer_test.rom.hex",
    "+sep_rb_case=smc_sep_ring_buffer_overflow_test",
    "+sep_rb_entries=600",
    "+rom_test_timeout=500000000",
]

