schema_version = 1

# Reproducers for filed RTL issues. These are EXPECTED TO FAIL against current
# RTL -- that is their job. They exist so a known defect has runnable evidence
# instead of living only in an issue body.
#
# Every entry carries `expect_fail = "<reason>"`, which the runner grades: the
# observed FAIL is PASS, and an observed PASS is FAIL with the reason "the
# defect is gone" (tools/dv/doc/run-dv.adoc, Expected failures). So the group
# runs green on the weekly tier (.github/workflows/regress.yml, the `rtl_issue`
# row) while the defects stand, and goes red the week one of them is fixed.
#
# Conventions for this file, and the reason for each:
#   * `expect_fail` on every entry -- the recorded reason is what the graded
#                              PASS means; an entry without one is red for no
#                              stated cause and the loader refuses a bare flag.
#   * no `ci` tag           -- `ci` is the hosted-runner set (`hosted`), whose
#                              passes feed the coverage dashboard; a graded
#                              expected failure must not count there.
#   * not in `smoke`/`hosted`/`all` -- same reason; the group has its own
#                              weekly row so its flip is visible on its own.
#   * one test per defect   -- so the run either reproduces that defect or does
#                              not, with nothing else able to redden it.
#
# When a defect is fixed, this group goes red on that leaf with the
# `expected_fail_passed` bucket. Move the test into the owning feature testlist,
# drop `expect_fail`, add the `ci` tag there and enrol it in `all` and `hosted`.
# Do not "fix" a red test here by weakening its checker.

[[tests]]
# Clearing DATA_CTRL.interrupt_enable while a GPIO interrupt is
# asserted does not de-assert interrupt_o. gpio.sv:253-261 uses the enable as
# the interrupt flop's clock enable rather than the output mask that
# hw/ip/gpio/doc/architecture.adoc:122 specifies.
name = "smc_gpio_irq_mask_deassert_test"
module = "smc_gpio_irq_mask_deassert_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue", "gpio", "pyuvm"]
run_modes = ["smoke"]
expect_fail = "#1602: clearing DATA_CTRL.interrupt_enable while a GPIO interrupt is asserted does not de-assert interrupt_o"

[[tests]]
# INTERRUPT_ENABLE gates the interrupt set path instead of masking the
# output. log_engine.rdl:159-161 records the intended `hwenable` binding -- an
# output mask -- as commented out, and log_engine.sv:489-496 puts the enable on
# the set path while driving irq_o from INTR_STATUS unqualified. gpio.sv and
# i2c_core.sv:981,995-1010 have the same shape; this leaf is the log-engine
# instance of that pattern.
name = "smc_log_engine_intr_mask_test"
module = "smc_log_engine_intr_mask_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue", "uart", "pyuvm"]
run_modes = ["smoke"]
expect_fail = "#1635: INTERRUPT_ENABLE gates the log-engine interrupt set path instead of masking irq_o"

[[tests]]
# The same enable-on-set-path pattern, third IP: i2c_core.sv:1000 ANDs the event
# with the enable before the flop and :981 drives irq_o from INTR_STATE.intr
# unqualified -- the same shape as log_engine.sv and gpio.sv.
name = "smc_i2c_intr_mask_test"
module = "smc_i2c_intr_mask_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue", "i2c", "pyuvm"]
run_modes = ["smoke"]
expect_fail = "#1635: INTR_ENABLE gates the i2c_core interrupt set path instead of masking irq_o (the I2C instance of the pattern)"

[[tests]]
# Dead offsets inside seven register windows wrap onto live registers and the
# bus answers OKAY (wrap_to_live=7 read_alias=6 of 8 checkable probes): the
# wrapper truncates to the PeakRDL address width before any range check, so
# 0xC001_6208 lands on outbound filter 0 START_ADDR, 0xC000_A04C on
# TIMER_PRESET_LO, and so on. OKAY-into-void with the live register untouched
# is tallied, not asserted -- see the sequence docstring for the scope.
name = "smc_deadspace_decode_test"
module = "smc_deadspace_decode_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue", "vplan_gap", "local_axi_depth", "pyuvm"]
run_modes = ["smoke"]
expect_fail = "#585: dead offsets in seven register windows wrap onto live registers with an OKAY response"

[[tests]]
# The ALIAS_REMAP translation and the MMODE/ALIAS reset sweep pass; the CLA
# deny leg does not. #1510 closed the #1488 hang (an in-window offset no MMR
# decoder claims left pready low) and those offsets now complete -- with OKAY.
# The first hole the generated CLA map yields, +0x38, answers resp=0 where the
# leg expects SLVERR/DECERR. No filed issue records the OKAY completion.
name = "smc_remap_cla_test"
module = "smc_remap_cla_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue", "pyuvm"]
run_modes = ["smoke"]
expect_fail = "CLA aperture: the unmapped in-window offset +0x38 completes with OKAY instead of SLVERR/DECERR (the #1488 hang is fixed by #1510; the OKAY completion is not filed)"

[[groups]]
name = "rtl_issue"
tests = [
    "smc_gpio_irq_mask_deassert_test",
    "smc_log_engine_intr_mask_test",
    "smc_i2c_intr_mask_test",
    "smc_deadspace_decode_test",
    "smc_remap_cla_test",
]
expected_count = 5
