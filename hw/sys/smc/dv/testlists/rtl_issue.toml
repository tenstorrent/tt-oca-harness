schema_version = 1

# Reproducers for filed RTL issues. These are EXPECTED TO FAIL against current
# RTL -- that is their job. They exist so a known defect has runnable evidence
# instead of living only in an issue body.
#
# Conventions for this file, and the reason for each:
#   * no `ci` tag           -- `ci` is the hosted-runner set; a red test there
#                              stops being informative within a day.
#   * not in `smoke`/`hosted` -- the PR gate (sim.yml) and the scheduled tiers
#                              (regress.yml) must stay green.
#   * one test per issue    -- so the run either reproduces that issue or does
#                              not, with nothing else able to redden it.
#
# When an issue is fixed, move its test into the owning feature testlist and add
# the `ci` tag there. Do not "fix" a red test here by weakening its checker.

[[tests]]
# Clearing DATA_CTRL.interrupt_enable while a GPIO interrupt is
# asserted does not de-assert interrupt_o. gpio.sv:253-261 uses the enable as
# the interrupt flop's clock enable rather than the output mask that
# hw/ip/gpio/doc/architecture.adoc:122 specifies.
name = "smc_gpio_irq_mask_deassert_test"
module = "smc_gpio_irq_mask_deassert_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue", "gpio", "pyuvm"]
run_modes = ["smoke"]

[[tests]]
# A timed-out eFuse read completes without setting
# EFUSE_READ_CTRL.READ_STATUS. efuse_read_interface.sv's ST_WAIT_RESP timeout
# arm never assigns read_err_d, whose always_comb default is a hold, while
# efuse_program_interface.sv sets program_err_d on the identical arm.
name = "smc_efuse_read_timeout_status_test"
module = "smc_efuse_read_timeout_status_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue", "efuse", "pyuvm"]
run_modes = ["smoke"]

[[tests]]
# INTERRUPT_ENABLE gates the interrupt set path instead of masking the
# output. log_engine.rdl:159-161 records the intended `hwenable` binding -- an
# output mask -- as commented out, and log_engine.sv:489-496 puts the enable on
# the set path while driving irq_o from INTR_STATUS unqualified. gpio.sv and
# i2c_core.sv:981,995-1010 have the same shape; this leaf is the log-engine
# instance of that pattern.
name = "smc_log_engine_intr_mask_test"
module = "smc_log_engine_intr_mask_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue", "uart", "pyuvm"]
run_modes = ["smoke"]

[[tests]]
# The same enable-on-set-path pattern, third IP: i2c_core.sv:1000 ANDs the event
# with the enable before the flop and :981 drives irq_o from INTR_STATE.intr
# unqualified -- the same shape as log_engine.sv and gpio.sv.
name = "smc_i2c_intr_mask_test"
module = "smc_i2c_intr_mask_test"
seed = 1
timeout_sec = 1800
tags = ["rtl_issue", "i2c", "pyuvm"]
run_modes = ["smoke"]

[[groups]]
name = "rtl_issue"
tests = [
    "smc_gpio_irq_mask_deassert_test",
    "smc_efuse_read_timeout_status_test",
    "smc_log_engine_intr_mask_test",
    "smc_i2c_intr_mask_test",
]
expected_count = 4
