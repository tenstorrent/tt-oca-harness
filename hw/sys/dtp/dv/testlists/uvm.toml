schema_version = 1

# SV-UVM testlist for `--dut dtp_uvm`. Logical item names match the VPLAN scenario names (shared
# with the PyUVM flow, framework-neutral); `module` carries the SV-UVM implementation class and
# drives +UVM_TESTNAME. Kept out of all.toml, which belongs to the cocotb flow's item namespace.

[[tests]]
name = "dtp_sanity_test"
module = "dtp_uvm_sanity_test"
seed = 1
timeout_sec = 1800
tags = ["smoke", "uvm"]
run_modes = ["smoke"]

[[tests]]
name = "dtp_jtag2axi_smc_otp_axi_single_write_read_test"
module = "dtp_uvm_jtag2axi_smc_otp_test"
seed = 1
timeout_sec = 1800
tags = ["jtag2axi", "uvm"]
run_modes = ["smoke"]

[[tests]]
name = "dtp_jtag2axi_smc_axi_single_write_read_test"
module = "dtp_uvm_jtag2axi_smc_axi_test"
seed = 1
timeout_sec = 1800
tags = ["jtag2axi", "uvm"]
run_modes = ["smoke"]

[[groups]]
name = "smoke"
tests = ["dtp_sanity_test"]

[[groups]]
name = "jtag2axi"
tests = [
  "dtp_jtag2axi_smc_otp_axi_single_write_read_test",
  "dtp_jtag2axi_smc_axi_single_write_read_test",
]
