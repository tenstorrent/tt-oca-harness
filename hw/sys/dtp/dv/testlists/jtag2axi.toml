schema_version = 1

# JTAG2AXI scenarios on the SMC fabric, SMC OTP and SEP OTP bridges.

[[tests]]
name = "dtp_jtag2axi_smc_axi_single_write_read_test"
module = { cocotb = "dtp_jtag2axi_smc_axi_single_write_read_test", uvm = "dtp_jtag2axi_smc_axi_single_write_read_test" }
seed = 1
timeout_sec = 1800
tags = ["smoke", "ci", "jtag2axi"]
run_modes = ["jtag2axi"]

