schema_version = 1

# Launch entry: selected by `--dut dtp`. The DTP TB uses open-source VIP (cocotbext-jtag for the
# JTAG TAP, cocotbext-axi for the JTAG2AXI debug/OTP AXI targets); iJTAG/CTP/CTM stay on in-house
# BFMs (wired in later phases). Shared stage graph + tool list come from profile = "native-cocotb".
name = "dtp"
profile = "native-cocotb"
description = "DTP (Debug & Test Ports) OSS PyUVM smoke and functional flow"

[testlist]
path = "testlists/all.toml"
format = "toml_list"

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "hw/sys/dtp/dv/build"]

[build]
# Native build is driven by the Bender/filelist keys below; .core files are external-only.
top_module = "dtp_uvm_top"
top_file = "hw/sys/dtp/dv/tb/tb_top.sv"
filelist = "hw/sys/dtp/dv/build/dtp_dut_compile.f"
bender_filelist = "hw/sys/dtp/dv/build/dtp_bender.f"
work_dir = "hw/sys/dtp/dv/build"
# Bender targets pruned to what the DTP DUT needs. Refine against `bender script`
# output during flist bring-up if elaboration is missing/duplicating sources.
common_bender_targets = [
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "register_interface_l1",
]
bender_targets = ["dtp", "simulation"]
incdirs = ["hw/sys/dtp/dv/tb"]
# Verilator-friendly behavioral stubs. Listed ahead of the bender filelist so
# the -Wno-MODDUP "first definition wins" rule selects them over the real RTL.
# The cross_trigger_*_reg stubs replace PeakRDL CSR blocks whose dynamically
# indexed struct-array NBA hits Verilator BLKLOOPINIT under --public-flat-rw;
# the cross-trigger CSR path is tied off in tb_top, so JTAG/JTAG2AXI are unaffected.
stubs = [
  "hw/sys/dtp/dv/tb/verilator_stubs/prim_sync2.sv",
]

[cocotb]
# Uniform flow-first layout: cocotb env/seq_lib/tests live under cocotb/.
python_root = "hw/sys/dtp/dv/cocotb"
test_dir = "hw/sys/dtp/dv/cocotb/tests"
python_paths = [
  "hw/common/dv/vip",
  "dv/vip/cocotb",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

[run_modes.smoke]
description = "PyUVM DTP smoke tests for TAP FSM and IDCODE contributor bring-up"
timeout_sec = 1800
args = []

[run_modes.basic_jtag]
description = "PyUVM DTP primary TAP and basic JTAG instruction scenarios"
timeout_sec = 1800
args = []

[run_modes.functional]
description = "PyUVM JTAG2AXI directed tests against OCAH AXI memory BFMs"
timeout_sec = 1800
args = []

[run_modes.debug_tdr]
description = "PyUVM DTP TMP, DEBUG_CONTROL, IC_RESET, and capabilities TDR tests"
timeout_sec = 1800
args = []

# OD-19: one [targets.<name>] merges the former [compile_targets]/[run_targets] split.
# Tool-specific flags live under [targets.<name>.tools.<tool>].
[targets.default]
description = "DTP cocotb target for public JTAG/JTAG2AXI smoke and coverage"
build_dir = "hw/sys/dtp/dv/build/cocotb"   # per-tool subdir appended: cocotb/<tool>

[targets.default.tools.verilator]
flags = [
  "-Wno-BLKLOOPINIT",
  "+define+VERILATOR",
  "+define+ASSERTS_OFF",
]
