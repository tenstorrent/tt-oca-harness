[[holes]]
id = "fcov-smc_axi-reset_timing_request_issued"
title = "smc_axi reset timing request issued"
category = "needs_review"
disposition = "review"
status = "open"
confidence = "high"
rationale = "Fires only when the system reset falls with a write or read request valid before its AXI handshake. The two reset-abort scenarios are the only stimulus that drives the system reset while a bridge is mid-flight, and the point does not fire under them. Point: reset lands with the request stalled on the bus."
owner = "dtp-dv"
reviewer = "dtp-design"
date = "2026-08-29"
issues = ["https://github.com/tenstorrent/tt-oca-harness/issues/1330", "https://github.com/tenstorrent/tt-oca-harness/issues/1953"]
[[holes.native]]
tool = "verilator"
metric_family = "user"
hierarchy = "dtp_uvm_top.u_dtp_jtag2axi_fcov.c_smc_axi_reset_timing_request_issued"

