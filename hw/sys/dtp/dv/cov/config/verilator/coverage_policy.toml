title = "smc_axi reset timing request issued"
category = "needs_review"
disposition = "review"
status = "open"
confidence = "high"
rationale = "Sampled only by the reset-abort leaves, which drive the system reset while the bridge is mid-flight and fail on the bridge defect (the FSM stays in AXI_WAIT_BRESP after an AXI-side reset until a TAP reset). Point: reset lands with the request stalled on the bus."
