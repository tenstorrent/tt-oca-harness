#
# DTP Verilator coverage policy for the database that `dtp_cov_scope.vlt`
# scopes at compile time (`[coverage.verilator]` in dtp_sim_cfg.toml). A
# [[holes]] entry records the structural reason an uncovered point cannot
# fire; an uncovered point without one is reported unclassified. It sets no
# [[thresholds]]: the runner reports the family figures, a run's status comes
# from its tests, and DTP_FCOV.adoc states the targets the figures are read
# against.

schema_version = 1
dut = "dtp"
scope_epoch = "dtp-fcov-v2"

[[holes]]
id = "sva-smc-axi-aw-multi-beat"
title = "OCAH_AXI_C_AW_MULTI_BEAT on the SMC fabric checker"
category = "unreachable"
disposition = "waive"
status = "accepted"
confidence = "high"
rationale = "The JTAG2AXI bridge issues every SMC fabric request as one beat, with AWLEN 0, so the multi-beat write cover cannot fire. The VCS waiver of the same cover is in ../vcs/dtp_waivers.el."
owner = "ocah-dv"
reviewer = "ocah-dv"
[[holes.native]]
tool = "verilator"
metric_family = "user"
hierarchy = "tb_top.u_m_axi_sva.gen_axi4_rules__DOT__OCAH_AXI_C_AW_MULTI_BEAT"

