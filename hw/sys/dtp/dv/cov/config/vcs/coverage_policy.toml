#
# DTP VCS coverage policy: the report inputs for the database that
# `dtp_cov_scope.hier` scopes at compile time (`[coverage.vcs]` in
# dtp_sim_cfg.toml). It sets no [[thresholds]]: the runner reports the family
# figures, a run's status comes from its tests, and DTP_FCOV.adoc states the
# targets the figures are read against. URG hands the runner code-coverage
# family totals and no per-point list, so this file carries no [[holes]]: a VCS
# hole closes through a scenario, a design or model change, or an entry in one
# of the two URG exclusion lists the `[[native_files]]` entries below name
# (DTP_FCOV.adoc, Unreachability exclusion list and Waiver list). Neither list
# carries a covergroup bin, which takes no waiver.

schema_version = 1
dut = "dtp"
scope_epoch = "dtp-vcs-cov-v2"

# The code-coverage points a formal unreachability analysis over the `all`
# regression's merged coverage database proves no stimulus reaches in the
# bench's environment. URG applies it at report time and maps each entry onto
# the reported design by the item's signature, whatever the scope checksum, so
# an entry outlives an RTL change that leaves its signal or expression in place.
# The digest pins the file: a regenerated list takes a new entry.
[[native_files]]
tool = "vcs"
role = "unreachable"
path = "dtp_unreachable.el"
apply_phase = "report"
args = ["-elfile", "{path}"]
sha256 = "e5b31aa61ed0e5b93d8c2bec84c3c62efbc61de379280d1b88b5981b8ebc711c"

# The points the bench reaches by no stimulus the DTP's interface contract
# allows, each with the fact that rules it out: the SMC fabric response ID
# echo, the CT_Ack_out pad inputs, and the burst rules of the SMC fabric
# checker. Its entries take design review; the digest pins the file.
[[native_files]]
tool = "vcs"
role = "waive"
path = "dtp_waivers.el"
apply_phase = "report"
args = ["-elfile", "{path}"]
sha256 = "7ac690b7ec24a701634daa102e73cc24044c8e6a61f18c61400607b8470ab24c"
