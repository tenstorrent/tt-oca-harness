#
# DTP VCS coverage policy: the signoff thresholds of DTP_FCOV.adoc, graded over
# the database that `dtp_cov_scope.hier` scopes at compile time (`[coverage.vcs]`
# in dtp_sim_cfg.toml). URG hands the runner family totals and no per-point
# list, so this file carries no [[holes]] and every rule grades its family
# total: a VCS hole closes through a scenario, a design or model change, or an
# entry in the URG exclusion list that `[coverage.vcs].exclude_files` names.
# That list carries code and assertion points only; a covergroup bin has no
# waiver, which `population = "raw"` on the functional rule states.

schema_version = 1
dut = "dtp"
scope_epoch = "dtp-vcs-cov-v1"

[[thresholds]]
id = "line"
tool = "vcs"
metric_family = "line"
population = "effective"
minimum_percent = 98.0

[[thresholds]]
id = "condition"
tool = "vcs"
metric_family = "condition"
population = "effective"
minimum_percent = 98.0

[[thresholds]]
id = "toggle"
tool = "vcs"
metric_family = "toggle"
population = "effective"
minimum_percent = 98.0

[[thresholds]]
id = "fsm"
tool = "vcs"
metric_family = "fsm_state"
population = "effective"
minimum_percent = 98.0

[[thresholds]]
id = "branch"
tool = "vcs"
metric_family = "branch"
population = "effective"
minimum_percent = 98.0

# Every assertion in scope attempted and every cover directive hit: the DUT's
# own assertions, the coverage modules' cover properties, and the shared
# protocol checkers.
[[thresholds]]
id = "assertion"
tool = "vcs"
metric_family = "assertion"
population = "effective"
minimum_percent = 100.0

[[thresholds]]
id = "functional"
tool = "vcs"
metric_family = "functional"
population = "raw"
minimum_percent = 100.0
