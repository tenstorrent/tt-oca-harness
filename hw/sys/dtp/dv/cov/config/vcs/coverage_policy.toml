#
# DTP VCS coverage policy: the signoff thresholds of DTP_FCOV.adoc, graded over
# the database that `dtp_cov_scope.hier` scopes at compile time (`[coverage.vcs]`
# in dtp_sim_cfg.toml). URG hands the runner family totals and no per-point
# list, so this file carries no [[holes]] and every rule grades its family
# total: a VCS hole closes through a scenario, a design or model change, or an
# entry in the URG exclusion list that the `[[native_files]]` entry below names
# (DTP_FCOV.adoc, Unreachability exclusion list). That list carries code
# points only; a covergroup bin has no waiver, which `population = "raw"` on
# the functional rule states.

schema_version = 1
dut = "dtp"
scope_epoch = "dtp-vcs-cov-v1"

# The code-coverage points a formal unreachability analysis over the qualification
# regression's merged database proves no stimulus reaches in the bench's environment;
# URG applies it at report time and applies no entry whose scope checksum differs from the
# reported design.
[[native_files]]
tool = "vcs"
role = "unreachable"
path = "dtp_unreachable.el"
apply_phase = "report"
args = ["-elfile", "{path}"]
sha256 = "154ca4e3a983d46c91ef0884e585e99d26f1ea4a2cc40dbcd38cc82df7c0fe0f"
commit = "fc7eb2c6a"
date = "2026-09-22"
expires = "2027-03-31"

[[thresholds]]
id = "line"
tool = "vcs"
metric_family = "line"
population = "effective"
minimum_percent = 98.0

[[thresholds]]
id = "condition"
tool = "vcs"
metric_family = "condition"
population = "effective"
minimum_percent = 98.0

[[thresholds]]
id = "toggle"
tool = "vcs"
metric_family = "toggle"
population = "effective"
minimum_percent = 98.0

[[thresholds]]
id = "fsm"
tool = "vcs"
metric_family = "fsm_state"
population = "effective"
minimum_percent = 98.0

[[thresholds]]
id = "branch"
tool = "vcs"
metric_family = "branch"
population = "effective"
minimum_percent = 98.0

# Every assertion in scope attempted and every cover directive hit: the DUT's
# own assertions, the coverage modules' cover properties, and the shared
# protocol checkers.
[[thresholds]]
id = "assertion"
tool = "vcs"
metric_family = "assertion"
population = "effective"
minimum_percent = 100.0

[[thresholds]]
id = "functional"
tool = "vcs"
metric_family = "functional"
population = "raw"
minimum_percent = 100.0
