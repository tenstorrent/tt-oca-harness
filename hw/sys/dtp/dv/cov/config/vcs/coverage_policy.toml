#
# DTP VCS coverage policy: the report inputs for the database that
# `dtp_cov_scope.hier` scopes at compile time (`[coverage.vcs]` in
# dtp_sim_cfg.toml). It sets no [[thresholds]]: the runner reports the family
# figures, a run's status comes from its tests, and DTP_FCOV.adoc states the
# targets the figures are read against. URG hands the runner code-coverage
# family totals and no per-point list, so this file carries no [[holes]]: a VCS
# hole closes through a scenario, a design or model change, or an entry in one
# of the two URG exclusion lists the `[[native_files]]` entries below name
# (DTP_FCOV.adoc, Unreachability exclusion list and Waiver list). Neither list
# carries a covergroup bin, which takes no waiver.

schema_version = 1
dut = "dtp"
scope_epoch = "dtp-vcs-cov-v3"

# The code-coverage points a formal unreachability analysis over the `all`
# regression's merged coverage database proves no stimulus reaches in the
# bench's environment. URG applies it at report time and maps each entry onto
# the reported design by the item's signature, whatever the scope checksum. A
# Toggle or Condition signature is the signal or expression the entry quotes, a
# Branch signature every condition of its decision tree, a Block (line)
# signature its statement and the condition that governs it, and a State or
# Transition signature the names of its FSM states. A change to that text, a
# renamed localparam or state included, drops the entry. The digest pins the
# file: a regenerated list takes a new entry.
[[native_files]]
tool = "vcs"
role = "unreachable"
path = "dtp_unreachable.el"
apply_phase = "report"
args = ["-elfile", "{path}"]
sha256 = "cbe52d31b0794ee065c1bc62b5d3612c48c11c83e2a9eadb440cba604c184bd0"

# The points the bench reaches by no stimulus the DTP's interface contract
# allows, each with the fact that rules it out: the SMC fabric response ID
# echo from the DTP port through the bridge's clock-domain crossing, the
# EXOKAY arm of each JTAG2AXI bridge's response decode, the W-refused state of
# each bridge's write path, the CT_Ack_out pad
# inputs, the burst rules of the SMC fabric checker, a one-cycle CT_Req_in gap
# at a CTP receiver, and the cross-trigger crossbar points its register map and
# flow control rule out. Its entries take design review; the digest pins the
# file.
[[native_files]]
tool = "vcs"
role = "waive"
path = "dtp_waivers.el"
apply_phase = "report"
args = ["-elfile", "{path}"]
sha256 = "3d6c9b05c83c2ab11bbcd6140801ee601c706cf31095973f13ecb0615f863695"
