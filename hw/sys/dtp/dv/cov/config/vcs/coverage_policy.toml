#
# DTP VCS coverage policy: the report inputs for the database that
# `dtp_cov_scope.hier` scopes at compile time (`[coverage.vcs]` in
# dtp_sim_cfg.toml). It sets no [[thresholds]]: the runner reports the family
# figures, a run's status comes from its tests, and DTP_FCOV.adoc states the
# targets the figures are read against. URG hands the runner family totals and
# no per-point list, so this file carries no [[holes]]: a VCS hole closes
# through a scenario, a design or model change, or an entry in the URG
# exclusion list that the `[[native_files]]` entry below names (DTP_FCOV.adoc,
# Unreachability exclusion list). That list carries code points only; a
# covergroup bin has no waiver.

schema_version = 1
dut = "dtp"
scope_epoch = "dtp-vcs-cov-v1"

# The code-coverage points a formal unreachability analysis over the `all`
# regression's merged coverage database proves no stimulus reaches in the
# bench's environment; URG applies it at report time and applies no entry whose
# scope checksum differs from the reported design. The digest pins the file: a
# regenerated list takes a new entry.
[[native_files]]
tool = "vcs"
role = "unreachable"
path = "dtp_unreachable.el"
apply_phase = "report"
args = ["-elfile", "{path}"]
sha256 = "e5b31aa61ed0e5b93d8c2bec84c3c62efbc61de379280d1b88b5981b8ebc711c"
