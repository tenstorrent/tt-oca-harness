schema_version = 1

# Launch entry: selected by `--dut dtp_uvm`. SystemVerilog UVM smoke flow for DTP, sharing the
# DUT RTL recipe (Bender targets, defines) with the cocotb `dtp` flow but with its own testlist
# namespace and build tree. Shared stage graph + tool list come from profile = "native-uvm".
name = "dtp_uvm"
profile = "native-uvm"
description = "DTP SV-UVM smoke flow (VCS)"

[testlist]
path = "testlists/uvm.toml"
format = "toml_list"

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "hw/sys/dtp/dv/build/uvm"]

[build]
# ONE tb_top module shared with the cocotb flow: +define+DTP_UVM_TB (see [targets.default])
# switches tb/tb_top.sv from the ported cocotb shape to the self-contained SV-UVM shape, which
# `include`s uvm/tests/dtp_tests.sv. Compile order is load-bearing and explicit — the generated
# filelist emits `sources` in listed order AFTER the bender filelist (DUT packages visible),
# then `top_file` last:
#   ocah_jtag_if (shared VIP) -> ocah_axi_if -> dtp_tb_if
#   -> AXI protocol SVA + behavioral responders (module collateral)
#   -> ocah_jtag_uvm_pkg -> ocah_axi_uvm_pkg (shared VIP agents/passive env)
#   -> dtp_seq_lib_pkg -> dtp_env_pkg -> tb_top.sv
top_module = "dtp_uvm_top"
top_file = "hw/sys/dtp/dv/tb/tb_top.sv"
filelist = "hw/sys/dtp/dv/build/uvm/dtp_uvm_compile.f"
bender_filelist = "hw/sys/dtp/dv/build/uvm/dtp_uvm_bender.f"
work_dir = "hw/sys/dtp/dv/build/uvm"
# Shared dependency targets (same recipe as dtp_sim_cfg.toml).
common_bender_targets = [
  "axi_rtl",
  "apb_rtl",
  "common_cells_rtl",
  "common_cell_sync_shim",
  "register_interface_l1",
]
# DUT and simulation targets.
bender_targets = ["dtp", "simulation"]
incdirs = [
  "hw/sys/dtp/dv/tb",
  "hw/common/assert",
  "hw/common/dv/vip/ocah_jtag_vip/uvm",
  "hw/common/dv/vip/ocah_axi_vip/uvm",
  "hw/sys/dtp/dv/uvm/env",
  "hw/sys/dtp/dv/uvm/seq_lib",
  "hw/sys/dtp/dv/uvm/tests",
]
sources = [
  "hw/common/dv/vip/ocah_jtag_vip/interface/ocah_jtag_if.sv",
  "hw/common/dv/vip/ocah_axi_vip/interface/ocah_axi_if.sv",
  "hw/sys/dtp/dv/tb/dtp_tb_if.sv",
  "hw/common/dv/vip/ocah_axi_vip/sva/ocah_axi_sva.sv",
  "hw/common/dv/vip/ocah_axi_vip/sv/ocah_axil_ram_responder.sv",
  "hw/common/dv/vip/ocah_axi_vip/sv/ocah_axi_ram_responder.sv",
  "hw/common/dv/vip/ocah_axi_vip/cov/ocah_axi_cov.sv",
  "hw/common/dv/vip/ocah_jtag_vip/cov/ocah_jtag_cov.sv",
  "hw/common/dv/vip/ocah_jtag_vip/sva/ocah_jtag_sva.sv",
  "hw/common/dv/vip/ocah_jtag_vip/uvm/ocah_jtag_uvm_pkg.sv",
  "hw/common/dv/vip/ocah_axi_vip/uvm/ocah_axi_uvm_pkg.sv",
  "hw/sys/dtp/dv/uvm/seq_lib/dtp_seq_lib_pkg.sv",
  "hw/sys/dtp/dv/uvm/env/dtp_env_pkg.sv",
]

[sim]
args = ["+UVM_VERBOSITY=UVM_MEDIUM"]

[run_modes.smoke]
description = "SV-UVM DTP TAP smoke (VPLAN 0.1 sanity semantics)"
timeout_sec = 1800
args = []

[targets.default]
description = "DTP SV-UVM default target"
build_dir = "hw/sys/dtp/dv/build/uvm"
# Appends to the native-uvm profile's [target_defaults.default] defines (dedup-merge):
# selects the SV-UVM shape of the shared tb/tb_top.sv.
defines = ["DTP_UVM_TB"]
