<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="920" height="660" viewBox="0 0 920 660">
  <defs>
    <style>
      text { font-family: sans-serif; fill: #333333; }
      .title  { font-size: 14px; font-weight: bold; }
      .blabel { font-size: 12px; font-weight: bold; }
      .label  { font-size: 11px; }
      .small  { font-size: 10px; fill: #555555; }
      .port   { font-size: 9px; font-family: monospace; fill: #333333; }
    </style>
    <marker id="arr-b" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#4a7baa"/>
    </marker>
    <marker id="arr-r" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#aa4a4a"/>
    </marker>
    <marker id="arr-g" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#555555"/>
    </marker>
    <marker id="arr-k" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#998866"/>
    </marker>
  </defs>

  <text x="14" y="20" class="title">DTP Internal Structure and Access Paths</text>

  <!-- ══ DTP outer boundary  y=30..530 ════════════════════════════════════ -->
  <rect x="10" y="30" width="900" height="500" rx="6"
        fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="10 4"/>
  <text x="26" y="50" class="blabel" fill="#444444">Debug and Test Ports (DTP)</text>

  <!-- ══ JIU block  x=30..430, y=58..480 ═════════════════════════════════ -->
  <rect x="30" y="58" width="400" height="422" rx="5"
        fill="#f0f4f8" stroke="#4a7baa" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="46" y="76" class="blabel" fill="#4a7baa">JTAG Interface Unit (JIU)</text>

  <!-- PTAP  x=50..210, y=86..156 -->
  <rect x="50" y="86" width="160" height="70" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.2"/>
  <text x="130" y="112" class="label" text-anchor="middle" font-weight="bold">PTAP</text>
  <text x="130" y="128" class="small" text-anchor="middle">Primary TAP / IR Decoder</text>
  <text x="130" y="143" class="small" text-anchor="middle">DEBUG_CONTROL TDR</text>

  <!-- STAP chain  x=230..400, y=86..156 -->
  <rect x="230" y="86" width="170" height="70" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.2"/>
  <text x="315" y="112" class="label" text-anchor="middle" font-weight="bold">STAP Chain</text>
  <text x="315" y="128" class="small" text-anchor="middle">I/O · SMC · SEP · Extra</text>
  <text x="315" y="143" class="small" text-anchor="middle">(secondary scan)</text>

  <!-- PTAP → STAP scan chain -->
  <line x1="210" y1="121" x2="230" y2="121"
        stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr-b)"/>

  <!-- iJTAG SIB Network  x=50..410, y=174..228 -->
  <rect x="50" y="174" width="360" height="54" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.2"/>
  <text x="230" y="197" class="label" text-anchor="middle" font-weight="bold">iJTAG SIB Network</text>
  <text x="230" y="213" class="small" text-anchor="middle">Secure DFT · Non-secure DFT · DFD</text>

  <!-- PTAP instruction select → iJTAG (dashed, from PTAP bottom-center) -->
  <line x1="130" y1="156" x2="130" y2="174"
        stroke="#4a7baa" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr-b)"/>

  <!-- JTAG2AXI bridges  x=50..410, y=244..314 -->
  <rect x="50" y="244" width="360" height="70" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.2"/>
  <text x="230" y="266" class="label" text-anchor="middle" font-weight="bold">JTAG2AXI / JTAG2AXIL Bridges</text>
  <text x="230" y="282" class="small" text-anchor="middle">SMC fabric (AXI) · SMC OTP (AXI-Lite)</text>
  <text x="230" y="297" class="small" text-anchor="middle">SEP OTP (AXI-Lite)</text>

  <!-- iJTAG → bridges (dashed) -->
  <line x1="230" y1="228" x2="230" y2="244"
        stroke="#4a7baa" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr-b)"/>

  <!-- Scan Interfaces  x=50..220, y=334..388 -->
  <rect x="50" y="334" width="170" height="54" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.2"/>
  <text x="135" y="356" class="label" text-anchor="middle" font-weight="bold">Scan Interfaces</text>
  <text x="135" y="372" class="small" text-anchor="middle">BSR · STAP · DFD · DFT</text>

  <!-- jtag_clock_stop: PTAP DEBUG_CONTROL → CTN clock-stop aggregator.
       Route: right edge of PTAP (x=210) → right through gap above STAP (y=96) →
              up along x=448 → enters CTN at y=96 → down to aggregator top (y=172).
       This routes entirely through whitespace inside DTP, touching no blocks. -->
  <polyline points="210,96 448,96 448,172 520,172"
            fill="none" stroke="#998866" stroke-width="1.2" stroke-dasharray="5 3"
            marker-end="url(#arr-k)"/>
  <text x="350" y="90" class="port" fill="#998866">jtag_clock_stop</text>

  <!-- ══ CTN block  x=480..890, y=58..480 ═════════════════════════════════ -->
  <rect x="480" y="58" width="410" height="422" rx="5"
        fill="#f4f0f0" stroke="#aa4a4a" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="496" y="76" class="blabel" fill="#aa4a4a">Cross Trigger Network (CTN)</text>

  <!-- CTM  x=500..660, y=86..144 -->
  <rect x="500" y="86" width="160" height="58" rx="4"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1.2"/>
  <text x="580" y="112" class="label" text-anchor="middle" font-weight="bold">CTM</text>
  <text x="580" y="128" class="small" text-anchor="middle">N×M routing matrix</text>

  <!-- CTPs  x=700..860, y=86..144 -->
  <rect x="700" y="86" width="160" height="58" rx="4"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1.2"/>
  <text x="780" y="112" class="label" text-anchor="middle" font-weight="bold">CTPs</text>
  <text x="780" y="128" class="small" text-anchor="middle">[XTRIG_NUM_CTP-1:0]</text>

  <!-- CTM ↔ CTPs -->
  <line x1="660" y1="108" x2="700" y2="108"
        stroke="#aa4a4a" stroke-width="1.2" marker-end="url(#arr-r)"/>
  <line x1="700" y1="122" x2="660" y2="122"
        stroke="#aa4a4a" stroke-width="1.2" marker-end="url(#arr-r)"/>

  <!-- Clock-stop aggregator  x=500..850, y=160..224 -->
  <rect x="500" y="160" width="350" height="64" rx="4"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1.2"/>
  <text x="675" y="184" class="label" text-anchor="middle" font-weight="bold">Clock-Stop Aggregator</text>
  <text x="675" y="200" class="small" text-anchor="middle">OR( jtag_clock_stop , OR-reduce(xtrig_clk_stop_req_i) )</text>
  <text x="675" y="215" class="small" text-anchor="middle">→ stop_clks_o</text>

  <!-- AXI-Lite CSR  x=500..850, y=242..302 -->
  <rect x="500" y="242" width="350" height="60" rx="4"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1.2"/>
  <text x="675" y="266" class="label" text-anchor="middle" font-weight="bold">AXI-Lite CSR</text>
  <text x="675" y="282" class="small" text-anchor="middle">CTM routing · CTP config · clock-stop enables</text>
  <text x="675" y="297" class="small" text-anchor="middle">(axil_xtrig_req_i / axil_xtrig_resp_o)</text>

  <!-- Internal CT  x=500..660, y=320..376 -->
  <rect x="500" y="320" width="160" height="56" rx="4"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1.2"/>
  <text x="580" y="344" class="small" text-anchor="middle" font-weight="bold">Internal CT</text>
  <text x="580" y="360" class="small" text-anchor="middle">xtrig_ctm_src/dst_*</text>

  <!-- CTM → Internal CT (dashed) -->
  <line x1="580" y1="144" x2="580" y2="320"
        stroke="#aa4a4a" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr-r)"/>

  <!-- ══ External elements below DTP boundary (y > 530) ═══════════════════ -->

  <!-- JTAG pads  x=60..160, y=548..598 -->
  <rect x="60" y="548" width="100" height="46" rx="3"
        fill="#e8e8e8" stroke="#888888" stroke-width="1.2"/>
  <text x="110" y="567" class="small" text-anchor="middle" font-weight="bold">JTAG</text>
  <text x="110" y="582" class="small" text-anchor="middle">Pads</text>

  <!-- Port label, left of JTAG pads -->
  <text x="14" y="562" class="port">jtag_ptap</text>
  <text x="14" y="575" class="port">_client_*</text>

  <!-- JTAG pads ↔ PTAP: route vertically through DTP boundary gap at x=90/130 -->
  <!-- TDI: pads → up through y=530 → PTAP left (in) -->
  <polyline points="85,548 85,530 85,100 50,100"
            fill="none" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>
  <!-- TDO: PTAP bottom-right → down through y=530 → pads right (out) -->
  <polyline points="160,130 165,130 165,530 135,530 135,548"
            fill="none" stroke="#555555" stroke-width="1" stroke-dasharray="3 2"
            marker-end="url(#arr-g)"/>

  <!-- SMC (via SMU wiring)  x=310..510, y=548..598  — BELOW DTP boundary -->
  <rect x="310" y="548" width="200" height="46" rx="3"
        fill="#eeeeee" stroke="#888888" stroke-width="1.2"/>
  <text x="410" y="567" class="small" text-anchor="middle">SMC (via SMU wiring)</text>
  <text x="410" y="582" class="small" text-anchor="middle">axil_dtp_csr_req/resp</text>

  <!-- SMC → CTN AXI-Lite CSR:
       Route from SMC top (x=410, y=548) up through y=530, then right
       to x=675 (CSR center), then up to CSR bottom (y=302). -->
  <polyline points="460,548 460,530 675,530 675,302"
            fill="none" stroke="#aa4a4a" stroke-width="1.2" marker-end="url(#arr-r)"/>
  <!-- Response back: parallel wire slightly offset -->
  <polyline points="675,302 675,524 450,524 450,548"
            fill="none" stroke="#aa4a4a" stroke-width="1" stroke-dasharray="4 2"
            marker-end="url(#arr-r)"/>
  <text x="560" y="520" class="port" fill="#aa4a4a">axil_xtrig_req/resp</text>

  <!-- CTP pads  x=730..830, y=548..598 -->
  <rect x="730" y="548" width="100" height="46" rx="3"
        fill="#e8e8e8" stroke="#888888" stroke-width="1.2"/>
  <text x="780" y="567" class="small" text-anchor="middle" font-weight="bold">CTP</text>
  <text x="780" y="582" class="small" text-anchor="middle">Pads</text>

  <!-- CTPs ↔ CTP pads -->
  <polyline points="780,144 780,530 780,548"
            fill="none" stroke="#555555" stroke-width="1.2" stroke-dasharray="3 2"
            marker-end="url(#arr-g)"/>
  <text x="624" y="562" class="port">xtrig_ctp_req/ack_*</text>

  <!-- xtrig_clk_stop_req_i → aggregator right side; use text-anchor="end" at x=906 (≤920) -->
  <text x="906" y="200" class="port" text-anchor="end">xtrig_clk_stop_req_i</text>
  <line x1="850" y1="197" x2="907" y2="197"
        stroke="#555555" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr-g)"/>

  <!-- stop_clks_o exits CTN right, text-anchor="end" at x=906 -->
  <text x="906" y="232" class="port" text-anchor="end">stop_clks_o</text>
  <line x1="850" y1="229" x2="907" y2="229"
        stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>

  <!-- Scan chain external ports -->
  <text x="14" y="342" class="port">jtag_*_scan_* /</text>
  <text x="14" y="355" class="port">stap_*_host_*</text>
  <line x1="50" y1="361" x2="34" y2="361"
        stroke="#555555" stroke-width="1" marker-end="url(#arr-g)"/>
  <line x1="34" y1="350" x2="50" y2="350"
        stroke="#555555" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr-g)"/>

  <!-- AXI debug bridge external outputs -->
  <text x="14" y="460" class="port">axi_smc_dbg_* /</text>
  <text x="14" y="473" class="port">axil_*_otp_jtag_*</text>
  <line x1="50" y1="279" x2="34" y2="279"
        stroke="#4a7baa" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr-b)"/>

</svg>
