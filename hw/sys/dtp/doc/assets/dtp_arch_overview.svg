<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="860" height="540" viewBox="0 0 860 540">
  <defs>
    <style>
      text { font-family: sans-serif; fill: #333333; }
      .title  { font-size: 15px; font-weight: bold; }
      .label  { font-size: 12px; }
      .small  { font-size: 10px; fill: #555555; }
      .port   { font-size: 10px; font-family: monospace; fill: #333333; }
    </style>
  </defs>

  <!-- ── Background / outer DTP box ────────────────────────────────── -->
  <rect x="10" y="10" width="840" height="520" rx="8"
        fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="10 4"/>
  <text x="26" y="32" class="title">Debug and Test Ports (DTP)</text>

  <!-- ══ JIU block ════════════════════════════════════════════════════ -->
  <rect x="60" y="55" width="340" height="400" rx="6"
        fill="#f0f4f8" stroke="#4a7baa" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="76" y="77" class="label" font-weight="bold" fill="#4a7baa">JTAG Interface Unit (JIU)</text>

  <!-- PTAP -->
  <rect x="90" y="95" width="120" height="52" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1"/>
  <text x="150" y="117" class="label" text-anchor="middle">PTAP</text>
  <text x="150" y="132" class="small" text-anchor="middle">Primary TAP</text>

  <!-- STAPs -->
  <rect x="230" y="95" width="140" height="52" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1"/>
  <text x="300" y="117" class="label" text-anchor="middle">STAPs</text>
  <text x="300" y="132" class="small" text-anchor="middle">I/O · SMC · SEP · Extra</text>

  <!-- iJTAG / scan chains -->
  <rect x="90" y="170" width="280" height="52" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1"/>
  <text x="230" y="192" class="label" text-anchor="middle">iJTAG SIB Network</text>
  <text x="230" y="207" class="small" text-anchor="middle">DFT secure · DFT non-secure · DFD</text>

  <!-- JTAG2AXI bridges -->
  <rect x="90" y="245" width="280" height="70" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1"/>
  <text x="230" y="267" class="label" text-anchor="middle">JTAG2AXI / JTAG2AXIL Bridges</text>
  <text x="230" y="283" class="small" text-anchor="middle">SMC fabric (AXI)</text>
  <text x="230" y="298" class="small" text-anchor="middle">SMC OTP · SEP OTP (AXI-Lite)</text>

  <!-- Arrow: PTAP to STAPs scan chain -->
  <line x1="210" y1="121" x2="230" y2="121" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <!-- Arrows: JIU blocks to iJTAG -->
  <line x1="230" y1="147" x2="230" y2="170" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <!-- ══ CTN block ═════════════════════════════════════════════════════ -->
  <rect x="460" y="55" width="340" height="400" rx="6"
        fill="#f4f0f0" stroke="#aa4a4a" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="476" y="77" class="label" font-weight="bold" fill="#aa4a4a">Cross Trigger Network (CTN)</text>

  <!-- CTM -->
  <rect x="490" y="95" width="130" height="52" rx="4"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1"/>
  <text x="555" y="117" class="label" text-anchor="middle">CTM</text>
  <text x="555" y="132" class="small" text-anchor="middle">Cross Trigger Matrix</text>

  <!-- CTPs -->
  <rect x="640" y="95" width="130" height="52" rx="4"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1"/>
  <text x="705" y="117" class="label" text-anchor="middle">CTPs</text>
  <text x="705" y="132" class="small" text-anchor="middle">Cross Trigger Ports</text>

  <!-- Clock stop aggregator -->
  <rect x="490" y="170" width="280" height="52" rx="4"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1"/>
  <text x="630" y="192" class="label" text-anchor="middle">Clock Stop Aggregator</text>
  <text x="630" y="207" class="small" text-anchor="middle">OR-reduce CLAs ⊕ JTAG clock_stop → stop_clks_o</text>

  <!-- AXI-Lite CSR -->
  <rect x="490" y="245" width="280" height="52" rx="4"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1"/>
  <text x="630" y="267" class="label" text-anchor="middle">AXI-Lite CSR (axil_xtrig)</text>
  <text x="630" y="282" class="small" text-anchor="middle">CTM routing · CTP config · clock-stop enables</text>

  <!-- ══ External interfaces (left) ═══════════════════════════════════ -->
  <!-- JTAG pads -->
  <rect x="10" y="110" width="40" height="80" rx="4"
        fill="#e8e8e8" stroke="#888888" stroke-width="1"/>
  <text x="30" y="146" class="small" text-anchor="middle" transform="rotate(-90,30,146)">JTAG pads</text>
  <line x1="50" y1="150" x2="90" y2="121" stroke="#333333" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Scan chains (left bottom) -->
  <rect x="10" y="340" width="40" height="80" rx="4"
        fill="#e8e8e8" stroke="#888888" stroke-width="1"/>
  <text x="30" y="376" class="small" text-anchor="middle" transform="rotate(-90,30,376)">Scan chains</text>
  <!-- double arrow for scan in/out -->
  <line x1="50" y1="360" x2="88" y2="285" stroke="#333333" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="90" y1="275" x2="52" y2="390" stroke="#333333" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-gray)"/>

  <!-- ══ External interfaces (right) ══════════════════════════════════ -->
  <!-- CTP pads -->
  <rect x="810" y="95" width="40" height="80" rx="4"
        fill="#e8e8e8" stroke="#888888" stroke-width="1"/>
  <text x="830" y="131" class="small" text-anchor="middle" transform="rotate(-90,830,131)">CTP pads</text>
  <line x1="770" y1="121" x2="810" y2="131" stroke="#333333" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="810" y1="141" x2="770" y2="130" stroke="#333333" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Clock gates (right bottom) -->
  <rect x="810" y="200" width="40" height="56" rx="4"
        fill="#e8e8e8" stroke="#888888" stroke-width="1"/>
  <text x="830" y="228" class="small" text-anchor="middle" transform="rotate(-90,830,228)">PLL gates</text>
  <line x1="772" y1="193" x2="810" y2="220" stroke="#333333" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- ══ SMU AXI connection (middle) ═══════════════════════════════════ -->
  <!-- DTP-to-DTP internal link: JIU bridges to CTN AXI-Lite -->
  <!-- JTAG clock_stop from JIU to CTN -->
  <line x1="370" y1="280" x2="490" y2="267" stroke="#888888" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="430" y="270" class="small" text-anchor="middle">jtag_clock_stop</text>

  <!-- ══ SMU AXI crossbar (bottom) ════════════════════════════════════ -->
  <rect x="200" y="490" width="460" height="40" rx="4"
        fill="#eeeeee" stroke="#888888" stroke-width="1.5"/>
  <text x="430" y="515" class="label" text-anchor="middle" fill="#333333">SMU AXI Crossbar</text>

  <!-- JIU → SMU (AXI from JTAG2AXI) -->
  <line x1="230" y1="460" x2="230" y2="490" stroke="#4a7baa" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="245" y1="490" x2="245" y2="460" stroke="#4a7baa" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-blue)"/>
  <text x="260" y="480" class="small">axi_smc_dbg</text>

  <!-- SMU → CTN (AXI-Lite CSR) -->
  <line x1="590" y1="490" x2="590" y2="465" stroke="#aa4a4a" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="605" y1="465" x2="605" y2="490" stroke="#aa4a4a" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-red)"/>
  <text x="610" y="480" class="small">axil_xtrig</text>

  <!-- CTN down to SMU box -->
  <line x1="630" y1="297" x2="630" y2="490" stroke="#aa4a4a" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- JIU down to SMU box -->
  <line x1="230" y1="315" x2="230" y2="490" stroke="#4a7baa" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- ══ Arrow markers ════════════════════════════════════════════════ -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8"
            refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a7baa"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8"
            refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#aa4a4a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8"
            refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555555"/>
    </marker>
  </defs>

  <!-- ══ Port labels on JIU left edge ════════════════════════════════ -->
  <text x="56" y="108" class="port" text-anchor="end">jtag_ptap_client_*</text>
  <text x="56" y="350" class="port" text-anchor="end">jtag_*_scan_*</text>
  <text x="56" y="365" class="port" text-anchor="end">jtag_stap_*_host_*</text>

  <!-- ══ Port labels on CTN right edge ═══════════════════════════════ -->
  <text x="812" y="108" class="port">xtrig_ctp_req/ack_*</text>
  <text x="812" y="215" class="port">stop_clks_o</text>

</svg>
