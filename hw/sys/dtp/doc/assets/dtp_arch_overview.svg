<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="1000" height="860" viewBox="0 0 1000 860">
  <defs>
    <style>
      text { font-family: sans-serif; fill: #333333; }
      .title  { font-size: 22px; font-weight: bold; }
      .blabel { font-size: 21px; font-weight: bold; }
      .label  { font-size: 18px; }
      .small  { font-size: 18px; fill: #555555; }
      .port   { font-size: 17px; font-family: monospace; fill: #444444; }
    </style>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#4a7baa"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#aa4a4a"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#555555"/>
    </marker>
    <marker id="arr-k" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#998866"/>
    </marker>
  </defs>

  <text x="120" y="26" class="title">DTP Internal Structure and Access Paths</text>

  <!-- ══ DTP outer boundary  x=110..985, y=36..700 ══ -->
  <rect x="110" y="36" width="875" height="664" rx="8"
        fill="none" stroke="#666666" stroke-width="2.5" stroke-dasharray="12 5"/>
  <text x="130" y="62" class="blabel" fill="#444444">Debug and Test Ports (DTP)</text>

  <!-- ══ JIU block  x=130..490, y=74..650 ══ -->
  <rect x="130" y="74" width="360" height="576" rx="6"
        fill="#f0f4f8" stroke="#4a7baa" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="150" y="100" class="blabel" fill="#4a7baa">JTAG Interface Unit (JIU)</text>

  <!-- PTAP  x=155..325, y=114..214 -->
  <rect x="155" y="114" width="170" height="100" rx="5"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="240" y="152" class="label" text-anchor="middle" font-weight="bold">PTAP</text>
  <text x="240" y="176" class="small" text-anchor="middle">Primary TAP / IR Decoder</text>
  <text x="240" y="200" class="small" text-anchor="middle">DEBUG_CONTROL TDR</text>

  <!-- STAP Chain  x=155..325, y=234..334 -->
  <rect x="155" y="234" width="170" height="100" rx="5"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="240" y="270" class="label" text-anchor="middle" font-weight="bold">STAP Chain</text>
  <text x="240" y="294" class="small" text-anchor="middle">I/O · SMC · SEP · Extra</text>
  <text x="240" y="318" class="small" text-anchor="middle">(secondary scan)</text>

  <!-- PTAP → STAP -->
  <line x1="240" y1="214" x2="240" y2="234"
        stroke="#4a7baa" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- iJTAG SIB Network  x=155..475, y=364..448 -->
  <rect x="155" y="364" width="320" height="84" rx="5"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="315" y="398" class="label" text-anchor="middle" font-weight="bold">iJTAG SIB Network</text>
  <text x="315" y="424" class="small" text-anchor="middle">Secure DFT · Non-secure DFT · DFD</text>

  <!-- PTAP → iJTAG: leaves PTAP right edge at y=159 (mid-point), goes right to x=500,
       then down to y=406, then left to iJTAG right edge at x=475.
       Uses x=500 column, separate from jtag_clock_stop which uses x=498 at y=214. -->
  <polyline points="325,163 500,163 500,406 475,406"
            fill="none" stroke="#4a7baa" stroke-width="1.2" stroke-dasharray="5 3"
            marker-end="url(#arr-b)"/>

  <!-- JTAG2AXI bridges  x=155..475, y=464..574 -->
  <rect x="155" y="464" width="320" height="110" rx="5"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="315" y="500" class="label" text-anchor="middle" font-weight="bold">JTAG2AXI / JTAG2AXIL Bridges</text>
  <text x="315" y="526" class="small" text-anchor="middle">SMC fabric (AXI)</text>
  <text x="315" y="550" class="small" text-anchor="middle">SMC OTP · SEP OTP (AXI-Lite)</text>

  <!-- iJTAG → bridges -->
  <line x1="315" y1="448" x2="315" y2="464"
        stroke="#4a7baa" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr-b)"/>

  <!-- Scan Interfaces  x=155..335, y=590..650 -->
  <rect x="155" y="590" width="180" height="60" rx="5"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="245" y="618" class="label" text-anchor="middle" font-weight="bold">Scan Interfaces</text>
  <text x="245" y="642" class="small" text-anchor="middle">BSR · STAP · DFD · DFT</text>

  <!-- ══ CTN block  x=512..975, y=74..650 ══ -->
  <rect x="512" y="74" width="463" height="576" rx="6"
        fill="#f4f0f0" stroke="#aa4a4a" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="532" y="100" class="blabel" fill="#aa4a4a">Cross Trigger Network (CTN)</text>

  <!-- CTM  x=530..720, y=114..206 -->
  <rect x="530" y="114" width="190" height="92" rx="5"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1.5"/>
  <text x="625" y="154" class="label" text-anchor="middle" font-weight="bold">CTM</text>
  <text x="625" y="180" class="small" text-anchor="middle">N×M routing matrix</text>

  <!-- CTPs  x=760..960, y=114..206 -->
  <rect x="760" y="114" width="200" height="92" rx="5"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1.5"/>
  <text x="860" y="154" class="label" text-anchor="middle" font-weight="bold">CTPs</text>
  <text x="860" y="180" class="small" text-anchor="middle">[XTRIG_NUM_CTP-1:0]</text>

  <!-- CTM ↔ CTPs (bidirectional) -->
  <line x1="720" y1="144" x2="760" y2="144"
        stroke="#aa4a4a" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <line x1="760" y1="176" x2="720" y2="176"
        stroke="#aa4a4a" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <!-- Clock-Stop Aggregator  x=530..960, y=230..330 -->
  <rect x="530" y="230" width="430" height="100" rx="5"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1.5"/>
  <text x="745" y="262" class="label" text-anchor="middle" font-weight="bold">Clock-Stop Aggregator</text>
  <text x="745" y="290" class="small" text-anchor="middle">OR(jtag_clock_stop, OR-reduce(xtrig_clk_stop_req_i))</text>
  <text x="745" y="316" class="small" text-anchor="middle">→ stop_clks_o</text>

  <!-- jtag_clock_stop: leaves PTAP bottom-right corner (325,214), goes right to x=510,
       then down to aggregator y=280. Uses y=214 so it does not share the y=163
       segment used by the PTAP→iJTAG route above. -->
  <polyline points="325,214 510,214 510,280 530,280"
            fill="none" stroke="#998866" stroke-width="2" stroke-dasharray="6 4"
            marker-end="url(#arr-k)"/>
  <!-- jtag_clock_stop label: placed above the horizontal segment, clear of iJTAG line -->
  <text x="418" y="206" class="port" fill="#998866" text-anchor="middle">jtag_clock_stop</text>

  <!-- xtrig_clk_stop_req_i INPUT: enters aggregator from right side.
       Arrow must point INTO aggregator: from outside (x=975) to inside (x=960).
       Label placed at y=354 below the aggregator box to avoid overlap with block title. -->
  <line x1="975" y1="308" x2="960" y2="308"
        stroke="#555555" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arr-g)"/>
  <text x="978" y="313" class="port" fill="#888888">xtrig_clk_stop_req_i →</text>

  <!-- stop_clks_o OUTPUT: exits aggregator from right side, points outward -->
  <line x1="960" y1="326" x2="975" y2="326"
        stroke="#555555" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="978" y="331" class="port" fill="#888888">stop_clks_o</text>

  <!-- AXI-Lite CSR  x=530..960, y=354..450 -->
  <rect x="530" y="354" width="430" height="96" rx="5"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1.5"/>
  <text x="745" y="392" class="label" text-anchor="middle" font-weight="bold">AXI-Lite CSR</text>
  <text x="745" y="416" class="small" text-anchor="middle">CTM routing · CTP config · clock-stop enables</text>
  <text x="745" y="440" class="small" text-anchor="middle">(axil_xtrig_req_i / axil_xtrig_resp_o)</text>

  <!-- Internal CT  x=530..730, y=470..558 -->
  <rect x="530" y="470" width="200" height="88" rx="5"
        fill="#f4dcdc" stroke="#aa4a4a" stroke-width="1.5"/>
  <text x="630" y="510" class="label" text-anchor="middle" font-weight="bold">Internal CT</text>
  <text x="630" y="536" class="small" text-anchor="middle">xtrig_ctm_src/dst_*</text>

  <!-- CTM → Internal CT: route at x=520, outside aggregator left edge -->
  <polyline points="530,206 520,206 520,514 530,514"
            fill="none" stroke="#aa4a4a" stroke-width="1.2" stroke-dasharray="5 3"
            marker-end="url(#arr-r)"/>

  <!-- ══ External elements below DTP boundary (y > 700) ══ -->

  <!-- JTAG pads  x=155..310, y=726..782 -->
  <rect x="155" y="726" width="155" height="56" rx="4"
        fill="#e8e8e8" stroke="#888888" stroke-width="1.5"/>
  <text x="233" y="750" class="small" text-anchor="middle" font-weight="bold">JTAG Pads</text>
  <text x="233" y="774" class="port" text-anchor="middle">jtag_ptap_client_*</text>

  <!-- JTAG pads ↔ PTAP: route at x=136, orthogonal
       TDI solid: pads left → x=136 → up to PTAP left (155,163) -->
  <polyline points="155,742 136,742 136,163 155,163"
            fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <!-- TDO dashed: PTAP left (155,196) → x=126 → down → pads -->
  <polyline points="155,196 126,196 126,700 126,752 155,752"
            fill="none" stroke="#555555" stroke-width="1.2" stroke-dasharray="4 3"
            marker-end="url(#arr-g)"/>

  <!-- SMC box  x=375..590, y=726..782 -->
  <rect x="375" y="726" width="215" height="56" rx="4"
        fill="#eeeeee" stroke="#888888" stroke-width="1.5"/>
  <text x="483" y="750" class="small" text-anchor="middle">SMC (via SMU wiring)</text>
  <text x="483" y="774" class="port" text-anchor="middle">axil_dtp_csr_req/resp</text>

  <!-- SMC → CTN AXI-Lite CSR: request (solid, x=504), response (dashed, x=496) -->
  <polyline points="504,726 504,700 504,397 530,397"
            fill="none" stroke="#aa4a4a" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <polyline points="530,413 496,413 496,700 486,700 486,726"
            fill="none" stroke="#aa4a4a" stroke-width="1.2" stroke-dasharray="5 3"
            marker-end="url(#arr-r)"/>
  <text x="508" y="574" class="port" fill="#aa4a4a">axil_xtrig</text>
  <text x="508" y="596" class="port" fill="#aa4a4a">_req/resp</text>

  <!-- CTP pads  x=780..945, y=726..782 -->
  <rect x="780" y="726" width="165" height="56" rx="4"
        fill="#e8e8e8" stroke="#888888" stroke-width="1.5"/>
  <text x="863" y="750" class="small" text-anchor="middle" font-weight="bold">CTP Pads</text>
  <text x="863" y="774" class="port" text-anchor="middle">xtrig_ctp_req/ack_*</text>

  <!-- CTPs ↔ CTP pads: route at x=967, down then across -->
  <polyline points="960,165 967,165 967,700 863,700 863,726"
            fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 3"
            marker-end="url(#arr-g)"/>

  <!-- Scan chain external ports: placed inside viewBox with text-anchor="start" at x=112 -->
  <text x="112" y="614" class="port">jtag_*_scan_* /</text>
  <text x="112" y="636" class="port">stap_*_host_*</text>
  <line x1="155" y1="620" x2="130" y2="620"
        stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>
  <line x1="130" y1="605" x2="155" y2="605"
        stroke="#555555" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-g)"/>

  <!-- AXI debug bridge external outputs: inside viewBox with text-anchor="start" at x=112 -->
  <text x="112" y="490" class="port">axi_smc_dbg_* /</text>
  <text x="112" y="512" class="port">axil_*_otp_jtag_*</text>
  <line x1="155" y1="498" x2="130" y2="498"
        stroke="#4a7baa" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr-b)"/>

  <!-- ══ Colour legend  x=530..960, y=575..650 ══ -->
  <rect x="530" y="578" width="430" height="72" rx="4"
        fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <text x="745" y="598" class="small" text-anchor="middle" font-weight="bold">Legend</text>
  <line x1="548" y1="614" x2="580" y2="614" stroke="#4a7baa" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="586" y="619" class="small" fill="#4a7baa">JIU / JTAG (scan/select)</text>
  <line x1="548" y1="638" x2="580" y2="638" stroke="#aa4a4a" stroke-width="2"/>
  <text x="586" y="643" class="small" fill="#aa4a4a">CTN internal</text>
  <line x1="730" y1="614" x2="762" y2="614" stroke="#998866" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="768" y="619" class="small" fill="#998866">jtag_clock_stop (control)</text>
  <line x1="730" y1="638" x2="762" y2="638" stroke="#555555" stroke-width="1.5"/>
  <text x="768" y="643" class="small" fill="#555555">pad I/O</text>

</svg>
