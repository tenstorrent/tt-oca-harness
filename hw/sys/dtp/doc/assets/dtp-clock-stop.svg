<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="880" viewBox="0 0 1040 880" role="img" aria-labelledby="title desc">
<title id="title">DTP clock-stop aggregation</title>
<desc id="desc">Clock-stop path of the DTP as the SMU instantiates it. The JTAG pins drive u_jtag_tap_ctrlr and u_jtag_inst_reg in u_jtag_ptap, which scan the DEBUG_CONTROL TDR u_jtag_debug_ctrl_reg (IR 0x18). Its bits are [0] boot_stall and [1] boot_stall_ovrd, which leave as jtag_boot_stall_o and jtag_boot_stall_ovrd_o, [2] cla_clock_stop_en, which leaves as cla_clock_stop_en_o, [3] jtag_clock_stop and the read-only [4] cla_clock_stop, which captures the output of u_cla_clock_stop_sync, two flops on TCK. In u_cross_trigger_network, u_clock_stop_ctrl has an OR gate that reduces xtrig_clk_stop_req_i[XTRIG_NUM_CLK_STOP_REQ-1:0] to cla_clock_stop, which returns to that synchroniser, and a second OR gate that combines it with jtag_clock_stop. The result passes the two flops of u_clk_stop_sync and an output flop, all on clk_i, to stop_clks_o, which goes to the chiplet clock gating. Outside the DTP, in u_smc_dfd_wrap, one AND gate masks the halt-clock output of the CLA u_dfd_top with xtrig_clk_halt_mask[0] and a second ANDs the result with cla_clock_stop_en_o, arriving as tdr_dbg_ctrl_clock_stop_en_i, to drive xtrig_clk_stop_req_i[0]; lanes [XTRIG_NUM_CLK_STOP_REQ-1:1] come from other CLAs through the SMU ports. A third AND gate masks the CLA cross-trigger outputs with the same mask bit; they enter the internal CTPs and matrix on xtrig_ctm_dst_req_i[1:0], and xtrig_ctm_src_req_o[1:0] returns to the CLA.</desc>
