<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="852" viewBox="0 0 1040 852" role="img" aria-labelledby="title desc">
<title id="title">DTP reset distribution</title>
<desc id="desc">Reset distribution in the DTP. rst_n_i, the system reset (rst_primary_smc_clk_no in the SMU), resets all of u_cross_trigger_network and the AXI side of the three JTAG2AXI bridges. pwr_on_rst_ni (powergood_stable in the SMU) resets the 11 dbg_disable_i synchronisers to 1, debug disabled, and is ANDed in u_trst_n_and with the TRST pin, jtag_ptap_client_tap_ctrl_i.trst_n, to form the combined TRST. The combined TRST resets u_jtag_tap_ctrlr, u_jtag_tmp and the TDO retiming flop, gates the resets of the 3DCR and IC_RESET TDRs, resets the STAPs and leaves unchanged on the host TAP control of each STAP. u_jtag_tap_ctrlr derives the scan reset rst_n, low in Test-Logic-Reset, and the scan channel reset chrst_n, which the TMP persistence mode from u_jtag_tmp holds released. rst_n resets the instruction register, the BYPASS, IDCODE, CAPS and DEBUG_CONTROL TDRs, the 3DCR and IC_RESET TDRs unless their hold bits are set, the TCK side of the JTAG2AXI bridges, the STAPs and the SIBs, and leaves on the host scan control of the boundary-scan, extended STAP, DFT and DFD ports. chrst_n is used only on those ports. test_en_i and scan_rst_ni are not connected inside the DTP.</desc>
