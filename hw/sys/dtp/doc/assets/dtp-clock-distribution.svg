<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="996" viewBox="0 0 1040 996" role="img" aria-labelledby="title desc">
<title id="title">DTP clock distribution</title>
<desc id="desc">Clock distribution in the DTP. Two clocks enter: clk_i, the system clock, which is clk_smu_i in the SMU, and the JTAG TCK on jtag_ptap_client_tap_ctrl_i.tck. clk_i clocks all of u_cross_trigger_network: the AXI-Lite CSR crossbar u_axil_xbar, the matrix u_ctm, the 16 external ports gen_ext_ctp[15:0].u_ctp and 10 internal ports gen_int_ctp[9:0].u_int_ctp_core, whose synchronisers bring the cross-trigger inputs onto clk_i, and u_clock_stop_ctrl, whose u_clk_stop_sync brings the clock-stop requests onto clk_i. In u_jtag_intf_unit, TCK clocks the 11 dbg_disable_i synchronisers, the primary TAP u_jtag_ptap with its TAP controller, instruction register, TDRs, TDO retiming flop and the DEBUG_CONTROL TDR with its cla_clock_stop synchroniser, the four STAPs and the three SIBs. clk_i reaches u_jtag_intf_unit only for the AXI side of the three JTAG2AXI bridges u_smc_jtag2axi, u_smc_otp_jtag2axi and u_sep_otp_jtag2axi, each of which crosses from TCK to clk_i in u_axi_cdc. TCK leaves the DTP unchanged on the host TAP control of each STAP and on the host scan control of the boundary-scan, extended STAP, DFT and DFD ports.</desc>
