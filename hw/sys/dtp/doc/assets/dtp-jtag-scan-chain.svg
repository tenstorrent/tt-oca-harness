<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="746" viewBox="0 0 1040 746" role="img" aria-labelledby="title desc">
<title id="title">DTP JTAG scan-chain topology</title>
<desc id="desc">Scan-chain topology of the JTAG interface unit u_jtag_intf_unit. TCK, TMS and TRST_n drive the TAP controller of the primary TAP u_jtag_ptap. TDI fans out to the 6-bit instruction register, the internal data registers, the three optional JTAG2AXI bridge registers, the external boundary-scan chain and the iJTAG chain. The iJTAG chain runs through three SIBs in series, u_dft_secure_sib, u_dft_nonsecure_sib and u_dfd_sib; each SIB bit, when open, inserts its external scan segment after it, and the dft_secure, dft_nonsecure and dfd debug-disable fields hold each one closed. The IR and TDR mux selects the instruction register in Shift-IR, or in Shift-DR the register the instruction selects: the boundary-scan return under EXTEST, SAMPLE/PRELOAD, EXTEST_TRAIN, EXTEST_PULSE and INTEST, and the iJTAG return under SELECT_IJTAG and RUNBIST. The zero-length bypass mux takes the IR and TDR mux on input 0 and TDI on input 1, which it selects during a ZERO_LENGTH_BYPASS DR scan. Its output, the PTAP output, feeds both the TDO mux and the secondary TAP chain: the optional STAPs u_stap_io, u_stap_smc_dbg, u_stap_sep_dbg and NUM_EXTRA_STAPS instances of u_stap_extra in series, each of which can splice in its secondary TAP, the next chiplet's TAP chain, the SMC CPU debug TAP, the SEP CPU debug TAP or a local TAP. Each is gated by its debug-disable field: stap_io, stap_smc, stap_sep or stap_extra. After the last STAP the chain leaves for an external STAP chain; the stap_host field selects input 1 of the stap_host mux, replacing its return with the last STAP's output. The TDO mux selects the STAP chain return on input 1 while the TAP_3DCR STAP-select bit is set, and the PTAP output on input 0 otherwise. Its output is retimed on the falling edge of TCK and reaches input 0 of the zero-length bypass TDO mux, whose input 1 taps the TDO mux output before the retimer; during a ZERO_LENGTH_BYPASS DR scan TDO takes input 1, unretimed.</desc>
