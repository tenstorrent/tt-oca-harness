<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="760" height="480" viewBox="0 0 760 480">
  <defs>
    <style>
      text { font-family: sans-serif; fill: #333333; }
      .title  { font-size: 16px; font-weight: bold; }
      .blabel { font-size: 11px; font-weight: bold; }
      .label  { font-size: 11px; }
      .small  { font-size: 11px; fill: #555555; }
      .port   { font-size: 11px; font-family: monospace; fill: #333333; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#4a7baa"/>
    </marker>
    <marker id="arr-g" markerWidth="7" markerHeight="7" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#555555"/>
    </marker>
    <marker id="arr-k" markerWidth="7" markerHeight="7" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#998866"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>

  <text x="14" y="24" class="title">DTP JTAG Scan Chain</text>

  <!-- ── JTAG pads ──────────────────────────────────────────────────────── -->
  <rect x="14" y="54" width="70" height="80" rx="3"
        fill="#e8e8e8" stroke="#888888" stroke-width="1.2"/>
  <text x="49" y="76" class="small" text-anchor="middle" font-weight="bold">JTAG</text>
  <text x="49" y="90" class="small" text-anchor="middle">Pads</text>
  <text x="49" y="105" class="port" text-anchor="middle">TDI→</text>
  <text x="49" y="120" class="port" text-anchor="middle">←TDO</text>

  <!-- ── PTAP ───────────────────────────────────────────────────────────── -->
  <rect x="104" y="54" width="120" height="116" rx="4"
        fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>
  <text x="164" y="82" class="blabel" text-anchor="middle">PTAP</text>
  <text x="164" y="98" class="small" text-anchor="middle">TAP controller</text>
  <text x="164" y="112" class="small" text-anchor="middle">IR / TDR select</text>
  <text x="164" y="126" class="small" text-anchor="middle">Scan mux</text>

  <!-- Pads → PTAP TDI -->
  <line x1="84" y1="101" x2="104" y2="101" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>
  <!-- PTAP TDO → Pads -->
  <line x1="104" y1="116" x2="84" y2="116" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>

  <!-- ── STAP chain (top row) ───────────────────────────────────────────── -->
  <text x="238" y="50" class="small" font-weight="bold">Secondary Scan Chain (PTAP drives STAP_TDI; STAP_TDO returns)</text>

  <rect x="238" y="54" width="96" height="76" rx="3" fill="#dce8f4" stroke="#4a7baa" stroke-width="1.2"/>
  <text x="286" y="78" class="small" text-anchor="middle" font-weight="bold">STAP I/O</text>
  <text x="286" y="92" class="small" text-anchor="middle">IEEE 1838</text>
  <text x="286" y="106" class="small" text-anchor="middle">(optional)</text>

  <rect x="346" y="54" width="96" height="76" rx="3" fill="#dce8f4" stroke="#4a7baa" stroke-width="1.2"/>
  <text x="394" y="78" class="small" text-anchor="middle" font-weight="bold">STAP SMC</text>
  <text x="394" y="92" class="small" text-anchor="middle">CPU debug</text>
  <text x="394" y="106" class="small" text-anchor="middle">(optional)</text>

  <rect x="454" y="54" width="96" height="76" rx="3" fill="#dce8f4" stroke="#4a7baa" stroke-width="1.2"/>
  <text x="502" y="78" class="small" text-anchor="middle" font-weight="bold">STAP SEP</text>
  <text x="502" y="92" class="small" text-anchor="middle">CPU debug</text>
  <text x="502" y="106" class="small" text-anchor="middle">(optional)</text>

  <rect x="562" y="54" width="114" height="76" rx="3" fill="#dce8f4" stroke="#4a7baa" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="619" y="78" class="small" text-anchor="middle" font-weight="bold">Extra STAPs</text>
  <text x="619" y="92" class="small" text-anchor="middle">[JTAG_NUM_EXTRA</text>
  <text x="619" y="106" class="small" text-anchor="middle">_STAP_PORTS-1:0]</text>

  <!-- PTAP secondary-scan out → first STAP TDI -->
  <line x1="224" y1="84" x2="238" y2="84" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- STAP-to-STAP chain -->
  <line x1="334" y1="84" x2="346" y2="84" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="442" y1="84" x2="454" y2="84" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="550" y1="84" x2="562" y2="84" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- TDO return: last STAP TDO → back to PTAP scan-mux -->
  <polyline points="676,84 710,84 710,152 224,152"
            fill="none" stroke="#4a7baa" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arr)"/>
  <text x="474" y="176" class="small" text-anchor="middle">STAP TDO return path — selected stage TDO feeds PTAP scan mux</text>

  <text x="238" y="204" class="small" font-weight="bold">SELECT_IJTAG selects one serial SIB cascade</text>
  <path d="M164 170 V242 H238" fill="none" stroke="#998866" stroke-width="1.2" marker-end="url(#arr-k)"/>
  <rect x="238" y="220" width="142" height="56" rx="3" fill="#f5f0e8" stroke="#998866"/>
  <text x="309" y="241" class="small" text-anchor="middle" font-weight="bold">Secure DFT SIB</text>
  <text x="309" y="260" class="small" text-anchor="middle">Optional scan segment</text>
  <path d="M380 242 H404" stroke="#998866" marker-end="url(#arr-k)"/>
  <rect x="404" y="220" width="142" height="56" rx="3" fill="#f5f0e8" stroke="#998866"/>
  <text x="475" y="241" class="small" text-anchor="middle" font-weight="bold">Non-secure DFT SIB</text>
  <text x="475" y="260" class="small" text-anchor="middle">Optional scan segment</text>
  <path d="M546 242 H570" stroke="#998866" marker-end="url(#arr-k)"/>
  <rect x="570" y="220" width="142" height="56" rx="3" fill="#f5f0e8" stroke="#998866"/>
  <text x="641" y="241" class="small" text-anchor="middle" font-weight="bold">DFD SIB</text>
  <text x="641" y="260" class="small" text-anchor="middle">Optional scan segment</text>
  <path d="M712 242 H736 V304 H90 V152 H104" fill="none" stroke="#998866" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arr-k)"/>
  <text x="420" y="324" class="small" text-anchor="middle">Cascade output returns to the PTAP TDR mux</text>
  <text x="238" y="358" class="small" font-weight="bold">Separate PTAP TDRs selected by bridge instructions</text>
  <rect x="238" y="371" width="142" height="50" rx="3" fill="#dce8f4" stroke="#4a7baa"/>
  <text x="309" y="392" class="small" text-anchor="middle" font-weight="bold">SMC fabric</text>
  <text x="309" y="408" class="small" text-anchor="middle">JTAG2AXI</text>
  <rect x="404" y="371" width="142" height="50" rx="3" fill="#dce8f4" stroke="#4a7baa"/>
  <text x="475" y="392" class="small" text-anchor="middle" font-weight="bold">SMC OTP</text>
  <text x="475" y="408" class="small" text-anchor="middle">JTAG2AXIL</text>
  <rect x="570" y="371" width="142" height="50" rx="3" fill="#dce8f4" stroke="#4a7baa"/>
  <text x="641" y="392" class="small" text-anchor="middle" font-weight="bold">SEP OTP</text>
  <text x="641" y="408" class="small" text-anchor="middle">JTAG2AXIL</text>
  <text x="238" y="441" class="small">Bridge TDRs are outside the SELECT_IJTAG SIB cascade.</text>
  <text x="14" y="467" class="small">Per-path disable inputs gate STAPs, SIB segments, and bridges independently.</text>
</svg>
