seed = 1
timeout_sec = 600
tags = ["smoke", "ci", "axi_lite"]
run_modes = ["smoke"]

[[tests]]
name = "ocah_axi_pipeline_missing_rlast_test"
# The cocotb masters pipeline AXI4-Lite accesses only, and that bundle carries no RLAST.
module = { cocotb = false, uvm = "ocah_axi_pipeline_missing_rlast_test" }
seed = 1
timeout_sec = 600
tags = ["smoke", "ci", "axi_timeout"]
run_modes = ["smoke"]

