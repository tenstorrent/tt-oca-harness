#
# Verilator coverage policy of the shared AXI VIP selftest harness in its
# SV-UVM shape (`--dut ocah_axi_vip --framework uvm --cov`), which
# `[frameworks.uvm.coverage.verilator]` in ../../../ocah_axi_vip_sim_cfg.toml
# names as that view's `policy_file`.
#
# It carries the scope and the mechanisms of coverage_policy.toml, which the
# cocotb shape grades against; only the holes differ. The SV-UVM shape
# instantiates one AXI4 checker and no AXI4-Lite checker, and its build records
# the else of the AXI4 tracking block's `en_i` test as a branch point where the
# cocotb build records a line point.
#
# The file sets no [[thresholds]]: the runner reports the raw and effective
# figure of each metric family, and the figures do not set a run's status.

schema_version = 1
dut = "ocah_axi_vip"
scope_epoch = "ocah-axi-vip-collateral-v1"

# The harness ties `en_i` of its ocah_axi_sva instance to 1, so the branch
# that idles a tracking block while the checker is disabled has no stimulus
# here. A bench that drives `en_i` covers it.
[[holes]]
id = "sva-axi4-tracking-disabled"
title = "AXI4 write/read tracking block with en_i low"
category = "tied_off"
disposition = "waive"
status = "accepted"
confidence = "high"
rationale = "en_i is tied to 1 on the ocah_axi_sva instance of the harness; the disabled-checker branch of the AXI4 tracking block has no stimulus here, and a bench that drives en_i covers it."
owner = "ocah-dv"
reviewer = "ocah-dv"
issues = ["https://github.com/tenstorrent/tt-oca-harness/issues/476"]
[[holes.native]]
tool = "verilator"
metric_family = "branch"
source = "*/hw/common/dv/vip/ocah_axi_vip/sva/ocah_axi_sva.sv"
native_locator = "*|o=else|*"
line = 347

# Verilator places the then-branch count of `if (...) return` after the
# return statement, so the point cannot increment although WRAP beats take it.
[[holes]]
id = "sva-active-lanes-wrap-return"
title = "active_lanes early return for WRAP bursts"
category = "tool_artifact"
disposition = "waive"
status = "accepted"
confidence = "high"
rationale = "The then-branch of the WRAP early return in active_lanes is counted after the return statement and cannot increment, and CHK-AXI-BRIDGE-WRAP judges the WRAP data path in both realizations."
owner = "ocah-dv"
reviewer = "ocah-dv"
issues = ["https://github.com/tenstorrent/tt-oca-harness/issues/476"]
[[holes.native]]
tool = "verilator"
metric_family = "branch"
source = "*/hw/common/dv/vip/ocah_axi_vip/sva/ocah_axi_sva.sv"
native_locator = "*|o=if|*"
line = 326
