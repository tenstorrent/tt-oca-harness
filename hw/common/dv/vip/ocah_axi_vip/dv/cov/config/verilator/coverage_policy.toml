hierarchy = "ocah_axi_vip_tb_top.u_l_axi_sva"
native_locator = "*|o=else|*"
line = 459

# Verilator places the then-branch count of `if (...) return` after the
# return statement, so the point cannot increment although the WRAP beats of
# the struct-bridge selftest take it: the function's entry count exceeds the
# count of the statement after the return by the number of WRAP beats.
[[holes]]
id = "sva-active-lanes-wrap-return"
title = "active_lanes early return for WRAP bursts"
category = "tool_artifact"
disposition = "waive"
status = "accepted"
confidence = "high"
rationale = "The then-branch of the WRAP early return in active_lanes is counted after the return statement and cannot increment; the entry count of the function exceeds the count of the following statement by the number of WRAP beats, and CHK-AXI-BRIDGE-WRAP judges the WRAP data path in both realizations."
owner = "ocah-dv"
reviewer = "ocah-dv"
issues = ["https://github.com/tenstorrent/tt-oca-harness/issues/476"]
[[holes.native]]
tool = "verilator"
metric_family = "branch"
source = "*/hw/common/dv/vip/ocah_axi_vip/sva/ocah_axi_sva.sv"
native_locator = "*|o=if|*"
line = 329
