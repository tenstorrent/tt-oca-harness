schema_version = 1

# Launch entry: selected by `--dut ocah_axi_vip` (registered in
# hw/common/dv/configs/duts.toml — non-conventional root under the shared VIP).
#
# DUT is the wire harness tb/tb_top.sv: no RTL, just the AXI4 nets the shared
# master and fault-slave VIPs attach to from cocotb, plus one struct-port bundle
# bridged onto an ocah_axi_if the way a block tb_top bridges its boundary. The
# selftests prove the VIP's own contracts on real signals (response-ID
# observation, fault injection, the agent behind a struct port), independent of
# any block DUT.
name = "ocah_axi_vip"
profile = "native"
default_framework = "cocotb"
description = "Shared AXI VIP wire-harness selftests (master <-> fault slave)"
default_tool = "verilator"
tools = ["verilator", "vcs", "xcelium"]

[testlist]
path = "testlists/all.toml"
format = "toml_list"

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "hw/common/dv/vip/ocah_axi_vip/dv/build"]

[build]
top_module = "ocah_axi_vip_tb_top"
top_file = "hw/common/dv/vip/ocah_axi_vip/dv/tb/tb_top.sv"
filelist = "hw/common/dv/vip/ocah_axi_vip/dv/build/ocah_axi_vip_dut_compile.f"
bender_filelist = "hw/common/dv/vip/ocah_axi_vip/dv/build/ocah_axi_vip_bender.f"
work_dir = "hw/common/dv/vip/ocah_axi_vip/dv/build"
# The harness compiles no DUT RTL: the target name matches nothing in the
# Bender graph, so the generated filelist carries only the base package
# closure.
common_bender_targets = []
bender_targets = ["ocah_axi_vip_harness"]
incdirs = ["hw/common/assert"]
# The shared interface, the struct bridge, and the protocol SVA compile into
# the cocotb shape (the default-geometry interface instances, the struct-port
# bundle, and the checker instances in tb_top); the SV-UVM overlay takes them
# from the VIP manifest.
sources = [
  "hw/common/dv/vip/ocah_axi_vip/interface/ocah_axi_if.sv",
  "hw/common/dv/vip/ocah_axi_vip/interface/ocah_axi_struct_bridge.sv",
  "hw/common/dv/vip/ocah_axi_vip/sva/ocah_axi_sva.sv",
]

[frameworks.cocotb]
python_root = "hw/common/dv/vip/ocah_axi_vip/dv/cocotb"
test_dir = "hw/common/dv/vip/ocah_axi_vip/dv/cocotb/tests"
python_paths = [
  "hw/common/dv/vip",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

[run_modes.smoke]
description = "Shared AXI VIP response-ID observation selftests"
timeout_sec = 600
args = []

[targets.default]
description = "AXI VIP wire harness (no DUT RTL)"
build_dir = "hw/common/dv/vip/ocah_axi_vip/dv/build/cocotb"

[targets.default.tools.verilator]
# --assert evaluates the two-state protocol SVA bound in dv/tb/tb_top.sv; a
# failed rule prints %Error and fails the run.
flags = ["--assert"]

[coverage.verilator]
# Line and SVL user coverage on the SV collateral (interface, struct bridge,
# protocol SVA); toggle stays off. --output-groups 0 compiles the generated
# model one file per translation unit. The scope file drops the harness body
# and the pulp packages at compile time.
build_args = [
  "--coverage-line",
  "--coverage-user",
  "--output-groups",
  "0",
  "{repo_root}/hw/common/dv/vip/ocah_axi_vip/dv/cov/config/verilator/ocah_axi_vip_cov_scope.vlt",
]

# --- SV-UVM framework overlay (selected by `--framework uvm`; VCS via the shared native
# profile). Same scenarios as the cocotb selftests, driven full-stack through the VIP's own
# SV-UVM master against the fault slave. ONE tb_top module for both frameworks: +define+UVM
# (from the native profile's [frameworks.uvm] overlay) switches dv/tb/tb_top.sv from the
# passive cocotb wire harness to the self-contained SV-UVM shape, which `include`s
# uvm/tests/ocah_axi_vip_tests.sv.
[frameworks.uvm]
description = "Shared AXI VIP SV-UVM selftest flow (VCS)"
# The DUT-level default_tool/tools above serve the cocotb view; this view is
# VCS-only (the profile's [frameworks.uvm] contract).
default_tool = "vcs"
tools = ["vcs"]

[frameworks.uvm.build]
# The VIP SV-UVM layer comes from its VIP-owned ordered manifest, expanded AHEAD of this
# table's own incdirs/sources (dedup-merge) — never hand-copy VIP paths here. The generated
# filelist emits the expanded `sources` AFTER the bender filelist, then `top_file` last:
#   ocah_axi_vip manifest (interface -> collateral -> UVM pkg)
#   -> ocah_axi_vip_env_pkg -> ocah_axi_vip_seq_lib_pkg -> tb_top.sv
source_lists = [
  "hw/common/dv/vip/ocah_axi_vip/uvm/sources.toml",
]
filelist = "hw/common/dv/vip/ocah_axi_vip/dv/build/uvm/ocah_axi_vip_uvm_compile.f"
bender_filelist = "hw/common/dv/vip/ocah_axi_vip/dv/build/uvm/ocah_axi_vip_uvm_bender.f"
work_dir = "hw/common/dv/vip/ocah_axi_vip/dv/build/uvm"
incdirs = [
  "hw/common/assert",
  "hw/common/dv/vip/ocah_axi_vip/dv/uvm/env",
  "hw/common/dv/vip/ocah_axi_vip/dv/uvm/seq_lib",
  "hw/common/dv/vip/ocah_axi_vip/dv/uvm/tests",
]
sources = [
  "hw/common/dv/vip/ocah_axi_vip/dv/uvm/env/ocah_axi_vip_env_pkg.sv",
  "hw/common/dv/vip/ocah_axi_vip/dv/uvm/seq_lib/ocah_axi_vip_seq_lib_pkg.sv",
]

[frameworks.uvm.sim]
args = ["+UVM_VERBOSITY=UVM_MEDIUM"]

[frameworks.uvm.targets.default]
description = "Shared AXI VIP SV-UVM default target"
build_dir = "hw/common/dv/vip/ocah_axi_vip/dv/build/uvm"
# The bare `UVM` define (selects the SV-UVM shape of the shared tb_top.sv) comes from the
# native profile's [frameworks.uvm] overlay — no per-DUT copy.
