schema_version = 1

# Launch entry: selected by `--dut ocah_axi_vip` (registered in
# hw/common/dv/configs/duts.toml — non-conventional root under the shared VIP).
#
# DUT is the passive wire harness tb/tb_top.sv: no RTL, just the AXI4 nets the
# shared master and fault-slave VIPs attach to from cocotb. The selftests prove
# the VIP's own contracts on real signals (response-ID observation, fault
# injection), independent of any block DUT.
name = "ocah_axi_vip"
profile = "native"
description = "Shared AXI VIP wire-harness selftests (master <-> fault slave)"
default_tool = "verilator"
tools = ["verilator", "vcs", "xcelium"]

[testlist]
path = "testlists/all.toml"
format = "toml_list"

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "hw/common/dv/vip/ocah_axi_vip/dv/build"]

[build]
top_module = "ocah_axi_vip_tb_top"
top_file = "hw/common/dv/vip/ocah_axi_vip/dv/tb/tb_top.sv"
filelist = "hw/common/dv/vip/ocah_axi_vip/dv/build/ocah_axi_vip_dut_compile.f"
bender_filelist = "hw/common/dv/vip/ocah_axi_vip/dv/build/ocah_axi_vip_bender.f"
work_dir = "hw/common/dv/vip/ocah_axi_vip/dv/build"
# The harness compiles no DUT RTL. The target name matches nothing in the
# Bender graph on purpose, so the generated filelist carries only the base
# package closure.
common_bender_targets = []
bender_targets = ["ocah_axi_vip_harness"]

[frameworks.cocotb]
python_root = "hw/common/dv/vip/ocah_axi_vip/dv/cocotb"
test_dir = "hw/common/dv/vip/ocah_axi_vip/dv/cocotb/tests"
python_paths = [
  "hw/common/dv/vip",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

[run_modes.smoke]
description = "Shared AXI VIP response-ID observation selftests"
timeout_sec = 600
args = []

[targets.default]
description = "AXI VIP wire harness (no DUT RTL)"
build_dir = "hw/common/dv/vip/ocah_axi_vip/dv/build/cocotb"
