#
# example_layout.yaml — custom SepMemoryLayout template for OcahMemoryImage.
#
# Use this file as a starting point when your chip's address map differs from
# the default SepMemoryLayout.default() values.
#
# Load in Python:
#   from bfm.ocah_memory_image import SepMemoryLayout
#   layout = SepMemoryLayout.from_yaml("example_layout.yaml")
#
# Fields per bank:
#   name              : Short identifier; used as dict key and hex file stem.
#   plusarg           : Full plusarg string including leading '+'.
#   base_addr         : Hex byte base address in the SEP CPU address space.
#                       Use null for banks not directly CPU-mapped
#                       (KM ROM/SRAM, OTBN IMEM/DMEM).
#   size_bytes        : Total byte capacity of the bank.
#   depth             : Number of addressable words.
#   data_width_bits   : Bits per word at the memory interface (incl. ECC/parity).
#
# Hex digit count per line = ceil(data_width_bits / 4).
#
# This file mirrors the default layout.  Edit the base_addr / size_bytes /
# depth values to match your chip's address decoder.
#

- name: sep_sram
  plusarg: "+sep_sram_preload"
  base_addr: "0x20000000"   # 256 KB SEP SRAM
  size_bytes: 262144         # 256 * 1024
  depth: 32768               # 32768 x 64-bit words
  data_width_bits: 64

- name: sep_boot_rom
  plusarg: "+sep_boot_rom_preload"
  base_addr: "0x00000000"   # 128 KB SEP boot ROM
  size_bytes: 131072         # 128 * 1024
  depth: 16384               # 16384 x 64-bit words
  data_width_bits: 64

- name: sep_tcm
  plusarg: "+sep_tcm_preload"
  base_addr: "0x40000000"   # SEP TCM (ICCM + DCCM)
  size_bytes: 262144         # 256 KB combined
  depth: 32768               # EL2-param driven; 39-bit words
  data_width_bits: 39

- name: km_rom
  plusarg: "+km_rom_preload"
  base_addr: null            # not CPU-mapped; load explicitly with load_hex/load_bin
  size_bytes: 16384          # 4096 x 4-byte data words
  depth: 4096                # 4096 x 36-bit words (32 data + 4 parity)
  data_width_bits: 36

- name: km_sram
  plusarg: "+km_sram_preload"
  base_addr: null            # not CPU-mapped
  size_bytes: 16384          # 4096 x 4-byte data words
  depth: 4096                # 4096 x 36-bit words (32 data + 4 parity)
  data_width_bits: 36

- name: otbn_imem
  plusarg: "+otbn_imem_preload"
  base_addr: null            # loaded by SEP firmware via AXI fabric
  size_bytes: 16384          # 4096 x 4-byte data words
  depth: 4096                # 4096 x 39-bit words (32 data + 7 ECC)
  data_width_bits: 39

- name: otbn_dmem
  plusarg: "+otbn_dmem_preload"
  base_addr: null            # loaded by SEP firmware via AXI fabric
  size_bytes: 32768          # 1024 x 32-byte data words
  depth: 1024                # 1024 x 312-bit words (8 x 39-bit sub-words)
  data_width_bits: 312
