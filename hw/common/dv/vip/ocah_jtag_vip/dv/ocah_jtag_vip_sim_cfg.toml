schema_version = 1

# Launch entry: selected by `--dut ocah_jtag_vip` (registered in
# hw/common/dv/configs/duts.toml — non-conventional root under the shared VIP).
#
# DUT is the wire harness tb/tb_top.sv: no RTL, just the TAP nets the shared
# master and the shared reactive TAP device attach to from cocotb, with the
# protocol SVA watching them. The selftests prove the VIP's own contracts on
# real signals (TAP reset and state, IR/DR length, IDCODE, BYPASS latency,
# scan data, TRST semantics), independent of any block DUT.
name = "ocah_jtag_vip"
profile = "native"
default_framework = "cocotb"
description = "Shared JTAG VIP wire-harness selftests (master <-> reactive TAP device)"
default_tool = "verilator"
tools = ["verilator", "vcs", "xcelium"]

[testlist]
path = "testlists/all.toml"
format = "toml_list"

[native.stages.clean]
kind = "clean"
paths = ["{run_dir}", "hw/common/dv/vip/ocah_jtag_vip/dv/build"]

[build]
top_module = "ocah_jtag_vip_tb_top"
top_file = "hw/common/dv/vip/ocah_jtag_vip/dv/tb/tb_top.sv"
filelist = "hw/common/dv/vip/ocah_jtag_vip/dv/build/ocah_jtag_vip_dut_compile.f"
bender_filelist = "hw/common/dv/vip/ocah_jtag_vip/dv/build/ocah_jtag_vip_bender.f"
work_dir = "hw/common/dv/vip/ocah_jtag_vip/dv/build"
# The harness compiles no DUT RTL: the target name matches nothing in the
# Bender graph, so the generated filelist carries only the base package
# closure.
common_bender_targets = []
bender_targets = ["ocah_jtag_vip_harness"]
incdirs = ["hw/common/assert"]
# The protocol SVA compiles into the cocotb shape; the SV-UVM overlay takes
# the interface and the SVA from the VIP manifest.
sources = [
  "hw/common/dv/vip/ocah_jtag_vip/sva/ocah_jtag_sva.sv",
]

[frameworks.cocotb]
python_root = "hw/common/dv/vip/ocah_jtag_vip/dv/cocotb"
test_dir = "hw/common/dv/vip/ocah_jtag_vip/dv/cocotb/tests"
python_paths = [
  "hw/common/dv/vip",
]
results_dir = "{run_dir}/{item}/results"
cocotb_log = "{run_dir}/{item}/logs/{item}.log"

[run_modes.smoke]
description = "Shared JTAG VIP TAP-contract selftests"
timeout_sec = 600
args = []

[targets.default]
description = "JTAG VIP wire harness (no DUT RTL)"
build_dir = "hw/common/dv/vip/ocah_jtag_vip/dv/build/cocotb"

[targets.default.tools.verilator]
# --assert evaluates the two-state protocol SVA bound in dv/tb/tb_top.sv; a
# failed rule prints %Error and fails the run.
flags = ["--assert"]

[coverage.verilator]
# Line and SVL user coverage on the SV collateral (the protocol SVA); toggle
# stays off. --output-groups 0 compiles the generated model one file per
# translation unit. The scope file drops the harness body and the vendored
# packages at compile time.
build_args = [
  "--coverage-line",
  "--coverage-user",
  "--output-groups",
  "0",
  "{repo_root}/hw/common/dv/vip/ocah_jtag_vip/dv/cov/config/verilator/ocah_jtag_vip_cov_scope.vlt",
]

# --- SV-UVM framework overlay (selected by `--framework uvm`; VCS via the shared native
# profile). Same scenarios as the cocotb selftests, driven full-stack through the VIP's own
# SV-UVM master against the VIP's reactive TAP device. ONE tb_top module for both frameworks:
# +define+UVM (from the native profile's [frameworks.uvm] overlay) switches dv/tb/tb_top.sv
# from the passive cocotb wire harness to the self-contained SV-UVM shape, which `include`s
# uvm/tests/ocah_jtag_vip_tests.sv.
[frameworks.uvm]
description = "Shared JTAG VIP SV-UVM selftest flow (VCS)"
default_tool = "vcs"
tools = ["vcs"]

[frameworks.uvm.build]
# The library and VIP SV-UVM layers come from their owned ordered manifests, expanded AHEAD
# of this table's own incdirs/sources (dedup-merge). The generated filelist emits the
# expanded `sources` AFTER the bender filelist, then `top_file` last:
#   ocah_lib manifest -> ocah_jtag_vip manifest (evidence base -> interface -> collateral
#   -> UVM pkg) -> ocah_jtag_vip_env_pkg -> ocah_jtag_vip_seq_lib_pkg -> tb_top.sv
source_lists = [
  "hw/common/dv/vip/ocah_lib/uvm/sources.toml",
  "hw/common/dv/vip/ocah_jtag_vip/uvm/sources.toml",
]
filelist = "hw/common/dv/vip/ocah_jtag_vip/dv/build/uvm/ocah_jtag_vip_uvm_compile.f"
bender_filelist = "hw/common/dv/vip/ocah_jtag_vip/dv/build/uvm/ocah_jtag_vip_uvm_bender.f"
work_dir = "hw/common/dv/vip/ocah_jtag_vip/dv/build/uvm"
incdirs = [
  "hw/common/assert",
  "hw/common/dv/vip/ocah_jtag_vip/dv/uvm/env",
  "hw/common/dv/vip/ocah_jtag_vip/dv/uvm/seq_lib",
  "hw/common/dv/vip/ocah_jtag_vip/dv/uvm/tests",
]
sources = [
  "hw/common/dv/vip/ocah_jtag_vip/dv/uvm/env/ocah_jtag_vip_env_pkg.sv",
  "hw/common/dv/vip/ocah_jtag_vip/dv/uvm/seq_lib/ocah_jtag_vip_seq_lib_pkg.sv",
]

[frameworks.uvm.sim]
args = ["+UVM_VERBOSITY=UVM_MEDIUM"]

[frameworks.uvm.targets.default]
description = "Shared JTAG VIP SV-UVM default target"
build_dir = "hw/common/dv/vip/ocah_jtag_vip/dv/build/uvm"
