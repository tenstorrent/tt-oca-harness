#
# Verilator coverage policy of the shared JTAG VIP selftest harness
# (`--dut ocah_jtag_vip --cov`); the cov_report stage applies it to the merged
# run and `--waive` re-grades a finished run against it.
#
# Scope: the compile-time scope file ocah_jtag_vip_cov_scope.vlt keeps the
# harness body and the vendored packages out of the database, so the graded
# points are the VIP's SystemVerilog collateral (sva/ocah_jtag_sva.sv). The
# Python components carry no simulator metric; their record is the CHK-*
# evidence of the selftests and of the simulator-free slave selftest.
#
# Two mechanisms, do not confuse them:
#
#   ocah_jtag_vip_cov_scope.vlt  `coverage_off` -> the point never enters the
#                                database: code this harness does not grade.
#   [[holes]] here               the point exists and is not hit, carried with
#                                a category, a rationale, an owner, a reviewer,
#                                and an expiry.
#
# The branch family is the graded metric of the one-hot next-state function:
# every legal transition is a branch point, and the selftests drive each of
# them (Pause-x, Exit2-x, and capture-only scans included). The line family
# counts the function's case arms at zero while their branches count, so the
# line arms are carried as one tool-artifact waiver and the line family has no
# `raw` threshold.
#
# The `effective` thresholds grade hit points over the points that remain
# after accepted waivers, per metric family, and fail closed on an uncovered
# point no [[holes]] entry classifies (max_unclassified_points = 0). The `raw`
# branch threshold grades the unwaived figure.
#
# An accepted waiver grades as open again after its `expires` date, and an
# accepted selector that matches a covered point fails the run: a waiver that
# stimulus has overtaken has to be removed. Line selectors follow the source
# file; a moved line fails the run (`expected_matches`) until the entry is
# updated.

schema_version = 1
dut = "ocah_jtag_vip"
scope_epoch = "ocah-jtag-vip-collateral-v1"

[[thresholds]]
id = "collateral-line-effective"
tool = "verilator"
metric_family = "line"
population = "effective"
minimum_percent = 98.0
max_unclassified_points = 0

[[thresholds]]
id = "collateral-branch-effective"
tool = "verilator"
metric_family = "branch"
population = "effective"
minimum_percent = 98.0
max_unclassified_points = 0

[[thresholds]]
id = "collateral-branch-raw"
tool = "verilator"
metric_family = "branch"
population = "raw"
minimum_percent = 98.0

# The sixteen case arms of jtag_next_onehot, one per TAP state.
[[holes]]
id = "sva-next-state-case-arms"
title = "jtag_next_onehot case arms (line metric)"
category = "tool_artifact"
disposition = "waive"
status = "accepted"
confidence = "high"
rationale = "Verilator's line metric does not count the case arms of a function evaluated inside an assertion; the branch metric of the same lines counts every arm in both TMS directions, and the selftests drive every legal transition."
owner = "ocah-dv"
reviewer = "ocah-dv"
date = "2026-09-14"
expires = "2027-03-31"
issues = ["https://github.com/tenstorrent/tt-oca-harness/issues/476"]
expected_matches = 16
