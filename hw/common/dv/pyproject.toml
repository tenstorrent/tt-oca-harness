[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocah-dv"
version = "0.1.0"
description = "Sandboxed OCAH OSS shared DV Python: protocol VIP and monitors"
requires-python = ">=3.11,<3.14"
dependencies = [
  # cocotb 2.0.x supports Python 3.11-3.13. Python 3.14 is intentionally
  # excluded until cocotb publishes compatible wheels/sdists.
  "cocotb>=2.0.0,<2.1",
  "pyuvm>=4.0.0,<5",
  # Open-source protocol VIP used by the OSS testbenches (e.g. DTP).
  # cocotbext-jtag replaces the in-house JTAG VIP (MIT license per package
  # metadata); cocotbext-axi replaces the in-house AXI/AXI-Lite VIP.
  "cocotbext-axi>=0.1.24,<0.2",
  "cocotbext-jtag>=0.4.0,<0.5",
  # cocotbext-i2c is intentionally absent: the SMC I2C/SMBus/PMBus protocol
  # VIP (SmcI2cMasterVip / SmcI2cEepromSlave) is implemented natively in
  # hw/sys/smc/dv/cocotb/seq_lib/smc_i2c_protocol_vip.py because cocotbext-i2c
  # edge waits miss open-drain transitions under Verilator.
  # cocotbext-uart (OcahUartConsole / OcahUartMonitor backend) resolves from
  # the vendored MIT source at vendor/alexforencich/cocotbext-uart via the
  # [tool.uv.sources] path entry below, not from PyPI: license review applies
  # to in-repo sources (the PyPI distribution's license metadata is not
  # machine-verifiable), and the 0.1.4 release needs a local cocotb 2.0
  # compatibility patch (see the vendor README).
  "cocotbext-uart>=0.1.4,<0.2",
]

[tool.uv.sources]
cocotbext-uart = { path = "../../../vendor/alexforencich/cocotbext-uart/upstream" }

[tool.setuptools.packages.find]
where = ["vip"]
include = ["ocah_*"]
