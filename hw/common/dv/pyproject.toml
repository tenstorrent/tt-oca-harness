[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocah-dv"
version = "0.1.0"
description = "Sandboxed OCAH OSS shared DV Python: protocol VIP and monitors"
requires-python = ">=3.11,<3.14"
dependencies = [
  # cocotb 2.0.x supports Python 3.11-3.13. Python 3.14 is intentionally
  # excluded until cocotb publishes compatible wheels/sdists.
  "cocotb>=2.0.0,<2.1",
  "pyuvm>=4.0.0,<5",
  # Open-source protocol VIP used by the OSS testbenches (e.g. DTP).
  # cocotbext-jtag replaces the in-house JTAG VIP (MIT license per package
  # metadata); cocotbext-axi replaces the in-house AXI/AXI-Lite VIP.
  "cocotbext-axi>=0.1.24,<0.2",
  "cocotbext-jtag>=0.4.0,<0.5",
  # cocotbext-i2c backs the SMC SMBus/PMBus protocol VIP (SmcI2cMasterVip /
  # SmcI2cEepromSlave). Without it those tests fall back to a no-op stub and
  # fail with AttributeError / "cocotbext-i2c is not installed".
  "cocotbext-i2c>=0.1.2,<0.2",
  # cocotbext-uart is intentionally omitted here: Cycode Licenses Compliance
  # cannot verify its PyPI MIT metadata ("License Not Detected or Verified" on
  # hw/common/dv pyproject line with cocotbext-uart). OcahUartConsole /
  # OcahUartMonitor import it optionally and raise OcahUartImportError with an
  # install hint when absent. For UART pad tests install separately:
  #   pip install 'cocotbext-uart>=0.1.4,<0.2'   # MIT
]

[tool.setuptools.packages.find]
where = ["vip"]
include = ["ocah_*"]
