# Shared profile for DUTs on the native runner.
#
# Framework (cocotb | uvm) is a selectable dimension inside this one profile: shared launch
# policy lives at the top level, per-framework residue in [frameworks.<fw>], and each DUT
# declares the frameworks it implements as [frameworks.<fw>] tables in its own sim config.
# The frameworks this profile supports are exactly its [frameworks.<fw>] sections below.

kind = "dv"
default_framework = "cocotb"
visibility = "public"
runnability = "contributor"
license = "none"

# Tool capability per framework comes from simulators.toml `frameworks`; the effective tool set
# for a run is this list filtered by the selected framework's capability.
default_tool = "verilator"
tools = ["verilator", "xcelium", "vcs"]

[scheduler]
default_executor = "local"
allowed = ["local"]

[defaults]
seed = 1
timeout_sec = 1800
run_mode = "smoke"
target = "default"

# Shared cold-build/cache policy. Tool-specific acceleration knobs live in
# simulators.toml [<tool>.build_defaults] or DUT [build.<tool>] overrides.
[build.options]
build_jobs = 0
cflags = ""
cache_enabled = false
rebuild = false
cache_key_extra = []

# One simulation define set for both frameworks: enabling SVAs for UVM (dropping DISABLE_ASSERT /
# COMMON_CELLS_ASSERTS_OFF) is a deliberate follow-up, not a silent difference between the flows.
# Tool-specific fields use nested tool tables so every simulator follows the same naming rule:
# target.tools.<tool>.flags.
[target_defaults.default]
defines = [
  "SIM",
  "NO_LIBCELL",
  "DISABLE_ASSERT",
  "COMMON_CELLS_ASSERTS_OFF",
  "INITIALIZE_MEMORY",
  "RANDOM=0",
  "RANDOMIZE_MEM_INIT",
  "RANDOMIZE_REG_INIT",
  "RANDOMIZE_GARBAGE_ASSIGN",
  "RANDOMIZE_INVALID_ASSIGN",
  "RANDOMIZE_DELAY=0.02",
]

[target_defaults.default.tools.verilator]
flags = [
  "-Wno-fatal",
  "-Wno-UNOPTFLAT",
  "-Wno-WIDTHEXPAND",
  "-Wno-MULTIDRIVEN",
  "-Wno-UNSIGNED",
  "-Wno-REDEFMACRO",
  "-Wno-MODDUP",
]

[target_defaults.default.tools.xcelium]
flags = ["-assert", "-ALLOWREDEFINITION"]

[target_defaults.default.tools.vcs]
flags = ["-sverilog"]

[native]
enabled = true
status = "active"

# ONE canonical stage graph for both frameworks. The generic kinds dispatch per
# (tool, framework) at run time: `hdl_compile` builds the cocotb model (Verilator/Xcelium/VCS
# classic make) or runs the folded VCS analyze+elaborate two-step for SV-UVM; `sim` launches the
# cocotb test or the built simv (`+UVM_TESTNAME`); `c_compile` runs only for tests that declare
# firmware.
[native.stages.flist]
kind = "filelist"

[native.stages.c_compile]
kind = "c_compile"

[native.stages.hdl_compile]
kind = "hdl_compile"

[native.stages.sim]
kind = "sim"

# Coverage aggregation (run automatically with --cov, or via --stage cov_merge --stage
# cov_report). cocotb-only for now: the vcs_* UVM build/sim adapters do not inject `-cm ...`
# instrumentation args yet, so the uvm framework declares no coverage stages and --cov is
# rejected up front (UVM coverage wiring is a documented follow-up).
[frameworks.cocotb.native.stages.cov_merge]
kind = "coverage_merge"

[frameworks.cocotb.native.stages.cov_report]
kind = "coverage_report"

# SystemVerilog UVM: the UVM library comes from the simulator itself (the VCS analyze stage
# precompiles it with a dedicated `vlogan -ntb_opts uvm` invocation before analyzing user
# sources). VCS only until the xrun UVM adapter is signed off (see simulators.toml).
[frameworks.uvm]
default_tool = "vcs"
tools = ["vcs"]
visibility = "maintainer"
runnability = "maintainer"
license = "required-commercial"

# -sverilog/-full64/-ntb_opts uvm/-timescale come from the vcs_* stage preamble; the analyze stage
# also precompiles the simulator-owned UVM package before this source set.
[frameworks.uvm.target_defaults.default.tools.vcs]
flags = []
