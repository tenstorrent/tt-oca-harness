# Where leaves run. `local` runs them in the runner's own process. A cluster entry names a
# scheduler driver and every command the driver runs, as argv templates over the normalized
# resource vocabulary (`queue`, `cores`, `mem_mb`, `walltime`). The templates below use each
# scheduler's stock flags and carry no site value: a site layer (site.local.toml) supplies queue
# names, resource defaults, coordinator limits and the environment hook, and replaces any
# template whose unit or flag differs at that site. A nested list is an optional group that
# renders only when every placeholder in it has a value, so a request without a queue submits
# without `-q`. With `arrays = true` the first attempts of a stage go out as job arrays of at
# most `limits.array_chunk_size` elements; each element is its own job id to every other
# command, so the query, history and cancel templates need nothing array-specific beyond what
# the comments below name. With `builds = "scheduler"` a target build is a job of its own that
# the leaves wait for; `build_defaults` is the build's resource request where it differs from
# `defaults`, and `build_submit_argv` its submit line where a site's build needs other flags.

schema_version = 2

[local]
kind = "local"
submit_argv = []
wait_mode = "inline"

# IBM Spectrum LSF. `rusage[mem=...]` follows the cluster's LSF_UNIT_FOR_LIMITS; this template
# assumes megabytes, and a cluster that counts gigabytes overrides `submit_argv` with
# `{mem_gb}`. `-W` is minutes. An array is submitted through its job name (`name[1-N]`), so
# `{jobname}` carries the range and `{joblog}` carries `%I`, the element index; `jobindex`
# in the query fields is what tells one element's record from another's.
[lsf]
kind = "cluster"
driver = "lsf"
binaries = ["bsub", "bjobs", "bhist", "bkill"]
wait_mode = "poll"
arrays = true
builds = "scheduler"
submit_argv = [
  "bsub",
  ["-q", "{queue}"],
  ["-n", "{cores}"],
  ["-R", "rusage[mem={mem_mb}]"],
  ["-W", "{walltime_min}"],
  "-J", "{jobname}",
  "-o", "{joblog}",
  "{script}",
]
query_argv = ["bjobs", "-json", "-o", "jobid jobindex stat exit_code exit_reason", "{job_ids_argv}"]
history_argv = ["bhist", "-l", "{job_ids_argv}"]
cancel_argv = ["bkill", "{job_ids_argv}"]
history_parser = "lsf_bhist_long"
env_passthrough = ["PATH", "LD_LIBRARY_PATH"]

# Slurm. `--mem` takes megabytes with the `M` suffix; `--time` takes a clock. `--states=all`
# keeps a finished job in the query for the controller's MinJobAge; `sacct` needs the
# cluster's accounting database, and a site without one names `scontrol show job {job_id}`
# with `history_parser = "slurm_scontrol"` instead. An array is `--array={array_range}`, so
# a site template without that group submits plain jobs; `{joblog}` then carries `%a`, the
# element index. `squeue --array` lists every element on its own line, and `sacct`'s `JobID`
# (not `JobIDRaw`) is the `<id>_<index>` form the runner tracks.
[slurm]
kind = "cluster"
driver = "slurm"
binaries = ["sbatch", "squeue", "sacct", "scancel"]
wait_mode = "poll"
arrays = true
builds = "scheduler"
submit_argv = [
  "sbatch", "--parsable",
  ["--partition={queue}"],
  ["--cpus-per-task={cores}"],
  ["--mem={mem_mb}M"],
  ["--time={walltime_hms}"],
  ["--array={array_range}"],
  "--job-name={jobname}",
  "--output={joblog}",
  "{script}",
]
query_argv = [
  "squeue", "--noheader", "--array", "--states=all", "--format=%i|%T|%r", "--jobs={job_ids_csv}",
]
history_argv = [
  "sacct", "--allocations", "--noheader", "--parsable2",
  "--format=JobID,State,ExitCode", "--jobs={job_ids_csv}",
]
cancel_argv = ["scancel", "{job_ids_argv}"]
history_parser = "slurm_sacct"
env_passthrough = ["PATH", "LD_LIBRARY_PATH"]
