# DUT registry for the native DV runner.
#
# `--dut <name>` resolves here first; an unregistered name falls back to the directory convention
# (hw/<name>/dv, hw/{sys,ip,comp,periph}/<name>/dv, or hw/common/prim/<name>/dv under the active DV root).
# Either way the resolved DUT DV root must contain `<name>_sim_cfg.toml`. `root` is the only
# required key; `sim_cfg` may override the default `<root>/<name>_sim_cfg.toml` location.
#
# Register only DUTs whose sim config exists: every registered entry is loaded and validated
# before any run or diagnostic, so a stale entry blocks all flows. Conventional DUTs
# (e.g. SMC/SEP/SMU) are discovered automatically once their `<name>_sim_cfg.toml` is ported.
# Non-conventional aliases — such as `smu_wrapper` sharing hw/sys/smu/dv with a separate sim
# config for the production-wrapper baseline flow (issue #3357) — must be registered here
# when their configs are added.

schema_version = 1

# Official SMC OSS entry: pad-level smc_wrapper baseline (shares hw/sys/smc/dv
# with bare `smc`, but uses smc_wrapper_sim_cfg.toml). Prefer
# `--dut smc_wrapper` for smoke / regress; `--dut smc` remains a secondary
# bare-core path for TB-stub experiments.
[duts.smc_wrapper]
root = "hw/sys/smc/dv"
sim_cfg = "hw/sys/smc/dv/smc_wrapper_sim_cfg.toml"

# SMU production-wrapper baseline (shares hw/sys/smu/dv with bare `smu`,
# but uses smu_wrapper_sim_cfg.toml). Issue #3357.
[duts.smu_wrapper]
root = "hw/sys/smu/dv"
sim_cfg = "hw/sys/smu/dv/smu_wrapper_sim_cfg.toml"

[duts.dtp]
root = "hw/sys/dtp/dv"
