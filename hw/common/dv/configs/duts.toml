# DUT registry for the native DV runner.
#
# `--dut <name>` resolves here first; an unregistered name falls back to the directory convention
# (hw/<name>/dv, hw/{sys,ip,comp,periph}/<name>/dv, or hw/common/prim/<name>/dv under the active DV root).
# Either way the resolved DUT DV root must contain `<name>_sim_cfg.toml`. `root` is the only
# required key; `sim_cfg` may override the default `<root>/<name>_sim_cfg.toml` location.
#
# Register only DUTs whose sim config exists: every registered entry is loaded and validated
# before any run or diagnostic, so a stale entry blocks all flows. Conventional DUTs
# (e.g. SMC/SEP) are discovered automatically from their `<name>_sim_cfg.toml`.
# Non-conventional aliases — such as `smu_wrapper` sharing hw/sys/smu/dv with a separate sim
# config for the production-wrapper baseline flow — must be registered here when their
# configs are added.

schema_version = 1

# SMU production-wrapper baseline (shares hw/sys/smu/dv with bare `smu`,
# but uses smu_wrapper_sim_cfg.toml). Frameworks are NOT registered here: a DUT
# implementing both cocotb and SV-UVM (e.g. dtp) declares them as [frameworks.<name>]
# tables in its one sim config and is selected with `--framework`.
[duts.smu_wrapper]
root = "hw/sys/smu/dv"
sim_cfg = "hw/sys/smu/dv/smu_wrapper_sim_cfg.toml"

[duts.dtp]
root = "hw/sys/dtp/dv"

# Shared AXI VIP wire-harness selftests: the master and fault-slave VIPs
# exercise each other on passive tb nets (no DUT RTL). Non-conventional root
# under the shared VIP tree, so it is registered here.
[duts.ocah_axi_vip]
root = "hw/common/dv/vip/ocah_axi_vip/dv"

# Cross-trigger IP-level benches: the family nests one level below the
# hw/ip/<name>/dv convention (hw/ip/cross_trigger/<name>/dv), so each IP is
# registered here.
[duts.cross_trigger_port]
root = "hw/ip/cross_trigger/cross_trigger_port/dv"

[duts.cross_trigger_matrix]
root = "hw/ip/cross_trigger/cross_trigger_matrix/dv"

[duts.cross_trigger_network]
root = "hw/ip/cross_trigger/cross_trigger_network/dv"
