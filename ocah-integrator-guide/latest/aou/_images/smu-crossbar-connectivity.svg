<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-labelledby="title desc">
<title id="title">SMU AXI crossbar connectivity</title>
<desc id="desc">Columns are the crossbar initiators, sep_out, smc_out and ext_in; rows are the targets, sep_in, smc_in and ext_out. A filled circle marks a permitted path and a dash marks none. Each initiator reaches the other two targets; the self-directed paths are not connected.</desc>
<defs>
<marker id="ae" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="#103525"/></marker>
<marker id="as" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" refX="3" refY="4.5" orient="auto"><path d="M10,0 L0,4.5 L10,9 Z" fill="#103525"/></marker>
<marker id="ge" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#5b6670"/></marker>
<marker id="gs" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="3" refY="3.5" orient="auto"><path d="M8,0 L0,3.5 L8,7 Z" fill="#5b6670"/></marker>
<marker id="je" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#42759b"/></marker>
<marker id="js" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="3" refY="3.5" orient="auto"><path d="M8,0 L0,3.5 L8,7 Z" fill="#42759b"/></marker>
<style>
text { font-family: Arial, sans-serif; font-size: 15px; fill: #484848; }
.t { fill: #484848; }
.b { font-size: 17px; font-weight: bold; fill: #103525; }
.bs { font-size: 15px; font-weight: bold; fill: #103525; }
.h { font-size: 22px; font-weight: bold; fill: #103525; }
.s { font-size: 13px; fill: #484848; }
.si { font-size: 13px; font-style: italic; fill: #484848; }
.pmt { font-size: 12px; font-weight: bold; fill: #ffffff; }
.pst { font-size: 12px; font-weight: bold; fill: #103525; }
.pjt { font-size: 12px; font-weight: bold; fill: #1d4b6e; }
.pct { font-size: 12px; font-weight: bold; fill: #1f5c57; }
.pm { fill: #103525; stroke: #103525; stroke-width: 1.2; }
.ps { fill: #ffffff; stroke: #103525; stroke-width: 1.2; }
.pj { fill: #e8f3ff; stroke: #42759b; stroke-width: 1.2; }
.pc { fill: #d9f0ee; stroke: #2f7f79; stroke-width: 1.2; }
.smu { fill: #ffffff; stroke: #77736b; stroke-width: 1.5; }
.network { fill: #e8f0e8; stroke: #336633; stroke-width: 2; }
.fabric { fill: #fff0cc; stroke: #937027; stroke-width: 2; }
.core { fill: #ffffff; stroke: #937027; stroke-width: 2; }
.future { fill: #ffffff; stroke: #937027; stroke-width: 2; }
.nostroke { stroke: none; }
.fut { fill: none; stroke-dasharray: 7 5; }
.opt { stroke-dasharray: 7 5; }
.hatch { fill: none; stroke: #103525; stroke-opacity: 0.16; stroke-width: 1.2; }
.external { fill: #f2f2f2; stroke: #77736b; stroke-width: 1.5; }
.axi { fill: none; stroke: #103525; stroke-width: 2.5; marker-start: url(#as); marker-end: url(#ae); }
.axio { fill: none; stroke: #103525; stroke-width: 2.5; stroke-dasharray: 8 5; marker-start: url(#as); marker-end: url(#ae); }
.sig { fill: none; stroke: #5b6670; stroke-width: 1.5; marker-start: url(#gs); marker-end: url(#ge); }
.sigo { fill: none; stroke: #5b6670; stroke-width: 1.5; marker-end: url(#ge); }
.jtag { fill: none; stroke: #42759b; stroke-width: 1.8; marker-end: url(#je); }
.jtagb { fill: none; stroke: #42759b; stroke-width: 1.8; marker-start: url(#js); marker-end: url(#je); }
.sigplain { fill: none; stroke: #5b6670; stroke-width: 1.5; }
</style>
</defs>
<rect width="640" height="280" fill="#ffffff"/>
<text class="bs" x="14" y="26" text-anchor="start">Crossbar targets</text>
<text class="bs" x="445" y="26" text-anchor="middle">Initiators</text>
<rect class="fabric" x="14" y="38" width="612" height="56" rx="5"/>
<text class="bs" x="324.333" y="63" text-anchor="middle">SEP</text>
<text class="bs" x="324.333" y="79" text-anchor="middle">sep_out</text>
<text class="bs" x="445" y="63" text-anchor="middle">SMC</text>
<text class="bs" x="445" y="79" text-anchor="middle">smc_out</text>
<text class="bs" x="565.667" y="63" text-anchor="middle">Chiplet fabric</text>
<text class="bs" x="565.667" y="79" text-anchor="middle">ext_in</text>
<rect x="14" y="100" width="612" height="40" rx="3" fill="#f8f4eb"/>
<text class="t" x="30" y="125" text-anchor="start">sep_in (SEP)</text>
<path d="M317.333,120 L331.333,120" stroke="#5b6670" stroke-width="2"/>
<circle cx="445" cy="120" r="6.5" fill="#103525"/>
<circle cx="565.667" cy="120" r="6.5" fill="#103525"/>
<text class="t" x="30" y="167" text-anchor="start">smc_in (SMC)</text>
<circle cx="324.333" cy="162" r="6.5" fill="#103525"/>
<path d="M438,162 L452,162" stroke="#5b6670" stroke-width="2"/>
<circle cx="565.667" cy="162" r="6.5" fill="#103525"/>
<rect x="14" y="184" width="612" height="40" rx="3" fill="#f8f4eb"/>
<text class="t" x="30" y="209" text-anchor="start">ext_out (catch-all)</text>
<circle cx="324.333" cy="204" r="6.5" fill="#103525"/>
<circle cx="445" cy="204" r="6.5" fill="#103525"/>
<path d="M558.667,204 L572.667,204" stroke="#5b6670" stroke-width="2"/>
<circle cx="22" cy="253" r="6.5" fill="#103525"/>
<text class="s" x="38" y="258" text-anchor="start">Connected</text>
<path d="M134,253 L148,253" stroke="#5b6670" stroke-width="2"/>
<text class="s" x="158" y="258" text-anchor="start">Not connected</text>
</svg>
