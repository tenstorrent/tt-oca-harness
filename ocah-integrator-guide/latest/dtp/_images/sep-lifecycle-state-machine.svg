<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="692" viewBox="0 0 1040 692" role="img" aria-labelledby="title desc">
<title id="title">SEP lifecycle state machine</title>
<desc id="desc">While fuse sensing runs after a cold reset, the LC_STATE shadow output is held at the INVALID encoding 4'b1111. When fuse sensing completes, the sensed OTP value selects one of the valid encodings: TEST_DEV 4'b0000, PROD 4'b0001, PROD_END 4'b1000, RMA_SIP 4'b001X or RMA_CHIPLET 4'b011X. LC_STATE bits can only be set. Setting LC_STATE[0] moves TEST_DEV to PROD and setting LC_STATE[3] moves TEST_DEV to PROD_END. An RMA_SIP token match permits setting LC_STATE[1], which moves TEST_DEV or PROD to RMA_SIP. An RMA_CHIPLET token match permits setting LC_STATE[2] only from RMA_SIP, which moves it to RMA_CHIPLET. Any other encoding is INVALID, the terminal end-of-life state. In TEST_DEV and PROD, firmware can additionally set the volatile DEMOTE_1 and DEMOTE_2 bits while their lock bits are clear; a SEP cold reset clears them.</desc>
<defs>
