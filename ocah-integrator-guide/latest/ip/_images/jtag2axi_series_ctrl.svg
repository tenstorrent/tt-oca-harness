<!-- SPDX-License-Identifier: CC-BY-4.0 --> <!-- SPDX-FileCopyrightText: 2026 Tenstorrent USA, Inc. --> <svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc"> <title id="title">AXI_SERIES_CTRL (64-bit data, 51-bit address, FIFO_DEPTH=3)</title> <desc id="desc">58 scan bits. reset: bits 57:57; address: bits 56:6; pl_depth: bits 5:4; size: bits 3:2; op: bits 1:0. Fields are not drawn to scale.</desc> <rect width="900" height="190" fill="white"/> <text x="20" y="27" font-family="sans-serif" font-size="19" fill="#173b2c">AXI_SERIES_CTRL (64-bit data, 51-bit address, FIFO_DEPTH=3) — 58 bits</text> <rect x="20" y="67" width="100" height="66" fill="#e5f0ea" stroke="#49685a"/> <text x="70.0" y="55" text-anchor="middle" font-family="monospace" font-size="16">57</text> <text x="70.0" y="105" text-anchor="middle" font-family="monospace" font-size="17">reset</text> <rect x="120" y="67" width="350" height="66" fill="#e5f0ea" stroke="#49685a"/> <text x="295.0" y="55" text-anchor="middle" font-family="monospace" font-size="16">56:6</text> <text x="295.0" y="105" text-anchor="middle" font-family="monospace" font-size="17">address</text> <rect x="470" y="67" width="170" height="66" fill="#e5f0ea" stroke="#49685a"/> <text x="555.0" y="55" text-anchor="middle" font-family="monospace" font-size="16">5:4</text> <text x="555.0" y="105" text-anchor="middle" font-family="monospace" font-size="17">pl_depth</text> <rect x="640" y="67" width="130" height="66" fill="#e5f0ea" stroke="#49685a"/> <text x="705.0" y="55" text-anchor="middle" font-family="monospace" font-size="16">3:2</text> <text x="705.0" y="105" text-anchor="middle" font-family="monospace" font-size="17">size</text> <rect x="770" y="67" width="110" height="66" fill="#e5f0ea" stroke="#49685a"/> <text x="825.0" y="55" text-anchor="middle" font-family="monospace" font-size="16">1:0</text> <text x="825.0" y="105" text-anchor="middle" font-family="monospace" font-size="17">op</text> <text x="20" y="166" font-family="sans-serif" font-size="15" fill="#555">MSB at left; bit 0 shifts out first. Field widths are not to scale.</text> </svg> 