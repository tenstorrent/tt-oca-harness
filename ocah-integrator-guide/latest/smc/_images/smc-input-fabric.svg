<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="772" viewBox="0 0 1040 772" role="img" aria-labelledby="title desc">
<title id="title">SMC input fabric</title>
<desc id="desc">Inbound paths of smc_input_fabric. Four SMC-internal initiators enter at the top: the CPU MMIO port (56-bit address, 3-bit ID) through u_axi_mmio_id_converter, which widens the ID to 4 bits; the JTAG AXI port (2-bit ID) through u_axi_jtag_id_converter, also to 4 bits; the log engine's AXI-Lite port through u_log_axi_lite_to_axi; and the data accelerator's 4-bit-ID AXI port directly. Each then passes its own alias remap in u_smc_alias_remap_wrap; the four remaps share one table of 8 regions with a 4 KiB granule. The 4 to 1 mux u_smc_input_axi_mux merges them, widens the ID from 4 to 6 bits and registers every channel. The demux u_smc_local_global_demux sends addresses inside the SMC window at the local or global base through u_smc_axi_addr_fixer, which truncates the address to 32 bits, to the local_in initiator of the local fabric, and every other address, still 56 bits wide, to the output fabric. The system AXI input (56-bit address, 6-bit ID) passes the 16-entry inbound traffic filter u_smc_sys_inbound_filter, which blocks unmatched traffic, and then u_sys_region_demux: inside the SMC window it is truncated to 32 bits and goes to the system initiator of the local fabric, and any other address receives DECERR. The SEP AXI input (56-bit address, 6-bit ID) is not filtered; u_sep_region_demux passes the SMC window, truncated to 32 bits, to the sep_in initiator and answers every other address with DECERR.</desc>
