<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="976" viewBox="0 0 1040 976" role="img" aria-labelledby="title desc">
<title id="title">GPIO controller and interface shim</title>
<desc id="desc">One GPIO pad is served by two blocks. The gpio controller, instantiated once per pad in smc_padring as u_gpio_interface, receives its gpio_intf AXI-Lite slot from u_gpio_intf_demux. The access filter u_gpio_access_filter checks AxPROT against the ACCESS_FILTER fields of u_gpio_intf_reg, write_filter_enable, read_filter_enable, awprot_requirement and arprot_requirement, and answers failing accesses with DECERR. The LSIO mux chooses core-to-pad data, output enable and input enable from the LSIO plane of smc_padring or from the DATA_CTRL registers. The pad input is synchronized by u_pad2core_sync (prim_sync3r) for the DATA_CTRL.pad2core readback and the level or edge interrupt detector, which drives interrupt_o. Below it, the adopter's gpio_shim receives its gpio_ctrl AXI-Lite slot from the smc_external window; u_shim_axil_demux sends it to u_gpio_ctrl_reg or, above the CONTROL aperture, to the DECERR responder u_axil_err_slv. The 2nd-HW override mux replaces the primary plane with the *_ovrd_i signals while CONTROL.hw2_ovrd is set and force_primary_i is low, and then also returns the pad input gpio_in as pad2core_ovrd_o; the pad input reaches the primary plane as pad2core in either case. The electrical-control mux chooses drive strength, pull and glitch-filter settings from the external ext_* controls or CONTROL. The optional strap latch u_strap_latch follows the pad input while cold reset is asserted and reports the held value as CONTROL.strap_value and on the captured_strap_o output. The technology pad macro drives GPIO_PAD.</desc>
