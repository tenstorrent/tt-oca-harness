<!-- SPDX-License-Identifier: CC-BY-4.0 --> <!-- SPDX-FileCopyrightText: 2026 Tenstorrent USA, Inc. --> <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"      font-family="Helvetica, Arial, sans-serif" fill="#000000">   <title>Memory macro wrapper: OCAH and adopter responsibilities</title>    <defs>     <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"             markerWidth="7" markerHeight="7" orient="auto-start-reverse">       <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>     </marker>   </defs>    <rect x="0" y="0" width="1200" height="1000" fill="#ffffff"/>   <rect x="2" y="2" width="1196" height="996" fill="none" stroke="#000000" stroke-width="2"/>    <!-- Legend -->   <g stroke="#000000" stroke-width="2">     <rect x="25" y="25" width="44" height="28" fill="#ccf2d9"/>     <rect x="25" y="77" width="44" height="28" fill="#fcf8c8"/>   </g>   <g font-size="22">     <text x="82" y="47">OCAH</text>     <text x="82" y="99">Adopter implemented</text>   </g>    <!-- OCAH-owned region -->   <rect x="360" y="58" width="700" height="492" fill="#ccf2d9" stroke="#000000" stroke-width="2"/>   <rect x="392" y="188" width="636" height="332" fill="none" stroke="#000000" stroke-width="2"/>   <text x="410" y="500" font-family="monospace" font-size="19">memory_interface</text>    <!-- Inbound buses -->   <g stroke="#000000" stroke-width="2" fill="none">     <line x1="630" y1="10" x2="630" y2="98"/>     <line x1="630" y1="174" x2="630" y2="224" marker-end="url(#arrow)"/>     <line x1="890" y1="10" x2="890" y2="98"/>     <line x1="890" y1="174" x2="890" y2="224" marker-end="url(#arrow)"/>   </g>   <g font-size="21" text-anchor="middle">     <text x="630" y="126">AXI4-Lite</text>     <text x="630" y="156">from config fabric</text>     <text x="890" y="126">AXI4</text>     <text x="890" y="156">from memory port</text>   </g>    <!-- Address decode -->   <g stroke="#000000" stroke-width="2">     <rect x="570" y="228" width="120" height="68" fill="#ffffff"/>     <rect x="830" y="228" width="120" height="68" fill="#ffffff"/>   </g>   <g font-size="21" text-anchor="middle">     <text x="630" y="258">Address</text>     <text x="630" y="284">Decode</text>     <text x="890" y="258">Address</text>     <text x="890" y="284">Decode</text>   </g>    <!-- AXI4-to-memory conversion -->   <line x1="890" y1="296" x2="890" y2="340" stroke="#000000" stroke-width="2"         marker-end="url(#arrow)"/>   <rect x="795" y="342" width="190" height="102" fill="#b3e6c4" stroke="#000000" stroke-width="2"/>   <g font-size="21" text-anchor="middle">     <text x="890" y="380">AXI4 to memory</text>     <text x="890" y="410">interface</text>   </g>    <!-- Adopter-owned region -->   <rect x="250" y="635" width="860" height="345" fill="#fcf8c8" stroke="#000000" stroke-width="2"/>   <rect x="280" y="663" width="800" height="192" fill="none" stroke="#000000" stroke-width="2"/>   <text x="296" y="840" font-size="21">Interface Shim</text>   <text x="266" y="963" font-size="21">Memory Wrapper</text>    <g stroke="#000000" stroke-width="2">     <rect x="500" y="695" width="260" height="100" fill="#e6e3cc"/>     <rect x="800" y="695" width="180" height="100" fill="#e6e3cc"/>     <rect x="610" y="890" width="260" height="80" fill="#e6e3cc"/>   </g>   <g font-size="21" text-anchor="middle">     <text x="630" y="752">CSR File</text>     <text x="890" y="723">Req/resp to</text>     <text x="890" y="749">macro</text>     <text x="890" y="775">translation</text>     <text x="740" y="937">Memory Macro</text>   </g>    <g stroke="#000000" stroke-width="2" fill="none">     <line x1="640" y1="795" x2="640" y2="888" marker-end="url(#arrow)"/>     <line x1="840" y1="795" x2="840" y2="888" marker-end="url(#arrow)"/>   </g>    <!-- Channels crossing the ownership boundary, drawn last so neither region hides them -->   <g stroke="#000000" stroke-width="2" fill="none"      marker-start="url(#arrow)" marker-end="url(#arrow)">     <line x1="630" y