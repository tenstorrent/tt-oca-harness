<?xml version="1.0" encoding="UTF-8"?> <!-- SPDX-License-Identifier: Apache-2.0 --> <!-- SPDX-FileCopyrightText: 2026 Tenstorrent USA, Inc. --> <svg xmlns="http://www.w3.org/2000/svg" version="1.1"      width="760" height="480" viewBox="0 0 760 480">   <defs>     <style>       text { font-family: sans-serif; fill: #333333; }       .title  { font-size: 16px; font-weight: bold; }       .blabel { font-size: 11px; font-weight: bold; }       .label  { font-size: 11px; }       .small  { font-size: 11px; fill: #555555; }       .port   { font-size: 11px; font-family: monospace; fill: #333333; }     </style>     <marker id="arr" markerWidth="7" markerHeight="7" refX="7" refY="3" orient="auto">       <path d="M0,0 L0,6 L7,3 z" fill="#4a7baa"/>     </marker>     <marker id="arr-g" markerWidth="7" markerHeight="7" refX="7" refY="3" orient="auto">       <path d="M0,0 L0,6 L7,3 z" fill="#555555"/>     </marker>     <marker id="arr-k" markerWidth="7" markerHeight="7" refX="7" refY="3" orient="auto">       <path d="M0,0 L0,6 L7,3 z" fill="#998866"/>     </marker>   </defs>    <text x="14" y="24" class="title">DTP JTAG Scan Chain</text>    <!-- ── JTAG pads ──────────────────────────────────────────────────────── -->   <rect x="14" y="54" width="70" height="80" rx="3"         fill="#e8e8e8" stroke="#888888" stroke-width="1.2"/>   <text x="49" y="76" class="small" text-anchor="middle" font-weight="bold">JTAG</text>   <text x="49" y="90" class="small" text-anchor="middle">Pads</text>   <text x="49" y="105" class="port" text-anchor="middle">TDI→</text>   <text x="49" y="120" class="port" text-anchor="middle">←TDO</text>    <!-- ── PTAP ───────────────────────────────────────────────────────────── -->   <rect x="104" y="54" width="120" height="116" rx="4"         fill="#dce8f4" stroke="#4a7baa" stroke-width="1.5"/>   <text x="164" y="82" class="blabel" text-anchor="middle">PTAP</text>   <text x="164" y="98" class="small" text-anchor="middle">TAP controller</text>   <text x="164" y="112" class="small" text-anchor="middle">IR / TDR select</text>   <text x="164" y="126" class="small" text-anchor="middle">Scan mux</text>    <!-- Pads → PTAP TDI -->   <line x1="84" y1="101" x2="104" y2="101" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>   <!-- PTAP TDO → Pads -->   <line x1="104" y1="116" x2="84" y2="116" stroke="#555555" stroke-width="1.2" marker-end="url(#arr-g)"/>    <!-- ── STAP chain (top row) ───────────────────────────────────────────── -->   <text x="238" y="50" class="small" font-weight="bold">Secondary Scan Chain (PTAP drives STAP_TDI; STAP_TDO returns)</text>    <rect x="238" y="54" width="96" height="76" rx="3" fill="#dce8f4" stroke="#4a7baa" stroke-width="1.2"/>   <text x="286" y="78" class="small" text-anchor="middle" font-weight="bold">STAP I/O</text>   <text x="286" y="92" class="small" text-anchor="middle">IEEE 1838</text>   <text x="286" y="106" class="small" text-anchor="middle">(optional)</text>    <rect x="346" y="54" width="96" height="76" rx="3" fill="#dce8f4" stroke="#4a7baa" stroke-width="1.2"/>   <text x="394" y="78" class="small" text-anchor="middle" font-weight="bold">STAP SMC</text>   <text x="394" y="92" class="small" text-anchor="middle">CPU debug</text>   <text x="394" y="106" class="small" text-anchor="middle">(optional)</text>    <rect x="454" y="54" width="96" height="76" rx="3" fill="#dce8f4" stroke="#4a7baa" stroke-width="1.2"/>   <text x="502" y="78" class="small" text-anchor="middle" font-weight="bold">STAP SEP</text>   <text x="502" y="92" class="small" text-anchor="middle">CPU debug</text>   <text x="502" y="106" class="small" text-anchor="middle">(optional)</text>    <rect x="562" y="54" width="114" height="76" rx="3" fill="#dce8f4" stroke="#4a7baa" stroke-width="1.2" stroke-dasharray="5 3"/>   <text x="619" y="78" class="small" text-anchor="middle" font-weight="bold">Extra STAPs</text>   <text x="619" y="92" class="small" text-anchor="middle">[JTAG_NUM_EXTRA</text>   <text x="619" y="106" class="small" text-anchor="middle">_STAP_PORTS-1:0]</text>    <!-- PTAP secondary-scan out → first STAP TDI -->   <line x1="224" y1="84" x2="238" y2="84" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>   <!-- STAP-to-STAP chain -->   <line x1="334" y1="84" x2="346" y2="84" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>   <line x1="442" y1="84" x2="454" y2="84" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>   <line x1="550" y1="84" x2="562" y2="84" stroke="#4a7baa" stroke-width="1.2" marker-end="url(#arr)"/>    <!-- TDO return: last STAP TDO → back to PTAP scan-mux -->   <polyline points="676,84 710,84 710,152 224,152"             fill="none" stroke="#4a7baa" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arr)"/>   <text x="474" y="176" class="small" text-anchor="middle">STAP TDO return path — selected stage TDO feeds PTAP scan mux</text>    <!-- ── iJTAG SIB chains (lower half) ─────────────────────────────────── -->   <text x="190" y="210" class="small" font-weight="bold">iJTAG SIB Chains (instruction-selected scan paths through PTAP TDR mux)</text>    <!-- Instruction select bus branches above the first and last chain columns. -->   <line x1="164" y1="170" x2="164" y2="234" stroke="#998866" stroke-width="1" stroke-dasharray="3 2"/>   <line x1="60" y1="234" x2="580" y2="234" stroke="#998866" stroke-width="1" stroke-dasharray="3 2"/>    <!-- Secure DFT -->   <rect x="14" y="254" width="92" height="60" rx="3" fill="#f5f0e8" stroke="#998866" stroke-width="1.2"/>   <text x="60" y="277" class="small" text-anchor="middle" font-weight="bold">Secure DFT</text>   <text x="60" y="297" class="small" text-anchor="middle">iJTAG chain</text>   <line x1="60" y1="234" x2="60" y2="254" stroke="#998866" stroke-width="1" marker-end="url(#arr-k)"/>    <!-- Non-secure DFT -->   <rect x="118" y="254" width="92" height="60" rx="3" fill="#f5f0e8" stroke="#998866" stroke-width="1.2"/>   <text x="164" y="277" class="small" text-anchor="middle" font-weight="bold">Non-sec DFT</text>   <text x="164" y="297" class="small" text-anchor="middle">iJTAG chain</text>   <line x1="164" y1="234" x2="164" y2="254" stroke="#998866" stroke-width="1" marker-end="url(#arr-k)"/>    <!-- DFD -->   <rect x="222" y="254" width="92" height="60" rx="3" fill="#f5f0e8" stroke="#998866" stroke-width="1.2"/>   <text x="268" y="277" class="small" text-anchor="middle" font-weight="bold">DFD</text>   <text x="268" y="297" class="small" text-anchor="middle">iJTAG chain</text>   <line x1="268" y1="234" x2="268" y2="254" stroke="#998866" stroke-width="1" marker-end="url(#arr-k)"/>    <!-- SMC fabric JTAG2AXI -->   <rect x="326" y="254" width="92" height="60" rx="3" fill="#f5f0e8" stroke="#998866" stroke-width="1.2"/>   <text x="372" y="277" class="small" text-anchor="middle" font-weight="bold">SMC fabric</text>   <text x="372" y="297" class="small" text-anchor="middle">JTAG2AXI</text>   <text x="372" y="309" class="small" text-anchor="middle">bridge</text>   <line x1="372" y1="234" x2="372" y2="254" stroke="#998866" stroke-width="1" marker-end="url(#arr-k)"/>    <!-- SMC OTP -->   <rect x="430" y="254" width="92" height="60" rx="3" fill="#f5f0e8" stroke="#998866" stroke-width="1.2"/>   <text x="476" y="277" class="small" text-anchor="middle" font-weight="bold">SMC OTP</text>   <text x="476" y="297" class="small" text-anchor="middle">JTAG2AXIL</text>   <line x1="476" y1="234" x2="476" y2="254" stroke="#998866" stroke-width="1" marker-end="url(#arr-k)"/>    <!-- SEP OTP -->   <rect x="534" y="254" width="92" height="60" rx="3" fill="#f5f0e8" stroke="#998866" stroke-width="1.2"/>   <text x="580" y="277" class="small" text-anchor="middle" font-weight="bold">SEP OTP</text>   <text x="580" y="297" class="small" text-anchor="middle">JTAG2AXIL</text>   <line x1="580" y1="234" x2="580" y2="254" stroke="#998866" stroke-width="1" marker-end="url(#arr-k)"/>    <!-- REG row -->   <rect x="14" y="332" width="92" height="44" rx="2" fill="#efefef" stroke="#aaaaaa"/>   <text x="60" y="350" class="small" text-anchor="middle">REG</text>   <text x="60" y="366" class="small" text-anchor="middle">(SIB)</text>   <rect x="118" y="332" width="92" height="44" rx="2" fill="#efefef" stroke="#aaaaaa"/>   <text x="164" y="350" class="small" text-anchor="middle">REG</text>   <text x="164" y="366" class="small" text-anchor="middle">(SIB)</text>   <rect x="222" y="332" width="92" height="44" rx="2" fill="#efefef" stroke="#aaaaaa"/>   <text x="268" y="350" class="small" text-anchor="middle">REG</text>   <text x="268" y="366" class="small" text-anchor="middle">(SIB)</text>   <rect x="326" y="332" width="92" height="44" rx="2" fill="#efefef" stroke="#aaaaaa"/>   <text x="372" y="350" class="small" text-anchor="middle">REG</text>   <text x="372" y="366" class="small" text-anchor="middle">(AXI bridge)</text>   <rect x="430" y="332" width="92" height="44" rx="2" fill="#efefef" stroke="#aaaaaa"/>   <text x="476" y="350" class="small" text-anchor="middle">REG</text>   <text x="476" y="366" class="small" text-anchor="middle">(AXI-Lite)</text>   <rect x="534" y="332" width="92" height="44" rx="2" fill="#efefef" stroke="#aaaaaa"/>   <text x="580" y="350" class="small" text-anchor="middle">REG</text>   <text x="580" y="366" class="small" text-anchor="middle">(AXI-Lite)</text>    <!-- Scan connections SIB → REG -->   <line x1="60" y1="314" x2="60" y2="332" stroke="#888888" stroke-width="1"/>   <line x1="164" y1="314" x2="164" y2="332" stroke="#888888" stroke-width="1"/>   <line x1="268" y1="314" x2="268" y2="332" stroke="#888888" stroke-width="1"/>   <line x1="372" y1="314" x2="372" y2="332" stroke="#888888" stroke-width="1"/>   <line x1="476" y1="314" x2="476" y2="332" stroke="#888888" stroke-width="1"/>   <line x1="580" y1="314" x2="580" y2="332" stroke="#888888" stroke-width="1"/>    <!-- Instruction-selected register outputs return to the PTAP TDO mux. -->   <path d="M60,376 V400 M164,376 V400 M268,376 V400 M372,376 V400 M476,376 V400 M580,376 V400"         fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4 2"/>   <polyline points="580,400 4,400 4,152 104,152"             fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr-g)"/>   <text x="14" y="422" class="small">     Selected chain REG output returns to PTAP TDO mux; only one chain active per instruction   </text>    <!-- Lifecycle note -->   <text x="14" y="450" class="small">     dbg_disable_i gates five STAP/scan paths, three iJTAG chains   </text>   <text x="14" y="466" class="small">     and three JTAG2AXI bridges independently.   </text>  </svg> 