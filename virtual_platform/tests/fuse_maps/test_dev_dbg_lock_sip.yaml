# TEST_DEV, secure boot not disabled, CHIPLET_DBG (bit 1) set in SIP_DIS. A
# debug-locked TEST_DEV part enforces secure boot (SEP-ROM-SB-025).
lc_state: TEST_DEV
sboot_dis: 0
locks_lo: 0xA800
sip_dis_lo: 0x2
