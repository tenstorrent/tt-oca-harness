# SIP_PUBK_HASH1 provisioned with the SHA-256 of ROM key 0's RSA-3072 modulus.
#
# configs/oca_sip_key_boot_test.yaml selects public_key_select_classic bit 24,
# which is SIP_PUBK_HASH1 -- the SiP owner's second root key slot. Same digest as
# the CHIPLET_PUBK_HASH0 map, because it is the same signing key; only which bank
# the device is asked to trust it from differs.
#
# This bank was inside a generic RESERVED block until the eFuse model was
# re-synced to the RDL, so slot 24 was mapped by the ROM but unreachable here.
# Regenerating tests/signing_keys/rsa_private_key.rom_key0.pem changes this digest.
# It is the SHA-256 of that key's modulus; derive the words from
# bootrom/prod/src/key_digests.c slot 0 rather than by hand.
lc_state: TEST_DEV
sboot_dis: 0
sip_pubk_hash1:
  - 0x63ca71a7
  - 0xc2f5a837
  - 0x94c96e1a
  - 0xa03a7e64
  - 0xd2a7fd9c
  - 0xbb617d03
  - 0x2b03dfec
  - 0xf6508284
