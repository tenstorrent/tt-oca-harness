# PROD lifecycle, secure boot ENABLED (sboot_dis = 0).
# Fields not listed are erased: the harness disables the base efuse_vp.ini preload image.
# lc_state accepts a symbolic name (TEST_DEV/PROD/RMA_SIP/RMA_CHIPLET/INVALID/PROD_END)
# or an int; it sets sep_efuse.lc_state, and the platform derives lc_ctrl from the eFuse.
lc_state: PROD
sboot_dis: 0
# No secret is read-locked at power-on: BL0 reads class_key for the payload key and
# lock_fuse_secrets() then sets these bits for BL1 onwards.
locks_lo: 0x0
chiplet_uid: [1, 2, 3, 4, 5, 6, 7, 8]
