# PROD lifecycle, secure boot ENABLED (sboot_dis = 0).
# Fields not listed inherit the base efuse_vp.ini defaults.
# lc_state accepts a symbolic name (TEST_DEV/PROD/RMA_SIP/RMA_CHIPLET/INVALID/PROD_END)
# or an int; it is mirrored to both sep_efuse.lc_state and lc_ctrl.lc_state.
lc_state: PROD
sboot_dis: 0
locks_lo: 0xA800
chiplet_uid: [1, 2, 3, 4, 5, 6, 7, 8]
