# CHIPLET_PUBK_HASH0 provisioned with the SHA-256 of ROM key 0's RSA-3072 modulus.
#
# configs/oca_otp_key_boot_test.yaml selects public_key_select_classic bit 16,
# which is CHIPLET_PUBK_HASH0 (see CHIPLET_PUBK_REVOKE's bit map in
# sep_efuse_map.rdl -- select and revoke index the same key entries). The ROM
# therefore takes its anchor from this bank instead of key_digests.c.
#
# The model now names this bank CHIPLET_PUBK_HASH0, matching the RDL.
#
# Word order matches plat_is_key_authorized()'s fuse_read_bytes(): word[0] holds
# bits[31:0], so each word is four consecutive digest bytes read little-endian.
# The digest is over the 384-byte MODULUS only, not the 388-byte RAW blob.
# Regenerating tests/signing_keys/rsa_private_key.rom_key0.pem changes this digest.
# It is the SHA-256 of that key's modulus; derive the words from
# bootrom/prod/src/key_digests.c slot 0 rather than by hand.
lc_state: TEST_DEV
sboot_dis: 0
chiplet_pubk_hash0:
  - 0x63ca71a7
  - 0xc2f5a837
  - 0x94c96e1a
  - 0xa03a7e64
  - 0xd2a7fd9c
  - 0xbb617d03
  - 0x2b03dfec
  - 0xf6508284

# ...and then revoked. CHIPLET_PUBK_REVOKE bit 16 is the SAME key entry that
# public_key_select_classic bit 16 names, so provisioning the anchor and revoking
# the slot must produce SEP_MSG_REVOKED_KEY rather than a boot.
#
# This is the map that catches a select-vs-revoke numbering disagreement: if the
# two indexed different keys, authorization would pass, revocation would look at
# an unrelated bit, and the image would boot with a key the device had revoked.
chiplet_pubk_revoke: 0x00010000
