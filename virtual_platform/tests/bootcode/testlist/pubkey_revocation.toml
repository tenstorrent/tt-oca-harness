[[testcase]]
name = "sep_firmware_primary_pubkey_rom_0_revoked_key_test"
family = "pubkey_revocation"
classification = "vp-equivalent"
image = "signed"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "FAILED"
pytest_markers = ["needs_debug"]
# Byte-identical to sep_firmware_primary_rom_key_valid_test; only the fuse bit differs.
efuse = { chiplet_pubk_revoke = 0x1 }
image_asserts = [
  { field = { name = "OFF_PUBLIC_KEY_SELECT_CLASSIC", slot = "primary", size = 8, value = 0x1 } },
  { field = { name = "OFF_PUBLIC_KEY_SELECT_CLASSIC", slot = "backup", size = 8, value = 0x1 } },
  { range = [0x1a5f, 0x1a6f], all = 0x0 },
  { range = [0x0, "end"], same_as = "signed" },
]
expect = [
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "OCA_BODY=0x00001000",
  "MFST_VER=0x00000000",
  "PUBK_SEL=0x00000000",
  "PUBK_AUTHORIZED",
  "PUBK_REVOKE=0x00000001",
  "MANIFEST_ERR=0x00030016",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "OCA_BODY=0x00001000",
  "MFST_VER=0x00000000",
  "PUBK_SEL=0x00000000",
  "PUBK_AUTHORIZED",
  "PUBK_REVOKE=0x00000001",
  "MANIFEST_ERR=0x00030016",
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=0x00030016",
  "[VP] SIMULATION OF THE TEST FAILED",
]
forbid = [
  "FUSE_VER=",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "PUBK_NO_SIGNATURE",
  "PUBK_ALGO_UNSUPPORTED",
  "PUBK_SEL_EMPTY",
  "PUBK_SEL_AMBIGUOUS",
  "PUBK_SLOT_RESERVED",
  "PUBK_SLOT_UNPROVISIONED",
  "PUBK_SLOT_PQC_UNSUPPORTED",
  "PUBK_OTP_EMPTY",
  "PUBK_UNAUTHORIZED",
  "PUBK_HASH_TIMEOUT",
  "RSA_PKCS1_FAIL",
  "SBOOT_OFF",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "BL1_COPIED",
  "BL1_JUMP=",
  "PRE_JUMP",
  "GO!",
  "[VP] SIMULATION OF THE TEST PASSED",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "PUBK_SEL=0x00000000" = 2, "PUBK_AUTHORIZED" = 2, "PUBK_REVOKE=0x00000001" = 2, "MANIFEST_ERR=0x00030016" = 2, "MANIFEST_ALL_FAILED" = 1 }
terminal_token = "MANIFEST_BOOT_FAIL=0x00030016"
expect_status = ["INFO 0x0212", "INFO 0x004c", "WARN 0x000c", "INFO 0x0212", "INFO 0x004c", "WARN 0x000c", "ERROR 0x000c", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x40000], exact = 0 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
  { name = "backup_payload", range = [0x42000, 0x80000], exact = 0 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = [
  "primary_manifest",
  "backup_manifest",
]
markers = [
  "Terminal because both shipped slots select ROM key slot 0, so one fuse bit refuses both; slots 1 to 5 fail over and boot.",
  "PUBK_AUTHORIZED before PUBK_REVOKE in each attempt shows the key was trusted and then withdrawn: oca_check_root_key_authorized runs before oca_check_root_key_revocation.",
  "FUSE_VER= and RSA_EXEC are forbidden: revocation refuses before the anti-rollback read and before any modexp.",
  "The manifest's own revoke bitmap is asserted zero, so the effective set (manifest OR fuse) is the fuse word alone.",
  "One revoked slot per run; several bits at once and OTP anchor revocation bits 20, 22 and 24 are not covered; the chiplet_pubkey revoke twins cover bits 16 and 17.",
]

[[testcase]]
name = "sep_firmware_primary_pubkey_rom_1_revoked_key_test"
