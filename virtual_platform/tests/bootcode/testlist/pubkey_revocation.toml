  "MANIFEST_SRC=0x00001000",
  "OCA_BODY=0x00001000",
  "PUBK_SEL=0x00000001",
  "PUBK_AUTHORIZED",
  "PUBK_REVOKE=0x00000002",
  "MANIFEST_ERR=0x00030016",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "PUBK_SEL=0x00000000",
  "PUBK_AUTHORIZED",
  "PUBK_REVOKE=0x00000002",
  "FUSE_VER=0x00000000",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "BL1_COPIED",
  "GO!",
]
forbid = [
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "PUBK_NO_SIGNATURE",
  "PUBK_ALGO_UNSUPPORTED",
  "PUBK_SEL_EMPTY",
  "PUBK_SEL_AMBIGUOUS",
  "PUBK_SLOT_RESERVED",
  "PUBK_SLOT_UNPROVISIONED",
  "PUBK_SLOT_PQC_UNSUPPORTED",
  "PUBK_OTP_EMPTY",
  "PUBK_UNAUTHORIZED",
  "PUBK_HASH_TIMEOUT",
  "RSA_PKCS1_FAIL",
  "SBOOT_OFF",
  "[VP] SIMULATION OF THE TEST FAILED",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "PUBK_SEL=0x00000001" = 1, "PUBK_SEL=0x00000000" = 1, "PUBK_AUTHORIZED" = 2, "PUBK_REVOKE=0x00000002" = 2, "MANIFEST_ERR=0x00030016" = 1, "FUSE_VER=0x00000000" = 2, "RSA_EXEC" = 1, "RSA_VERIFY_OK" = 1, "MANIFEST_OK" = 1 }
expect_status = ["INFO 0x0212", "INFO 0x004c", "WARN 0x000c", "INFO 0x0212", "INFO 0x004c", "INFO 0x0053", "INFO 0x0055"]
forbid_status = ["ERROR 0x000c", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x40000], exact = 0 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
  { name = "backup_payload", range = [0x42000, 0x80000], min = 1 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = [
  "primary_manifest",
  "backup_manifest",
  "backup_payload",
]
markers = [
  "The primary slot is the shipped oca_rom_key1_boot.bin slot, signed by ROM key 1, and the backup is the shipped slot 0 backup; PUBK_AUTHORIZED twice shows both keys matched their digests.",
  "Revocation is the only refusal: FUSE_VER=0x00000000 twice and RSA_EXEC once are the backup's, so the primary stopped before anti-rollback and the verifier.",
  "Failover, not terminal: bit 1 does not revoke the backup's slot 0.",
  "One revoked slot per run; OTP anchor revocation bits 20, 22 and 24 are not covered.",
]

