]

[[testcase]]
name = "sep_firmware_primary_non_encrypted_invalid_payload_image_size_test"
family = "payload_metadata"
classification = "retired"
reason = "OCA has no TOC image length alignment rule: validate_toc_structure requires a non-zero, in-bounds length and an 8-byte aligned offset, so an unaligned length is a legal image and the IMAGE_LEN_ALIGN verdict has no OCA equivalent."

