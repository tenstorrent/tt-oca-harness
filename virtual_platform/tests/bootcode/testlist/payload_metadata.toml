]
spi_read_order = ["primary_manifest", "primary_payload", "backup_manifest", "backup_payload"]
markers = [
  "An op, not a repack: the packer places images itself and declares no entry offset; set_toc_entry_offset reseals the entry digest, payload_hash_chain, payload_hash and the signature, so only the placement rule can refuse the slot.",
  "Offset 240 (0xF0) is the DV value: 8-byte aligned and past entry 0's digest, inside the 312-byte TOC, so only the rule that an image starts after the TOC refuses it.",
]

