[[testcase]]
name = "sep_firmware_primary_non_encrypted_invalid_payload_image_count_test"
family = "payload_metadata"
classification = "vp-equivalent"
image = "primary_non_encrypted_invalid_payload_image_count"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "PASSED"
pytest_markers = ["needs_debug"]
image_asserts = [
  { range = [0x2010, 0x2012], all = 0x01 },
  { range = [0x2012, 0x2018], all = 0x00 },
  { range = [0x2010, 0x2018], differs_from = "signed" },
  { range = [0x1c64, 0x1de4], differs_from = "signed" },
  { range = [0x0, 0x1ad7], same_as = "signed" },
  { range = [0x1af7, 0x1c64], same_as = "signed" },
  { range = [0x1de4, 0x1e64], same_as = "signed" },
  { range = [0x1e84, 0x2010], same_as = "signed" },
  { range = [0x2018, "end"], same_as = "signed" },
]
expect = [
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "OCA_BODY=0x00001000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "MANIFEST_ERR=0x00030015",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "OCA_BODY=0x00001000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "BL1_COPIED",
  "BL1_JUMP=0xc0000000",
  "GO!",
]
forbid = [
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "MANIFEST_ERR=0x0003000d",
  "MANIFEST_ERR=0x0003000e",
  "MANIFEST_ERR=0x00030012",
  "MANIFEST_ERR=0x00030014",
  "MANIFEST_ERR=0x00030019",
  "MANIFEST_ERR=0x0003001a",
  "MANIFEST_ERR=0x00030013",
  "MANIFEST_ERR=0x00030001",
  "MANIFEST_ERR=0x0003001b",
  "PAYLOAD_LOC_FAIL",
  "PAYLOAD_TOO_LARGE",
  "FLASH_READ_OOB",
  "DMA_STS=",
  "NO_BL1_IMAGE",
  "BL1_ADDR_RANGE",
  "BL1_SIZE",
  "BL1_ENTRY_RANGE",
  "SBOOT_OFF",
  "DECRYPT_OK",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "MANIFEST_ERR=0x00030015" = 1, "PUBK_AUTHORIZED" = 2, "RSA_VERIFY_OK" = 2, "MANIFEST_OK" = 2, "PAYLOAD_OK" = 1, "BL1_COPIED" = 1 }
expect_status = ["INFO 0x004c", "INFO 0x0053", "DEBUG 0x0052", "WARN 0x000f", "INFO 0x004c", "INFO 0x0053", "INFO 0x0055"]
forbid_status = ["ERROR 0x000f", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x40000], min = 1 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
  { name = "backup_payload", range = [0x42000, 0x80000], min = 1 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_manifest", "primary_payload", "backup_manifest", "backup_payload"]
markers = [
  "An op, not a repack: neither packer config declares toc.image_count, and a byte patch would leave payload_hash stale so the run would stop at 0x00030012 first.",
  "257 matches the DV member: read_toc_span() refuses a count whose entry array does not fit the payload before the OCA_TOC_MAX_IMAGES cap, so the code is OCA_FAIL_PAYLOAD_TOC rather than TOO_MANY_IMAGES.",
  "The count==0 arm of the same predicate is covered by the no_payload_images rows, not here.",
  "The packed config carries one payload image, so the true count the mutation departs from is 1.",
  "RSA_VERIFY_OK and MANIFEST_OK are counted twice, so the re-signed primary passed the crypto chain before its TOC was refused.",
]

