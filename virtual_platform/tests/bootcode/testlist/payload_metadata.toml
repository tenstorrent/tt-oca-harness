  { range = [0x1de4, 0x1e64], same_as = "signed" },
  { range = [0x1e84, 0x2038], same_as = "signed" },
  { range = [0x2040, 0x2070], same_as = "signed" },
  { range = [0x2090, "end"], same_as = "signed" },
]
expect = [
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "OCA_BODY=0x00001000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "MANIFEST_ERR=0x00030015",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "OCA_BODY=0x00001000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "BL1_COPIED",
  "BL1_JUMP=0xc0000000",
  "GO!",
]
forbid = [
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "MANIFEST_ERR=0x0003000d",
  "MANIFEST_ERR=0x0003000e",
  "MANIFEST_ERR=0x00030012",
  "MANIFEST_ERR=0x00030014",
  "MANIFEST_ERR=0x00030019",
  "MANIFEST_ERR=0x0003001a",
  "MANIFEST_ERR=0x00030013",
  "MANIFEST_ERR=0x00030001",
  "MANIFEST_ERR=0x0003001b",
  "PAYLOAD_LOC_FAIL",
  "PAYLOAD_TOO_LARGE",
  "FLASH_READ_OOB",
  "DMA_STS=",
  "NO_BL1_IMAGE",
  "BL1_ADDR_RANGE",
  "BL1_SIZE",
  "BL1_ENTRY_RANGE",
  "SBOOT_OFF",
  "DECRYPT_OK",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "MANIFEST_ERR=0x00030015" = 1, "PUBK_AUTHORIZED" = 2, "RSA_VERIFY_OK" = 2, "MANIFEST_OK" = 2, "PAYLOAD_OK" = 1, "BL1_COPIED" = 1 }
expect_status = ["INFO 0x004c", "INFO 0x0053", "DEBUG 0x0052", "WARN 0x000f", "INFO 0x004c", "INFO 0x0053", "INFO 0x0055"]
forbid_status = ["ERROR 0x000f", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x40000], min = 1 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
