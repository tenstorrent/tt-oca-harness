  "Partial: OCA has no inter-image ordering rule, so the legacy ordering verdict maps to DV images_descending_order, which boots (see the __ctrl_permute_only entry); this entry carries DV images_overlapping instead.",
  "The primary is refused at the magic peek (0x00030002), so the single signature check and TOC belong to the backup.",
  "validate_toc_structure checks every entry pairwise against every earlier one, so descending order alone is legal; entry 1 at 880 overlaps entry 2 at [872, 2716) and the slot is refused as OCA_FAIL_PAYLOAD_TOC (0x00030015, status 0x000f) after the signature verified.",
  "The OCA ROM has no inter-image ordering rule and prints no index, so the stimulus follows the DV member (images_overlapping): permute to (2, 1, 0), then move entry 1 eight bytes into entry 2.",
