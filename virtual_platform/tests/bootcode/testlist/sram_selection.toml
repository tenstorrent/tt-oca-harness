[[testcase]]
name = "sep_firmware_manifest_primary_use_ext_sram_enabled_test"
family = "sram_selection"
classification = "retired"
reason = "The OCA manifest has no use_ext_sram bit and the ROM always stages the payload in SEP SRAM, so there is no staging-destination selection to test."

