  { range = [0x101c, 0x101d], all = 0x14 },
  { range = [0x1018, 0x101c], all = 0x00 },
  { range = [0x101d, 0x1028], all = 0x00 },
  { range = [0x104a, 0x104b], all = 0xFF },
  { range = [0x104c, 0x104d], all = 0xFF },
  { range = [0x101c, 0x101d], differs_from = "signed" },
  { range = [0x0, 0x101c], same_as = "signed" },
  { range = [0x101d, 0x104a], same_as = "signed" },
  { range = [0x104b, 0x104c], same_as = "signed" },
  { range = [0x104d, 0x1c64], same_as = "signed" },
  { range = [0x1de4, 0x1e64], same_as = "signed" },
  { range = [0x1e84, "end"], same_as = "signed" },
]
expect = [
  "LC=PROD",
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "OCA_BODY=0x00001000",
  "MANIFEST_ERR=0x00030008",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "BL1_COPIED",
  "GO!",
]
forbid = [
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "MANIFEST_ERR=0x00030007",
  "MANIFEST_ERR=0x00030009",
  "MANIFEST_ERR=0x0003000a",
  "MANIFEST_ERR=0x0003000d",
  "SBOOT_OFF",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "MANIFEST_ERR=0x00030008" = 1, "OCA_BODY=0x00001000" = 2, "PUBK_AUTHORIZED" = 1, "RSA_EXEC" = 1, "RSA_VERIFY_OK" = 1, "MANIFEST_OK" = 1, "PAYLOAD_OK" = 1 }
expect_status = ["INFO 0x004c", "WARN 0x0022", "INFO 0x004c", "INFO 0x0053", "INFO 0x0055"]
forbid_status = ["ERROR 0x0022", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], exact = 18 },
  { name = "primary_payload", range = [0x2000, 0x40000], exact = 0 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], exact = 18 },
  { name = "backup_payload", range = [0x42000, 0x80000], exact = 10 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_manifest", "backup_manifest", "backup_payload"]
markers = [
  "The chiplet selector stays clear, so oca_check_identity passes the chiplet field and refuses on the package field; forbidding 0x00030007 pins that order.",
  "Bytes 2 and 4 are selected with 0xFF against the erased SEP_SIP_ID fuse, as DV plants fuse ^ 0xFF; a partially matching selection or a fused identity is not covered.",
  "SEP_MSG_INVALID_PACKAGE_ID (0x22) is shared with OCA_FAIL_SYSTEM_ID, so the WARN status alone does not separate package from system; the error code does.",
]

