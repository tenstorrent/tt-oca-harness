boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "PASSED"
pytest_markers = ["needs_debug"]
# Selector bit 33 is bit 1 of byte 4; package identity byte 1 is 0xFF against an all-zero SEP_SIP_ID.
image_asserts = [
  { field = { name = "OFF_SELECTOR_BITS", slot = "primary", size = 8, value = 0x200000000 } },
  { field = { name = "OFF_PACKAGE_ID", slot = "primary", size = 2, value = 0xFFA5 } },
  { range = [0x1e64, 0x1e84], differs_from = "multi" },
  { range = [0x0, 0x101c], same_as = "multi" },
  { range = [0x101d, 0x1048], same_as = "multi" },
  { range = [0x104a, 0x1c64], same_as = "multi" },
  { range = [0x1de4, 0x1e64], same_as = "multi" },
  { range = [0x1e84, "end"], same_as = "multi" },
]
expect = [
  "LC=PROD",
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "OCA_BODY=0x00001000",
  "MFST_VER=0x00000000",
  "MANIFEST_ERR=0x00030008",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "LOAD=0xc0000000",
  "LEN=0x00000734",
  "COPY_SRC=0x100021d8",
  "COPY_DST=0xc0000000",
  "COPY_LEN=0x00000734",
  "BL1_COPIED",
  "BL1_JUMP=0xc0000000",
  "PRE_JUMP",
  "GO!",
]
forbid = [
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "NO_BL1_IMAGE",
  "BL1_ADDR_RANGE",
  "BL1_SRAM_EXEC_DISABLED",
  "BL1_SIZE",
  "BL1_ENTRY_RANGE",
  "SBOOT_OFF",
  "SPI init failed, using backup manifest",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "MANIFEST_ERR=0x00030008" = 1, "PUBK_AUTHORIZED" = 1, "RSA_EXEC" = 1, "MANIFEST_OK" = 1, "PAYLOAD_OK" = 1, "BL1_COPIED" = 1, "COPY_SRC=0x100021d8" = 1 }
expect_status = ["INFO 0x0212", "INFO 0x004c", "WARN 0x0022", "INFO 0x0212", "INFO 0x004c", "INFO 0x0053", "INFO 0x0055", "INFO 0x0054"]
forbid_status = ["ERROR 0x0022", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x40000], exact = 0 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
  { name = "backup_payload", range = [0x42000, 0x4390c], min = 1 },
  { name = "backup_tail", range = [0x4390c, 0x80000], exact = 0 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_manifest", "backup_manifest", "backup_payload"]
markers = [
  "COPY_SRC is the discriminating assertion: the backup TOC is [BLMEMMAP, _VENDOR1, BLSTAGE1], and the backup body is staged at the same SEP SRAM base as the primary's, so BL1 is copied from 0x10001000 + entry[2].offset 0x11d8.",
  "The primary refusal is the means of reaching the backup, not the subject; it matches the DV member's package-identity arm.",
  "The backup payload is 0x190c bytes, so its span ends at 0x4390c rather than the single-image 0x4286c.",
  "Nothing loads the BLMEMMAP or _VENDOR1 entries; this says nothing about their handling.",
]

