[[testcase]]
name = "sep_firmware_validate_backup_manifest_test"
family = "manifest_toc"
classification = "vp-equivalent"
image = "validate_backup_manifest"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "PASSED"
pytest_markers = ["needs_debug"]
image_asserts = [
  { field = { name = "OFF_MANIFEST_VERSION_MAJOR", slot = "primary", size = 2, value = 99 } },
  { field = { name = "OFF_MANIFEST_VERSION_MINOR", slot = "primary", size = 2, value = 0 } },
  { field = { name = "OFF_MANIFEST_LENGTH", slot = "primary", size = 4, value = 4096 } },
  { range = [0x1e64, 0x1e84], differs_from = "signed" },
  { range = [0x0, 0x100c], same_as = "signed" },
  { range = [0x1014, 0x1c64], same_as = "signed" },
  { range = [0x1de4, 0x1e64], same_as = "signed" },
  { range = [0x1e84, "end"], same_as = "signed" },
]
expect = [
  "LC=PROD",
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "OCA_BODY=0x00001000",
  "MFST_VER=0x00000000",
  "MANIFEST_ERR=0x00030004",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "OCA_BODY=0x00001000",
  "MFST_VER=0x00000000",
  "PUBK_SEL=0x00000000",
  "PUBK_AUTHORIZED",
  "PUBK_REVOKE=0x00000000",
  "FUSE_VER=0x00000000",
  "ENTROPY_OK",
  "RSA_EXEC",
  "RSA_CMP1",
  "RSA_CMP2",
  "RSA_VERIFY_OK",
  "FUSE_VER=0x00000000",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "MEAS_BOOT_STATE_OK",
  "FUSE_SECRETS_LOCKED",
  "COPY_SRC=0x10001138",
  "BL1_COPIED",
  "BL1_JUMP=0xc0000000",
  "PRE_JUMP",
  "GO!",
]
forbid = [
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "MANIFEST_ERR=0x00030002",
  "MANIFEST_ERR=0x0003000d",
  "MANIFEST_ERR=0x0003001c",
  "NO_BL1_IMAGE",
  "SBOOT_OFF",
  "SPI init failed, using backup manifest",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "MANIFEST_ERR=0x00030004" = 1, "OCA_BODY=0x00001000" = 2, "MFST_VER=0x00000000" = 2, "PUBK_SEL=0x00000000" = 1, "ENTROPY_OK" = 1, "RSA_EXEC" = 1, "RSA_VERIFY_OK" = 1, "MANIFEST_OK" = 1, "PAYLOAD_OK" = 1, "BL1_COPIED" = 1 }
expect_status = ["INFO 0x0212", "INFO 0x004c", "WARN 0x0007", "INFO 0x0212", "INFO 0x004c", "INFO 0x0053", "INFO 0x0055", "INFO 0x0054"]
forbid_status = ["ERROR 0x0007", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x40000], exact = 0 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
  { name = "backup_payload", range = [0x42000, 0x80000], min = 1 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_manifest", "backup_manifest", "backup_payload"]
markers = [
  "The subject is the backup's full validation chain after a primary refusal; the counts of PUBK_SEL=, ENTROPY_OK and RSA_EXEC put every crypto step in the backup attempt.",
  "Major 99 matches the DV member; any major above OCA_LIB_MANIFEST_MAJOR (1) reaches the same branch, and major 0 is accepted, not refused.",
  "Only the format-version leg of the primary refusal is planted; the length leg is covered by the primary-side length entries.",
  "This does not prove the backup's own field validation, only that a valid backup completes the boot after a primary header rejection.",
]

[[testcase]]
name = "sep_firmware_manifest_primary_missing_sepbl1_test"
family = "manifest_toc"
classification = "vp-equivalent"
image = "primary_missing_sepbl1"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "PASSED"
pytest_markers = ["needs_debug"]
# The last byte of the primary TOC entry type turns "OCAHSEP BLSTAGE1" into "...BLSTAGE2".
image_asserts = [
  { range = [0x202f, 0x2030], all = 0x32 },
  { range = [0x1ad7, 0x1af7], differs_from = "signed" },
  { range = [0x1e64, 0x1e84], differs_from = "signed" },
  { range = [0x0, 0x1ad7], same_as = "signed" },
  { range = [0x2030, "end"], same_as = "signed" },
]
expect = [
  "LC=PROD",
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "NO_BL1_IMAGE",
  "MANIFEST_ERR=0x00030102",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "LOAD=0xc0000000",
  "COPY_SRC=0x10001138",
  "BL1_COPIED",
  "BL1_JUMP=0xc0000000",
  "GO!",
]
forbid = [
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "BL1_ADDR_RANGE",
  "BL1_SRAM_EXEC_DISABLED",
  "BL1_SIZE",
  "BL1_ENTRY_RANGE",
  "PAYLOAD_LOC_FAIL",
  "SBOOT_OFF",
  "SPI init failed, using backup manifest",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "NO_BL1_IMAGE" = 1, "MANIFEST_ERR=0x00030102" = 1, "RSA_VERIFY_OK" = 2, "MANIFEST_OK" = 2, "PAYLOAD_OK" = 2, "BL1_COPIED" = 1, "COPY_SRC=0x10001138" = 1 }
expect_status = ["INFO 0x0212", "INFO 0x0053", "INFO 0x0055", "ERROR 0x0014", "INFO 0x0212", "INFO 0x0053", "INFO 0x0055", "INFO 0x0054"]
forbid_status = ["ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x40000], min = 1 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
  { name = "backup_payload", range = [0x42000, 0x80000], min = 1 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_manifest", "primary_payload", "backup_manifest", "backup_payload"]
markers = [
  "A repack, not a byte patch: the packer re-seals the TOC so payload_hash, the hash chain and the signature all verify, and only the BL1 lookup can refuse the slot.",
  "rom_bl1_check() runs inside the retry after PAYLOAD_OK, so a missing BL1 fails over instead of ending the boot; RSA_VERIFY_OK, MANIFEST_OK and PAYLOAD_OK each count 2.",
  "bl1_locate() reports ERROR 0x0014 even on a slot the backup recovers from; the failover fence is ERROR 0x0213, not every ERROR.",
  "SEPBL2 is pinned to match the DV member; type_matches() compares all 16 type bytes, so any other type reaches the same not-found branch.",
  "The mutated payload still holds exactly one entry, so this says nothing about a payload with several images and no BL1 among them.",
]

[[testcase]]
name = "sep_firmware_manifest_backup_missing_sepbl1_test"
family = "manifest_toc"
classification = "vp-equivalent"
image = "backup_missing_sepbl1"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "FAILED"
pytest_markers = ["needs_debug"]
# The backup type differs from BLSTAGE1 only in its 16th byte, so a type compare shorter than 16 bytes would boot it.
image_asserts = [
  { range = [0x1000, 0x1004], all = 0x99 },
  { range = [0x4202f, 0x42030], all = 0x32 },
  { range = [0x42020, 0x4202f], same_as = "signed" },
  { range = [0x41ad7, 0x41af7], differs_from = "signed" },
  { range = [0x41e64, 0x41e84], differs_from = "signed" },
  { range = [0x0, 0x1000], same_as = "signed" },
  { range = [0x1004, 0x41ad7], same_as = "signed" },
  { range = [0x42030, "end"], same_as = "signed" },
]
expect = [
  "LC=PROD",
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "MANIFEST_ERR=0x00030002",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "OCA_BODY=0x00001000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "NO_BL1_IMAGE",
  "MANIFEST_ERR=0x00030102",
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=0x00030102",
  "[VP] SIMULATION OF THE TEST FAILED",
]
forbid = [
  "BL1_ADDR_RANGE",
  "BL1_SRAM_EXEC_DISABLED",
  "BL1_SIZE",
  "BL1_ENTRY_RANGE",
  "DECRYPT_OK",
  "BL1_COPIED",
  "BL1_JUMP=",
  "PRE_JUMP",
  "GO!",
  "SBOOT_OFF",
  "[VP] SIMULATION OF THE TEST PASSED",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "MANIFEST_ERR=0x00030002" = 1, "MANIFEST_ERR=0x00030102" = 1, "OCA_BODY=0x00001000" = 1, "NO_BL1_IMAGE" = 1, "PUBK_AUTHORIZED" = 1, "RSA_EXEC" = 1, "MANIFEST_OK" = 1, "PAYLOAD_OK" = 1, "MANIFEST_ALL_FAILED" = 1 }
expect_status = ["INFO 0x0212", "WARN 0x0006", "INFO 0x0212", "INFO 0x004c", "INFO 0x0053", "INFO 0x0055", "ERROR 0x0014", "ERROR 0x0213"]
forbid_status = ["ERROR 0x0006", "INFO 0x0054"]
terminal_token = "MANIFEST_BOOT_FAIL=0x00030102"
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_peek", range = [0x1000, 0x1014], min = 1 },
  { name = "primary_rest", range = [0x1014, 0x40000], exact = 0 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
  { name = "backup_payload", range = [0x42000, 0x80000], min = 1 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_peek", "backup_manifest", "backup_payload"]
markers = [
  "The backup is a repack whose only TOC entry is typed OCAHSEP BLSTAGE2, the DV member's relabel; the packer re-seals it, so only the BL1 lookup can refuse the slot, and identifier, load_addr and image body stay those of the signed image.",
  "The primary is refused on a broken magic (0x00030002, before OCA_BODY=), the DV backup bases' default breaker; the DV member uses a package-identity mismatch instead, which needs an op and cannot follow a repack. The primary refusal is the means of reaching the backup, not the subject.",
  "0x000301xx codes skip the status_for_result() re-report, so the terminal status is ERROR 0x0014 from bl1_locate() followed by ERROR 0x0213, with no ERROR for the primary's WARN 0x0006.",
  "The FAILED verdict and terminal_token assert the halt; they do not prove the CPU stays in the WFI loop.",
]

[[testcase]]
name = "sep_firmware_manifest_primary_reordered_sepbl1_test"
family = "manifest_toc"
classification = "vp-equivalent"
image = "multi"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "PASSED"
pytest_markers = ["needs_debug"]
expect = [
  "LC=PROD",
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "LOAD=0xc0000000",
  "LEN=0x00000734",
  "ENTRY=0x00000000",
  "BL1_DST=ICCM",
  "COPY_SRC=0x100021d8",
  "COPY_DST=0xc0000000",
  "COPY_LEN=0x00000734",
  "BL1_COPIED",
  "BL1_JUMP=0xc0000000",
  "PRE_JUMP",
  "BL1",
  "GO!",
]
forbid = [
  "MANIFEST_ERR=",
  "MANIFEST_BACKUP",
  "MANIFEST_ALL_FAILED",
  "NO_BL1_IMAGE",
  "BL1_ADDR_RANGE",
  "BL1_SRAM_EXEC_DISABLED",
  "BL1_SIZE",
  "BL1_ENTRY_RANGE",
  "SBOOT_OFF",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_OK" = 1, "PAYLOAD_OK" = 1, "BL1_COPIED" = 1, "COPY_SRC=0x100021d8" = 1 }
expect_status = ["INFO 0x0212", "INFO 0x004c", "INFO 0x0053", "INFO 0x0055", "INFO 0x020e", "INFO 0x020f", "INFO 0x0054"]
forbid_status = ["ERROR 0x0014", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x390c], min = 1 },
  { name = "primary_tail", range = [0x390c, 0x40000], exact = 0 },
  { name = "backup", range = [0x40000, 0x80000], exact = 0 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_manifest", "primary_payload"]
markers = [
  "COPY_SRC is the discriminating assertion: the TOC is [BLMEMMAP, _VENDOR1, BLSTAGE1] over three copies of one binary, so a ROM that took entry 0 or 1 would still reach GO! but copy from 0x10001368 or 0x10001aa0.",
  "0x100021d8 is the staged payload base (SEP SRAM + the 4096-byte body, already 8-byte aligned) plus entry[2].offset 0x11d8, read from the packed TOC rather than from a run.",
  "Uses the prebuilt multi image as packed, as the DV member does; the image bodies stay in ascending offset order, so this exercises the type search, not an ordering rule.",
  "Nothing loads the BLMEMMAP or _VENDOR1 entries; this says nothing about their handling.",
]

[[testcase]]
name = "sep_firmware_manifest_backup_reordered_sepbl1_test"
family = "manifest_toc"
