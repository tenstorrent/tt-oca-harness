  "Major 2 matches the DV member; any major above OCA_LIB_MANIFEST_MAJOR (1) reaches the same branch, and major 0 is accepted, not refused.",
  "OCA_BODY= counts 2 and PUBK_AUTHORIZED 1, so the primary read its body and was refused before key selection.",
  "The backup is byte-identical to the signed image, so the boot that follows is the healthy fallback rather than a second damaged image.",
]

