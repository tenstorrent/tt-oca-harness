# A PROD part whose unsigned primary carries a BL1 enable bit without its VALID bit, which must be ignored.
base = "signed"
ops = [
  { op = "set_demotion", slot = "primary", args = { bl1_valid = false, bl1_enable = true, bl2_valid = false, bl2_enable = false } },
  { op = "set_lifecycle_constraint", slot = "primary", args = { allowed = 0x2, level = "chiplet" } },
  { op = "clear_secure_boot", slot = "primary" },
  { op = "set_lifecycle_constraint", slot = "backup", args = { allowed = 0x2, level = "chiplet" } },
]
