# Breaks the primary magic so the ROM fails over, and sets the resealed backup encrypted TOC
# major_version to 2.
base = "encrypted"
ops = [
  { op = "set_toc_version_major", slot = "backup", args = { value = 2 } },
]
patch = [
  { offset = 0x1000, le = 0x99999999, size = 4 },
]
