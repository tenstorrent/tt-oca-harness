# A v1.0 backup one word above the body size behind a primary with a broken magic.
base = "signed"
ops = [
  { op = "set_manifest_length", slot = "backup", args = { value = 4100 } },
]
patch = [
  { field = "OFF_BOOT_MANIFEST_MAGIC", slot = "primary", le = 0x99999999, size = 4 },
]
