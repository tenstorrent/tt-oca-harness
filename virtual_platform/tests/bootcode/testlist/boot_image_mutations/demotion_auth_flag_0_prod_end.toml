# A PROD_END part given a BL1 enable bit without its VALID bit, which the lifecycle must preempt.
base = "signed"
ops = [
  { op = "set_demotion", slot = "primary", args = { bl1_valid = false, bl1_enable = true, bl2_valid = false, bl2_enable = false } },
  { op = "set_lifecycle_constraint", slot = "primary", args = { allowed = 0x4, level = "chiplet" } },
  { op = "set_lifecycle_constraint", slot = "backup", args = { allowed = 0x4, level = "chiplet" } },
]
