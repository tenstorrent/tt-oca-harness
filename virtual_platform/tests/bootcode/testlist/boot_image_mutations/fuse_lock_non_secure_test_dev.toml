# Narrows both slots' lifecycle constraint to TEST_DEV state, then makes them validly unsigned.
base = "signed"
ops = [
  { op = "set_lifecycle_constraint", slot = "primary", args = { allowed = 0x1, level = "chiplet" } },
  { op = "clear_secure_boot", slot = "primary" },
  { op = "set_lifecycle_constraint", slot = "backup", args = { allowed = 0x1, level = "chiplet" } },
  { op = "clear_secure_boot", slot = "backup" },
]
