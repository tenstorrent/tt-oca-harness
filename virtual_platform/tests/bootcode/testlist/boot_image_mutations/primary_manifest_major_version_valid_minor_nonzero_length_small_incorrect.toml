# A v1.1 primary whose manifest_length is one word below the classic body size.
base = "signed"
ops = [
  { op = "set_manifest_version", slot = "primary", args = { minor = 1 } },
  { op = "set_manifest_length", slot = "primary", args = { value = 4092 } },
]
