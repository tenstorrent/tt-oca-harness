# Encrypted backup TOC image_count overruns the plaintext, resealed; the primary magic is broken.
base = "encrypted"
ops = [
  { op = "set_toc_image_count", slot = "backup", args = { value = 257 } },
]
patch = [
  { offset = 0x1000, le = 0x99999999, size = 4 },
]
