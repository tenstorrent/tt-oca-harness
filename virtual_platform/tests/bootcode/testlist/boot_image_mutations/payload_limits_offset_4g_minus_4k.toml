# Both slots: payload_offset 0xFFFFF000 and a re-signed payload_length 0x2000.
base = "signed"
ops = [
  { op = "declare_payload_length", slot = "primary", args = { payload_length = 0x2000 } },
  { op = "declare_payload_length", slot = "backup", args = { payload_length = 0x2000 } },
]
patch = [
  { field = "OFF_PAYLOAD_OFFSET", slot = "primary", le = 0xFFFFF000, size = 8 },
  { field = "OFF_PAYLOAD_OFFSET", slot = "backup", le = 0xFFFFF000, size = 8 },
]
