# Breaks the primary magic so the ROM fails over, and gives the re-signed backup a
# security_version that omits device flags, so the backup is refused on rollback.
base = "signed"
ops = [
  { op = "set_security_version", slot = "backup", args = { value = 3 } },
]
patch = [
  { offset = 0x1000, le = 0x99999999, size = 4 },
]
