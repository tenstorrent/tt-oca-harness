# A v1.1 classic backup declaring the PQC body size behind a primary with a broken magic.
base = "signed"
ops = [
  { op = "set_manifest_version", slot = "backup", args = { minor = 1 } },
  { op = "set_manifest_length", slot = "backup", args = { value = 36864 } },
]
patch = [
  { field = "OFF_BOOT_MANIFEST_MAGIC", slot = "primary", le = 0x99999999, size = 4 },
]
