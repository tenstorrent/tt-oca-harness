# Stores the primary non-encrypted TOC in descending offset order with no overlap and reseals the
# slot, so the payload breaks no TOC rule.
base = "multi"
ops = [
  { op = "permute_toc_entries", slot = "primary", args = { order = [2, 1, 0] } },
]
