# Both slots: payload_offset and a re-signed payload_length of 0x80000000 each.
base = "signed"
ops = [
  { op = "declare_payload_length", slot = "primary", args = { payload_length = 0x80000000 } },
  { op = "declare_payload_length", slot = "backup", args = { payload_length = 0x80000000 } },
]
patch = [
  { field = "OFF_PAYLOAD_OFFSET", slot = "primary", le = 0x80000000, size = 8 },
  { field = "OFF_PAYLOAD_OFFSET", slot = "backup", le = 0x80000000, size = 8 },
]
