# Backup TOC entry 0 starts inside the TOC, resealed; the primary magic is broken.
base = "signed"
ops = [
  { op = "set_toc_entry_offset", slot = "backup", args = { index = 0, value = 240 } },
]
patch = [
  { offset = 0x1000, le = 0x99999999, size = 4 },
]
