# Moves the re-sealed primary BL1 into SEP SRAM so that it runs one word past the end of SEP SRAM; the backup is unchanged.
base = "signed"
ops = [
  { op = "set_bl1_load_end", slot = "primary", args = { end = 0x10040004 } },
]
