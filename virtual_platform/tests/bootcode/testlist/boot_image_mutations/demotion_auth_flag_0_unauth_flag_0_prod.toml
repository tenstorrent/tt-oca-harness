# A PROD part whose unsigned primary requests BL2 demotion with no BL1 decision, the only unlocked row.
base = "signed"
ops = [
  { op = "set_demotion", slot = "primary", args = { bl1_valid = false, bl1_enable = true, bl2_valid = true, bl2_enable = true } },
  { op = "set_lifecycle_constraint", slot = "primary", args = { allowed = 0x2, level = "chiplet" } },
  { op = "clear_secure_boot", slot = "primary" },
  { op = "set_lifecycle_constraint", slot = "backup", args = { allowed = 0x2, level = "chiplet" } },
]
