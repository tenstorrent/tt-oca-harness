# A PROD part whose unsigned primary asks BL0 to demote and lock DEMOTE_1.
base = "signed"
ops = [
  { op = "set_demotion", slot = "primary", args = { bl1_valid = true, bl1_enable = true, bl2_valid = false, bl2_enable = false } },
  { op = "set_lifecycle_constraint", slot = "primary", args = { allowed = 0x2, level = "chiplet" } },
  { op = "clear_secure_boot", slot = "primary" },
  { op = "set_lifecycle_constraint", slot = "backup", args = { allowed = 0x2, level = "chiplet" } },
]
