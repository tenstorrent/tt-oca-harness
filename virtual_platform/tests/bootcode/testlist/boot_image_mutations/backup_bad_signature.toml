# Breaks the primary magic to force failover, and flips one bit of the backup signature.
base = "signed"
patch = [
  { fill = [0x1000, 0x1004], value = 0x99 },
  { field = "OFF_SIGNATURE_CLASSIC", slot = "backup", xor = 0x01 },
]
