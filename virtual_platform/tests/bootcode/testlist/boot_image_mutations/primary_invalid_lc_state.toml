# Enables the primary's chiplet lifecycle constraint with every token except PROD, the
# live state under base_ini secure, and reseals the slot so the ROM reaches the check.
base = "signed"
ops = [
  { op = "set_lifecycle_constraint", slot = "primary", args = { allowed = 0x7D, level = "chiplet" } },
]
