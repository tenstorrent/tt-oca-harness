expect_status = ["INFO 0x0053", "WARN 0x007a", "INFO 0x0053", "WARN 0x007a", "ERROR 0x007a", "ERROR 0x0213"]
forbid_status = ["INFO 0x0055"]
terminal_token = "MANIFEST_BOOT_FAIL=0x0003001b"
