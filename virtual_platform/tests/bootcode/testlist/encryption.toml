  "KDF_HMAC_FAIL",
  "AES_DEC_FAIL",
  "DECRYPT_CLASS_KEY_EMPTY",
  "DECRYPT_NO_SECRET",
  "RSA_PKCS1_FAIL",
  "MANIFEST_ERR=0x00030012",
  "MANIFEST_ERR=0x00030014",
  "MANIFEST_ERR=0x00030015",
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
]
