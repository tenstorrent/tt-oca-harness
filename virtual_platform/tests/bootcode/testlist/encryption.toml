]
spi_read_order = ["primary_manifest", "primary_payload", "backup_manifest", "backup_payload"]
markers = [
  "KDF input byte 0 flipped as DV does; the derivation succeeds on a wrong context and the wrong key leaves an invalid PKCS#7 pad, so the primary ends at AES_PAD_BAD and OCA_FAIL_DECRYPT before DECRYPT_OK.",
  "The op re-signs over the new KDF input, so RSA_VERIFY_OK twice shows the refusal followed authentication.",
  "The backup is the encrypted golden slot and decrypts in the same run; DECRYPT_OK once is the backup's, and INFO 0x0040 twice shows both slots entered decryption.",
]

[[testcase]]
name = "sep_decryption_failure_terminal_test"
tp_id = "TP049"
family = "encryption"
classification = "partial"
image = "encrypted_both_slots_bad_toc_image_count"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "FAILED"
pytest_markers = ["needs_debug"]
efuse = { class_key = [0x03020100, 0x07060504, 0x0b0a0908, 0x0f0e0d0c, 0x13121110, 0x17161514, 0x1b1a1918, 0x1f1e1d1c] }
image_asserts = [
  { range = [0x1ad7, 0x1af7], differs_from = "encrypted" },
  { range = [0x2010, 0x2020], differs_from = "encrypted" },
  { range = [0x41ad7, 0x41af7], differs_from = "encrypted" },
  { range = [0x42010, 0x42020], differs_from = "encrypted" },
  { range = [0x0, 0x1ad7], same_as = "encrypted" },
  { range = [0x1af7, 0x1c64], same_as = "encrypted" },
  { range = [0x1de4, 0x1e64], same_as = "encrypted" },
  { range = [0x1e84, 0x2010], same_as = "encrypted" },
  { range = [0x2870, 0x41ad7], same_as = "encrypted" },
  { range = [0x41af7, 0x41c64], same_as = "encrypted" },
  { range = [0x41de4, 0x41e64], same_as = "encrypted" },
  { range = [0x41e84, 0x42010], same_as = "encrypted" },
  { range = [0x42870, "end"], same_as = "encrypted" },
]
expect = [
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "PUBK_AUTHORIZED",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "DECRYPT_OK",
  "MANIFEST_ERR=0x00030015",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "PUBK_AUTHORIZED",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "DECRYPT_OK",
  "MANIFEST_ERR=0x00030015",
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=0x00030015",
  "[VP] SIMULATION OF THE TEST FAILED",
]
forbid = [
  "AES_PAD_BAD",
  "AES_DEC_FAIL",
  "KDF_FAIL",
  "KDF_HMAC_FAIL",
  "DECRYPT_CLASS_KEY_EMPTY",
  "DECRYPT_NO_SECRET",
  "RSA_PKCS1_FAIL",
  "MANIFEST_ERR=0x00030012",
  "MANIFEST_ERR=0x00030013",
  "MANIFEST_ERR=0x00030014",
  "MANIFEST_ERR=0x0003001a",
  "PAYLOAD_OK",
  "COPY_DST=",
  "BL1_COPIED",
  "BL1_JUMP=",
  "PRE_JUMP",
  "GO!",
  "[VP] SIMULATION OF THE TEST PASSED",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "RSA_VERIFY_OK" = 2, "MANIFEST_OK" = 2, "DECRYPT_OK" = 2, "MANIFEST_ERR=0x00030015" = 2, "MANIFEST_ALL_FAILED" = 1, "MANIFEST_BOOT_FAIL=0x00030015" = 1 }
terminal_token = "MANIFEST_BOOT_FAIL=0x00030015"
expect_status = [
  "INFO 0x0040",
  "INFO 0x0042",
  "WARN 0x000f",
  "INFO 0x0040",
  "INFO 0x0042",
  "WARN 0x000f",
  "ERROR 0x000f",
  "ERROR 0x0213",
]
forbid_status = ["INFO 0x0055"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x40000], min = 1 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
  { name = "backup_payload", range = [0x42000, 0x80000], min = 1 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_manifest", "primary_payload", "backup_manifest", "backup_payload"]
markers = [
  "Variant (b) only: each slot decrypts cleanly and the plaintext TOC is refused, so the boot ends after both slots; an AES engine status error is not reachable without forcing it.",
  "DV flips ciphertext byte 0, which garbles block 0 and turns image_count 1 into 254; corrupt_ciphertext is not a whitelisted op, so the spec plants image_count 254 in the plaintext and re-encrypts instead. Both reach read_toc_span() with the same count.",
  "The planted plaintext cannot be pinned in the image because CBC diffuses it; host-side decryption of both slots shows only plaintext byte 16 changed, to 0xFE.",
  "payload_hash is refreshed over the new ciphertext and the chain is left stale on purpose; read_toc_span() refuses the count before the chain is compared, which MANIFEST_ERR=0x00030014 forbidden confirms.",
]
