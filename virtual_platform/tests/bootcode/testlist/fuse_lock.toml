  { name = "backup_and_beyond", range = [0x40000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_manifest", "primary_payload"]
markers = [
  "The manifest's enforced bit settles secure boot; at PROD the lifecycle agrees but is never consulted.",
  "Encrypted where DV packs cleartext: plat_decrypt_payload() reads CLASS_KEY inside the slot attempt, before lock_fuse_secrets(), so this cell fails if the lock ever moves ahead of the only secret read in BL0.",
  "Not covered: that the fuse bits are physically unwritable or that the lock survives reset; that is eFuse IP scope.",
]

