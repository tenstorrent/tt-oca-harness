[[testcase]]
name = "sep_firmware_payload_incorrect_ext_62kb_test"
family = "payload_size"
classification = "vp-equivalent"
image = "payload_ext_over_capacity_min"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "PASSED"
pytest_markers = ["needs_debug"]
image_asserts = [
  { field = { name = "OFF_PAYLOAD_LENGTH", slot = "primary", size = 8, value = 0x3F400 } },
  { range = [0x1b90, 0x1b98], differs_from = "signed" },
  { range = [0x0, 0x1b90], same_as = "signed" },
  { range = [0x1b98, 0x1c64], same_as = "signed" },
  { range = [0x1de4, 0x1e64], same_as = "signed" },
  { range = [0x1e84, "end"], same_as = "signed" },
]
expect = [
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_LOC_FAIL",
  "MANIFEST_ERR=0x0003001b",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "BL1_COPIED",
  "BL1_JUMP=0xc0000000",
  "GO!",
]
forbid = [
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "PAYLOAD_TOO_LARGE",
  "FLASH_READ_OOB",
  "NO_BL1_IMAGE",
  "MANIFEST_ERR=0x00030101",
  "MANIFEST_ERR=0x00030106",
  "MANIFEST_ERR=0x00030012",
  "MANIFEST_ERR=0x00030015",
  "SBOOT_OFF",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "PAYLOAD_LOC_FAIL" = 1, "MANIFEST_ERR=0x0003001b" = 1, "RSA_EXEC" = 2, "RSA_VERIFY_OK" = 2, "MANIFEST_OK" = 2, "PAYLOAD_OK" = 1 }
expect_status = ["INFO 0x0053", "WARN 0x007a", "INFO 0x0053", "INFO 0x0055"]
forbid_status = ["ERROR 0x007a", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], exact = 18 },
  { name = "primary_payload", range = [0x2000, 0x40000], exact = 0 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], exact = 18 },
  { name = "backup_payload", range = [0x42000, 0x80000], exact = 10 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_manifest", "backup_manifest", "backup_payload"]
markers = [
  "Matches DV sep_firmware_payload_exceeds_slot_window_fixed_test: 0x3F400 is one KiB past the DV capacity 0x3F000 (SEP SRAM less the body), not the 62 KiB the legacy name states.",
  "payload_length sits in the signed region, so declare_payload_length re-signs the primary; the slot passes RSA and oca_locate_payload refuses it on the region bound before any payload read.",
  "Follows DV PayloadSizeRefusedTest: the oversized primary fails over to the backup, with no rotate_update; the TOC still holds the shipped 2156-byte length, which the ROM would check only after staging.",
  "PAYLOAD_TOO_LARGE (0x00030101) cannot fire on the SPI path, because the slot window (at most 0x3E000 payload bytes) is tighter than the SEP SRAM staging room (0x3EFF8); it stays forbidden.",
]

