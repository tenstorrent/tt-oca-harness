[[testcase]]
name = "sep_firmware_payload_correct_ext_4kb_test"
family = "payload_size"
classification = "vp-equivalent"
image = "payload_ext_4kb"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "PASSED"
pytest_markers = ["needs_debug"]
# The fill between the one-entry TOC, which ends at payload 0x138, and BL1 is zero.
image_asserts = [
  { field = { name = "OFF_PAYLOAD_LENGTH", slot = "primary", size = 8, value = 4092 } },
  { field = { name = "OFF_PAYLOAD_LENGTH", slot = "backup", size = 8, value_from = { image = "toc_cap" } } },
  { toc_field = { name = "OFF_TOC_ENTRY_OFFSET", slot = "primary", entry = 0, size = 8, value = "4092 - primary.bl1_len" } },
  { toc_field = { name = "OFF_TOC_ENTRY_LENGTH", slot = "primary", entry = 0, size = 8, value_from = { image = "toc_cap", entry = 0 } } },
  { range = [0x2138, "primary.bl1_start"], all = 0x00 },
  { range = [0x2ffc, 0x40000], all = 0xFF },
  { range = [0x2038, 0x203b], differs_from = "toc_cap" },
  { range = [0x0, 0x1000], same_as = "toc_cap" },
  { range = [0x40000, "end"], same_as = "toc_cap" },
]
expect = [
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "OCA_BODY=0x00001000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "LOAD=0xc0000000",
  "LEN={primary.bl1_len}",
  "COPY_SRC={primary.bl1_copy_src}",
  "COPY_LEN={primary.bl1_copy_len}",
  "BL1_COPIED",
  "BL1_JUMP=0xc0000000",
  "GO!",
]
forbid = [
  "MANIFEST_BACKUP",
  "MANIFEST_ERR=",
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "PAYLOAD_LOC_FAIL",
  "PAYLOAD_TOO_LARGE",
  "FLASH_READ_OOB",
  "NO_BL1_IMAGE",
  "BL1_ADDR_RANGE",
  "SBOOT_OFF",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_OK" = 1, "PAYLOAD_OK" = 1, "COPY_SRC={primary.bl1_copy_src}" = 1, "BL1_COPIED" = 1 }
expect_status = ["INFO 0x004c", "INFO 0x0053", "INFO 0x0055", "INFO 0x0054"]
forbid_status = ["WARN 0x007a", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], exact = 18 },
  { name = "primary_payload", range = [0x2000, 0x2ffc], exact = 17 },
  { name = "primary_tail", range = [0x2ffc, 0x40000], exact = 0 },
  { name = "backup", range = [0x40000, 0x80000], exact = 0 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_manifest", "primary_payload"]
markers = [
  "The payload is 4092 bytes, 4 short of 4 KiB: the packer ends the payload at BL1 and entry offsets must be 8-aligned, so with a BL1 of 4 mod 8 bytes 4096 is not reachable, and the packer refuses the repack if BL1 ever breaks that; DV writes exactly 4096 with repack_payload, which is not a whitelisted op.",
  "The repack moves BL1 behind a zero fill to the TOC entry offset that ends it at 4092, so COPY_SRC (SEP SRAM payload 0x10001000 + that offset) shows the ROM located BL1 from the TOC entry rather than the shipped offset 312.",
  "The read count is derived from ot_dma_read_once: 16-byte-aligned bulk in 256-byte DMA segments plus one PIO read for the 12-byte remainder; primary_tail exact 0 shows the fetch stopped at payload_length.",
  "Built from the oca_toc_cap_boot packer config, the only one that declares payload_images.0.offset; its backup slot is the unchanged TOC-cap bundle and is never read.",
  "DV places BL1 right after the TOC and zero-fills the rest; here the fill precedes BL1. Both make payload_hash cover bytes outside the TOC and the image, so a short fetch fails either way.",
]

