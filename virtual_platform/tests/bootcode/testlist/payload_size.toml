[[testcase]]
name = "sep_firmware_payload_correct_smc_64kb_test"
family = "payload_size"
classification = "retired"
reason = "The OCA ROM has no manifest-selected SMC SRAM staging: try_manifest_slot always stages the payload in SEP SRAM and never reads the SEP-safe window in SMC scratch 13/14; DV keeps these modules unregistered in rom_fw.toml."

