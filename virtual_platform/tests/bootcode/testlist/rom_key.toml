  { range = [0x1c64, 0x1de4], differs_from = "signed" },
  { range = [0x1e64, 0x1e84], differs_from = "signed" },
  { range = [0x0, 0x1838], same_as = "signed" },
  { range = [0x1840, 0x1c64], same_as = "signed" },
  { range = [0x1de4, 0x1e64], same_as = "signed" },
  { range = [0x1e84, "end"], same_as = "signed" },
]
expect = [
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "OCA_BODY=0x00001000",
  "PUBK_SEL_AMBIGUOUS",
  "MANIFEST_ERR=0x00030023",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "PUBK_SEL=0x00000000",
  "PUBK_AUTHORIZED",
  "PUBK_REVOKE=0x00000000",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "BL1_COPIED",
  "GO!",
]
forbid = [
  "PUBK_SEL=0x00000001",
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "SBOOT_OFF",
  "PUBK_NO_SIGNATURE",
  "PUBK_ALGO_UNSUPPORTED",
  "PUBK_SEL_EMPTY",
  "PUBK_SLOT_RESERVED",
  "PUBK_SLOT_UNPROVISIONED",
  "PUBK_SLOT_PQC_UNSUPPORTED",
  "PUBK_OTP_EMPTY",
  "PUBK_UNAUTHORIZED",
  "PUBK_HASH_TIMEOUT",
  "RSA_PKCS1_FAIL",
  "[VP] SIMULATION OF THE TEST FAILED",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "PUBK_SEL_AMBIGUOUS" = 1, "MANIFEST_ERR=0x00030023" = 1, "PUBK_SEL=0x00000000" = 1, "PUBK_AUTHORIZED" = 1, "PUBK_REVOKE=0x00000000" = 1, "RSA_EXEC" = 1, "MANIFEST_OK" = 1 }
expect_status = ["INFO 0x0212", "INFO 0x004c", "WARN 0x000d", "INFO 0x0212", "INFO 0x004c", "INFO 0x0053", "INFO 0x0055"]
forbid_status = ["ERROR 0x000d", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x40000], exact = 0 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
  { name = "backup_payload", range = [0x42000, 0x80000], min = 1 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = [
  "primary_manifest",
  "backup_manifest",
  "backup_payload",
]
markers = [
  "plat_is_key_authorized refuses a bitmap naming two slots before it echoes one, so PUBK_SEL=0x00000000 exactly once, after MANIFEST_BACKUP, is the backup's and the primary resolved nothing.",
  "0x00030023 is shared by every key-authorization refusal; PUBK_SEL_AMBIGUOUS is the discriminator and PUBK_SLOT_RESERVED is forbidden.",
  "The packer re-signs the primary, so a stale signature cannot be the cause; the refusal precedes the verifier either way.",
  "Slots 0 and 1 only, matching DV; wider ambiguous bitmaps are not swept.",
]

[[testcase]]
name = "sep_firmware_backup_invalid_public_key_selection_test"
