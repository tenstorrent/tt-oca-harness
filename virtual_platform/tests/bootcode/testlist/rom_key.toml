expect_verdict = "FAILED"
pytest_markers = ["needs_debug"]
image_asserts = [
  { range = [0x1000, 0x1004], all = 0x99 },
  { range = [0x1000, 0x1004], differs_from = "signed" },
  { range = [0x0, 0x1000], same_as = "signed" },
  { field = { name = "OFF_PUBLIC_KEY_SELECT_CLASSIC", slot = "backup", size = 8, value = 0x3 } },
  { range = [0x41c64, 0x41de4], differs_from = "signed" },
  { range = [0x41e64, 0x41e84], differs_from = "signed" },
  { range = [0x1004, 0x41838], same_as = "signed" },
  { range = [0x41840, 0x41c64], same_as = "signed" },
  { range = [0x41de4, 0x41e64], same_as = "signed" },
  { range = [0x41e84, "end"], same_as = "signed" },
]
expect = [
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "MANIFEST_ERR=0x00030002",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "OCA_BODY=0x00001000",
  "MFST_VER=0x00000000",
  "PUBK_SEL_AMBIGUOUS",
  "MANIFEST_ERR=0x00030023",
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=0x00030023",
  "[VP] SIMULATION OF THE TEST FAILED",
]
forbid = [
  "PUBK_SEL=",
  "PUBK_AUTHORIZED",
  "PUBK_REVOKE=",
  "FUSE_VER=",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "PUBK_NO_SIGNATURE",
  "PUBK_ALGO_UNSUPPORTED",
  "PUBK_SEL_EMPTY",
  "PUBK_SLOT_RESERVED",
  "PUBK_SLOT_UNPROVISIONED",
  "PUBK_SLOT_PQC_UNSUPPORTED",
  "PUBK_OTP_EMPTY",
  "PUBK_UNAUTHORIZED",
  "PUBK_HASH_TIMEOUT",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "BL1_COPIED",
  "BL1_JUMP=",
  "PRE_JUMP",
  "GO!",
  "[VP] SIMULATION OF THE TEST PASSED",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "MANIFEST_ERR=0x00030002" = 1, "OCA_BODY=0x00001000" = 1, "PUBK_SEL_AMBIGUOUS" = 1, "MANIFEST_ERR=0x00030023" = 1, "MANIFEST_ALL_FAILED" = 1 }
terminal_token = "MANIFEST_BOOT_FAIL=0x00030023"
expect_status = ["INFO 0x0212", "WARN 0x0006", "INFO 0x0212", "INFO 0x004c", "WARN 0x000d", "ERROR 0x000d", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_peek", range = [0x1000, 0x1014], min = 1 },
  { name = "primary_rest", range = [0x1014, 0x40000], exact = 0 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
  { name = "backup_payload", range = [0x42000, 0x80000], exact = 0 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = [
  "primary_peek",
  "backup_manifest",
]
markers = [
  "No PUBK_SEL= line at all: the primary dies at the peek and the backup's two-slot bitmap is refused before a slot is echoed.",
  "PUBK_SEL_AMBIGUOUS separates this from every other 0x00030023 refusal; the status ring reports all of them as INVALID_KEY_HASH (0x000d).",
  "The hang is asserted by terminal_token and the FAILED verdict; it does not prove the CPU stays in the WFI loop.",
]

