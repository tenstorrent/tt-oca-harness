  "PUBK_REVOKE=0x00000000 exactly once, after the backup read, shows the reserved-slot bound stopped the primary before the revocation read.",
  "PUBK_SLOT_RESERVED is the discriminator; PUBK_SEL_AMBIGUOUS shares 0x00030023 and is forbidden.",
  "One boundary value only; slots 27 to 127 and the reserved ROM slots 6 and 7 are not swept.",
]

