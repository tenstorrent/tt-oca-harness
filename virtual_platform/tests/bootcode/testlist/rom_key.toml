[[testcase]]
name = "sep_firmware_primary_rom_key_valid_test"
family = "rom_key"
classification = "partial"
image = "signed"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "PASSED"
pytest_markers = ["needs_debug"]
# Byte-identical to sep_firmware_primary_pubkey_rom_0_revoked_key_test; only the fuse differs.
efuse = { chiplet_pubk_revoke = 0 }
image_asserts = [
  { field = { name = "OFF_PUBLIC_KEY_SELECT_CLASSIC", slot = "primary", size = 8, value = 0x1 } },
  { range = [0x0, "end"], same_as = "signed" },
]
expect = [
  "LC=PROD",
  "FUSE: SBOOT_DIS: 0",
  "BOOT_SPI",
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "OCA_BODY=0x00001000",
  "MFST_VER=0x00000000",
  "PUBK_SEL=0x00000000",
  "PUBK_AUTHORIZED",
  "PUBK_REVOKE=0x00000000",
  "FUSE_VER=0x00000000",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "FUSE_VER=0x00000000",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "BL1_COPIED",
  "BL1_JUMP=0xc0000000",
  "GO!",
]
forbid = [
  "MANIFEST_ERR=",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "SBOOT_OFF",
  "FUSE: SBOOT_DIS: 1",
  "PUBK_NO_SIGNATURE",
  "PUBK_ALGO_UNSUPPORTED",
  "PUBK_SEL_EMPTY",
  "PUBK_SEL_AMBIGUOUS",
  "PUBK_SLOT_RESERVED",
  "PUBK_SLOT_UNPROVISIONED",
  "PUBK_SLOT_PQC_UNSUPPORTED",
  "PUBK_OTP_EMPTY",
  "PUBK_UNAUTHORIZED",
  "PUBK_HASH_TIMEOUT",
  "RSA_PKCS1_FAIL",
  "RSA_EXEC_FAIL",
  "[VP] SIMULATION OF THE TEST FAILED",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "PUBK_SEL=0x00000000" = 1, "PUBK_AUTHORIZED" = 1, "PUBK_REVOKE=0x00000000" = 1, "FUSE_VER=0x00000000" = 2, "RSA_EXEC" = 1, "RSA_VERIFY_OK" = 1, "MANIFEST_OK" = 1 }
expect_status = ["INFO 0x0212", "INFO 0x004c", "INFO 0x0053", "INFO 0x0055"]
forbid_status = ["WARN 0x000c", "WARN 0x000d", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x40000], min = 1 },
  { name = "backup", range = [0x40000, 0x80000], exact = 0 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = [
  "primary_manifest",
  "primary_payload",
]
markers = [
  "PUBK_SEL, PUBK_AUTHORIZED and PUBK_REVOKE each exactly once, before RSA_EXEC, show key selection ran on the primary; the boot alone does not.",
  "The backup exact-0 span is the device-side proof that no silent failover served the boot.",
  "Slot 0 only; slots 1 to 5 are exercised by the revocation family, each with its own shipped key.",
  "PIO drain only; DV runs this case on the SECURE_DMA path.",
]

