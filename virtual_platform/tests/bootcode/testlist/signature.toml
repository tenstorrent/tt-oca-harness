  "PUBK_SEL_AMBIGUOUS",
  "PUBK_SEL_EMPTY",
  "PUBK_SLOT_RESERVED",
  "PUBK_SLOT_PQC_UNSUPPORTED",
  "PUBK_SLOT_UNPROVISIONED",
  "PUBK_OTP_EMPTY",
  "PUBK_UNAUTHORIZED",
  "PUBK_HASH_TIMEOUT",
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "SBOOT_OFF",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "PUBK_AUTHORIZED" = 2, "RSA_EXEC" = 2, "RSA_PKCS1_FAIL" = 1, "RSA_VERIFY_OK" = 1, "MANIFEST_ERR=0x0003000e" = 1, "MANIFEST_OK" = 1, "PAYLOAD_OK" = 1 }
expect_status = ["INFO 0x004c", "WARN 0x000e", "INFO 0x004c", "INFO 0x0053", "INFO 0x0055"]
forbid_status = ["ERROR 0x000e", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x40000], exact = 0 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
  { name = "backup_payload", range = [0x42000, 0x80000], min = 1 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_manifest", "backup_manifest", "backup_payload"]
markers = [
  "PUBK_AUTHORIZED and RSA_EXEC twice place the primary's refusal at the verifier: the key was anchored and the modexp ran before RSA_PKCS1_FAIL.",
  "0x0003000e is also returned by the primitive, encoding, size and exponent arms of plat_verify_signature; RSA_PKCS1_FAIL is what names the PKCS#1 comparison.",
  "One bit of signature byte 0, outside the hashed region, so manifest_hash still matches; positions are not swept.",
  "SEP_MSG_INVALID_SIGNATURE reaches the status stream as WARN 0x000e through status_for_result.",
]

