markers = [
  "The primary is repacked and signed with a generated RSA-3072 key whose modulus digest is in no ROM slot, so it is self-consistent and only the root-key bind can refuse it; DV flips one modulus bit instead.",
  "RSA_EXEC once and PUBK_REVOKE= once show the primary was refused before revocation and before the verifier.",
  "Every plat_is_key_authorized refusal returns 0x00030023; PUBK_UNAUTHORIZED names the digest comparison.",
  "Not covered: the OTP-digest arm; the selector stays ROM slot 0.",
]

