  "OCA_BODY=0x00001000",
  "PUBK_SEL=0x00000000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_CMP1",
  "RSA_CMP2",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "BL1_COPIED",
  "GO!",
]
forbid = [
  "RSA_PKCS1_FAIL",
  "RSA_EXEC_FAIL",
  "RSA_INOUT_UNCHANGED",
  "RSA_OTBN_INIT_FAIL",
  "RSA_OTBN_LOAD_FAIL",
  "OTBN_RST_FAIL",
  "OTBN_ERR=",
  "PUBK_UNAUTHORIZED",
  "MANIFEST_BACKUP",
  "MANIFEST_ERR=",
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "SBOOT_OFF",
  "TRAP H0",
]
expect_counts = { "RSA_EXEC" = 1, "RSA_CMP1" = 1, "RSA_CMP2" = 1, "RSA_VERIFY_OK" = 1, "MANIFEST_PRIMARY" = 1, "MANIFEST_OK" = 1, "PAYLOAD_OK" = 1, "GO!" = 1 }
expect_status = ["INFO 0x004c", "DEBUG 0x0204", "INFO 0x0053", "INFO 0x0055"]
forbid_status = ["ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x40000], min = 1 },
  { name = "backup", range = [0x40000, 0x80000], exact = 0 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_manifest", "primary_payload"]
markers = [
  "Partial: the comparison repeats and both passes must succeed, but no random delay separates them.",
  "RSA_EXEC once with RSA_CMP1 and RSA_CMP2 once each pins the reading that only the comparison repeats over one modexp result.",
  "The counts are per verified slot; MANIFEST_BACKUP forbidden and no backup-span read keep this a single-slot boot.",
  "The tokens are the firmware's own report, not an independent witness of the two DMEM reads; no fault is injected.",
  "Runs the golden image and adds assertions, so the audit reports it as sharing the golden stimulus.",
]
