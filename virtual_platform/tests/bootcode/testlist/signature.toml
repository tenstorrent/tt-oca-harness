# Signature-path refusals: declared type, signature value and root-key digest, plus the
# redundant PKCS#1 comparison on a clean boot.

[[testcase]]
name = "sep_firmware_primary_invalid_signature_type_test"
family = "signature"
classification = "vp-equivalent"
image = "primary_invalid_signature_type"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "PASSED"
pytest_markers = ["needs_debug"]
image_asserts = [
  { field = { name = "OFF_SIGNATURE_TYPE_CLASSIC", slot = "primary", size = 1, value = 0 } },
  { field = { name = "OFF_SIGNATURE_TYPE_CLASSIC", slot = "backup", size = 1, value = 1 } },
  { range = [0x182c, 0x182d], differs_from = "signed" },
  { range = [0x0, 0x182c], same_as = "signed" },
  { range = [0x182d, 0x1c64], same_as = "signed" },
  { range = [0x1de4, 0x1e64], same_as = "signed" },
  { range = [0x1e84, "end"], same_as = "signed" },
]
expect = [
  "LC=PROD",
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "OCA_BODY=0x00001000",
  "MANIFEST_ERR=0x00030022",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "PUBK_SEL=0x00000000",
  "PUBK_AUTHORIZED",
  "RSA_EXEC",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "BL1_COPIED",
  "GO!",
]
forbid = [
  "PUBK_NO_SIGNATURE",
  "PUBK_ALGO_UNSUPPORTED",
  "PUBK_UNAUTHORIZED",
  "PUBK_SLOT_RESERVED",
  "PUBK_SEL_AMBIGUOUS",
  "PUBK_SLOT_UNPROVISIONED",
  "PUBK_OTP_EMPTY",
  "RSA_PKCS1_FAIL",
  "RSA_EXEC_FAIL",
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=",
  "SBOOT_OFF",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "MANIFEST_ERR=0x00030022" = 1, "PUBK_SEL=0x00000000" = 1, "PUBK_AUTHORIZED" = 1, "RSA_EXEC" = 1, "RSA_VERIFY_OK" = 1, "MANIFEST_OK" = 1, "PAYLOAD_OK" = 1 }
expect_status = ["INFO 0x004c", "WARN 0x000a", "INFO 0x004c", "INFO 0x0053", "INFO 0x0055"]
forbid_status = ["ERROR 0x000a", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_manifest", range = [0x1000, 0x2000], min = 1 },
  { name = "primary_payload", range = [0x2000, 0x40000], exact = 0 },
  { name = "slot_gap", range = [0x40000, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
  { name = "backup_payload", range = [0x42000, 0x80000], min = 1 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_manifest", "backup_manifest", "backup_payload"]
markers = [
  "oca_check_crypto_field_sizes refuses a type other than RSA-3072 or ECDSA-P256 before key selection, so the single PUBK_SEL= and PUBK_AUTHORIZED are the backup's.",
  "MANIFEST_ERR=0x00030022 is shared by every crypto field-size refusal; the type is pinned by the image field check, and PUBK_NO_SIGNATURE forbidden shows plat_is_key_authorized never saw the type-0 key.",
  "The slot is re-signed after the type write, so a ROM that skipped the type check would verify and boot the primary.",
  "One value (0, as in DV); ECDSA-P256 (5) and other undefined types are not swept.",
]

[[testcase]]
name = "sep_firmware_backup_invalid_signature_type_test"
family = "signature"
classification = "vp-equivalent"
image = "backup_invalid_signature_type"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "FAILED"
pytest_markers = ["needs_debug"]
image_asserts = [
  { range = [0x1000, 0x1004], all = 0x99 },
  { field = { name = "OFF_SIGNATURE_TYPE_CLASSIC", slot = "backup", size = 1, value = 0 } },
  { range = [0x4182c, 0x4182d], differs_from = "signed" },
  { range = [0x0, 0x1000], same_as = "signed" },
  { range = [0x1004, 0x4182c], same_as = "signed" },
  { range = [0x4182d, 0x41c64], same_as = "signed" },
  { range = [0x41de4, 0x41e64], same_as = "signed" },
  { range = [0x41e84, "end"], same_as = "signed" },
]
expect = [
  "LC=PROD",
  "MANIFEST_PRIMARY",
  "MANIFEST_SRC=0x00001000",
  "MANIFEST_ERR=0x00030002",
  "MANIFEST_BACKUP",
  "MANIFEST_SRC=0x00041000",
  "OCA_BODY=0x00001000",
  "MANIFEST_ERR=0x00030022",
  "MANIFEST_ALL_FAILED",
  "MANIFEST_BOOT_FAIL=0x00030022",
  "[VP] SIMULATION OF THE TEST FAILED",
]
forbid = [
  "PUBK_SEL=",
  "PUBK_AUTHORIZED",
  "PUBK_NO_SIGNATURE",
  "PUBK_ALGO_UNSUPPORTED",
  "PUBK_UNAUTHORIZED",
  "PUBK_REVOKE=",
  "RSA_EXEC",
  "RSA_PKCS1_FAIL",
  "RSA_VERIFY_OK",
  "MANIFEST_OK",
  "PAYLOAD_OK",
  "BL1_COPIED",
  "BL1_JUMP=",
  "PRE_JUMP",
  "GO!",
  "SBOOT_OFF",
]
expect_counts = { "MANIFEST_PRIMARY" = 1, "MANIFEST_BACKUP" = 1, "OCA_BODY=0x00001000" = 1, "MANIFEST_ERR=0x00030022" = 1, "MANIFEST_ALL_FAILED" = 1 }
terminal_token = "MANIFEST_BOOT_FAIL=0x00030022"
expect_status = ["WARN 0x0006", "INFO 0x004c", "WARN 0x000a", "ERROR 0x000a", "ERROR 0x0213"]
spi_reads = [
  { name = "descriptor", range = [0x0, 0x1000], exact = 0 },
  { name = "primary_peek", range = [0x1000, 0x1014], min = 1 },
  { name = "primary_rest", range = [0x1014, 0x41000], exact = 0 },
  { name = "backup_manifest", range = [0x41000, 0x42000], min = 1 },
  { name = "backup_payload", range = [0x42000, 0x80000], exact = 0 },
  { name = "beyond", range = [0x80000, 0x1000000], exact = 0 },
]
spi_read_order = ["primary_peek", "backup_manifest"]
markers = [
  "The primary magic is broken, as in DV, so the failover trigger is refused at the peek and cannot mask the backup's verdict.",
  "PUBK_SEL= forbidden outright shows the type check precedes key selection on the only slot that reaches validation.",
  "The backup is re-signed after the type write, so a ROM that skipped the type check would boot it.",
  "The terminal halt is asserted as console silence after MANIFEST_BOOT_FAIL= and the FAILED verdict, not as a PC in the WFI loop.",
]

