[[testcase]]
name = "sep_scratch_7_test"
family = "warm_reset"
classification = "partial"
image = "signed"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 90
expect_verdict = "none"
pytest_markers = ["needs_debug"]
preloaded_test_programs = ["warm_jump"]
init_writes = [{ address = 0x10802038, value = 0xC0030000 }]
expect = ["WARM_JUMP_OK"]
forbid = ["SMC_MEM_CHK", "ROM", "COLD", "MEM_INIT_OK", "TRAP H0"]
expect_counts = { "WARM_JUMP_OK" = 1 }
terminal_token = "WARM_JUMP_OK"
expect_status = ["INFO 0x0068"]
forbid_status = ["ERROR 0x0069", "DEBUG 0x0056"]
markers = [
  "Does not model a real watchdog warm reset or reset sequencing; cold scratch 7 is deposited before the first instruction.",
  "INFO 0x0068 is the ROM's own warm-dispatch announcement; WARM_JUMP_OK proves the handler in ICCM then ran.",
  "DEBUG 0x0056 is written only by cold_boot, so forbidding it stands in for the DV check that the -1 poison never appears.",
  "Not covered: the zero write to cold scratch 7 before the jump; the VP does not report scratch writes.",
  "The handler sits at 0xC0030000 and prints, where DV places a silent j . at 0xC0000100; both are inside the ICCM accept window.",
]

[[testcase]]
name = "sep_scratch_7_test__ctrl_no_pointer"
family = "warm_reset"
classification = "partial"
image = "signed"
base_ini = "secure"
boot = "primary"
observation = "complete"
timeout = 180
expect_verdict = "PASSED"
pytest_markers = ["needs_debug"]
preloaded_test_programs = ["warm_jump"]
expect = ["COLD", "MEM_INIT_OK", "BOOT_SPI", "MANIFEST_OK", "PAYLOAD_OK", "BL1_COPIED", "GO!"]
forbid = ["WARM_JUMP_OK", "TRAP H0", "MANIFEST_ERR=", "MANIFEST_BACKUP"]
expect_status = ["DEBUG 0x0044", "DEBUG 0x0056", "DEBUG 0x0057", "INFO 0x0055"]
forbid_status = ["INFO 0x0068", "ERROR 0x0069", "ERROR 0x0213"]
markers = [
  "Negative control for sep_scratch_7_test: the same handler sits in ICCM, but cold scratch 7 stays 0, so vector.S takes the beqz to cold_boot.",
  "DEBUG 0x0044 is the first status cold_boot writes and INFO 0x0068 is the warm-dispatch announcement, so the status pair names the branch taken.",
  "No standalone coverage beyond that control; the ICCM clear and BL1 copy leave 0xC0030000 untouched.",
]

