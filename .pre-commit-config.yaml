minimum_pre_commit_version: "4.5.1"

exclude: >-
  (?x)^(
    vendor/|
    nonfree/|
    .*\/regs\/gen\/|
    .*\/build(_ot|_ot_pio)?\/
  )

repos:
  - repo: local
    hooks:
      - id: git-diff-check
        name: Check staged whitespace and conflict markers
        entry: git diff --cached --check --
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: Lint Python with Ruff
        entry: uv --directory . run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: Check Python formatting with Ruff
        entry: uv --directory . run --locked ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: clang-format
        name: Check C/C++ formatting with clang-format
        entry: uv --directory . run --locked clang-format -style=file --dry-run --Werror
        language: system
        files: '\.(c|h|cpp)$'

      - id: tclfmt
        name: Check Tcl formatting with tclfmt
        entry: uv --directory . run --locked tclfmt --check --spaces-in-braces
        language: system
        files: '\.tcl$'

      - id: tclint
        name: Lint Tcl with tclint
        entry: uv --directory . run --locked tclint --no-check-style --style-line-length 100
        language: system
        files: '\.tcl$'
