minimum_pre_commit_version: "4.5.1"

exclude: >-
  (?x)^(
    vendor/|
    nonfree/|
    .*\/regs\/gen\/|
    .*\/build(_ot|_ot_pio)?\/
  )

repos:
  - repo: local
    hooks:
      - id: git-diff-check
        name: Check staged whitespace and conflict markers
        entry: git diff --cached --check --
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: Lint Python with Ruff
        entry: uv --directory . run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: Check Python formatting with Ruff
        entry: uv --directory . run --locked ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: clang-format
        name: Check C/C++ formatting with clang-format
        entry: uv --directory . run --locked clang-format -style=file --dry-run --Werror
        language: system
        files: '\.(c|h|cpp)$'

      - id: tclfmt
        name: Check Tcl formatting with tclfmt
        entry: uv --directory . run --locked tclfmt --check --spaces-in-braces
        language: system
        files: '\.tcl$'

      - id: tclint
        name: Lint Tcl with tclint
        entry: uv --directory . run --locked tclint --no-check-style --style-line-length 100
        language: system
        files: '\.tcl$'

      - id: codespell
        name: Check spelling with codespell
        # No filenames appended (see below): codespell's skip= glob patterns in
        # pyproject.toml ([tool.codespell]) only prune directories it walks
        # itself. Handed an explicit file argument -- which is what pre-commit
        # would otherwise pass -- it checks that file regardless of skip=, so
        # a skip-listed path (e.g. the vendored Metal HAL headers) would still
        # get flagged the moment it's staged. Scanning from repo root every
        # time keeps this consistent with `make ocah-lint-spelling`.
        entry: uv --directory . run --locked codespell .
        language: system
        pass_filenames: false

      - id: yamllint
        name: Lint YAML with yamllint
        entry: uv --directory . run --locked yamllint -c .yamllint.yml
        language: system
        files: '\.ya?ml$'

      - id: tomllint
        name: Check TOML syntax with tomllint
        entry: uv --directory . run --locked tomllint
        language: system
        files: '\.toml$'
        exclude: '^hw/ip/scrambler/dv/lint/scrambler\.toml$'

      - id: shellcheck
        name: Lint shell scripts with shellcheck
        entry: uv --directory . run --locked shellcheck --severity=warning
        language: system
        files: '\.sh$'

      - id: shfmt
        name: Check shell formatting with shfmt
        entry: uv --directory . run --locked shfmt -i 2 -d
        language: system
        files: '\.sh$'
