<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="671" viewBox="0 0 1040 671" role="img" aria-labelledby="title desc">
<title id="title">SEP cryptographic subsystem resets</title>
<desc id="desc">Resets inside u_sep_crypto. rst_ni resets the interconnect, life cycle controller, eFuse shim mux, alert receivers and encoders. In u_sep_trng, rst_ni is the power-on reset of a 2-flop synchroniser that samples the inverted gated TRNG reset and drives trng_reset_active, which clears both EDN AXIS adapters and, as trng_entropy_clear_o, the entropy pool. The adapters take rst_ni, and the crypto adapter's endpoint resets come from the gated OTBN, AES and KMAC resets. The gated resets reset OTBN, AES, HMAC, KMAC and Adams Bridge. In the Key Manager reset conditioner, sep_reset_n feeds u_cold_rst_sync for the cold domain; a NAND of the gated Key Manager reset and soft_rst_n triggers a hold counter, reset by the cold output, that holds the warm domain in reset for at least 10 cycles.</desc>
