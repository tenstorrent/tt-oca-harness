<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">Wire-OR chiplet connections</title>
<desc id="desc">A package holding three chiplets. In each chiplet, CLAs connect through the internal CTPs of the cross_trigger_network to the CTM, and the CTM connects to an external CTP by its CT_Src and CT_Dst signals. Each external CTP is in wire-OR mode, and the CT_Req_out pads of Chiplet 0, Chiplet 1 and Chiplet 2 join on one shared open-drain wire, which also reaches a package pin.</desc>
