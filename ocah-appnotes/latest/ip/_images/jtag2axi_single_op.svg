<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title desc">
<title id="title">AXI_SINGLE_OP (64-bit data, 51-bit address)</title>
<desc id="desc">127 scan bits. address: bits 126:76; data: bits 75:12; wstrb: bits 11:4; size: bits 3:2; op: bits 1:0. Fields are not drawn to scale.</desc>
<rect width="900" height="190" fill="white"/>
<text x="20" y="27" font-family="sans-serif" font-size="19" fill="#173b2c">AXI_SINGLE_OP (64-bit data, 51-bit address) — 127 bits</text>
<rect x="20" y="67" width="260" height="66" fill="#e5f0ea" stroke="#49685a"/>
<text x="150.0" y="55" text-anchor="middle" font-family="monospace" font-size="16">126:76</text>
<text x="150.0" y="105" text-anchor="middle" font-family="monospace" font-size="17">address</text>
<rect x="280" y="67" width="280" height="66" fill="#e5f0ea" stroke="#49685a"/>
<text x="420.0" y="55" text-anchor="middle" font-family="monospace" font-size="16">75:12</text>
<text x="420.0" y="105" text-anchor="middle" font-family="monospace" font-size="17">data</text>
<rect x="560" y="67" width="130" height="66" fill="#e5f0ea" stroke="#49685a"/>
<text x="625.0" y="55" text-anchor="middle" font-family="monospace" font-size="16">11:4</text>
<text x="625.0" y="105" text-anchor="middle" font-family="monospace" font-size="17">wstrb</text>
<rect x="690" y="67" width="100" height="66" fill="#e5f0ea" stroke="#49685a"/>
<text x="740.0" y="55" text-anchor="middle" font-family="monospace" font-size="16">3:2</text>
<text x="740.0" y="105" text-anchor="middle" font-family="monospace" font-size="17">size</text>
<rect x="790" y="67" width="90" height="66" fill="#e5f0ea" stroke="#49685a"/>
<text x="835.0" y="55" text-anchor="middle" font-family="monospace" font-size="16">1:0</text>
<text x="835.0" y="105" text-anchor="middle" font-family="monospace" font-size="17">op</text>
<text x="20" y="166" font-family="sans-serif" font-size="15" fill="#555">MSB at left; bit 0 shifts out first. Field widths are not to scale.</text>
</svg>
