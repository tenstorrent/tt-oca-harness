<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="606" viewBox="0 0 1040 606" role="img" aria-labelledby="title desc">
<title id="title">AVSBus controller</title>
<desc id="desc">The avsbus_controller receives AXI-Lite register accesses, which u_axi_lite_to_apb converts to APB for the register file. Interrupt logic in the register domain drives interrupt_o. Writes to AVS_CMD enter the command FIFO, an avsbus_async_fifo of COMMAND_FIFO_DEPTH entries, which crosses from the clk_reg_i domain to the avs_clk domain; the protocol FSM pops commands, serializes each master subframe onto avs_mdata_o with a CRC-3 from the generate instance, deserializes the reply from avs_sdata_i, checks it with the check instance and pushes it into the readback FIFO, which crosses back to the register domain for AVS_READBACK. Configuration and status bits cross between the domains through prim_sync3 and handshake synchronizers. The AVS clock generation selects and divides clk_reg_i or clk_ref_i, or passes clk_test_i in test mode, to make avs_clk, which clocks the AVS domain and passes through the clock gate u_avs_bus_clkgate, enabled by the FSM, to avs_clock_o.</desc>
