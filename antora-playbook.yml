#
# Combined multi-book Antora playbook. Add one content.sources entry per book here;
# cross-book navigation (the component/version switcher panel) follows
# automatically once a book has a valid antora.yml -- no other changes
# needed to add a book to the switcher.

site:
  title: Open Chiplet Atlas Harness (OCAH) Documentation
  url: /
  start_page: ocah-docs::index.adoc
content:
  sources:
    - url: .
      branches: HEAD
      start_path: doc/trm
      edit_url: false
    - url: .
      branches: HEAD
      start_path: doc/integrator
      edit_url: false
    - url: .
      branches: HEAD
      start_path: doc/programmer
      edit_url: false
    - url: .
      branches: HEAD
      start_path: doc/appnotes
      edit_url: false
    - url: .
      branches: HEAD
      start_path: doc/contributing
      edit_url: false
ui:
  bundle:
    # Pinned 2026-07-24 to the latest antora-ui-default commit at the time
    # (0e38223a) -- antora-ui-default has no tags/releases, so a commit SHA
    # is the pin mechanism here rather than a version number. To bump
    # later: find the new latest commit on
    # https://gitlab.com/antora/antora-ui-default and swap the SHA below.
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/0e38223adfd81eb74d4b1779e158f8ad05ff8923/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./doc/ui-supplemental
antora:
  extensions:
    - '@antora/lunr-extension'
output:
  dir: ./doc/_build/html_antora
