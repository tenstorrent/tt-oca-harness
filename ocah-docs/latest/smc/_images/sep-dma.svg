<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="596" viewBox="0 0 1040 596" role="img" aria-labelledby="title desc">
<title id="title">SEP secure DMA</title>
<desc id="desc">sep_dma_wrap around the OpenTitan secure_dma core. The register path from the local crossbar dma_csr target (AXI4, 64-bit data) is downsized to 32 bits, rebased by subtracting SEP_TOP_SECURE_DMA_BASE_ADDR, converted to AXI-Lite and then to TL-UL for the secure_dma registers. Inside secure_dma the controller runs the transfer, feeds the inline SHA2 engine (SHA-256, SHA-384 or SHA-512) and issues reads and writes on its host TL-UL port; the CTN and SYS ports are tied off. The host path is converted from TL-UL to AXI-Lite, with a command integrity check, to AXI4 with AxCACHE 0, upsized to 64 bits and passed through the local alias remap to the dma initiator of the local crossbar. The two TL-UL bridges latch their faults on dma_reg_bus_err_o and dma_host_intg_err_o. The core raises the done, chunk-done and error interrupts, takes the SPI trigger on lsio_trigger bit 0, and its alerts end in local alert receivers whose OR is dma_alert_o.</desc>
