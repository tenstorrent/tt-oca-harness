<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="262" viewBox="0 0 1040 262" role="img" aria-labelledby="title desc">
<title id="title">Point-to-point chiplet connections</title>
<desc id="desc">Two chiplets, each with CLAs connected through the internal CTPs of the cross_trigger_network to the CTM, and the CTM connected to an external CTP by CT_Src and CT_Dst. The two external CTPs are in point-to-point mode and are cross-coupled by four wires: Chiplet 0 CT_Req_out to Chiplet 1 CT_Req_in, Chiplet 1 CT_Ack_out to Chiplet 0 CT_Ack_in, Chiplet 1 CT_Req_out to Chiplet 0 CT_Req_in, and Chiplet 0 CT_Ack_out to Chiplet 1 CT_Ack_in.</desc>
<defs>
