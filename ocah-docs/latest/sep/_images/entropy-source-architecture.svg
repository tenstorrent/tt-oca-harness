<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="652" viewBox="0 0 1040 652" role="img" aria-labelledby="title desc">
<title id="title">Entropy source microarchitecture</title>
<desc id="desc">Entropy source microarchitecture. The sample-clock block drives twelve generator lanes. Each lane has a noise source whose bits pass a 29-stage decorrelator; an 8-bit health test on the decorrelated byte drives an auto-tune FSM that can detune the noise source. The twelve bytes enter the BIW extractor of four gf_muladd instances, which produces a 32-bit stream. A 32-bit health test watches that stream and reports to the main state machine, which opens the boot gate once a boot health-test window passes. The gated stream passes the optional SHA-256 whitener and an output select, which can instead take the uncompressed decorrelator bytes, into a 64-entry main FIFO; each word written to the FIFO also leaves as entropy_stream_data_o towards the DRBG. Observe FIFOs capture raw noise bits from one selected lane and the post-BIW stream. The register block, reached over AXI4-Lite, configures every stage, reads the three FIFOs, drives irq_o and selects the signal that the debug monitor routes to signal_monitor_o.</desc>
