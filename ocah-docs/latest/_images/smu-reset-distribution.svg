<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1220" viewBox="0 0 1050 1220" role="img" aria-labelledby="title desc"> <!-- SPDX-License-Identifier: CC-BY-4.0 --> <!-- SPDX-FileCopyrightText: 2026 Tenstorrent USA, Inc. --> <title id="title">SMU reset sources and consumers</title><desc id="desc">Reset inputs, SMC-generated resets and JTAG resets are separated. Active-low resets use ni, no or trst_n suffixes; SMC CPU JTAG reset is inverted.</desc> <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#405469"/></marker></defs> <rect width="1050" height="1220" fill="white"/> <g font-family="DejaVu Sans, sans-serif" fill="#182c40"> <text x="24" y="34" font-size="22" font-weight="700" text-anchor="start"> <tspan x="24" dy="0">SMU reset sources and consumers</tspan> </text> <rect x="24" y="54" width="185" height="33" rx="6" fill="#e8f3ff" stroke="#42759b" stroke-width="1.5"/> <text x="116.5" y="75.6" font-size="15" font-weight="400" text-anchor="middle"> <tspan x="116.5" dy="0">Boundary port</tspan> </text> <rect x="230" y="54" width="210" height="33" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="335.0" y="75.6" font-size="15" font-weight="400" text-anchor="middle"> <tspan x="335.0" dy="0">SMU RTL instance</tspan> </text> <rect x="461" y="54" width="225" height="33" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="573.5" y="75.6" font-size="15" font-weight="400" text-anchor="middle"> <tspan x="573.5" dy="0">Generated signal</tspan> </text> <text x="24" y="115" font-size="15" font-weight="400" text-anchor="start"> <tspan x="24" dy="0">Arrows show direction. Consumer lists show fan-out; repeated names refer to the same instance.</tspan> </text> <text x="24" y="155" font-size="16" font-weight="700" text-anchor="start"> <tspan x="24" dy="0">BOUNDARY INPUTS</tspan> </text> <rect x="24" y="173" width="439" height="61" rx="6" fill="#e8f3ff" stroke="#42759b" stroke-width="1.5"/> <text x="243.5" y="197.805" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="243.5" dy="0">powergood_i, rst_cold_ni</tspan> <tspan x="243.5" dy="22.950000000000003">rst_cool_n_from_pin_i</tspan> </text> <path d="M463 203 L497 203" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="504" y="173" width="522" height="61" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="765.0" y="209.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="765.0" dy="0">u_smc (power and reset sequencing)</tspan> </text> <rect x="24" y="248" width="439" height="61" rx="6" fill="#e8f3ff" stroke="#42759b" stroke-width="1.5"/> <text x="243.5" y="284.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="243.5" dy="0">rst_telemetry_ni</tspan> </text> <path d="M463 278 L497 278" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="504" y="248" width="522" height="61" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="765.0" y="284.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="765.0" dy="0">u_smc (telemetry domain)</tspan> </text> <rect x="24" y="323" width="439" height="61" rx="6" fill="#e8f3ff" stroke="#42759b" stroke-width="1.5"/> <text x="243.5" y="359.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="243.5" dy="0">scan_rst_ni</tspan> </text> <path d="M463 353 L497 353" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="504" y="323" width="522" height="61" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="765.0" y="359.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="765.0" dy="0">u_dtp, u_sep, u_smc (scan reset)</tspan> </text> <rect x="24" y="398" width="439" height="61" rx="6" fill="#e8f3ff" stroke="#42759b" stroke-width="1.5"/> <text x="243.5" y="434.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="243.5" dy="0">jtag_ptap_client_tap_ctrl_i.trst_n</tspan> </text> <path d="M463 428 L497 428" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="504" y="398" width="522" height="61" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="765.0" y="434.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="765.0" dy="0">u_dtp (primary TAP reset)</tspan> </text> <text x="24" y="505" font-size="16" font-weight="700" text-anchor="start"> <tspan x="24" dy="0">SMC OUTPUTS</tspan> </text> <rect x="24" y="526" width="439" height="77" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="243.5" y="570.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="243.5" dy="0">powergood_stable</tspan> </text> <path d="M463 564 L497 564" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="504" y="526" width="522" height="77" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="765.0" y="558.805" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="765.0" dy="0">u_dtp.pwr_on_rst_ni</tspan> <tspan x="765.0" dy="22.950000000000003">u_sep.dbg_rstb_i</tspan> </text> <rect x="24" y="618" width="439" height="77" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="243.5" y="662.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="243.5" dy="0">rst_primary_smc_clk_no</tspan> </text> <path d="M463 656 L497 656" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="504" y="618" width="522" height="77" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="765.0" y="650.805" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="765.0" dy="0">u_dtp, u_sep, u_smu_axi_xbar</tspan> <tspan x="765.0" dy="22.950000000000003">u_iw_conv_sep, u_iw_conv_smc; boundary output</tspan> </text> <rect x="24" y="710" width="439" height="77" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="243.5" y="754.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="243.5" dy="0">rst_wdt_n</tspan> </text> <path d="M463 748 L497 748" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="504" y="710" width="522" height="77" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="765.0" y="754.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="765.0" dy="0">u_sep.wdt_rst_ni</tspan> </text> <rect x="24" y="802" width="439" height="77" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="243.5" y="823.3299999999999" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="243.5" dy="0">rst_cold_stable_ref_clk_no</tspan> <tspan x="243.5" dy="22.950000000000003">rst_primary_ref_clk_no</tspan> <tspan x="243.5" dy="22.950000000000003">rst_primary_periph_clk_no</tspan> </text> <path d="M463 840 L497 840" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="504" y="802" width="522" height="77" rx="6" fill="#e8f3ff" stroke="#42759b" stroke-width="1.5"/> <text x="765.0" y="834.805" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="765.0" dy="0">Boundary reset outputs</tspan> <tspan x="765.0" dy="22.950000000000003">for reference / peripheral clock domains</tspan> </text> <text x="24" y="923" font-size="16" font-weight="700" text-anchor="start"> <tspan x="24" dy="0">DTP JTAG OUTPUTS</tspan> </text> <rect x="24" y="942" width="439" height="59" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="243.5" y="977.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="243.5" dy="0">dtp_sep_stap_tap_ctrl.trst_n</tspan> </text> <path d="M463 971 L497 971" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="504" y="942" width="522" height="59" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="765.0" y="977.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="765.0" dy="0">u_sep.jtag_trst_ni</tspan> </text> <rect x="24" y="1014" width="439" height="59" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="243.5" y="1049.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="243.5" dy="0">dtp_smc_stap_tap_ctrl.trst_n</tspan> </text> <path d="M463 1043 L497 1043" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="504" y="1014" width="522" height="59" rx="6" fill="#f1f3f5" stroke="#687889" stroke-width="1.5"/> <text x="765.0" y="1049.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="765.0" dy="0">Invert → u_smc.smc_cpu_jtag_reset_i</tspan> </text> <rect x="24" y="1086" width="439" height="59" rx="6" fill="#eaf5ed" stroke="#548265" stroke-width="1.5"/> <text x="243.5" y="1121.28" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="243.5" dy="0">Host scan-chain resets</tspan> </text> <path d="M463 1115 L497 1115" fill="none" stroke="#405469" stroke-width="2" marker-end="url(#arrow)"/> <rect x="504" y="1086" width="522" height="59" rx="6" fill="#e8f3ff" stroke="#42759b" stroke-width="1.5"/> <text x="765.0" y="1109.805" font-size="17" font-weight="400" text-anchor="middle"> <tspan x="765.0" dy="0">I/O / extra TAP TRST_n; host TRST_n</tspan> <tspan x="765.0" dy="22.950000000000003">Host RST_n and CHRST_n reset controls</tspan> </text> <text x="24" y="1177" font-size="16" font-weight="400" text-anchor="start"> <tspan x="24" dy="0">Active-low resets use _ni, _no or trst_n suffixes. The SMC CPU JTAG reset is active-high.</tspan> <tspan x="24" dy="21.6">SEP-related paths exist when SEP = 1. The diagram shows SMU distribution, not internal reset logic.</tspan> </text> </g></svg> 