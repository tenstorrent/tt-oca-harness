<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="974" viewBox="0 0 1040 974" role="img" aria-labelledby="title desc">
<title id="title">DTP reset distribution</title>
<desc id="desc">Reset distribution in the DTP. rst_n_i, the system reset (rst_primary_smc_clk_no in the SMU), resets all of u_cross_trigger_network and the AXI side of the three JTAG2AXI bridges. pwr_on_rst_ni (powergood_stable in the SMU) resets the 11 dbg_disable_i synchronisers to 1, debug disabled, and is ANDed in the gate u_trst_n_and with the TRST pin, jtag_ptap_client_tap_ctrl_i.trst_n, to form the combined TRST. The combined TRST resets u_jtag_tap_ctrlr, including its Test-Logic-Reset flop, u_jtag_tmp and the TDO retiming flop, the hold flops of the 3DCR and IC_RESET TDRs and the STAPs, and leaves unchanged on the host TAP control of each STAP. In u_jtag_tap_ctrlr an inverter on the Test-Logic-Reset flop gives the scan reset rst_n, low in Test-Logic-Reset, and an OR gate with the TMP persistence mode from u_jtag_tmp gives the scan channel reset chrst_n, which persistence holds released. rst_n resets the instruction register, the BYPASS, IDCODE, CAPS and DEBUG_CONTROL TDRs, the TCK side of the JTAG2AXI bridges, the STAPs and the SIBs, and leaves on the host scan control of the boundary-scan, extended STAP, DFT and DFD ports. In u_jtag_3dcr_reg the scan register reset is the combined TRST ANDed with rst_n ORed with the hold flop, so the hold bit blocks rst_n. In u_jtag_ic_reset_reg the scan register reset is rst_n ORed with the inverted reset_hold flop, so a clear reset_hold blocks rst_n. chrst_n is used only on the host scan ports. scan_rst_ni is not connected inside the DTP.</desc>
